<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>CARDS</title>
<style>
@font-face { font-family: 'GmkC'; font-weight: 300; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 400; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 500; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 600; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 700; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 800; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2'); }
:root{
  --bg:#fcfbfa; --navy:#2a558c; --navy-d:#1e406d; --lb:#e8f1f9; --grey:#7c90a6; --line:#333;
  --bd:#e2e5ea; --soft:#f4f5f7; --txt:#23272e; --sub:#6b7480;
  --red:#c25a55; --red-bg:#fbeceb; --green:#3f8a63; --green-bg:#e8f4ed;
  --lv0:#e1e4e8; --lv1:#efb9b4; --lv2:#9fc0e3; --lv3:#2a558c;
  --tag-bg:#edebf1; --tag-tx:#5f5b69;
}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{display:none!important} *{scrollbar-width:none!important}
html,body{background:transparent}
body{font-family:'GmkC',sans-serif;font-weight:400;color:var(--txt);font-size:14px;line-height:1.5;padding:18px 16px 40px;position:relative;-webkit-tap-highlight-color:transparent}
button,input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}
.hidden{display:none!important}

/* ---------- top ---------- */
.top{display:flex;align-items:center;gap:10px;max-width:1150px;margin:0 auto 16px;flex-wrap:wrap}
.brand{font-family:'Montserrat','GmkC',sans-serif;font-weight:800;font-size:1.35rem;color:var(--navy);letter-spacing:.04em}
.sync{font-size:.72rem;color:var(--grey)}
.fic{margin-right:6px;font-size:.95em}
.emgrid{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.em{font-size:1.3rem;height:40px;border-radius:8px;border:1.5px solid transparent;background:none}
.em:hover{background:var(--soft)}
.em.on{border-color:var(--navy);background:var(--lb)}
.em.none{grid-column:span 2;font-size:.78rem;color:var(--grey)}
.subjs{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.subj{font-size:.85rem;font-weight:700;padding:5px 14px;border-radius:20px;color:var(--grey);cursor:pointer;user-select:none;border:1px solid transparent}
.subj.on{color:var(--navy);border-color:var(--line);background:#fff}
.subj.add{font-weight:500;padding:5px 9px}
.sechead .car{display:inline-block;width:12px;font-size:.6rem;transition:.15s}
.sechead .car.open{transform:rotate(90deg)}
.rs{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:7px;cursor:pointer;font-size:.85rem}
.rs:hover{background:var(--soft)}
.rs .md{font-size:.72rem;font-weight:600;color:var(--navy);border:1px solid var(--navy);border-radius:10px;padding:0 6px;white-space:nowrap;margin-right:3px}
.rs .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rs .pg{font-size:.72rem;color:var(--grey);white-space:nowrap}
.rs .x{color:var(--grey);font-size:.72rem;padding:0 3px;visibility:hidden}
.rs:hover .x{visibility:visible}
.rs .x:hover{color:var(--red)}
@media (pointer:coarse){.rs .x{visibility:visible}}
.rbtn{border:1.5px solid var(--navy);background:#fff;color:var(--navy);border-radius:18px;padding:5px 10px 5px 14px;font-weight:500;font-size:.85rem;white-space:nowrap;animation:glow 1.8s ease-in-out infinite;display:inline-flex;align-items:center;gap:6px}
.rbtn .x{color:var(--grey);font-size:.72rem;padding:0 2px}
.rbtn .x:hover{color:var(--red)}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(42,85,140,0),0 0 6px rgba(42,85,140,.18)}50%{box-shadow:0 0 0 4px rgba(42,85,140,.12),0 0 16px rgba(42,85,140,.45)}}
.grp-h{display:flex;align-items:center;justify-content:space-between;font-size:.72rem;font-weight:700;color:var(--grey);padding:10px 8px 4px;letter-spacing:.04em}
.ochip{font-size:.7rem;color:var(--grey);border:1px solid var(--bd);border-radius:10px;padding:0 7px;white-space:nowrap;cursor:pointer}
.ochip.topic{color:var(--navy);border-color:#c8d7e8;background:var(--lb)}
.selbox{width:18px;height:18px;border:1.5px solid #b9c2cd;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;flex:0 0 18px;cursor:pointer}
.selbox.on{background:var(--navy);border-color:var(--navy)}
.selbar{position:sticky;top:8px;z-index:20;display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1.5px solid var(--navy);border-radius:12px;padding:8px 12px;margin-bottom:12px;box-shadow:0 6px 18px rgba(30,50,80,.1)}
.selbar b{color:var(--navy);font-size:.85rem}
.top .sp{flex:1}
.btn{border:1px solid var(--bd);background:#fff;border-radius:18px;padding:6px 14px;font-weight:500;font-size:.85rem;color:var(--navy);transition:.15s;white-space:nowrap}
.btn:hover{border-color:var(--navy)}
.btn.pri{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.pri:hover{background:var(--navy-d)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--sub)}
.btn.danger{color:var(--red)}
.btn.sm{padding:3px 10px;font-size:.78rem}
.ibtn{width:26px;height:26px;border-radius:6px;color:var(--sub);display:inline-flex;align-items:center;justify-content:center;font-size:.95rem}
.ibtn:hover{background:var(--soft);color:var(--navy)}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:250px 1fr;gap:18px;max-width:1150px;margin:0 auto;align-items:start}
.side-col{position:sticky;top:12px;display:flex;flex-direction:column;gap:12px}
.side{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 8px}
.side-h{display:flex;align-items:center;justify-content:space-between;font-size:.75rem;font-weight:700;color:var(--grey);letter-spacing:.06em;padding:4px 8px 6px}
.side-sec+.side-sec{margin-top:14px;border-top:1px solid var(--soft);padding-top:10px}
.fnode{display:flex;align-items:center;gap:4px;padding:5px 8px;border-radius:7px;cursor:pointer;font-size:.88rem;user-select:none;position:relative}
.fnode:hover{background:var(--soft)}
.fnode.on{background:var(--lb);color:var(--navy);font-weight:700}
.fnode .car{width:14px;flex:0 0 14px;color:var(--grey);font-size:.65rem;text-align:center;transition:.15s}
.fnode .car.open{transform:rotate(90deg)}
.fnode .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fnode .ct{font-size:.72rem;color:var(--grey);font-weight:500}
.fnode.drop{outline:2px dashed var(--navy);outline-offset:-2px}
.taglist{display:flex;flex-wrap:wrap;gap:5px;padding:2px 6px}
.tagnav{font-size:.78rem;padding:3px 9px;border-radius:12px;background:var(--tag-bg);color:var(--tag-tx);cursor:pointer;user-select:none}
.tagnav.on{background:var(--navy);color:#fff}
.tagnav .n{opacity:.6;margin-left:3px;font-size:.7rem}
.side-toggle{display:none}

/* ---------- main ---------- */
.mhead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.mtitle{font-size:1.4rem;font-weight:600;color:var(--navy);line-height:1.2;margin-right:6px}
.crumb{font-size:.75rem;color:var(--grey);margin-bottom:3px}
.crumb span{cursor:pointer}.crumb span:hover{text-decoration:underline}
.mstats{display:flex;align-items:center;gap:10px;margin:10px 0 14px;flex-wrap:wrap}
.pbar{display:flex;height:8px;border-radius:5px;overflow:hidden;background:var(--lv0);flex:1;min-width:160px;max-width:420px}
.pbar i{display:block;height:100%}
.legend{display:flex;gap:10px;font-size:.72rem;color:var(--sub)}
.legend b{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;vertical-align:0}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.search{border:1px solid var(--bd);border-radius:18px;padding:6px 12px;background:#fff;outline:none;width:200px;font-size:.85rem}
.search:focus{border-color:var(--navy)}
.subchips{display:contents}
.subchip{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:5px 10px;font-size:.82rem;cursor:pointer}
.subchip:hover{border-color:var(--navy)}
.sechead{font-size:.8rem;font-weight:700;color:var(--grey);margin:18px 0 8px;display:flex;align-items:center;gap:6px;cursor:pointer}
.sechead:hover{color:var(--navy)}
.empty{color:var(--grey);font-size:.88rem;padding:36px 0;text-align:center}

.card{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:12px 16px;margin-bottom:10px;transition:.15s;display:grid;grid-template-columns:minmax(0,30%) minmax(0,1fr);column-gap:18px;position:relative}
.card:hover{border-color:#c9d3df}
.card.sel{border-color:var(--navy);box-shadow:0 0 0 1px var(--navy)}
.chead{display:flex;align-items:flex-start;align-content:flex-start;gap:6px 8px;flex-wrap:wrap;padding-top:5px}
.chead>.ibtn{position:absolute;top:8px;right:8px}
.chead>.sp{display:none}
.ctitle{font-weight:400;font-size:1rem;color:var(--txt);cursor:pointer;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere;flex:0 1 auto;min-width:0}
.ctitle:hover{color:var(--navy)}
.cpath{font-size:.72rem;color:var(--grey)}
.chead .sp{flex:1}
.cbody{display:flex;flex-direction:column;gap:2px;border-left:1px solid var(--bd);padding-left:16px}
.irow{display:grid;grid-template-columns:10px auto 1fr auto 20px;gap:8px;align-items:baseline;padding:5px 2px;border-top:1px dashed var(--soft)}
.irow:first-child{border-top:none}
.irow.nolab{grid-template-columns:10px 1fr auto 20px}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;transform:translateY(-1px)}
.lv0{background:var(--lv0)}.lv1{background:var(--lv1)}.lv2{background:var(--lv2)}.lv3{background:var(--lv3)}
.ilab{font-size:.88rem;color:var(--navy);font-weight:600;white-space:nowrap}
.itext{font-size:1rem;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.itags{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end}
.irow .star{grid-column:-2/-1;grid-row:1}
.irow .itags{grid-column:-3/-2;grid-row:1}
.chead.tl2 .ctitle{flex:1 1 100%}
.chead .tag{margin-top:3px}
.tag{font-size:.7rem;padding:1px 7px;border-radius:10px;background:var(--tag-bg);color:var(--tag-tx);white-space:nowrap;cursor:pointer}
.tag.card-t{background:var(--lb);color:var(--navy)}
.star{cursor:pointer;color:#d0d4da;font-size:.9rem;text-align:center;user-select:none}
.star.on{color:#e3b23c}
.hl{background:#fff3b0;border-radius:2px}

/* ---------- overlay / modal ---------- */
.ov{position:fixed;inset:0;background:rgba(252,251,250,.86);z-index:100;overflow:auto;padding:5vh 14px 40px}
.ov.inframe{position:absolute;top:0;left:0;right:0;bottom:auto;min-height:100%;overflow:visible}
.modal{background:#fff;border:1px solid var(--line);border-radius:12px;max-width:760px;margin:0 auto;padding:20px 22px;box-shadow:0 10px 40px rgba(30,50,80,.12);position:relative}
.modal.narrow{max-width:420px}
.modal h3{font-size:1.1rem;color:var(--navy);margin-bottom:14px;display:flex;align-items:center;gap:8px}
.modal h3 .sp{flex:1}
.mfoot{display:flex;gap:8px;justify-content:flex-end;margin-top:18px;align-items:center}
.mfoot .sp{flex:1}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:.75rem;color:var(--grey);font-weight:600;margin-bottom:4px}
.inp{width:100%;border:1px solid var(--bd);border-radius:8px;padding:8px 10px;outline:none;background:#fff}
.inp:focus{border-color:var(--navy)}
textarea.inp{resize:none;overflow:hidden;line-height:1.5}
.sel{border:1px solid var(--bd);border-radius:8px;padding:7px 8px;background:#fff;outline:none}
.hint{font-size:.75rem;color:var(--grey)}

.edrow{display:grid;grid-template-columns:minmax(0,34%) 1fr 26px;gap:8px;padding:10px 0;border-top:1px solid var(--soft);align-items:start}
.edrow .lab{font-weight:600;color:var(--navy);font-size:.85rem}
.edrow .tp{grid-column:2/3}
.edrow .ops{display:flex;flex-direction:column;gap:2px;grid-row:1/3;grid-column:3}
.edrow .lab-in{font-weight:400!important;color:var(--navy)!important}
.tpk{display:flex;flex-wrap:wrap;gap:4px;align-items:center;min-height:22px}
.tpk .tag{cursor:pointer}
.tpk .add{font-size:.75rem;width:20px;height:20px;border-radius:50%;border:1px dashed #b9c2cd;color:var(--grey);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.tpk .add:hover{border-color:var(--navy);color:var(--navy)}
.pop{position:absolute;z-index:300;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 28px rgba(30,50,80,.16);padding:10px;min-width:260px;max-width:420px}
.pop .chips{display:flex;flex-wrap:wrap;gap:5px;max-height:180px;overflow:auto;margin-bottom:8px}
.pop .tag{font-size:.78rem;padding:3px 9px}
.cmenu{position:absolute;z-index:320;background:#fff;border:1px solid var(--bd);border-radius:10px;box-shadow:0 8px 28px rgba(30,50,80,.16);padding:5px;min-width:170px}
.cmenu div{padding:7px 12px;border-radius:7px;font-size:.85rem;cursor:pointer}
.cmenu div:hover{background:var(--soft)}
.cmenu div.danger{color:var(--red)}
.cmenu hr{border:none;border-top:1px solid var(--soft);margin:4px 0}

.ftree-pick .fnode{padding:6px 8px}
.chk{width:16px;height:16px;border:1.5px solid #b9c2cd;border-radius:4px;display:inline-flex;align-items:center;justify-content:center;font-size:.7rem;color:#fff;flex:0 0 16px}
.chk.on{background:var(--navy);border-color:var(--navy)}
.chk.part{background:var(--lv2);border-color:var(--lv2)}
.seg{display:inline-flex;border:1px solid var(--bd);border-radius:18px;overflow:hidden;background:#fff}
.seg button{padding:5px 13px;font-size:.8rem;color:var(--sub)}
.seg button.on{background:var(--navy);color:#fff}
.opts{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center}
.opt{display:flex;align-items:center;gap:6px;font-size:.83rem;cursor:pointer;user-select:none}
.setup-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.box{border:1px solid var(--bd);border-radius:10px;padding:10px;max-height:300px;overflow:auto}
.modes{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.mode{border:1px solid var(--bd);border-radius:12px;padding:14px 8px;text-align:center;background:#fff;transition:.15s}
.mode:hover{border-color:var(--navy);background:var(--lb)}
.mode b{display:block;color:var(--navy);font-size:.95rem}
.mode span{font-size:.7rem;color:var(--grey)}
.mode:disabled{opacity:.4;pointer-events:none}
.count{font-size:.85rem;color:var(--navy);font-weight:700}
pre.fmt{background:var(--soft);border-radius:8px;padding:10px 12px;font-family:'GmkC',monospace;font-size:.78rem;white-space:pre-wrap;color:var(--sub);margin-bottom:10px}
.prev{border:1px solid var(--bd);border-radius:10px;padding:8px 12px;max-height:260px;overflow:auto;font-size:.82rem}
.bkcard{border:1px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.bkhead{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.bkhead .bkt{flex:1;min-width:160px;font-weight:600}
.bkrow{display:grid;grid-template-columns:minmax(0,34%) 1fr 26px;gap:8px;padding:8px 0;border-top:1px dashed var(--soft);align-items:start}
.bkrow:first-child{border-top:none}
.bkrow .bkl{resize:none;overflow:hidden}
.bkops{display:flex;flex-direction:column;gap:2px}
.bktg{margin-top:4px}
.bkadd{margin-top:2px}
@media (max-width:760px){.bkrow{grid-template-columns:1fr 26px}.bkrow .bkl{grid-column:1/2}.bkrow>div{grid-column:1/2}.bkrow .bkops{grid-row:1/3;grid-column:2}}
.prev .pc{padding:6px 0;border-top:1px dashed var(--soft)}
.prev .pc:first-child{border-top:none}

/* ---------- study ---------- */
#study{max-width:820px;margin:0 auto}
.shead{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.shead .mname{font-weight:700;color:var(--navy);font-size:1rem}
.shead .sp{flex:1}
.sprog{height:6px;border-radius:4px;background:var(--lv0);overflow:hidden;margin-bottom:18px}
.sprog i{display:block;height:100%;background:var(--navy);transition:width .3s}
.scount{font-size:.8rem;color:var(--grey)}
.fc{background:#fff;border:1px solid var(--bd);border-radius:16px;min-height:300px;padding:34px 30px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;box-shadow:0 4px 20px rgba(30,50,80,.06);transition:transform .12s ease;user-select:none;position:relative}
.fc.flip{transform:rotateX(90deg)}
.fc.back .qt{font-weight:400}
.fc.back .qlist .ql{font-weight:500}
.fc.from-l{transform:translateX(-60%) rotate(-6deg);opacity:0;transition:none}
.fc.from-r{transform:translateX(60%) rotate(6deg);opacity:0;transition:none}
.fc.slide{transition:transform .2s ease-out,opacity .2s ease-out}
.big.no.sel{background:var(--red);color:#fff}
.big.yes.sel{background:var(--green);color:#fff}
.backbtn{width:38px;height:38px;border-radius:50%;border:1.5px solid var(--bd);background:#fff;color:var(--sub);display:inline-flex;align-items:center;justify-content:center}
.backbtn:hover{border-color:var(--navy);color:var(--navy)}
.backbtn:disabled{opacity:.35;pointer-events:none}
.fc.fly-l,.fc.fly-r{transition:transform .23s ease-in,opacity .23s ease-in,border-color .1s;opacity:0;pointer-events:none}
.fc.fly-l{transform:translateX(-120%) rotate(-10deg);border-color:var(--red)}
.fc.fly-r{transform:translateX(120%) rotate(10deg);border-color:var(--green)}
html,body{overflow-x:clip}
.fc .side-lbl{position:absolute;top:12px;left:16px;font-size:.7rem;color:var(--grey);letter-spacing:.05em}
.fc .fstar{position:absolute;top:10px;right:14px;font-size:1.1rem}
.qt{font-size:1.45rem;font-weight:500;color:var(--txt);white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.qt.long{font-size:1.05rem;font-weight:500;text-align:left}
.qctx{font-size:.8rem;color:var(--grey);margin-bottom:10px}
.qsub{margin-top:8px;font-size:.95rem;color:var(--navy);font-weight:600}
.qlist{width:100%;text-align:left;display:flex;flex-direction:column;gap:8px}
.qlist .qi{display:grid;grid-template-columns:auto 1fr;gap:12px;padding:8px 0;border-top:1px dashed var(--bd);align-items:baseline}
.qlist .qi:first-child{border-top:none}
.qlist .qi.nolab{grid-template-columns:1fr}
.qlist .ql{font-weight:600;color:var(--navy);font-size:.85rem;white-space:nowrap}
.qlist .qx{white-space:pre-wrap;font-size:.98rem}
.chipline{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:12px}
.chipline .tag{font-size:.78rem;padding:2px 10px;background:var(--lb);color:var(--navy)}
.fcbtns{display:flex;gap:12px;justify-content:center;margin-top:18px;align-items:center}
.big{padding:11px 26px;border-radius:24px;font-weight:600;font-size:.92rem;border:1.5px solid}
.big.no{border-color:var(--red);color:var(--red);background:#fff}
.big.no:hover{background:var(--red-bg)}
.big.yes{border-color:var(--green);color:var(--green);background:#fff}
.big.yes:hover{background:var(--green-bg)}
.big.nv{border-color:var(--navy);color:#fff;background:var(--navy)}
.kbd{font-size:.7rem;color:var(--grey);text-align:center;margin-top:10px}

.qcard{background:#fff;border:1px solid var(--bd);border-radius:16px;padding:24px 26px;box-shadow:0 4px 20px rgba(30,50,80,.06)}
.qtype{font-size:.72rem;color:var(--grey);margin-bottom:10px;letter-spacing:.04em}

<script>
/* =====================================================================
   CARDS — 나만의 퀴즐렛
   데이터: folders[{id,name,parentId,o,u}]
           cards[{id,folderId,title,tags[],items[{id,label,text,tags[]}],o,c,u}]
           stats{itemId:{lv,c,w,star,t}}   lv 0미학습 1학습중 2익숙 3마스터
           deleted{id:ts}  (삭제 기록 — 기기간 병합용)
   ===================================================================== */
const LS_KEY = 'cards_state_v1';
const LS_UI = 'cards_ui_v1';
const LS_CFG = 'cards_studycfg_v1';
const FB_PATH = 'flashcards_data/v1';
const DEVICE = (() => { let d = localStorage.getItem('cards_device'); if (!d) { d = Math.random().toString(36).slice(2, 10); localStorage.setItem('cards_device', d); } return d; })();
const IN_FRAME = window.self !== window.top;
const LV_NAME = ['미학습', '학습중', '익숙', '마스터'];

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const ko = (a, b) => String(a).localeCompare(String(b), 'ko');
const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const norm = s => String(s || '').normalize('NFC').toLowerCase().replace(/[\s\p{P}\p{S}]/gu, '');
const normLab = s => norm(s);

let S = { subjects: [], folders: [], cards: [], stats: {}, sessions: {}, deleted: {}, ts: 0 };
let UI = { view: { type: 'all' }, expanded: {}, openSec: {}, search: '', subject: null };
try { Object.assign(UI, JSON.parse(localStorage.getItem(LS_UI) || '{}')); } catch (e) { }
const saveUI = () => { try { localStorage.setItem(LS_UI, JSON.stringify(UI)); } catch (e) { } };

/* ---------------- normalize / merge ---------------- */
function arr(x) { if (Array.isArray(x)) return x.filter(v => v != null); if (x && typeof x === 'object') return Object.values(x).filter(v => v != null); return []; }
function normalize(st) {
  st = st || {};
  const o = { subjects: arr(st.subjects), folders: arr(st.folders), cards: arr(st.cards), stats: (st.stats && typeof st.stats === 'object') ? st.stats : {}, sessions: (st.sessions && typeof st.sessions === 'object') ? st.sessions : {}, deleted: (st.deleted && typeof st.deleted === 'object') ? st.deleted : {}, ts: st.ts || 0 };
  o.subjects.forEach(x => { x.name = x.name || '과목'; x.o = x.o || 0; x.u = x.u || 0; });
  o.folders.forEach(f => { f.name = f.name || '이름 없음'; if (f.parentId === undefined) f.parentId = null; f.o = f.o || 0; f.u = f.u || 0; });
  o.cards.forEach(c => {
    c.title = c.title || ''; c.tags = arr(c.tags); c.items = arr(c.items); c.o = c.o || 0; c.u = c.u || 0; c.c = c.c || c.u || 0;
    if (c.folderId === undefined) c.folderId = null;
    if (c.dateId === undefined) c.dateId = null;
    c.items.forEach(it => { it.id = it.id || uid(); it.label = it.label || ''; it.text = it.text || ''; it.tags = arr(it.tags); });
  });
  return o;
}
function mergeStates(a, b) {
  a = normalize(a); b = normalize(b);
  const deleted = { ...a.deleted };
  for (const k in b.deleted) deleted[k] = Math.max(deleted[k] || 0, b.deleted[k]);
  const mergeList = (x, y) => {
    const m = new Map();
    [...x, ...y].forEach(e => { const p = m.get(e.id); if (!p || (e.u || 0) > (p.u || 0)) m.set(e.id, e); });
    return [...m.values()].filter(e => !(deleted[e.id] && deleted[e.id] >= (e.u || 0)));
  };
  const stats = { ...a.stats };
  for (const k in b.stats) { const p = stats[k], q = b.stats[k]; if (!p || (q.t || 0) > (p.t || 0)) stats[k] = q; }
  const sessions = { ...a.sessions };
  for (const k in b.sessions) { const p = sessions[k], q = b.sessions[k]; if (!p || (q.u || 0) > (p.u || 0)) sessions[k] = q; }
  return { subjects: mergeList(a.subjects, b.subjects), folders: mergeList(a.folders, b.folders), cards: mergeList(a.cards, b.cards), stats, sessions, deleted, ts: Math.max(a.ts, b.ts) };
}
function hasData(st) { return st && (st.folders.length || st.cards.length || Object.keys(st.stats).length); }

/* ---------------- storage + firebase ---------------- */
let db = null, fbReady = false, pushTimer = null, lastPushJson = '';
try {
  const cfg = { apiKey: "AIzaSyCboDDyAjbNBN6aPQXdQD0L9jk64ykWQ8o", projectId: "time-8d30b", databaseURL: "https://tracker-d3a39-default-rtdb.firebaseio.com/" };
  if (window.firebase) { const app = firebase.apps.find(a => a.name === 'cards') || firebase.initializeApp(cfg, 'cards'); db = app.database(); }
} catch (e) { db = null; }

function loadLocal() { try { S = normalize(JSON.parse(localStorage.getItem(LS_KEY) || 'null')); } catch (e) { S = normalize(null); } }
function writeLocal() { try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) { toast('로컬 저장 공간이 부족해요'); } }
function save() { S.ts = Date.now(); writeLocal(); schedulePush(); }
function schedulePush() { if (!db || !fbReady) return; clearTimeout(pushTimer); pushTimer = setTimeout(pushNow, 600); setSync('저장 중…'); }
function pushNow() {
  if (!db || !fbReady) return;
  const json = JSON.stringify(S);
  if (json === lastPushJson) { setSync('동기화됨'); return; }
  lastPushJson = json;
  db.ref(FB_PATH).set({ json, ts: S.ts || Date.now(), by: DEVICE }).then(() => setSync('동기화됨')).catch(() => setSync('오프라인 (기기에 저장됨)'));
}
function setSync(t) { const el = $('#syncState'); if (el) el.textContent = t; }

function initSync() {
  if (!db) { setSync('기기에 저장됨'); return; }
  setSync('불러오는 중…');
  let done = false;
  const finish = () => { if (done) return; done = true; fbReady = true; subscribe(); };
  setTimeout(() => { if (!done) { setSync('오프라인 (기기에 저장됨)'); finish(); } }, 8000);
  db.ref(FB_PATH).once('value').then(snap => {
    const v = snap.val();
    applyRemote(v, true);
    finish();
  }).catch(() => { setSync('오프라인 (기기에 저장됨)'); finish(); });
}
// 서버 데이터와 로컬 데이터를 "덮어쓰기" 대신 항목 단위로 병합 → 빈 기기가 서버를 지우는 사고 방지
function applyRemote(v, initial) {
  let remote = null;
  if (v && v.json) { try { remote = normalize(JSON.parse(v.json)); } catch (e) { remote = null; } }
  if (!remote) { if (hasData(S)) { fbReady = true; pushNow(); } else setSync('동기화됨'); return; }
  const merged = mergeStates(S, remote);
  const mj = JSON.stringify(merged), rj = JSON.stringify(remote);
  const changedLocal = mj !== JSON.stringify(S);
  S = merged; writeLocal();
  if (changedLocal) { fixOrphans(); if (!studyActive) renderAll(); }
  if (mj !== rj) { fbReady = true; lastPushJson = ''; pushNow(); } else { lastPushJson = mj; setSync('동기화됨'); }
}
function subscribe() {
  if (!db) return;
  db.ref(FB_PATH).on('value', snap => {
    const v = snap.val();
    if (!v || v.by === DEVICE) return;
    applyRemote(v, false);
  });
}
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden' && pushTimer) { clearTimeout(pushTimer); pushNow(); } });

/* ---------------- helpers ---------------- */
const F = id => S.folders.find(f => f.id === id);
const C = id => S.cards.find(c => c.id === id);
const fk = f => (f && f.kind) || 'topic';
const ic = f => (f && f.icon) || '📁';
const icNone = f => !(f && f.icon === '-');
const icHtml = f => icNone(f) ? `<span class="fic">${esc(ic(f))}</span>` : '';
const FIELD = kind => kind === 'date' ? 'dateId' : 'folderId';
const kids = (pid, kind = 'topic') => {
  const list = S.folders.filter(f => (f.parentId || null) === (pid || null) && (pid || (f.subjectId === UI.subject && fk(f) === kind)));
  if (!pid && kind === 'date') return list.sort((a, b) => b.name.localeCompare(a.name, 'ko', { numeric: true }));
  return list.sort((a, b) => (a.o - b.o) || ko(a.name, b.name));
};
const inF = (c, id) => c.folderId === id || c.dateId === id;
const inSet = (c, set) => set.has(c.folderId) || set.has(c.dateId);
const todayName = () => { const d = new Date(); return String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0'); };
const SC = () => S.cards.filter(c => c.subjectId === UI.subject);
const subjects = () => S.subjects.slice().sort((a, b) => a.o - b.o);
function rootOf(fid) { let f = F(fid), g = 0; while (f && f.parentId && g++ < 50) f = F(f.parentId); return f; }
function fixOrphans() {
  if (!S.subjects.length) return;
  const ids = new Set(S.subjects.map(x => x.id)), first = subjects()[0].id;
  S.folders.forEach(f => { if (!f.parentId && !ids.has(f.subjectId)) f.subjectId = first; if (!f.kind) f.kind = 'topic'; });
  S.folders.forEach(f => { if (f.parentId) { const r = rootOf(f.id); if (r) { f.subjectId = r.subjectId; f.kind = fk(r); } } });
  S.cards.forEach(c => {
    if (c.folderId && !F(c.folderId)) c.folderId = null;
    if (c.dateId && !F(c.dateId)) c.dateId = null;
    const r = c.folderId ? rootOf(c.folderId) : c.dateId ? rootOf(c.dateId) : null;
    if (r) c.subjectId = r.subjectId; else if (!ids.has(c.subjectId)) c.subjectId = first;
  });
  if (!ids.has(UI.subject)) UI.subject = first;
}
function descIds(id) { const out = [id]; kids(id).forEach(k => out.push(...descIds(k.id))); return out; }
function folderPath(id) { const p = []; let f = F(id), guard = 0; while (f && guard++ < 50) { p.unshift(f); f = F(f.parentId); } return p; }
const pathStr = id => folderPath(id).map(f => f.name).join(' / ') || '미분류';
const effTags = (card, it) => [...new Set([...(card.tags || []), ...(it.tags || [])])];
const st = id => S.stats[id] || { lv: 0, c: 0, w: 0, star: false, t: 0 };
function setSt(id, patch) { S.stats[id] = { ...st(id), ...patch, t: Date.now() }; }
function allTags() { const m = new Map(); SC().forEach(c => c.items.forEach(it => effTags(c, it).forEach(t => m.set(t, (m.get(t) || 0) + 1)))); return m; }
function itemTitle(card, it) {
  if (it.label) return card.title + ' · ' + it.label;
  return card.title;
}
function lvDist(items) { const d = [0, 0, 0, 0]; items.forEach(it => d[st(it.id).lv || 0]++); return d; }
function pbarHtml(d) {
  const tot = d.reduce((a, b) => a + b, 0) || 1;
  return `<div class="pbar">${[3, 2, 1].map(l => `<i class="lv${l}" style="width:${d[l] / tot * 100}%"></i>`).join('')}</div>
  <div class="legend">${[3, 2, 1, 0].map(l => `<span><b class="lv${l}"></b>${LV_NAME[l]} ${d[l]}</span>`).join('')}</div>`;
}
function toast(t) { const el = $('#toast'); el.textContent = t;
  if (IN_FRAME) { try { const r = window.frameElement.getBoundingClientRect(); el.style.position = 'absolute'; el.style.bottom = 'auto'; el.style.top = Math.max(0, -r.top + window.parent.innerHeight - 70) + 'px'; } catch (e) { } } el.classList.add('on'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('on'), 1700); }
function autoGrow(el) { el.style.height = 'auto'; el.style.height = el.scrollHeight + 'px'; }

/* ---------------- iframe height ---------------- */
function reportHeight() { if (!IN_FRAME) return; try { window.parent.postMessage({ type: 'cardsHeight', height: document.documentElement.scrollHeight }, '*'); } catch (e) { } }
new ResizeObserver(() => reportHeight()).observe(document.body);
function visibleTop() {
  if (!IN_FRAME) return window.scrollY;
  try { const r = window.frameElement.getBoundingClientRect(); return Math.max(0, -r.top); } catch (e) { return 0; }
}
function scrollToTopOfApp(smooth) {
  const behavior = smooth ? 'smooth' : 'auto';
  if (IN_FRAME) { try { const r = window.frameElement.getBoundingClientRect(); if (r.top < 0) window.parent.scrollBy({ top: r.top - 10, behavior }); } catch (e) { } }
  else window.scrollTo({ top: 0, behavior });
}
/* 맨 위로 버튼 (iframe 안에서도 화면 우측 하단에 붙어있게) */
function placeTopBtn() {
  const b = document.getElementById('toTop'); if (!b) return;
  let vt = window.scrollY, vb = window.scrollY + window.innerHeight;
  if (IN_FRAME) { try { const r = window.frameElement.getBoundingClientRect(); vt = -r.top; vb = -r.top + window.parent.innerHeight; } catch (e) { } }
  b.classList.toggle('on', vt > 250);
  if (IN_FRAME) b.style.top = Math.max(0, Math.min(document.documentElement.scrollHeight - 60, vb - 66)) + 'px';

// 공부 중 카드 편집 후: 바뀐 카드 내용으로 다시 연결하고 화면 갱신
function rebindUnit(u) {
  const c = C(u.card.id); if (!c) return null;
  if (u.kind === 'item') { const it = c.items.find(i => i.id === u.item.id); if (!it) return null; return { ...u, card: c, item: it, items: [it] }; }
  const ids = u.items.map(i => i.id); const items = c.items.filter(i => ids.includes(i.id));
  return items.length ? { ...u, card: c, items } : null;
}
function studyRefresh() {
  if (!SD) return;
  if (SD.mode === 'flash' && SD.deck) {
    const done = SD.deck.slice(0, SD.i).map(u => rebindUnit(u) || u);
    const rest = SD.deck.slice(SD.i).map(rebindUnit).filter(Boolean);
    SD.deck = done.concat(rest);
    SD.know = SD.know.map(u => rebindUnit(u) || u); SD.dont = SD.dont.map(u => rebindUnit(u) || u);
    persistSess(); flashDraw();
  } else if (SD.mode === 'learn' && SD.L) {
    SD.L = SD.L.map(x => { const u = rebindUnit(x.u); if (!u) return null; x.u = u; return x; }).filter(Boolean);
    persistSess(); toast('수정했어요 · 다음 문제부터 반영');
  }
}

function parseTagsTail(s) {
  // 줄 끝의 "#태그 #태그" 떼어내기 (태그 안 공백은 _ 로)
  const tags = []; let m;
  const re = /\s*#([^\s#]+)\s*$/;
  while ((m = s.match(re))) { tags.unshift(m[1].replace(/_/g, ' ')); s = s.slice(0, m.index); }
  return { text: s.trim(), tags };
}
function parseBulk(text, mode) {
  const lines = text.replace(/\r/g, '').split('\n');
  const cards = [];
  if (mode === 'quizlet') {
    lines.forEach(l => {
      if (!l.trim()) return;
      let i = l.indexOf('\t'), sepLen = 1;
      if (i < 0) { const m = l.match(/\s*(\||;|,|=|→|->)\s*/); if (m) { i = m.index; sepLen = m[0].length; } }
      if (i < 0) return;
      const term = parseTagsTail(l.slice(0, i)); const def = parseTagsTail(l.slice(i + sepLen));
      cards.push({ title: term.text, tags: term.tags, items: [{ label: '', text: def.text, tags: def.tags }] });
    });
    return cards;
  }
  let cur = null, last = null;
  const bullet = /^\s*([-•·*▪◦]|\d+[.)])\s+/;
  lines.forEach(raw => {
    if (!raw.trim()) { last = null; return; }
    if (bullet.test(raw)) {
      if (!cur) { cur = { title: '(제목 없음)', tags: [], items: [] }; cards.push(cur); }
      let body = raw.replace(bullet, '');
      const t = parseTagsTail(body); body = t.text;
      let label = '', txt = body;
      const m = body.match(/^([^:：]{1,24})\s*[:：]\s*([\s\S]*)$/);
      if (m) { label = m[1].trim(); txt = m[2].trim(); }
      last = { label, text: txt, tags: t.tags }; cur.items.push(last);
    } else if (/^\s{2,}|^\t/.test(raw) && last) {
      last.text += '\n' + raw.trim();
    } else {
      const t = parseTagsTail(raw.trim());
      cur = { title: t.text, tags: t.tags, items: [] }; cards.push(cur); last = null;
    }
  });

}

const sessKey = (subj, mode, scopeKey) => subj + ':' + mode + ':' + scopeKey;

  if (SD.mode === 'learn' && SD.L) d = { dir: SD.dir, skipW: !!SD.skipW, L: SD.L.map(x => ({ k: ukey(x.u), stage: x.stage, miss: x.miss })), round: SD.round, correct: SD.correct, wrong: SD.wrong };
  if (!d) return;
  S.sessions[sessKey(SD.subject, SD.mode, SD.scope.key)] = { ...d, mode: SD.mode, subject: SD.subject, label: SD.scope.label, scopeKey: SD.scope.key, u: Date.now() }; writeLocal(); schedulePush();
}
function clearSess(mode) { if (!SD || !SD.scope) return; S.sessions[sessKey(SD.subject, mode, SD.scope.key)] = { u: Date.now(), empty: true }; writeLocal(); schedulePush(); }

function resumeSess(k) {

    SD.units = SD.L.map(y => y.u); SD.round = Math.max(0, (x.round || 1) - 1); SD.correct = x.correct || 0; SD.wrong = x.wrong || 0;

/* ---------------- FLASHCARDS ---------------- */

function flashFlip() { if (modalStack.length) return; const el = $('#fcard'); el.classList.add('flip'); setTimeout(() => { SD.flip = !SD.flip; flashDraw(); const n = $('#fcard'); n.classList.add('flip'); requestAnimationFrame(() => requestAnimationFrame(() => n.classList.remove('flip'))); }, 120); }

function flashMarkNow(ok) {

}

function flashShuffle() { const rest = shuffle(SD.deck.slice(SD.i)); SD.deck = SD.deck.slice(0, SD.i).concat(rest); SD.flip = false; persistSess(); flashDraw(); toast('남은 카드를 섞었어요'); }

function flashAgain(onlyDont) { SD.deck = shuffle(onlyDont ? SD.dont : SD.deck); SD.i = 0; SD.flip = false; SD.know = []; SD.dont = []; SD.hist = []; persistSess(); flashDraw(); }

/* ---------------- LEARN ---------------- */
function learnFrom(units) { SD.mode = 'learn'; SD.units = units; learnStart(); }
function learnStart() {
  // 각 단위의 세션 단계: 0 객관식 필요, 1 주관식 필요, 2 완료
  SD.skipW = !!CFG.skipWritten;
  SD.L = shuffle(SD.units).map(u => {
    const minLv = Math.min(...u.items.map(it => st(it.id).lv || 0));
    let stage = u.kind === 'card' ? 1 : (minLv >= 2 ? 1 : 0);
    if (SD.skipW && u.kind === 'item' && stage === 1) stage = 0;
    return { u, stage, miss: 0 };
  });
  SD.round = 0; SD.correct = 0; SD.wrong = 0;
  learnNextRound();
}
function learnNextRound() {
  const left = SD.L.filter(x => x.stage < 2);
  if (!left.length) return learnEnd();
  SD.round++; SD.batch = left.slice(0, 7); SD.queue = SD.batch.flatMap(x => [x]); SD.qi = 0;
  persistSess(); learnAsk();
}
function learnProg() { const tot = SD.L.length * 2; const done = SD.L.reduce((n, x) => n + Math.min(2, x.stage), 0); return done / tot * 100; }
function learnAsk() {
  if (SD.qi >= SD.queue.length) {
    // 라운드 끝 — 이번 배치에서 안 끝난 것만 한 번 더
    const pending = SD.batch.filter(x => x.stage < 2);
    if (pending.length && SD.batch._again !== true) { SD.batch._again = true; SD.queue = shuffle(pending); SD.qi = 0; return learnAsk(); }
    return learnRoundSummary();
  }
  const x = SD.queue[SD.qi];
  if (x.stage >= 2) { SD.qi++; return learnAsk(); }
  if (x.u.kind === 'card') return learnRecall(x);
  if (x.stage === 0) return learnMC(x);
  return learnWritten(x);
}
function learnHead() { return shead('학습', `<span class="scount">라운드 ${SD.round}</span>`) + `<div class="sprog"><i style="width:${learnProg()}%"></i></div>`; }

// 객관식 보기 만들기 — 같은 라벨(다른 카드) > 같은 태그 > 같은 카드 다른 줄 > 같은 폴더 > 전체
function distractors(u, dir, n) {
  const refs = SC().flatMap(c => c.items.map(it => ({ card: c, item: it })));
  const key = r => dir === 'fwd' ? r.item.text : (r.item.label ? r.card.title + ' · ' + r.item.label : r.card.title);
  const correct = dir === 'fwd' ? u.item.text : (u.item.label ? u.card.title + ' · ' + u.item.label : u.card.title);
  const lab = normLab(u.item.label), tags = new Set(effTags(u.card, u.item));
  const notMe = r => r.item.id !== u.item.id;
  const tiers = [
    refs.filter(r => notMe(r) && r.card.id !== u.card.id && lab && normLab(r.item.label) === lab),
    refs.filter(r => notMe(r) && effTags(r.card, r.item).some(t => tags.has(t))),
    refs.filter(r => notMe(r) && r.card.id === u.card.id),
    refs.filter(r => notMe(r) && r.card.folderId === u.card.folderId),
    refs.filter(notMe),
  ];
  const out = [], seen = new Set([norm(correct)]);
  for (const t of tiers) { for (const r of shuffle(t)) { const k = key(r); if (!k || seen.has(norm(k))) continue; seen.add(norm(k)); out.push(k); if (out.length >= n) return out; } }
  return out;
}
function learnMC(x) {
  const u = x.u, dir = SD.dir;
  const correct = dir === 'fwd' ? u.item.text : (u.item.label ? u.card.title + ' · ' + u.item.label : u.card.title);
  const opts = shuffle([correct, ...distractors(u, dir, 3)]);
  SD.cur = { x, opts, correct, answered: false };
  $('#study').innerHTML = learnHead() + `<div class="qcard"><div class="qtype">객관식 · ${dir === 'fwd' ? '내용 고르기' : '누구/무엇?'}</div>
    <div style="text-align:center">${qHtml(u, dir)}</div>
    <div class="opts4">${opts.map((o, i) => `<button class="op" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>
    <div id="fbBox"></div></div>`;
  $('#study').querySelectorAll('.op').forEach(b => b.onclick = () => learnPick(+b.dataset.i));
}
function learnPick(i) {
  const c = SD.cur; if (c.answered) return; c.answered = true;
  const ok = c.opts[i] === c.correct; const x = c.x;
  $('#study').querySelectorAll('.op').forEach((b, j) => { if (c.opts[j] === c.correct) b.classList.add('ok'); else if (j === i) b.classList.add('bad'); else b.classList.add('dim'); });
  grade(x.u.items, ok, 2);
  if (ok) x.stage = SD.skipW ? 2 : 1; persistSess();
  if (ok) { x.stage = SD.skipW ? 2 : 1; SD.correct++; $('#fbBox').innerHTML = `<div class="fb ok">정답!</div>`; setTimeout(() => { if (SD && SD.cur === c) { SD.qi++; learnAsk(); } }, 750); }
  else { x.miss++; SD.wrong++; SD.queue.push(x); $('#fbBox').innerHTML = `<div class="fb bad">오답</div><div class="fcbtns"><button class="big nv" onclick="SD.qi++;learnAsk()">계속 (Enter)</button></div>`; c.wait = true; }
}
function learnWritten(x) {
  const u = x.u, dir = SD.dir, ans = ansText(u, dir);
  const typing = !isLong(ans) && ans.length <= 25;
  SD.cur = { x, ans, typing, answered: false };
  $('#study').innerHTML = learnHead() + `<div class="qcard"><div class="qtype">${typing ? '주관식 · 직접 쓰기' : '주관식 · 떠올리고 확인'}</div>
    <div style="text-align:center">${qHtml(u, dir)}</div>

    <div id="fbBox"><div class="fcbtns"><button class="btn ghost" onclick="learnWrSubmit(true)">모르겠어요</button><button class="big nv" onclick="learnWrSubmit()">${typing ? '확인' : '정답 보기'}</button></div></div></div>`;

  c.judge = true;
}
function cmpHtml(c) { return `<div class="cmp">${c.mine ? `<span class="k">내 답</span><span class="mine">${esc(c.mine)}</span>` : ''}<span class="k">정답</span><span class="ans">${esc(c.ans)}</span></div>`; }
function learnWrShow(ok) {

  $('#fbBox').innerHTML = `<div class="fb ${ok ? 'ok' : 'bad'}">${ok ? '정답' : '오답'}</div>${cmpHtml(c)}
    <div class="fcbtns"><button class="btn" onclick="learnWrShow(!SD.cur.ok)">${ok ? '틀린 걸로 바꾸기' : '맞은 걸로 바꾸기'}</button><button class="big nv" onclick="learnWrResult()">계속 (Enter)</button></div>`;

// 카드째 학습: 라벨마다 떠올리고, 정답 보고 줄마다 O/X
function learnRecall(x) {
  const u = x.u, dir = SD.dir;
  SD.cur = { x, revealed: false, marks: (dir === 'fwd' ? u.items : [0]).map(() => null) };
  const rows = dir === 'fwd' ? u.items.map((it, i) => `<div class="rrow ${it.label ? '' : 'nolab'}" data-i="${i}">${it.label ? `<span class="ql">${esc(it.label)}</span>` : ''}<div><textarea rows="1" placeholder="${it.label || u.items.length < 2 ? '' : (i + 1) + '번째'}"></textarea><div class="ansv hidden">${esc(it.text)}</div></div><button class="mark hidden">?</button></div>`).join('')
    : `<div class="rrow nolab" data-i="0"><div><textarea rows="1" placeholder=""></textarea><div class="ansv hidden">${esc(u.card.title)}</div></div><button class="mark hidden">?</button></div>`;
  $('#study').innerHTML = learnHead() + `<div class="qcard"><div class="qtype">카드째 · 전부 떠올리기</div>
    <div style="text-align:center;margin-bottom:12px">${dir === 'fwd' ? `<div class="qt">${esc(u.card.title)}</div>` : listHtml(u.items)}</div>

  $('#study').querySelectorAll('.rrow textarea').forEach(t => { t.oninput = () => autoGrow(t); });

    const ans = dir === 'fwd' ? u.items[i].text : u.card.title;

function learnRecallAll(v) { SD.cur.marks = SD.cur.marks.map(() => v); $('#study').querySelectorAll('.rrow .mark').forEach(b => { b.className = 'mark ok'; b.textContent = 'O'; }); }

    <div class="fcbtns" style="margin-top:20px"><button class="big nv" onclick="learnNextRound()">계속 (Enter)</button><button class="btn" onclick="endStudy()">그만하기</button></div></div>`;

/* ---------------- TEST ---------------- */

  $('#study').querySelectorAll('.chk').forEach(c => c.parentElement.onclick = () => { types[c.dataset.k] = !types[c.dataset.k]; c.classList.toggle('on', types[c.dataset.k]); c.textContent = types[c.dataset.k] ? '✓' : ''; });
  $('#tsGo').onclick = () => {
    const ts = Object.keys(types).filter(k => types[k]); if (!ts.length) return toast('유형을 하나 이상 골라요');
    const cnt = Math.max(1, Math.min(n, +$('#tsN').value || n));
    SD.T = shuffle(SD.units).slice(0, cnt).map((u, i) => {
      let t = ts[i % ts.length]; const dir = SD.dir;
      const correct = dir === 'fwd' ? u.item.text : (u.item.label ? u.card.title + ' · ' + u.item.label : u.card.title);
      const q = { u, t, correct, ans: null };
      if (t === 'mc') { q.opts = shuffle([correct, ...distractors(u, dir, 3)]); if (q.opts.length < 2) q.t = t = 'wr'; }
      if (t === 'ox') { const d = distractors(u, dir, 1); q.truth = !d.length || Math.random() < .5; q.shown = q.truth ? correct : d[0]; }
      return q;
    });
    SD.T = shuffle(SD.T); testDraw(false);
  };
}
function testDraw(graded) {
  const T = SD.T, dir = SD.dir;
  let score = 0;
  const html = T.map((q, i) => {
    const u = q.u; let body = '', cls = '';
    if (graded) cls = q.ok === true ? 'ok' : q.ok === false ? 'bad' : '';
    if (q.t === 'mc') body = `<div class="opts4">${q.opts.map((o, j) => `<button class="op ${q.ans === j ? (graded ? (o === q.correct ? 'ok' : 'bad') : 'picked') : (graded && o === q.correct ? 'ok' : '')}" data-q="${i}" data-j="${j}"><span class="n">${j + 1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
    else if (q.t === 'ox') body = `<div style="margin-top:12px;padding:10px 12px;background:var(--soft);border-radius:10px;white-space:pre-wrap">${esc(q.shown)}</div>
      <div class="oxb"><button class="op ${q.ans === true ? (graded ? (q.truth ? 'ok' : 'bad') : 'picked') : ''}" data-q="${i}" data-ox="1">O</button><button class="op ${q.ans === false ? (graded ? (!q.truth ? 'ok' : 'bad') : 'picked') : ''}" data-q="${i}" data-ox="0">X</button></div>
      ${graded && q.ok === false ? `<div class="cmp"><span class="k">정답</span><span class="ans">${esc(q.correct)}</span></div>` : ''}`;
    else body = `<div class="wr"><textarea rows="1" data-q="${i}" ${graded ? 'disabled' : ''}>${esc(q.ans || '')}</textarea></div>
      ${graded ? `<div class="cmp"><span class="k">정답</span><span class="ans">${esc(q.correct)}</span></div>` : ''}`;
    if (graded) body += `<div class="fcbtns" style="justify-content:flex-start;margin-top:10px;gap:8px"><span class="mark ${q.ok === true ? 'ok' : q.ok === false ? 'bad' : ''}" style="display:inline-flex;align-items:center;justify-content:center">${q.ok === true ? 'O' : q.ok === false ? 'X' : '?'}</span>
      ${q.ok == null ? `<button class="btn sm" data-fix="${i}" data-v="1">맞음</button><button class="btn sm" data-fix="${i}" data-v="0">틀림</button>` : `<button class="btn sm" data-fix="${i}" data-v="${q.ok ? 0 : 1}">${q.ok ? '틀린 걸로 바꾸기' : '맞은 걸로 바꾸기'}</button>`}</div>`;
    if (q.ok === true) score++;
    return `<div class="tq ${cls}"><div class="tn">${i + 1}. ${{ mc: '객관식', wr: '주관식', ox: 'O/X — 짝이 맞나요?' }[q.t]}</div><div>${qHtml(u, dir)}</div>${body}</div>`;
  }).join('');
  const pending = T.filter(q => q.ok == null).length;
  $('#study').innerHTML = shead('테스트', graded ? `<span class="count">${score} / ${T.length}</span>` : `<span class="scount">${T.filter(q => q.ans != null && q.ans !== '').length} / ${T.length} 답함</span>`) +
    (graded ? `<div class="qcard rsum" style="margin-bottom:14px;padding:20px"><div class="big-n">${Math.round(score / T.length * 100)}점</div><div class="lbl">${score} / ${T.length} 맞음${pending ? ` · 확인 필요 ${pending}` : ''}</div>
      <div class="fcbtns">${T.some(q => q.ok === false) ? `<button class="big no" onclick="testRetryWrong()">틀린 것만 학습</button>` : ''}<button class="btn" onclick="testStart()">새 테스트</button></div></div>` : '') +
    html + (graded ? '' : `<div class="fcbtns"><button class="big nv" onclick="testGrade()">제출</button></div>`);
  const sd = $('#study');
  if (!graded) {
    sd.querySelectorAll('.op[data-j]').forEach(b => b.onclick = () => { T[+b.dataset.q].ans = +b.dataset.j; keepScroll(() => testDraw(false)); });
    sd.querySelectorAll('.op[data-ox]').forEach(b => b.onclick = () => { T[+b.dataset.q].ans = b.dataset.ox === '1'; keepScroll(() => testDraw(false)); });
    sd.querySelectorAll('textarea[data-q]').forEach(t => { autoGrow(t); t.oninput = () => { T[+t.dataset.q].ans = t.value; autoGrow(t); }; });
  } else {
    sd.querySelectorAll('[data-fix]').forEach(b => b.onclick = () => { const q = T[+b.dataset.fix]; q.ok = b.dataset.v === '1'; recordQ(q); save(); keepScroll(() => testDraw(true)); });
    sd.querySelectorAll('textarea').forEach(t => autoGrow(t));
  }
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
function testGrade() {
  const unanswered = SD.T.filter(q => q.ans == null || q.ans === '').length;
  if (unanswered && !confirm(`${unanswered}문제 안 풀었어요. 그래도 제출?`)) return;
  SD.T.forEach(q => {
    if (q.t === 'mc') q.ok = q.ans != null && q.opts[q.ans] === q.correct;
    else if (q.t === 'ox') q.ok = q.ans != null && q.ans === q.truth;
    else { const a = String(q.ans || '').trim(); q.ok = !a ? false : norm(a) === norm(q.correct) ? true : null; }
  });
  SD.T.forEach(recordQ); save();
  scrollToTopOfApp(); testDraw(true);
}
// 채점 결과를 기록에 반영 (결과를 바꾸면 원래 기록으로 되돌린 뒤 다시 반영)
function recordQ(q) {
  const id = q.u.item.id;
  if (q.prev === undefined) q.prev = S.stats[id] ? { ...S.stats[id] } : null;
  else { if (q.prev) S.stats[id] = { ...q.prev }; else delete S.stats[id]; }
  if (q.ok != null) grade([q.u.item], q.ok, q.t === 'wr' ? 3 : 2);
}
function testRetryWrong() { const us = SD.T.filter(q => q.ok === false).map(q => q.u); learnFrom(us); }

/* ---------------- MATCH ---------------- */
function matchStart() {
  const pick = shuffle(SD.units).slice(0, Math.min(6, SD.units.length));
  const tiles = shuffle(pick.flatMap((u, i) => [
    { p: i, t: true, s: u.item.label ? u.card.title + ' · ' + u.item.label : itemTitle(u.card, u.item) },
    { p: i, t: false, s: u.item.text.length > 90 ? u.item.text.slice(0, 88) + '…' : u.item.text }
  ]));
  SD.M = { tiles, sel: null, left: pick.length, start: Date.now(), miss: 0 };
  $('#study').innerHTML = shead('매칭', `<span class="timer" id="mTimer">0.0</span>`) + `<div class="mgrid">${tiles.map((t, i) => `<div class="tile ${t.t ? 't' : ''}" data-i="${i}">${esc(t.s)}</div>`).join('')}</div>
`;
  clearInterval(window._mt); window._mt = setInterval(() => { const el = $('#mTimer'); if (el && SD && SD.M) el.textContent = ((Date.now() - SD.M.start) / 1000 + SD.M.miss).toFixed(1); }, 100);
  $('#study').querySelectorAll('.tile').forEach(el => el.onclick = () => matchTap(+el.dataset.i, el));
}
function matchTap(i, el) {
  const M = SD.M, t = M.tiles[i]; if (el.classList.contains('gone')) return;
  if (M.sel == null) { M.sel = i; el.classList.add('on'); return; }
  if (M.sel === i) { M.sel = null; el.classList.remove('on'); return; }
  const a = M.tiles[M.sel], ael = $(`.tile[data-i="${M.sel}"]`);
  if (a.p === t.p && a.t !== t.t) { ael.classList.add('gone'); el.classList.add('gone'); M.sel = null; M.left--; if (!M.left) matchEnd(); }
  else { M.miss++; ael.classList.remove('on'); [ael, el].forEach(x => { x.classList.add('bad'); setTimeout(() => x.classList.remove('bad'), 350); }); M.sel = null; }
}
function matchEnd() {
  clearInterval(window._mt);
  const sec = (Date.now() - SD.M.start) / 1000 + SD.M.miss;
  let best = +localStorage.getItem('cards_match_best') || 0; const isBest = !best || sec < best; if (isBest) localStorage.setItem('cards_match_best', sec);
  $('#study').innerHTML = shead('매칭') + `<div class="qcard rsum"><div class="big-n">${sec.toFixed(1)}초</div><div class="lbl">${isBest ? '🏆 최고 기록!' : '최고 기록 ' + best.toFixed(1) + '초'} · 실수 ${SD.M.miss}</div>
    <div class="fcbtns"><button class="big nv" onclick="matchStart()">다시 (Enter)</button><button class="btn" onclick="endStudy()">끝내기</button></div></div>`;
  SD.M.done = true;
}

/* ---------------- keyboard ---------------- */
document.getElementById('study').addEventListener('contextmenu', e => { if (e.target.closest('.fc,.qcard')) studyCardMenu(e); });
const keyStudy = e => {
  if (!studyActive || !SD || modalStack.length) return;
  const typing = e.target.closest('input,textarea');
  if (SD.mode === 'flash' && SD.deck && SD.i < SD.deck.length && !typing) {
    if (e.key === ' ' || e.key === 'ArrowUp' || e.key === 'ArrowDown') { e.preventDefault(); flashFlip(); }
    else if (e.key === 'ArrowLeft') flashMark(false);
    else if (e.key === 'ArrowRight') flashMark(true);
    else if (e.key === 'Backspace') { e.preventDefault(); flashBack(); }
    return;
  }
  if (SD.mode === 'learn' && SD.cur) {
    const c = SD.cur;
    if (c.roundEnd && e.key === 'Enter') { e.preventDefault(); return learnNextRound(); }
    if (c.opts && !c.answered && /^[1-4]$/.test(e.key) && !typing) { const i = +e.key - 1; if (i < c.opts.length) learnPick(i); return; }
    if (c.opts && c.wait && e.key === 'Enter') { e.preventDefault(); c.wait = false; SD.qi++; learnAsk(); return; }
    if (c.judge && !c.done) {
      if (e.key === 'ArrowLeft') return learnWrShow(false);
      if (e.key === 'ArrowRight') return learnWrShow(true);
    }
    if (c.result && !c.done && e.key === 'Enter') { e.preventDefault(); return learnWrResult(); }
    if (c.marks && !typing && e.key === 'Enter') { e.preventDefault(); if (!c.revealed) learnRecallReveal(); else learnRecallDone(); }
    return;
  }
  if (SD.mode === 'match' && SD.M && SD.M.done && e.key === 'Enter') matchStart();
};
document.addEventListener('keydown', keyStudy);


/* ---------------- 기본 과목 + 예시 정리 ---------------- */
function initData() {
  if (localStorage.getItem('cards_clean1')) { fixOrphans(); return; }
  const now = Date.now(), ex = id => /^(seed_|sv2_c|sv2_f|sv2_i|sv3_)/.test(id);
  S.folders.filter(f => ex(f.id)).forEach(f => S.deleted[f.id] = now);
  S.cards.filter(c => ex(c.id)).forEach(c => { S.deleted[c.id] = now; c.items.forEach(it => delete S.stats[it.id]); });
  S.folders = S.folders.filter(f => !ex(f.id)); S.cards = S.cards.filter(c => !ex(c.id));
  for (const k in S.stats) if (ex(k)) delete S.stats[k];
  S.sessions = {};
  ['국제정치학', '국제법', '헌법'].forEach((name, i) => { const id = 'sv2_s' + i; if (!S.subjects.find(x => x.id === id)) S.subjects.push({ id, name, o: i + 1, u: now }); });
  localStorage.setItem('cards_clean1', '1'); S.ts = now; fixOrphans(); writeLocal();
}
/* 플래너(iframe) 안일 때: 포커스가 바깥 페이지에 있어도 키 입력 받기 */
try {
  if (IN_FRAME) window.parent.document.addEventListener('keydown', e => {
    const fe = window.frameElement; if (!fe || !fe.offsetParent) return; // CARDS 탭이 안 보이면 무시
    if (!studyActive && !modalStack.length) return;
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown', ' '].includes(e.key) && studyActive) e.preventDefault();
    keyEsc(e); keyStudy(e);
  });
} catch (e) { }
/* ---------------- boot ---------------- */
if (IN_FRAME) document.documentElement.classList.add('inframe-top');
loadLocal();
initData();
if (!UI.view || (UI.view.type === 'folder' && !F(UI.view.id))) UI.view = { type: 'all' };
renderAll();
initSync();
window.addEventListener('resize', reportHeight);
</script>
