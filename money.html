<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Ledger</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ledger">
<meta name="theme-color" content="#f3ead8">
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Courier+Prime:wght@400;700&family=Nanum+Pen+Script&family=Playfair+Display:ital,wght@1,600;1,700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f3ead8;--card:#fbf6ea;--line:#d9ccb2;--line2:#e7dcc6;--ink:#1d1814;--sub:#7d6f5e;
  --brown:#7a5232;--burg:#8b2e2e;--forest:#2f4a3a;--mustard:#b8892f;--sky:#5aaee0;
  --serif:'Gowun Batang','Nanum Myeongjo',serif;--type:'Courier Prime','Courier New',monospace;
  --body:'Paperlogy','Gmarket Sans',-apple-system,sans-serif;--hand:'Nanum Pen Script',cursive;
}
*{box-sizing:border-box;scrollbar-width:none}*::-webkit-scrollbar{display:none}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:14px;-webkit-text-size-adjust:100%}
body{background-color:var(--paper);background-image:
  radial-gradient(rgba(122,82,50,.05) 1px,transparent 1px),
  linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,0));background-size:7px 7px,100% 100%;min-height:100vh}
button{font-family:var(--body);cursor:pointer;color:var(--ink)}
input,textarea,select{font-family:var(--body);color:var(--ink)}
.wrap{max-width:1080px;margin:0 auto;padding:26px 18px calc(110px + env(safe-area-inset-bottom))}

/* 머리 */
.top{display:flex;align-items:flex-end;gap:14px;border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:4px}
.brand{font-family:'Playfair Display',serif;font-style:italic;font-weight:700;font-size:34px;line-height:1;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--type);font-style:normal;font-weight:400;font-size:10.5px;letter-spacing:.22em;color:var(--sub);margin-top:6px;text-transform:uppercase}
.sp{flex:1}
.mnav{display:flex;align-items:center;gap:4px}
.mnav button{border:1px solid var(--line);background:var(--card);width:32px;height:32px;border-radius:50%;font-size:15px;line-height:1}
.mnav .mm{font-family:var(--serif);font-weight:700;font-size:22px;min-width:104px;text-align:center}
.rule2{border-top:1px solid var(--ink);margin:3px 0 18px}
.tabs{display:flex;gap:16px;margin:0 0 16px;font-family:var(--serif)}
.tabs button{border:0;background:none;padding:2px 0;font-size:14.5px;color:var(--sub);border-bottom:1.5px solid transparent;font-family:var(--serif)}
.tabs button.on{color:var(--ink);border-color:var(--ink);font-weight:700}

.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(0,1fr);gap:22px;align-items:start}
@media(max-width:820px){.grid{grid-template-columns:minmax(0,1fr)}}
.card{background:var(--card);border:1px solid var(--line);border-radius:4px;box-shadow:0 1px 0 rgba(0,0,0,.03),0 8px 22px -14px rgba(60,40,20,.35);position:relative}
.ch{display:flex;align-items:baseline;gap:8px;padding:14px 16px 10px;border-bottom:1px solid var(--line2)}
.ch h2{margin:0;font-family:var(--serif);font-size:16px;font-weight:700}
.ch .meta{font-family:var(--type);font-size:11px;color:var(--sub);letter-spacing:.05em}
.lnk{border:0;background:none;font-size:12px;color:var(--brown);padding:2px 4px;font-family:var(--serif)}

/* 장부 */
.ledger{width:100%;border-collapse:collapse}
.ledger td{padding:8px 10px;border-bottom:1px dashed var(--line2);vertical-align:middle;font-size:14px}
.ledger tr{cursor:pointer}
.ledger tr:hover td{background:rgba(184,137,47,.07)}
.ledger td.dt{width:70px;font-family:var(--type);font-size:12.5px;color:var(--sub);white-space:nowrap}
.ledger td.dt.rep{color:transparent}
.ledger td.am{text-align:right;font-family:var(--type);font-size:14px;white-space:nowrap;width:110px}
.ledger tr.in td.am{color:var(--forest)}
.ledger tr.save td.am{color:var(--brown)}
.ledger tr.ex td.it,.ledger tr.ex td.am{text-decoration:line-through;text-decoration-color:rgba(139,46,46,.55);color:var(--sub)}
.tg{display:inline-block;font-size:10.5px;font-family:var(--type);border:1px solid var(--line);border-radius:3px;padding:0 5px;margin-left:6px;color:var(--brown);vertical-align:1px;background:#fff8}
.tg.in{color:var(--forest)}.tg.save{color:var(--brown)}.tg.ex{color:var(--burg)}
.empty{padding:26px 16px;text-align:center;color:var(--sub);font-family:var(--serif)}

/* 영수증 */
.rcpt{padding:16px 18px 18px;font-family:var(--type);font-size:13.5px;background:#fffdf6;
  -webkit-mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;mask:radial-gradient(circle 6px at 50% 100%,transparent 98%,#000) 0 0/14px 100% repeat-x;padding-bottom:26px}
.rcpt .rt{text-align:center;font-weight:700;letter-spacing:.25em;font-size:12px;margin-bottom:2px}
.rcpt .rs{text-align:center;font-size:11px;color:var(--sub);margin-bottom:10px}
.rl{display:flex;justify-content:space-between;gap:10px;padding:3px 0}
.rl span:first-child{font-family:var(--body);font-size:13px}
.rl.dim{color:var(--sub)}
.rl.big{font-weight:700;font-size:17px;padding:6px 0}
.rl.big.neg{color:var(--forest)}.rl.big.pos{color:var(--burg)}
.dash{border-top:1.5px dashed #b9ab92;margin:8px 0}

/* 메모 */
.note{margin-top:22px;background:#fffef8;border:1px solid #e6dcc4;padding:22px 18px 16px;transform:rotate(-.6deg);box-shadow:0 10px 18px -12px rgba(60,40,20,.45);position:relative}
.note::before,.note::after{content:"";position:absolute;top:8px;width:13px;height:13px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff3c4,#c99a3a 55%,#7d5a18);box-shadow:0 2px 3px rgba(0,0,0,.3)}
.note::before{left:50%;margin-left:-6px}
.note::after{display:none}
.note .nh{font-family:var(--type);font-size:10.5px;letter-spacing:.2em;color:var(--sub);text-align:center;margin-bottom:6px}
.note textarea{width:100%;border:0;background:transparent;resize:none;outline:none;font-family:var(--hand);font-size:24px;line-height:1.25;min-height:58px;overflow:hidden;text-align:center}

/* 엄마 청구: 도서관 대출카드 */
.lib{margin-top:22px;background:#f6edd4;border:1px solid #cfbf9b}
.lib .lh{padding:12px 16px 8px;text-align:center;border-bottom:2px solid var(--burg)}
.lib .lh b{display:block;font-family:var(--serif);font-size:16px}
.lib .lh small{font-family:var(--type);font-size:10.5px;letter-spacing:.2em;color:var(--burg)}
.lt{width:100%;border-collapse:collapse;font-size:13px}
.lt th{font-family:var(--type);font-weight:400;font-size:10.5px;letter-spacing:.12em;color:var(--burg);border-bottom:1px solid var(--burg);padding:6px 8px;text-align:left}
.lt td{border-bottom:1px solid rgba(139,46,46,.25);padding:7px 8px;cursor:pointer}
.lt td.am{text-align:right;font-family:var(--type);white-space:nowrap}
.lt td.dt{font-family:var(--type);font-size:11.5px;color:var(--sub);white-space:nowrap;width:54px}
.cat{font-size:10.5px;border:1px solid currentColor;border-radius:3px;padding:0 4px;margin-left:5px;font-family:var(--type)}
.cat.옷{color:var(--burg)}.cat.공부{color:var(--forest)}.cat.그외{color:var(--brown)}
.ltot{padding:10px 14px 4px;font-family:var(--type);font-size:12.5px}
.ltot .rl span:first-child{font-size:12.5px}
.stampbtn{display:block;margin:10px 14px 14px;width:calc(100% - 28px);border:1.5px solid var(--burg);background:transparent;color:var(--burg);font-family:var(--type);font-weight:700;letter-spacing:.2em;padding:10px;border-radius:3px}
.stampbtn:hover{background:rgba(139,46,46,.06)}
.hist{padding:0 14px 14px}
.hist .hr{display:flex;align-items:center;gap:10px;padding:6px 0;border-top:1px dotted rgba(139,46,46,.3);cursor:pointer;font-size:13px}
.stamp{display:inline-grid;place-items:center;font-family:var(--type);font-weight:700;color:var(--burg);border:2px solid var(--burg);border-radius:50%;width:54px;height:54px;font-size:10px;line-height:1.05;text-align:center;transform:rotate(-12deg);opacity:.82;flex:none;letter-spacing:.04em}
.hist .hr .ht{flex:1}.hist .hr .ha{font-family:var(--type)}
.hdet{padding:2px 0 8px 64px;font-size:12.5px;color:var(--sub)}
.hdet div{display:flex;justify-content:space-between;padding:1px 0}
.bigstamp{position:fixed;left:50%;top:45%;z-index:80;width:190px;height:190px;margin:-95px 0 0 -95px;border-radius:50%;border:5px solid var(--burg);color:var(--burg);display:grid;place-items:center;text-align:center;font-family:var(--type);font-weight:700;font-size:24px;line-height:1.15;background:rgba(251,246,234,.6);pointer-events:none;animation:stamp .7s cubic-bezier(.2,1.4,.4,1) forwards}
@keyframes stamp{0%{opacity:0;transform:scale(2.4) rotate(-30deg)}60%{opacity:1;transform:scale(.92) rotate(-10deg)}100%{opacity:.9;transform:scale(1) rotate(-12deg)}}

/* 월정액 */
.subs{margin-top:22px}
.subs .sr{display:flex;align-items:center;gap:8px;padding:8px 16px;border-bottom:1px dashed var(--line2);font-size:13.5px;cursor:pointer}
.subs .sr .sa{font-family:var(--type)}
.subs .sr .sd{font-family:var(--type);font-size:11px;color:var(--sub)}
.subs .sr.off{opacity:.45}

/* 추가 버튼 */
.fab{position:fixed;right:max(18px,calc(50vw - 540px + 18px));bottom:calc(22px + env(safe-area-inset-bottom));z-index:40;width:58px;height:58px;border-radius:50%;border:0;background:var(--ink);color:var(--card);font-size:28px;line-height:1;box-shadow:0 8px 20px rgba(30,20,10,.3)}

/* 시트 */
.dim{position:fixed;inset:0;z-index:60;background:rgba(40,28,16,.35);display:none;align-items:flex-end;justify-content:center}
.dim.on{display:flex}
@media(min-width:640px){.dim{align-items:center}}
.sheet{background:var(--card);width:min(460px,100%);border-radius:14px 14px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom));box-shadow:0 -10px 30px rgba(0,0,0,.15);max-height:92vh;overflow-y:auto}
@media(min-width:640px){.sheet{border-radius:8px}}
.sheet h3{margin:0 0 12px;font-family:var(--serif);font-size:17px}
.fl{font-size:11.5px;color:var(--sub);margin:12px 0 5px;font-family:var(--serif)}
.inp{width:100%;border:1px solid var(--line);background:#fffdf7;border-radius:6px;padding:10px 12px;font-size:16px;outline:none}
.inp:focus{border-color:var(--brown)}
.inp.amt{font-family:var(--type);font-size:24px;text-align:right}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:#fffdf7;border-radius:999px;padding:6px 13px;font-size:13px}
.chip.on{background:var(--ink);color:var(--card);border-color:var(--ink)}
.chip.k-in.on{background:var(--forest);border-color:var(--forest)}
.chip.k-save.on{background:var(--brown);border-color:var(--brown)}
.chip.k-mom.on{background:var(--burg);border-color:var(--burg)}
.chk{display:flex;align-items:center;gap:8px;margin-top:14px;font-size:13.5px;cursor:pointer;user-select:none}
.chk i{width:18px;height:18px;border:1.5px solid var(--ink);border-radius:3px;display:grid;place-items:center;font-style:normal;font-size:13px}
.chk.on i::after{content:"✓"}
.acts{display:flex;gap:8px;margin-top:18px}
.acts button{flex:1;padding:12px;border-radius:7px;font-size:14.5px;border:1px solid var(--line);background:#fffdf7}
.acts .ok{background:var(--ink);color:var(--card);border-color:var(--ink);flex:2}
.acts .del{color:var(--burg);flex:none;padding:12px 16px}

/* 테마 */
.thlist .tr{display:flex;align-items:center;gap:10px;padding:10px 16px;border-bottom:1px dashed var(--line2);cursor:pointer}
.thlist .tr b{font-family:var(--serif);font-size:15px;flex:1}
.thlist .tr span{font-family:var(--type)}
.thlist .tr small{font-family:var(--type);color:var(--sub);font-size:11px}
.sync{font-family:var(--type);font-size:10.5px;color:var(--sub);letter-spacing:.08em}
.yrbar{display:flex;align-items:flex-end;gap:6px;height:120px;padding:16px 16px 6px}
.yrbar .b{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.yrbar .b i{display:block;width:100%;max-width:34px;background:var(--brown);border-radius:2px 2px 0 0;opacity:.8}
.yrbar .b.cur i{background:var(--burg);opacity:1}
.yrbar .b small{font-family:var(--type);font-size:10.5px;color:var(--sub)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Ledger<small id="syncTxt" class="sync">&nbsp;</small></div>
    <div class="sp"></div>
    <div class="mnav"><button id="pm" aria-label="이전 달">‹</button><span class="mm" id="mm"></span><button id="nm" aria-label="다음 달">›</button></div>
  </div>
  <div class="rule2"></div>
  <div class="tabs"><button data-v="month" class="on">이번 달</button><button data-v="theme">테마</button><button data-v="year">한 해</button></div>
  <div id="view"></div>
</div>
<button class="fab" id="fab" aria-label="기록 추가">+</button>
<div class="dim" id="dim"><div class="sheet" id="sheet"></div></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
/* ───── 데이터 ───── */
const FB_CONFIG={apiKey:"AIzaSyCboDDyAjbNBN6aPQXdQD0L9jk64ykWQ8o",projectId:"time-8d30b",databaseURL:"https://tracker-d3a39-default-rtdb.firebaseio.com/"};
const ROOT='money/money_v1', LK='money_cache_v1';
let db=null;try{firebase.initializeApp(FB_CONFIG,'moneyApp');db=firebase.app('moneyApp').database();}catch(e){db=null;}
let S={entries:{},claims:{},subs:{},notes:{}};
try{const c=JSON.parse(localStorage.getItem(LK)||'null');if(c)S=norm(c);}catch(e){}
let ready=false;   // 서버에서 한 번 읽기 전엔 아무것도 안 올림
function norm(d){d=d||{};['entries','claims','subs','notes'].forEach(k=>{if(!d[k]||typeof d[k]!=='object')d[k]={};});return d;}
const cache=()=>{try{localStorage.setItem(LK,JSON.stringify(S));}catch(e){}};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
function put(path,val){   // path 예: 'entries/abc'
  const [k,id]=path.split('/');
  if(val===null)delete S[k][id];else S[k][id]=val;
  cache();render();
  if(db&&ready)db.ref(ROOT+'/'+path).set(val).catch(()=>syncMsg('저장 실패 · 다시 시도해줘'));
  else if(db&&!ready)pending.push([path,val]);
}
const pending=[];
function syncMsg(t){document.getElementById('syncTxt').textContent=t;}

/* ───── 날짜·숫자 ───── */
const pad=n=>String(n).padStart(2,'0');
const today=()=>{const d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());};
let cur=today().slice(0,7);try{const v=localStorage.getItem('money_month');if(v)cur=v;}catch(e){}
let view='month';try{view=localStorage.getItem('money_view')||'month';}catch(e){}
const won=n=>Math.round(n).toLocaleString('ko-KR');
const par=n=>'('+won(n)+')';
const mLabel=m=>{const [y,mm]=m.split('-');return y+'. '+mm;};
const mAdd=(m,k)=>{let [y,mm]=m.split('-').map(Number);mm+=k;while(mm>12){mm-=12;y++;}while(mm<1){mm+=12;y--;}return y+'-'+pad(mm);};
const md=d=>{const [,m,dd]=d.split('-');return (+m)+'. '+(+dd);};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ───── 계산 ───── */
const ents=()=>Object.entries(S.entries).map(([id,e])=>({id,...e}));
function monthEnts(m){return ents().filter(e=>e.d&&e.d.slice(0,7)===m).sort((a,b)=>a.d.localeCompare(b.d)||(a.k==='in'?-1:0)-(b.k==='in'?-1:0)||a.id.localeCompare(b.id));}
function activeSubs(m){return Object.entries(S.subs).map(([id,s])=>({id,...s})).filter(s=>s.from<=m&&(!s.to||s.to>=m));}
function calc(m){
  const E=monthEnts(m);let out=0,inc=0,save=0,ex=0;const exs=[],th={};
  E.forEach(e=>{if(e.k==='out'){out+=e.a;if(e.ex){ex+=e.a;exs.push(e);}if(e.th)th[e.th]=(th[e.th]||0)+e.a;}else if(e.k==='in')inc+=e.a;else if(e.k==='save')save+=e.a;});
  const sub=activeSubs(m).reduce((s,x)=>s+x.a,0);
  return {E,out,inc,save,ex,exs,th,sub,net:out-inc,withSub:out-inc+sub};
}
const claims=()=>Object.entries(S.claims).map(([id,c])=>({id,...c}));

/* ───── 그리기 ───── */
function render(){
  document.getElementById('mm').textContent=mLabel(cur);
  document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.v===view));
  document.querySelector('.mnav').style.visibility=view==='month'?'visible':'hidden';
  const v=document.getElementById('view');
  if(view==='theme')v.innerHTML=themeView();else if(view==='year')v.innerHTML=yearView();else v.innerHTML=monthView();
  const ta=document.getElementById('noteTa');if(ta)fitTa(ta);
}
function monthView(){
  const C=calc(cur);let last='';
  const rows=C.E.map(e=>{const rep=e.d===last;last=e.d;
    const tags=(e.k==='in'?'<span class="tg in">들어옴</span>':e.k==='save'?'<span class="tg save">저축</span>':'')+(e.th?`<span class="tg">${esc(e.th)}</span>`:'')+(e.ex?'<span class="tg ex">빼고 계산</span>':'');
    return `<tr class="${e.k}${e.ex?' ex':''}" data-e="${e.id}"><td class="dt${rep?' rep':''}">${md(e.d)}</td><td class="it">${esc(e.t)}${tags}</td><td class="am">${e.k==='in'?par(e.a):won(e.a)}</td></tr>`;}).join('');
  const subRows=activeSubs(cur).map(s=>`<div class="rl dim"><span>${esc(s.t)}</span><span>${won(s.a)}</span></div>`).join('');
  const exLine=C.ex?`<div class="rl"><span>${C.exs.map(e=>esc(e.t)).join(', ')} 빼면</span><span>${won(C.withSub-C.ex)}</span></div>`:'';
  const thLines=Object.keys(C.th).length?'<div class="dash"></div>'+Object.entries(C.th).map(([t,a])=>`<div class="rl dim"><span>${esc(t)}</span><span>${won(a)}</span></div>`).join(''):'';
  const unpaid=claims().filter(c=>!c.paid).sort((a,b)=>a.d.localeCompare(b.d)||a.id.localeCompare(b.id));
  const ut=unpaid.reduce((s,c)=>s+c.a,0), byCat={};unpaid.forEach(c=>{const k=c.cat||'미분류';byCat[k]=(byCat[k]||0)+c.a;});
  const paidGroups={};claims().filter(c=>c.paid).forEach(c=>{(paidGroups[c.paid]=paidGroups[c.paid]||[]).push(c);});
  const hist=Object.keys(paidGroups).sort().reverse().map(d=>{const L=paidGroups[d];const t=L.reduce((s,c)=>s+c.a,0);
    return `<div class="hr" data-h="${d}"><span class="stamp">PAID<br>${(+d.slice(5,7))}.${(+d.slice(8))}</span><span class="ht">${L.length}건</span><span class="ha">${won(t)}</span></div>${openHist===d?`<div class="hdet">${L.map(c=>`<div><span>${esc(c.t)}${c.cat?`<span class="cat ${c.cat}">${c.cat}</span>`:''}</span><span>${won(c.a)}</span></div>`).join('')}<div style="margin-top:6px"><button class="lnk" data-unpay="${d}">이 정산 취소</button></div></div>`:''}`;}).join('');
  return `<div class="grid">
   <div>
    <div class="card"><div class="ch"><h2>${(+cur.slice(5))}월의 기록</h2><span class="meta">${C.E.length} entries</span></div>
     ${rows?`<table class="ledger">${rows}</table>`:'<div class="empty">—</div>'}</div>
    <div class="card subs"><div class="ch"><h2>월정액</h2><span class="sp"></span><button class="lnk" data-addsub="1">＋ 추가</button></div>
     ${Object.entries(S.subs).map(([id,s])=>{const on=s.from<=cur&&(!s.to||s.to>=cur);return `<div class="sr${on?'':' off'}" data-sub="${id}"><span style="flex:1">${esc(s.t)}</span><span class="sd">${mLabel(s.from)} ~ ${s.to?mLabel(s.to):''}</span><span class="sa">${won(s.a)}</span></div>`;}).join('')||'<div class="empty">—</div>'}</div>
   </div>
   <div>
    <div class="card rcpt"><div class="rt">RECEIPT</div><div class="rs">${mLabel(cur)}</div>
     <div class="rl"><span>쓴 돈</span><span>${won(C.out)}</span></div>
     <div class="rl"><span>들어온 돈</span><span>${par(C.inc)}</span></div>
     <div class="dash"></div>
     <div class="rl big ${C.net<0?'neg':'pos'}"><span>이번 달</span><span>${C.net<0?par(-C.net):won(C.net)}</span></div>
     ${subRows}
     <div class="rl"><span>월정액 포함</span><span>${C.withSub<0?par(-C.withSub):won(C.withSub)}</span></div>
     ${exLine}
     ${C.save?`<div class="rl dim"><span>저축</span><span>${won(C.save)}</span></div>`:''}
     ${thLines}
    </div>
    <div class="note"><div class="nh">NOTE · ${(+cur.slice(5))}월</div><textarea id="noteTa" rows="1">${esc(S.notes[cur]||'')}</textarea></div>
    <div class="card lib"><div class="lh"><small>MOM'S ACCOUNT</small><b>엄마 청구</b></div>
     ${unpaid.length?`<table class="lt"><tr><th>DATE</th><th>ITEM</th><th style="text-align:right">AMOUNT</th></tr>${unpaid.map(c=>`<tr data-c="${c.id}"><td class="dt">${md(c.d)}</td><td>${esc(c.t)}${c.cat?`<span class="cat ${c.cat}">${c.cat}</span>`:''}</td><td class="am">${won(c.a)}</td></tr>`).join('')}</table>
      <div class="ltot">${Object.entries(byCat).map(([k,a])=>`<div class="rl dim"><span>${k}</span><span>${won(a)}</span></div>`).join('')}<div class="dash"></div><div class="rl big pos"><span>받을 돈</span><span>${won(ut)}</span></div></div>
      <button class="stampbtn" id="settle">받았어요 · 정산 도장</button>`:'<div class="empty">받을 돈 없음</div>'}
     ${hist?`<div class="hist">${hist}</div>`:''}
    </div>
   </div></div>`;
}
let openHist=null;
function themeView(){
  const T={};ents().filter(e=>e.th&&e.k==='out').forEach(e=>{const t=T[e.th]||(T[e.th]={a:0,n:0,from:e.d,to:e.d});t.a+=e.a;t.n++;if(e.d<t.from)t.from=e.d;if(e.d>t.to)t.to=e.d;});
  const keys=Object.keys(T).sort((a,b)=>T[b].to.localeCompare(T[a].to));
  if(openTheme&&T[openTheme]){
    const L=ents().filter(e=>e.th===openTheme).sort((a,b)=>a.d.localeCompare(b.d));
    return `<div class="card"><div class="ch"><button class="lnk" data-th="">‹ 테마</button><h2>${esc(openTheme)}</h2><span class="sp"></span><span class="meta">${won(T[openTheme].a)}</span></div>
     <table class="ledger">${L.map(e=>`<tr class="${e.k}" data-e="${e.id}"><td class="dt">${md(e.d)}</td><td class="it">${esc(e.t)}</td><td class="am">${e.k==='in'?par(e.a):won(e.a)}</td></tr>`).join('')}</table></div>`;
  }
  return `<div class="card thlist"><div class="ch"><h2>테마</h2></div>
   ${keys.map(k=>`<div class="tr" data-th="${esc(k)}"><b>${esc(k)}</b><small>${md(T[k].from)} – ${md(T[k].to)} · ${T[k].n}건</small><span>${won(T[k].a)}</span></div>`).join('')||'<div class="empty">—</div>'}</div>`;
}
let openTheme=null;
function yearView(){
  const y=cur.slice(0,4);const ms=[...Array(12)].map((_,i)=>y+'-'+pad(i+1));
  const C=ms.map(m=>calc(m));const max=Math.max(1,...C.map(c=>Math.max(0,c.out)));
  const tot=C.reduce((s,c)=>s+c.out,0),inc=C.reduce((s,c)=>s+c.inc,0),sv=C.reduce((s,c)=>s+c.save,0);
  return `<div class="grid"><div class="card"><div class="ch"><h2>${y}년 쓴 돈</h2></div>
   <div class="yrbar">${C.map((c,i)=>`<div class="b${ms[i]===cur?' cur':''}" data-m="${ms[i]}"><i style="height:${Math.round(c.out/max*86)}px"></i><small>${i+1}</small></div>`).join('')}</div>
   <table class="ledger">${C.map((c,i)=>c.E.length?`<tr data-m="${ms[i]}"><td class="dt">${i+1}월</td><td class="it">${won(c.out)}<span class="tg in">${par(c.inc)}</span></td><td class="am">${c.withSub<0?par(-c.withSub):won(c.withSub)}</td></tr>`:'').join('')}</table></div>
   <div class="card rcpt"><div class="rt">${y}</div><div class="rs">TOTAL</div>
    <div class="rl"><span>쓴 돈</span><span>${won(tot)}</span></div><div class="rl"><span>들어온 돈</span><span>${par(inc)}</span></div>
    <div class="dash"></div><div class="rl big"><span>합계</span><span>${won(tot-inc)}</span></div>${sv?`<div class="rl dim"><span>저축</span><span>${won(sv)}</span></div>`:''}</div></div>
   <div style="display:flex;gap:14px;justify-content:flex-end;margin-top:18px"><button class="lnk" id="bkOut">백업 받기</button><label class="lnk" style="cursor:pointer">가져오기<input type="file" id="bkIn" accept=".json,application/json" hidden></label></div>`;
}
function fitTa(t){t.style.height='auto';t.style.height=Math.max(58,t.scrollHeight)+'px';}

/* ───── 기록 시트 ───── */
let F=null;
function openSheet(kind,id){
  if(kind==='claim'){const c=S.claims[id];F={id,k:'mom',d:c.d,t:c.t,a:c.a,cat:c.cat||'',paid:c.paid||''};}
  else if(id){const e=S.entries[id];F={id,k:e.k,d:e.d,t:e.t,a:e.a,th:e.th||'',ex:!!e.ex};}
  else{const t=today();F={id:null,k:'out',d:t.slice(0,7)===cur?t:cur+'-01',t:'',a:'',th:'',ex:false,cat:''};}
  drawSheet();document.getElementById('dim').classList.add('on');
  setTimeout(()=>{const a=document.getElementById('fA');if(a&&!F.id)a.focus();},60);
}
function themes(){return [...new Set(ents().map(e=>e.th).filter(Boolean))];}
function drawSheet(){
  const K=[['out','쓴 돈'],['in','들어옴'],['save','저축'],['mom','엄마 청구']];
  document.getElementById('sheet').innerHTML=`<h3>${F.id?'고치기':'기록하기'}</h3>
   <div class="chips">${K.map(([k,l])=>`<button class="chip k-${k}${F.k===k?' on':''}" data-k="${k}" ${F.id&&((F.k==='mom')!==(k==='mom'))?'disabled style="opacity:.35"':''}>${l}</button>`).join('')}</div>
   <div class="fl">금액</div><input class="inp amt" id="fA" inputmode="numeric" value="${F.a===''?'':won(F.a)}">
   <div class="fl">항목</div><input class="inp" id="fT" value="${esc(F.t)}">
   <div class="row2"><div><div class="fl">날짜</div><input class="inp" id="fD" type="date" value="${F.d}"></div>
    ${F.k==='mom'?'<div></div>':`<div><div class="fl">테마</div><input class="inp" id="fTh" list="thl" value="${esc(F.th)}"><datalist id="thl">${themes().map(t=>`<option value="${esc(t)}">`).join('')}</datalist></div>`}</div>
   ${F.k==='mom'?`<div class="fl">분류</div><div class="chips">${['옷','공부','그외'].map(c=>`<button class="chip${F.cat===c?' on':''}" data-cat="${c}">${c}</button>`).join('')}</div>`:''}
   ${F.k==='out'?`<div class="chk${F.ex?' on':''}" id="fEx"><i></i>이번 달 합계에서 빼고도 보기</div>`:''}
   <div class="acts">${F.id?'<button class="del" id="fDel">삭제</button>':''}<button id="fNo">닫기</button><button class="ok" id="fOk">저장</button></div>`;
}
function readSheet(){
  const g=id=>document.getElementById(id);
  F.a=+String(g('fA').value).replace(/[^\d]/g,'')||0;F.t=g('fT').value.trim();F.d=g('fD').value||F.d;
  if(g('fTh'))F.th=g('fTh').value.trim();
}
function saveSheet(){
  readSheet();if(!F.a||!F.t){document.getElementById(!F.a?'fA':'fT').focus();return;}
  if(F.k==='mom'){const id=F.id||uid('c');const o={d:F.d,t:F.t,a:F.a,cat:F.cat||'',paid:F.paid||''};put('claims/'+id,o);}
  else{const id=F.id||uid('e');const o={d:F.d,t:F.t,a:F.a,k:F.k};if(F.th)o.th=F.th;if(F.k==='out'&&F.ex)o.ex=1;put('entries/'+id,o);
    if(F.d.slice(0,7)!==cur&&!F.id){cur=F.d.slice(0,7);render();}}
  closeSheet();
}
function closeSheet(){document.getElementById('dim').classList.remove('on');F=null;}
document.getElementById('sheet').addEventListener('click',e=>{
  const k=e.target.closest('[data-k]');if(k&&!k.disabled){readSheet();F.k=k.dataset.k;drawSheet();return;}
  const c=e.target.closest('[data-cat]');if(c){readSheet();F.cat=F.cat===c.dataset.cat?'':c.dataset.cat;drawSheet();return;}
  if(e.target.closest('#fEx')){readSheet();F.ex=!F.ex;drawSheet();return;}
  if(e.target.id==='fOk')saveSheet();
  if(e.target.id==='fNo')closeSheet();
  if(e.target.id==='fDel'&&confirm('지울까?')){put((F.k==='mom'?'claims/':'entries/')+F.id,null);closeSheet();}
});
document.getElementById('sheet').addEventListener('input',e=>{if(e.target.id==='fA'){const v=e.target.value.replace(/[^\d]/g,'');e.target.value=v?(+v).toLocaleString('ko-KR'):'';}});
document.getElementById('sheet').addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'&&!e.isComposing){e.preventDefault();saveSheet();}});
document.getElementById('dim').addEventListener('click',e=>{if(e.target.id==='dim')closeSheet();});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet();});

/* 월정액 시트 */
function subSheet(id){
  const s=id?S.subs[id]:{t:'',a:'',from:cur,to:''};
  document.getElementById('sheet').innerHTML=`<h3>월정액</h3>
   <div class="fl">이름</div><input class="inp" id="sT" value="${esc(s.t)}">
   <div class="fl">한 달 금액</div><input class="inp amt" id="sA" inputmode="numeric" value="${s.a===''?'':won(s.a)}">
   <div class="row2"><div><div class="fl">시작</div><input class="inp" id="sF" type="month" value="${s.from}"></div><div><div class="fl">끝 (해지한 달)</div><input class="inp" id="sTo" type="month" value="${s.to||''}"></div></div>
   <div class="acts">${id?'<button class="del" id="sDel">삭제</button>':''}<button id="sNo">닫기</button><button class="ok" id="sOk">저장</button></div>`;
  document.getElementById('dim').classList.add('on');
  const sh=document.getElementById('sheet');
  sh.onclick=e=>{
    if(e.target.id==='sNo'){closeSheet();sh.onclick=null;}
    if(e.target.id==='sDel'&&confirm('지울까?')){put('subs/'+id,null);closeSheet();sh.onclick=null;}
    if(e.target.id==='sOk'){const o={t:document.getElementById('sT').value.trim(),a:+document.getElementById('sA').value.replace(/[^\d]/g,'')||0,from:document.getElementById('sF').value||cur};
      const to=document.getElementById('sTo').value;if(to)o.to=to;if(!o.t||!o.a)return;put('subs/'+(id||uid('u')),o);closeSheet();sh.onclick=null;}
  };
}

/* ───── 화면 이벤트 ───── */
document.getElementById('view').addEventListener('click',e=>{
  const r=e.target.closest('[data-e]');if(r){openSheet('entry',r.dataset.e);return;}
  const c=e.target.closest('[data-c]');if(c){openSheet('claim',c.dataset.c);return;}
  const s=e.target.closest('[data-sub]');if(s){subSheet(s.dataset.sub);return;}
  if(e.target.closest('[data-addsub]')){subSheet(null);return;}
  const h=e.target.closest('[data-h]');if(h){openHist=openHist===h.dataset.h?null:h.dataset.h;render();return;}
  const up=e.target.closest('[data-unpay]');if(up){if(confirm('이 날 정산을 취소하고 다시 받을 돈으로 돌릴까?')){claims().filter(c=>c.paid===up.dataset.unpay).forEach(c=>{const o={...S.claims[c.id],paid:''};put('claims/'+c.id,o);});openHist=null;}return;}
  if(e.target.id==='settle'){const L=claims().filter(c=>!c.paid);const t=L.reduce((s,c)=>s+c.a,0);
    if(!confirm(`${L.length}건 · ${won(t)}원\n오늘 받은 걸로 도장 찍을까?`))return;
    const d=today();L.forEach(c=>{const o={...S.claims[c.id],paid:d};put('claims/'+c.id,o);});
    const st=document.createElement('div');st.className='bigstamp';st.innerHTML=`PAID<br>${(+d.slice(5,7))}.${(+d.slice(8))}`;document.body.appendChild(st);setTimeout(()=>st.remove(),1500);return;}
  const th=e.target.closest('[data-th]');if(th){openTheme=th.dataset.th||null;render();return;}
  const m=e.target.closest('[data-m]');if(m){cur=m.dataset.m;view='month';save2();render();return;}
});
document.getElementById('view').addEventListener('change',e=>{
  if(e.target.id!=='bkIn'||!e.target.files[0])return;
  e.target.files[0].text().then(t=>{const d=JSON.parse(t);const up={};let n=0;
    ['entries','claims','subs','notes'].forEach(k=>Object.entries(d[k]||{}).forEach(([id,v])=>{if(S[k][id]===undefined){S[k][id]=v;up[k+'/'+id]=v;n++;}}));
    if(!n){alert('새로 들어갈 기록이 없어요');return;}
    if(!confirm(n+'개 기록을 넣을까?')){Object.keys(up).forEach(p=>{const [k,id]=p.split('/');delete S[k][id];});return;}
    cache();if(db&&ready)db.ref(ROOT).update(up);else Object.entries(up).forEach(x=>pending.push(x));render();
  }).catch(()=>alert('파일을 못 읽었어요'));e.target.value='';
});
document.getElementById('view').addEventListener('click',e=>{if(e.target.id!=='bkOut')return;
  const b=new Blob([JSON.stringify({entries:S.entries,claims:S.claims,subs:S.subs,notes:S.notes},null,1)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='ledger_backup_'+today()+'.json';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000);});
let noteT=null;
document.getElementById('view').addEventListener('input',e=>{if(e.target.id==='noteTa'){fitTa(e.target);const v=e.target.value,m=cur;clearTimeout(noteT);noteT=setTimeout(()=>{S.notes[m]=v;cache();if(db&&ready)db.ref(ROOT+'/notes/'+m).set(v||null).catch(()=>{});},500);}});
function save2(){try{localStorage.setItem('money_month',cur);localStorage.setItem('money_view',view);}catch(e){}}
document.getElementById('pm').onclick=()=>{cur=mAdd(cur,-1);save2();render();};
document.getElementById('nm').onclick=()=>{cur=mAdd(cur,1);save2();render();};
document.querySelector('.tabs').onclick=e=>{const b=e.target.closest('button');if(!b)return;view=b.dataset.v;openTheme=null;save2();render();};
document.getElementById('fab').onclick=()=>openSheet('entry',null);

/* ───── 동기화 ───── */
render();
if(db){
  syncMsg('불러오는 중…');
  db.ref(ROOT).on('value',snap=>{
    const d=snap.val();
    S=norm(d);ready=true;
    if(pending.length){const up={};pending.forEach(([p,v])=>up[p]=v);pending.length=0;db.ref(ROOT).update(up);}
    cache();syncMsg('synced');
    const ae=document.activeElement;if(ae&&ae.id==='noteTa')return;   // 메모 쓰는 중엔 화면 안 다시 그림
    render();
  },()=>syncMsg('오프라인 · 이 기기에만 저장 중'));
}else syncMsg('오프라인');
</script>
</body>
</html>
