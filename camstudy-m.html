<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#1c1713">
<title>캠스터디</title>
<link rel="manifest" href="camstudy-m.webmanifest">
<link rel="icon" href="camstudy-m-icon-192.png">
<link rel="apple-touch-icon" href="camstudy-m-icon-192.png">
<style>
@font-face{font-family:"Paperlogy";src:url("fonts/Paperlogy-3Light.ttf") format("truetype");font-weight:300}
@font-face{font-family:"Paperlogy";src:url("fonts/Paperlogy-4Regular.ttf") format("truetype");font-weight:400}
@font-face{font-family:"Paperlogy";src:url("fonts/Paperlogy-5Medium.ttf") format("truetype");font-weight:500}
@font-face{font-family:"Paperlogy";src:url("fonts/Paperlogy-6SemiBold.ttf") format("truetype");font-weight:600}
@font-face{font-family:"Paperlogy";src:url("fonts/Paperlogy-7Bold.ttf") format("truetype");font-weight:700}
:root{--bg:#1c1713;--sky:#BEE9F2;--card:#2a211b;--line:#4a4039}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{margin:0;height:100%;background:var(--bg);color:#fff;font-family:"Paperlogy",system-ui,sans-serif;overflow:hidden;overscroll-behavior:none;touch-action:none}
#stage{position:fixed;inset:0;background:var(--bg)}
#tint{position:absolute;pointer-events:none;mix-blend-mode:soft-light}
video{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;background:var(--bg)}
#ov{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
#bar{position:absolute;left:0;right:0;top:0;padding:calc(env(safe-area-inset-top) + 10px) 12px 10px;display:flex;align-items:center;gap:8px;background:linear-gradient(rgba(28,23,19,.78),rgba(28,23,19,0));z-index:5;transition:opacity .25s}
#bar.hide,#dock.hide{opacity:0;pointer-events:none}
#bar.keep.hide{opacity:1;background:none}
#bar.keep.hide .b{opacity:0;pointer-events:none}
#bar.keep #tm{text-shadow:0 1px 8px rgba(0,0,0,.65)}
#dock{position:absolute;left:0;right:0;bottom:0;padding:14px 12px calc(env(safe-area-inset-bottom) + 14px);display:flex;justify-content:center;gap:8px;background:linear-gradient(rgba(28,23,19,0),rgba(28,23,19,.78));z-index:5;transition:opacity .25s}
#dock .b{width:43px;height:43px;border-radius:22px}
@media (orientation:landscape) and (max-height:520px){
  #bar{padding:calc(env(safe-area-inset-top) + 6px) 64px 6px 12px}
  #tm{font-size:19px}
  #dock{left:auto;top:0;bottom:0;right:0;flex-direction:column;justify-content:center;align-items:center;gap:6px;padding:6px calc(env(safe-area-inset-right) + 8px) 6px 14px;background:linear-gradient(90deg,rgba(28,23,19,0),rgba(28,23,19,.72))}
  #dock .b{width:36px;height:36px;border-radius:18px}
  #dock .b svg{width:19px;height:19px}
  #toast{bottom:calc(env(safe-area-inset-bottom) + 24px)}
  #sheet{left:50%;right:auto;width:min(560px,92vw);max-height:92vh;transform:translate(-50%,105%)}
  #sheet.open{transform:translate(-50%,0)}
}
#bFs{width:36px;height:36px;border-radius:18px}
#tm{font-weight:700;font-size:26px;letter-spacing:.5px;color:var(--sky);display:flex;align-items:center;gap:8px;min-width:0}
#dot{width:9px;height:9px;border-radius:50%;background:#6b5d52;flex:none}
#dot.on{background:var(--sky)}
#sp{flex:1}
#bar{justify-content:flex-start}
.b{width:42px;height:42px;border-radius:21px;border:0;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.b.on{background:var(--sky);color:var(--bg)}
.b svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.b svg .f{fill:currentColor;stroke:none}
#sheet{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-radius:22px 22px 0 0;padding:18px 18px calc(env(safe-area-inset-bottom) + 18px);z-index:20;transform:translateY(105%);transition:transform .25s;max-height:78vh;overflow:auto;touch-action:pan-y}
#sheet.open{transform:none}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:15;display:none}
#scrim.open{display:block}
.h{color:var(--sky);font-size:11px;font-weight:700;margin:14px 0 6px}
.h:first-child{margin-top:0}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px}
.pill{flex:1;height:38px;border-radius:19px;border:0;background:rgba(255,255,255,.13);color:#fff;font:inherit;font-size:13px;font-weight:700}
.pill.on{background:var(--sky);color:var(--bg)}
.pill.go{background:var(--sky);color:var(--bg)}
select,textarea,input[type=text]{width:100%;background:rgba(255,255,255,.12);border:0;border-radius:10px;padding:10px 12px;color:#fff;font:inherit;font-size:14px}
select option{color:#000}
textarea{resize:none;height:64px}
input[type=range]{flex:1;accent-color:var(--sky)}
.dim{color:rgba(255,255,255,.6);font-size:12px;line-height:1.5}
#prog{height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;display:none;margin:10px 0}
#prog i{display:block;height:100%;width:0;background:var(--sky)}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translateX(-50%);background:rgba(42,33,27,.94);border:1px solid var(--line);border-radius:18px;padding:9px 16px;font-size:13px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;max-width:88vw;text-align:center}
#toast.show{opacity:1}
#start{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;z-index:4;pointer-events:none}
#start button{pointer-events:auto;height:46px;padding:0 26px;border-radius:23px;border:0;background:var(--sky);color:var(--bg);font:inherit;font-weight:700;font-size:15px}
</style>
</head>
<body>
<div id="stage">
  <video id="v" playsinline muted autoplay></video>
  <div id="tint"></div>
  <canvas id="ov"></canvas>
  <div id="start"><button id="camBtn">카메라 켜기</button></div>
  <div id="bar">
    <div id="tm"><span id="dot"></span><span id="clock">00:00:00</span></div>
    <div id="sp"></div>
    <button class="b" id="bAdj" aria-label="화면 보정" style="width:36px;height:36px;border-radius:18px;margin-right:8px"><svg viewBox="0 0 20 20"><path d="M3.5 6h13M3.5 14h13"/><circle cx="7" cy="6" r="2" fill="#1c1713"/><circle cx="13" cy="14" r="2" fill="#1c1713"/></svg></button>
    <button class="b" id="bFs" aria-label="전체화면"><svg viewBox="0 0 20 20"><path d="M3.5 7.5v-4h4M16.5 7.5v-4h-4M3.5 12.5v4h4M16.5 12.5v4h-4"/></svg></button>
  </div>
  <div id="dock">
    <button class="b" id="bFriend" aria-label="친구"><svg viewBox="0 0 20 20"><circle class="f" cx="10" cy="7" r="3.3"/><path class="f" d="M3.6 17c0-4.6 12.8-4.6 12.8 0z"/></svg></button>
    <button class="b" id="bT" aria-label="글씨"><svg viewBox="0 0 20 20"><path d="M4.5 5.5V4h11v1.5M10 4v12M7.5 16h5"/></svg></button>
    <button class="b" id="bPlan" aria-label="오늘 계획"><svg viewBox="0 0 20 20"><rect x="4" y="3" width="12" height="14" rx="2"/><path d="M7 7.5h6M7 10.5h6M7 13.5h3.5"/></svg></button>
    <button class="b on" id="bTab" aria-label="타임테이블"><svg viewBox="0 0 20 20"><rect x="3" y="3.5" width="14" height="13" rx="2"/><path d="M3 8h14M3 12.3h14M8.6 8v8.5"/></svg></button>
    <button class="b" id="bFlip" aria-label="카메라 전환"><svg viewBox="0 0 20 20"><rect x="2.5" y="5.5" width="15" height="10" rx="2.2"/><path d="M7.5 5.5l1-2h3l1 2"/><path d="M8 10.5a2.2 2.2 0 0 1 3.8-1.3M12 10.5a2.2 2.2 0 0 1-3.8 1.3"/></svg></button>
    <button class="b" id="bRun" aria-label="시작/정지"><svg viewBox="0 0 20 20" id="runIc"><path class="f" d="M7 4.5v11l8.5-5.5z"/></svg></button>
    <button class="b" id="bSave" aria-label="저장"><svg viewBox="0 0 20 20"><path d="M10 12.5V3.5M6.5 6.5L10 3l3.5 3.5M4.5 10.5v4.5a1.5 1.5 0 0 0 1.5 1.5h8a1.5 1.5 0 0 0 1.5-1.5v-4.5"/></svg></button>
  </div>
</div>
<div id="scrim"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
"use strict";
const SKY = "#BEE9F2", BG = "#1c1713";
const PLAN_DB = "https://tracker-d3a39-default-rtdb.firebaseio.com/study_records/my_study_data_final10/";
const $ = s => document.querySelector(s);
const NATIVE = !!(window.Capacitor && Capacitor.isNativePlatform && Capacitor.isNativePlatform());
const FD = () => (window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.FaceDetect) || null;
const FONT = '"Paperlogy", system-ui, sans-serif';

/* ───────── 저장소 ───────── */
function load(k, d) { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function save(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }

let S = load("csm_settings", {
  tab: true, plan: "off",
  text: { str: "", size: 0.09, color: "#ffffff", ow: 3, wt: 700, fx: 0.08, fy: 0.42 },
  items: { tab: { fx: 0.04, fy: 0.12, fw: 0.40, hs: 1 }, plan: { fx: 0.5, fy: 0.12, fw: 0.46 }, friend: { fx: 0.04, fy: 0.62, fw: 0.28 } },
  interval: 3, cam: -1, facing: "user", flay: "off", rep: null
});
if (!S.items.friend) S.items.friend = { fx: 0.04, fy: 0.62, fw: 0.28 };
if (S.items.tab.hs == null) S.items.tab.hs = 1;
if (!S.facing) S.facing = "user";
if (!S.flay) S.flay = "off";
if (!S.text.wt) S.text.wt = 700;
if (S.keepClock == null) S.keepClock = true;
if (!S.adj) S.adj = { mirror: true, bright: 0, contrast: 100, sat: 100, warm: 0 };
let DAYS = load("csm_days", {});          // { "2026-11-24": [144 cells of seconds] }
function persistSettings() { save("csm_settings", S); }

function dayKey(d = new Date()) {         // 새벽 5시 기준
  const x = new Date(d.getTime() - 5 * 3600 * 1000);
  return x.getFullYear() + "-" + String(x.getMonth() + 1).padStart(2, "0") + "-" + String(x.getDate()).padStart(2, "0");
}
function cellIndex(d = new Date()) {
  const m = ((d.getHours() * 60 + d.getMinutes()) - 300 + 1440) % 1440;
  return Math.min(143, Math.floor(m / 10));
}
function todayCells() { const k = dayKey(); if (!DAYS[k]) DAYS[k] = new Array(144).fill(0); return DAYS[k]; }
function total(cells) { return cells.reduce((a, b) => a + b, 0); }
function hms(s) {
  s = Math.floor(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return [h, m, x].map(n => String(n).padStart(2, "0")).join(":");
}

/* ───────── 프레임 DB (IndexedDB) ───────── */
let _db = null;
function db() {
  if (_db) return _db;
  _db = new Promise((res, rej) => {
    const r = indexedDB.open("csm", 3);
    r.onupgradeneeded = () => {
      const d = r.result;
      if (!d.objectStoreNames.contains("frames")) d.createObjectStore("frames");
      if (!d.objectStoreNames.contains("friends")) d.createObjectStore("friends");
      if (!d.objectStoreNames.contains("stickers")) d.createObjectStore("stickers");
    };
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  });
  return _db;
}
function tx(mode, name = "frames") { return db().then(d => d.transaction(name, mode).objectStore(name)); }
function idbReq(r) { return new Promise((res, rej) => { r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }); }
const frameCount = {};                       // day -> next index
async function putFrame(day, blob, cam) {
  if (frameCount[day] == null) {
    const st = await tx("readonly");
    const keys = await idbReq(st.getAllKeys(IDBKeyRange.bound(day + "|", day + "|￿")));
    frameCount[day] = keys.length;
  }
  const i = ++frameCount[day];
  const st = await tx("readwrite");
  st.put({ b: blob, c: cam || [0, 0, 1, 1] }, day + "|" + String(i).padStart(6, "0"));
}
async function loadFrame(k) {        // { bmp, c:[x,y,w,h] 카메라 영역(0~1) }
  const v_ = await getFrame(k), blob = v_ instanceof Blob ? v_ : v_.b, c = v_ instanceof Blob ? [0, 0, 1, 1] : v_.c;
  return { bmp: await createImageBitmap(blob), c };
}
async function allFrameKeys() { const st = await tx("readonly"); return idbReq(st.getAllKeys()); }
async function getFrame(k) { const st = await tx("readonly"); return idbReq(st.get(k)); }
async function delDay(day) {
  const st = await tx("readwrite");
  st.delete(IDBKeyRange.bound(day + "|", day + "|￿"));
  delete frameCount[day];
}

/* ───────── 카메라 ───────── */
const v = $("#v");
let stream = null, devices = [], camOn = false;
async function listCams() {
  try { devices = (await navigator.mediaDevices.enumerateDevices()).filter(d => d.kind === "videoinput"); } catch (e) { devices = []; }
}
async function startCam(idx) {
  stopCam();
  const c = { audio: false, video: { width: { ideal: 1280 }, height: { ideal: 720 } } };
  if (idx >= 0 && devices[idx] && devices[idx].deviceId) c.video.deviceId = { exact: devices[idx].deviceId };
  else c.video.facingMode = { ideal: S.facing };
  stream = await navigator.mediaDevices.getUserMedia(c);
  v.srcObject = stream;
  await v.play().catch(() => {});
  camOn = true;
  $("#start").style.display = "none";
  await listCams();
  S.cam = idx; persistSettings();
  
}
function stopCam() { if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; camOn = false; }
$("#camBtn").onclick = async () => {
  try { await startCam(S.cam); } catch (e) { toast("카메라를 켤 수 없어요. 권한을 확인해주세요"); }
};
let flipTimer = 0, flipLong = false;
$("#bFlip").addEventListener("pointerdown", () => {
  flipLong = false; clearTimeout(flipTimer);
  flipTimer = setTimeout(async () => {
    flipLong = true;
    await listCams();
    if (!devices.length) { toast("카메라를 먼저 켜주세요"); return; }
    const cur = stream ? stream.getVideoTracks()[0].getSettings().deviceId : null;
    openSheet(`<div class="h">카메라 고르기</div>` + devices.map((d, i) =>
      `<div class="row"><button class="pill ${d.deviceId === cur ? "on" : ""}" data-i="${i}">${(d.label || "카메라 " + (i + 1)).replace(/</g, "")}</button></div>`).join(""));
    sheet.onclick = async e => {
      const i = e.target.dataset && e.target.dataset.i; if (i == null) return;
      try { await startCam(+i); closeSheet(); } catch (er) { toast("이 카메라는 쓸 수 없어요"); }
    };
  }, 550);
});
["pointerup", "pointercancel", "pointerleave"].forEach(ev => $("#bFlip").addEventListener(ev, () => clearTimeout(flipTimer)));
$("#bFlip").onclick = async () => {
  if (flipLong) return;
  try {
    if (!camOn) { await startCam(S.cam); return; }
    S.facing = S.facing === "user" ? "environment" : "user"; S.cam = -1; S.adj.mirror = S.facing === "user"; persistSettings();
    await startCam(-1);
    toast(S.facing === "user" ? "전면 카메라" : "후면 카메라 (길게 누르면 카메라 고르기)");
  } catch (e) { toast("카메라를 바꿀 수 없어요"); }
};

/* ───────── 그리기 ───────── */
const ov = $("#ov"), octx = ov.getContext("2d");
let W = 0, H = 0, DPR = 1;
function fit() {
  DPR = Math.min(2, window.devicePixelRatio || 1);
  W = innerWidth; H = innerHeight;
  ov.width = W * DPR; ov.height = H * DPR;
}
addEventListener("resize", () => { fit(); render(); });

function rr(c, x, y, w, h, r) { c.beginPath(); c.roundRect ? c.roundRect(x, y, w, h, r) : c.rect(x, y, w, h); }

function drawTable(c, x, y, w, hs = 1) {
  const s = w / 300, pad = 12 * s, head = 34 * s, rowH = 11.2 * s * hs;
  const cells = todayCells();
  const h = head + 24 * rowH + pad;
  c.save();
  rr(c, x, y, w, h, 16 * s); c.fillStyle = "rgba(44,35,29,.88)"; c.fill();
  c.strokeStyle = "rgba(255,255,255,.14)"; c.lineWidth = Math.max(1, s); c.stroke();
  const d = new Date(new Date().getTime() - 5 * 3600 * 1000);
  c.fillStyle = "#fff"; c.font = `700 ${12 * s}px ${FONT}`; c.textBaseline = "middle";
  c.fillText(`${d.getMonth() + 1}월 ${d.getDate()}일`, x + pad, y + head / 2 + 1 * s);
  c.textAlign = "right"; c.fillStyle = SKY; c.fillText(hms(total(cells)), x + w - pad, y + head / 2 + 1 * s);
  c.textAlign = "left";
  const gx = x + pad + 18 * s, gw = w - pad * 2 - 18 * s, cw = gw / 6;
  for (let r = 0; r < 24; r++) {
    const yy = y + head + r * rowH, hr = (5 + r) % 24;
    c.fillStyle = "rgba(255,255,255,.5)"; c.font = `${7 * s}px ${FONT}`;
    c.fillText(String(hr).padStart(2, "0"), x + pad, yy + rowH / 2);
    for (let k = 0; k < 6; k++) {
      const cx = gx + k * cw, f = Math.min(1, (cells[r * 6 + k] || 0) / 600);
      c.fillStyle = "rgba(255,255,255,.08)"; c.fillRect(cx + .5 * s, yy + .5 * s, cw - 1 * s, rowH - 1 * s);
      if (f > 0) { c.fillStyle = SKY; c.fillRect(cx + .5 * s, yy + .5 * s, (cw - 1 * s) * f, rowH - 1 * s); }
    }
  }
  c.restore();
  return h;
}

/* 오늘 계획 */
let planData = null;
function planText(t) { return String(t || "").replace(/<br\s*\/?>/gi, " ").replace(/<[^>]+>/g, "").replace(/\s+/g, " ").trim(); }
function planHex(h) { h = String(h || ""); if (/^[0-9a-f]{6}$/i.test(h)) h = "#" + h; return /^#[0-9a-f]{6}$/i.test(h) ? h : null; }
function plist(x) { return Array.isArray(x) ? x.filter(v => v != null) : (x && typeof x === "object" ? Object.values(x).filter(v => v != null) : []); }
function pparse(v) { if (typeof v === "string") { try { return JSON.parse(v); } catch (e) { return null; } } return v; }
async function fetchPlan() {
  try {
    const get = async n => (await fetch(PLAN_DB + n + ".json?t=" + Date.now())).json();
    const P = pparse(await get("plannerData")) || {}, T = plist(pparse(await get("plannerTags")));
    const d = new Date(Date.now() - 5 * 3600 * 1000), key = (d.getMonth() + 1) + "." + d.getDate();
    const day = P[key] || { items: [] }, rows = [];
    for (const it of plist(day.items)) {
      const t = T.find(x => x.id === it.tag) || {}, col = planHex(t.color) || "#c9c9c9";
      rows.push({ tag: String(t.name || ""), col, text: planText(it.text), hl: planHex(it.hl), done: !!it.done, sub: false });
      for (const sb of plist(it.subItems)) rows.push({ tag: "", col, text: planText(sb.text), hl: planHex(sb.hl), done: !!sb.done, sub: true });
    }
    planData = { rows, bg: planHex(day.bgColor) || "#e8f1f9" };
    render();
  } catch (e) {}
}
function planHeight(w) { const n = Math.max(1, planData ? planData.rows.length : 1); return (14 + n * 28 + 14) * (w / 300); }
function drawPlan(c, x, y, w) {
  const s = w / 300, web = S.plan === "web", rows = planData ? planData.rows : [], h = planHeight(w);
  c.save();
  rr(c, x, y, w, h, (web ? 8 : 16) * s);
  c.fillStyle = web ? (planData && planData.bg) : "rgba(44,35,29,.92)"; c.fill();
  c.strokeStyle = web ? "rgba(42,85,140,.16)" : "rgba(255,255,255,.14)"; c.lineWidth = Math.max(1, s); c.stroke();
  const pad = 15 * s; let yy = y + 14 * s;
  c.textBaseline = "middle";
  const ink = web ? "#222" : "#fff";
  for (const r of rows) {
    const mid = yy + 14 * s, ix = x + pad + (r.sub ? 14 * s : 0);
    let tx = ix;
    if (r.tag && !r.sub) {
      c.font = `700 ${10 * s}px ${FONT}`;
      const tw = c.measureText(r.tag).width + 12 * s;
      rr(c, ix, mid - 9 * s, tw, 18 * s, 9 * s); c.fillStyle = r.col; c.fill();
      c.fillStyle = "#222"; c.fillText(r.tag, ix + 6 * s, mid + .5 * s); tx = ix + tw + 6 * s;
    }
    c.font = `${r.sub ? 12 : 13}px ${FONT}`.replace(/\d+px/, (r.sub ? 12 : 13) * s + "px");
    const maxw = x + w - pad - tx;
    let t = r.text; while (t.length > 1 && c.measureText(t).width > maxw) t = t.slice(0, -1);

/* 글씨 */
function drawText(c, w, h) {

/* 친구 사진 */
let friendImgs = [];      // { id, blob, bmp, url }
async function loadFriends() {

    friendImgs = [];
    for (const k of keys.sort()) {

}
/* 폰 갤러리 사진을 안전하게 읽어 작은 사본으로 만든다 (앱에서 파일이 바로 저장 안 되는 문제 방지) */
async function normalizeImage(file, keepAlpha) {

    } finally { URL.revokeObjectURL(url); }

  const cv = document.createElement("canvas"); cv.width = Math.max(1, Math.round(bmp.width * sc)); cv.height = Math.max(1, Math.round(bmp.height * sc));
  cv.getContext("2d").drawImage(bmp, 0, 0, cv.width, cv.height);
  bmp.close && bmp.close();
  const blob = await new Promise(r => cv.toBlob(r, keepAlpha ? "image/png" : "image/jpeg", .9));

}
async function addFriend(file) {

  try {
    const blob = await normalizeImage(file, false);
    const st = await tx("readwrite", "friends");
    await idbReq(st.put(blob, id));
    friendImgs.push({ id, blob, bmp: await createImageBitmap(blob), url: URL.createObjectURL(blob) });
  } catch (e) { toast("사진을 넣지 못했어요 (" + (e && (e.name || e.message) || "오류") + ")"); }
}
async function delFriend(id) {

  if (S.rep === id) S.rep = null; persistSettings();
}
function repFriend() { return friendImgs.find(f => f.id === S.rep) || friendImgs[0] || null; }
function cover(c, img, iw, ih, x, y, w, h) {
  const ir = iw / ih, rr_ = w / h; let sw, sh, sx, sy;

  const me = S.mepos || (w > h * 1.1 ? "right" : "bottom");
  if (me === "left" || me === "right") {
    const fw = Math.round(w * 0.34);
    return me === "right" ? { f: { x: 0, y: 0, w: fw, h }, c: { x: fw, y: 0, w: w - fw, h } }

                         : { f: { x: 0, y: h - th, w, h: th }, c: { x: 0, y: 0, w, h: h - th } };

/* 한 장 합성 (화면용 / 저장용 공통) */

  if (split) {

    c.fillStyle = BG; c.fillRect(cr.x, cr.y, cr.w, cr.h);

    }

    c.save(); rr(c, x, y, fw, fh, 14 * (fw / 120)); c.clip(); cover(c, f.bmp, f.bmp.width, f.bmp.height, x, y, fw, fh); c.restore();

}
function render() {

  v.style.left = cr.x + "px"; v.style.top = cr.y + "px"; v.style.width = cr.w + "px"; v.style.height = cr.h + "px";
  const bar = $("#bar"); bar.style.left = cr.x + "px"; bar.style.width = cr.w + "px"; bar.style.right = "auto"; bar.style.top = cr.y + "px";
  const t = $("#tint"); t.style.left = v.style.left; t.style.top = v.style.top; t.style.width = v.style.width; t.style.height = v.style.height;

/* ───────── 끌기·확대 ───────── */
const ptrs = new Map(); let drag = null;
function boxHs() { const sc = (S.items.tab.fw * W) / 300; return Math.min(S.items.tab.hs || 1, Math.max(.25, (H * 0.94 - 46 * sc) / (24 * 11.2 * sc))); }
function hit(x, y) {
  for (const k of ["text", "friend", "plan", "tab"]) { const b = boxes[k]; if (b && x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h) return k; }
  return null;
}
ov.addEventListener("pointerdown", e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  ov.setPointerCapture(e.pointerId);
  if (ptrs.size === 1) {
    const tb = boxes.tab;
    if (tb && Math.hypot(e.clientX - (tb.x + tb.w - 6), e.clientY - (tb.y + tb.h - 6)) < 26) {
      drag = { k: "tab", rs: true, sx: e.clientX, sy: e.clientY, w0: tb.w, h0: tb.h, hs0: boxHs() };
      return;
    }
    const k = hit(e.clientX, e.clientY);
    if (k === "friend") { drag = { k, sx: e.clientX, sy: e.clientY, ox: S.items.friend.fx, oy: S.items.friend.fy }; }
    else if (k) { drag = { k, sx: e.clientX, sy: e.clientY, ox: (k === "text" ? S.text.fx : S.items[k].fx), oy: (k === "text" ? S.text.fy : S.items[k].fy) }; }
    else { drag = null; showBars($("#bar").classList.contains("hide")); }
  } else if (ptrs.size === 2 && drag) {
    const [a, b] = [...ptrs.values()]; drag.d0 = Math.hypot(a.x - b.x, a.y - b.y);
    drag.s0 = drag.k === "text" ? S.text.size : S.items[drag.k].fw;

ov.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  if (!drag) return;
  if (drag.rs) {
    S.items.tab.fw = Math.min(1, Math.max(.12, (drag.w0 + e.clientX - drag.sx) / W));
    S.items.tab.hs = Math.min(3, Math.max(.25, drag.hs0 * (drag.h0 + e.clientY - drag.sy) / drag.h0));
    render(); return;
  }
  if (ptrs.size >= 2 && drag.d0) {
    const [a, b] = [...ptrs.values()], r = Math.hypot(a.x - b.x, a.y - b.y) / drag.d0;
    if (drag.k === "text") S.text.size = Math.min(.3, Math.max(.03, drag.s0 * r));
    else S.items[drag.k].fw = Math.min(1, Math.max(.12, drag.s0 * r));
  } else if (ptrs.size === 1) {
    const fx = drag.ox + (e.clientX - drag.sx) / W, fy = drag.oy + (e.clientY - drag.sy) / H;
    if (drag.k === "text") { S.text.fx = fx; S.text.fy = fy; } else { S.items[drag.k].fx = fx; S.items[drag.k].fy = fy; }

function up(e) { ptrs.delete(e.pointerId); if (ptrs.size === 0 && drag) { drag = null; persistSettings(); } else if (ptrs.size === 1 && drag) { const p = [...ptrs.values()][0]; drag.sx = p.x; drag.sy = p.y; drag.ox = drag.k === "text" ? S.text.fx : S.items[drag.k].fx; drag.oy = drag.k === "text" ? S.text.fy : S.items[drag.k].fy; drag.d0 = 0; } }
ov.addEventListener("pointerup", up); ov.addEventListener("pointercancel", up);

/* ───────── 시간 재기 / 타임랩스 ───────── */
let running = false, last = 0, lastShot = 0, wake = null;

document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && running) keepAwake(); });

  if (on) { keepAwake(); showBars(true); } else if (wake) { wake.release().catch(() => {}); wake = null; }

async function saveBlob(blob, name) {
  const P = FD();
  if (NATIVE && P && P.saveBegin) {
    const { id } = await P.saveBegin({ name, mime: blob.type || (name.endsWith(".png") ? "image/png" : "video/mp4") });
    const CH = 768 * 1024;
    for (let o = 0; o < blob.size; o += CH) {
      const b64 = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(String(fr.result).split(",")[1]); fr.readAsDataURL(blob.slice(o, o + CH)); });
      await P.saveChunk({ id, data: b64 });
    }
    await P.saveEnd({ id });
    return;
  }
  download(blob, name);
}
function download(blob, name) {
  const a = document.createElement("a"); a.href = URL.createObjectURL(blob); a.download = name;
  document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(a.href), 4000);
}

/* 스티커 사진 */
let stickerImgs = [];       // { id, blob, bmp, url }
async function loadStickers() {
  try {
    const keys = await idbReq((await tx("readonly", "stickers")).getAllKeys());
    stickerImgs = [];
    for (const k of keys.sort()) {
      const blob = await idbReq((await tx("readonly", "stickers")).get(k));
      stickerImgs.push({ id: k, blob, bmp: await createImageBitmap(blob), url: URL.createObjectURL(blob) });
    }
  } catch (e) {}
}
async function addSticker(file) {
  const id = String(Date.now()) + String(Math.floor(Math.random() * 1000));
  try {
    const blob = await normalizeImage(file, true);
    await idbReq((await tx("readwrite", "stickers")).put(blob, id));
    stickerImgs.push({ id, blob, bmp: await createImageBitmap(blob), url: URL.createObjectURL(blob) });
  } catch (e) { toast("스티커를 넣지 못했어요 (" + (e && (e.name || e.message) || "오류") + ")"); }
}
async function delSticker(id) { (await tx("readwrite", "stickers")).delete(id); stickerImgs = stickerImgs.filter(x => x.id !== id); }

/* 얼굴 찾기 (안드로이드 앱에서만) — 저장 전에 한 번에 훑는다 */
async function detectFaces(pick, onp) {
  const out = new Array(pick.length), B = 8, tmp = document.createElement("canvas"), tc = tmp.getContext("2d");
  for (let i = 0; i < pick.length; i += B) {
    const imgs = [], metas = [];
    for (let j = i; j < Math.min(pick.length, i + B); j++) {
      const { bmp, c } = await loadFrame(pick[j]);
      const sx = c[0] * bmp.width, sy = c[1] * bmp.height, sw = c[2] * bmp.width, sh = c[3] * bmp.height;
      tmp.width = Math.max(2, Math.round(sw)); tmp.height = Math.max(2, Math.round(sh));
      tc.drawImage(bmp, sx, sy, sw, sh, 0, 0, tmp.width, tmp.height);
      imgs.push(tmp.toDataURL("image/jpeg", .8).split(",")[1]); metas.push(c); bmp.close && bmp.close();
    }
    const r = await FD().detectBatch({ images: imgs });
    (r.results || []).forEach((faces, k) => {
      const c = metas[k];
      out[i + k] = (faces || []).map(f => ({ x: c[0] + f.x * c[2], y: c[1] + f.y * c[3], w: f.w * c[2], h: f.h * c[3] }));
    });
    onp(Math.round(Math.min(pick.length, i + B) / pick.length * 100));
  }
  // 한두 장 놓친 건 앞 장면의 얼굴 위치를 이어서 쓴다
  let last = [], miss = 99;
  for (let i = 0; i < out.length; i++) {
    if (out[i] && out[i].length) { last = out[i]; miss = 0; }
    else if (miss < 3) { out[i] = last; miss++; } else out[i] = [];
  }
  return out;
}
function censorDraw(cx, cv, faces, mode, camRect) {
  if (mode === "full") {
    const r = camRect; cx.save(); cx.beginPath(); cx.rect(r.x * cv.width, r.y * cv.height, r.w * cv.width, r.h * cv.height); cx.clip();
    cx.filter = "blur(22px)"; cx.drawImage(cv, 0, 0); cx.restore(); cx.filter = "none"; return;
  }
  faces.forEach((f, idx) => {
    const cxm = (f.x + f.w / 2) * cv.width, cym = (f.y + f.h / 2) * cv.height, k = 1.4;
    const rw = f.w * cv.width * k, rh = f.h * cv.height * k, rx = cxm - rw / 2, ry = cym - rh / 2;
    if (mode === "sticker" && stickerImgs.length) {
      const im = stickerImgs[idx % stickerImgs.length].bmp, sz = Math.max(rw, rh) * 1.15, sc = Math.min(sz / im.width, sz / im.height);
      cx.drawImage(im, cxm - im.width * sc / 2, cym - im.height * sc / 2, im.width * sc, im.height * sc); return;
    }
    cx.save(); cx.beginPath(); cx.ellipse(cxm, cym, rw / 2, rh / 2, 0, 0, 7); cx.clip();
    if (mode === "mosaic") {
      const t = document.createElement("canvas"), n = Math.max(4, Math.round(rw / 14)); t.width = n; t.height = Math.max(4, Math.round(n * rh / rw));
      t.getContext("2d").drawImage(cv, rx, ry, rw, rh, 0, 0, t.width, t.height);
      cx.imageSmoothingEnabled = false; cx.drawImage(t, 0, 0, t.width, t.height, rx, ry, rw, rh); cx.imageSmoothingEnabled = true;
    } else {
      cx.filter = `blur(${Math.max(6, rw / 5)}px)`; cx.drawImage(cv, rx, ry, rw, rh, rx, ry, rw, rh); cx.filter = "none";
    }
    cx.restore();
  });
}

async function encode(pick, onp, cmode) {
  cmode = cmode || "off";
  let faces = null;
  if (cmode !== "off" && cmode !== "full" && FD()) faces = await detectFaces(pick, p => onp(Math.round(p * 0.5)));
  const baseP = faces ? 50 : 0;
  const f0 = await loadFrame(pick[0]), first = f0.bmp;
  const cv = document.createElement("canvas"); cv.width = first.width & ~1; cv.height = first.height & ~1;
  const cx = cv.getContext("2d");
  cx.fillStyle = BG; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(first, 0, 0, cv.width, cv.height);
  const st = cv.captureStream(30);
  const mp4 = MediaRecorder.isTypeSupported("video/mp4");
  const rec = new MediaRecorder(st, { mimeType: mp4 ? "video/mp4" : "video/webm", videoBitsPerSecond: 5e6 });
  const chunks = []; rec.ondataavailable = e => e.data.size && chunks.push(e.data);
  const done = new Promise(r => rec.onstop = r);
  rec.start(1000);
  const step = 1000 / 30; let t0 = performance.now();
  for (let i = 0; i < pick.length; i++) {
    const { bmp, c } = await loadFrame(pick[i]);
    cx.fillStyle = BG; cx.fillRect(0, 0, cv.width, cv.height);
    const sc = Math.min(cv.width / bmp.width, cv.height / bmp.height), dw = bmp.width * sc, dh = bmp.height * sc;
    cx.drawImage(bmp, (cv.width - dw) / 2, (cv.height - dh) / 2, dw, dh);
    bmp.close && bmp.close();
    if (cmode === "full") censorDraw(cx, cv, [], "full", { x: c[0], y: c[1], w: c[2], h: c[3] });
    else if (faces && faces[i] && faces[i].length) censorDraw(cx, cv, faces[i], cmode);
    const due = t0 + (i + 1) * step, wait = due - performance.now();
    if (wait > 0) await new Promise(r => setTimeout(r, wait));
    if (i % 15 === 0) onp(baseP + Math.round(i / pick.length * (100 - baseP)));
  }
  await new Promise(r => setTimeout(r, 300));
  rec.stop(); await done;
  await saveBlob(new Blob(chunks, { type: mp4 ? "video/mp4" : "video/webm" }), `timelapse_${dayKey()}.${mp4 ? "mp4" : "webm"}`);
}
