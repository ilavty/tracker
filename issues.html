개발 의혹에 대응하는 과정에서 이루어졌으며, 이는 안보 위협을 공유하는 미국과 이스라엘 간 전략적 공조를 한층 강화시키는 계기로 작용하고 있는데, 특히 이스라엘은 이란의 핵·미사일 능력을 자국에 대한 직접적 생존 위협으로 인식하고 선제적 대응 의지를 유지하고 있으며, 미국 역시 역내 억지력 유지와 동맹 신뢰 확보를 위해 군사·정보 협력을 확대하고 외교적·군사적 수단을 병행하고 있어 양국 관계는 단순한 협력 수준을 넘어 사실상 대이란 억지 전략을 중심으로 한 고도의 안보동맹 구조로 심화되고 있다.","items":[{"id":"i1653","t":"이스라엘 승인 (1948.5.14.): 미국 대통령 [[해리 트루먼]]은 이스라엘 건국 직후 이를 승인함으로써 양국 관계의 출발점을 형성하였다."},{"id":"i1654","t":"제3차 중동전쟁 이후 전략적 접근 ([[1967]]년): 제3차 중동전쟁 이후 미국은 이스라엘을 반소 전략의 핵심 파트너로 인식하고 군사·외교적 지원을 본격적으로 확대하였다."},{"id":"i1655","t":"제4차 중동전쟁 군사지원 (1973): 욤키푸르 전쟁에서 미국은 대규모 공수지원 ([[니켈그라스]] 작전)을 통해 이스라엘을 지원함으로써 양국 관계는 사실상 군사동맹 수준으로 격상되었다."},{"id":"i1656","t":"캠프 데이비드 협정 중재 (1978~1979): 지미 카터의 중재로 1978년 캠프 데이비드 협정이 체결되고, 이를 토대로 1979년 이집트–이스라엘 평화조약이 성립되었으며, 이집트의 이스라엘 승인과 이스라엘의 [[시나이]]반도 반환이 이루어지고 미국은 양국에 대한 대규모 군사·경제 원조를 제공함으로써 중동 질서의 핵심 중재자이자 후원자로서의 지위를 확립하였다."},{"id":"i1657","t":"전략적 협력 관계 제도화 (1981): 1981년 미국–이스라엘 간 전략협력 협정 체결로 [[소련]] 견제를 공동 목표로 설정하고 정기적 정책협의체를 구축하는 한편, 정보공유 확대, 공동 군사훈련, 무기체계 공동개발, 미군 장비의 이스라엘 사전배치(WRSA-I) 등을 포함하는 포괄적 안보협력이 제도화되어 사실상 준동맹 수준의 관계가 공고화되었다."},{"id":"i1658","t":"주요 비NATO 동맹국 지정 (1987): 미국은 이스라엘을 주요 비NATO 동맹국 ([[MNNA(Major non-NATO ally)]])으로 지정하여 군사·기술 협력을 더욱 확대하였다."},{"id":"i1659","t":"오슬로 협정 지원 (1993): 빌 클린턴의 주도로 이스라엘과 [[PLO]] 간 상호 인정이 이루어지면서 미국의 중재 역할이 한층 강화되었다."},{"id":"i1660","t":"9·11 이후 대테러 협력 강화 (2001~): 9·11 테러 이후 양국은 정보공유와 대테러 작전을 중심으로 [[안보]] 협력을 심화하였다."},{"id":"i1661","t":"예루살렘 수도 인정 (2017): 미국 [[트럼프]] 행정부는 예루살렘을 이스라엘 수도로 인정하고 대사관을 이전함으로써 양국 관계를 한층 강화하였다."},{"id":"i1662","t":"[[아브라함]] 협정 체결 (2020): 미국의 중재로 UAE·바레인 등과 이스라엘 간 관계 정상화가 이루어지면서 이스라엘의 지역 외교 지형이 크게 확대되었다."}]},{"id":"i1663","title":"미국과 중동국가의 기초 관계","note":"","items":[{"id":"i1664","t":"이란(Iran)은 이슬람 [[시아]]파 종주국으로 1979년 이슬람혁명 이후 반미 노선과 핵개발 문제로 미국과 제재와 군사적 긴장을 지속하는 구조적 적대국이다."},{"id":"i1665","t":"[[사우디아라비아]]는 수니파 맹주국으로 석유안보와 대이란 억제를 매개로 미국과 전략적 협력을 유지하며 1951년 미·[[사우디아라비아]] 상호방위원조협정(Mutual Defense Assistance Agreement)을 통해 군사원조와 안보협력을 제도화한 사실상 동맹국이다."},{"id":"i1666","t":"[[이스라엘]]은 유대국가로 미국의 군사·외교·정보 지원을 전면적으로 받으며 2016년 10년간 380억 달러 규모 군사원조 양해각서(MOU, 2019–2028)를 체결한 미국의 최우선 특수동맹국이다."},{"id":"i1667","t":"아랍에미리트(UAE)는 이슬람 [[수니]]파 왕정국가로 미군 기지 사용과 무기협력을 제공하며 1994년 방위협력협정(Defense Cooperation Agreement, DCA)을 체결한 친미 안보협력국이다."},{"id":"i1668","t":"이라크(Iraq)는 [[시아]]파 다수국가이자 쿠르드 자치지역을 포함한 국가로 미국과 안보협력을 유지하며 2008년 지위협정(Status of Forces Agreement, SOFA)과 전략기본협정(Strategic Framework Agreement)을 통해 미군 주둔과 협력을 제도화한 제한적 파트너이다."},{"id":"i1669","t":"[[시리아]]는 시아파계 알라위파 정권이 지배하는 국가로 러시아·이란과 연대하여 미국과 제재와 군사적 대치를 지속하는 사실상 적대국이다."},{"id":"i1670","t":"레바논(Lebanon)은 수니파·시아파·기독교가 혼재된 종파 분권 국가로 시아파 [[헤즈볼라]]의 영향력이 크며 미국의 군사원조와 훈련 지원을 받는 조건부 협력 파트너이다."},{"id":"i1671","t":"[[요르단]]은 수니파 왕정국가로 대테러·정보협력의 핵심 거점이며 2021년 방위협력협정(Defense Cooperation Agreement, DCA)을 통해 미군 주둔과 군사협력을 제도화한 대표적 친미 안보협력국이다."},{"id":"i1672","t":"이집트(Egypt)는 수니파 중심 국가로 1978년 [[캠프데이비드]] 협정과 1979년 이집트-이스라엘 평화조약 이후 미국의 대규모 군사원조와 전략협력을 지속하는 전통적 친미 군사협력 파트너이다."},{"id":"i1673","t":"예멘(Yemen)은 수니파 정부와 시아파 [[후티]] 반군이 대립하는 내전 구조 속에서 미국과 대테러 공조를 수행하는 제한적 안보협력국이다."}]},{"id":"i1674","title":"중동국가들의 대외정책 성향 및 미국과 관계","note":"","items":[{"id":"i1675","t":"사우디아라비아 (수니파·와하비즘: 수니파 내 보수적·근본주의 해석) : 수니파 맹주로서 미국과의 전통적 안보동맹을 유지하면서도 최근에는 중국·러시아와 협력을 확대하는 균형외교를 추진하며, 시아파 중심국 [[이란]]을 견제하는 것이 핵심 목표이다. 미군은 과거 대규모 주둔 이후 현재는 제한적으로 재배치된 형태로 일부 주둔하고 있다."},{"id":"i1676","t":"이란 (시아파·12이맘파: 시아파 주류 교리) : 시아파 중심국으로서 반미·반서방 노선을 유지하며 러시아·중국과 전략적 협력을 강화하고, 중동 내 시아파 세력 ( [[헤즈볼라]] 등)을 통해 영향력 확대를 추구한다. 미군은 주둔하지 않는다."},{"id":"i1677","t":"[[이스라엘]] (유대교 국가) : 미국과의 강력한 동맹을 기반으로 하는 친서방 국가로서 이란 및 친이란 세력 억제가 핵심 안보전략이다. 미군은 상시적인 공식 기지 형태로는 주둔하지 않으나 일부 협력시설이 존재한다."},{"id":"i1678","t":"터키 ( [[수니파]] 다수·세속주의 국가) : 이슬람 [[수니파]] 다수 사회를 가지면서도 세속주의 전통을 기반으로 NATO 회원국으로서의 친서방 틀을 유지하되 러시아와 협력하는 등 전략적 자율외교를 수행한다. 미군은 인질릭 공군기지 등 주요 군사기지에 주둔하고 있다."},{"id":"i1679","t":"[[이집트]] (수니파: 이슬람 다수 종파) : 수니파 아랍권 핵심국으로서 군부 중심 정치체제를 바탕으로 친미 성향을 유지하면서도 러시아·중국과 협력을 병행하는 실용적 균형외교를 전개한다. 미군은 상시 기지 형태로는 주둔하지 않고 군사훈련 및 협력 중심으로 관계가 유지된다."},{"id":"i1680","t":"아랍에미리트 ( [[수니파]]: 이슬람 다수 종파) : [[수니파]] 국가로서 친서방 안보·경제 협력을 유지하면서도 중국과의 경제협력 확대 등 다변외교를 추진하는 실용적 국가이다. 미군은 공군 및 해군 시설을 중심으로 주둔하고 있다."},{"id":"i1681","t":"카타르 ( [[수니파]]: 이슬람 다수 종파) : [[수니파]] 국가이나 이란과도 협력하며 미국과의 안보협력을 유지하는 동시에 중재외교를 적극 수행하는 균형외교 국가이다. 미군은 [[알우데이드]] 공군기지에 대규모로 주둔하고 있다."},{"id":"i1682","t":"쿠웨이트 (수니파 중심 + 시아파 소수: 시아파는 [[12이맘파]] 계열) : 수니파 중심 국가로 친서방 안보체제를 유지하면서도 내부 시아파와의 공존을 고려한 온건한 외교를 수행한다. 미군은 지상군 중심의 주요 전진기지에 주둔하고 있다."},{"id":"i1683","t":"오만 ( [[이바디파]]: 수니·시아와 구별되는 독자 종파) : 수니·시아와 구별되는 [[이바디파]] 국가로 전통적으로 중립성과 중재외교를 유지하며 이란과 서방 모두와 우호 관계를 유지한다. 미군은 정식 기지 형태로 주둔하지는 않지만 항구와 공항에 대한 접근권을 통해 군사적 이용이 가능하다. (*참고: 이슬람 종파는 수니파, 시아파, [[이바디파]]로 구분하는 것이 일반적)"},{"id":"i1684","t":"이라크 (시아파 다수·[[12이맘파]] 중심) : 시아파 다수 국가로 이란의 영향력이 구조적으로 우세한 가운데 동시에 미국과 제한적 관계를 유지하는 복합적 외교 구조를 보인다. 미군은 IS 대응 이후 일부 기지에 계속 주둔하고 있다."},{"id":"i1685","t":"시리아 (수니파 다수 + [[알라위]]파 정권: 시아파 계열 분파) : 수니파가 다수를 차지하지만 시아파 계열인 [[알라위]]파 정권이 지배하며 이란·러시아와 밀착된 반서방 외교노선을 유지한다. 미군은 공식 기지 형태로는 주둔하지 않으나 일부 지역에 제한적으로 주둔하고 있다."},{"id":"i1686","t":"요르단 (수니파: 이슬람 다수 종파) : 수니파 [[왕정]]국가로서 미국과 긴밀한 협력을 유지하는 온건한 친서방 국가이다. 미군은 공군 및 특수부대 중심으로 주둔하고 있다."},{"id":"i1687","t":"레바논 (다종파 혼합: 시아파(12이맘파)·수니파·기독교 공존) : 종파 분열 구조 속에서 친서방 세력과 친이란([[헤즈볼라]])이 병존하며 국가 통제력이 상대적으로 약한 복합적 외교 성향을 보인다. 미군은 주둔하지 않는다."},{"id":"i1688","t":"예멘 (수니파 + [[자이드]]파 시아: 시아파 중 온건·수니와 유사) : 국제적으로 인정된 정부와 자이드파 시아 반군 간 내전 구조 속에서 사우디와 이란 간 대리전 양상이 나타난다. 미군은 주둔하지 않는다."}]},{"id":"i1689","title":"이란의 주요 국제관계","note":"최근 이란 내부 정세는 2025년 말~2026년 초 경제난과 사회적 불만이 누적된 가운데 전국적 반정부 시위로 폭발하면서, 정부가 인터넷·통신을 차단하고 특수부대와 치안력을 동원해 무력 진압을 강행하는 극심한 충돌 국면으로 치닫고 있다. 시위는 물가 폭등과 경제 위기 불만으로 시작됐으나 이슬람공화국 체제 전반과 최고지도자 권위에 대한 직접적 도전 형태로 확산됐고, 전국 31개 주로 퍼졌다. 정부는 시위대를 “폭도” “신의 적”으로 규정하고 실탄 사용과 체포·재판·사형 선고까지 포함하는 강경 대응을 펼치며 수천명에서 수만명에 달하는 사상자가 보고되고 있다. 보안군의 발포로 많은 부상자와 사망자가 발생하고 있으며, 이란 사법부는 시위대를 겨냥한 신속재판과 처형을 예고하는 등 인권·법치 문제에 대한 국제사회의 비판이 거세지는 상황이다. 외부에서는 미국 등이 시위대에 대한 지원이나 개입 가능성을 언급하며 긴장이 고조되는 가운데, 러시아·중국 등은 외부 간섭을 경고하는 등 이란 내부 사태가 국제정치적 갈등으로 확대되고 있다.","items":[{"id":"i1690","t":"1941년 제2차 세계대전 중 영국과 소련은 친독 성향의 [[레자 샤]]를 축출하고 이란을 점령하여 연합국의 대소련 보급로로 활용하였다."},{"id":"i1691","t":"1951년 모사데그 총리는 영국 석유회사를 [[국유화]]하여 이란의 자원주권을 회복하려 했으나 서방과의 심각한 갈등을 초래하였다."},{"id":"i1692","t":"1953년 미국과 영국은 쿠데타로 모사데그를 전복하고 [[팔레비]] 국왕을 복권시켜 이란을 중동에서 미국의 핵심 친서방 동맹이자 반공 방파제로 편입시켰다."},{"id":"i1693","t":"1979년 [[호메이니]]가 이끄는 이슬람 혁명으로 친미 [[팔레비]] 왕조가 붕괴되고 반미·반서방·반이스라엘 노선의 이란 이슬람공화국이 수립되었다."},{"id":"i1694","t":"1979~1981년 테헤란 미 대사관 [[인질]] 사건은 미국과 이란의 외교관계를 단절시키며 양국의 구조적 적대관계를 고착화하였다."},{"id":"i1695","t":"[[1980]]년~1988년 이란-이라크 전쟁에서 이라크는 미국과 걸프국들의 지원을 받아 이란과 소모전을 벌였고 이란은 이후 비대칭 억지 전략을 채택하게 되었다."},{"id":"i1696","t":"2015년 이란과 미국·영국·프랑스· [[독일]]·러시아·중국은 JCPOA를 체결하여 이란의 핵활동 제한과 경제제재 해제를 맞교환하였다."},{"id":"i1697","t":"[[2018]]년 트럼프 행정부는 JCPOA에서 일방적으로 탈퇴하고 대이란 제재를 복원하여 핵외교 체제를 붕괴시켰다."},{"id":"i1698","t":"1979년 이후 이란은 이스라엘을 불법 [[시온]]주의 국가로 규정하고 외교관계를 단절하면서 체제 차원의 적대노선을 확립하였다."},{"id":"i1699","t":"1980년대 이란은 레바논 시아파 무장조직을 지원해 [[헤즈볼라]]를 창설함으로써 이스라엘에 대한 대리전 전선을 구축하였다."},{"id":"i1700","t":"2006년 레바논 전쟁에서 [[헤즈볼라]]는 이란의 군사·재정 지원을 바탕으로 이스라엘과 대규모 교전을 벌였다."},{"id":"i1701","t":"2023년 [[하마스]]의 이스라엘 공격 이후 이란은 [[하마스]]를 정치·군사적으로 지지하며 이스라엘과의 대리전을 전면화하였다."},{"id":"i1702","t":"[[2024]]년 이란과 이스라엘은 상대국 외교시설과 본토를 직접 타격함으로써 사상 처음으로 공개적 직접 군사충돌 단계에 진입하였다."}]},{"id":"i1703","title":"이란핵","note":"","items":[{"id":"i1704","t":"NPT 가입:이란은 1968년 핵확산금지조약(NPT)에 서명하고 [[1970]]년 비준하였다. 따라서 이란은 핵무기를 보유할 수 없는 비핵보유국(non-nuclear weapon state)의 지위를 가진다. 그러나 NPT 제4조에 따라 평화적 목적의 원자력 이용과 우라늄 농축 자체는 원칙적으로 허용된다고 주장해 왔다."},{"id":"i1705","t":"IAEA 가입 및 사찰 문제:이란은 1958년 International Atomic Energy Agency 에 가입하였다. 이후 IAEA와 포괄적 안전조치협정(safeguards agreement)을 체결하여 핵시설 신고와 사찰 의무를 부담하였다. 그러나 [[2002]]년 [[나탄즈]]·아라크 비밀 핵시설 문제가 드러난 이후 IAEA는 미신고 핵활동과 불충분한 협력을 반복적으로 문제 삼아 왔다."},{"id":"i1706","t":"추가의정서(Additional Protocol):이란은 [[2003]]년 IAEA 추가의정서에 서명하였다. 추가의정서는 IAEA에 보다 광범위한 현장 접근과 불시사찰 권한을 부여하는 제도이다. 그러나 이란 의회는 이를 정식 비준하지 않았고, 이란은 시기에 따라 임시 적용과 중단을 반복하였다. 2021년 이후에는 대부분의 추가적 사찰조치를 제한하였다."},{"id":"i1707","t":"JCPOA(포괄적 공동행동계획):2015년 7월 14일 이란과 미국·영국·프랑스·[[독일]]·러시아·중국(P5+1)은 JCPOA를 체결하였다. 이란은 우라늄 농축도(3.67%), 원심분리기 수, 농축우라늄 보유량 등을 제한하고, 대신 미국·EU·유엔은 경제제재를 완화하기로 하였다. 이후 유엔 안보리 결의 2231호가 이를 승인하였다."},{"id":"i1708","t":"Barack Obama 행정부의 입장:Barack Obama 행정부는 군사충돌보다 외교적 해결을 우선시하였다. 오바마 정부는 “이란의 핵무기 보유를 막으면서도 전쟁은 피해야 한다”는 입장에서 JCPOA 체결을 적극 추진하였다. 미국은 제한적 [[농축]] 자체는 인정하되, 핵무기 제조 가능성은 차단하려 하였다."},{"id":"i1709","t":"Donald Trump 행정부의 입장:Donald Trump 행정부는 JCPOA가 지나치게 이란에 유리하고, 탄도미사일·지역 군사활동 문제를 포함하지 않았다고 비판하였다. 결국 2018년 5월 8일 미국은 JCPOA에서 일방적으로 탈퇴하고 “[[maximum pressure(최대 압박)]]” 정책 아래 강력한 경제제재를 복원하였다."},{"id":"i1710","t":"중국의 입장:기본적으로 이란의 핵무기 보유에는 반대하지만, [[평화적]] 핵이용 권리는 인정해야 한다는 입장을 유지해 왔다. 또한 중국은 미국의 일방적 제재와 JCPOA 탈퇴를 비판하면서 협상 복원을 지지하였다. 중국은 중동 에너지 확보와 대미 견제 차원에서 이란과 전략적 관계를 강화하고 있다."},{"id":"i1711","t":"러시아의 입장:Russia 역시 핵확산에는 반대하지만, 이란의 민간 핵개발 권리는 인정해야 한다고 주장해 왔다. 러시아는 JCPOA 유지와 협상 복원을 지지하였으며, [[부셰르(Bushehr)]]원전 건설 등 이란 핵에너지 사업에 협력해 왔다. 최근에는 미국 제재에 반대하며 이란과 전략적 협력을 강화하는 경향을 보인다."},{"id":"i1712","t":"이스라엘의 입장:Israel 은 이란 핵개발을 자국 안보에 대한 가장 심각한 위협 중 하나로 본다. 이스라엘은 “이란이 핵무기를 보유하면 존재적 위협(existential threat)이 된다”고 주장해 왔으며, JCPOA에도 비판적이었다. 특히 현 총리 [[Benjamin Netanyahu]] 는 JCPOA가 이란의 핵무장 능력을 장기적으로 막지 못한다고 강하게 비판하였다."},{"id":"i1713","t":"이란의 입장:핵무기 개발 의도를 공식적으로 부인하면서, 자국의 핵활동은 전력 생산·의료·과학기술 발전을 위한 평화적 목적이라고 주장한다. 또한 NPT 제[[4]] 조에 따른 우라늄 농축 권리를 강조하며, 미국의 제재와 JCPOA 탈퇴를 국제합의 위반이라고 비판해 왔다."}]},{"id":"i1714","title":"미국의 중동 개입 정책 사례 ①","note":"최근 미국과 이스라엘은 대규모 군사공격(Operation Epic Fury)을 이란 전역에서 전개하여 이란 핵 및 군사 인프라를 광범위하게 타격했고, 이 과정에서 아야톨라 알리 하메네이 이란 최고지도자가 공습으로 사망했다고 이란 정부가 공식 확인했다는 보도가 나왔다. 이 공격은 트럼프 행정부가 이란의 핵‧미사일 위협을 제거하고 정권 변화를 유도하기 위해 시행된 전격 작전으로, 이란 수뇌부가 한 자리에 모인 틈을 타 테헤란을 포함한 도시 여러 곳에서 공습이 자행되었으며, 이로 인해 이란은 주변국 미군기지 등에 대한 보복을 수행하는 등 중동 전역의 긴장이 급격히 고조되고 있다.","items":[{"id":"i1715","t":"해리 S. 트루먼 행정부(1945–1953)는 소련의 남하를 봉쇄하고 동지중해 질서를 안정시키기 위해 [[1947]]년 트루먼 독트린을 선언하여 그리스·터키를 지원하고 1948년 이스라엘을 국가로 승인하였다."},{"id":"i1716","t":"드와이트 D. 아이젠하워 행정부(1953–1961)는 친서방 정권을 복원하고 석유 이해를 보호하기 위해 1953년 이란 모사데크 축출 쿠데타를 지원하는 한편, 공산주의 확산을 억제하기 위해 1958년 [[레바논]]에 미군을 파병하였다."},{"id":"i1717","t":"존 F. 케네디 행정부(1961–1963)는 소련의 영향력 확대를 견제하기 위해 이스라엘과의 전략협력을 강화하고 [[사우디아라비아]]와 안보협력을 확대하였다."},{"id":"i1718","t":"린든 B. 존슨 행정부(1963–1969)는 이스라엘의 군사적 우위를 보장하고 소련의 아랍권 영향력 확대를 억제하기 위해 [[1967]]년 제3차 중동전쟁에서 이스라엘을 외교적으로 지원하였다."},{"id":"i1719","t":"리처드 닉슨 행정부(1969–1974)는 이스라엘의 전황 반전을 지원하기 위해 1973년 [[욤키푸르]] 전쟁 당시 대규모 군수공수 작전을 실시하였다."},{"id":"i1720","t":"지미 카터 행정부(1977–1981)는 중동 평화 정착을 위해 1978년 캠프데이비드 협정을 중재하고 소련의 아프가니스탄 침공 이후 [[페르시아]]만 안보를 보장하기 위해 1980년 카터 독트린을 선언하였다."},{"id":"i1721","t":"로널드 레이건 행정부(1981–1989)는 레바논 내전 안정화를 위해 1982년 다국적군을 파병하고 테러 억지를 명분으로 1986년 [[리비아]]를 공습하였다."},{"id":"i1722","t":"조지 H. W. 부시 행정부(1989–1993)는 이라크의 [[쿠웨이트]] 병합을 저지하고 걸프 지역 세력균형을 회복하기 위해 1991년 걸프전(Operation Desert Storm)을 수행하고 이후 이라크 북·남부에 비행금지구역을 설정하였다."},{"id":"i1723","t":"빌 클린턴 행정부(1993–2001)는 이라크의 대량살상무기 개발을 억제하기 위해 1998년 ‘사막의 여우 작전’을 실시하고 이스라엘-팔레스타인 평화 진전을 위해 [[오슬로]] 프로세스를 지원하였다."},{"id":"i1724","t":"조지 W. 부시 행정부(2001–2009)는 9·11 테러 이후 알카에다를 제거하고 탈레반 정권을 붕괴시키기 위해 2001년 아프가니스탄 전쟁을 개시하고 대량살상무기 제거와 중동 민주화 촉진을 명분으로 [[2003]]년 이라크 전쟁을 단행하였다."},{"id":"i1725","t":"버락 오바마 행정부(2009–2017)는 카다피 정권의 민간인 탄압을 저지하기 위해 2011년 [[리비아]]군사개입을 승인하고 이란의 핵무기 개발을 억제하기 위해 2015년 이란 핵합의(JCPOA)를 체결하였다."},{"id":"i1726","t":"도널드 트럼프 제1기 행정부(2017–2021)는 이란의 지역 영향력을 억제하고 미군 안전을 확보하기 위해 2020년 이라크 바그다드에서 혁명수비대 [[쿠두스]]군 사령관 카셈 솔레이마니를 사살하고 2018년 JCPOA에서 탈퇴하였다."},{"id":"i1727","t":"조 바이든 행정부(2021– )는 20년간의 전쟁을 종결하기 위해 [[2021]]년 아프가니스탄 철군을 완료하고 2023년 이스라엘-하마스 전쟁 이후 역내 확전 방지를 위해 항모전단을 파견하고 후티 반군을 공습하였다."}]},{"id":"i1728","title":"미국의 중동 군사 개입 사례 ②","note":"","items":[{"id":"i1729","t":"이란 쿠데타 개입 (1953) – Dwight D. Eisenhower: 1953 CIA가 영국과 협력하여 [[모사데크]] 총리를 축출하고 팔라비 왕정을 복원하였다. 이는 냉전기 반공 전략과 석유 이해관계가 결합된 비공식 개입 사례이다."},{"id":"i1730","t":"레바논 개입 (1958) – [[Dwight D. Eisenhower]]대통령: 1958 친서방 정부 보호를 위해 미 해병대를 파견하여 정권 붕괴를 저지하였다."},{"id":"i1731","t":"[[레바논]] 내전 개입 (1982) – Ronald Reagan:다국적군의 일원으로 참여하였으나, 베이루트 미군 숙소 폭탄 테러 이후 철수하였다."},{"id":"i1732","t":"리비아 공습 ( [[1986]]년) – Ronald Reagan:테러 지원에 대한 보복으로 트리폴리 등 주요 군사시설을 공습하였다."},{"id":"i1733","t":"걸프전 (1991) – George H. W. Bush:Gulf War에서 이라크의 [[쿠웨이트]] 침공에 대응하여 유엔 안보리 결의를 근거로 다국적군을 이끌고 [[쿠웨이트]]를 해방하였다."},{"id":"i1734","t":"이라크 비행금지구역 및 공습 (1991) – George H. W. Bush:북부·남부 비행금지구역을 설정하고 쿠르드 및 [[시아파]] 보호를 명분으로 공중 군사 압박을 지속하였으며, 이후 Bill Clinton 행정부까지 이어졌다."},{"id":"i1735","t":"아프가니스탄 전쟁 ( [[2001]]년) – George W. Bush:9·11 테러 이후 탈레반 정권 제거와 알카에다 소탕을 목표로 장기 군사 개입을 수행하였다."},{"id":"i1736","t":"이라크 전쟁 (2003) – George W. Bush: [[대량살상무기]] 제거를 명분으로 침공하여 사담 후세인 정권을 붕괴시켰으나 이후 장기 점령과 내전 상황이 발생하였다."},{"id":"i1737","t":"리비아 개입 (2011) – Barack Obama:‘ [[보호책임(R2P)]]’ 논리에 따라 NATO 공습에 참여하여 카다피 정권 붕괴를 지원하였다."},{"id":"i1738","t":"IS 격퇴 작전 (2014) – Barack Obama:이라크· [[시리아]]에서 공습과 군사지원을 통해 IS 세력 약화를 도모하였다."}]}]}]},{"id":"i1739","title":"글로벌 이슈","chapters":[{"id":"i1740","title":"핵군축·비확산","secs":[{"id":"i1741","title":"핵군축 협상의 역사","note":"도널드 트럼프 미국 행정부가 6일(현지시간) 미국과 러시아, 중국 3국이 함께 핵무기 숫자를 제한하는 새로운 핵 군축 협상을 공개 제안했다. 마코 루비오 미 국무장관도 러시아는 물론 중국까지 대상으로 하는 새로운 핵 군축 합의를 촉구했다. 그는 이날 뉴스레터 플랫폼 서브스택(Substack)에 \"군비 통제는 더 이상 미국과 러시아 간의 양자 문제가 될 수 없다\"며 \"다른 국가들도 전략적 안정을 보장할 책임이 있고, 그중에서도 중국이 특히 그렇다\"고 썼다. 선젠 중국 군축대사는 이에 반발했다. 그는 \"미국이 '중국 핵 위협'을 과장하고 있다는 점을 지적한다\"며 \"중국은 핵 문제에서 항상 신중하고 책임 있게 행동해 왔고, 군비경쟁을 악화시킨 책임이 미국에 있다\"고 반박했다. 중국은 자국 핵전력이 아직 미국·러시아와 비교할 만한 수준이 아니라며 핵 군축 협상에 참여할 뜻이 없다는 입장이다. 미국과 러시아는 2010년 버락 오바마 전 미국 행정부 당시 뉴스타트를 체결하고 실전배치 전략 핵탄두와 3대 핵전력인 대륙간탄도미사일(ICBM)·잠수함발사탄도미사일(SLBM)·전략폭격기의\n합의했다. 뉴스타트의 협정 기간은 10년이었지만 2021년 2월 추가로 5년 연장됐다. 블라디미르 푸틴 러시아 대통령은 이달 5일 협정 만료를 앞두고 기한을 1년 더 늘리길 원했지만 도널드 트럼프 미국 대통령이 거부했다.","items":[{"id":"i1742","t":"Partial Nuclear Test Ban Treaty (1963)은 대기·[[우주공간]]·수중 핵실험을 금지하여 핵확산과 방사능 낙진을 억제한 최초의 핵군비통제 조약으로, John F. Kennedy와 Nikita Khrushchev가 쿠바 미사일 위기 이후 긴장완화를 위해 체결하였다."},{"id":"i1743","t":"Nuclear Non-Proliferation Treaty (1968)은 핵보유국의 군축의무와 비보유국의 비확산 의무 및 평화적 이용권을 교환하는 구조를 확립한 핵질서의 기초조약으로, [[Lyndon B. Johnson]]과 Leonid Brezhnev 시기에 미·소가 공동 주도하였다."},{"id":"i1744","t":"SALT I (1972)은 ICBM·SLBM 수량을 동결하고 ABM Treaty를 통해 미사일방어체계를 제한함으로써 상호확증파괴에 기초한 전략적 안정성을 제도화한 최초의 전략핵 제한 협정으로, Richard Nixon과 [[Leonid Brezhnev]]가 서명하였다."},{"id":"i1745","t":"SALT II (1979)은 전략핵 운반수단과 MIRV 배치에 상한을 설정하여 군비경쟁을 억제하려 한 협정으로, Jimmy Carter와 Leonid Brezhnev가 체결했으나 소련의 [[아프가니스탄]] 침공으로 미 상원 비준동의가 무산되어 발효되지 못하였다."},{"id":"i1746","t":"Intermediate-Range Nuclear Forces Treaty (1987)은 사거리 500~5,500km의 중·단거리 핵미사일을 전면 폐기하고 현장사찰을 도입한 최초의 완전 제거형 핵군축조약으로, Ronald Reagan과 [[Mikhail Gorbachev]]가 체결하였다."},{"id":"i1747","t":"START I ([[1991]])은 전략핵탄두를 6,000기, 운반수단을 1,600기로 감축하고 상호 현장사찰과 검증체계를 도입한 최초의 실질적 감축조약으로, George H. W. Bush와 Mikhail Gorbachev가 냉전 종식 직전에 체결하였다."},{"id":"i1748","t":"START II ([[1993]])은 MIRV 탑재 ICBM을 전면 금지하여 선제공격 유인을 제거하려는 추가 감축조약으로, Bill Clinton과 Boris Yeltsin이 서명했으나 비준 지연과 ABM 갈등으로 발효되지 못하였다."},{"id":"i1749","t":"SORT (2002)은 실전배치 전략핵탄두를 1,700~2,200기로 감축하기로 합의했으나 폐기 의무와 강력한 검증체계가 부족하여 구속력이 약한 정치적 합의에 가까웠으며, George W. Bush와 [[Vladimir Putin]]이 체결하였다."},{"id":"i1750","t":"New START (2010)은 배치 핵탄두 1,550기와 운반수단 700기로 제한하고 상호 사찰과 자료교환을 강화한 현대 핵군축체제의 핵심 조약으로, Barack Obama와 Dmitry Medvedev가 체결하였으며 이후 Joe Biden과 Vladimir Putin이 5년 연장에 합의하여 [[2026]]년까지 효력이 유지되었으나 동년 2월 5일 최종 종료하였다."},{"id":"i1751","t":"Intermediate-Range Nuclear Forces Treaty 종료 ([[2019]])은 상호 위반을 이유로 미국과 러시아가 탈퇴함으로써 중거리 핵전력 전면 폐기 체제가 붕괴된 사건으로, Donald Trump과 Vladimir Putin 시기에 파기되었다."}]},{"id":"i1752","title":"주요 핵확산 관련 국제제도","note":"","items":[{"id":"i1753","t":"핵확산금지조약(NPT, Treaty on the Non-Proliferation of Nuclear Weapons, 1968 채택·1970.3.5. 발효·[[1995]]년 무기한 연장): United States·Soviet Union·United Kingdom·France·China처럼 “[[1967]]년 1월 1일 이전 핵폭발 장치를 제조·폭발시킨 국가”를 핵보유국으로 인정하는 대신, 비핵보유국의 핵무기 개발·취득을 금지하고, 핵군축(제6조)과 원자력의 평화적 이용 권리를 병행 보장한 핵비확산 체제의 핵심 조약이며, 비핵보유국은 International Atomic Energy Agency 안전조치 협정을 체결해야 한다."},{"id":"i1754","t":"국제원자력기구(IAEA, International Atomic Energy Agency, [[1957]] 설립): International Atomic Energy Agency는 미국의 “Atoms for Peace” 정책을 배경으로 설립된 국제기구로서, 원자력의 평화적 이용을 촉진하는 동시에 핵물질이 군사적 목적으로 전용되지 않도록 안전조치(safeguards)·현장사찰·추가의정서(Additional Protocol) 제도를 운영한다."},{"id":"i1755","t":"포괄적핵실험금지조약(CTBT, Comprehensive Nuclear-Test-Ban Treaty, 1996 채택·미발효): 모든 환경에서의 핵폭발 실험을 금지하는 조약으로, 지진파·수중음파·방사성핵종 등을 감시하는 국제감시체제(IMS)를 구축하였으며, Comprehensive Nuclear-Test-Ban Treaty Organization 준비위원회가 운영을 담당하고 있으나, 발효를 위해 필요한 Annex 2 국가 [[44]]개국 전원의 비준이 완료되지 않아 아직 발효되지 않았고, 미국·중국·이란·이스라엘·이집트 등은 서명만 하고 비준하지 않았으며, 인도·파키스탄·북한은 서명하지 않았다."},{"id":"i1756","t":"부분적핵실험금지조약(PTBT, Partial Test Ban Treaty, 1963): United States·Soviet Union·[[영국]]이 체결한 조약으로, 대기권·우주·수중 핵실험을 금지하고 방사성 낙진이 국경 밖으로 확산되지 않는 지하 핵실험만 허용함으로써 쿠바 미사일 위기 이후 핵군비통제의 출발점이 되었다."},{"id":"i1757","t":"핵무기금지조약(TPNW, Treaty on the Prohibition of Nuclear Weapons, 2017 채택· [[2021]]년 발효): 핵무기의 개발·실험·생산·보유·이전·사용 및 사용위협까지 전면 금지한 최초의 포괄적 핵무기 금지조약으로, 핵무기의 인도적 피해를 강조한 비핵국 중심 운동의 결과물이지만, North Atlantic Treaty Organization 회원국과 핵보유국 대부분은 핵억지력 약화를 이유로 참여하지 않았으며, 네덜란드는 NATO 회원국 중 유일하게 협상에 참여하였으나 최종 채택에는 반대표를 던졌다."},{"id":"i1758","t":"전략무기제한협정(SALT I·II, Strategic Arms Limitation Talks, 1972·1979): United States와 Soviet Union이 냉전기 전략핵 경쟁을 제한하기 위해 추진한 핵군비통제 협상으로, SALT I(1972)은 ICBM·SLBM 수를 동결하는 잠정협정(Interim Agreement)과 ABM조약을 포함하였고, SALT II(1979)는 MIRV 탑재 전략핵무기 상한을 설정하였으나 소련의 [[아프가니스탄]] 침공 이후 미국 상원의 비준동의는 무산되었다."},{"id":"i1759","t":"탄도탄요격미사일제한조약(ABM Treaty, Anti-Ballistic Missile Treaty, 1972): United States와 Soviet Union이 전국적 미사일방어체계 구축을 제한하여 상호확증파괴(MAD) 체제의 전략적 균형을 유지하려 한 조약으로, 처음에는 각국 2개의 ABM 기지만 허용하였으나 1974년 의정서로 1개 기지만 허용하도록 축소되었고, 미국은 미사일방어(MD) 체계 확대를 이유로 [[2002]]년 탈퇴하였다."},{"id":"i1760","t":"중거리핵전력조약(INF Treaty, Intermediate-Range Nuclear Forces Treaty, 1987): Ronald Reagan과 [[Mikhail Gorbachev]]가 체결한 조약으로, 사거리 500~5,500km의 지상발사(ground-launched) 탄도·순항미사일을 전면 폐기하도록 규정하여 역사상 최초로 특정 범주의 핵전력을 완전히 제거하였으며, 상호 현장사찰 제도를 도입하였으나 2019년 미국과 러시아의 탈퇴로 종료되었다."},{"id":"i1761","t":"전략무기감축조약(START I·II·SORT·New START, Strategic Arms Reduction Treaty, 1991 이후): United States와 Soviet Union·Russia가 실전배치 전략핵탄두 및 운반수단을 실질적으로 감축하기 위해 체결한 핵군축조약 체계로, START I(1991)은 대규모 전략핵 감축과 검증체계를 도입하였고, START II는 발효되지 못하였으며, SORT([[모스크바]] 조약, 2002)를 거쳐 New START(2010)는 실전배치 전략핵탄두를 각각 1,550기로 제한하였다."},{"id":"i1762","t":"비핵 지대 조약(Nuclear-Weapon-Free Zone Treaties): 특정 지역에서 핵무기의 개발·배치·실험·보유를 금지하여 지역적 비핵화를 실현하려는 조약 체계로서, 대표적으로 Treaty of Tlatelolco(라틴아메리카, 1967), Treaty of Rarotonga(남태평양, 1985), Treaty of Bangkok(동남아시아, 1995), Pelindaba Treaty(아프리카, 1996), Central Asian Nuclear-Weapon-Free Zone Treaty(중앙아시아·[[세미팔라틴스크]] 조약, 2006) 등이 있으며, 핵보유국의 소극적 안전보장(negative security assurances) 문제와 연결된다."}]}]},{"id":"i1763","title":"에너지 안보","secs":[{"id":"i1764","title":"석유위기","note":"최근 미국과 이란 간 군사 충돌이 격화되는 과정에서 이란은 호르무즈해협 통항을 사실상 제한하는 조치를 취하며 해협을 전략적 압박 수단으로 활용하였다. 이란 혁명수비대는 군사적 경고, 선박 검색, 기뢰 위협 등을 통해 서방 국가와 관련된 유조선의 통항을 제한하면서 국제 해상 교통이 크게 위축되었고, 이에 따라 국제 유가와 해상 보험료가 급등하였다. 동시에 이란은 완전한 일괄 봉쇄보다는 선별적 통항 통제 방식을 취하여, 중국 등 우호국과의 원유 거래는 일정 부분 허용하거나 위안화 결제 등 비달러 결제 방식이 적용되는 거래에 대해 통과를 묵인한다는 신호를 보내는 등 에너지 수송을 외교·금융 전략과 결합한 압박 수단으로 활용하였다. 이러한 조치는 세계 해상 원유 수송의 핵심 통로인 호르무즈해협을 둘러싼 긴장을 고조시키면서 글로벌 에너지 시장과 국제 해상 교통 체계에 큰 불확실성을 초래하고 있다.","items":[{"id":"i1765","t":"제1차 석유위기(1973)는 1973년 10월 제4차 중동전쟁([[욤키푸르]] 전쟁)이 발발하자 아랍 산유국들이 이스라엘을 지원한 미국과 서방국가에 대응하여 석유를 정치적 수단으로 사용하면서 시작되었다."},{"id":"i1766","t":"1973년 10월 OAPEC(아랍석유수출국기구)는 미국·네덜란드 등 친이스라엘 국가들에 대해 석유 수출 금지 조치를 취하고 산유량을 단계적으로 감산하였다. OAPEC은 1968년 쿠웨이트에서 사우디아라비아·쿠웨이트·[[리비아]] 등이 설립한 아랍 산유국 협의체로, 석유 정책을 조정하고 아랍 국가들의 석유 이익을 보호하기 위한 목적을 가진다."},{"id":"i1767","t":"OPEC(석유수출국기구)은 원유 공시가격을 인상하고 생산정책을 조정하여 국제 석유가격 상승을 가속화하였다. OPEC은 1960년 이라크 바그다드에서 사우디아라비아·이란·이라크·쿠웨이트·[[베네수엘라]]가 중심이 되어 설립된 산유국 기구로, 회원국 간 생산량 조정과 가격 정책 협의를 통해 국제 석유시장에서 영향력을 행사한다."},{"id":"i1768","t":"국제 유가는 1973년 배럴당 약 3달러 수준에서 1974년 약 12달러 수준으로 약 4배 상승하였다.[[O]]"},{"id":"i1769","t":"제1차 석유위기는 서방 선진국에서 경기침체와 물가상승이 동시에 발생하는 [[스태그플레이션]]을 초래하였다."},{"id":"i1770","t":"미국과 서방국가들은 에너지 절약 정책, [[전략비축유]] 제도 도입, 원자력·석탄 등 대체에너지 개발을 추진하였다."},{"id":"i1771","t":"1974년 주요 석유 소비국들은 위기 대응을 위해 국제에너지기구(IEA)를 설립하여 공동 대응 체제를 구축하였다. IEA는 [[OECD]]국가들을 중심으로 창설된 에너지 협력기구로, 석유 공급 위기 시 전략비축유 공동 방출과 에너지 정책 협력을 통해 에너지 안보를 강화하는 것을 목적으로 한다."},{"id":"i1772","t":"제2차 석유위기(1979)는 1979년 [[이란]] 혁명으로 석유 생산이 급격히 감소하고 이어 1980년 이란-이라크 전쟁이 발발하면서 중동 지역 석유 공급이 불안정해지면서 발생하였다."},{"id":"i1773","t":"국제 유가는 1978년 배럴당 약 13달러에서 1981년 약 [[35]]달러 수준까지 상승하였다."},{"id":"i1774","t":"각국의 에너지 절약 정책과 북해·[[알래스카]] 등 비OPEC 지역의 석유 개발 확대, 세계 경기 침체에 따른 수요 감소로 1980년대 중반 이후 국제 유가는 점차 안정되었다."}]},{"id":"i1775","title":"석유 등 에너지 관련 논점","note":"","items":[{"id":"i1776","t":"석유수출국기구(Organization of the Petroleum Exporting Countries) :1960년 9월 이라크 바그다드에서 베네수엘라와 [[사우디아라비아]] 주도로 출범한 산유국 협의체로서 사우디아라비아·이란·이라크·쿠웨이트·베네수엘라·UAE 등 회원국이 참여하여 원유 생산량을 조절하고 국제 유가 안정과 산유국 이익 극대화를 도모한다."},{"id":"i1777","t":"OPEC+ (OPEC Plus):2016년 이후 오스트리아 빈에서 OPEC과 [[러시아]] 간 협력 합의를 계기로 사우디아라비아와 [[러시아]]주도로 형성된 협의체로서 [[러시아]]·카자흐스탄·아제르바이잔·멕시코 등 비회원 산유국이 참여하여 글로벌 원유 공급을 공동 조정한다."},{"id":"i1778","t":"국제에너지기구(International Energy Agency):[[1974]]년 11월 프랑스 파리에서 OECD 또는 미국 주도하에 설립된 소비국 중심 기구로서 미국·일본·독일·프랑스·한국 등 회원국이 참여하여 에너지 안보 확보와 전략비축유 협력을 수행한다."},{"id":"i1779","t":"[[국제에너지포럼(International Energy Forum)]]:1991년 프랑스 파리에서 산유국·소비국 간 대화 필요성에 따라 출범하고 2011년 사우디 리야드에 사무국이 설치된 협의체로서 사우디아라비아·러시아·미국·중국·인도 등 주요 에너지 국가가 참여하여 정책 대화와 시장 안정을 도모한다."},{"id":"i1780","t":"가스수출국포럼(Gas Exporting Countries Forum):2001년 이란 테헤란에서 이란 주도로 창설되고 2008년 [[러시아 모스크바]]에서 헌장 채택으로 제도화된 협의체로서 러시아·카타르·이란·알제리·베네수엘라 등 주요 가스 수출국이 참여하여 생산·수출 정책을 조율한다."},{"id":"i1781","t":"국제재생에너지기구(International Renewable Energy Agency):2009년 1월 [[독일 본]]에서 [[독일]]·덴마크 등 유럽 국가 주도로 설립되고 사무국이 UAE 아부다비에 위치한 국제기구로서 EU 국가·미국·중국·인도·한국 등 160개 이상 국가가 참여하여 재생에너지 확대와 에너지 전환 협력을 추진한다."},{"id":"i1782","t":"제1차 석유위기:[[1973]]년 제4차 중동전쟁을 계기로 OPEC 산유국(사우디아라비아 등 아랍 산유국)이 미국·서방에 대한 금수조치와 감산을 단행하면서 국제 유가가 급등한 사건이다."},{"id":"i1783","t":"제2차 석유위기:1979년 [[이란]]혁명으로 [[이란]]의 석유 생산이 급감하고 공급 불안이 발생하면서 국제 유가가 다시 급등한 사건이다."},{"id":"i1784","t":"석유수송로 : 중동 페르시아만 산유지대에서 생산된 원유가 호르무즈 해협 → 인도양 → [[말라카]] 해협 또는 수에즈운하·바브엘만데브 해협을 거쳐 동아시아·유럽·북미로 이동하는 해상 네트워크에 의존하며, 특히 호르무즈 해협(사우디아라비아·이란·이라크·쿠웨이트·UAE 원유 통과)과 [[말라카]] 해협(동아시아 공급 핵심)이 대표적 병목지점이다."},{"id":"i1785","t":"석유분포도 : 석유수출국기구 및 BP 『Statistical Review of World Energy』 통계에 따르면 세계 석유 확인매장량은 [[베네주엘라]](1위) → 사우디아라비아(2위) → 캐나다(3위) → 이란(4위) → 이라크(5위) → 러시아(6위) → 쿠웨이트(7위) → UAE(8위) → 미국(9위) → 리비아(10위) 순으로 분포하고 있다."}]},{"id":"i1786","title":"에너지 안보 관련 쟁점","note":"","items":[{"id":"i1787","t":"[[비엘레키]]에 의하면 에너지안보는 합리적 가격을 통한 안정적이고 적정한 에너지 공급을 말한다."},{"id":"i1788","t":"에너지 국제정치학자 [[예르긴]]은 에너지 안보 개념이 석유의 안정적 확보 개념을 넘어 석유·전력 등을 포함한 모든 에너지의 생산, 해상 및 육상 수송, 유통 인프라에 대한 보호 등을 포괄하는 개념으로 확대되어야 한다고 주장했다."},{"id":"i1789","t":"1956년에 지질학자 [[킹 허버트]]는 ‘피크오일 이론’을 발표해 세계 석유 생산이 수십 년 내에 정점에 도달할 것이며 그 이후 유전이 완전히 고갈될 때까지 생산 속도는 줄어들 것이라고 주장했다."},{"id":"i1790","t":"[[에너지헌장조약]]은 에너지 수출국과 수입국 간의 상호의존을 법적으로 구속력 있는 조약으로 강화하기 위해 마련된 다자간 에너지 협정으로 1991년 6월 네덜란드의 전 수상이었던 루드 루버스가 더블린에서 열린 유럽위원회 회의에 참석해 유럽에너지공동체의 창설을 제안한 것으로부터 비롯되었다."},{"id":"i1791","t":"[[국제에너지기구(IEA)]]는 1973년 아랍-이스라엘 분쟁의 발발과 친이스라엘계열의 서방 국가들에 대해 석유수출국기구가 실시한 석유 엠바고 등으로 건설의 필요성을 절감한 OECD국가들을 중심으로 설립되었다."},{"id":"i1792","t":"1991년 첫 회의를 가진 [[국제에 너지포럼]]는 에너지 수출국과 수입국의 에너지 장관이 매년 모여 의견을 교환하는 다자기구이다."},{"id":"i1793","t":"이란의 수도 테헤란에서 2001년에 개최된 주요 가스 수출국들의 각료 회담에서 시작된 [[가스수출국포럼(GECF)]]은 가스 수출 국가 간 조응과 협력을 강화하기 위한 목적에서 설립된 정부간기구이다. 2011년 11월 도하에서 [[가스수출국포럼(GECF)]] 정상회담이 최초로 개최되었으며 회원국은 알제리, 볼리비아, 이집트, 적도기니, 이란, 리비아, 나이지리아, 카타르, 러시아, 트리니타드 토바고, 베네네수엘라이다."},{"id":"i1794","t":"[[GECF]]는 천연가스 생산과 관련해 OPEC와 같이 쿼터를 할당하기보다는 각 회원국의 독립과 자율적 결정을 존중하며, 천연가스는 지역적인 상품인 관계로 국가 간 파이프라인을 통한 수출을 통제할 수 없는 이유 등 특성상 OPEC와 같이 카르텔화(Gas-OPEC)되기 어려운 구조로 평가된다."},{"id":"i1795","t":"[[리차드 오티]]는 『Sustaining Development in Mineral Economies: The Resource Curse Thesis』(1993)에서 자원이 풍부한 국가일수록 경제성장과 산업다변화가 저해되는 ‘자원저주’가 나타난다고 보았으며, 그 이유로 자원 수출 증가에 따른 외화 유입 확대로 자국 통화가치가 상승(환율 하락)하여 제조업·농업 등 비자원 부문의 가격경쟁력이 약화되는 ‘네덜란드병’, 자원수입에 따른 지대추구와 부패의 확산, 그리고 자원 통제를 둘러싼 권력 경쟁으로 내전과 정치적 불안정이 유발될 수 있음을 지적하였다."},{"id":"i1796","t":"Michael T. Klare는 자원은 점점 희소해지기 때문에 국가 간 경쟁이 심화되며, 특히 [[석유]] 등 전략자원을 둘러싼 갈등이 미래 전쟁의 주요 원인이 된다고 보았다. 자원 확보는 단순한 경제 문제가 아니라 국가안보와 직결된 문제로서 군사적 충돌로 이어질 가능성이 높다고 주장하였다."},{"id":"i1797","t":"[[Michael L. Ross]]는 석유 등 자원 수입은 국가의 세입 구조를 왜곡시켜 정부의 책임성을 약화시키고 민주주의 발전을 저해한다고 분석하였다. 또한 자원 부국은 권위주의가 강화되고 정치적 부패와 불안정이 심화되는 경향이 있다고 보았다."},{"id":"i1798","t":"Jan H. Kalicki는 에너지 안보가 단순한 공급 확보를 넘어 국가 전략과 외교정책 차원에서 관리되어야 하며, 공급원과 수송 경로의 [[다변화]]가 핵심이라고 강조하였다. 특히 특정 지역이나 국가에 대한 의존을 줄이는 것이 지정학적 리스크를 완화하는 중요한 수단이라고 보았다."},{"id":"i1799","t":"Michael Bradshaw는 에너지 안보가 자원의 지리적 분포와 수송망 구조에 의해 형성되는 [[지정학]]적 문제로 이해해야 한다고 주장하였다. 글로벌 에너지 공급망은 국가 간 상호의존을 심화시키는 동시에 새로운 경쟁과 갈등을 유발할 수 있다고 보았다."}]}]},{"id":"i1800","title":"식량안보","secs":[{"id":"i1801","title":"식량안보를 위한 국제 협력의 역사","note":"","items":[{"id":"i1802","t":"World Food Conference 1974 (1974): 1970년대 세계 식량위기와 곡물가격 급등을 배경으로 개최된 최초의 글로벌 식량회의로, 식량안보 문제가 국제정치의 핵심 의제로 부상하였으며 “충분한 식량의 안정적 공급 확보”라는 [[공급]] 중심 개념이 확립되었고, 이후 국제 식량정책에서 국가 및 국제기구의 역할 확대의 출발점이 되었다."},{"id":"i1803","t":"International Conference on Nutrition 1992 (1992): 개발도상국의 만성적 영양결핍 문제를 배경으로 개최되어 식량문제를 단순한 공급 문제가 아니라 영양, 보건, 위생과 결합된 인간 중심 문제로 재정의하였으며, 이후 식량안보 개념이 건강·[[영양]] 요소를 포함하는 방향으로 확장되는 계기를 제공하였다."},{"id":"i1804","t":"World Food Summit 1996 (1996): 냉전 종식 이후 개발과 빈곤 문제가 부각되는 가운데 개최되어 “모든 사람이 항상 충분하고 안전하며 영양가 있는 식량에 [[접근]]할 수 있는 상태”라는 현대적 식량안보 정의를 확립하였고, 2015년까지 기아 인구를 절반으로 감소시키겠다는 구체적 목표를 설정함으로써 식량안보의 기준과 정책 방향을 제도화하였다."},{"id":"i1805","t":"World Food Summit: five years later 2002 (2002): 1996년 정상회의 이후 목표 달성 상황을 점검하기 위해 개최되었으며, 기아 감소 속도가 매우 더디다는 점과 국제사회의 재정·정책적 의지 부족이 확인되었고, 실행력 강화와 [[개발도상국]] 지원 확대 필요성이 강조되었다."},{"id":"i1806","t":"High-Level Conference on World Food Security 2008 (2008): 세계 곡물가격 폭등과 식량폭동이 발생한 글로벌 식량위기를 배경으로 개최되어 식량문제가 단순한 농업 문제가 아니라 에너지, [[기후변화]], 무역정책과 긴밀히 연결된 복합 위기임이 확인되었으며, 긴급 대응과 국제협력 필요성이 크게 부각되었다."},{"id":"i1807","t":"World Summit on Food Security 2009 (2009): 2008년 위기의 후속 대응으로 개최되어 식량안보를 [[글로벌거버넌스]] 차원에서 관리할 필요성이 강조되었고, 특히 세계식량안보위원회(CFS)가 개편되어 국가뿐 아니라 시민사회와 민간부문까지 참여하는 포괄적 협의체로 발전하였다."},{"id":"i1808","t":"G20 [[Seoul]] Summit 2010 (2010): 글로벌 금융위기 이후 경제 회복과 함께 식량가격 변동성이 주요 의제로 등장하면서 식량안보가 거시경제 및 개발정책과 연계된 문제로 인식되었고, 개발도상국 농업생산성 향상과 식량시장 안정화의 필요성이 강조되었다."},{"id":"i1809","t":"G20 Cannes Summit 2011 (2011): 식량가격 급등의 반복을 방지하기 위해 농업시장정보시스템을 도입하여 곡물 생산, 재고, 무역 정보의 [[투명성]]을 제고하고 국제 식량시장의 불확실성을 완화하려는 제도적 장치가 마련되었다."},{"id":"i1810","t":"UN Sustainable Development Summit 2015 (2015): 지속가능발전목표가 채택되면서 식량안보는 [[기아 종식]]이라는 형태로 국제사회의 핵심 개발 목표로 재정립되었고, 단순한 식량 공급을 넘어 영양 개선, 지속가능 농업, 농촌 개발을 포함하는 통합적 정책 목표로 확장되었다."},{"id":"i1811","t":"UN Food Systems Summit 2021 (2021): 기후변화, 팬데믹, 글로벌 공급망 위기를 배경으로 개최되어 기존의 식량안보 개념을 넘어 생산, [[유통]], 소비 전 과정을 포함하는 식량체계 접근이 강조되었고, 지속가능성, 환경, 기술혁신을 통합한 새로운 정책 패러다임이 제시되었다."}]},{"id":"i1812","title":"식량안보 관련 주요 학자","note":"","items":[{"id":"i1813","t":"Amartya Sen: 『Poverty and Famines: An Essay on Entitlement and Deprivation』(1981)에서 기근은 식량 부족이 아니라 [[접근권(entitlement)]]붕괴로 발생한다고 분석하여 식량안보를 생산 중심에서 분배 중심으로 전환시켰다."},{"id":"i1814","t":"Norman Borlaug: 녹색혁명을 통해 고수확 품종과 농업기술 확산으로 식량 생산을 획기적으로 증가시켜 [[생산]] 중심 식량안보 전략의 대표적 사례를 제시한 학자이다."},{"id":"i1815","t":"Joachim von Braun: 국제식량정책연구소(International Food Policy Research Institute, IFPRI) 보고서에서 식량위기를 가격 급등, [[시장실패]], 정책 미흡이 결합된 구조적 문제로 분석하며 글로벌 정책 조정의 필요성을 강조하였다."},{"id":"i1816","t":"Shenggen Fan: 『Public Expenditures, Growth, and Poverty』(2004 등 연구)에서 농업 및 농촌 [[인프라 투자]] 확대가 빈곤 감소와 식량안보 개선의 핵심 정책수단임을 실증적으로 제시하였다."},{"id":"i1817","t":"Maximo Torero: 최근 FAO 연구와 『Food Prices and Poverty』(2008, 공저) 등을 통해 식량가격 변동성과 [[공급망]] 충격이 식량 접근성을 악화시키는 핵심 요인임을 분석하며 현대 식량안보 논의를 주도하고 있다."},{"id":"i1818","t":"Jennifer Clapp: 『Food』(2012)에서 글로벌 식량체계가 [[다국적기업]]과 금융시장에 의해 구조적으로 지배된다고 분석하며 식량안보의 정치경제적 권력 구조를 강조하였다."},{"id":"i1819","t":"Timothy Wise: 『Eating Tomorrow: Agribusiness, Family Farmers, and the Battle for the Future of Food』(2019)에서 [[산업농업(industrial agriculture)]] 중심 정책이 소농을 약화시키고 식량불안을 심화시킨다고 비판하였다. [[산업농업(industrial agriculture)]] 은 대규모 자본과 기계화·화학기술을 활용해 식량 생산을 극대화한 농업 방식으로 식량 공급을 확대했지만 환경 파괴와 구조적 불평등을 초래하여 지속가능한 농업으로의 전환 필요성이 제기되고 있다."},{"id":"i1820","t":"David Tilman: 『The Ecological Basis of Agricultural Sustainability』(2002)에서 지속가능한 농업 집약화가 식량안보와 [[환경]]을 동시에 해결하는 핵심 전략임을 제시하였다. 지속가능한 농업 집약화(sustainable intensification)는 환경 훼손을 최소화하면서도 생산성을 높여 증가하는 식량 수요를 충족시키려는 농업 전략이다."},{"id":"i1821","t":"Per Pinstrup-Andersen: 『Food Policy for Developing Countries』(2009)에서 식량정책은 생산뿐 아니라 영양, [[소득분배]], 빈곤 문제를 통합적으로 고려해야 한다고 주장하였다."},{"id":"i1822","t":"Raj Patel: 『Stuffed and Starved: The Hidden Battle for the World Food System』(2007)에서 글로벌 식량체계의 [[구조적 불평등]]이 과잉과 기아를 동시에 발생시킨다고 분석하고 식량주권과 체계 개혁 필요성을 강조하였다."}]}]}]},{"id":"i1823","title":"한국 외교","chapters":[{"id":"i1824","title":"한미관계","secs":[{"id":"i1825","title":"한미관계사 ①","note":"","items":[{"id":"i1826","t":"[[1945]].09.08, United States Army Military Government in Korea가 인천에 진주하여 미군정을 실시하고 남한을 직접 통치함으로써 행정·치안·경제 제도가 미국식으로 재편되고 이후 한미동맹 형성의 제도적·정치적 기반이 마련되었다."},{"id":"i1827","t":"1953.10.01, 양국은 워싱턴에서 한미상호방위조약을 체결하고 1954.[[11]]월.18 비준서 교환으로 발효하여 상호 방위와 군사원조를 제도화하고 공동의 위험에 대해 각국의 헌법 절차에 따라 대응하는 집단방위체제를 확립함으로써 한미동맹을 법적·제도적으로 공식 성립시켰다."},{"id":"i1828","t":"1966년 3월, 베트남전 한국군 파병의 대가로 미국과 [[브라운]] 각서를 체결하여 군사원조 확대, 경제차관 제공, 한국 기업의 베트남 전쟁 특수 참여와 군납·건설사업을 보장함으로써 안보협력을 경제개발 지원과 연계하는 ‘안보–경제 교환형 동맹’ 구조가 형성되어 산업화와 외화 획득에 크게 기여하였다."},{"id":"i1829","t":"1971년, Richard Nixon의 닉슨 독트린([[1969]]년 발표)에 따라 주한미군 제7사단 약 2만 명이 단계적으로 철수하여 아시아 방위의 현지국 책임 원칙이 적용되면서 한국의 자주국방 부담이 확대되고 동맹 구조가 미군 의존형에서 한국군 역할 증대형으로 전환되었다."},{"id":"i1830","t":"[[1978]]년.11.07, 한미연합군사령부가 창설되어 전시작전통제권이 연합지휘체제로 통합됨으로써 연합작전 체제가 제도화되고 동맹의 군사적 일체성이 구조적으로 강화되었다."},{"id":"i1831","t":"1991년, 미국이 한반도 내 전술핵무기를 전면 철수하고 같은 해 한반도 비핵화 공동선언(1991.12.13 발표)이 채택됨으로써 냉전기 핵억제 중심 방위태세가 재조정되고 확장억제 방식이 재편되어 한반도 비핵화와 신뢰구축 단계로 전환되었으며 당시 대통령은 [[노태우]]이다."},{"id":"i1832","t":"2003년, 이라크 전쟁 당시 [[자이툰]]부대 파병이 결정되어 한국군이 한반도 밖 분쟁에 참여함으로써 동맹이 지역 방위동맹을 넘어 글로벌 안보협력 동맹으로 확대되고 국제안보 기여 국가로서의 역할이 강화되었으며 당시 대통령은 [[노무현]]이다."},{"id":"i1833","t":"[[2007]].04.02., 노무현 행정부 당시, 한미 자유무역협정 협상이 최종 타결되어 관세 철폐와 서비스·투자 시장 개방이 합의됨으로써 군사동맹을 넘어 포괄적 경제동맹으로 발전하는 제도적 기반이 마련되었다."},{"id":"i1834","t":"2012.03.15., [[이명박]] 정부 당시, 한미 자유무역협정이 공식 발효되어 상품·서비스·투자 분야의 실질적 시장 통합이 이루어지고 양국 교역과 투자가 크게 확대됨으로써 경제적 상호의존성이 심화되었다."},{"id":"i1835","t":"[[2016]]년.07.08, THAAD 배치 결정이 발표되어 북한 핵·미사일 위협에 대응하는 미사일방어 협력이 본격화되고 한미 연합 방공·억제 능력이 강화되면서 동맹이 첨단 방어체계 중심의 안보협력 단계로 발전하였으며 당시 대통령은 [[박근혜]]이다."}]},{"id":"i1836","title":"한미관계사 ②","note":"","items":[{"id":"i1837","t":"[[1882]]년 조미수호통상조약(슈펠트 조약): 조선과 미국은 제물포에서 조미수호통상조약을 체결하여 외교·통상 관계를 수립하였다. 미국 해군 제독 Robert W. Shufeldt가 협상을 주도하였으며, 조선이 서구 국가와 체결한 최초의 근대적 조약 중 하나였다. 이 조약은 치외법권·최혜국대우 등을 규정하였고 이후 서구 열강과의 조약 체결의 출발점이 되었다."},{"id":"i1838","t":"1905년 가쓰라-태프트 밀약: 미국 육군장관 William Howard Taft와 일본 총리 Katsura Tarō 사이의 회담에서 미국은 일본의 한반도 지배를 사실상 묵인하고 일본은 미국의 [[필리핀]] 지배를 인정하는 방향의 이해를 형성하였다."},{"id":"i1839","t":"1953년 한미상호방위조약 체결: 대한민국과 미국은 1953년 10월 1일 워싱턴에서 한미상호방위조약을 체결하였고, [[1954]]년 11월 18일 발효되었다. 이승만정부는 미국의 안보 보장을 요구하였고 미국은 냉전 질서 속에서 한국 방위를 제도화하였다. 조약 제3조는 외부 무력공격에 공동 대응할 것을 규정하였으며, 제4조는 미국이 한국 영토와 그 부근에 육·해·공군을 배치할 수 있는 근거를 마련하였다."},{"id":"i1840","t":"1960년대 박정희 정부와 한미협력 강화: 박정희정부는 미국의 안보 지원 아래 경제개발계획을 추진하였고 미국은 원조·차관·기술 지원을 제공하였다. 특히 한국은 베트남전에 [[맹호]]부대(수도사단), 청룡부대(해병 제2여단), 백마부대(제9보병사단) 등을 파병하여 미국의 반공전략에 협력하였다."},{"id":"i1841","t":"1969~1971년 닉슨 독트린과 주한미군 감축: 미국 대통령 Richard Nixon은 베트남전 장기화와 미국의 부담 축소를 배경으로 ‘닉슨 독트린’을 발표하여 아시아 동맹국들이 스스로 방위를 더 많이 책임져야 한다고 강조하였다. 이에 따라 미국은 [[1971]]년 주한미군 제7보병사단 약 2만 명 규모를 철수하였다. 이후 Jimmy Carter 행정부도 주한미군 철수를 추진하였으나 북한 위협과 미국 군부·의회의 반대로 약 3,400명 철수에 그쳤다."},{"id":"i1842","t":"1999년 페리 프로세스(Perry Process): 미국의 대북정책조정관 William Perry는 북핵 문제 해결을 위한 포괄적 대북정책 보고서를 발표하였다. 이른바 ‘페리 프로세스’는 북한이 핵·미사일 개발을 중단하면 미국과 일본이 관계 정상화와 경제 지원을 제공하고, 거부할 경우 압박을 강화한다는 포괄적 접근을 제시하였다. 이는 이후 [[클린턴]] 행정부의 대북 유화정책과 북미대화의 기반이 되었다."},{"id":"i1843","t":"2003년 이라크전과 [[자이툰]] 부대 파병: 노무현정부는 미국의 이라크 전쟁 지원 차원에서 [[자이툰]] 부대를 파병하였다. 이는 베트남전 이후 최대 규모 해외파병 중 하나였으며, 노무현 정부는 북핵 문제 해결과 한미동맹 관리를 위해 파병 필요성을 강조하였다."},{"id":"i1844","t":"2006~2007년 전시작전통제권전환 합의: 노무현정부는 미국과의 협의를 통해 한국군이 보유하지 못했던 전시작전통제권을 한국 측에 전환하기로 합의하였다. 2006년 한미안보협의회의(SCM)에서 기본 방향이 확인되었고, 2007년 양국은 [[2012]]년 4월까지 전환을 추진하기로 공식 합의하였다. 이후 북한 핵·미사일 위협 심화로 인해 전환 시기는 계속 연기되었다."},{"id":"i1845","t":"2007년 한미 FTA 체결: 한국과 미국은 한미 자유무역협정(KORUS FTA)에 서명하였다. 이는 한국 최대 규모 FTA 중 하나로 상품·서비스·투자·지식재산권 등을 포괄하였다. 농업·의료·문화산업 피해 우려로 한국 내 대규모 반대 시위가 발생하였다. 이후 일부 재협상을 거쳐 [[2012]]년 공식 발효되었다."},{"id":"i1846","t":"[[2016]]년 사드(THAAD) 배치 결정: 북한의 핵·미사일 위협 고도화에 대응하여 한국과 미국은 고고도미사일방어체계(THAAD)의 한국 배치를 결정하였다. 미국은 대북 방어 목적이라고 설명하였으나 중국은 자국 안보 위협이라며 강하게 반발하였다."}]}]},{"id":"i1847","title":"한중·한일관계","secs":[{"id":"i1848","title":"한중관계사","note":"이재명 대통령이 중국을 국빈 자격으로 방문해 시진핑 중국 국가주석과 한중 정상회담을 갖는다. 한국 대통령의 중국 국빈 방문은 9년 만이며, 두 정상은 지난해 11월 경주 정상회담 이후 두 달여 만에 다시 마주한다. 한국 정부는 특히 이번 방중을 계기로 경제와 민생 분야를 중심으로 한중 관계 복원 흐름을 공고히 하겠다는 입장이다. 지난해 11월 경주 정상회담에서 합의됐던 공급망 안정화와 인공지능(AI) 분야 협력 관련 양해각서(MOU)의 이행을 위한 후속 논의도 이번 정상회담에서 이어질 전망이다. 경제사절단에 콘텐츠 기업들이 포함된 것으로 알려지면서, 이른바 '한한령' 완화 가능성에도 관심이 쏠린다. 한반도 문제 역시 주요 의제 중 하나다. 한국 정부는 북한 문제와 관련해 중국과의 소통을 강화하고, 역내 안정과 평화 유지를 위한 중국의 건설적인 역할을 강조할 방침이다. 다만 정상회담을 앞두고 안보 현안을 둘러싼 한중 간 인식 차이도 드러나고 있다. 서해 한중 잠정조치 수역 내 중국의 구조물 설치 문제와 중국 어선의 불법 조업, 한국의 핵추진 잠수함 건조 추진 등은 이번 정상회담에서 함께 거론될 가능성이 있는 안보 현안으로 꼽힌다. 특히 핵잠 건조 추진과 관련해 중국은 핵비확산과 지역 안정에 대한 원칙적 우려를 표명해 왔다. 한편, 이번 방중 일정과 형식 자체가 중국의 한국 중시를 보여준다고 평가도 있다. 박승찬 용인대 중국학과 교수는 \"이번 국빈 방문은 한중 양국 모두에게 올해 첫 정상외교이자, 중국이 연초에 가장 먼저 만나는 외국 정상이라는 점에서 상징성이 크다\"고 설명했다. 박 교수는 \"시진핑 주석뿐 아니라 총리와 국회의장 등 중국 권력 서열 1·2·3위 인사가 모두 만나는 일정은 이례적\"이라며 \"중국이 한국을 동북아 외교와 경제 질서에서 중요한 파트너로 대우하고 있다는 점을 보여준다\"고 말했다.(BBC코리아,260102)","items":[{"id":"i1849","t":"[[1882]]년 조선의 고종과 청나라 광서제가 체결한 조청상민수륙무역장정은 조선을 청의 종속적 조공 질서 아래 두면서 중국 상인에게 조선 내 통상·치외법권적 특권을 부여한 근대적 불평등 통상조약이었다."},{"id":"i1850","t":"1949년 중국에서 [[마오쩌둥]]이 중화인민공화국을 수립하고 이승만이 대한민국을 이끌던 시기에 한국은 대만 장제스 정부만을 합법 중국으로 인정하며 중화인민공화국과는 단절된 외교관계를 유지했다."},{"id":"i1851","t":"1950년 [[10]]월 한국전쟁 중 마오쩌둥의 중국 인민지원군이 참전하여 이승만 정부의 한국군·유엔군과 교전함으로써 한중 관계는 사실상의 전쟁 상태로 고착되었다."},{"id":"i1852","t":"1971년 박정희 정부 시기에 유엔 [[총회]] 결의 제2758호로 중화인민공화국(마오쩌둥 체제)이 중국의 유일 합법정부로 승인되면서 한국의 대만 외교는 국제적으로 급속히 고립되었다."},{"id":"i1853","t":"1992년 8월 24일노태우 대통령과 [[장쩌민]]주석은 한중 수교를 통해 냉전적 적대관계를 공식적으로 청산하고 외교·경제 협력의 제도적 틀을 출범시켰다."},{"id":"i1854","t":"2000년 [[김대중]] 대통령과 장쩌민 주석 시기에 체결·발효된 한중 어업협정은 서해의 잠정조치수역과 배타적 어업질서를 설정하여 양국 간 어업 분쟁을 제도적으로 관리하는 기틀을 마련했다."},{"id":"i1855","t":"[[2001]]년 김대중 대통령과 장쩌민 주석 시기에 중국의 세계무역기구(WTO) 가입을 계기로 한중 무역은 다자무역규범 하에서 급증하는 구조가 형성되며 한국의 대중국 수출·투자와 중국의 대한국 중간재 수입이 확대되었다."},{"id":"i1856","t":"2015년 6월 박근혜 대통령과 [[시진핑]] 주석이 한중 자유무역협정(FTA)에 서명함으로써 양국 간 상품·서비스·투자 자유화가 법적으로 구속되는 고도화된 경제통합 단계가 개시되었다."},{"id":"i1857","t":"2016~2017년박근혜·문재인 정부와 시진핑 정부 사이에서 사드(THAAD) 배치로 촉발된 갈등을 봉합하기 위해 문재인 정부가 사드 추가배치 불가· 미국 [[MD]] 불참·한미일 군사동맹 불가라는 ‘3불(三不)’ 입장을 표명하면서 중국의 비공식 경제보복은 완화되었으나 한중 간 전략적 불신은 구조적으로 남았다."},{"id":"i1858","t":"2024년 기준 한국과 중국의 교역 규모는 약 [[2729]]억 달러로 중국이 한국의 최대 교역국 지위를 유지했으며, 한국은 그 해 대중 무역에서 약 69억 달러의 적자를 기록해 과거 오랜 기간 지속된 무역흑자가 적자로 전환되었다."}]},{"id":"i1859","title":"위안부 문제","note":"최근 한국 사회에서 위안부 문제를 둘러싼 논쟁은 2015년 한일 위안부 합의의 법적 구속력과 피해자 동의 여부, 일본의 국가책임 인정 범위를 핵심 쟁점으로 하여, 시민사회와 피해자 단체는 일본군 ‘성노예제’에 대한 법적 책임과 공식 배상, 역사적 정의 실현을 요구하며 합의의 재검토 또는 무효화를 주장하는 반면, 외교·안보 현실주의 진영은 한일관계 안정과 대북·대중 안보협력을 위해 외교적 타협의 불가피성을 강조하고 있고, 특히 뉴라이트 계열은 위안부 동원의 강제성과 국가범죄성을 축소하거나 민간 업자 중심의 매춘 구조 측면을 부각하면서 기존 담론이 반일 민족주의에 치우쳤다고 비판하고 1965년 한일청구권 체제 내에서 문제를 종결해야 한다는 입장을 취하여, 결과적으로 역사정의·피해자 중심주의와 국가이익·관계개선 우선론, 그리고 책임 축소론이 상호 충돌하는 다층적 사회갈등이 지속되고 있다.","items":[{"id":"i1860","t":"1991.8.14, 피해자 김학순이 최초로 공개 증언을 하여 일본군 위안부 문제가 국제적 인권문제로 본격 제기되었다."},{"id":"i1861","t":"[[1993]]년.8.4, 일본 관방장관 고노 요헤이는 이른바 고노담화를 발표하여 일본군의 관여와 강제성을 인정하고 사죄와 반성의 뜻을 표명하였다."},{"id":"i1862","t":"1995.7, 일본 정부는 법적 배상 대신 [[민간]]기금 형식의 아시아여성기금을 설립하여 도의적 보상을 실시하였으나 한국 피해자 다수는 국가책임 회피라며 거부하였다."},{"id":"i1863","t":"1996.1, 유엔 인권위원회 특별보고관 [[라디카 쿠마라스와미]]보고서는 위안부 제도를 군사적 성노예제로 규정하고 일본의 법적 책임과 배상을 권고하였다."},{"id":"i1864","t":"1998.6, 유엔 인권소위원회 특별보고관 [[게이 맥두걸]]의 [[맥두걸]] 보고서는 위안부를 전시 성노예제 및 반인도적 범죄로 규정하고 일본의 국가책임과 공식 배상을 명시적으로 요구하였다."},{"id":"i1865","t":"2015.[[12]].28, 한국과 일본은 외교장관 회담에서 2015년 한일 위안부 합의를 통해 일본 정부 예산 10억 엔 출연과 최종적·불가역적 해결을 선언하였다."},{"id":"i1866","t":"2015년 합의에서 일본 총리 명의의 사죄 표명과 재단 설립이 약속되었으나 [[법]]적 책임 인정과 공식 배상이 아니라는 점에서 국내 비판이 제기되었다."},{"id":"i1867","t":"2016.7, 한국 [[박근혜]]정부는 피해자 지원을 위해 화해치유재단을 출범시켰으나 피해자 동의 부족 논란이 지속되었다."},{"id":"i1868","t":"2018.11, 한국 [[문재인]] 정부는 합의의 절차적·내용적 흠결을 이유로 화해치유재단을 해산하고 사실상 2015년 합의를 무력화하였다."},{"id":"i1869","t":"현재 일본 정부는 [[고노]]담화 계승과 도의적 책임은 인정하되 법적 책임과 추가 배상은 부인하는 입장을 유지하는 반면, 한국은 국가책임 인정과 진정성 있는 사죄·배상을 지속 요구하고 있다."}]}]},{"id":"i1870","title":"북한·북핵","secs":[{"id":"i1871","title":"북핵 일지","note":"","items":[{"id":"i1872","t":"1985년 12월 북한은 [[소련]]과의 원전 협력 조건으로 핵확산금지조약(NPT)에 가입하였으나, 국제원자력기구(IAEA)의 전면 사찰을 장기간 거부하면서 핵무기 개발 의혹이 본격화되었다."},{"id":"i1873","t":"1993년 3월 북한이 [[IAEA]]의 특별사찰 요구를 거부하고 NPT 탈퇴를 선언하면서 제1차 북핵 위기가 발생하였고, 이는 한반도 전쟁 위기로까지 확산되었다."},{"id":"i1874","t":"1994년 10월 미국과 북한은 제네바 기본합의(Agreed Framework)를 체결하여 북한이 흑연감속로를 동결하는 대신 미국이 [[경수로]] 제공과 중유 지원을 약속하는 동결 대 보상 구조를 만들었다."},{"id":"i1875","t":"[[1999]]년 9월 윌리엄 페리 전 미 국방장관이 주도한 페리 프로세스(Perry Process)는 북한의 미사일·핵개발 중단을 대가로 미국의 대북 제재 완화와 관계 정상화를 추진하는 포괄적 협상 구상을 제시하였다."},{"id":"i1876","t":"[[2003]]년 1월 북한은 NPT에서 공식 탈퇴하고, 이후 6자회담 체제로 북핵 문제가 다자 외교 의제로 전환되었다."},{"id":"i1877","t":"2005년 9월 제4차 6자회담에서 채택된 9·19 공동성명에서 북한은 모든 핵무기와 핵프로그램 포기를 약속하였으나, 곧이어 미국의 [[방코델타아시아(BDA)]] 금융제재로 이행이 중단되었다."},{"id":"i1878","t":"북한은 2006년 [[10]]월 1차, 2009년 5월 2차, 2013년 2월 3차, 2016년 1월 4차, 2016년 9월 5차, 2017년 9월 6차 핵실험을 실시하였고, 이에 대응하여 유엔 안보리는 1718호(2006년 10월), 1874호(2009년 6월), 2094호(2013년 3월), 2270호(2016년 3월), 2321호(2016년 11월), 2375호(2017년 9월) 제재 결의를 채택하였다."},{"id":"i1879","t":"2018년 6월 [[싱가폴]]에서 열린 미북 정상회담에서 김정은과 트럼프 대통령은 한반도 비핵화와 새로운 미북 관계 수립에 합의하였다."},{"id":"i1880","t":"2019년 2월 [[하노이]] 미북 정상회담은 북한의 제재 해제 요구와 미국의 완전한 핵폐기 요구가 충돌하면서 합의 없이 결렬되었다."},{"id":"i1881","t":"2022년 9월 북한은 [[핵무력정책]]법을 제정하여 선제 핵사용 가능성을 법제화하고 핵보유국 지위를 국내법적으로 명문화하였다."}]},{"id":"i1882","title":"북핵문제 복습","note":"","items":[{"id":"i1883","t":"제1차 핵실험(2006.10.9): 북한은 함경북도 길주군 풍계리에서 첫 지하 핵실험을 실시하며 사실상 핵보유를 선언하였고, 유엔 안전보장이사회는 안보리 결의 [[1718]]호(2006)를 통해 핵·미사일 관련 물자 이전 금지, 사치품 금수, 관련 개인·기관 자산동결 및 여행금지 등의 제재를 부과하였다."},{"id":"i1884","t":"제2차 핵실험( [[2009]]년.5.25): 북한은 장거리 로켓 발사에 대한 국제사회의 제재 이후 두 번째 핵실험을 강행하였고, 유엔 안전보장이사회는 안보리 결의 1874호(2009)를 채택하여 무기금수 범위를 확대하고 북한 선박 검색, 금융거래 감시 및 대량살상무기 확산 차단 조치를 강화하였다."},{"id":"i1885","t":"제3차 핵실험(2013.2.12): 북한은 “소형화·경량화된 원자탄” 실험에 성공했다고 주장하며 세 번째 핵실험을 실시하였고, 유엔 안전보장이사회는 안보리 결의 [[2094]]호(2013)를 통해 북한 외교관의 불법 금융활동 감시, 현금 운반 제한, 금융기관 거래 차단 등 금융제재를 대폭 강화하였다."},{"id":"i1886","t":"제4차 핵실험(2016.1.6): 북한은 “첫 수소탄 시험 성공”이라고 주장하며 4차 핵실험을 실시하였고, 유엔 안전보장이사회는 안보리 결의 2270호(2016)를 통해 [[석탄]]·철광석 수출 제한, 항공유 공급 금지, 화물검색 의무화 등 당시까지 가장 강력한 대북제재를 부과하였다."},{"id":"i1887","t":"제5차 핵실험(2016.9.9): 북한은 핵탄두 표준화 및 전략탄도로켓 장착 능력을 주장하며 5차 핵실험을 실시하였고, 유엔 안전보장이사회는 안보리 결의 2321호(2016)를 채택하여 북한 석탄수출 [[상한제]] 도입, 구리·니켈·은·아연 수출 제한, 외교공관 활동 감시 강화 등의 추가 제재를 시행하였다."},{"id":"i1888","t":"제6차 핵실험(2017.9.3): 북한은 대륙간탄도미사일(ICBM) 장착용 수소탄 시험이라고 주장하며 역대 최대 규모의 핵실험을 실시하였고, 유엔 안전보장이사회는 안보리 결의 2375호(2017)를 통해 섬유수출 전면 금지, 정제유 공급 제한, 북한 [[해외노동자]] 신규 고용 금지 등 경제제재를 한층 강화하였다."},{"id":"i1889","t":"북한 「핵보유국 지위 공고화법」(2013): 북한은 최고인민회의에서 「자위적 핵보유국의 지위를 더욱 공고히 할 데 대하여」라는 법을 채택하여 핵무기를 미국의 “적대시 정책”에 대응하기 위한 자위적 억제력으로 규정하고, [[비핵국가]]에 대한 핵무기 불사용 원칙과 함께 핵보유국 지위를 헌법적·법률적으로 제도화하였다."},{"id":"i1890","t":"북한 「핵무력정책법」(2022): 북한은 최고인민회의에서 핵무력의 사명·구성·지휘통제 체계와 핵무기 사용 조건을 규정한 「핵무력정책에 대하여」 법령을 채택하였으며, 지도부나 국가 존립에 대한 위협이 있을 경우 [[선제]] 핵사용이 가능하다고 명시하여 핵사용 교리를 보다 공격적으로 발전시켰다."},{"id":"i1891","t":"9·19 공동성명( [[2005]]년.9.19): 제4차 6자회담에서 북한은 모든 핵무기와 현존 핵계획 포기 및 핵확산금지조약(NPT)·국제원자력기구(IAEA) 복귀 의사를 표명하였고, 미국은 북한에 대한 공격·침공 의사가 없음을 확인하며 관계정상화 추진과 한반도 평화체제 논의를 병행하기로 합의하였다."},{"id":"i1892","t":"페리 프로세스(Perry Process, [[1999]]년): William Perry가 미국 대북정책조정관으로 작성한 ‘페리 보고서’를 중심으로 추진된 대북 포괄협상 구상으로, 북한이 핵·미사일 개발을 동결·포기하면 미국은 관계정상화와 경제지원·안전보장을 제공하고, 거부할 경우 제재와 억지를 강화한다는 ‘포괄적 접근(comprehensive approach)’을 핵심으로 하였다."}]},{"id":"i1893","title":"북중관계사","note":"","items":[{"id":"i1894","t":"[[1948]].09.09 북한 건국: 북한은 [[1948]]년 9월 9일 평양에서 조선민주주의인민공화국(DPRK) 수립을 선포하였다. 소련군 점령하의 북반부에서 수립된 사회주의 정권으로, 김일성이 초대 내각 수상에 취임하였다."},{"id":"i1895","t":"[[1949]].10.06 북중 수교: 중화인민공화국이 [[1949]]년 10월 1일 건국된 직후 북한은 이를 승인하였고, 10월 6일 공식 외교관계를 수립하였다. 양국은 모두 사회주의 혁명을 통해 성립한 국가라는 공통점을 바탕으로 정치·경제·군사 협력을 확대하기 시작하였다."},{"id":"i1896","t":"1950.10 중국인민지원군 참전: 한국전쟁 발발 이후 유엔군이 압록강 부근까지 진격하자 중국은 국가안보에 대한 위협을 우려하였다. 이에 마오쩌둥은 1950년 10월 중국인민지원군 파병을 결정하였고, [[펑더화이(팽덕회)]]가 사령관으로 참전하였다. 중국군의 참전은 전쟁의 흐름을 바꾸었으며 북한 정권의 존속을 가능하게 만들었다."},{"id":"i1897","t":"[[1953]].11 조중경제 및 문화협조협정 체결: 정전협정 체결 이후 중국은 전쟁으로 폐허가 된 북한의 재건을 적극 지원하였다. 양국은 경제 및 문화 협력협정을 체결하여 산업시설 복구, 기술 지원, 인력 교류 등을 추진하였다."},{"id":"i1898","t":"1956.08 종파사건: 북한 노동당 내 연안파와 소련파 인사들은 김일성의 권력집중과 개인숭배를 비판하였다. 중국과 소련은 김일성에게 [[집단지도]]체제 복귀를 권고하였으나, 김일성은 반대세력을 숙청하고 권력을 더욱 강화하였다. 이 사건은 북한이 중국과 소련의 영향력에서 벗어나 독자노선을 추구하는 계기가 되었으며, 북중관계에도 일시적 긴장을 초래하였다."},{"id":"i1899","t":"1961.07.11 조중 우호협조 및 상호원조조약 체결: 김일성과 [[저우언라이]]는 베이징에서 「조중 우호협조 및 상호원조조약」에 서명하였다. 조약 제2조는 일방이 무력공격을 받을 경우 상대방이 즉각 군사적 및 기타 원조를 제공하도록 규정하였다. 조약 제7조에 따르면 쌍방 간 파기 합의가 없는 한 계속 효력을 가진다. 2021년 7월(체결 60주년)에 북한과 중국 양국 정상(김정은·시진핑)이 축전을 교환하며 이 조약의 효력과 양국 동맹 관계를 공식적으로 재확인 바 있다."},{"id":"i1900","t":"1966.05~1969 문화대혁명과 관계 악화: 중국에서 문화대혁명이 시작되자 홍위병들은 김일성을 [[수정주의자]]라고 비판하였다. 북한은 이에 강하게 반발하였고 양국 언론은 상대방을 비난하는 논평을 게재하였다. 국경지역에서도 긴장이 높아졌으며 북중관계는 건국 이후 가장 어려운 시기 중 하나를 맞이하였다. 다만 양국 모두 소련과 미국이라는 외부 변수 때문에 완전한 결별은 피하였다."},{"id":"i1901","t":"2012.08 나선·[[황금평]] 공동개발 협정 체결: 북한과 중국은 나선경제무역지대와 [[황금평]]·위화도 경제지대를 공동 개발하기 위한 협정을 체결하였다. 중국은 동북지역 발전과 동해 진출 통로 확보를 기대하였고, 북한은 외자 유치와 경제 활성화를 기대하였다. 비록 기대만큼의 성과를 거두지는 못했지만 북중 경제협력의 대표적 사례로 평가된다."},{"id":"i1902","t":"[[2018]].03 김정은 첫 방중: 김정은은 집권 이후 처음으로 중국을 방문하여 시진핑과 정상회담을 개최하였다. 당시 북미정상회담과 남북정상회담을 앞두고 있었으며, 북한은 중국과의 전략적 협의를 통해 외교적 입지를 강화하려 하였다. [[2018]]~2019년 동안 김정은은 총 다섯 차례 중국을 방문하였고, 냉각되었던 북중관계는 급속히 복원되었다."},{"id":"i1903","t":"2019.06.20~21 시진핑 평양 방문: 시진핑은 중국 국가주석으로는 [[후진타오]] 이후 14년 만에 북한을 방문하였다. 당시 미중 전략경쟁이 심화되고 북미 비핵화 협상이 교착 상태에 빠진 상황이었다. 시진핑과 김정은은 전통적 우호관계와 전략적 협력을 재확인하였으며, 중국은 북한의 체제안정을 지지한다는 입장을 분명히 하였다."}]}]},{"id":"i1904","title":"통일·대북정책","secs":[{"id":"i1905","title":"우리나라 통일정책 및 대북정책","note":"","items":[{"id":"i1906","t":"이승만 정부(1948~1960) : 대한민국을 한반도의 유일 합법정부로 규정하면서 초기에는 북한 지역에서 유엔 감시하 자유총선거를 실시하여 자유민주주의 체제에 의한 통일을 완성해야 한다고 주장하였고, 한국전쟁 이후에는 [[북진통일론]]을 공식화하여 무력에 의한 공산정권 붕괴와 자유민주주의 체제하의 통일을 주장하였다."},{"id":"i1907","t":"장면 정부(1960~1961) : [[유엔]] 감시하 남북 자유총선거와 평화적 통일을 주장하였으며, 학생·사회단체 중심의 남북교류 논의가 확대되는 가운데 평화통일론이 상대적으로 강화되었다."},{"id":"i1908","t":"박정희 정부(1961~1979) : 초기에는 장면정부의 평화통일 기조와 유엔 감시하 남북 자유총선거 방안을 일정 부분 계승하면서도 반공주의와 승공통일론, ‘선건설 후통일’ 기조를 강조하였고, 후기에는 데탕트 환경 속에서 ‘선평화 후통일’ 기조 아래 평화통일론으로 전환하여 1972년 「7·4 남북공동성명」에서 자주·평화·[[민족대단결]]의 통일 3원칙을 확인하고 남북조절위원회 설치에 합의하였다."},{"id":"i1909","t":"전두환 정부(1980~1988) : ‘[[민족화합민주통일방안]]’을 제시하여 남북 간 교류 확대와 점진적 통일을 주장하였고, 1984년 남북경제회담 및 이산가족 교류가 이루어졌다."},{"id":"i1910","t":"노태우 정부(1988~1993) : 북방정책과 함께 화해·협력을 통한 평화통일을 추진하였으며, 1989년 ‘[[한민족공동체통일방안]]’을 제시하여 ① 남북 간 교류·협력 확대와 신뢰 구축 단계, ② 남북연합 단계, ③ 민주적 절차에 의한 통일국가 완성 단계의 3단계 통일구조를 제안하였다. 또한 1991년 「남북기본합의서」와 「한반도 비핵화 공동선언」을 채택하여 상호 불가침·교류협력·비핵화를 제도화하려 하였다."},{"id":"i1911","t":"김영삼 정부(1993~1998) : 노태우 정부의 「한민족공동체통일방안」을 계승·발전시켜 1994년 「[[민족공동체통일방안]]」을 공식화하였으며, 화해·협력 → 남북연합 → 통일국가 완성의 3단계 구조를 유지하면서 자유민주주의 체제와 민주공동체 원리를 보다 명확히 강조하였다."},{"id":"i1912","t":"김대중 정부(1998~2003) : 햇볕정책을 추진하며 평화공존과 교류협력을 강조하였고,[[2000]]년 최초의 남북정상회담과 「6·15 남북공동선언」을 이끌어냈다."},{"id":"i1913","t":"노무현 정부(2003~2008) : [[평화번영]]정책을 추진하며 남북경제협력과 한반도 평화체제 구축을 강조하였고, 2007년 「10·4 남북정상선언」을 채택하여 경제협력과 평화체제 논의를 확대하였다."},{"id":"i1914","t":"이명박 정부(2008~2013) : ‘비핵·개방·3000’ 구상을 제시하여 북한 비핵화를 전제로 경제협력을 확대하겠다고 하였으며, 천안함 사건 이후 [[2010]]년 「5·24 조치」를 시행하였다."},{"id":"i1915","t":"박근혜 정부(2013~2017) : 한반도 신뢰프로세스를 추진하며 단계적 신뢰 구축을 통한 남북관계 정상화를 강조하였고, 2014년 [[드레스덴]] 선언에서 평화통일 구상을 제시하였다."},{"id":"i1916","t":"문재인 정부(2017~2022) : 한반도 평화프로세스를 추진하며 [[2018]]년 세 차례 남북정상회담과 「판문점선언」·「평양공동선언」 채택을 통해 평화체제와 비핵화를 추구하였다."}]},{"id":"i1917","title":"주요 대북정책 사례","note":"","items":[{"id":"i1918","t":"1991.12.13: 남북한은 「남북 사이의 화해와 불가침 및 교류·협력에 관한 합의서(남북기본합의서)」를 채택하였다. 이 합의서는 남북한이 서로의 체제를 인정하고 무력 사용을 금지하며, 정치·경제·사회·문화 분야의 교류와 협력을 확대하기로 한 최초의 포괄적 합의로 평가된다."},{"id":"i1919","t":"1991.12.31: 남북한은 「한반도 비핵화 공동선언」에 합의하였으며, 1992.02.19 발효되었다. 양측은 핵무기의 시험·제조·생산·접수·보유·저장·배비·사용을 하지 않기로 약속하고, 우라늄 농축시설과 재처리시설을 보유하지 않기로 합의하였다."},{"id":"i1920","t":"2004.12.15: 개성공단이 본격 생산에 들어갔다. 개성공단은 북한의 노동력과 한국의 자본·기술을 결합한 남북 경제협력 사업으로, 한때 120여 개의 한국 기업이 입주하고 약 5만 명의 북한 근로자가 근무하는 등 남북협력의 상징으로 자리 잡았다."},{"id":"i1921","t":"2010.05.24: 이명박 정부는 천안함 피격 사건에 대한 대응으로 「5·24 조치」를 발표하였다. 이에 따라 개성공단을 제외한 남북 교역이 중단되고, 북한 선박의 한국 해역 운항 금지, 대북 신규 투자 불허, 인도적 지원을 제외한 교류협력 제한 등이 시행되었다."},{"id":"i1922","t":"2013.02.25: 박근혜 정부는 출범과 함께 「한반도 신뢰프로세스」를 대북정책 기조로 제시하였다. 이는 북한의 도발에는 단호하게 대응하되, 대화와 협력을 통해 상호 신뢰를 축적하여 장기적으로 평화통일의 기반을 마련하겠다는 정책이었다."},{"id":"i1923","t":"2016.02.10: 박근혜 정부는 북한의 제4차 핵실험(2016.01.06)과 장거리 로켓 발사(2016.02.07)에 대응하여 개성공단 전면 중단을 결정하였다. 정부는 개성공단을 통해 유입되는 자금이 북한의 핵·미사일 개발에 활용될 가능성을 이유로 들었으며, 이 조치로 남북 경제협력은 사실상 중단되었다."},{"id":"i1924","t":"2020.06.16: 북한은 개성 남북공동연락사무소를 폭파하였다. 남북공동연락사무소는 2018년 판문점선언에 따라 설치된 상시 소통기구였으나, 북한은 대북전단 문제 등을 이유로 건물을 폭파하였고 남북관계는 급격히 냉각되었다."},{"id":"i1925","t":"2022.08.15: 윤석열 정부는 광복절 경축사에서 「담대한 구상」을 발표하였다. 북한이 실질적인 비핵화 조치에 나설 경우 식량·에너지·인프라·보건의료 지원과 국제투자 확대를 제공하겠다는 내용으로, 비핵화와 경제협력을 연계한 정책이다."},{"id":"i1926","t":"2023.01.11: 윤석열 정부는 국방부 업무보고를 통해 한국형 3축 체계 강화를 재확인하였다. 이는 북한의 핵·미사일 위협에 대응하기 위한 킬체인(Kill Chain), 한국형 미사일방어체계(KAMD), 대량응징보복(KMPR) 능력을 발전시키는 것을 핵심 내용으로 한다."},{"id":"i1927","t":"2023.11.22: 정부는 북한의 군사정찰위성 발사에 대응하여 9·19 군사합의의 일부 효력을 정지하였다. 이에 따라 군사분계선 인근 공중정찰 활동이 재개되었으며, 북한도 군사합의 전면 파기를 선언함으로써 2018년 이후 유지되던 군사적 긴장 완화 체제가 사실상 종료되었다."}]}]},{"id":"i1928","title":"정부별 대외정책","secs":[{"id":"i1929","title":"박정희 정부 대외정책 사례","note":"","items":[{"id":"i1930","t":"1964.09 베트남 비전투부대 파병: 박정희 정부는 태권도 교관단과 이동외과병원단을 베트남 전쟁에 파병하여 미국의 대공산권 봉쇄정책에 협력하였다. 이를 통해 한미동맹을 강화하고 경제·군사원조 확대의 기반을 마련하였다."},{"id":"i1931","t":"1965.06.22 한일국교정상화: 한일기본조약 체결을 통해 일본과 국교를 정상화하였다. 당시 일본 총리 사토 에이사쿠와 협력하여 청구권협정을 체결하였고, 무상 3억 달러·유상 2억 달러 등의 자금을 확보하여 포항제철 건설, 경부고속도로 건설 등 경제개발의 재원으로 활용하였다."},{"id":"i1932","t":"1965.08 베트남 전투병 파병: 수도사단(맹호부대)을 시작으로 청룡부대와 백마부대 등을 파병하였다. 한국은 미국 다음으로 많은 병력을 파견하였으며, 파병 대가로 외화 수입, 군 현대화 지원, 한국 기업의 베트남 진출 기회를 확보하였다."},{"id":"i1933","t":"1966.03 브라운 각서 체결: 브라운 각서 체결을 통해 미국으로부터 군사장비 현대화, 추가 경제원조, 한국 기업의 베트남 사업 참여 등을 약속받았다. 이는 베트남 파병에 대한 실질적 보상 성격을 가졌다."},{"id":"i1934","t":"1967.06.30 ASPAC 서울총회 개최: 아시아태평양각료이사회(ASPAC) 서울 총회를 개최하여 한국·일본·대만·호주 등 자유주의 국가들의 반공협력을 강화하였다."},{"id":"i1935","t":"1968.01.23 푸에블로호 사건 대응: 북한이 미국 정보수집함 푸에블로호를 나포하자 미국과 긴밀히 협력하여 공동 대응하였다. 이를 계기로 한미 안보협력이 강화되었고 북한의 군사적 도발에 대한 경계태세가 한층 높아졌다."},{"id":"i1936","t":"1971.08.20 남북적십자회담 예비접촉: 대한적십자사와 북한 적십자회 간 최초의 공식 접촉이 이루어졌다. 이산가족 상봉과 생사확인 문제가 논의되었으며, 한국전쟁 이후 처음으로 남북 간 공식 대화 채널이 열렸다."},{"id":"i1937","t":"1972.07.04 7·4 남북공동성명 발표: 7·4 남북공동성명을 통해 자주·평화·민족대단결의 통일 3원칙에 합의하였다. 이후 남북조절위원회가 설치되는 등 남북관계 제도화의 출발점이 되었다."},{"id":"i1938","t":"1973.06.23 6·23 평화통일 외교선언: 박정희 정부는 북한과 이념이 다른 국가들과도 외교관계를 확대할 수 있음을 선언하였다. 또한 남북한의 유엔 동시가입 가능성을 처음 공식 제기하여 이후 노태우 정부의 북방외교와 유엔 동시가입 정책의 선구적 기반을 마련하였다."},{"id":"i1939","t":"1975.04.23 NPT 비준: 대한민국의 핵확산금지조약(NPT) 비준을 통해 국제 핵비확산 체제에 참여하였다."}]},{"id":"i1940","title":"김대중정부 대외정책/대북정책","note":"","items":[{"id":"i1941","t":"1998. 2. 25. 햇볕정책(Sunshine Policy) 선언: 김대중 정부는 취임과 함께 대북 포용정책인 햇볕정책을 공식 추진하였다. 핵심은 ① 북한의 무력도발 불용, ② 흡수통일 배제, ③ 남북 화해·협력 적극 추진의 3대 원칙으로, 이후 남북관계의 기본 기조가 되었다."},{"id":"i1942","t":"1998. IMF 외환위기 극복과 IMF 구제금융 프로그램 이행: 김대중 정부는 외환위기 극복을 위해 국제통화기금(IMF)의 구제금융 프로그램을 이행하며 금융·기업·공공·노동 부문의 구조개혁을 추진하였다. 그 결과 2001년 8월 IMF 차입금을 예정보다 조기 상환하여 국제사회의 신뢰를 회복하고 경제를 정상화하는 기반을 마련하였다."},{"id":"i1943","t":"1998. 10. 8. 김대중-오부치 공동선언: 김대중 대통령과 오부치 게이조 총리는 「21세기 새로운 한·일 파트너십 공동선언」을 채택하였다. 오부치 총리는 식민지 지배에 대해 ‘통절한 반성과 마음으로부터의 사죄’를 표명하였고, 양국은 미래지향적 협력과 일본 대중문화 개방 확대 등에 합의하였다."},{"id":"i1944","t":"1998. 11. 금강산 관광사업 개시: 현대그룹과 북한 간 합의에 따라 금강산 관광이 시작되었다. 이는 최초의 대규모 남북 경제협력사업으로, 남북 민간교류와 경제협력의 상징적 사업이 되었다."},{"id":"i1945","t":"1999. 6. 제1연평해전 · 2002. 6. 29. 제2연평해전: 북한 경비정의 북방한계선(NLL) 침범으로 두 차례 서해 교전이 발생하였다. 제1연평해전에서는 우리 해군이 북한 경비정을 격퇴하였고, 제2연평해전에서는 북한의 기습공격으로 우리 해군 장병 6명이 전사, 18명이 부상하고 참수리 357호정이 침몰하였다. 김대중 정부는 군사적으로는 단호히 대응하면서도 햇볕정책과 남북 대화 기조는 유지하였다."},{"id":"i1946","t":"1999. 11. ASEAN+3 정상회의 적극 참여: 김대중 정부는 ASEAN+3(한·중·일) 협력체제 구축에 적극 참여하여 동아시아 지역협력을 강화하였다. 이는 이후 동아시아 정상회의(EAS) 등 동아시아 다자협력체 발전의 기반이 되었다."},{"id":"i1947","t":"2000. 3. 9. 베를린 선언: 김대중 대통령은 독일 베를린에서 대북 평화구상을 발표하며 남북 경제협력 확대, 이산가족 문제 해결, 당국 간 대화 재개 등을 제안하였다. 베를린 선언은 같은 해 제1차 남북정상회담 성사의 중요한 계기가 되었다."},{"id":"i1948","t":"2000. 6. 13.~15. 제1차 남북정상회담 및 6·15 남북공동선언: 평양에서 김대중 대통령과 북한의 김정일 국방위원장이 분단 이후 최초의 남북정상회담을 개최하였다. 양측은 6·15 남북공동선언을 채택하여 자주적 통일, 통일방안의 공통성 인정, 이산가족 문제 해결, 경제협력 확대 등에 합의함으로써 남북 화해협력의 전기를 마련하였다."},{"id":"i1949","t":"2002. 10. 개성공단 조성 합의: 남북은 개성공단 건설에 합의하고 사업 추진에 착수하였다. 개성공단은 남한의 자본과 기술, 북한의 노동력을 결합한 대표적인 남북 경제협력사업으로, 실제 공단 가동은 노무현 정부에서 시작되었다."},{"id":"i1950","t":"2002. 10. 제2차 북핵 위기: 미국이 북한의 고농축우라늄(HEU) 핵개발 프로그램을 제기하면서 제2차 북핵 위기가 발생하였다. 김대중 정부는 한미 공조를 유지하면서도 대화를 통한 평화적 해결을 추진하였으며, 이후 6자회담(Six-Party Talks) 출범의 계기가 되었다."},{"id":"i1951","t":"2002. 12. 한·칠레 FTA 협상 타결: 한국은 칠레와 자유무역협정(FTA) 협상을 타결하여 우리나라 최초의 FTA를 성사시켰다. 협정은 노무현 정부에서 비준·발효되었지만, 한국의 FTA 정책을 본격적으로 시작한 중요한 대외경제정책으로 평가된다."}]},{"id":"i1952","title":"노무현 정부의 대북/대외정책 사례","note":"","items":[{"id":"i1953","t":"이라크 자이툰부대 파병(2004년):노무현 정부는 한미동맹 강화와 국제사회의 요청에 부응하기 위해 이라크 북부 아르빌 지역에 자이툰부대를 파병하였다. 자이툰부대는 전투임무보다 학교·병원 건설, 직업훈련, 의료지원, 사회기반시설 복구 등 재건사업을 중심으로 활동하였으며, 한국군 해외파병 역사상 최대 규모의 파병 사례 중 하나로 평가된다."},{"id":"i1954","t":"주한미군 재배치계획(LPP) 개정 합의(2004년):한미 양국은 한강 이북과 수도권에 분산된 미군기지를 통폐합하고, 용산기지와 미2사단 일부 전력을 오산·평택 권역으로 재배치하기로 합의하였다. 이후 주한미군사령부와 주요 부대는 평택의 캠프 험프리스로 이전하였다."},{"id":"i1955","t":"9·19 공동성명 채택(2005년 9월 19일):제4차 6자회담에서 한국·북한·미국·중국·일본·러시아는 공동성명을 채택하였다. 북한은 모든 핵무기와 기존 핵계획을 포기하고 핵확산금지조약(NPT)과 국제원자력기구(IAEA) 안전조치에 복귀하기로 약속하였으며, 참가국들은 북한에 대한 안전보장, 관계정상화 추진, 경제·에너지 지원에 합의하였다."},{"id":"i1956","t":"동북아 균형자론 제시(2005년 9월):노무현 정부는 한국이 미국·중국·일본 등 강대국 사이에서 단순히 영향을 받는 국가가 아니라, 동북아의 평화와 안정을 유지하는 균형자 역할을 수행해야 한다고 주장하였다. 이는 자주국방과 자주외교를 강조한 정책노선이었으며, 당시 국내외에서 많은 논쟁을 불러일으켰다."},{"id":"i1957","t":"APEC 부산 정상회의 개최(2005년 11월):부산에서 개최된 APEC 정상회의에는 미국의 George W. Bush, 중국의 Hu Jintao, 일본의 Junichiro Koizumi 등 21개 회원국 정상들이 참석하였다. 한국은 의장국으로서 회의를 주도하였으며, 무역·투자 자유화와 지역경제 협력 확대를 위한 「부산 로드맵(Busan Roadmap)」 채택을 이끌어 냈다."},{"id":"i1958","t":"한일 셔틀외교 실시(2005년):노무현 대통령과 일본의 Junichiro Koizumi 총리는 상대국을 정기적으로 방문하는 셔틀외교를 실시하였다. 이는 1998년 김대중-오부치 공동선언 이후 발전된 한일 협력의 상징이었으나, 일본의 독도 영유권 주장, 역사교과서 문제, 야스쿠니 신사 참배 문제로 인해 이후 중단되었다."},{"id":"i1959","t":"북한 제1차 핵실험 및 유엔 안보리 결의 1718호 채택(2006년 10월):북한은 2006년 10월 9일 함경북도 풍계리에서 최초의 핵실험을 실시하였다. 이에 유엔 안전보장이사회는 결의 1718호를 채택하여 북한에 대한 무기금수, 사치품 수출 금지, WMD 관련 물자의 이전 제한 등의 제재를 부과하였다. 노무현 정부는 북핵 문제의 평화적 해결 원칙을 유지하면서도 국제사회의 대북 제재에 동참하였다."},{"id":"i1960","t":"전시작전통제권 환수 합의(2006년 10월):노무현 정부는 제38차 한미안보협의회의(SCM)에서 전시작전통제권을 한국군에 전환하기로 미국과 공식 합의하였고, 2007년 2월 23일 전환 시기를 2012년 4월 17일로 확정하였다. 이후 이명박정부는 2010년 6월 한미 정상회담에서 이를 2015년 12월 1일로 연기하였으며, 박근혜 정부는 2014년 10월 23일 제46차 한미안보협의회의(SCM)에서 다시 '조건에 기초한 전작권 전환(COTP)' 방식으로 변경하여 특정 시한을 폐지하였다. 당시 국방부는 사실상 2020년대 중반을 목표 시점으로 제시하였으나, 이후 문재인 정부와 윤석렬정부에서도 조건 충족 여부를 평가하는 절차가 계속 진행되고 있으며, 현재까지 전작권 전환은 완료되지 않았다."},{"id":"i1961","t":"한미 FTA 협상 타결·서명·발효 및 개정협상(2007년~2018년):노무현 정부는 2006년 2월 협상 개시를 선언한 뒤 8차례 공식협상을 거쳐 2007년 4월 2일 미국과 한미 FTA 협상을 타결하였다. 이어 2007년 6월 양국이 정식 서명하였으며, 이는 당시 한국이 체결한 최대 규모의 자유무역협정이었다. 협상 과정에서는 농축산물 시장 개방, 자동차, 의약품, 서비스시장 개방 등을 둘러싸고 국내에서 대규모 찬반 논쟁이 발생하였다. 이후 한국과 미국은 협정문 보완 작업을 거쳐 비준 절차를 진행하였으나, 미국 의회의 정권교체와 자동차·쇠고기 문제 등으로 비준이 지연되었다. 이후 이명박 정부와 미국의 오바마 행정부가 추가협상을 실시하여 자동차 분야 등의 쟁점을 조정하였고, 양국 의회의 비준을 거쳐 2012년 3월 15일 발효되었다. 발효 이후에도 협정은 유지되었으며, 미국의 Donald Trump 행정부는 대미 무역적자를 이유로 재협상을 요구하였다. 이에 2017~2018년 개정협상이 진행되었고, 미국산 자동차의 한국 안전기준 인정 물량 확대, 한국산 픽업트럭에 대한 미국 관세 철폐 시기 연장, 통관 및 의약품 분야 제도 개선 등에 합의하였다. 개정 협정은 2019년부터 발효되었다."},{"id":"i1962","t":"제2차 남북정상회담 및 10·4 남북정상선언 채택(2007년 10월):노무현 대통령은 군사분계선을 도보로 넘어 평양을 방문하여 김정일 국방위원장과 제2차 남북정상회담을 개최하였다. 양측은 「남북관계 발전과 평화번영을 위한 선언(10·4 선언)」을 채택하였다."}]},{"id":"i1963","title":"이명박정부 대외정책","note":"","items":[{"id":"i1964","t":"이명박 정부는 2008년 ‘비핵·개방·[[3000]]’ 구상을 제시하여 북한이 핵을 포기하고 개방정책을 추진할 경우 1인당 국민소득 [[3000]]달러 달성을 지원하겠다는 조건부 대북정책을 추진하였다."},{"id":"i1965","t":"이명박 정부는 2009년 UN 총회 연설에서 ‘[[그랜드 바겐(Grand Bargain)]]’ 구상을 제안하여 북핵 폐기와 북미관계 정상화, 체제안전보장, 경제지원을 일괄타결 방식으로 해결하려 하였다."},{"id":"i1966","t":"이명박 정부는 [[2009]]년 「국제연합 평화유지활동 참여에 관한 법률」을 제정하고 2010년 시행하여 국군과 민간 인력의 유엔 평화유지활동(PKO) 파견 절차 및 국회 동의 근거를 제도화하였다."},{"id":"i1967","t":"이명박 정부는 2009년 청해부대를 소말리아 아덴만에 파견하고, 2007년부터 유지되던 레바논 동명부대를 계속 운영하였으며, 2010년 단비부대를 [[아이티]]에, 오쉬노부대와 지방재건팀(PRT)을 아프가니스탄에, 2013년 [[한빛]]부대를 남수단에 각각 파견하며 국제 평화유지와 재건 활동 참여를 확대하였다."},{"id":"i1968","t":"이명박 정부는 2010년 천안함 피격 사건 이후 5·24 조치를 발표하여 남북교역 중단, 대북 신규투자 금지, 북한 선박의 남측 해역 운항 불허 등 강경 대북 제재를 시행하였으나, [[개성공단]] 사업과 영유아 등 취약계층에 대한 인도적 지원은 예외적으로 유지하였다."},{"id":"i1969","t":"이명박 정부는 [[2010]]년 서울에서 G20 정상회의를 개최하여 개발 의제와 글로벌 금융안전망 문제를 논의하며 한국이 선진국과 신흥국 사이의 가교 역할을 수행함을 강조하였다."},{"id":"i1970","t":"이명박 정부는 2010년 「[[국제개발협력기본법]]」을 제정·시행하여 공적개발원조(ODA) 정책의 조정 체계와 개발협력의 법적 기반을 정비하였다."},{"id":"i1971","t":"이명박 정부는 2011년 한미 자유무역협정(KORUS FTA) 비준을 완료하였으며, 협정은 [[2012]]년 발효되어 상품·서비스·투자 시장 개방과 한미 경제협력을 확대하였다."},{"id":"i1972","t":"이명박 정부는 2012년 서울 [[핵안보]]정상회의를 개최하여 핵 테러 방지, 핵물질 보호, 고농축우라늄 관리 등 글로벌 [[핵안보]] 의제를 주도하며 국제 비확산 외교에서 한국의 위상을 높였다."},{"id":"i1973","t":"이명박 정부는 2012년 「난민법」을 제정하고 [[2013]]년 시행하여 난민 인정 심사 절차와 난민 처우 및 지원 기준을 독립적으로 규정하였으며, 이를 통해 한국은 아시아 최초의 독자적 난민법 시행국이 되었다."}]}]},{"id":"i1974","title":"FTA","secs":[{"id":"i1975","title":"우리나라 FTA 현황 ①","note":"우리나라가 아세안 국가 중 3위 교역국인 말레이시아와 자유무역협정(FTA)을 체결하면서 우리 기업들의 수출 확대와 미래 협력 기반을 마련했다. 산업통상부는 여한구 통상교섭본부장이 26일(현지시간) 쿠알라룸푸르에서 뜽쿠 자프룰 말레이시아 투자통상산업부 장관과 함께 한-말레이시아 FTA 협상을 최종 타결하고 이를 확인하는 공동선언문에 서명했다고 27일 밝혔다. 말레이시아는 아세안 국가 중 우리나라의 3위 교역국이자 4위 투자대상국이다. 우리나라는 지난 2007년 발효된 한·아세안 FTA및 2022년 발효된역내포괄적경제동반자협정(RCEP)을 통해 기계, 가전, 화장품, 의약품, 가공식품 등 말레이시아의 시장 개방을 상당 부분 확보했으나, 자동차·철강 등 일부 주력 수출품목은 개방이 제한적이었다. 이번에 타결된 한-말레이시아 FTA는 우리나라가 체결한 27번째 자유무역협정으로 이번 양자 FTA로 인해 우리나라는 전체 품목의 94.8%, 말레이시아는 92.7%를 자유화하게 됐다. 특히, 말레이시아는 총 682개 품목, 우리나라는 288개 품목에 대한 관세를 한-아세안 FTA 및 RCEP 대비 추가 인하 또는 철폐할 예정이다.","items":[{"id":"i1976","t":"한-말레이시아 FTA:[[2025]]년 10월 27일 타결·서명된 이 FTA는 2026년 발효 예정이며 자동차·철강 관세 철폐를 포함한 포괄형 FTA이다."},{"id":"i1977","t":"한-조지아 CEPA:[[2024]]년 11월 27일 타결·서명된 이 CEPA는 미발효 상태이며 코카서스 지역과의 첫 양자 경제협정으로 공급망 연계 확대 기능을 갖는다."},{"id":"i1978","t":"한-[[에콰도르]] FTA:2023년 10월 11일 가서명, 2025년 9월 2일 정식서명 된 이 FTA는 발효 전 단계이며 한국의 중남미 시장 접근성과 자원 확보 기반을 강화하는 전략적 협정이다."},{"id":"i1979","t":"한-GCC FTA:2023년 12월 28일 타결된 이 FTA는 아직 발효되지 않았으며 한국의 에너지·원자재 공급 안정과 [[중동]] 시장 접근성 확대를 목표로 한다."},{"id":"i1980","t":"한‑칠레 자유무역협정:한-칠레 FTA는 2003년 2월 15일 서명되었고 2004년 4월 1일 발효되었으며, 발효 당시 한국 대통령은 [[노무현]] 이었다."},{"id":"i1981","t":"한-미 자유무역협정:한-미 FTA는 2007년 6월 30일 서명되어 2012년 3월 15일 발효되었고, 이후 2017년 하반기부터 재협상을 개시해 2018년 9월 24일 개정안에 서명하였으며(당시 미국 대통령은 [[트럼프]]), 개정안은 2019년 1월 1일부로 발효되었다."},{"id":"i1982","t":"한-중 자유무역협정:한중 FTA는 2015년 2월 25일 양국이 서명했고 [[2015]]년 12월 20일 발효되었으며, 서명 당시 한국 대통령은 박근혜였다."},{"id":"i1983","t":"한국-EU 자유무역협정:한-EU FTA는 2009년 10월 15일에 가서명, 2010년 10월 6일 서명되었고 2011.07.01. 이래 [[잠정]] 적용되었으며, 2015년 12월 13일 전체적으로 정식 발효되었다."},{"id":"i1984","t":"RCEP:협상은 2012년 11월 ASEAN 정상회의에서 개시되어 2020년 11월 15일에 ASEAN 10개국과 한국·중국·일본·호주·뉴질랜드 등 총 15개국이 서명·타결하였고 [[인도]]는 최종 참여하지 않았으며, 한국에서는 2022년 2월 1일 정식 발효되었다."},{"id":"i1985","t":"한-중-일 FTA: [[2012]]년 11월에 3국이 공식적으로 협상을 개시하였으나 현재까지 타결·서명·발효에 이르지 못한 상태로, 16차 협상 이후 실질적 진전 없이 협상이 계속 중인 미타결 FTA이다."},{"id":"i1986","t":"IPEF:[[2022]]년 5월 23일 바이든 대통령 주도로 출범하여 무역·공급망·청정경제·공정경제의 4개 Pillar로 구성되며, 이 중 공급망 필러는 2023년 5월 27일 타결되어 2024년 2월 24일 공식 발효되었고, 한국은 4개 Pillar 모두에 참여하고 있다."}]},{"id":"i1987","title":"우리나라 FTA 현황 ②","note":"","items":[{"id":"i1988","t":"김대중 정부 시기 한국–[[칠레]] FTA는 2003년 2월 15일 채택(서명)되고 2004년 4월 1일 노무현 정부에서 발효되었으며, 한국이 최초로 체결·발효한 자유무역협정으로서 한국 FTA 정책의 출발점이 되었다. 이 협정에서는 한국이 쌀을 완전히 개방 대상에서 제외하였다."},{"id":"i1989","t":"노무현 정부는 2005년 8월 4일 한국–[[싱가폴]] FTA를 채택(서명)하였고, 2006년 3월 2일 발효를 통해 동남아 국가와 최초의 FTA를 구축하였다. 이 협정은 개성공단 생산제품을 한국산으로 인정한 최초의 FTA 사례였다."},{"id":"i1990","t":"[[노무현]] 정부는 2006년 8월 24일 한국–ASEAN FTA 상품협정을 채택하였고, 2007년 6월 1일 상품협정이 발효되었다. 이 협정은 한국이 거대경제권과 체결한 최초의 FTA이며 한국산 쌀을 양허 대상에서 제외하였다."},{"id":"i1991","t":"노무현 정부는 2007년 6월 한국–미국 FTA(KORUS FTA)를 채택(서명)하였고, 이명박 정부 시기인 2012년 [[3]]월 15일 발효를 실현하였다. 협상 과정에서 개성공단 제품의 한국산 인정 문제가 핵심 쟁점이 되었고, 한반도 역외가공지역위원회 설치 조항이 포함되었다. 또한 한국은 쌀 시장을 완전히 개방 대상에서 제외하였다. 이후 문재인 정부 시기인 2018년 개정협상이 타결되고 2019년 1월 1일 개정의정서가 발효되었다."},{"id":"i1992","t":"이명박 정부는 2010년 10월 6일 한국–EU FTA를 채택(서명)하였고, [[2011]]년 7월 1일 잠정 발효를 통해 아시아 국가 최초의 EU와의 FTA를 출범시켰다. 이 협정은 개성공단을 역외가공지역으로 인정하지는 않았으나, 한반도 역외가공지역위원회 설치 규정을 두었다. 한국은 이 협정에서도 쌀을 양허 대상에서 제외하였다."},{"id":"i1993","t":"이명박 정부는 2011년 3월 21일 한국–[[페루]] FTA를 채택(서명)하고 같은 해 8월 1일 발효시켰으며, 이를 통해 중남미 시장 진출 확대와 자원협력 강화를 추진하였다."},{"id":"i1994","t":"이명박 정부는 2012년 8월 1일 한국–튀르키예 FTA 기본협정·상품무역협정을 채택(서명)하였고, 박근혜 정부 시기인 [[2013]]년 5월 1일 발효를 통해 유럽·중앙아시아 진출 교두보를 확보하였다."},{"id":"i1995","t":"박근혜 정부는 [[2015]]년 5월 5일 한국–베트남 FTA를 채택(서명)하고 같은 해 12월 20일 발효시켰으며, 이를 통해 한국 기업의 생산기지 확대와 공급망 강화를 추진하였다. 베트남은 한국산 자동차 부품·섬유 분야 시장을 확대하였고, 한국은 열대과일 수입 확대를 허용하였다. 한국은 쌀을 개방 대상에서 제외하였다."},{"id":"i1996","t":"박근혜 정부는 2015년 6월 1일 한국–중국 FTA를 채택(서명)하고 같은 해 12월 20일 발효시켰으며, 한국 최대 교역국과의 경제통합 심화를 추진하였다. 이 협정에는 [[개성공단]] 관련 역외가공지역 조항이 포함되었으며, 한국은 쌀을 포함한 민감 농산물 상당수를 양허 대상에서 제외하였다."},{"id":"i1997","t":"문재인 정부는 2019년 8월 22일 한국–[[영국]] FTA를 채택(서명)하였고, 2021년 1월 1일 발효를 통해 브렉시트 이후에도 한-EU FTA 수준의 통상관계를 유지하였다."},{"id":"i1998","t":"문재인 정부는 2020년 11월 15일 역내포괄적경제동반자협정(RCEP) 에 서명하였고, [[2022]]년 2월 1일 발효를 통해 ASEAN·한국·중국·일본·호주·뉴질랜드가 참여하는 세계 최대 규모의 메가 FTA 체제에 참여하였다. 한국·중국·일본이 동시에 참여한 최초의 FTA 체제라는 점이 특징이며, 한국은 쌀을 양허 대상에서 제외하였다."},{"id":"i1999","t":"윤석열 정부는 2024년 5월 29일 한국–[[UAE]] CEPA를 채택(서명)하였으며, 한국의 첫 중동 국가 대상 FTA라는 점에서 의미가 크다. 이 협정은 에너지·방산·수소·첨단산업 협력을 강화하는 내용을 포함하고 있으며, 2026년 5월 1일 발효되었다."}]}]},{"id":"i2000","title":"한국의 지역외교","secs":[{"id":"i2001","title":"한국-아세안 관계","note":"이재명 대통령은 2026년 3월 1일~4일 3박4일 일정으로 싱가포르와 필리핀을 국빈 방문했다. 싱가포르에서는 로렌스 웡 총리 등과 정상회담을 갖고 무역·인공지능(AI)·원전·기술 협력 등을 논의하며 양국 관계 강화와 실질 협력 확대에 합의했다. 이후 필리핀 마닐라로 이동해 페르디난드 마르코스 주니어 대통령과 정상회담을 갖고 방산·인프라·원전·조선·AI 등 미래 산업과 전략적 협력 확대 방안을 논의하며 양국의 우호 관계를 확인했다. 이번 순방은 아세안 핵심 국가들과의 협력을 강화하는 외교 일정이었다.","items":[{"id":"i2002","t":"1949–1997년(수교 완성): 대한민국은 [[1949]]년 필리핀, 1958년 태국, 1960년 말레이시아, 1973년 인도네시아, 1975년 싱가포르 및 미얀마, 1984년 브루나이, 1992년 베트남, 1995년 라오스, 1997년 캄보디아와 수교하여 아세안 10개국 모두와 외교관계를 완성하였다."},{"id":"i2003","t":"[[1996]]년 3월(ASEM 출범, 방콕): Asia–Europe Meeting은 태국 방콕에서 아세안 7개국, EU 15개국, 그리고 한국·중국·일본이 참여하여 출범하였다."},{"id":"i2004","t":"1997년 12월(APT 출범, 쿠알라룸푸르): ASEAN Plus Three는 당시 아세안 9개국([[캄보디아]]는 1999년 가입)과 한국·중국·일본이 참여하여 출범하였다."},{"id":"i2005","t":"[[2000]]년 5월 치앙마이에서 CMI가 합의되었으며, 아세안 10개국과 한국·중국·일본이 참가하여 양자 통화스와프 네트워크를 구축하였고, 대만은 참가하지 않았으며 홍콩은 독립 회원이 아니었다."},{"id":"i2006","t":"[[2004]]년 11월(TAC 가입, 비엔티안): 대한민국은 Treaty of Amity and Cooperation in Southeast Asia에 가입하였다."},{"id":"i2007","t":"2006–2009년(한–아세안 FTA 체결·발효): ASEAN–Korea Free Trade Area 상품협정은 2006년 서명되어 [[2007]]년 발효되었고, 서비스협정(2009년 5월 발효)과 투자협정(2009년 9월 발효)은 2009년에 발효되었다."},{"id":"i2008","t":"[[2010]]년 3월 24일(CMIM 출범): 치앙마이 이니셔티브 다자화는 아세안 10개국과 한국·중국·일본이 공동기금을 조성하여 출범하였다."},{"id":"i2009","t":"2017년 11월(신남방정책 발표, 자카르타): 문재인 정부는 인도네시아 자카르타에서 신남방정책을 공식 천명하고 아세안과 [[인도]]를 4강 수준의 핵심 협력 파트너로 설정하였다."},{"id":"i2010","t":"2019년 11월(제1차 한–메콩 정상회의, 부산): [[베트남]]·태국·라오스·캄보디아·미얀마 5개국이 참여하였다."},{"id":"i2011","t":"2022년 2월 1일(RCEP 발효): Regional Comprehensive Economic Partnership은 아세안 10개국과 한국·중국·일본·호주·[[뉴질랜드]]가 참여하여 발효되었다."}]},{"id":"i2012","title":"한국-중남미 국제관계","note":"최근 한국-브라질 정상회담에서는 이재명 대통령과 루이스 이나시우 룰라 다 시우바 대통령이 2026년 2월 23일 청와대에서 회담을 갖고 양국 관계를 수교 67년 만에 ‘전략적 동반자 관계’로 격상하기로 합의했으며, 이를 구체화하기 위한 한-브라질 4개년 행동계획을 채택했다. 양국은 핵심광물·희토류, 인공지능(AI), 과학기술, 우주·항공, 농업, 보건 등 다양한 분야에서 10건의 양해각서 및 약정을 체결하고 실질 협력을 확대하기로 했으며, 메르코수르와의 무역협정 협상 재개 필요성에도 공감했다. 동시에 글로벌 현안과 한반도 평화, 기후변화 대응 등 국제 문제에 대해서도 의견을 교환했다.","items":[{"id":"i2013","t":"[[1962]]년 한국–브라질 수교: 대한민국은 [[1962]]년 브라질과 외교관계를 수립하며 남미 최대국과의 공식 외교를 시작하였다."},{"id":"i2014","t":"1962~1963년 한국–멕시코·아르헨티나 수교: 1962년 [[멕시코]], 1963년 아르헨티나와 수교함으로써 중남미 주요국과 외교관계를 확장하였다."},{"id":"i2015","t":"[[1996]]년 한국의 미주기구(OAS) 옵서버 가입: 한국은 OAS 상임 옵서버가 되어 미주 다자외교에 제도적으로 참여하기 시작하였다."},{"id":"i2016","t":"2004년 한– [[칠레]] FTA 발효: 한국은 [[칠레]]와 최초의 FTA를 발효하며 중남미와의 자유무역협정 시대를 개막하였다."},{"id":"i2017","t":"[[2011]]년 한–페루 FTA 발효: 페루와 FTA를 체결·발효함으로써 자원·에너지 협력을 제도화하였다."},{"id":"i2018","t":"2012년 한– [[콜롬비아]] FTA 타결(2016년 발효): 한국은 [[콜롬비아]]와 FTA를 체결하여 안데스 지역과의 경제협력을 확대하였다."},{"id":"i2019","t":"2018년 한–중미 FTA 서명( [[2021]]년 발효): 한국은 코스타리카·엘살바도르·니카라과·온두라스·파나마 등과 FTA를 체결하여 중미 지역과 집단적 경제협력 틀을 구축하였다."},{"id":"i2020","t":"이재명 대통령과 루이스 이나시우 룰라 다시우바 브라질 대통령은 23일 청와대에서 정상회담을 하고 양국 관계를 전략적 동반자 관계로 격상하기로 했다. 양국은 [[2004]]년 룰라 대통령 재임 때 노무현 당시 대통령의 브라질 국빈방문에 맞춰 포괄적 협력 동반자 관계를 맺었는데, 이번에 한 단계 더 격을 높인 것이다."},{"id":"i2021","t":"2015년 한국 대통령 중남미 순방 확대 외교: [[박근혜]] 대통령이 브라질·페루·칠레·콜롬비아 등을 순방하며 자원·인프라·방산 협력을 확대하였다."},{"id":"i2022","t":"한국과 메르코수르는 [[2018]]년 FTA 협상을 개시해 여러 차례 공식 협상을 진행했으나 2021년 이후 교착 상태에 빠졌고, 이는 농축산물 등 민감 품목의 시장개방 수준, 관세 철폐 범위, 위생·검역(SPS) 및 비관세장벽 완화 문제를 둘러싼 이견을 좁히지 못했기 때문이다."}]}]}]}]}]};

}
const IDBS = (() => { let p = null; const open = () => p || (p = new Promise((ok, no) => { try { const r = indexedDB.open('issues-store', 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); } catch (e) { no(e); } }));
  return { put: (k, v) => open().then(db => new Promise(ok => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(v, k); tx.oncomplete = () => ok(true); tx.onerror = () => ok(false); })).catch(() => false),
           get: k => open().then(db => new Promise(ok => { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => ok(q.result); q.onerror = () => ok(null); })).catch(() => null) }; })();

}).catch(() => {});
