007":"2026-03-04","i2008":"2026-03-04","i2009":"2026-03-04","i2010":"2026-03-04","i2011":"2026-03-04","i2013":"2026-02-25","i2014":"2026-02-25","i2015":"2026-02-25","i2016":"2026-02-25","i2017":"2026-02-25","i2018":"2026-02-25","i2019":"2026-02-25","i2020":"2026-02-25","i2021":"2026-02-25","i2022":"2026-02-25"}},{"id":"kind27-1029","kindsec":{"k27s_261002_2":"issue"},"kindprefix":"k27s_","kinddefault":"prog"},{"id": "ir27-1029", "doc": "ir", "dedupeText": true, "newch": [["k27c_ir_gen","이론 총론","^i973"],["k27c_ir_th","사상","k27c_ir_gen"],["k27c_ir_real","현실주의","k27c_ir_th"],["k27c_ir_crit","비판이론·그람시","i973"]], "secs": [{"ch": "i985", "chname": "동맹이론", "sec": {"id": "r27s_261002_0", "title": "동맹 사례 (10.02)", "note": "오늘 동맹 수업을 하며 동맹을 정리하고자 하는 마음이 들었음. 주요동맹 체결 연도 암기. 해체된 것도 역사적 차원에서 출제 가능성이 있음", "fd": "2026-10-02", "kind": "issue", "items": [{"id": "r27_261002_0_0", "y": "27", "fd": "2026-10-02", "t": "리우조약(1947년 9월): 미국과 중남미의 조약 당사국들이 참여하는 집단방위체제로, 미주 국가에 대한 무력공격을 전체 미주 국가에 대한 공격으로 간주하고 개별적·집단적 자위권 행사에 따라 원조한다. 다만 당사국의 동의 없이 무력사용을 요구할 수는 없다."}, {"id": "r27_261002_0_1", "y": "27", "fd": "2026-10-02", "t": "북대서양조약기구(NATO)(1949년 4월): 미국·캐나다와 유럽 국가들이 참여하는 32개국의 다자 군사동맹으로, 한 회원국에 대한 무력공격을 전체 회원국에 대한 공격으로 간주하고 각국이 필요하다고 판단하는 조치를 취한다."}, {"id": "r27_261002_0_2", "y": "27", "fd": "2026-10-02", "t": "미국·필리핀 동맹(1951년 8월): 양국의 상호방위조약에 기초한 동맹으로, 태평양 지역에서 양국의 영토·군대·공공선박·항공기에 대한 무력공격이 발생하면 각국의 헌법상 절차에 따라 공동의 위험에 대처한다."}, {"id": "r27_261002_0_3", "y": "27", "fd": "2026-10-02", "t": "태평양안전보장조약(ANZUS)(1951년 9월): 미국·호주·뉴질랜드가 체결한 안보조약으로, 태평양 지역에서 당사국에 대한 무력공격이 발생하면 공동의 위험에 대처한다. 미국이 1986년 뉴질랜드에 대한 방위의무를 정지한 이후 미국·호주 동맹이 중심축이다."}, {"id": "r27_261002_0_4", "y": "27", "fd": "2026-10-02", "t": "미일동맹(1951년 9월·현행 조약 1960년 1월): 일본과 미국의 상호협력안전보장조약에 기초한 동맹으로, 일본의 행정지배하에 있는 영역에서 어느 일방에 대한 무력공격이 발생하면 공동의 위험에 대처하며, 일본은 미국에 기지 사용을 허용한다."}, {"id": "r27_261002_0_5", "y": "27", "fd": "2026-10-02", "t": "한미동맹(1953년 10월): 대한민국과 미국의 상호방위조약에 기초한 동맹으로, 태평양 지역에서 양국의 행정지배하에 있는 영토에 대한 무력공격이 발생하면 각국의 헌법상 절차에 따라 공동의 위험에 대처한다."}, {"id": "r27_261002_0_6", "y": "27", "fd": "2026-10-02", "t": "동남아시아조약기구(SEATO)(1954년 9월): 미국·영국·프랑스·호주·뉴질랜드·파키스탄·태국·필리핀이 마닐라조약에 기초하여 결성한 다자 군사동맹으로, 동남아시아에서 공산주의 세력의 확대를 저지하는 것을 목적으로 하였다. 회원국 간 이해관계의 차이와 결속력 약화로 1977년 6월 해체되었다."}, {"id": "r27_261002_0_7", "y": "27", "fd": "2026-10-02", "t": "미국·태국 동맹(1954년 9월·1962년 3월): 1954년 마닐라조약과 1962년 타나트·러스크 공동성명 등에 기초한 동맹으로, 동남아시아조약기구(SEATO)의 해체 이후에도 양국의 동맹관계는 유지되고 있다."}, {"id": "r27_261002_0_8", "y": "27", "fd": "2026-10-02", "t": "미국·대만 동맹(1954년 12월): 미국과 중화민국이 체결한 상호방위조약에 기초한 동맹으로, 대만과 펑후제도 등에 대한 무력공격에 공동 대처하는 것을 목적으로 하였다. 미국의 중국과의 수교 이후 1980년 1월 조약이 종료되었다. 이후 미국의 대만에 대한 안보지원은 대만관계법 등을 통해 지속되지만, 종전의 조약상 동맹관계와는 구별된다."}, {"id": "r27_261002_0_9", "y": "27", "fd": "2026-10-02", "t": "중동조약기구(METO)·바그다드조약기구(1955년 2월): 이라크와 튀르키예가 체결한 바그다드조약을 기초로 영국·파키스탄·이란이 참여한 군사동맹으로, 중동 지역에서 소련의 팽창을 봉쇄하는 것을 목적으로 하였다. 이라크가 탈퇴한 뒤 1959년 중앙조약기구(CENTO)로 개칭되었으며, 이란혁명과 이란·파키스탄의 탈퇴로 1979년 해체되었다. 미국은 이를 지원하였지만 정식 회원국은 아니었다."}, {"id": "r27_261002_0_10", "y": "27", "fd": "2026-10-02", "t": "바르샤바조약기구(WTO)(1955년 5월): 소련과 폴란드·동독·체코슬로바키아·헝가리·루마니아·불가리아·알바니아가 결성한 다자 군사동맹으로, 서독의 NATO 가입에 대응하여 창설되었다. 소련을 중심으로 집단방위와 통합군사지휘체제를 운영하였으며, 1991년 3월 군사조직이 해체되고 같은 해 7월 기구가 공식 해체되었다."}, {"id": "r27_261002_0_11", "y": "27", "fd": "2026-10-02", "t": "북소·북러동맹(1961년 7월·2024년 6월): 북한은 1961년 7월 소련과 우호협조 및 상호원조조약을 체결하여 군사원조 의무를 갖는 북소동맹을 형성하였다. 이 조약에 따른 동맹관계가 단절 없이 유지된 것은 아니며, 북한과 러시아는 2024년 6월 포괄적 전략적 동반자관계 조약을 새로 체결하였다. 현행 조약은 일방이 무력침공을 받아 전쟁상태에 놓이면 다른 일방이 지체 없이 군사적·기타 원조를 제공하도록 규정하며, 2024년 12월 발효하였다."}, {"id": "r27_261002_0_12", "y": "27", "fd": "2026-10-02", "t": "북중동맹(1961년 7월): 북한과 중국의 우호협조 및 상호원조조약에 기초한 동맹으로, 일방이 무력공격을 받아 전쟁상태에 놓이면 다른 일방이 군사적·기타 원조를 제공한다."}, {"id": "r27_261002_0_13", "y": "27", "fd": "2026-10-02", "t": "집단안보조약기구(CSTO)(1992년 5월 조약 체결·2002년 10월 기구 창설): 러시아·벨라루스·아르메니아·카자흐스탄·키르기스스탄·타지키스스탄을 공식 회원국으로 하는 집단방위동맹으로, 한 회원국에 대한 침략을 전체 회원국에 대한 침략으로 간주한다."}, {"id": "r27_261002_0_14", "y": "27", "fd": "2026-10-02", "t": "사우디아라비아·파키스탄 상호방위협정(2025년 9월): 양국이 체결한 전략적 상호방위협정으로, 어느 일방에 대한 침략을 양국 모두에 대한 침략으로 간주하고 방위협력과 공동억제를 강화한다."}, {"id": "r27_261002_0_15", "y": "27", "fd": "2026-10-02", "t": "메카 공동방위협정(2026년 8월): 사우디아라비아·파키스탄·튀르키예가 서명한 3국 공동방위협정으로, 어느 한 국가에 대한 무력공격을 세 국가 모두에 대한 공격으로 간주한다. 튀르키예의 의회 비준이 완료되지 않아 아직 발효되지 않았으며, 2026년 10월 의회에서 비준 절차를 진행할 예정이다."}]}}, {"ch": "i1349", "chname": "대만·홍콩·남중국해", "sec": {"id": "r27s_261005_1", "title": "양안관계 (10.05)", "note": "최근 사례동사군도(프라타스 군도)는 대만이 실효 지배하고 중국도 영유권을 주장하는 남중국해 북부의 도서로, 2026년 6월 27일 중국 해경선이 대만이 설정한 제한수역에 진입해 대만 해경 함정과 약 740m 거리에서 대치했음. 8월 18일과 9월 7일에도 중국 해경선이 진입해 대만 해경이 차단하고 퇴거를 요구했으며, 양측은 무선방송으로 주권과 관할권을 주장했음. 대만은 9월 23일 동사도에 100톤급 순찰정을 배치하고 대형 순찰함의 순찰을 강화했다고 발표했음.출제예상논점", "fd": "2026-10-05", "kind": "issue", "items": [{"id": "r27_261005_1_0", "y": "27", "fd": "2026-10-05", "t": "양안 분단(1949년): 국공내전 이후 중화인민공화국이 중국 대륙에 수립되고 중화민국 정부가 대만으로 이동하면서 양안의 분리 통치가 시작됐음. 중화인민공화국은 수립 이후 대만을 실제로 통치한 적이 없음."}, {"id": "r27_261005_1_1", "y": "27", "fd": "2026-10-05", "t": "하나의 중국 원칙: 중국은 세계에 중국은 하나이며, 대만은 중국의 일부이고 중화인민공화국 정부가 중국 전체를 대표하는 유일한 합법정부라는 입장을 취하고 있음. 대만 문제를 국내문제로 규정하며 외국의 개입과 대만 독립에 반대함."}, {"id": "r27_261005_1_2", "y": "27", "fd": "2026-10-05", "t": "대만의 입장: 대만의 민진당 정부는 중화민국이 이미 주권을 가진 국가이므로 별도의 독립선언이 필요하지 않으며, 중화민국과 중화인민공화국은 서로 예속되지 않는다는 입장임. 라이칭더는 2024년 5월 취임사에서 이러한 입장과 현상유지 방침을 재확인했음."}, {"id": "r27_261005_1_3", "y": "27", "fd": "2026-10-05", "t": "유엔총회 결의 제2758호(1971년 10월): 중화인민공화국 정부의 대표를 유엔에서 중국의 유일한 합법적 대표로 인정하고 장제스의 대표를 축출했음. 결의문은 대만의 주권 귀속을 명시적으로 규정하지 않았으나, 중국은 이 결의가 대만을 포함한 중국 전체의 대표권 문제를 해결했다고 주장함."}, {"id": "r27_261005_1_4", "y": "27", "fd": "2026-10-05", "t": "상하이 공동성명(1972년 2월): 미국은 대만해협 양측의 중국인들이 중국은 하나이며 대만은 중국의 일부라고 주장한다는 점을 인지하고, 그 입장에 이의를 제기하지 않았음. 또한 대만 문제의 평화적 해결에 대한 관심을 표명했음."}, {"id": "r27_261005_1_5", "y": "27", "fd": "2026-10-05", "t": "미·중 수교 공동성명(1979년 1월): 미국은 중화인민공화국 정부를 중국의 유일한 합법정부로 승인하고 대만과의 공식 외교관계를 종료했음. 다만 대만과 문화·통상 등 비공식 관계를 유지하기로 했으며, 대만이 중국의 일부라는 중국의 입장을 인지한다고 밝혔음."}, {"id": "r27_261005_1_6", "y": "27", "fd": "2026-10-05", "t": "대만관계법(1979년 4월): 미국이 대만과의 비공식 관계를 유지하고 대만의 충분한 자위능력 확보에 필요한 방위물자와 서비스를 제공하도록 규정한 미국 국내법임. 대만에 대한 무력이나 강압에 저항할 미국의 능력을 유지하도록 규정"}, {"id": "r27_261005_1_7", "y": "27", "fd": "2026-10-05", "t": "8·17 공동성명(1982년 8월): 미국은 대만에 대한 무기판매를 장기적 정책으로 추진하지 않으며, 판매 규모를 점차 줄일 의향을 밝혔음. 이는 중국이 대만 문제의 평화적 해결을 추구한다는 입장과 연결돼 있었으며, 무기판매의 종료 시한을 정한 것은 아님."}, {"id": "r27_261005_1_8", "y": "27", "fd": "2026-10-05", "t": "92공식(1992년): 1992년 양측 민간 교섭기구의 접촉을 바탕으로 제시된 정치적 개념임. 국민당은 하나의 중국을 인정하되 그 의미는 각자 해석한다는 ‘일중각표’로 설명하지만, 중국은 양안이 하나의 중국에 속한다는 점을 강조하며 민진당은 이를 양안 관계의 전제로 수용하지 않음."}, {"id": "r27_261005_1_9", "y": "27", "fd": "2026-10-05", "t": "일국양제(一國兩制): 중국은 하나의 국가 안에서 대만의 제도를 일정하게 유지하는 방식으로 통일할 것을 제안함. 대만의 민진당 정부는 대만의 주권과 민주주의를 훼손할 수 있다는 이유로 이를 거부하고 있음."}, {"id": "r27_261005_1_10", "y": "27", "fd": "2026-10-05", "t": "반분열국가법(2005년 3월): 중국은 대만의 분리 사실이 발생하거나, 분리로 이어질 중대한 사변이 발생하거나, 평화통일 가능성이 완전히 상실되는 경우 비평화적 방식과 필요한 조치를 취할 수 있도록 규정했음."}, {"id": "r27_261005_1_11", "y": "27", "fd": "2026-10-05", "t": "일변일국(一邊一國): 천수이볜 대만 총통이 2002년 8월 제시한 주장으로, 대만해협 양쪽에 각각 하나의 국가가 존재한다는 의미임. 중국과 대만을 별개의 국가로 보는 입장으로, 중국은 이를 대만 독립 주장으로 비판했음."}, {"id": "r27_261005_1_12", "y": "27", "fd": "2026-10-05", "t": "일국양구(一國兩區): 하나의 국가 안에 대만지구와 대륙지구라는 두 지역이 존재한다는 구상임. 국민당의 마잉주 정부는 중화민국 헌법에 기초해 ‘하나의 중화민국, 두 개의 지역’으로 설명했으며, 중국의 일국양제와는 구별됨."}, {"id": "r27_261005_1_13", "y": "27", "fd": "2026-10-05", "t": "일국양부(一國兩府): 하나의 중국 안에 중화민국 정부와 중화인민공화국 정부라는 두 정부가 존재한다는 구상임. 두 국가의 존재를 인정하지 않으면서 양측 정부의 실체를 인정하려는 접근으로, 양측이 공식적으로 합의한 원칙은 아님."}, {"id": "r27_261005_1_14", "y": "27", "fd": "2026-10-05", "t": "일중각표(一中各表): 중국은 하나이지만 하나의 중국이 무엇을 의미하는지는 양측이 각각 해석한다는 입장임. 국민당은 하나의 중국을 중화민국으로 해석하며 이를 92공식의 핵심으로 설명하지만, 중국은 중화인민공화국을 유일한 합법정부로 보는 하나의 중국 원칙을 강조함."}]}}, {"ch": "NEW:k27c_ir_th:사상:k27c_ir_gen", "chname": null, "sec": {"id": "r27s_261006_2", "title": "해롤드 니콜슨의 <외교> 주요 내용 발췌 (10.06)", "note": "사상 및 이론편 외교 파트에서 니콜슨 이야기 보완. 니콜슨의 외교에 대한 이야기가 단행본 등에 빈번하게 등장함. 출제예상논점", "fd": "2026-10-06", "kind": "issue", "items": [{"id": "r27_261006_2_0", "y": "27", "fd": "2026-10-06", "t": "외교의 개념과 외교정책의 구별: 니컬슨은 외교를 협상을 통해 국제관계를 관리하는 활동으로 설명했음. 여기에는 대사와 외교사절이 국가 사이의 관계를 조정하는 방법과 외교관의 업무·기술이 포함됨. 외교정책은 국가가 무엇을 추구할 것인가에 관한 목표와 행동방향의 결정이며, 외교는 이를 어떻게 실현할 것인가에 관한 협상과 조정임. 외교정책은 정부와 정치지도자가 국민의 대표를 통한 승인과 통제 아래 결정하고, 외교는 경험과 전문성을 갖춘 외교관이 수행하는 것이 바람직하다고 보았음."}, {"id": "r27_261006_2_1", "y": "27", "fd": "2026-10-06", "t": "외교의 두 가지 관념—전사형과 상인형: 니컬슨은 외교에 대한 관념을 전사형·영웅형(warrior or heroic)과 상인형·상점주형(mercantile or shopkeeper)으로 구별했음. 전사형은 외교를 다른 수단으로 수행하는 전쟁으로 이해하며, 국가의 위신과 힘을 중시하고 협상의 목표를 승리와 상대방의 굴복에 두었음. 위협·기습·압박을 활용하며, 상대방의 양보를 약함이나 후퇴의 증거로 해석하는 경향이 있음. 상인형은 외교를 평화적 거래와 조정으로 이해하며, 신용·신뢰·실익을 중시하고 상호 양보를 통한 지속적 합의를 추구했음. 니컬슨은 상인형을 더 긍정적으로 평가했지만, 상대방도 타협과 신뢰를 원한다고 과신하는 위험을 지적했음. 특히 상인형 협상자의 타협 제안을 전사형 상대방이 나약함으로 받아들일 수 있다고 보았음."}, {"id": "r27_261006_2_2", "y": "27", "fd": "2026-10-06", "t": "구외교와 신외교—단절보다 연속성: 니컬슨은 제1차 세계대전을 전후하여 외교가 완전히 새롭게 바뀌었다는 설명에 신중했음. 외교는 정치적 환경의 변화에 점진적으로 적응하며, 협상에 필요한 기본 원칙은 계속 유지된다고 보았음. 따라서 구외교에서 신외교로의 변화를 도덕적으로 타락한 외교가 갑자기 올바른 외교로 전환한 것으로 설명하기 어렵다고 보았음. 신외교가 등장한 뒤에도 권위주의 국가에서는 개인적이고 비밀스러운 외교가 강화될 수 있었음. 주요 변화 요인으로는 공통의 국제적 이익을 고려하는 관념의 성장, 여론의 영향력 증가, 교통·통신의 발달을 제시했음. 외교의 형태가 바뀌어도 정직성·정확성·신뢰와 같은 협상의 기본 조건은 계속 필요하다고 보았음."}, {"id": "r27_261006_2_3", "y": "27", "fd": "2026-10-06", "t": "공개외교와 비밀교섭의 구별: 니컬슨은 외교정책에 대한 공개적 토론과 민주적 통제를 인정하면서도, 실제 협상에는 비공개 공간이 필요하다고 보았음. 국민은 정부가 어떤 목적을 추구하고 어떤 약속을 부담하는지 알아야 하지만, 협상 중의 모든 제안과 잠정적 양보까지 즉시 공개할 필요는 없다는 입장임. 협상 과정을 전부 공개하면 협상자가 국내 여론을 의식하여 입장을 경직시키거나 상대방에게 양보하기 어려워질 수 있음. 따라서 정책과 합의에 대한 책임성을 확보하면서, 합의에 이르는 과정에는 전문외교관의 재량을 인정하고자 했음. 다만 무엇을 언제 공개할 것인지에 대해서는 민주적 통제와 협상의 효율성 사이에 긴장이 남음."}, {"id": "r27_261006_2_4", "y": "27", "fd": "2026-10-06", "t": "이상적인 외교관의 일곱 가지 자질: 니컬슨은 정직성(Truth), 정확성(Accuracy), 침착성(Calm), 인내심(Patience), 온화한 성품(Good temper), 겸손(Modesty), 충성심(Loyalty)을 제시했음. 정직성은 거짓말과 기만을 피하고 신뢰를 확보하는 것, 정확성은 사실·표현·보고·합의 내용을 정확하게 다루는 것, 침착성은 위기와 압박 속에서도 감정에 휘둘리지 않는 것, 인내심은 성급하게 결과를 요구하지 않고 협상을 지속하는 것임. 온화한 성품은 불쾌한 상황에서도 분노와 적대감을 절제하는 것, 겸손은 자신의 우월성을 과신하지 않고 상대방을 이해하는 것, 충성심은 자신이 대표하는 국가와 정부에 대한 책임을 지키는 것임. 이 밖에 지능·지식·분별력·신중함·환대·매력·근면·용기·재치도 기본적으로 갖추어야 할 자질로 전제했음."}, {"id": "r27_261006_2_5", "y": "27", "fd": "2026-10-06", "t": "민주외교의 네 가지 위험: 니컬슨은 무책임성(irresponsibility), 무지(ignorance), 지연(delay), 부정확성(imprecision)을 제시했음. 무책임성은 국민이 자국의 국제적 약속에 대한 책임을 충분히 인식하지 못하고, 자신들이 선출한 정부가 체결한 약속의 이행을 쉽게 거부하려는 것임. 무지는 단순한 사실 지식의 부족을 넘어, 자국의 국제적 의무와 상대국의 이해관계를 제대로 이해하지 못하는 것임. 지연은 전문가가 정책의 필요성을 인식한 시점과 국민이 이를 이해하고 동의하는 시점 사이에 시간차가 발생하여 적절한 대응이 늦어지는 것임. 부정확성은 명확하고 구속적인 정책보다 모호하고 듣기 좋은 표현을 선호하여 자국의 의지와 약속을 불분명하게 전달하는 것임."}]}}, {"ch": "i1273", "chname": "중국", "sec": {"id": "r27s_261008_3", "title": "기출논점 보완 – 피크 차이나 (10.08)", "note": "2026년 시험에서 브랜즈·베클리, 『중국은 어떻게 실패하는가』(2022)가 담긴 ‘peak China’개념이 출제됨. 책에 담긴 주요 내용을 정리해 두어야 이젠 집토끼가 된 이 논점의 babies를 잡을 수 있음. 이론파트 세력전이론에 단권화. 출제예상논점", "fd": "2026-10-08", "kind": "issue", "items": [{"id": "r27_261008_3_0", "y": "27", "fd": "2026-10-08", "t": "피크 차이나(Peak China): 브랜즈와 베클리는 중국이 지속적으로 성장하여 미국을 추월할 것이라는 일반적인 전망과 달리, 중국의 국력이 이미 정점에 도달했거나 정점에 접근하고 있으며 향후 상대적으로 쇠퇴할 가능성이 있다고 주장한다."}, {"id": "r27_261008_3_1", "y": "27", "fd": "2026-10-08", "t": "중국의 전략적 목표: 중국은 동아시아에서 미국의 군사적 영향력을 약화시키고 중국 중심의 지역질서를 구축하며, 궁극적으로 미국이 주도하는 국제질서를 자국에 유리한 방향으로 변경하려 한다고 분석한다."}, {"id": "r27_261008_3_2", "y": "27", "fd": "2026-10-08", "t": "인구구조의 악화: 중국은 저출산과 고령화로 생산가능인구가 감소하고 있으며, 과거 경제성장을 뒷받침했던 풍부한 노동력과 인구배당 효과가 약화하면서 장기적인 경제성장에 제약을 받고 있다."}, {"id": "r27_261008_3_3", "y": "27", "fd": "2026-10-08", "t": "경제성장의 구조적 한계: 중국은 생산성 증가율의 둔화, 국유기업 중심의 비효율적 자원배분, 지방정부와 기업의 부채 증가, 부동산 부문의 불안정 등으로 과거와 같은 고도성장을 지속하기 어려워지고 있다."}, {"id": "r27_261008_3_4", "y": "27", "fd": "2026-10-08", "t": "자원 및 환경의 제약: 중국은 에너지와 주요 원자재의 해외 의존도가 높고 환경오염과 자원 부족 문제에 직면하고 있으며, 이러한 구조적 취약성은 경제성장과 국가안보를 제약하는 요인으로 작용한다."}, {"id": "r27_261008_3_5", "y": "27", "fd": "2026-10-08", "t": "국제환경의 악화: 미국을 비롯한 주요 국가들이 중국의 부상을 견제하면서 첨단기술 수출통제, 공급망 재편, 군사적 협력 강화 등을 추진하고 있으며, 이는 중국의 경제성장과 대외적 영향력 확대에 불리한 환경을 조성하고 있다."}, {"id": "r27_261008_3_6", "y": "27", "fd": "2026-10-08", "t": "전략적 포위망의 형성: 중국의 군사력 증강과 적극적인 대외정책은 미국·일본·호주·인도 등의 안보협력을 강화하는 결과를 초래하고 있으며, 중국은 시간이 흐를수록 주변국들의 견제가 심화되는 상황에 직면할 수 있다."}, {"id": "r27_261008_3_7", "y": "27", "fd": "2026-10-08", "t": "정점을 지난 강대국의 함정(Peaking Power Trap): 강대국이 현재 강력한 군사력을 보유하고 있더라도 장래에 상대적 국력이 쇠퇴할 것으로 예상하면, 전략적으로 유리한 기회의 창이 닫히기 전에 위험한 대외행동을 선택할 가능성이 증가한다."}, {"id": "r27_261008_3_8", "y": "27", "fd": "2026-10-08", "t": "독일의 역사적 사례: 제1차 세계대전 이전 독일은 러시아의 국력 증대와 영국·프랑스·러시아의 협력 강화로 장기적인 전략환경이 불리해질 것을 우려했으며, 이러한 위기의식이 1914년 전쟁의 위험을 감수하는 데 영향을 주었다고 설명한다."}, {"id": "r27_261008_3_9", "y": "27", "fd": "2026-10-08", "t": "일본의 역사적 사례: 일본은 중국 침략 이후 미국의 경제제재와 석유금수 조치로 장기적인 군사적 열세를 우려했으며, 시간이 흐를수록 미국과의 전쟁에서 승리할 가능성이 낮아진다는 판단 아래 1941년 진주만 공격을 감행했다고 설명한다."}, {"id": "r27_261008_3_10", "y": "27", "fd": "2026-10-08", "t": "예방전쟁과의 관계: 피크 차이나론은 현재의 상대적 우위가 미래에 사라질 것을 우려하는 국가가 장래의 불리한 세력균형을 방지하기 위해 선제적으로 군사행동을 선택할 수 있다는 예방전쟁(preventive war)의 논리와 연결된다."}, {"id": "r27_261008_3_11", "y": "27", "fd": "2026-10-08", "t": "대만해협의 전쟁 위험: 중국 지도부가 경제성장 둔화와 미국 및 동맹국들의 군사적 견제 강화로 대만 통일의 기회가 줄어들고 있다고 판단하면, 대만에 대한 봉쇄나 제한적 공격, 전면적인 군사작전 등 위험한 행동을 선택할 가능성이 높아질 수 있다고 주장한다."}, {"id": "r27_261008_3_12", "y": "27", "fd": "2026-10-08", "t": "투키디데스 함정과의 차이: 앨리슨의 투키디데스 함정론은 부상하는 강대국이 기존 패권국의 지위를 위협하면서 전쟁 위험이 증가한다고 설명하지만, 피크 차이나론은 도전국이 국력의 정점에 도달한 후 상대적 쇠퇴를 우려하면서 군사적 모험을 선택할 위험이 증가한다고 설명한다."}, {"id": "r27_261008_3_13", "y": "27", "fd": "2026-10-08", "t": "미국의 단기적 대응전략: 미국은 중국의 군사적 모험을 억지하기 위해 대만의 방위능력을 강화하고 일본·호주 등 동맹국과의 군사협력을 확대하며, 인도·태평양 지역에서 중국의 공격이 쉽게 성공하지 못하도록 군사적 균형을 유지해야 한다고 주장한다."}, {"id": "r27_261008_3_14", "y": "27", "fd": "2026-10-08", "t": "미국의 장기적 대응전략: 미국은 냉전기 소련에 대응했던 경험을 활용하여 동맹체제를 강화하고 첨단기술과 경제적 경쟁력을 유지하며, 중국과의 직접적인 전쟁을 피하면서 장기적인 전략경쟁에서 우위를 확보해야 한다고 주장한다."}, {"id": "r27_261008_3_15", "y": "27", "fd": "2026-10-08", "t": "중국 쇠퇴론의 핵심: 중국의 상대적 쇠퇴가 반드시 중국의 군사적 위협 감소를 의미하는 것은 아니며, 오히려 중국 지도부가 미래의 쇠퇴를 인식하는 시기에 군사적 모험주의가 강화될 수 있으므로 미국은 중국의 장기적인 쇠퇴 가능성보다 단기적인 충돌 위험에 대비해야 한다고 강조한다."}, {"id": "r27_261008_3_16", "y": "27", "fd": "2026-10-08", "t": "이론적 한계: 중국의 경제성장 둔화가 반드시 종합국력의 절대적 쇠퇴를 의미하거나 군사적 공격으로 이어지는 것은 아니며, 핵억지와 경제적 상호의존 등 현대 국제정치의 특수성을 고려할 때 독일과 일본의 역사적 사례를 중국에 그대로 적용하는 데에는 한계가 있다."}]}}, {"ch": "NEW:k27c_ir_th:사상:k27c_ir_gen", "chname": null, "sec": {"id": "r27s_261012_4", "title": "기출논점 보완 – 멜로스의 대화 (10.12)", "note": "2026년 시험에서 기출논점. 사상편 투키디데스 부분에 단권화해 주세요. 한번 출제되면 논점이 확대되어 다시 출제되는 경우가 많습니다. 출제예상논점", "fd": "2026-10-12", "kind": "issue", "items": [{"id": "r27_261012_4_0", "y": "27", "fd": "2026-10-12", "t": "출전: 멜로스의 대화는 투키디데스(Thucydides)의 『펠로폰네소스 전쟁사』 제5권에 등장하는 아테네와 멜로스 사이의 협상이다. 국제정치학에서 고전적 현실주의, 힘과 정의의 관계, 국가이익, 패권정치 등을 설명하는 대표적인 사례이다."}, {"id": "r27_261012_4_1", "y": "27", "fd": "2026-10-12", "t": "사건의 배경: 기원전 416년 아테네는 스파르타계 식민도시인 멜로스에 복종을 요구하였다. 멜로스는 펠로폰네소스 전쟁에서 중립을 유지하고자 하였으나, 아테네는 이를 받아들이지 않았다."}, {"id": "r27_261012_4_2", "y": "27", "fd": "2026-10-12", "t": "아테네의 패권정책: 아테네는 멜로스의 중립을 허용하면 다른 동맹국들이 아테네의 힘을 의심할 수 있다고 판단하였다. 따라서 멜로스의 복속은 단순한 영토 확대가 아니라 제국의 권위와 지배력을 유지하기 위한 문제였다."}, {"id": "r27_261012_4_3", "y": "27", "fd": "2026-10-12", "t": "협상의 결렬: 멜로스는 정의, 신의 가호, 스파르타의 지원 가능성을 근거로 항복을 거부하였다. 아테네는 멜로스를 포위하여 점령하였고, 성인 남성을 처형하고 여성과 어린이를 노예로 삼았다."}, {"id": "r27_261012_4_4", "y": "27", "fd": "2026-10-12", "t": "힘과 정의의 관계: 아테네는 정의가 대등한 힘을 가진 당사자 사이에서나 논의될 수 있으며, 힘이 불균등한 상황에서는 강자가 할 수 있는 일을 하고 약자는 감수할 수밖에 없다고 주장하였다. 이는 국제정치에서 권력의 우위를 강조하는 현실주의적 사고를 보여준다."}, {"id": "r27_261012_4_5", "y": "27", "fd": "2026-10-12", "t": "국제사회의 무정부성: 멜로스의 대화는 국가 위에 강제력을 행사할 중앙정부가 존재하지 않는 국제사회에서 국가의 생존이 궁극적으로 자국의 힘과 전략적 판단에 의존한다는 현실주의적 관점을 보여준다."}, {"id": "r27_261012_4_6", "y": "27", "fd": "2026-10-12", "t": "국가이익과 도덕의 충돌: 아테네는 멜로스의 독립과 정의보다는 제국의 안전과 이익을 우선하였다. 이는 국가가 도덕적 원칙과 국가이익 사이에서 갈등할 때 국가이익을 우선시할 수 있다는 고전적 현실주의의 문제의식과 연결된다."}, {"id": "r27_261012_4_7", "y": "27", "fd": "2026-10-12", "t": "중립의 한계: 멜로스는 중립이 아테네에 해를 끼치지 않는다고 주장하였으나, 아테네는 멜로스의 중립을 허용하는 것 자체가 제국의 약점을 드러낼 수 있다고 보았다. 따라서 강대국 간 경쟁에서 약소국의 중립이 반드시 안전을 보장하지는 않는다."}, {"id": "r27_261012_4_8", "y": "27", "fd": "2026-10-12", "t": "평판과 신뢰성: 아테네는 멜로스를 복속시키지 못하면 다른 동맹국들이 아테네의 지배력에 도전할 수 있다고 우려하였다. 이는 패권국이 자신의 위신과 강제력의 신뢰성을 유지하기 위해 직접적인 전략적 가치가 작은 지역에도 개입할 수 있다는 논점이다."}, {"id": "r27_261012_4_9", "y": "27", "fd": "2026-10-12", "t": "동맹의 신뢰성과 방기 위험: 멜로스는 스파르타가 혈연적 유대와 명예 때문에 자신들을 지원할 것이라고 기대하였다. 그러나 아테네는 스파르타 역시 자신의 이익과 위험을 계산할 것이므로 멜로스를 위해 전쟁에 개입할 가능성이 낮다고 주장하였다."}, {"id": "r27_261012_4_10", "y": "27", "fd": "2026-10-12", "t": "희망과 합리적 선택: 멜로스는 군사력의 열세에도 불구하고 전쟁의 불확실성과 승리의 가능성에 희망을 걸었다. 아테네는 객관적인 힘의 차이를 무시한 희망은 국가의 멸망을 초래할 수 있다고 경고하였다."}, {"id": "r27_261012_4_11", "y": "27", "fd": "2026-10-12", "t": "정의와 장기적 국가이익: 멜로스는 약소국을 보호하는 정의의 원칙이 강대국에도 장기적으로 이익이 된다고 주장하였다. 아테네 역시 언젠가 패권을 상실할 수 있으므로 정의를 무시하는 행위가 장래에 자신에게 불리하게 작용할 수 있다는 논리이다."}, {"id": "r27_261012_4_12", "y": "27", "fd": "2026-10-12", "t": "힘의 정치와 패권의 역설: 아테네는 제국의 안전을 위해 멜로스를 정복했지만, 이러한 팽창정책은 장기적으로 다른 국가의 적대감과 저항을 심화시킬 수 있다. 이는 패권 유지를 위한 강압적 행동이 오히려 패권의 기반을 약화시킬 수 있다는 문제를 보여준다."}, {"id": "r27_261012_4_13", "y": "27", "fd": "2026-10-12", "t": "투키디데스의 현실주의에 대한 평가: 멜로스의 대화는 흔히 현실주의의 고전으로 평가되지만, 투키디데스가 아테네의 주장을 전적으로 지지했다고 단정할 수는 없다. 아테네의 잔혹한 행동과 이후 시칠리아 원정의 실패를 함께 서술한 것은 힘에 대한 오만과 잘못된 전략적 판단의 위험을 드러낸다는 해석도 가능하다."}]}}, {"ch": "i1009", "chname": "전쟁 원인론", "sec": {"id": "r27s_261014_5", "title": "기출논점 보완 – 투키디데스 함정 (10.14)", "note": "최근 기출논점. 여러번 출제되었습니다. 새롭게 출제될 논점은 전쟁을 피한 4가지 사례, 전쟁을 피할 수 있는 지 여부 등입니다. 본문에 추가하였습니다. 투키디데스 파트나 세력전이론 파트에 단권화하시면 됩니다. 출제예상논점", "fd": "2026-10-14", "kind": "issue", "items": [{"id": "r27_261014_5_0", "y": "27", "fd": "2026-10-14", "t": "개념: 신흥 강대국이 급부상하여 기존 패권국의 지위를 위협할 때 구조적 긴장이 고조되고 전쟁의 위험이 증가하는 현상을 말한다."}, {"id": "r27_261014_5_1", "y": "27", "fd": "2026-10-14", "t": "출전: 그레이엄 앨리슨(Graham Allison)은 2017년 저서 『예정된 전쟁(Destined for War)』에서 투키디데스의 함정을 체계적으로 설명하고 미국과 중국의 패권경쟁에 적용하였다."}, {"id": "r27_261014_5_2", "y": "27", "fd": "2026-10-14", "t": "투키디데스의 주장: 투키디데스는 『펠로폰네소스 전쟁사』에서 아테네의 세력 증대와 이에 대한 스파르타의 두려움이 펠로폰네소스 전쟁을 불가피하게 만들었다고 설명하였다."}, {"id": "r27_261014_5_3", "y": "27", "fd": "2026-10-14", "t": "전쟁의 구조적 원인: 전쟁의 원인을 지도자의 개인적 성향보다는 국제체제의 권력분포 변화에서 찾는다. 신흥 강대국의 부상에 따른 세력전이가 기존 패권국의 불안감을 증폭시킨다."}, {"id": "r27_261014_5_4", "y": "27", "fd": "2026-10-14", "t": "패권국의 두려움: 기존 패권국은 신흥국의 경제력과 군사력 증대를 자국의 지위와 안보에 대한 위협으로 인식하여 군비증강, 동맹 강화, 견제정책 등을 추진한다."}, {"id": "r27_261014_5_5", "y": "27", "fd": "2026-10-14", "t": "신흥국의 불만: 신흥 강대국은 증가한 국력에 상응하는 국제적 지위와 영향력을 요구한다. 기존 패권국이 이를 수용하지 않을 경우 기존 국제질서에 대한 도전이 강화될 수 있다."}, {"id": "r27_261014_5_6", "y": "27", "fd": "2026-10-14", "t": "안보딜레마: 패권국의 견제정책은 신흥국에 적대적 행동으로 인식되고, 신흥국의 대응은 다시 패권국의 위협인식을 강화하여 군비경쟁과 전쟁 위험을 증가시킨다."}, {"id": "r27_261014_5_7", "y": "27", "fd": "2026-10-14", "t": "역사적 사례연구: 앨리슨은 약 500년 동안 기존 지배국과 신흥국 사이의 세력경쟁 사례 16개를 분석하여 12개 사례에서 전쟁이 발생하고 4개 사례에서 전쟁을 회피하였다고 주장하였다."}, {"id": "r27_261014_5_8", "y": "27", "fd": "2026-10-14", "t": "전쟁이 발생한 12개 사례: 프랑스-합스부르크 왕가, 합스부르크 왕가-오스만제국, 합스부르크 왕가-스웨덴, 네덜란드-영국, 프랑스-영국, 영국-프랑스, 영국·프랑스-러시아(크림전쟁), 프랑스-프로이센(보불전쟁), 청나라·러시아-일본(청일·러일전쟁), 영국-독일(제1차 세계대전), 영국·프랑스·소련-독일(제2차 세계대전), 미국-일본(태평양전쟁)."}, {"id": "r27_261014_5_9", "y": "27", "fd": "2026-10-14", "t": "전쟁을 회피한 4개 사례: 포르투갈-스페인(토르데시야스조약), 영국-미국(평화적 세력전이), 미국-소련(핵억지와 냉전 관리), 영국·프랑스-통일 독일(유럽통합)."}, {"id": "r27_261014_5_10", "y": "27", "fd": "2026-10-14", "t": "미중 패권경쟁: 중국의 경제적·군사적 부상과 미국의 패권 유지 노력이 구조적 긴장을 형성한다. 대만해협이나 남중국해에서의 충돌이 양국 간 전쟁으로 확대될 위험이 있다는 것이다."}, {"id": "r27_261014_5_11", "y": "27", "fd": "2026-10-14", "t": "우발적 충돌: 세력전이로 긴장이 고조된 상황에서는 작은 군사적 충돌이나 동맹국 간 분쟁도 대규모 전쟁으로 확대될 가능성이 있다."}, {"id": "r27_261014_5_12", "y": "27", "fd": "2026-10-14", "t": "전쟁의 불가피성 여부: 투키디데스의 함정은 전쟁의 위험을 강조하지만 전쟁이 반드시 발생한다는 의미는 아니다. 역사적으로 평화적 세력전이가 가능했던 사례도 존재한다."}, {"id": "r27_261014_5_13", "y": "27", "fd": "2026-10-14", "t": "전쟁 회피 방안: 전략적 소통, 위기관리, 핵억지, 상호이익의 조정, 국제제도를 통한 협력 등이 전쟁 위험을 완화할 수 있다."}, {"id": "r27_261014_5_14", "y": "27", "fd": "2026-10-14", "t": "세력전이이론과의 관계: 오르간스키(Organski)의 세력전이이론과 유사하게 국제체제의 권력분포 변화를 중시하지만, 앨리슨은 특히 신흥국의 부상이 기존 패권국에 불러오는 두려움과 양국의 전략적 상호작용을 강조한다."}, {"id": "r27_261014_5_15", "y": "27", "fd": "2026-10-14", "t": "피크 차이나론과의 차이: 앨리슨은 신흥 강대국의 부상에 대한 기존 패권국의 두려움을 강조한다. 반면 브랜즈와 베클리는 국력의 정점에 도달한 신흥국이 장래의 쇠퇴를 두려워하여 기회의 창이 닫히기 전에 공격적 행동을 선택할 위험에 주목한다."}]}}, {"ch": "NEW:k27c_ir_crit:비판이론·그람시:i973", "chname": null, "sec": {"id": "r27s_261016_6", "title": "기출논점 보완 – 그람시주의 (10.16)", "note": "최근 기출논점. 마르크스주의에서는 세계체제론, 종속이론과 함께 최근에는 그람시주의가 주로 출제되고 있습니다. 그람시주의의 주요 개념을 명확하게 이해해 두세요. 출제예상논점", "fd": "2026-10-16", "kind": "issue", "items": [{"id": "r27_261016_6_0", "y": "27", "fd": "2026-10-16", "t": "개념: 그람시주의는 이탈리아 마르크스주의 사상가 안토니오 그람시(Antonio Gramsci)의 사상에 기초한 이론으로, 지배질서가 단순한 물리적 강제력뿐만 아니라 피지배자의 동의(consent)를 통해 유지된다고 설명한다. 국제정치학에서는 신그람시주의(Neo-Gramscianism)를 중심으로 발전하였다."}, {"id": "r27_261016_6_1", "y": "27", "fd": "2026-10-16", "t": "주요 저서: 그람시는 『옥중수고(Prison Notebooks)』에서 헤게모니, 시민사회, 진지전, 역사적 블록 등의 개념을 발전시켰다. 이후 로버트 콕스(Robert Cox)가 그람시의 사상을 국제정치경제에 적용하였다."}, {"id": "r27_261016_6_2", "y": "27", "fd": "2026-10-16", "t": "헤게모니(Hegemony): 지배계급이 물질적 강제력(coercion)뿐만 아니라 이데올로기와 가치관을 통해 피지배계급의 자발적 동의를 확보하여 지배를 유지하는 상태를 말한다. 헤게모니는 강제와 동의의 결합에 기초한다."}, {"id": "r27_261016_6_3", "y": "27", "fd": "2026-10-16", "t": "동의의 창출: 지배계급은 자신의 특수한 이익을 사회 전체의 보편적 이익으로 제시하여 피지배계급의 동의를 확보한다. 피지배계급이 기존 지배질서를 정당하고 자연스러운 것으로 받아들이도록 만드는 것이 핵심이다."}, {"id": "r27_261016_6_4", "y": "27", "fd": "2026-10-16", "t": "시민사회(Civil Society): 시민사회는 학교, 종교단체, 언론, 노동조합 등 다양한 사회조직이 활동하는 영역으로, 지배계급의 가치와 이데올로기가 확산되고 헤게모니가 형성되는 중요한 공간이다. 동시에 기존 헤게모니에 대한 저항도 발생할 수 있다."}, {"id": "r27_261016_6_5", "y": "27", "fd": "2026-10-16", "t": "정치사회(Political Society): 정치사회는 국가의 법률, 행정, 경찰, 군대 등 강제력을 행사하는 제도적 영역이다. 그람시는 정치사회와 시민사회를 구분하면서 국가의 지배가 강제와 동의의 결합에 의해 이루어진다고 설명하였다."}, {"id": "r27_261016_6_6", "y": "27", "fd": "2026-10-16", "t": "역사적 블록(Historical Bloc): 특정한 사회질서가 물질적 생산관계와 정치적·이데올로기적 상부구조의 결합을 통해 형성되는 것을 말한다. 지배적인 사회세력은 경제적 이해관계뿐만 아니라 정치적·문화적 동의를 확보하여 안정적인 역사적 블록을 형성한다. (지배 세력 자체를 의미하기도 함)"}, {"id": "r27_261016_6_7", "y": "27", "fd": "2026-10-16", "t": "진지전(War of Position): 기존 지배질서를 변화시키기 위해 시민사회에서 장기간에 걸쳐 이념적·문화적 영향력과 사회적 지지를 확보하는 전략이다. 그람시는 시민사회가 발달한 서구사회에서는 직접적인 국가권력 탈취보다 진지전이 중요하다고 보았다. (대항적 역사블록에 의해 전개됨)"}, {"id": "r27_261016_6_8", "y": "27", "fd": "2026-10-16", "t": "기동전(War of Manoeuvre): 국가권력을 직접적이고 신속하게 장악하려는 전략이다. 그람시는 시민사회가 상대적으로 취약한 사회에서는 기동전이 가능할 수 있으나, 시민사회가 발달한 사회에서는 진지전이 중요하다고 보았다."}, {"id": "r27_261016_6_9", "y": "27", "fd": "2026-10-16", "t": "유기적 지식인(Organic Intellectuals): 특정 사회계급의 경험과 이해관계를 조직하고 이념적으로 표현하여 헤게모니의 형성에 기여하는 지식인이다. 기존 지배질서를 정당화하거나 새로운 사회세력의 대항 헤게모니 형성에 기여할 수 있다."}, {"id": "r27_261016_6_10", "y": "27", "fd": "2026-10-16", "t": "로버트 콕스의 신그람시주의: 콕스는 그람시의 헤게모니 개념을 국내 계급관계에서 국제질서로 확대하였다. 국제적 헤게모니는 강대국의 압도적인 군사력과 경제력만으로 형성되는 것이 아니라 국제적 동의와 제도적 정당성을 통해 유지된다. (패권의 지배수단=권력+이데올로기+제도)"}, {"id": "r27_261016_6_11", "y": "27", "fd": "2026-10-16", "t": "역사적 구조(Historical Structure): 콕스는 역사적 구조가 물질적 능력(material capabilities), 관념(ideas), 제도(institutions)의 상호작용으로 형성된다고 보았다. 세 요소는 상호 영향을 주며 특정한 권력관계와 질서를 형성한다."}, {"id": "r27_261016_6_12", "y": "27", "fd": "2026-10-16", "t": "역사적 구조의 세 수준: 콕스는 사회세력(social forces), 국가형태(forms of state), 세계질서(world orders)의 세 수준에서 역사적 구조를 분석하였다. 생산관계에서 형성된 사회세력은 국가의 성격과 국제질서의 변화에 영향을 미친다."}, {"id": "r27_261016_6_13", "y": "27", "fd": "2026-10-16", "t": "국제기구의 역할: 콕스에 의하면 국제기구는 기존 국제질서의 규범과 가치를 확산하고 지배적인 국제적 권력관계에 정당성을 부여할 수 있다. 따라서 국제기구를 단순히 국가 간 협력을 촉진하는 중립적 장치로만 보지 않는다."}, {"id": "r27_261016_6_14", "y": "27", "fd": "2026-10-16", "t": "문제해결이론과 비판이론: 콕스는 문제해결이론(problem-solving theory)이 기존 질서와 권력관계를 주어진 것으로 받아들이고 그 내부의 문제를 해결하려 한다고 보았다. 반면 비판이론(critical theory)은 기존 질서가 역사적으로 어떻게 형성되었으며 어떻게 변화할 수 있는지를 탐구한다. (신현실주의와 신자유주의-문제해결이론)"}, {"id": "r27_261016_6_15", "y": "27", "fd": "2026-10-16", "t": "이론의 비중립성: 콕스는 이론은 언제나 특정한 누군가와 특정한 목적을 위해 존재한다고 주장하였다. 지식과 이론은 역사적·사회적 조건으로부터 완전히 독립될 수 없다는 것이다."}, {"id": "r27_261016_6_16", "y": "27", "fd": "2026-10-16", "t": "패권안정이론과의 차이: 패권안정이론은 압도적인 물질적 능력을 가진 패권국이 국제경제질서의 안정에 기여한다고 설명한다. 반면 신그람시주의는 물질적 능력뿐만 아니라 지배질서에 대한 동의, 이데올로기, 국제제도의 정당성을 강조한다."}, {"id": "r27_261016_6_17", "y": "27", "fd": "2026-10-16", "t": "대항 헤게모니(Counter-hegemony): 기존 지배질서에 저항하는 사회세력들이 새로운 가치와 이념을 확산하고 대안적인 역사적 블록을 형성함으로써 기존 헤게모니에 도전할 수 있다. 국제질서는 고정된 것이 아니라 사회세력 간 투쟁을 통해 변화할 수 있다."}]}}, {"ch": "i1146", "chname": "미국", "sec": {"id": "r27s_261019_7", "title": "최근 시사 – 미국 대외정책 주요 용어 정리 (10.19)", "note": "최근 미국 대외정책 관련 용어 정리. 이슈파트 미국대외정책 총론 부분이나 트럼프 대외정책 파트에 단권화. 출제예상논점", "fd": "2026-10-19", "kind": "issue", "items": [{"id": "r27_261019_7_0", "y": "27", "fd": "2026-10-19", "t": "미국 우선주의(America First): 미국의 국가이익·주권·경제안보를 대외정책의 최우선 기준으로 삼고, 자유주의적 국제질서의 유지나 국제공공재 제공 자체보다 미국이 얻는 실질적 이익을 중시하는 외교노선이다. 트럼프 행정부는 무역적자 축소, 제조업 부흥, 국경통제, 동맹국의 방위비 증액을 강조하며, 국제기구와 동맹관계도 미국의 국익에 기여하는 정도에 따라 재평가한다. 다만 미국 우선주의가 국제적 관여의 전면 중단을 의미하는 것은 아니며, 필요한 경우 군사력과 경제적 압박을 적극적으로 활용한다."}, {"id": "r27_261019_7_1", "y": "27", "fd": "2026-10-19", "t": "힘을 통한 평화(Peace Through Strength): 압도적인 군사력과 경제적 우위를 확보하고 강력한 보복능력을 과시함으로써 잠재적 적대국의 공격을 억제하고 유리한 협상조건을 조성하려는 전략이다. 레이건 행정부에서도 강조되었던 개념으로, 트럼프 행정부는 군사력 현대화, 미사일방어체계 구축, 대중국 군사적 억지 등에 이를 적용하고 있다. 국제정치학적으로는 현실주의의 힘의 정치 및 억지이론과 연결되며, 군사력 증강이 상대국의 위협인식을 높여 안보딜레마를 심화시킬 가능성도 존재한다."}, {"id": "r27_261019_7_2", "y": "27", "fd": "2026-10-19", "t": "돈로 독트린(Donroe Doctrine): 트럼프(Donald Trump)와 먼로 독트린(Monroe Doctrine)을 결합한 표현으로, 1823년 먼로주의를 현대적으로 재해석하여 서반구에서 미국의 우월적 지위를 회복하려는 대외전략이다. 2025년 국가안보전략(NSS)과 2026년 국가방위전략(NDS)은 이를 트럼프판 먼로주의(Trump Corollary to the Monroe Doctrine)로 공식화하였다. 미국은 중남미와 카리브해에서 중국·러시아 등 역외 강대국의 군사적 진출과 전략적 자산에 대한 통제를 제한하고, 파나마운하 등 핵심 지정학적 요충지에 대한 접근권을 확보하려 한다."}, {"id": "r27_261019_7_3", "y": "27", "fd": "2026-10-19", "t": "상호관세(Reciprocal Tariffs): 미국이 교역상대국의 관세와 비관세장벽 등을 문제 삼아 미국 시장에 수입되는 상품에 추가 관세를 부과함으로써 무역조건의 재조정과 상대국의 양보를 유도하려는 정책이다. 트럼프 행정부는 상호주의를 강조하면서 관세를 무역적자 축소, 제조업 보호, 해외투자 유치 및 외교협상의 지렛대로 활용하였다."}, {"id": "r27_261019_7_4", "y": "27", "fd": "2026-10-19", "t": "거래적 외교(Transactional Diplomacy): 국가 간 관계를 가치와 규범에 기초한 장기적 협력관계보다 구체적인 비용과 편익의 교환관계로 파악하는 외교방식이다. 트럼프 행정부는 동맹국에 대한 안보공약과 방위비 분담, 대미투자, 시장개방 등을 연계하고, 적대국과의 협상에서도 제재완화와 안보보장 등을 상호 교환할 수 있는 협상수단으로 활용한다. 이는 외교적 성과의 가시성과 단기적 호혜성을 중시한다는 특징이 있으나, 동맹의 신뢰성과 국제제도의 장기적 안정성을 약화시킬 수 있다는 비판도 제기된다."}, {"id": "r27_261019_7_5", "y": "27", "fd": "2026-10-19", "t": "최대 압박(Maximum Pressure): 경제제재, 금융거래 차단, 외교적 고립, 군사적 위협 등을 복합적으로 활용하여 상대국이 기존 정책을 변경하도록 강제하는 전략이다. 트럼프 1기 행정부는 북한과 이란에 최대 압박을 적용하였으며, 2기 행정부에서도 이란의 핵개발과 역내 활동을 제한하기 위한 제재정책을 강화하였다. 2026년 10월에도 이란 관련 추가 제재가 실시되었다. 이 전략은 상대국의 정책변경을 목표로 한다는 점에서 강압외교(Coercive Diplomacy)에 해당하지만, 과도한 압박이 상대국의 저항이나 군사적 긴장 고조를 초래할 가능성도 있다."}, {"id": "r27_261019_7_6", "y": "27", "fd": "2026-10-19", "t": "세컨더리 보이콧(Secondary Sanctions): 미국의 직접적인 제재대상뿐 아니라 제재대상 국가·기업·개인과 일정한 거래를 수행하는 제3국의 기업이나 금융기관에도 제재를 부과하는 역외적 경제제재이다. 예컨대 미국은 이란과 거래하는 외국 금융기관에 미국 금융시장 접근 제한 등의 불이익을 부과할 수 있다. 미국 금융망과 달러 결제체계의 중심적 지위를 활용하여 제재의 실효성을 강화한다는 특징이 있으며, 제3국의 경제주권 침해와 제재관할권의 역외적 확대를 둘러싼 논란이 발생한다. 모든 제3국 거래가 자동으로 제재되는 것은 아니며, 개별 제재법령에서 정한 거래유형과 요건에 따라 적용된다."}, {"id": "r27_261019_7_7", "y": "27", "fd": "2026-10-19", "t": "선택적 관여(Selective Engagement): 미국이 전 세계의 모든 분쟁과 안보문제에 동일하게 관여하기보다 전략적 중요성과 국가이익에 따라 개입지역, 개입수단 및 관여수준을 선별하는 대외전략이다. 트럼프 행정부는 미국 본토와 서반구의 안보를 우선시하면서 인도·태평양에서 중국에 대한 억지를 중시하고, 유럽 및 중동에서는 지역 동맹국이 보다 큰 방위책임을 부담하도록 요구한다."}, {"id": "r27_261019_7_8", "y": "27", "fd": "2026-10-19", "t": "부담 전가(Burden Shifting): 미국이 동맹국에 단순히 방위비 분담금을 추가로 부담하도록 요구하는 수준을 넘어 특정 지역의 군사적 위협에 대응하는 일차적 방위책임 자체를 동맹국에 이전하려는 전략이다. 2026년 국가방위전략은 유럽과 기타 지역의 동맹국들이 자국에 더 직접적인 위협에 대응하는 데 주도적 역할을 수행하고, 미국은 제한적이지만 핵심적인 지원을 제공하는 방향을 제시하였다. 이는 공동방위 비용을 나누는 부담 분담(Burden Sharing)보다 책임 이전의 성격이 강하며, 동맹국의 자주국방 강화와 미국의 방기 가능성에 대한 우려를 동시에 초래할 수 있다."}, {"id": "r27_261019_7_9", "y": "27", "fd": "2026-10-19", "t": "선택적 다자주의(Selective Multilateralism): 다자주의 자체를 전면적으로 부정하지는 않지만 국제기구와 다자협정이 미국의 주권과 국가이익에 부합하는지를 기준으로 참여 여부와 협력수준을 선택하는 외교방식이다. 트럼프 행정부는 2026년 1월 미국의 이익에 반한다고 판단한 다수의 국제기구·협약에서 탈퇴하거나 참여 및 지원을 중단하도록 지시하였다. 반면 NATO 등 미국의 전략적 이익에 기여하는 다자협력체제는 조건부로 활용한다. 이는 제도와 규범의 독자적 가치를 강조하는 자유주의적 제도주의와 대비되며, 국제기구를 강대국의 이익 실현을 위한 수단으로 이해하는 현실주의적 시각과 연결된다."}]}}, {"ch": "NEW:k27c_ir_gen:이론 총론:^i973", "chname": null, "sec": {"id": "r27s_261020_8", "title": "이론복습 – 총론 (10.20)", "note": "총론파트에서는 헤들리불의 국제정치관이 주로 출제됩니다. 외교개념에서는 공공외교가 주로 출제되며, 국제기구나 다국적기업도 간간이 출제됩니다. 팩트위주로 체크하고 암기해 주세요 주요논점", "fd": "2026-10-20", "kind": "prog", "items": [{"id": "r27_261020_8_0", "y": "27", "fd": "2026-10-20", "t": "영국의 정치학자 불(Hedley Bull)은 1977년 『국제사회론』이라는 저서를 통해 기존의 자유주의이론들이 국제정치에서 국가의 역할을 지나치게 과소평가하지 않았나 하는 의문을 제기하고, 국가들로 형성된 국제체제가 [[무정부]]체제임에도 불구하고 이들 국가들의 다양한 역할을 통해 질서를 유지하고 있다는 점을 제시하였다."}, {"id": "r27_261020_8_1", "y": "27", "fd": "2026-10-20", "t": "불은 국제정치관을 홉스적 국제정치관, 칸트적 국제정치관, [[그로티우스]]적 국제정치관으로 대별하고 자신은 [[그로티우스]]적 국제정치관을 지지한다고 하였다."}, {"id": "r27_261020_8_2", "y": "27", "fd": "2026-10-20", "t": "[[불]]은 국제체제 속에서 질서를 창출하고 유지하는 주요 제도로 세력균형, 전쟁, 국제법, 외교, 강대국의 역할을 제시하였다."}, {"id": "r27_261020_8_3", "y": "27", "fd": "2026-10-20", "t": "부잔(Barry Buzan)에 의하면 신자유제도주의는 인간에 의해 만들어진 [[제도]]에 일차적 관심을 두는 반면, 영국학파는 역사적으로 구성된 규범적인 구조에 일차적 관심을 둔다."}, {"id": "r27_261020_8_4", "y": "27", "fd": "2026-10-20", "t": "[[로버트 콕스]]는 NGO가 신자유주의질서를 변혁할 수 있는 초국가적 역사적 대항블록을 형성할 수 있다고 본다."}, {"id": "r27_261020_8_5", "y": "27", "fd": "2026-10-20", "t": "[[하이머]]는 독점적 우위 이론을, 버클리와 카슨은 내부화이론을, 더닝은 기업특유우위·내부화유인 우위·입지특유 우위라는 세 가지 요소를 강조하는 절충이론(OLI 이론)을 제시하였다."}, {"id": "r27_261020_8_6", "y": "27", "fd": "2026-10-20", "t": "1999년 세계경제포럼에서 [[코피 아난]] 유엔 사무총장은 다국적기업의 인권, 노동, 환경, 반부패에 관한 10가지 원칙을 제시한 국제연합 지구약속(UN Global Compact)을 제안하였다."}, {"id": "r27_261020_8_7", "y": "27", "fd": "2026-10-20", "t": "[[헤들리 불]]은 외교의 기능을 국가 간 커뮤니케이션 촉진, 합의를 위한 협상, 정보수집, 국제관계의 마찰 최소화로 구분하였다."}, {"id": "r27_261020_8_8", "y": "27", "fd": "2026-10-20", "t": "근대적 의미의 상주 외교사절은 1450년 밀라노공국이 [[피렌체]]공국에 파견한 상주대사에서 유래되었다."}, {"id": "r27_261020_8_9", "y": "27", "fd": "2026-10-20", "t": "신외교제도는 개방성을 특징으로 하는데, 개방성은 윌슨의 14개 조항에서 주창되어 베르사유조약 제18조나 UN헌장 제102조의 조약 [[등록]]제도로 구체화되었다."}]}}, {"ch": "i1462", "chname": "러시아·유라시아", "sec": {"id": "r27s_261021_9", "title": "소련 해체(1991) 이후 러시아의 주요 대외정책 사례 20선 (10.21)", "note": "러시아의 도발이 지속되고 있어 러시아대외정책 사례 출제 가능성이 높아 보입니다. 핵군축, 재래식군축(CFE), 상하이협력기구, 브릭스 등 예상테마가 상당히 많습니다. 아래 정리한 내용들 팩트 위주로 반복해 주세요. 출제예상논점", "fd": "2026-10-21", "kind": "issue", "items": [{"id": "r27_261021_9_0", "y": "27", "fd": "2026-10-21", "t": "소련 해체와 독립국가연합(CIS) 창설(1991년): 1991년 12월 8일 러시아·우크라이나·벨라루스 3국은 벨라베자 협정을 체결하여 소련의 해체를 선언하고 독립국가연합(CIS)을 창설하였다. 12월 21일 알마아타 선언을 통해 아르메니아·아제르바이잔·카자흐스탄·키르기스스탄·몰도바·타지키스탄·투르크메니스탄·우즈베키스탄 등 8개국이 추가로 참여하여 총 11개국으로 확대되었다. 12월 25일 고르바초프가 사임하고 26일 소련이 공식 해체되었으며, 러시아는 소련의 UN 안보리 상임이사국 지위를 이어받았다. 이후 조지아가 1993년 참여하여 2009년 탈퇴하였고, 우크라이나는 CIS 헌장을 비준하지 않은 채 2018년 주요 기구 참여를 중단하였다. 투르크메니스탄은 2005년 준회원국 지위로 전환하였으며, 몰도바 의회는 2026년 4월 CIS 창설협정과 헌장 등의 폐기를 의결하였다. 발트 3국은 처음부터 참여하지 않았다."}, {"id": "r27_261021_9_1", "y": "27", "fd": "2026-10-21", "t": "구소련 지역에 대한 영향력 유지 정책(Near Abroad Policy, 1993년 전후): 옐친 정부는 구소련 구성국들을 ‘근외(Near Abroad)’로 규정하고 러시아의 특별한 이해관계가 존재하는 지역으로 인식하였다. 러시아는 CIS를 활용하여 이들 국가에 대한 정치·군사·경제적 영향력을 유지하고, 러시아계 주민 보호와 지역 안보를 명분으로 개입정책을 추진하였다."}, {"id": "r27_261021_9_2", "y": "27", "fd": "2026-10-21", "t": "미국·러시아 간 핵군축 합의(1993~2026년): 러시아는 미국과 START II(1993년 서명), SORT(2002년 서명), New START(2010년 서명) 등 전략핵군축협정을 체결하였다. START II는 전략핵탄두를 3,000~3,500기로 감축하고 다탄두 지상발사 ICBM을 금지하려 하였으나 발효되지 못하였다. SORT는 실전 배치 전략핵탄두를 1,700\\~2,200기로 감축하도록 하였으며, New START는 배치 전략핵탄두를 1,550기, 배치 전략운반수단을 700기로 제한하였다. New START는 2011년 2월 5일 발효되어 2021년 5년 연장되었으나, 러시아가 2023년 이행 참여를 중단하였고 2026년 2월 5일 만료되었다."}, {"id": "r27_261021_9_3", "y": "27", "fd": "2026-10-21", "t": "프리마코프 독트린(Primakov Doctrine, 1996년): 프리마코프 외무장관은 코지레프의 친서방 외교노선에서 벗어나 러시아의 국가이익과 강대국 지위 회복을 강조하는 애국민족주의적 외교노선을 추진하였다. 미국 중심의 단극체제에 반대하고 다극적 국제질서 형성, NATO 동진 저지, 구소련 지역에서의 영향력 회복, 중국·인도와의 전략적 협력을 추구하였다."}, {"id": "r27_261021_9_4", "y": "27", "fd": "2026-10-21", "t": "러시아·벨라루스 연합국가 창설(1999년): 러시아와 벨라루스는 1996년 공동체 창설조약, 1997년 양국 연합조약을 거쳐 1999년 12월 8일 연합국가(Union State) 창설조약을 체결하였으며, 2000년 1월 26일 발효되었다. 양국은 각각의 주권을 유지하면서 정치·경제·군사 분야의 통합을 추진하고 공동방위 및 단일경제공간 형성을 추구하였다. 이는 러시아가 구소련 지역에서 영향력을 유지하기 위해 추진한 양자 지역통합의 대표적 사례이다."}, {"id": "r27_261021_9_5", "y": "27", "fd": "2026-10-21", "t": "중·러 선린우호협력조약 체결(2001년): 푸틴과 장쩌민은 2001년 7월 중·러 선린우호협력조약을 체결하여 전략적 협력관계를 제도화하였다. 양국은 주권 존중, 상호불가침, 내정불간섭 등을 확인하고 미국 중심의 단극질서에 대응하여 다극적 국제질서 구축을 추구하였다. 이 조약은 상호방위조약은 아니지만 중·러 간 장기적 전략적 협력의 기반이 되었다."}, {"id": "r27_261021_9_6", "y": "27", "fd": "2026-10-21", "t": "상하이협력기구(SCO) 창설 및 확대(2001~2024년): 1996년 중국·러시아·카자흐스탄·키르기스스탄·타지키스탄이 상하이 5개국(Shanghai Five) 협력체를 구성하였고, 2001년 우즈베키스탄이 참여하면서 6개국이 상하이협력기구(SCO)를 창설하였다. 이후 2017년 인도·파키스탄, 2023년 이란, 2024년 벨라루스가 가입하여 총 10개 회원국으로 확대되었다. SCO는 테러리즘·분리주의·극단주의에 대한 공동 대응과 정치·경제·안보협력을 추진하는 기구로, 러시아는 이를 통해 중앙아시아에서의 영향력을 유지하고 미국 중심의 국제질서를 견제하며 다극적 국제질서 구축을 추구하였다."}, {"id": "r27_261021_9_7", "y": "27", "fd": "2026-10-21", "t": "NATO·러시아 이사회(NATO-Russia Council, 2002년): 러시아와 NATO는 1997년 NATO·러시아 기본문서(Founding Act)를 채택하여 상설합동이사회(PJC)를 설치하였고, 2002년 로마선언을 통해 이를 NATO·러시아 이사회(NRC)로 발전시켰다. NRC는 테러 대응, 군비통제, 대량살상무기 비확산, 위기관리 등을 협의하는 기구였다. 그러나 2014년 크림반도 병합 이후 NATO가 러시아와의 실질적 협력을 중단하였으며, 2022년 1월 12일 마지막 회의가 개최된 뒤 우크라이나 전면 침공으로 양측의 협력관계가 사실상 단절되었다."}, {"id": "r27_261021_9_8", "y": "27", "fd": "2026-10-21", "t": "러시아·우크라이나 가스 분쟁과 에너지 외교(2006·2009년): 러시아는 천연가스와 석유 수출을 대외정책의 중요한 수단으로 활용하였다. 2006년과 2009년 우크라이나와의 가스 가격 및 공급·통과료 분쟁으로 유럽에 대한 가스 공급에 차질이 발생하였다. 이는 유럽의 러시아 에너지 의존도와 에너지 안보의 취약성을 부각시켰으며, 에너지 자원이 국가 간 정치·경제적 영향력 행사에 활용될 수 있음을 보여주었다."}, {"id": "r27_261021_9_9", "y": "27", "fd": "2026-10-21", "t": "BRIC 창설 및 BRICS 확대(2006~2025년): 러시아는 2006년 중국·인도·브라질과 함께 BRIC 외교장관회의를 개최하고, 2009년 러시아 예카테린부르크에서 제1차 BRIC 정상회의를 개최하였다. 2011년 남아프리카공화국이 정상회의에 참여하면서 BRICS로 확대되었으며, 2024년 이집트·에티오피아·이란·아랍에미리트, 2025년 인도네시아가 가입하였다. 사우디아라비아는 2023년 가입 초청을 받았다. 러시아는 2024년 카잔 정상회의를 개최하여 달러 의존도 축소, 자국통화 결제 확대, 국제금융질서 개혁 및 다극적 국제질서 구축을 추진하였다."}, {"id": "r27_261021_9_10", "y": "27", "fd": "2026-10-21", "t": "푸틴의 뮌헨안보회의 연설(2007년): 푸틴은 2007년 뮌헨안보회의에서 미국의 일방주의, NATO의 동진, 미국의 미사일방어체계(MD) 구축을 강하게 비판하였다. 미국 중심의 단극질서를 거부하고 러시아의 독자적인 강대국 지위를 강조하면서 대서방 강경외교 노선을 표명하였다. 이는 냉전 종식 이후 러시아의 대서방 외교정책 변화가 뚜렷하게 드러난 사건으로 평가된다."}, {"id": "r27_261021_9_11", "y": "27", "fd": "2026-10-21", "t": "러시아·조지아 전쟁(2008년): 2008년 8월 남오세티야를 둘러싼 갈등이 무력충돌로 확대되어 조지아군이 츠힌발리를 공격하였고, 러시아가 대규모 군사작전으로 대응하여 조지아 영토 깊숙이 진격하였다. 이후 러시아는 남오세티야와 압하지야의 독립을 승인하였다."}, {"id": "r27_261021_9_12", "y": "27", "fd": "2026-10-21", "t": "크림반도 병합 및 우크라이나 동부 개입(2014년): 우크라이나에서 친러 성향의 야누코비치 대통령이 축출된 이후 러시아는 2014년 크림반도를 군사적으로 장악하고 주민투표를 거쳐 자국 영토로 병합하였다. 또한 우크라이나 동부 돈바스 지역의 친러 분리주의 세력을 지원하였다. UN 총회는 우크라이나의 영토보전을 확인하고 크림반도 주민투표의 효력을 인정하지 않았으며, 미국과 EU는 대러시아 경제제재를 확대하였다."}, {"id": "r27_261021_9_13", "y": "27", "fd": "2026-10-21", "t": "유라시아경제연합(EAEU) 출범(2015년): 러시아는 벨라루스·카자흐스탄과 함께 2014년 유라시아경제연합 창설조약을 체결하고 2015년 1월 1일 EAEU를 출범시켰으며, 같은 해 아르메니아와 키르기스스탄이 가입하였다. EAEU는 상품·서비스·자본·노동의 자유로운 이동을 추구하는 경제통합체로서 구소련 지역의 경제적 결속을 강화하고 러시아의 지역적 영향력을 유지하는 수단으로 활용되었다."}, {"id": "r27_261021_9_14", "y": "27", "fd": "2026-10-21", "t": "시리아 내전 군사개입(2015년): 러시아는 2015년 9월 아사드 정권의 요청을 받아 시리아 내전에 군사적으로 개입하여 공습을 중심으로 정부군을 지원하였다. 이를 통해 중동에서 군사·외교적 영향력을 확대하고 시리아 내 군사거점을 유지하려 하였다. 그러나 2024년 12월 아사드 정권이 붕괴하면서 러시아의 시리아 정책과 중동 전략에도 중대한 변화가 발생하였다."}, {"id": "r27_261021_9_15", "y": "27", "fd": "2026-10-21", "t": "나고르노카라바흐 분쟁 중재와 평화유지군 파견(2020년): 러시아는 2020년 아르메니아와 아제르바이잔 사이의 제2차 나고르노카라바흐 전쟁을 중재하여 11월 9일 3국 간 휴전성명을 채택하도록 하였고, 약 2,000명의 평화유지군을 파견하였다. 그러나 2023년 아제르바이잔이 나고르노카라바흐를 장악하였으며, 2024년 러시아 평화유지군이 철수하였다. 이는 남캅카스 지역에서 러시아의 중재자 역할과 영향력의 한계를 보여주었다."}, {"id": "r27_261021_9_16", "y": "27", "fd": "2026-10-21", "t": "우크라이나 전면 침공(2022년): 러시아는 2022년 2월 24일 NATO 확대 저지와 우크라이나의 비군사화 등을 명분으로 우크라이나를 전면 침공하였다. UN 총회는 러시아의 침략을 규탄하고 즉각적인 철군을 요구하였다. 전쟁은 미국과 EU의 대규모 대러시아 경제제재, 핀란드(2023년)와 스웨덴(2024년)의 NATO 가입, 유럽의 러시아 에너지 의존도 축소 및 유럽 안보질서의 재편을 초래하였다."}, {"id": "r27_261021_9_17", "y": "27", "fd": "2026-10-21", "t": "유럽재래식무기감축조약(CFE) 탈퇴(2023년): 러시아는 NATO 확대와 유럽의 군사력 불균형 등을 이유로 2007년 유럽재래식무기감축조약(CFE)의 이행을 중단하였고, 2023년 11월 7일 탈퇴 효력이 발생하였다. CFE는 1990년 NATO와 바르샤바조약기구 회원국들이 체결한 조약으로, 유럽 내 전차·장갑전투차량·포병·전투기·공격헬기 등 5개 범주의 재래식무기 수량을 제한하였다. 러시아의 탈퇴는 탈냉전기 유럽 재래식 군비통제체제의 약화를 상징한다."}, {"id": "r27_261021_9_18", "y": "27", "fd": "2026-10-21", "t": "러시아·북한 포괄적 전략적 동반자관계 조약(2024년): 푸틴과 김정은은 2024년 6월 19일 평양에서 포괄적 전략적 동반자관계 조약을 체결하였다. 조약 제4조는 일방이 무력침공을 받아 전쟁상태에 처할 경우 타방이 지체 없이 군사적 및 기타 원조를 제공하도록 규정하고 있다. 이 조약은 2024년 12월 발효되었으며, 북·러 군사협력을 강화하고 동북아시아 안보질서와 우크라이나 전쟁에 영향을 미치는 중요한 계기가 되었다."}, {"id": "r27_261021_9_19", "y": "27", "fd": "2026-10-21", "t": "러시아·이란 포괄적 전략적 동반자관계 조약(2025년): 푸틴과 페제시키안 이란 대통령은 2025년 1월 17일 모스크바에서 포괄적 전략적 동반자관계 조약을 체결하여 안보·국방·경제·에너지·교통 분야의 협력을 강화하였다. 조약 제3조는 일방이 침략을 당할 경우 타방이 침략국에 군사적 또는 기타 지원을 제공하지 않도록 규정하였다. 다만 북·러 조약과 달리 상대국에 대한 직접적인 군사원조 의무는 포함하지 않았다. 이는 서방의 제재에 대응하고 비서방 국가들과의 전략적 협력을 강화하려는 러시아 대외정책의 대표적 사례이다."}]}}, {"ch": "NEW:k27c_ir_th:사상:k27c_ir_gen", "chname": null, "sec": {"id": "r27s_261022_10", "title": "이론복습 – 사상 (10.22)", "note": "사상파트에서는 칸트, 마키아벨리, 투키디데스, 그로티우스 등이 출제되었습니다. 로크, 홉스, 루소 등도 출제가 예상되며, 동양사상도 기습공격이 들어올 수 있으니 학자 중심으로 정리해야 합니다. 주요논점", "fd": "2026-10-22", "kind": "prog", "items": [{"id": "r27_261022_10_0", "y": "27", "fd": "2026-10-22", "t": "마키아벨리는 동맹전략에 있어서 상대적 약자와 동맹을 맺는 [[균형]]동맹론을 주장하였다. 마키아벨리는 강자에 대한 [[편승]]은 복속을 의미하기 때문에 독립국가로서 생존하기 위한 방책은 강자에 대한 [[균형]]화전략을 통한 상대적 약자들과의 규합과 [[동맹]]에서 찾아진다고 주장하였다."}, {"id": "r27_261022_10_1", "y": "27", "fd": "2026-10-22", "t": "[[홉스]]에 의하면 대외적 자연상태에서 리바이어던은 성립할 수 없다. 대외적 자연상태는 대내적 자연상태보다 덜 [[비참]]하기 때문이다."}, {"id": "r27_261022_10_2", "y": "27", "fd": "2026-10-22", "t": "루소는 [[상호의존]]이 모든 분쟁의 원천이라고 보고 국가들이 가능한 한 [[독립]]적인 상태를 유지해야 한다고 보았다."}, {"id": "r27_261022_10_3", "y": "27", "fd": "2026-10-22", "t": "투키디데스는 펠로폰네소스 전쟁의 내재적 원인을 “[[아테네]]의 세력 증대와 그것이 가져온 [[스파르타]]의 [[공포]]”라고 설명하였다."}, {"id": "r27_261022_10_4", "y": "27", "fd": "2026-10-22", "t": "[[로크]]에 의하면 정부가 없는 자연상태는 전쟁상태가 아니며 완전한 자유의 상태이다."}, {"id": "r27_261022_10_5", "y": "27", "fd": "2026-10-22", "t": "칸트의 영구평화론 제[[2]]확정조항은 ‘국제법은 자유로운 국가들의 세계연맹에 기초하지 않으면 안 된다’는 것이다."}, {"id": "r27_261022_10_6", "y": "27", "fd": "2026-10-22", "t": "생피에르는 유럽의 안정을 위해 유럽연합(European [[confederation]])의 형성, 국제재판소 설치 등을 제안하였다. 군주들의 권위 인정을 기초로 군주들 간 단결을 강조하였다."}, {"id": "r27_261022_10_7", "y": "27", "fd": "2026-10-22", "t": "캉유웨이 등의 [[변법자강]]파들은 사회진화론에 근거한 역사관, 서구 사회에 대한 적극적 인식, 변화하는 국제정치에 대한 보다 현실주의적 사고를 바탕으로 정치·교육·사상 제도에 걸친 전면적 개혁을 주장했다."}, {"id": "r27_261022_10_8", "y": "27", "fd": "2026-10-22", "t": "[[후쿠자와 유키치]]는 문명개화의 중요성을 강조하여 야만-개화-문명의 3단계 국가발전론을 주장했다. 또한 세계정치의 본질을 권력투쟁으로 보는 현실주의적 국제정치관에 기초하여 탈아[[입구]]론을 주장했다."}, {"id": "r27_261022_10_9", "y": "27", "fd": "2026-10-22", "t": "유길준은 양절체제론적 국제정치관을 주장했다. 양절체제의 전략이란 조선의 이익에 맞게 한편으로는 전통 중화질서를 유지하면서 다른 한편으로는 서구의 주권국가 체제를 활용한다는 전략이었다."}]}}, {"ch": "i973", "chname": "제국주의론", "sec": {"id": "r27s_261021_11", "title": "레닌의 제국주의론 (10.21)", "note": "최근에 제국주의론이 출제가 되었습니다. 일단 레닌의 제국주의가 출제되었으므로 우선 레닌을 상세하게 정리합니다. 이론편 국제정치경제론 총론 부분에 보면 이론간 제국주의 비교하는 부분이 있습니다. 거기 마르크스주의(레닌) 부분에 조금 더 자세하게 보완해 주세요. 출제예상논점", "fd": "2026-10-21", "kind": "issue", "items": [{"id": "r27_261021_11_0", "y": "27", "fd": "2026-10-21", "t": "레닌은 1917년 출간된 『제국주의, 자본주의의 최고 단계』에서 제국주의를 자본주의 발전의 독점단계로 규정하였다."}, {"id": "r27_261021_11_1", "y": "27", "fd": "2026-10-21", "t": "레닌에 의하면 자유경쟁은 생산과 자본의 집중을 초래하고, 그 결과 소수의 거대기업이 경제를 지배하는 독점자본주의가 형성된다."}, {"id": "r27_261021_11_2", "y": "27", "fd": "2026-10-21", "t": "레닌은 은행자본과 산업자본의 결합에 따른 금융자본의 형성을 제국주의의 핵심적인 경제적 특징으로 보았다."}, {"id": "r27_261021_11_3", "y": "27", "fd": "2026-10-21", "t": "레닌에 의하면 독점자본주의 단계에서는 상품수출뿐 아니라 자본수출이 특별히 중요한 지위를 차지하게 된다."}, {"id": "r27_261021_11_4", "y": "27", "fd": "2026-10-21", "t": "레닌은 제국주의 단계에서 국제적 독점자본가 단체에 의한 세계시장의 경제적 분할과 강대국에 의한 세계의 영토적 분할이 나타난다고 보았다."}, {"id": "r27_261021_11_5", "y": "27", "fd": "2026-10-21", "t": "레닌은 자본주의의 불균등 발전으로 강대국 사이의 경제력과 기존 식민지 분포 사이에 불일치가 발생하고, 이에 따라 세계 재분할을 둘러싼 제국주의 전쟁이 발생한다고 주장하였다."}, {"id": "r27_261021_11_6", "y": "27", "fd": "2026-10-21", "t": "레닌은 제국주의를 독점자본주의이자 기생적·부패하는 자본주의이며 사멸해가는 자본주의로 설명하였다."}, {"id": "r27_261021_11_7", "y": "27", "fd": "2026-10-21", "t": "레닌의 노동귀족론에 따르면 제국주의 국가의 자본가들은 해외에서 획득한 초과이윤의 일부를 노동계급 상층부에 분배하여 노동귀족층을 형성하며, 이는 노동계급의 혁명의식을 약화시키고 자본주의 체제에 대한 타협적 태도를 강화하는 요인이 된다."}, {"id": "r27_261021_11_8", "y": "27", "fd": "2026-10-21", "t": "레닌은 카우츠키의 초제국주의론을 비판하면서 자본주의의 불균등 발전으로 인해 강대국 간 평화적 협력과 세계분할에 관한 합의는 불안정하다고 주장하였다. 카우츠키의 초제국주의론에 따르면 제국주의 국가들은 상호 간의 군사적 경쟁을 지양하고 국제적으로 결합한 금융자본을 통해 세계를 공동으로 지배하고 착취하는 새로운 자본주의 단계로 이행할 수 있다."}, {"id": "r27_261021_11_9", "y": "27", "fd": "2026-10-21", "t": "레닌은 제국주의가 자본주의의 구조적 모순을 심화시킴으로써 사회주의 혁명의 역사적 조건을 형성한다고 주장하였다."}]}}, {"ch": "NEW:k27c_ir_gen:이론 총론:^i973", "chname": null, "sec": {"id": "r27s_261022_12", "title": "이론복습 – 이론총론 (10.22)", "note": "이론총론에서는 실증주의, 탈실증주의, 비판이론, 역사사회학 등 상당히 폭넓게 출제되고 있습니다. 이론파트 전체를 놓고 보면, 이론 자체의 내용도 중요하지만, 각각 대비되는 이론이 무엇인지 파악하고, 이론간 비교를 잘 하는 것이 중요합니다. 주요논점", "fd": "2026-10-22", "kind": "prog", "items": [{"id": "r27_261022_12_0", "y": "27", "fd": "2026-10-22", "t": "1차 대논쟁은 이상주의와 고전적 현실주의 간 논쟁이다. 이상주의는 인간의 선한 본성을 전제로 [[집단안보]]와 국내정치의 민주화를 통해 항구적 평화가 가능하다고 본 반면, 현실주의는 인간의 이기적 본성에 기초하여 국제정치를 권력투쟁으로 파악하고 세력균형을 통한 일시적 안정이 가능하다고 본다."}, {"id": "r27_261022_12_1", "y": "27", "fd": "2026-10-22", "t": "2차 대논쟁은 전통주의와 행태주의 간 논쟁이다. 행태주의는 전통주의가 경험적으로 확인할 수 없는 인간 본성에 기초하여 국제정치를 설명하는 점을 비판하고 [[자연과학]]적 방법론을 적용하여 국제정치를 연구해야 한다고 주장하였다."}, {"id": "r27_261022_12_2", "y": "27", "fd": "2026-10-22", "t": "3차 대논쟁에서는 현실주의가 주장하는 국가중심성, 이슈의 계서성, 권력의 [[대체성]] 등이 비판되었다. 상호의존론은 다양한 비국가행위자의 존재, 이슈 간 고정적 계서의 부재, 권력의 [[특정성]]을 강조하였다."}, {"id": "r27_261022_12_3", "y": "27", "fd": "2026-10-22", "t": "실증주의는 자연현상과 사회현상이 본질적으로 동일한 방법론으로 연구될 수 있다는 전제에서 자연과학적 방법론을 사회현상에 적용하며, 사회현상에도 [[법칙성]]이 존재하므로 이를 발견하는 것이 연구의 목적이라고 본다."}, {"id": "r27_261022_12_4", "y": "27", "fd": "2026-10-22", "t": "탈실증주의는 자연현상과 사회현상이 본질적으로 다르므로 자연과학적 방법론을 사회현상에 그대로 적용할 수 없다고 본다. 또한 사회현상에 보편적이고 불변하는 [[법칙]]이 존재한다는 주장을 비판한다."}, {"id": "r27_261022_12_5", "y": "27", "fd": "2026-10-22", "t": "[[탈실증주의]]적 접근에는 비판이론, 탈근대론, 역사사회학 등이 포함된다."}, {"id": "r27_261022_12_6", "y": "27", "fd": "2026-10-22", "t": "콕스와 링클레이터 등이 주장하는 [[비판이론]]은 지식이 가치중립적인 것이 아니라 특정한 역사적·사회적 세력의 입장을 반영한다고 본다."}, {"id": "r27_261022_12_7", "y": "27", "fd": "2026-10-22", "t": "콕스는 이론을 문제해결이론과 비판이론으로 구분하였다. [[문제해결이론]]은 기존 질서를 주어진 것으로 받아들이고 그 내부의 문제 해결에 집중하는 반면, [[비판]]이론은 기존 질서의 형성과 변동 가능성을 분석한다."}, {"id": "r27_261022_12_8", "y": "27", "fd": "2026-10-22", "t": "탈근대론은 [[근대성]]이 필연적이고 보편적인 것이 아니라 서구의 특수한 역사적 산물이라고 보며, 절대적이고 보편적인 진리에 대한 주장을 비판한다."}, {"id": "r27_261022_12_9", "y": "27", "fd": "2026-10-22", "t": "[[찰스 틸리]]는 역사사회학적 관점에서 근대국가를 주어진 산물로 간주하는 신현실주의를 비판하고, 전쟁 수행과 군사적 경쟁 과정에서 근대국가가 역사적으로 형성되었다고 주장하였다."}]}}, {"ch": "i1273", "chname": "중국", "sec": {"id": "r27s_261028_13", "title": "시진핑 시기별 대외정책 (10.28)", "note": "2026년 10월 26일~29일 중국 베이징에서 중국공산당 제20기 중앙위원회 제5차 전체회의(20기 5중전회)가 개최되고 있습니다. 이번 회의에서는 전면적 종엄치당(全面從嚴治黨), 즉 당에 대한 전면적이고 엄격한 관리·통치를 핵심 의제로 삼아 당내 기강 강화, 부패 척결, 고위급 인사 및 군부 조직 정비 등을 논의하고 있습니다. 특히 이번 회의는 2027년 10월경 개최될 제21차 중국공산당 전국대표대회를 앞두고 시진핑의 권력 기반과 지도체제를 정비하는 정치적 의미를 갖습니다. 시진핑은 2012년, 2017년, 2022년 총서기에 선출되었으며, 2027년 제21차 당대회 직후 개최될 제21기 1중전회에서 네 번째 총서기 임기에 도전할 것으로 관측됩니다. 시험에서는 1기, 2기, 3기 정책 구분이 출제될 것으로 예상됩니다. 출제예상논점", "fd": "2026-10-28", "kind": "issue", "items": [{"id": "r27_261028_13_0", "y": "27", "fd": "2026-10-28", "t": "시진핑 1기(2012.11.~2017.10.)"}, {"id": "r27_261028_13_1", "y": "27", "fd": "2026-10-28", "t": "2013년 6월 - 신형대국관계 제안: 시진핑은 미국 캘리포니아 서니랜즈에서 오바마 대통령과 정상회담을 개최하고, 상호존중, 충돌과 대항의 회피, 협력과 상생을 강조하는 신형대국관계를 제안하였다."}, {"id": "r27_261028_13_2", "y": "27", "fd": "2026-10-28", "t": "2013년 9월·10월 - 일대일로 구상 제안: 2013년 9월 카자흐스탄에서 실크로드 경제벨트를, 10월 인도네시아에서 21세기 해상 실크로드를 각각 제안하면서 육상과 해상을 연결하는 경제·인프라 협력전략을 추진하였다."}, {"id": "r27_261028_13_3", "y": "27", "fd": "2026-10-28", "t": "2013년 10월 - AIIB 설립 제안: 인도네시아 방문 중 아시아인프라투자은행(AIIB) 설립을 제안하였다. 이후 2014년 10월 설립 양해각서 체결, 2015년 6월 설립협정 서명, 2016년 1월 공식 개소가 이루어졌다. (창설과정 출제됨)"}, {"id": "r27_261028_13_4", "y": "27", "fd": "2026-10-28", "t": "2013년 11월 - 동중국해 방공식별구역 선포: 중국은 센카쿠열도(댜오위다오) 등을 포함하는 동중국해 방공식별구역(ADIZ)을 선포하여 일본 및 미국 등과 갈등하였다."}, {"id": "r27_261028_13_5", "y": "27", "fd": "2026-10-28", "t": "2016년 7월 - 남중국해 중재판정 거부: 중국은 2014~2015년 남중국해 인공섬 건설과 군사시설 확충을 적극 추진하였으며, 2016년 7월 12일 필리핀과 중국 사이의 남중국해 중재판정이 선고되자 이를 수용하지 않았다."}, {"id": "r27_261028_13_6", "y": "27", "fd": "2026-10-28", "t": "2016년 7월 - 한국의 사드(THAAD) 배치 결정에 반발: 한국과 미국이 사드 배치를 결정하자 중국은 이에 반대하였다. 2017년 3월 사드 장비의 한국 반입과 배치가 진행되면서 중국의 경제적 압박이 심화되었다. (배치결정-박근혜정부)"}, {"id": "r27_261028_13_7", "y": "27", "fd": "2026-10-28", "t": "2016년 9월 - 파리기후변화협정 비준 및 항저우 G20 정상회의: 중국과 미국은 파리협정 비준서를 기탁하였고, 중국은 항저우 G20 정상회의를 개최하여 기후변화와 세계경제 거버넌스에 대한 참여를 확대하였다. (파리협정 발효-2016년 11월)"}, {"id": "r27_261028_13_8", "y": "27", "fd": "2026-10-28", "t": "2017년 5월 - 제1차 일대일로 국제협력 정상포럼 개최: 베이징에서 제1차 일대일로 정상포럼을 개최하여 일대일로 구상을 국제적 다자협력사업으로 확대하였다."}, {"id": "r27_261028_13_9", "y": "27", "fd": "2026-10-28", "t": "2017년 8월 - 지부티 해외 군사기지 개설: 중국은 아프리카 지부티에 최초의 해외 군사 지원기지를 공식 개설하여 아덴만, 소말리아 인근 해역 등에서 군사활동을 지원할 기반을 확보하였다. (최근 기출/킬러문항)"}, {"id": "r27_261028_13_10", "y": "27", "fd": "2026-10-28", "t": "시진핑 2기(2017.10.~2022.10.)"}, {"id": "r27_261028_13_11", "y": "27", "fd": "2026-10-28", "t": "2018년 7월 - 미·중 무역전쟁 본격화: 미국 트럼프 행정부가 340억 달러 규모의 중국산 수입품에 25% 추가관세를 부과하자 중국이 보복관세로 대응하면서 양국의 무역전쟁이 본격화되었다."}, {"id": "r27_261028_13_12", "y": "27", "fd": "2026-10-28", "t": "2019년 5월 - 화웨이 제재와 미·중 기술패권 경쟁 심화: 미국이 중국의 화웨이를 수출규제 대상인 거래제한 명단(Entity List)에 추가하면서 5G, 반도체 및 첨단기술을 둘러싼 갈등이 심화되었다. 2022년 10월에는 미국이 대중국 첨단반도체 수출통제를 강화하였다."}, {"id": "r27_261028_13_13", "y": "27", "fd": "2026-10-28", "t": "2020년 3월 - 전랑외교의 대표적 사례 등장: 중국 외교부 대변인 자오리젠이 코로나19의 기원과 관련하여 미국을 비난하는 주장을 제기하는 등 외교관들의 공세적 대응이 두드러졌다. 전랑외교(戰狼外交, Zhànláng Wàijiāo, Wolf Warrior Diplomacy)는 중국이 자국의 핵심 이익과 국제적 위상에 대한 외부의 비판이나 압박에 공세적으로 대응하는 강경한 외교방식을 의미한다. 명칭은 중국의 애국주의 액션영화 [[??]]에서 유래하였으며, 시진핑 집권기에 두드러졌고 특히 2020년 코로나19 확산을 전후하여 본격적으로 주목받았다. 중국 외교관들이 서방 국가들의 비판에 강경한 언사와 공개적인 반박으로 대응하는 것이 대표적인 특징이다. (대외정책 기조나 행태에 대한 4자성어가 빈번하게 출제되고 있음)"}, {"id": "r27_261028_13_14", "y": "27", "fd": "2026-10-28", "t": "2020년 6월 - 중국·인도 갈완 계곡 충돌: 히말라야 접경지역인 갈완 계곡에서 중국군과 인도군 사이에 유혈충돌이 발생하면서 양국의 국경·안보갈등이 심화되었다. 2017년 6~8월 중국의 도로 건설을 둘러싸고 중국·인도·부탄 3국 접경지역인 도클람(Doklam)에서 중국군과 인도군이 약 73일간 군사적으로 대치하였으며, 2020년 5월부터는 라다크(Ladakh) 지역에서 양국의 국경분쟁이 격화되어 6월 15일 갈완 계곡(Galwan Valley)에서 유혈충돌이 발생하면서 인도군 20명과 중국군 4명이 사망하였다. (분쟁지역과 연도 암기)"}, {"id": "r27_261028_13_15", "y": "27", "fd": "2026-10-28", "t": "2020년 11월 - 역내포괄적경제동반자협정(RCEP) 서명: 아세안 10개국과 한국, 중국, 일본, 호주, 뉴질랜드 등 총 15개국이 RCEP에 서명하였다. 협정은 중국 등 10개국에서 2022년 1월 발효되었으며, 한국에서는 2022년 2월 발효되었다. (기출/상세 출제 유력)"}, {"id": "r27_261028_13_16", "y": "27", "fd": "2026-10-28", "t": "2021년 9월 - CPTPP 가입 신청: 중국은 2021년 9월 16일 포괄적·점진적 환태평양경제동반자협정(CPTPP)의 기탁국인 뉴질랜드에 공식 가입 신청서를 제출하였다."}, {"id": "r27_261028_13_17", "y": "27", "fd": "2026-10-28", "t": "2021년 9월 - 글로벌 발전 이니셔티브(GDI) 제안: 시진핑은 제76차 유엔 총회에서 개발도상국의 발전, 빈곤퇴치, 지속가능발전목표(SDGs) 이행을 강조하는 글로벌 발전 이니셔티브를 제안하였다. (출제 유력)"}, {"id": "r27_261028_13_18", "y": "27", "fd": "2026-10-28", "t": "2022년 2월 - 중·러 전략적 협력관계 강화: 시진핑과 푸틴 대통령은 베이징 정상회담을 계기로 공동성명을 발표하고 양국의 전략적 협력을 강화하였다. 공동성명에서는 양국의 우호관계와 협력에 한계가 없다는 표현이 사용되었다."}, {"id": "r27_261028_13_19", "y": "27", "fd": "2026-10-28", "t": "2022년 4월 - 글로벌 안보 이니셔티브(GSI) 제안: 시진핑은 보아오포럼에서 공동·종합·협력·지속가능 안보와 불가분의 안보 원칙 등을 강조하는 글로벌 안보 이니셔티브를 제안하였다."}, {"id": "r27_261028_13_20", "y": "27", "fd": "2026-10-28", "t": "시진핑 3기(2022.10.~현재)"}, {"id": "r27_261028_13_21", "y": "27", "fd": "2026-10-28", "t": "2023년 2월 - 우크라이나 전쟁의 정치적 해결을 위한 입장문 발표: 중국은 우크라이나 전쟁 발발 1주년인 2023년 2월 24일 국가주권 존중, 적대행위 중단, 평화협상 재개, 일방적 제재 반대 등을 포함하는 12개 항목의 입장문을 발표하였다."}, {"id": "r27_261028_13_22", "y": "27", "fd": "2026-10-28", "t": "2023년 3월 - 사우디아라비아·이란 관계 정상화 중재: 중국의 중재로 2023년 3월 10일 사우디아라비아와 이란이 외교관계 복원에 합의하면서 중국의 중동 외교적 역할이 확대되었다."}, {"id": "r27_261028_13_23", "y": "27", "fd": "2026-10-28", "t": "2023년 3월 - 글로벌 문명 이니셔티브(GCI) 제안: 시진핑은 중국공산당과 세계 정당 간 고위급 대화에서 문명의 다양성 존중, 문명 간 교류와 상호학습 등을 강조하는 글로벌 문명 이니셔티브를 발표하였다."}, {"id": "r27_261028_13_24", "y": "27", "fd": "2026-10-28", "t": "2023년 8월 - BRICS 확대 결정 및 신규 회원국 가입: 2023년 8월 남아프리카공화국 요하네스버그에서 개최된 제15차 BRICS 정상회의에서 이집트, 에티오피아, 이란, 아랍에미리트, 사우디아라비아, 아르헨티나 등 6개국을 신규 회원국으로 초청하기로 결정하였다. 2024년 1월 1일 이집트, 에티오피아, 이란, 아랍에미리트가 정식 가입하였으며, 아르헨티나는 가입을 거부하였다. 사우디아라비아는 미국과의 안보·기술협력 관계를 유지하면서 중국·러시아와 경제·에너지 협력을 확대하려는 균형외교 차원에서 정식 가입을 유보하였다. 2026년 9월 12~13일 인도 뉴델리에서 개최된 제18차 BRICS 정상회의에도 사우디아라비아는 초청국 자격으로 참가하였다. 사우디아라비아 정부는 초청국 지위를 유지하고 있어 2026년 10월 현재 회원국이라고 보기 어렵다."}, {"id": "r27_261028_13_25", "y": "27", "fd": "2026-10-28", "t": "2023년 10월 - 제3차 일대일로 국제협력 정상포럼 개최: 일대일로 구상은 2013년 9월과 10월에 제안되었으며, 일대일로 국제협력 정상포럼은 2017년 5월 베이징에서 처음 개최되었다. 중국은 일대일로 출범 10주년을 맞아 2023년 10월 17~18일 베이징에서 제3차 정상포럼을 개최하고 고품질 일대일로 협력과 디지털·녹색발전 분야의 협력을 강조하였다."}, {"id": "r27_261028_13_26", "y": "27", "fd": "2026-10-28", "t": "2024년 6월 - 중국·필리핀 남중국해 충돌 심화: 남중국해 세컨드 토머스 암초 일대에서 중국 해경과 필리핀 선박 사이에 충돌이 발생하면서 양국의 해양안보 갈등이 심화되었다."}, {"id": "r27_261028_13_27", "y": "27", "fd": "2026-10-28", "t": "2024년 9월 - 중국·아프리카 협력포럼(FOCAC) 정상회의 개최: 중국·아프리카 협력포럼(FOCAC)은 2000년 10월 베이징에서 개최된 제1차 각료회의를 계기로 출범하였으며, 정상회의는 2006년 11월 베이징에서 처음 개최되었다. 중국은 2024년 9월 4~6일 베이징에서 정상회의를 개최하여 아프리카 국가들과 인프라, 경제개발, 산업협력 등을 확대하고 글로벌 사우스와의 외교적 연계를 강화하였다."}, {"id": "r27_261028_13_28", "y": "27", "fd": "2026-10-28", "t": "2025년 1월 - 인도네시아의 BRICS 가입: 2025년 1월 6일 인도네시아가 BRICS의 정식 회원국으로 가입하면서 동남아시아 지역으로 BRICS의 외연이 확대되었다. 인도네시아의 가입은 2023년 8월 요하네스버그 정상회의에서 승인되었으나, 인도네시아는 2024년 대통령선거와 신정부 출범 이후 가입 절차를 마무리하였다. (브릭스 지속 출제되고있음)"}, {"id": "r27_261028_13_29", "y": "27", "fd": "2026-10-28", "t": "2025년 9월 - 글로벌 거버넌스 이니셔티브(GGI) 제안: 시진핑은 2025년 9월 1일 톈진에서 개최된 상하이협력기구(SCO) 플러스 회의를 계기로 국가주권 평등, 국제법 준수, 다자주의 실천, 사람 중심 접근 및 실질적 행동을 5대 원칙으로 하는 글로벌 거버넌스 이니셔티브를 제안하였다. 이를 통해 개발도상국의 국제적 발언권 확대, 유엔 중심의 다자주의 강화 및 국제질서의 다극화를 추진하였다. (출제유력.5대원칙암기필요)"}]}}, {"ch": "NEW:k27c_ir_real:현실주의:k27c_ir_th", "chname": null, "sec": {"id": "r27s_261022_14", "title": "이론복습 – 현실주의(1) (고전적 현실주의·게임이론·억지이론) (10.22)", "note": "고전적현실주의는 모겐소 중심으로 출제되나, 간혹 카아의 이론도 출제됩니다. 모겐소의 경우 다극체제 안정론은 아직 출제가 안 되어서 주요 예상논점입니다. 게임이론은 모두 중요하고 특히 균형점 찾는 연습을 해 두시고, 균형점을 암기해야 합니다. 새로 책에 들어간 교착게임과 죄수의딜레마게임의 차이도 중요합니다. 억지이론의 경우 억지달성 요건이 주로 출제되었으나, 억지의 유형, 확장억지의 성공과 이익도 중요 논점입니다. 주요논점", "fd": "2026-10-22", "kind": "prog", "items": [{"id": "r27_261022_14_0", "y": "27", "fd": "2026-10-22", "t": "모겐소는 인간의 [[??]]이 이기적이고 권력지향적이며, 인간은 권력의 극대화를 추구한다고 보았다."}, {"id": "r27_261022_14_1", "y": "27", "fd": "2026-10-22", "t": "모겐소는 국가가 권력으로 정의된 [[??]]을 추구한다고 보았으며, 권력으로 정의되는 [[??]]이라는 개념은 보편적으로 적용될 수 있지만 권력과 [[? const QS0 = { mode: 'type', view: 'list', n: 10, scope: 'random', chs: [], shuffle: true, wrongOnly: false, y: null, kinds: { blank: true, card: true, read: false } };
let QS = { ...QS0 };
try { Object.assign(QS, JSON.parse(localStorage.getItem(KEY + ':qs') || '{}')); } catch (e) {}
QS.kinds = Object.assign({ blank: true, card: true, read: false }, QS.kinds || {});
const saveQS = () => { try { localStorage.setItem(KEY + ':qs', JSON.stringify(QS)); } catch (e) {} };
const stat = id => (DB.stats ||= {})[id] ||= { c: 0, w: 0 };
const qAnswers = it => { const b = blanks(it.t); return b.length ? b : (it.a ? [it.a] : []); };
const kindOf = it => it.q ? 'card' : qAnswers(it).length ? 'blank' : 'read';
const quizzable = it => !!QS.kinds[kindOf(it)];
const effMode = q => kindOf(q.it) === 'blank' ? QS.mode : 'self';
function norm(s) { return String(s || '').toLowerCase().replace(/[\s·.,'"‘’“”「」『』()\[\]{}<>\-–—_:;!?]/g, ''); }
function variants(ans) {
  const out = new Set([ans]);
  ans.split(/\s*\/\s*/).forEach(x => out.add(x));
  [...out].forEach(x => { const m = x.match(/^(.*?)\s*\((.*?)\)\s*(.*)$/); if (m) { out.add(m[1] + m[3]); out.add(m[2]); } });
  if (/^[OX](\s|\(|$)/i.test(ans.trim())) out.add(ans.trim()[0]);
  return [...out].map(norm).filter(Boolean);
}
const isRight = (given, ans) => { const g = norm(given); return !!g && variants(ans).includes(g); };

function quizPool() {
  const y = QS.y || yr, out = [];
  for (const p of doc().parts) for (const c of p.chapters) {
    if (QS.scope === 'topic' && !QS.chs.includes(c.id)) continue;
    for (const s of c.secs) for (const it of s.items) {
      if (!quizzable(it)) continue;
      if (y !== 'all' && it.y !== y) continue;
      if (QS.wrongOnly && !((DB.stats || {})[it.id]?.w > 0)) continue;
      out.push({ it, ch: c.title, sec: s.title });
    }
  }
  return out;
}
const shuffleArr = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };

function updCount() { readSetup(); const n = quizPool().length; $('#qzCount').innerHTML = n ? `<b>${n}</b> questions available` : '<span class="w">No questions match</span>'; }
function startQuiz() {
  readSetup(); saveQS();
  let pool = quizPool();
  if (!pool.length) return toast('No questions match');
  if (QS.scope === 'random' || QS.shuffle) shuffleArr(pool);
  QZ = { pool, pos: 0, round: [], idx: 0, res: {}, given: {} };
  nextRound();
}
function nextRound(list) {
  QZ.round = list || QZ.pool.slice(QZ.pos, QZ.pos + QS.n);
  if (!list) QZ.pos += QZ.round.length;
  QZ.idx = 0; QZ.res = {}; QZ.given = {}; QZ.checked = false;
  QS.view === 'card' ? showCard() : showList();
}
/* 문제 렌더 */
function qText(q, mode, revealed) {
  const it = q.it; const ans = qAnswers(it); let k = 0;
  const tag = it.tag ? `<b class="tag">[${esc(it.tag)}]</b> ` : '';
  const kd = kindOf(it);
  if (kd === 'card') return `<div class="qz-front">${esc(it.q)}</div>` + (revealed ? `<div class="qz-back">${qHtml(it, true, true)}</div>` : `<div class="qz-back hid">Back hidden</div>`);
  if (kd === 'read') return `<span class="qz-read">Read</span> ` + qHtml(it, true, true);
  let body = esc(it.t).replace(/\[\[(.+?)\]\]/g, (_, a) => {
    const i = k++;
    if (mode === 'type') return `<input class="qz-in" data-i="${i}" autocomplete="off" autocapitalize="off" spellcheck="false" style="width:${Math.max(4, Math.min(16, [...a].length * 1.15 + 1.5))}em">`;
    return revealed ? `<span class="qz-ans">${esc(a)}</span>` : `<span class="qz-hid">${'　'.repeat(Math.max(2, Math.min(8, [...a].length)))}</span>`;
  });
  if (!blanks(it.t).length) {
    body += mode === 'type' ? ` <span class="qz-oxl">→</span> <input class="qz-in" data-i="0" autocomplete="off" style="width:6em">`
      : (revealed ? ` <span class="qz-oxl">→</span> <span class="qz-ans">${esc(it.a)}</span>` : ` <span class="qz-oxl">→</span> <span class="qz-hid">　　　</span>`);
  }
  return tag + body;
}
const meta = q => `<div class="qz-meta">${esc(q.ch)} · ${esc(q.sec)}${(DB.stats || {})[q.it.id]?.w ? ` <span class="qz-wc">✕${DB.stats[q.it.id].w}</span>` : ''}</div>`;
function record(id, ok) { const s = stat(id); ok ? s.c++ : s.w++; s.t = Date.now(); }
function gradeQ(box, q) {
  const ans = qAnswers(q.it); let all = true;
  box.querySelectorAll('.qz-in').forEach(inp => {
    const a = ans[+inp.dataset.i] ?? ''; const ok = isRight(inp.value, a);
    inp.classList.add(ok ? 'ok' : 'ng'); inp.readOnly = true;
    if (!ok) { all = false; inp.insertAdjacentHTML('afterend', `<span class="qz-fix">${esc(a)}</span>`); }
  });
  return all;
}
/* 목록형 */
function showList() {
  const r = QZ.round, total = QZ.pool.length;
  $('#qzBody').innerHTML = `
  <div class="qz-top"><button class="btn" data-q="setup">← Settings</button><div class="qz-prog">${QZ.pos - r.length + 1}–${QZ.pos} / ${total}</div><button class="btn" data-q="close">Close</button></div>
  <div class="qz-list">${r.map((q, i) => { const em = effMode(q), kd = kindOf(q.it); return `<div class="qz-item" data-i="${i}"><div class="qz-num">${i + 1}</div><div class="qz-main">${meta(q)}<div class="qz-q">${qText(q, em === 'type' ? 'type' : 'reveal', false)}</div>
    ${em === 'type' ? `<div class="qz-btns" hidden><button class="qz-o" data-ov="${i}">Mark correct</button></div>` : `<div class="qz-btns">${kd === 'read' ? '' : `<button class="btn" data-rv="${i}">${kd === 'card' ? 'Show back' : 'Show answer'}</button>`}<button class="qz-o" data-mk="${i}:1"${kd === 'read' ? '' : ' hidden'}>○ ${kd === 'read' ? 'Knew it' : 'Correct'}</button><button class="qz-x" data-mk="${i}:0"${kd === 'read' ? '' : ' hidden'}>✕ ${kd === 'read' ? "Didn't know" : 'Wrong'}</button></div>`}</div></div>`; }).join('')}</div>
  <div class="qz-foot">${QS.mode === 'type' ? '<span class="qz-s">Enter = next blank</span>' : '<button class="btn" data-q="revealall">Reveal all</button>'}<span class="sp2"></span><button class="btn qz-go" data-q="${QS.mode === 'type' ? 'grade' : 'finish'}">${QS.mode === 'type' ? 'Grade' : 'Results'}</button></div>`;
  const first = $('#qzBody .qz-in'); if (first) first.focus();
  $('#qzBody').scrollTop = 0;
}
function gradeList() {
  const unm = QZ.round.filter(q => effMode(q) !== 'type' && QZ.res[q.it.id] === undefined);
  if (unm.length) return toast(`Mark ○/✕ on ${unm.length} card/reading items`);
  QZ.round.forEach((q, i) => { if (effMode(q) !== 'type') return; const box = $(`#qzBody .qz-item[data-i="${i}"]`); const ok = gradeQ(box, q); QZ.res[q.it.id] = ok; box.classList.add(ok ? 'ok' : 'ng'); if (!ok) box.querySelector('.qz-btns').hidden = false; });
  QZ.checked = true; finishRound(true);
}
/* 카드형 */
function showCard() {
  const q = QZ.round[QZ.idx], r = QZ.round;
  if (!q) return finishRound();
  $('#qzBody').innerHTML = `
  <div class="qz-top"><button class="btn" data-q="setup">← Settings</button><div class="qz-prog">${QZ.idx + 1} / ${r.length}<div class="qz-bar"><i style="width:${QZ.idx / r.length * 100}%"></i></div></div><button class="btn" data-q="close">Close</button></div>
  ${(() => { const em = effMode(q), kd = kindOf(q.it);
    if (kd === 'read') return `<div class="qz-card shown" id="qzCard">${meta(q)}<div class="qz-q big">${qText(q, 'reveal', true)}</div><div class="qz-hint">Read & check · 1 or ← = didn't know · 2 or → = knew it</div></div>
  <div class="qz-cbtns" id="qzCB"><button class="qz-x big" data-q="cno">✕ Didn't know</button><button class="qz-o big" data-q="cyes">○ Knew it</button></div>`;
    return `<div class="qz-card${em !== 'type' ? ' flip' : ''}" id="qzCard">${meta(q)}<div class="qz-q big">${qText(q, em === 'type' ? 'type' : 'reveal', false)}</div>
    <div class="qz-hint">${em === 'type' ? 'Press Enter to check' : `Click the card or press Space to show the ${kd === 'card' ? 'back' : 'answer'}`}</div></div>
  <div class="qz-cbtns" id="qzCB">${em === 'type' ? '<button class="btn qz-go" data-q="ccheck">Check</button>' : `<button class="btn qz-go" data-q="cflip">${kd === 'card' ? 'Show back' : 'Show answer'}</button>`}</div>`; })()}`;
  const inp = $('#qzBody .qz-in'); if (inp) inp.focus();
}
function cardCheck() {
  const q = QZ.round[QZ.idx], card = $('#qzCard');
  if (QZ.res[q.it.id] !== undefined) return cardNext();
  const ok = gradeQ(card, q); QZ.res[q.it.id] = ok; record(q.it.id, ok); save();
  card.classList.add(ok ? 'ok' : 'ng');
  $('#qzCB').innerHTML = `${ok ? '' : '<button class="btn" data-q="cover">Mark correct</button>'}<button class="btn qz-go" data-q="cnext">Next →</button>`;
  card.querySelector('.qz-hint').textContent = ok ? 'Correct! Enter for next' : 'Enter for next';
}
function cardFlip() {
  const q = QZ.round[QZ.idx], card = $('#qzCard');
  if (card.classList.contains('shown')) return;
  card.classList.add('shown');
  card.querySelector('.qz-q').innerHTML = qText(q, 'reveal', true);
  card.querySelector('.qz-hint').textContent = '1 or ← = didn\'t know · 2 or → = knew it';
  $('#qzCB').innerHTML = `<button class="qz-x big" data-q="cno">✕ Didn't know</button><button class="qz-o big" data-q="cyes">○ Knew it</button>`;
}
function cardMark(ok) { const q = QZ.round[QZ.idx]; QZ.res[q.it.id] = ok; record(q.it.id, ok); save(); cardNext(); }
function cardNext() { QZ.idx++; showCard(); }
/* 결과 */
function finishRound(inline) {
  const r = QZ.round;
  if (QS.view === 'list') {
    const unm = r.filter(q => QZ.res[q.it.id] === undefined);
    if (unm.length) return toast(`${unm.length} items not marked ○/✕`);
  }
  if (QS.view === 'list') r.forEach(q => record(q.it.id, QZ.res[q.it.id])); save();
  const ok = r.filter(q => QZ.res[q.it.id]).length, wrong = r.filter(q => !QZ.res[q.it.id]);
  const more = QZ.pos < QZ.pool.length;
  const html = `<div class="qz-result"><div class="qz-score"><b>${ok}</b> / ${r.length}</div><div class="qz-s">${Math.round(ok / r.length * 100)}%${wrong.length ? ` · ${wrong.length} wrong` : ' · all correct'}</div>
    <div class="qz-rbtns">${wrong.length ? '<button class="btn" data-q="retry">Retry wrong ones</button>' : ''}${more ? `<button class="btn qz-go" data-q="next">Next ${Math.min(QS.n, QZ.pool.length - QZ.pos)}</button>` : '<span class="qz-s">You finished every question in range</span>'}<button class="btn" data-q="setup">Back to settings</button></div></div>`;
  if (inline) { const f = $('#qzBody .qz-foot'); f.outerHTML = `<div class="qz-foot res">${html}</div>`; }
  else $('#qzBody').innerHTML = `<div class="qz-top"><button class="btn" data-q="setup">← Settings</button><div class="qz-prog">Results</div><button class="btn" data-q="close">Close</button></div>${html}` +
    (wrong.length ? `<div class="qz-list review">${wrong.map((q, i) => `<div class="qz-item ng"><div class="qz-num">${i + 1}</div><div class="qz-main">${meta(q)}<div class="qz-q">${qText(q, 'reveal', true)}</div></div></div>`).join('')}</div>` : '');
  QZ.lastWrong = wrong;
}
/* 이벤트 */
document.addEventListener('DOMContentLoaded', () => {});
$('#quiz').addEventListener('click', e => {
  const t = e.target;
  const sb = t.closest('.qz-seg[data-k] button');
  if (sb) { const k = sb.parentNode.dataset.k; QS[k] = isNaN(+sb.dataset.v) || k === 'y' ? sb.dataset.v : +sb.dataset.v; sb.parentNode.querySelectorAll('button').forEach(b => b.classList.toggle('on', b === sb)); if (k === 'scope') { $('#qzBody .qz-chs').hidden = QS.scope !== 'topic'; $('#qzShufW').hidden = QS.scope !== 'topic'; } if (k === 'y') { readSetup(); saveQS(); quizSetup(); return; } updCount(); return; }
  const ca = t.closest('[data-chall]'); if (ca) { $('#qzBody').querySelectorAll('.qz-ch input').forEach(x => x.checked = ca.dataset.chall === '1'); updCount(); return; }
  if (t.closest('.qz-card.flip') && !t.closest('button') && !$('#qzCard').classList.contains('shown')) { cardFlip(); return; }
  const rv = t.closest('[data-rv]');
  if (rv) { const i = +rv.dataset.rv, q = QZ.round[i], box = rv.closest('.qz-item'); box.querySelector('.qz-q').innerHTML = qText(q, 'reveal', true); rv.hidden = true; box.querySelectorAll('[data-mk]').forEach(b => b.hidden = false); return; }
  const mk = t.closest('[data-mk]');
  if (mk) { const [i, v] = mk.dataset.mk.split(':'); const q = QZ.round[+i], box = mk.closest('.qz-item'); QZ.res[q.it.id] = v === '1'; box.classList.remove('ok', 'ng'); box.classList.add(v === '1' ? 'ok' : 'ng'); return; }
  const ov = t.closest('[data-ov]');
  if (ov) { const q = QZ.round[+ov.dataset.ov], box = ov.closest('.qz-item'); const s = stat(q.it.id); if (!QZ.res[q.it.id] && s.w > 0) { s.w--; s.c++; save(); } QZ.res[q.it.id] = true; box.classList.remove('ng'); box.classList.add('ok'); ov.parentNode.hidden = true; const sc = $('#qzBody .qz-score b'); if (sc) sc.textContent = QZ.round.filter(x => QZ.res[x.it.id]).length; return; }
  const b = t.closest('[data-q]'); if (!b) return;
  const a = b.dataset.q;
  if (a === 'close') closeQuiz();
  if (a === 'setup') quizSetup();
  if (a === 'resetstat') { if (confirm('Clear the whole mistake log for this subject?')) { doc().parts.forEach(p => p.chapters.forEach(c => c.secs.forEach(s => s.items.forEach(it => { if (DB.stats) delete DB.stats[it.id]; })))); save(); updCount(); toast('Mistake log cleared'); } }
  if (a === 'start') startQuiz();
  if (a === 'grade') gradeList();
  if (a === 'finish') finishRound(true);
  if (a === 'revealall') QZ.round.forEach((q, i) => { const box = $(`#qzBody .qz-item[data-i="${i}"]`); box.querySelector('.qz-q').innerHTML = qText(q, 'reveal', true); const rb = box.querySelector('[data-rv]'); if (rb) rb.hidden = true; box.querySelectorAll('[data-mk]').forEach(x => x.hidden = false); });
  if (a === 'next') nextRound();
  if (a === 'retry') nextRound(QZ.lastWrong.slice());
  if (a === 'ccheck') cardCheck();
  if (a === 'cnext') cardNext();
  if (a === 'cover') { const q = QZ.round[QZ.idx]; const s = stat(q.it.id); if (s.w > 0) { s.w--; s.c++; } QZ.res[q.it.id] = true; save(); cardNext(); }
  if (a === 'cflip') cardFlip();
  if (a === 'cyes') cardMark(true);
  if (a === 'cno') cardMark(false);
});
$('#quiz').addEventListener('change', e => { if (e.target.classList.contains('qzKind')) { readSetup(); saveQS(); quizSetup(); return; } if (e.target.closest('.qz-ch') || e.target.id === 'qzWrong' || e.target.id === 'qzShuf') updCount(); });
$('#quiz').addEventListener('input', e => { if (e.target.id === 'qzN') readSetup(); });
document.addEventListener('keydown', e => {
  if (!$('#quiz').classList.contains('open') || !QZ) return;
  const card = $('#qzCard');
  if (e.key === 'Enter') {
    const inp = e.target.closest && e.target.closest('.qz-in');
    if (QS.view === 'list' && inp && !QZ.checked) { e.preventDefault(); const all = [...$('#qzBody').querySelectorAll('.qz-in')]; const nx = all[all.indexOf(inp) + 1]; nx ? nx.focus() : gradeList(); return; }
    if (card && QZ.round[QZ.idx] && effMode(QZ.round[QZ.idx]) === 'type') {
      e.preventDefault();
      const ins = [...card.querySelectorAll('.qz-in')], i = ins.indexOf(e.target);
      if (i >= 0 && i < ins.length - 1 && !ins[i + 1].readOnly) { ins[i + 1].focus(); return; }
      cardCheck(); return;
    }
  }
  if (card && QZ.round[QZ.idx] && effMode(QZ.round[QZ.idx]) !== 'type' && e.target.tagName !== 'INPUT') {
    if (e.key === ' ') { e.preventDefault(); cardFlip(); }
    if (card.classList.contains('shown')) { if (e.key === '1' || e.key === 'ArrowLeft') cardMark(false); if (e.key === '2' || e.key === 'ArrowRight') cardMark(true); }
  }
  if (e.key === 'Escape' && !$('#ov').classList.contains('open')) closeQuiz();
});


/* ===== 오답노트 ===== */
let WN = { sort: 'count' };
function wrongList() {
  const y = yr, out = [];
  for (const p of doc().parts) for (const c of p.chapters) for (const s of c.secs) for (const it of s.items) {
    const st = (DB.stats || {})[it.id]; if (!st || !st.w) continue;
    if (y !== 'all' && it.y !== y) continue;
    out.push({ it, ch: c.title, sec: s.title, st });
  }
  if (WN.sort === 'count') out.sort((a, b) => b.st.w - a.st.w || (b.st.t || 0) - (a.st.t || 0));
  if (WN.sort === 'recent') out.sort((a, b) => (b.st.t || 0) - (a.st.t || 0));
  return out;
}
const fmtDate = t => { if (!t) return ''; const d = new Date(t); return `${d.getMonth() + 1}/${d.getDate()}`; };
function openWrong() { $('#quiz').classList.add('open'); document.body.style.overflow = 'hidden'; showWrong(); }
function showWrong() {
  const L = wrongList();
  let h = `<div class="qz-top"><button class="btn" data-q="setup">← Quiz</button><div class="qz-prog">Mistake Log · ${esc(doc().name)}${yr === 'all' ? '' : ' · ' + esc(yrLabel(yr))}</div><button class="btn" data-q="close">Close</button></div>`;
  if (!L.length) { $('#qzBody').innerHTML = h + `<div class="qz-result"><div class="qz-s">No mistakes yet.<br>Questions you miss in quizzes collect here.</div></div>`; return; }
  h += `<div class="wn-bar"><div class="qz-seg" id="wnSort">${[['count', 'Most missed'], ['recent', 'Recent'], ['toc', 'Contents order']].map(([v, l]) => `<button class="${WN.sort === v ? 'on' : ''}" data-ws="${v}">${l}</button>`).join('')}</div><span class="qz-s">${L.length} items</span><span class="sp2"></span><button class="btn" data-q="wnprint">Print</button><button class="btn qz-go" data-q="wnquiz">Quiz these</button></div>`;
  let lastCh = null;
  h += `<div class="qz-list wn">` + L.map((r, i) => {
    let head = '';
    if (WN.sort === 'toc' && r.ch !== lastCh) { head = `<div class="wn-ch">${esc(r.ch)}</div>`; lastCh = r.ch; }
    return head + `<div class="qz-item ng" data-wid="${r.it.id}"><div class="qz-num">${i + 1}</div><div class="qz-main"><div class="qz-meta">${esc(r.ch)} · ${esc(r.sec)} <span class="qz-wc">✕${r.st.w}</span>${r.st.c ? ` <span class="wn-c">○${r.st.c}</span>` : ''} <span class="wn-d">${fmtDate(r.st.t)}</span><button class="wn-del" data-wdel="${r.it.id}" title="Clear this item's record">Clear</button></div><div class="qz-q">${qText({ it: r.it }, 'reveal', true)}</div></div></div>`;
  }).join('') + `</div>`;
  $('#qzBody').innerHTML = h;
}
$('#quiz').addEventListener('click', e => {
  const t = e.target;
  const ws = t.closest('[data-ws]'); if (ws) { WN.sort = ws.dataset.ws; showWrong(); return; }
  const wd = t.closest('[data-wdel]'); if (wd) { if (DB.stats) delete DB.stats[wd.dataset.wdel]; save(); showWrong(); return; }
  const b = t.closest('[data-q]'); if (!b) return;
  if (b.dataset.q === 'wrong') showWrong();
  if (b.dataset.q === 'wnquiz') {
    const L = wrongList(); if (!L.length) return;
    QZ = { pool: L.map(r => ({ it: r.it, ch: r.ch, sec: r.sec })), pos: 0, round: [], idx: 0, res: {}, given: {} };
    nextRound();
  }
  if (b.dataset.q === 'wnprint') {
    const L = wrongList();
    const w = document.createElement('div'); w.className = 'wn-print';
    w.innerHTML = `<h1>${esc(doc().name)} · Mistake Log${yr === 'all' ? '' : ' · ' + esc(yrLabel(yr))}</h1><table><colgroup><col style="width:7mm"><col><col style="width:calc(26mm*var(--r))"><col style="width:10mm"></colgroup>` +
      L.map((r, i) => { const a = ansOf(r.it); return `<tr><td class="n">${i + 1}</td><td class="q"><div class="wn-pm">${esc(r.ch)} · ${esc(r.sec)}</div>${qHtml(r.it)}</td><td class="a">${esc(a)}</td><td class="n">✕${r.st.w}</td></tr>`; }).join('') + `</table>`;
    document.body.appendChild(w); document.body.classList.add('printing-wn');
    const done = () => { document.body.classList.remove('printing-wn'); w.remove(); window.removeEventListener('afterprint', done); };
    window.addEventListener('afterprint', done); window.print(); setTimeout(done, 1500);
  }
});

$('#quizBtn').onclick = () => openQuiz();
render();
</script>
