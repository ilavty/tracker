<head>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@300;500;700&family=Nanum+Myeongjo:wght@400;700&family=Noto+Sans+KR:wght@300;500;700&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<style>
@font-face{font-family:KPB;font-weight:300;src:url(https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Batang-Light.woff2) format('woff2')}
@font-face{font-family:KPB;font-weight:500;src:url(https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Batang-Medium.woff2) format('woff2')}
@font-face{font-family:KPB;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Batang-Bold.woff2) format('woff2')}
@font-face{font-family:GmarketSans;font-weight:300;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff) format('woff')}
@font-face{font-family:GmarketSans;font-weight:500;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff) format('woff')}
@font-face{font-family:GmarketSans;font-weight:700;src:url(https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff) format('woff')}

@font-face{font-family:KP;font-weight:300;src:url(https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Light.woff2) format('woff2')}
@font-face{font-family:KP;font-weight:500;src:url(https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Medium.woff2) format('woff2')}
@font-face{font-family:KP;font-weight:700;src:url(https://cdn.jsdelivr.net/npm/font-kopubworld@1.0.3/fonts/KoPubWorld-Dotum-Bold.woff2) format('woff2')}
:root{--ink:#1d1d1f;--sub:#6e6e73;--line:#dfe3e8;--soft:#eef6fc;--acc:#3d93cf;--sky2:#d9ecf9;--brown:#8a5a36;--ans:#7a4c2c;--beige:#f7f2ec;--ansbg:#f8f1ea;--ans2:#9c6d49;--sky3:#eaf5fd;--tf:Paperlogy,'GmarketSans',KP,sans-serif;--bg:#f4f5f7;--paper:#fff}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{margin:0}
body{font-family:KP,'Noto Sans KR',sans-serif;font-weight:300;color:var(--ink);background:var(--bg);font-size:14px;line-height:1.6}
b{font-weight:700}
button{font-family:inherit;cursor:pointer}

/* top bar */
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:10px 16px}
.tabs{display:flex;gap:6px;overflow-x:auto;flex:1;min-width:0;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
/* 좁은 화면(아이패드): 과목·연도·북마크 줄을 아래로 내려서 안 잘리게 */
@media (max-width:1180px){.top{flex-wrap:wrap;row-gap:8px}.top .tools{margin-left:auto}.tabs{order:3;flex:1 1 100%}}
.tab{border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 14px;font-size:13px;font-weight:500;color:var(--sub);white-space:nowrap}
.tab.on{background:var(--ink);border-color:var(--ink);color:#fff}
.tab.add{border-style:dashed}
.tmk{display:flex;align-items:center;gap:1px;margin-left:6px;padding-left:8px;border-left:1px solid var(--line);flex:none}
.tmkb{border:0;background:none;border-radius:14px;padding:5px 7px;cursor:pointer;display:flex;align-items:center}
.tmkb .mki{width:15px;height:15px;fill:none;stroke:#a8a8ad;stroke-width:1.6}
.tmkb.on{background:#ececee}
.tmkb.on .mki{stroke:none}.tmkb.on .mk-b{fill:var(--acc)}.tmkb.on .mk-s{fill:var(--brown)}.tmkb.on .mk-c{fill:none;stroke:#e8862a}
.mkm{display:flex;flex-direction:column;align-items:center;gap:2px;margin-top:3px}
.mkm .mki{width:11px;height:11px}
.mki.mk-b{fill:var(--acc)}.mki.mk-s{fill:var(--brown)}.mki.mk-c{fill:none;stroke:#e8862a}
body:not(.edit) .paper tr.it td.n{cursor:pointer}
body:not(.edit) .paper tr.it td.n:hover{color:var(--acc)}
.tmkb:not(.on) .mki,.mkpop button:not(.on) .mki{fill:none!important;stroke:#a8a8ad!important;stroke-width:1.6}
.shmk{border:0;background:none;padding:2px 4px;margin-left:2px;display:inline-flex;gap:3px;align-items:center;cursor:pointer;border-radius:8px}
.shmk .mki{width:14px;height:14px}
.shmk .mki.ghost{fill:none!important;stroke:#c8c8cc;stroke-width:1.6;opacity:.7}
.shmk:hover .mki.ghost{stroke:#888;opacity:1}
@media print{.shmk{display:none!important}}
.mkpop{position:absolute;z-index:70;display:flex;gap:2px;background:#fff;border:1px solid var(--line);border-radius:16px;box-shadow:0 4px 14px rgba(0,0,0,.12);padding:3px}
.mkpop[hidden]{display:none}
.mkpop button{border:0;background:none;border-radius:12px;padding:5px 6px;cursor:pointer;display:flex}
.mkpop .mki{width:17px;height:17px;fill:none;stroke:#b0b0b5;stroke-width:1.6}
.mkpop button.on .mki{stroke:none}.mkpop button.on .mk-b{fill:var(--acc)}.mkpop button.on .mk-s{fill:var(--brown)}.mkpop button.on .mk-c{fill:none;stroke:#e8862a}
.mkpop button:hover{background:#f3f3f5}
@media print{.mkm,.mkpop{display:none!important}}
.tyrs{display:flex;align-items:center;gap:2px;margin-left:8px;padding-left:10px;border-left:1px solid var(--line);flex:none}
.tyr{font-family:var(--tf);border:0;background:none;border-radius:14px;padding:5px 11px;font-size:12.5px;color:#9a9a9f;white-space:nowrap;cursor:pointer}
.tyr:hover{color:#55555a}
.tyr.on{background:#ececee;color:#3a3a3c}
.tyr.add{color:#b0b0b5}
.dochead.srt{border-bottom:0;padding-bottom:2px;align-items:center}.lastfd{font-family:var(--tf);font-size:12px;color:var(--sub)}.lastfd b{color:var(--ink);font-weight:600}
.fdate{font-family:var(--tf);font-size:11px;font-weight:500;color:var(--sub);background:#f2f2f4;border-radius:10px;padding:1px 8px;margin-left:8px;white-space:nowrap}.fdate.ed{cursor:pointer}.fdate.none{opacity:.6}.shpre{font-family:var(--tf);font-size:11px;color:var(--sub);margin-right:8px}
.skind{font-family:var(--tf);font-size:11px;font-weight:600;border-radius:10px;padding:1px 7px;margin-left:2px;white-space:nowrap}
.skind.k-issue{background:#f6ebe1;color:var(--brown)}
.skind.k-prog{background:var(--sky3, #eaf5fd);color:var(--acc)}
.skind.ed{cursor:pointer}.skind.none{color:#b0b0b5;border:1px dashed #d6d6da;background:none}
@media print{.skind{background:none!important;border:1px solid #999;color:#000!important}}
.fdgrp{font-family:var(--tf);font-size:13px;font-weight:700;margin:26px 0 6px;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
@media print{.dochead.srt{display:none}}
.dochead.ed{justify-content:flex-end;align-items:center;border-bottom:0;padding-bottom:4px}
.olsw{display:flex;background:#f2f2f4;border-radius:16px;padding:2px;margin-right:auto}
.olsw button{font-family:var(--tf);font-size:12px;border:0;background:none;border-radius:14px;padding:5px 12px;color:var(--sub);cursor:pointer}
.olsw button.on{background:#fff;color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.1)}
.olhint{font-size:11.5px;color:#a0a0a5;margin-right:10px}
.ch.olc{margin-top:10px}.ch.olo{margin-top:22px}
.ch.olc .chh{margin-bottom:4px;border-bottom-width:1px}
.ch.olc .cht{font-size:16px}
.ch.olc .chh,.ch.olo .chh{cursor:pointer}
.ch.olc .chh::before,.ch.olo .chh::before{content:'▸';color:#b0b0b5;font-size:11px;margin-right:4px;align-self:center}
.ch.olo .chh::before{content:'▾'}
.sec.ols{margin:0 0 2px 18px}
.sec.ols .sh{padding:3px 8px;font-size:13px;border-left-width:2px;margin:0}
.olcnt{color:#a8a8ad;font-size:11px;margin-left:6px}
.olpart{min-height:14px;padding-bottom:4px}
.olsecs{min-height:6px}
body.edit .olpart .chh,body.edit .olsecs .sh{cursor:grab;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.drag-ghost{opacity:.35}
.drag-chosen .chh,.drag-chosen>.sh{background:var(--sky3);border-radius:6px}
.tools{display:flex;gap:6px;flex-shrink:0;align-items:center}
.top .btn{height:33px;display:inline-flex;align-items:center;justify-content:center;box-sizing:border-box}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--acc)}
.btn.on{background:var(--brown);border-color:var(--brown);color:#fff}
.btn.pri{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.danger{color:#b4532a}
.menu{position:relative}
.menu-pop{position:absolute;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.1);padding:6px;display:none;min-width:170px}
.menu-pop.open{display:block}
.menu-pop button{display:block;width:100%;text-align:left;border:0;background:none;padding:8px 10px;border-radius:6px;font-size:13px;color:var(--ink)}
.menu-pop button:hover{background:var(--soft)}
.saved{font-size:11.5px;color:var(--sub);min-width:46px;text-align:right}
#tocBtn{display:none}

/* layout */
.wrap{display:flex;gap:22px;max-width:1240px;margin:0 auto;padding:20px 16px 80px}
.side{width:250px;flex-shrink:0;position:sticky;top:calc(var(--toph, 54px) + 12px);max-height:calc(100vh - var(--toph, 54px) - 24px);overflow-y:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 12px}
.side h3{margin:0 0 6px;font-size:15px;font-weight:700}
.side .tot{font-size:11.5px;color:var(--sub);margin-bottom:8px}
.tp{font-weight:700;font-size:11.5px;color:var(--brown);margin:12px 0 4px;letter-spacing:.4px}
.tc{display:flex;gap:8px;padding:5px 6px;border-radius:6px;font-size:13px;cursor:pointer;align-items:baseline}
.tc:hover{background:var(--soft)}
.tc.cur{background:var(--soft);font-weight:500}
.tcn{color:var(--sub);font-weight:500;width:20px;flex-shrink:0;font-size:12px}
.tcc{margin-left:auto;color:var(--sub);font-size:11px}
.main{flex:1;min-width:0}
.paper{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:28px 30px}
.dochead{display:flex;align-items:baseline;gap:10px;border-bottom:1.5px solid var(--ink);padding-bottom:10px;margin-bottom:6px}
.dochead h1{margin:0;font-size:24px;font-weight:700;letter-spacing:-.4px}
.dochead span{color:var(--sub);font-size:12.5px}
.yrs{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px;gap:2px;margin-left:auto}
.yr{white-space:nowrap;border:0;background:none;border-radius:7px;padding:5px 13px;font-size:13px;font-weight:500;color:var(--sub)}
.yr.on{background:var(--ink);color:#fff}
.yr.add{color:var(--acc)}
.side-yrs{display:flex;margin:0 0 12px}
.side-yrs .yr{flex:1;padding:5px 6px;white-space:nowrap}
.ybadge{display:inline-block;font-size:10.5px;font-weight:500;color:var(--brown);border:1px solid #e3cdb9;border-radius:10px;padding:0 6px;margin-right:4px;vertical-align:1px}
.yrsel{display:flex;gap:6px;flex-wrap:wrap}
.yrsel label{border:1px solid var(--line);border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer}
.yrsel input{display:none}
.yrsel label:has(input:checked){background:var(--ink);color:#fff;border-color:var(--ink)}
.cover .yrtag{color:var(--brown)}

/* content (shared with print) */
.partbar{display:none}
.edit .partbar{display:flex;align-items:center;gap:8px;margin:26px 0 4px;padding:8px 12px;border:1px dashed var(--acc);border-radius:8px;background:#f6fafd;font-size:13px}
.partbar b{color:var(--brown)}
.ch{margin-top:34px;scroll-margin-top:calc(var(--toph, 54px) + 14px)}
.fmon{font-family:var(--tf);font-size:17px;font-weight:700;margin:38px 0 2px;scroll-margin-top:calc(var(--toph, 54px) + 14px)}
.fmon:first-of-type{margin-top:16px}
.monchips{display:flex;gap:4px;margin-left:12px;overflow-x:auto;scrollbar-width:none;min-width:0}
.monchips::-webkit-scrollbar{display:none}
.monchips button{font-family:var(--tf);font-size:12px;border:1px solid var(--line);background:#fff;border-radius:14px;padding:3px 10px;color:var(--sub);white-space:nowrap;cursor:pointer}
.monchips button:hover{color:var(--ink);border-color:#bbb}
@media print{.monchips{display:none}}
.chh{display:flex;align-items:baseline;gap:9px;border-bottom:1.5px solid var(--ink);padding-bottom:5px;margin-bottom:10px}
.chp{font-size:10.5px;font-weight:700;color:var(--acc);border:1px solid var(--acc);border-radius:20px;padding:1px 8px;letter-spacing:.4px;align-self:center;white-space:nowrap}
.chn{font-weight:500;color:var(--sub);font-size:15px}
.cht{font-weight:700;font-size:20px;letter-spacing:-.3px}
.sec{margin-bottom:16px}
.sh{display:flex;align-items:center;gap:8px;font-weight:700;font-size:14.5px;padding:4px 0 4px 9px;border-left:3px solid var(--acc);margin:6px 0 7px}
.note{background:var(--beige);color:#4a4a4f;font-size:12.5px;line-height:1.6;padding:8px 11px;border-radius:5px;margin-bottom:7px;white-space:pre-wrap}
table{width:100%;min-width:100%;border-collapse:collapse;table-layout:fixed;border-top:1px solid #9aa1a9}
td{border-bottom:1px solid var(--line);padding:6px 7px;vertical-align:top}
td.n{color:var(--sub);font-weight:500;text-align:center;padding-left:0;padding-right:0;font-size:12px;padding-top:7px}
td.q{text-align:justify;word-break:keep-all;overflow-wrap:anywhere}
td.a{background:var(--soft);color:var(--ans);font-weight:500;font-size:13px;word-break:keep-all;overflow-wrap:anywhere;border-left:1px solid var(--line)}
td.ctl{display:none}
.bl{color:var(--acc);font-weight:500}
.sp{display:inline-block;width:2.6em}
.tag{color:var(--acc);font-weight:500}
col.cn{width:30px} col.ca{width:110px} col.cc{width:0}


/* 타이틀·UI = 페이퍼로지 */
.tab,.btn,.yr,.dochead h1,.cht,.chn,.chp,.sh,.side h3,.tp,.mod h2,.partbar,.imp-k,.fld label,.cover .ct,.saved,.ib,.addrow,.imp-bar,.imp-tip,.ybadge,.yrsel label,.menu-pop button{font-family:var(--tf)}
.dochead h1{font-weight:800}
.cht{font-weight:700}
.sh{font-weight:600}
.tab{font-weight:500}
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab:not(.on):hover{border-color:var(--acc);color:var(--acc)}
.btn{font-weight:500}
.btn.pri{background:var(--acc);border-color:var(--acc);color:#fff}
.btn.pri:hover{background:#2f80bb}
.btn.on{background:var(--brown);border-color:var(--brown);color:#fff}
.yrs{background:var(--sky3)}
.yr{color:#5a7f99}
.yr.on{background:var(--brown);color:#fff}
.yr:not(.on):hover{color:var(--brown)}
.side .tc.cur{background:var(--sky3);color:var(--ink)}
.side .tc.cur .tcn{color:var(--acc)}
.tc:hover{background:var(--sky3)}
#tocBtn{border-color:var(--acc);color:var(--acc)}
.yrsel label:has(input:checked){background:var(--brown);border-color:var(--brown)}
td.a{background:var(--ansbg);color:var(--ans2)}
.dochead{border-bottom-color:var(--ink)}


/* === 신문 톤 (흑백) + 네비게이션만 하늘색 === */
:root{--bg:#fff;--soft:#f3f3f3;--beige:#f5f5f5;--ansbg:#f3f3f3;--ans2:#1d1d1f;--ans:#1d1d1f;--line:#dcdcdc}
body{background:#fff}
.paper{border:0;border-radius:0;padding:8px 6px}
.side{border-color:#e6e6e6}
.top{background:rgba(255,255,255,.95)}
.chp{color:var(--ink);border-color:var(--ink);font-weight:600}
.sh{border-left-color:var(--ink);font-weight:500}
.bl{color:#555}
.tag{color:var(--ink)}
td.a{background:var(--ansbg);color:var(--ink);font-weight:500;border-left-color:var(--line)}
table{border-top-color:var(--ink)}
.note{background:#f5f5f5;color:#444}
.tp{color:#555;font-weight:600}
.partbar b{color:var(--ink)}
.edit .partbar{border-color:#999;background:#fafafa}
.btn.pri{background:var(--ink);border-color:var(--ink)}
.btn.pri:hover{background:#000}
.btn.on{background:var(--ink);border-color:var(--ink)}
.ybadge{color:#555;border-color:#ccc}
.imp-k{color:#555}
.yrsel label:has(input:checked){background:var(--ink);border-color:var(--ink)}
.bed mark.bk{background:#ececec;color:var(--ink);border-bottom-color:var(--ink)}
.bed mark.bk:hover{background:#f6dcdc;border-bottom-color:#b33}
.ib:hover{border-color:var(--ink);color:var(--ink)}
.edit .addrow:hover{border-color:var(--ink);color:var(--ink)}
/* 네비게이션: 하늘색 유지 */
.tab.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tab:not(.on):hover{border-color:var(--acc);color:var(--acc)}
.yrs{background:var(--sky3)}
.yr{color:#5a7f99}
.yr.on{background:var(--acc);color:#fff}
.yr:not(.on):hover{color:var(--acc)}
.side .tc.cur{background:var(--sky3)}
.side .tc.cur .tcn{color:var(--acc)}
.tc:hover{background:var(--sky3)}
.dochead h1{color:var(--acc)}
#impBtn{background:var(--acc);border-color:var(--acc);color:#fff}
#impBtn:hover{background:#2f80bb}
/* 두께 한 단계씩 낮춤 */
.dochead h1{font-weight:700}
.cht{font-weight:600}
.side h3,.mod h2{font-weight:600}
.tab,.btn,.yr{font-weight:400}
.cover .ct{font-weight:700!important}


/* 본문 서체·크기 설정 */
:root{--bf:KP,'Noto Sans KR',sans-serif;--r:1;--lh:1.6;--ls:0em;--bw:1.2}
.paper td.q,.paper td.a,.paper .note{letter-spacing:var(--ls)}
.paper .sp{width:calc(2.6em*var(--bw))}
.paper td.q,.paper td.a,.paper .note,.paper td.n{font-family:var(--bf)}
.paper td.q{font-size:calc(14px*var(--r));line-height:var(--lh)}
.paper td.a{font-size:calc(13px*var(--r));line-height:var(--lh)}
.paper .note{font-size:calc(12.5px*var(--r))}
.paper td.n{font-size:calc(12px*var(--r))}
col.ca{width:calc(110px*var(--r))!important}
@media screen and (max-width:860px){col.ca{width:calc(78px*var(--r))!important}}
@media print{col.ca{width:calc(26mm*var(--r))!important}}
.fs-pop{min-width:270px;padding:14px}
.fs-row{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.fs-row .lbl{font-family:var(--tf);font-size:12px;color:var(--sub);width:42px}
.fs-row input[type=range]{flex:1;accent-color:var(--acc)}
.fs-val{font-family:var(--tf);font-size:13px;width:38px;text-align:right}
.fs-fonts{display:grid;gap:4px}
.fs-fonts button{display:flex!important;justify-content:space-between;align-items:baseline;border:1px solid var(--line)!important;border-radius:8px!important;padding:8px 10px!important;font-size:14px!important}
.fs-fonts button.on{border-color:var(--acc)!important;background:var(--sky3)!important}
.fs-fonts small{font-size:11px;color:var(--sub);font-family:var(--tf)}
.fs-reset{margin-top:10px;width:100%}

/* 퀴즈 */
.quiz{position:fixed;inset:0;background:#fff;z-index:45;display:none;overflow-y:auto}
.quiz.open{display:block}
#qzBody{max-width:860px;margin:0 auto;padding:22px 18px 60px}
.qz-setup h2,.qz-score,.qz-l,.qz-seg button,.qz-prog,.qz-pt,.qz-meta{font-family:var(--tf)}
.qz-setup h2{font-size:22px;font-weight:700;color:var(--acc);margin:4px 0 20px}
.qz-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.qz-l{width:58px;font-size:13px;color:var(--sub);flex-shrink:0}
.qz-s{font-size:12.5px;color:var(--sub)}
.qz-seg{display:inline-flex;background:var(--sky3);border-radius:9px;padding:3px;gap:2px;flex-wrap:wrap}
.qz-seg button{border:0;background:none;border-radius:7px;padding:6px 14px;font-size:13.5px;color:#5a7f99;cursor:pointer}
.qz-seg button.on{background:var(--acc);color:#fff}
#qzN{width:70px;font-family:inherit;font-size:14px;border:1px solid var(--line);border-radius:8px;padding:6px 9px}
.qz-ck{font-size:13.5px;display:inline-flex;gap:5px;align-items:center;margin-right:10px}
.qz-ck[hidden],.qz-chs[hidden]{display:none}
.qz-chs{border:1px solid var(--line);border-radius:10px;padding:12px;margin:-4px 0 14px 68px}
.qz-chtools{display:flex;gap:6px;margin-bottom:8px}
.qz-chgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:2px 12px}
.qz-pt{grid-column:1/-1;font-size:11.5px;color:#555;font-weight:600;margin:8px 0 2px}
.qz-ch{display:flex;align-items:center;gap:6px;font-size:13.5px;padding:4px 2px;cursor:pointer}
.qz-ch small{margin-left:auto;color:var(--sub);font-size:11px}
.qz-ch.dim{color:#bbb}
.qz-count{font-size:13.5px;margin:6px 0 4px 68px}
.qz-count b{color:var(--acc)}
.qz-foot{display:flex;gap:8px;align-items:center;margin-top:20px;padding-top:14px;border-top:1px solid var(--line);position:sticky;bottom:0;background:#fff;padding-bottom:12px}
.qz-foot.res{display:block;position:static}
.qz-go{background:var(--acc)!important;border-color:var(--acc)!important;color:#fff!important;padding:8px 18px!important}
.qz-top{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.qz-prog{flex:1;text-align:center;font-size:14px;color:var(--sub)}
.qz-bar{height:4px;background:var(--sky3);border-radius:4px;margin:6px auto 0;max-width:300px;overflow:hidden}
.qz-bar i{display:block;height:100%;background:var(--acc)}
.qz-item{display:flex;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.qz-item.ok .qz-num{background:var(--acc);color:#fff}
.qz-item.ng .qz-num{background:var(--brown);color:#fff}
.qz-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:500;margin-top:2px}
.qz-main{flex:1;min-width:0}
.qz-meta{font-size:11.5px;color:var(--sub);margin-bottom:4px}
.qz-wc{color:var(--brown)}
.qz-q{font-family:var(--bf);font-size:calc(15px*var(--r));line-height:2;letter-spacing:var(--ls);word-break:keep-all;overflow-wrap:anywhere}
.qz-q.big{font-size:calc(18px*var(--r))}
.qz-in{font-family:inherit;font-size:inherit;border:0;border-bottom:2px solid var(--acc);background:var(--sky3);border-radius:4px 4px 0 0;padding:1px 6px;margin:0 2px;color:var(--ink);outline:none;max-width:100%}
.qz-in:focus{background:#d6ebf9}
.qz-in.ok{border-bottom-color:var(--acc);background:#e3f1fb;color:#1f6ea5;font-weight:500}
.qz-in.ng{border-bottom-color:var(--brown);background:#f6ece3;color:var(--brown);text-decoration:line-through}
.qz-fix{font-weight:500;color:var(--acc);margin:0 4px 0 2px}
.qz-fix:before{content:'→ '}
.qz-ans{font-weight:500;color:var(--acc);background:var(--sky3);border-radius:4px;padding:1px 5px}
.qz-hid{display:inline-block;border-bottom:2px solid #999;margin:0 3px;background:#f3f3f3;border-radius:3px 3px 0 0}
.qz-oxl{color:var(--sub)}
.qz-btns{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.qz-btns[hidden]{display:none}
.qz-o,.qz-x{border:1px solid var(--line);background:#fff;border-radius:8px;padding:5px 12px;font-family:var(--tf);font-size:13px;cursor:pointer}
.qz-o{color:var(--acc);border-color:#b9dcf3}
.qz-x{color:var(--brown);border-color:#e3cdb9}
.qz-o[hidden],.qz-x[hidden],.btn[hidden]{display:none}
.qz-o.big,.qz-x.big{padding:14px 28px;font-size:16px;border-radius:12px;flex:1;max-width:220px}
.qz-card{border:1px solid var(--line);border-radius:18px;padding:34px 30px 22px;min-height:280px;display:flex;flex-direction:column;justify-content:center;box-shadow:0 10px 30px rgba(0,0,0,.06)}
.qz-card.flip{cursor:pointer}
.qz-card.shown{cursor:default}
.qz-card.ok{border-color:var(--acc);box-shadow:0 0 0 3px var(--sky3)}
.qz-card.ng{border-color:var(--brown);box-shadow:0 0 0 3px #f6ece3}
.qz-hint{font-family:var(--tf);font-size:12px;color:var(--sub);margin-top:18px;text-align:center}
.qz-cbtns{display:flex;justify-content:center;gap:12px;margin-top:18px}
.qz-result{text-align:center;padding:16px 0}
.qz-score{font-size:30px;color:var(--sub)}
.qz-score b{font-size:44px;color:var(--acc);font-weight:700}
.qz-rbtns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap;align-items:center}
.qz-list.review{margin-top:10px;border-top:2px solid var(--ink)}
td.n.wr{color:var(--brown);font-weight:700}
@media screen and (max-width:860px){.qz-chs,.qz-count{margin-left:0}.qz-card{padding:24px 18px 18px}}
@media print{.quiz{display:none!important}td.n.wr{color:inherit;font-weight:500}}

.wn-bar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.wn-bar .sp2{flex:1}
.wn-ch{font-family:var(--tf);font-weight:600;font-size:15px;margin:18px 0 0;padding-bottom:4px;border-bottom:1.5px solid var(--ink)}
.wn-c{color:var(--acc);font-size:11.5px}
.wn-d{color:#aaa;font-size:11px;margin-left:4px}
.wn-del{border:0;background:none;color:#aaa;font-size:11px;cursor:pointer;margin-left:8px;font-family:var(--tf)}
.wn-del:hover{color:var(--brown);text-decoration:underline}
.wn-print{display:none}
@media print{
  body.printing-wn > *:not(.wn-print){display:none!important}
  body.printing-wn .wn-print{display:block!important}
  .wn-print h1{font-family:var(--tf);font-size:15pt;font-weight:700;border-bottom:1.5px solid #000;padding-bottom:5px;margin:0 0 10px}
  .wn-print table{width:100%;border-collapse:collapse;table-layout:fixed;border-top:1px solid #000}
  .wn-print td{border-bottom:1px solid #dcdcdc;padding:5px 6px;vertical-align:top;font-family:var(--bf)}
  .wn-print td.q{font-size:calc(9pt*var(--r));word-break:keep-all;letter-spacing:var(--ls)}
  .wn-print td.a{font-size:calc(8.2pt*var(--r));background:#f3f3f3;font-weight:500}
  .wn-print td.n{font-size:8pt;color:#666;text-align:center}
  .wn-print .wn-pm{font-size:7pt;color:#888}
  .wn-print tr{break-inside:avoid}
  .wn-print .sp{display:inline-block;width:calc(2.6em*var(--bw))}
}

.fillsw{margin-left:10px}
.dochead .yrs:not(.fillsw){margin-left:auto}
.paper .fill{color:var(--acc);font-weight:500}
.paper .fill.ox{border-bottom:0}
@media print{.paper .fill{color:#000;font-weight:700}.paper .fill.ox{border-bottom:0}}
.qfront{font-family:var(--tf);font-size:12px;color:var(--acc);margin-bottom:2px}
@media print{.qfront{display:none}}
.qz-front{font-family:var(--tf);font-weight:600;font-size:1.05em;margin-bottom:10px}
.qz-back{border-top:1px dashed var(--line);padding-top:10px}
.qz-back.hid{color:#bbb;font-family:var(--tf);font-size:13px}
.qz-read{font-family:var(--tf);font-size:11px;color:var(--brown);border:1px solid #e3cdb9;border-radius:10px;padding:0 6px;vertical-align:2px}
.qz-q .fill{color:var(--acc);font-weight:500}
body.punch .pbed{cursor:text}
body.punch .pbed mark.bk{background:var(--sky2);color:var(--ans);font-weight:500;border-radius:3px;padding:0 2px;border-bottom:2px solid var(--acc);cursor:pointer}
body.punch .pbed mark.bk:hover{background:#f3e3d6;border-bottom-color:var(--brown);text-decoration:line-through}
body.punch tr.it:hover{background:#fafcfe}
.pox{color:var(--brown);font-size:.92em}
.ftools{zoom:.9}
body.hideans .paper td.a{cursor:pointer;color:transparent!important;background:#e9e9eb!important;user-select:none;-webkit-user-select:none}
body.hideans .paper td.a.rv{color:inherit!important;background:var(--ansbg)!important}
@media print{body.hideans .paper td.a{color:inherit!important;background:none!important}}
.ftools{position:fixed;right:18px;bottom:96px;z-index:60;display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.ftools[hidden]{display:none}
.ftools.dk{bottom:40px}
.ftools.dk{gap:0}
.ftools.dk .ftmore{display:none;flex-direction:column;align-items:flex-end;gap:8px;padding-bottom:8px}
.ftools.dk:has(.fab:hover) .ftmore,.ftools.dk .ftmore:hover,.ftools.dk.open .ftmore{display:flex}
.ftools.dk .ftrow{display:flex;flex-direction:column;gap:8px;align-items:center}
.olsw.srtdir{margin-left:8px}
.ftools.dk .ftop,.ftools.dk .fab{width:42px;height:42px;min-width:0;padding:0;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:600}
.ftools.dk .fab{font-size:14px;letter-spacing:1px}
.ftools.dk .fab.act{border-color:var(--acc);color:var(--acc)}
.ftools .ftop{font-size:16px}
.tl{font-family:var(--tf);font-size:13px;letter-spacing:-.01em;padding:9px 10px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--ink);cursor:pointer;white-space:nowrap;box-shadow:0 3px 10px rgba(0,0,0,.10);width:128px;box-sizing:border-box}
.tl:hover{border-color:var(--acc);color:var(--acc)}
.tl.on{background:var(--acc);border-color:var(--acc);color:#fff}
.tlseg{display:flex;background:#fff;border:1px solid var(--line);border-radius:20px;padding:3px;box-shadow:0 3px 10px rgba(0,0,0,.10);width:128px;box-sizing:border-box}
.tlseg button{flex:1;font-family:var(--tf);font-size:12.5px;letter-spacing:-.01em;white-space:nowrap;border:0;background:transparent;color:var(--sub);padding:6px 10px;border-radius:16px;cursor:pointer}
.tlseg button.on{background:var(--acc);color:#fff}
.ftools.sm{bottom:calc(28px + env(safe-area-inset-bottom,0px));right:14px;gap:7px}
.ftools.sm .tl{width:44px;height:44px;min-width:0;padding:0;border-radius:50%;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center}
.ftools.sm .tl.fab{font-size:15px;letter-spacing:1px}
.ftools.sm .tl.fab.on{background:#fff;color:var(--ink);border-color:var(--line)}
.ftools.sm .tlseg{width:auto;min-width:40px;padding:7px 10px;font-size:12px}
.ftools.sm .tlseg{padding:2px}
.ftools.sm .tlseg button{padding:5px 9px}
.tl.go{width:auto;background:var(--ink);border-color:var(--ink);color:#fff}
.fill-ov{position:fixed;inset:0;z-index:200;background:rgba(20,20,25,.35);display:flex;align-items:flex-start;justify-content:center;padding:12vh 14px 20px}
.fill-ov[hidden]{display:none}
.fill-md{background:#fff;border-radius:16px;max-width:680px;width:100%;padding:18px 20px;box-shadow:0 20px 50px rgba(0,0,0,.2)}
.fill-top{display:flex;justify-content:space-between;gap:10px;font-size:12px;color:var(--sub);margin-bottom:10px}
.fill-n{color:var(--acc);font-weight:600;white-space:nowrap}
.fill-t{font-size:16px;line-height:2;word-break:keep-all}
.fill-in{font:inherit;font-size:15px;border:1.5px solid var(--acc);background:var(--soft);border-radius:8px;padding:2px 8px;width:11em;max-width:60vw}
.fill-in:focus{outline:2px solid var(--sky2)}
.fill-q{color:var(--sub)}
.fill-a{color:var(--ans);font-weight:600}
.fill-acts{display:flex;gap:6px;align-items:center;margin-top:14px;flex-wrap:wrap}
.fill-hint{flex:1;font-size:11.5px;color:var(--sub)}
.fill-done{font-size:16px;padding:14px 0}
@media print{.ftools{display:none!important}}
body:has(#quiz.open) .ftools,body:has(#ov.open) .ftools,body:has(#quiz.open) .hlbar,body:has(#ov.open) .hlbar{display:none!important}
mark.hl{color:inherit;border-radius:2px;padding:0 1px;-webkit-print-color-adjust:exact;print-color-adjust:exact;-webkit-box-decoration-break:clone;box-decoration-break:clone}
mark.hl.hy{background:#fff1a1}mark.hl.hb{background:#cfe7f9}mark.hl.hp{background:#fbd5de}mark.hl.ho{background:#ecd9c6}
mark.hl .bl,mark.hl .fill{background:transparent}
u.ul{text-decoration:underline;text-decoration-color:var(--ink);text-decoration-thickness:1.5px;text-underline-offset:3px;text-decoration-skip-ink:none}
body.hlon.hlerase .hbed u.ul{cursor:pointer}
body.hlon .hbed{cursor:text}
body.hlon.hlerase .hbed mark.hl{cursor:pointer}
body.hlon.hlerase .hbed mark.hl:hover{text-decoration:line-through;text-decoration-color:#b33}
body.hlon .hbed::selection,body.hlon .hbed *::selection{background:rgba(255,226,80,.55)}
body.hlon.hlerase .hbed::selection,body.hlon.hlerase .hbed *::selection{background:rgba(200,200,200,.6)}
.hlbar{display:none;position:fixed;left:50%;transform:translateX(-50%) scale(.9);transform-origin:center bottom;bottom:22px;z-index:61;background:#fff;border:1px solid var(--line);border-radius:26px;box-shadow:0 4px 16px rgba(0,0,0,.14);padding:7px 10px;align-items:center;gap:7px;font-family:var(--tf)}
body.hlon .hlbar{display:flex}
.hlbar.moved{transform:scale(.9);transform-origin:top left}
.hlgrip{width:10px;height:22px;margin-right:2px;cursor:grab;touch-action:none;background:radial-gradient(circle,#b8b8bd 1.2px,transparent 1.4px) 0 0/5px 5px;opacity:.9}
.hlgrip:active{cursor:grabbing}
.hlbar button{border:0;cursor:pointer;font-family:var(--tf)}
.hlc{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.hlc.hu{background:#fff;position:relative}.hlc.hu::after{content:'U';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:var(--tf);font-size:12.5px;color:var(--ink);text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:2px}
.hlc.hy{background:#fff1a1}.hlc.hb{background:#cfe7f9}.hlc.hp{background:#fbd5de}.hlc.ho{background:#ecd9c6}
.hlc.on{box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.hle{font-size:13px;padding:6px 11px;border-radius:15px;background:#f2f2f2;color:var(--ink)}

.hlgo{font-size:13px;padding:6px 12px;border-radius:15px;background:var(--acc);color:#fff}

/* edit mode */
.ec{display:none;gap:3px;margin-left:auto}
.edit .ec{display:inline-flex}
.ib{border:1px solid var(--line);background:#fff;border-radius:6px;width:26px;height:24px;font-size:12px;line-height:1;color:var(--sub);padding:0}

.ov.open{display:flex}
.mod{background:#fff;border-radius:14px;width:100%;max-width:640px;max-height:90vh;overflow-y:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,.22)}

@media screen and (max-width:860px){
  .side{position:fixed;left:0;top:0;bottom:0;max-height:none;width:270px;border-radius:0;z-index:40;transform:translateX(-105%);transition:transform .2s;padding-top:18px}
  .side.open{transform:none;box-shadow:0 0 40px rgba(0,0,0,.2)}
  #tocBtn{display:inline-block}
  .paper{padding:18px 14px}
  .wrap{padding:12px 10px 80px}
  col.ca{width:78px}
  .cht{font-size:18px}
  .tools .hide-m{display:none}
  td.q{text-align:left}
  .tab{padding:5px 11px}
}

/* print = PDF 디자인 */
@page{size:A4;margin:14mm 13mm 15mm}
@media print{
  html,body{width:184mm!important;min-width:184mm!important;max-width:184mm!important}
  .main,.paper,table{width:100%!important;max-width:none!important}
  td.q{text-align:justify!important}
  body{background:#fff;font-size:9pt;line-height:1.55;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .top,.side,.ec,.addrow,.partbar,.dochead,.toast,.ov,td.ctl{display:none!important}
  .wrap{display:block;padding:0;max-width:none}
  .paper{border:0;padding:0;border-radius:0}
  col.cc{width:0!important}
  col.cn{width:7mm} col.ca{width:26mm}
  .print-only{display:block}
  .cover{page-break-after:always;padding-top:28mm}
  .cover .ct{font-weight:700;font-size:24pt;letter-spacing:-.5px}
  .cover .cs{color:var(--sub);font-size:10pt;margin-top:4px;padding-bottom:16px;border-bottom:1.5px solid var(--ink)}
  .cover .tp{font-size:10pt;margin:14px 0 6px}
  .cover .tcs{display:grid;grid-template-columns:1fr 1fr;column-gap:24px}
  .cover .tc{padding:5px 0;border-bottom:1px solid var(--line);border-radius:0;font-size:10pt}
  .ch{page-break-before:always;margin-top:0}
  .chh{break-after:avoid}
  .chp{font-size:7.5pt} .chn{font-size:11pt} .cht{font-size:15pt}
  .sh{font-size:10.3pt;break-after:avoid}
  .note{font-size:8pt;break-inside:avoid}
  tr{break-inside:avoid}
  td{padding:5px 6px}
  td.n{font-size:8pt;padding-top:6px}
  td.a{font-size:8.2pt;padding:5px}
  .paper td.q{font-size:calc(9pt*var(--r))!important}
  .paper td.a{font-size:calc(8.2pt*var(--r))!important}
  .paper .note{font-size:calc(8pt*var(--r))!important}
  .paper td.n{font-size:calc(8pt*var(--r))!important}
}

<script>
const ORIG = {"v":1,"docs":[{"id":"law","name":"국제법","parts":[{"id":"i1","title":"INTL LAW Ⅰ","chapters":[{"id":"i2","title":"서론","secs":[{"id":"i3","title":"국제법 사상가","note":"","items":[{"id":"i4","t":"[[옐리네크(Georg Jellinek)]](1851–1911, 독일)는 국제법의 구속력이 국가의 상위 권위에서 발생하는 것이 아니라 국가가 스스로 동의하여 자기 행동을 제한하는 자기구속(self-limitation)에서 발생한다고 보았다."},{"id":"i5","t":"제섭(Philip C. Jessup, 1897–1986, 미국)은 국제공법과 국제사법을 포괄하는 규범 체계를 [[초국경법(transnational law)]]이라고 하였다."},{"id":"i6","t":"[[빈켈스훅(Cornelius van Bynkershoek)]](1673–1743, 네덜란드)은 국제법의 기초가 국가 간 공동합의(consensus)에 있으며 이는 관습국제법과 조약의 형성으로 존재한다고 보았고, 영해 범위 설정에 있어서 ‘착탄거리설’을 주장하였다."},{"id":"i7","t":"바텔(Emer de Vattel, 1714–1767, 스위스)은 자국민의 피해를 국가의 피해로 간주하는 바텔의 의제(Vattel’s fiction)를 제시하였고 이는 [[외교적 보호권]] 발동의 이론적 기초가 되었다."},{"id":"i8","t":"[[트리펠(Heinrich Triepel)]](1868–1946, 독일)은 국제법의 구속력이 국가들의 공동의사(Gemeinwille)에서 발생한다는 공동의사설을 주장하였다."},{"id":"i9","t":"푸펜도르프(Samuel von Pufendorf, 1632–1694, 독일)는 국제법의 기초를 국가 간 합의가 아니라 인간의 사회성과 자연이성에 근거한 [[자연법]]에서 찾고 국가 간 규범을 [[자연법]]에서 직접 도출되는 보편적 의무로 파악하였다."},{"id":"i10","t":"[[비토리아(Francisco de Vitoria)]](1483–1546, 스페인)는 국제법(ius gentium)을 국가 간 합의의 산물이 아니라 자연이성에 의해 모든 민족 사이에 보편적으로 형성된 자연법적 규범으로 이해하였다."},{"id":"i11","t":"[[젠틸리(Alberico Gentili)]](1552–1608, 이탈리아)는 국제법을 신학과 윤리학으로부터 분리하고 법학적·세속적 방법론에 기초한 독립된 학문 영역으로 정립하였다."},{"id":"i12","t":"오스틴(John Austin, 1790–1859, 영국)은 법을 [[주권자]]의 명령으로 보았으며 [[주권자]]가 존재하지 않는 국제법은 실정 도덕(positive morality)에 불과하다고 하여 국제법의 법적 성질을 부인하였다."},{"id":"i13","t":"[[뒤기(Léon Duguit)]](1859–1928, 프랑스)는 사회적 연대성(solidarité sociale)에 기초하여 사회질서를 유지하기 위한 필요성에서 법의 내용과 강제력이 유래한다고 보았다."}]}]},{"id":"i14","title":"연원","secs":[{"id":"i15","title":"기출 OX","note":"","items":[{"id":"i16","t":"「국제사법재판소규정」 제38조 제1항에 규정된 법원의 순서는 위계를 의미하지 않는다.","a":"O"}]}]},{"id":"i17","title":"조약법","secs":[{"id":"i18","title":"조약법협약(1969) 조문","note":"","items":[{"id":"i19","t":"[[당사국]]은 기속적 동의를 표시하고 현재 해당 조약의 지배를 받는 국가를 말한다."},{"id":"i20","t":"조약 체결과 관련된 모든 행위를 수행할 목적상 국가원수, 정부수반 및 외교장관은 [[전권위임장]]을 제시하지 않아도 자신의 직무상 자국을 대표한다고 간주된다."},{"id":"i21","t":"조약체결 목적을 위하여 국가를 대표하는 권한을 부여받았다고 간주될 수 없는 사람이 수행한 조약체결과 관련된 행위는 그 국가가 [[추후 확인]]하지 않으면 법적 효력이 없다."},{"id":"i22","t":"국제회의에서 조약문은 출석하여 투표하는 국가 [[3분의 2]]의 찬성으로 채택되며, 다만 동일한 다수결로 다른 규칙의 적용을 결정하는 경우는 제외한다."},{"id":"i23","t":"조약본문의 [[인증]]은 서명, 조건부 서명(정부의 승인을 조건으로 하는 서명), 또는 가서명에 의한다."},{"id":"i24","t":"조약에 대한 국가의 기속적 동의는 [[서명]], 조약을 구성하는 문서의 교환, 비준, 수락, 승인 또는 가입이나 그 밖의 합의된 방법으로 표시된다."},{"id":"i25","t":"조건부 서명은 대표의 [[본국]]에 의해 확인되는 경우 조약의 완전한 서명을 구성한다."},{"id":"i26","t":"국가는 비준, 수락 또는 승인을 조건으로 조약에 서명하였거나 조약을 구성하는 문서를 교환한 경우, 그 조약의 [[당사자]]가 되지 않겠다는 의사를 명백히 할 때까지 조약의 대상 및 목적을 훼손하는 행위를 삼가야 할 의무를 진다."},{"id":"i27","t":"국가가 조약에 대한 기속적 동의를 표시한 경우, 발효가 부당하게 지연되지 않는다면 그 조약의 [[발효]]시까지 조약의 대상 및 목적을 훼손하는 행위를 삼가야 할 의무를 진다."},{"id":"i28","t":"[[교섭국]]의 한정된 수와 조약의 대상 및 목적에 비추어 조약 전체를 모든 당사자 간에 적용함이 각 당사자의 기속적 동의의 필수 조건으로 보이는 경우, 유보는 모든 당사자의 수락을 필요로 한다."},{"id":"i29","t":"조약이 국제기구의 설립 문서인 경우 그 조약이 달리 규정하지 않으면, 유보는 그 기구의 [[권한있는 기관]]의 수락을 필요로 한다."},{"id":"i30","t":"유보에 대한 다른 체약국의 이의는, 이의제기국이 확정적으로 반대의사를 [[표시]]하지 않으면, 이의제기국과 유보국 간 조약의 [[발효]]를 방해하지 않는다."},{"id":"i31","t":"유보는 유보국에 대해서는 다른 당사자와의 관계에 있어서 유보와 관련된 조약 규정을 그 [[유보]]의 범위에서 변경하며, 다른 당사자에 대해서는 유보국과의 관계에 있어서 이들 규정을 동일한 범위에서 변경한다."},{"id":"i32","t":"유보에 이의가 있는 국가가 자국과 유보국 간의 조약 [[발효]]에 반대하지 않는 경우, 유보에 관련되는 규정은 그 유보의 범위에서 양국 간에 적용되지 않는다."},{"id":"i33","t":"유보의 [[철회]]는 다른 체약국이 그 통보를 [[접수]]한 때에만 그 체약국에 관하여 효력이 발생한다."},{"id":"i34","t":"비준, 수락 또는 승인을 조건으로 조약에 서명할 때에 표명된 유보는 유보국이 기속적 동의를 표시할 때에 정식으로 확인되어야 한다. 그러한 경우 유보는 그 [[확인]]일자에 행해졌다고 간주된다."},{"id":"i35","t":"유보의 확인 이전에 행해진 유보의 명시적 수락 또는 유보에 대한 이의 자체는 [[확인]]을 필요로 하지 않는다."},{"id":"i36","t":"조약에 대한 국가의 기속적 동의가 그 조약이 발효한 이후 일자에 확정되는 경우, 그 조약이 달리 규정하지 않으면, 조약은 그 국가에 대하여 [[그 일자]]에 발효한다."},{"id":"i37","t":"조약문의 정본인증, 기속적 동의의 확정, 조약 발효의 방법 또는 일자, 유보, 기탁처의 임무 및 조약 발효 전에 필연적으로 발생하는 그 밖의 사항을 규율하는 조약 규정은 조약문의 [[채택]] 시부터 적용된다."},{"id":"i38","t":"조약이 달리 규정하거나 교섭국이 달리 합의한 경우를 제외하고, 어느 국가에 대한 조약 또는 조약 일부의 잠정적용은 그 국가가 다른 국가에게 그 조약의 당사자가 되지 않겠다는 의사를 [[통보]]하는 경우 종료된다."},{"id":"i39","t":"「국제연합헌장」 제[[103]]조에 따라 회원국 상호간에는 UN헌장이 다른 조약보다 우선 적용된다."},{"id":"i40","t":"전 조약의 모든 당사자가 동시에 후 조약의 당사자이지만, 전 조약이 종료 또는 시행정지 되지 않는 경우, 전 조약은 그 규정이 후 조약의 규정과 [[양립]]하는 범위 내에서만 적용된다."},{"id":"i41","t":"제3국의 의무가 발생한 때에는 조약 당사자와 제3국이 달리 합의하였음이 증명되는 경우가 아니면, 그 의무는 조약 당사자와 제3국이 [[동의]]하는 경우에만 취소 또는 변경될 수 있다."},{"id":"i42","t":"개정 합의의 발효 이후 조약의 당사자가 되는 국가는 다른 의사 표시를 하지 않는 경우, [[개정]] 조약의 당사자로 간주된다."},{"id":"i43","t":"다자조약의 둘 이상의 당사자는 해당 변경이 조약상 금지되지 않고, 다른 당사자의 권리 향유나 의무 이행에 영향을 주지 않으며, 어떤 규정으로부터의 이탈이 조약 전체의 대상 및 목적의 효과적인 수행과 [[양립]]하지 않을 때 그 규정과 관련되지 않은 경우 그들 간에만 조약을 변경하는 합의를 성립시킬 수 있다."},{"id":"i44","t":"조약의 유효성 또는 조약에 대한 국가의 기속적 동의의 유효성은 이 [[협약]]의 적용을 통해서만 부정될 수 있다."},{"id":"i45","t":"조약의 종료, 폐기 또는 당사자의 탈퇴는 그 [[조약]] 규정 또는 이 [[협약]]의 적용 결과로서만 행하여질 수 있다. 동일한 규칙이 조약의 시행정지에도 적용된다."},{"id":"i46","t":"제49조(기만) 및 제50조(부정)에 해당하는 경우, 이를 원용할 수 있는 국가는 조약 전체에 관하여 원용할 수도 있고, 가분성 요건을 충족한다는 조건으로 [[특정]] 조항에 관해서만 원용할 수 있다. (참고: 임의적 분리. 46(위헌조약)·47(전권대표의 권한남용)·48(착오)는 필수적 분리)"},{"id":"i47","t":"제51조(국가대표강박), 제52조(국가강박) 및 제53조([[강행규범]] 위반)에 해당하는 경우에는 조약 규정의 분리가 허용되지 않는다."},{"id":"i48","t":"기속적 동의를 표시하는 대표의 권한이 특별한 제한을 따른다는 조건으로 부여된 경우, 그 제한이 다른 교섭국에 [[통보]]되지 않았다면, 대표가 제한을 준수하지 않은 사실은 그가 표시한 동의를 무효로 하는 근거로 원용될 수 없다."},{"id":"i49","t":"종료에 관한 규정을 포함하지 않으며 폐기 또는 탈퇴도 규정하고 있지 않은 조약은, 폐기 또는 탈퇴의 권리가 조약의 [[성질]]상 묵시적으로 인정되는 경우에 해당되지 않으면, 폐기 또는 탈퇴의 대상이 되지 않는다."},{"id":"i50","t":"당사자는 폐기 또는 탈퇴도 규정하고 있지 않은 조약에 대한 폐기 또는 탈퇴 의사를 적어도 [[12]]개월 전에 통보하여야 한다."},{"id":"i51","t":"다자조약의 어느 당사자가 중대한 위반을 하는 경우, 다른 당사자는 [[전원일치]]의 합의로 그 다른 당사자와 의무불이행국 간의 관계에서, 또는 모든 당사자 간에 그 조약의 전부 또는 일부의 시행을 정지시키거나 그 조약을 종료시킬 권리를 갖는다."},{"id":"i52","t":"어느 당사자에 의한 조약 규정의 중대한 위반이 모든 당사자의 입장을 근본적으로 변경시키는 성격의 조약인 경우, 의무불이행국 이외의 당사자가 자신에 관하여 그 조약의 전부 또는 일부의 시행을 [[정지]]시키기 위한 사유로서 그 위반을 원용할 수 있다."},{"id":"i53","t":"조약이 [[경계선]]을 확정하는 경우 사정의 근본적 변경이 조약의 종료 또는 탈퇴 사유로 원용될 수 없다."},{"id":"i54","t":"특별히 긴급한 경우를 제외하고, 통보를 접수한 후 적어도 [[3]]개월의 기간이 만료될 때까지 어느 당사자도 이의를 제기하지 않은 경우, 통보를 한 당사자는 자신이 제의한 조치를 실행할 수 있다."},{"id":"i55","t":"어느 국가가 사전에 조약의 종료 등에 대한 통보를 하지 않은 사실은, 조약 이행을 요구하거나 조약 위반을 주장하는 다른 당사자에 대한 [[답변]]으로서 그 국가가 그러한 통보를 하는 것을 방해하지 않는다."},{"id":"i56","t":"이의가 제기된 일자로부터 [[12]]개월의 기간 내에 「국제연합헌장」 제33조의 수단을 통한 해결에 이르지 못한 경우, 강행규범과 무관한 조항의 적용·해석에 관한 분쟁의 어느 한쪽 당사자는 사무총장에게 요청서를 제출함으로써 부속서의 조정절차를 개시할 수 있다."},{"id":"i57","t":"조약의 무효선언, 종료, 탈퇴 또는 시행정지에 관한 문서가 국가원수, 정부수반 또는 [[외교장관]]에 의하여 서명되지 않은 경우에는 이를 전달하는 국가 대표에게 [[전권위임장]]의 제시를 요구할 수 있다."},{"id":"i58","t":"조약의 무효나 종료 등을 위한 통보 또는 문서는 그 [[효력]]이 발생되기 전 언제든지 철회될 수 있다."},{"id":"i59","t":"조약문의 정본인증 후 오류가 있다고 합의하는 경우, 다른 정정방법을 결정하지 않으면 ①조약문에 정정을 가하고 정당하게 권한을 위임받은 대표가 그 정정에 [[가서명]]하는 방법, ②정정 문서의 작성·교환, ③정정본 작성의 방법으로 정정된다."},{"id":"i60","t":"UN사무국에 등록된 조약문의 정정은 [[국제연합사무국]]에 통보된다."},{"id":"i61","t":"조정위원의 임기는 [[5]]년이며 연임될 수 있다."}]},{"id":"i62","title":"논점·판례","note":"","items":[{"id":"i63","t":"약식조약에서 [[서명]]은 인증과 기속적 동의 표시 역할을 한다."},{"id":"i64","t":"최종의정서에 서명하는 데에는 전권위임장이 필요하지 아니하며, 대표자가 [[신임장]]을 휴대하는 것만으로 충분하다."},{"id":"i65","t":"Land and Maritime Boundary between Cameroon and Nigeria 사건에서 나이지리아는 1975년 Maroua Declaration이 국내헌법상 비준절차를 거치지 않아 무효라고 주장하였으나, ICJ는 문제의 선언은 [[서명]]과 함께 즉시 발효하였다고 판시하였다."},{"id":"i66","t":"이집트의 낫셀 정부는 1957년 [[수에즈]] 운하의 국유화와 향후 이용 보장에 관한 선언을 발표하고 UN에 등록하였으나 이것이 조약은 아니었다."},{"id":"i67","t":"유보는 조약규정을 [[배제]] 또는 변경하려는 것이나, 해석선언은 조약규정을 구체화하거나 명확화하기 위한 것이다."},{"id":"i68","t":"[[양립성]] 원칙은 1951년 제노사이드협약의 유보에 관한 권고적 의견에서 처음 제시되었다."},{"id":"i69","t":"국제기구에 파견된 국가대표가 전권위임장 없이 조약에 기속적 동의의 표시로서 서명한 경우 국가의 추인이 있더라도 해당 서명 행위는 법적 효력이 없다.","a":"X (추인 시 인정)","tag":"기출"}]}]},{"id":"i70","title":"국내법 관계","secs":[{"id":"i71","title":"영국의 관행","note":"","items":[{"id":"i72","t":"[[Barbuit]]’s Case (1737): 외교사절이 민사소송의 피고가 된 사건에서 법원은 국제관습법을 직접 적용하여 면책을 인정함으로써 관습국제법의 국내법 자동편입을 최초로 확인하였다."},{"id":"i73","t":"[[Triquet]] v Bath (1764): 외교관 수행원의 체포 적법성이 문제된 사건에서 “국제법은 영국법의 일부”라고 판시하여 관습국제법 자동편입 원칙을 확립하였다."},{"id":"i74","t":"West Rand Central Gold Mining Co v The King (1905): 보어전쟁 후 남아공 정부 채무 승계 여부가 문제된 사건에서 충분히 [[확립]]된 관습국제법만이 보통법으로 수용된다고 판시하였다."},{"id":"i75","t":"[[Mortensen]] v Peters (1906): 국제관습법이 원칙적으로 국내법에 수용됨을 인정하면서도 명백한 의회 제정법이 존재하면 국제법과 충돌하더라도 국내법을 우선 적용해야 한다고 판시하였다."},{"id":"i76","t":"Chung Chi Cheung v The King (1939): 홍콩 항구에 정박한 중국 정부 소유 선박에서의 살인 사건에서 영국법상 정부선박에 대한 형사관할 [[면제]]가 인정되지 않는다고 보아 영국 법원의 재판권 행사를 허용하였다."},{"id":"i77","t":"Trendtex Trading Corp v Central Bank of Nigeria (1977): 법원은 변화한 관습국제법([[제한]]적 국가면제론)을 직접 반영하여 면제를 부정함으로써 관습국제법의 자동편입을 인정하였다."},{"id":"i78","t":"A v Secretary of State for the Home Department (Belmarsh Case, 2004): Human Rights Act 1998에 의해 ECHR이 국내법화된 이상 협약상 권리가 국내법상 권리로 [[직접 적용]]될 수 있음을 인정하였다."},{"id":"i79","t":"R v Jones (Margaret) (2006): [[침략]]범죄가 관습국제법상 존재하더라도 형벌법규 영역에서는 의회 입법 없이 자동편입이 인정되지 않는다고 판시하였다."},{"id":"i80","t":"[[Belhaj]] v Straw (2017): 중대한 국제범죄는 심리가 가능하되 관습국제법만으로 독립적 청구권이 발생하지 않고 국내법을 통해 구체화되어야 한다고 판시하였다."},{"id":"i81","t":"R (Miller) v Secretary of State for Exiting the European Union (2017): 정부가 [[EU]] 탈퇴를 조약행위만으로 통보할 수 있는지가 문제되었으며, 조약은 국내법상 권리·의무를 직접 변경할 수 없고 의회의 입법이 있어야 국내적 효력이 발생한다고 판시하였다."}]},{"id":"i82","title":"미국의 관행","note":"","items":[{"id":"i83","t":"Ware v. Hylton (1796): [[조약]]은 헌법상 최고법(Supremacy Clause)에 해당하여 충돌하는 주헌법과 주법에 우선 적용된다."},{"id":"i84","t":"Murray v. The Schooner Charming Betsy (1804): 의회 제정법은 가능한 한 [[국제관습]]법과 충돌하지 않도록 해석하여야 한다는 국제법 합치적 해석원칙을 확립하였다."},{"id":"i85","t":"Foster & Elam v. [[Neilson]] (1829): 자기집행조약과 비자기집행조약을 구별하는 자기집행성 법리를 최초로 정립하였다."},{"id":"i86","t":"Head Money Cases (1884): 조약과 연방법률은 동일한 효력을 가지며 충돌하는 경우 후에 제정된 법이 우선 적용된다는 [[신법우선]](Last-in-Time) 원칙을 확인하였다."},{"id":"i87","t":"The Paquete Habana (1900): 조약이나 의회 제정법이 없는 경우 국제관습법은 미국 법의 일부로 [[수용]]되어 적용되나, 연방법률이나 조약이 존재하면 보충적으로만 적용된다."},{"id":"i88","t":"Missouri v. Holland (1920): 유효한 조약과 그 이행입법은 [[주]] 권한 사항에 대해서도 우선 적용될 수 있다."},{"id":"i89","t":"United States v. Belmont (1937): 대통령의 [[행정]]협정도 대외관계 영역에서는 주법에 우선 적용될 수 있음을 인정하였다."},{"id":"i90","t":"Sei Fujii v. California (1952): 유엔헌장 인권규정은 [[자기집행]]적 조약이 아니므로 직접 국내법적 효력을 가지지 않는다."},{"id":"i91","t":"[[Breard]] v. Greene (1998): 영사통보권은 인정되지만 그 행사 방법은 국내 소송절차에 따르므로 절차적 실권(procedural default) 규칙 위반 시 각하될 수 있다."},{"id":"i92","t":"[[Medellín]] v. Texas (2008): ICJ 판결이나 관련 조약은 자기집행적이거나 이행입법이 없는 한 국내에서 직접 집행될 수 없다."}]}]},{"id":"i93","title":"기본적 권리·의무","secs":[{"id":"i94","title":"기출 OX","note":"","items":[{"id":"i95","t":"국가의 주권평등, 분쟁의 평화적 해결, 국내문제 불간섭 등 국가의 기본적 권리의무는 1970년 「우호관계선언」에서 최초로 확인되었다.","a":"X (UN헌장에 최초 규정)"}]}]},{"id":"i96","title":"국가관할권·면제","secs":[{"id":"i97","title":"국가관할권 판례","note":"","items":[{"id":"i98","t":"SS Lotus 사건(PCIJ, 1927)은 [[공해]]상 선박충돌사건에서 국제법에 명시적 금지가 없는 한 국가는 자국 형사관할권을 가질 수 있다고 판시했고, [[피해]]선의 국적국인 터키의 관할권 행사를 인정하였다."},{"id":"i99","t":"Arrest Warrant 사건(ICJ, 2002)은 벨기에가 [[보편]]관할권에 기초해 발부한 체포영장이 현직 외교장관의 [[인적]] 면제를 침해하여 위법이라고 판시했다."},{"id":"i100","t":"United States v. [[Alvarez]]-Machain(1992)은 외국 영토에서의 강제 [[납치]]로 피고인을 데려와도 미국 법원의 재판관할 자체는 부정되지 않는다고 판단했다."},{"id":"i101","t":"Akehurst’s Case(영국, 1982)는 외국에서 이루어진 살인에 대해 [[속인주의]]에 근거한 형사관할권을 인정했다."},{"id":"i102","t":"United States v. Bowman(1922)은 해외 범죄라도 미국의 핵심 국가이익을 침해하면 [[보호]]주의에 따라 역외 형사관할이 가능하다고 보았다."},{"id":"i103","t":"Yahoo! v. LICRA(2001)는 외국 인터넷 거래라도 프랑스 내에 실질적 효과가 발생하면 [[효과]]이론에 따라 프랑스 법원이 역외 관할을 행사할 수 있음을 인정했다."},{"id":"i104","t":"[[Banković]] v. Belgium(ECHR, 2001)은 인권협약상 관할권은 영토적 통제 또는 실질적 권력 행사 영역에 한정되므로 단순한 공습만으로는 역외 관할이 성립하지 않는다고 판시했다."},{"id":"i105","t":"Eichmann 사건(이스라엘, 1961)은 나치 전범에 대해 보편관할권뿐 아니라 [[보호]]주의에 근거해서도 처벌할 수 있음을 인정했다."},{"id":"i106","t":"[[Filártiga]] v. Peña-Irala(1980)는 외국에서의 고문행위에 대해 Alien Tort Act에 따라 미국 법원이 민사관할을 행사할 수 있음을 인정했다."},{"id":"i107","t":"[[Kiobel]] v. Royal Dutch Petroleum(2013)은 Alien Tort Act가 원칙적으로 역외 적용되지 않으며, 미국과의 강한 연결고리가 필요하다고 판시했다."}]},{"id":"i108","title":"국가관할권 논점","note":"","items":[{"id":"i109","t":"효과이론은 [[객관]]적 속지주의가 확대된 것이다."},{"id":"i110","t":"미국은 ‘[[ALCOA]]’ 판결에서 효과이론을 도입하였다."},{"id":"i111","t":"유럽사법법원은 ‘Wood Pulp사건’에서 [[집행]]이론을 도입하였다."},{"id":"i112","t":"미국은 [[Yunis]] 사건(1988)에서 항공기 납치행위는 보편관할권의 적용 대상이라고 보았으며, 미국인 탑승을 이유로 수동적 속인주의도 적용된다고 보았다."},{"id":"i113","t":"Achille Lauro호 사건에서 미국은 [[보편주의]]와 수동적 속인주의에 기초한 관할권을 주장하였으나, 이탈리아는 범죄인이 자국에 소재하고 있음을 이유로 관할권을 행사하였다."},{"id":"i114","t":"전직대통령에 대한 고문방지협약 적용 사건(2012)에서 ICJ는 기소 또는 인도 의무가 대세적 의무라고 하였고, [[인도]]의무보다는 [[기소]]의무가 1차적 의무라고 보았다."},{"id":"i115","t":"해적은 관습법상 [[임의]]적 보편관할권의 대상이다."},{"id":"i116","t":"항공범죄 조약 중 [[동경]]협약은 인도 아니면 소추 원칙을 규정하지 않았으나, 헤이그·몬트리올·북경협약은 모두 규정하고 있다."},{"id":"i117","t":"[[입법]]관할권은 영토적 한계가 없으므로 자국 영토 밖에서 적용이 예정된 국내법을 제정할 권리를 갖는다."},{"id":"i118","t":"현행 국제관습법상 관할권의 경합을 해결하는 규칙은 존재하지 않는다."},{"id":"i119","t":"범죄인이 다수 국가에 의해 처벌될 가능성이 있으나, [[일사부재리]] 원칙에 위반되지는 않는다."},{"id":"i120","t":"국제형사재판소는 관할대상 범죄인이 타국 국내법원에서 처벌을 받은 경우 [[일사부재리]] 원칙에 따라 원칙적으로 재판할 수 없다."},{"id":"i121","t":"페스카마호 사건(1996)에서 한국은 피해자의 국적국으로서 형사관할권을 행사하였다([[수동]]적 속인주의)."},{"id":"i122","t":"한미 SOFA 합의의사록에 의하면 대한민국이 계엄을 선포한 경우 [[미국]]은 계엄령이 해제될 때까지 미국 군대 구성원 등에 대해 전속적 재판권을 행사한다."},{"id":"i123","t":"형법 제6조: 대한민국 영역 외에서 대한민국 또는 대한민국국민에 대하여 죄를 범한 외국인에게 적용한다. 단 [[행위지]]의 법률에 의하여 범죄를 구성하지 아니하거나 소추 또는 형의 집행을 면제할 경우에는 예외로 한다."},{"id":"i124","t":"형법 제4조는 대한민국 영역 밖에 있는 대한민국 선박이나 [[항공기]] 내에서 죄를 범한 외국인에게 한국 형법이 적용된다고 규정한다."},{"id":"i125","t":"속지주의가 국제법상 우선하는 것은 아니다. 다만, 관행상 [[속지주의]]가 우선한다."},{"id":"i126","t":"형법 제7조: 외국에서 형의 전부 또는 일부의 집행을 받은 자에 대하여는 형을 감경 또는 면제[[한다]]."}]},{"id":"i127","title":"국가면제협약(2004) 조문","note":"","items":[{"id":"i128","t":"“[[국가]]”라 함은 국가 및 각종 정부기관, 연방국가의 구성단위 또는 주권적 권위의 행사를 위임받은 정치적 하부조직, 주권적 권위를 실제로 수행하는 기관 또는 조직, 직무상으로 행동하는 국가의 대리인을 의미한다."},{"id":"i129","t":"법정이라 함은 그 명칭이 무엇이든 간에 사법적 [[기능]]의 수행을 위임받은 모든 국가기관을 의미한다."},{"id":"i130","t":"“상업적 거래” 여부를 결정함에 있어서 계약 및 거래의 [[성격]]이 우선적으로 고려되어야 한다. 그러나 당사자들이 합의하거나 법정지국의 실행상 그 [[목적]]이 비상업적 성격을 결정하는 데 관련이 있는 경우에는 그 목적도 아울러 고려되어야 한다."},{"id":"i131","t":"타국이 소송의 당사자로 거명되지 않았으나 실제로 그 소송이 타국의 재산, 권리, 이익 또는 활동에 영향을 줄 [[목적]]을 가지는 경우 그 소송은 타국을 상대로 제기된 것으로 간주한다."},{"id":"i132","t":"타국 법의 적용에 대한 국가의 동의는 그 타국 법정에 의한 관할권 행사에 대한 동의로 간주될 수 [[없다]]."},{"id":"i133","t":"국가는 스스로 소송에 [[참가]]하거나 본안과 관련하여 여타의 행동을 취한 경우 관할권 면제를 주장할 수 없다."},{"id":"i134","t":"국가는 오로지 면제를 주장하거나 문제되는 재산에 관한 권리·이익을 주장하기 위하여 소송에 참가한 경우, 관할권 행사에 [[동의]]한 것으로 간주될 수 없다."},{"id":"i135","t":"국가의 대리인이 타국의 법정에 [[증인]]으로서 출석하는 경우, 이는 관할권 행사에 동의하는 것으로 해석될 수 [[없다]]."},{"id":"i136","t":"국가가 타국 법정에서의 소송에 출석하지 않는 경우, 이는 관할권 행사에 [[동의]]하는 것으로 해석될 수 [[없다]]."},{"id":"i137","t":"타국 법정에서 소송을 제기하는 국가는 주된 청구와 동일한 법적 관계 또는 사실로부터 제기되는 여하한 [[반소]]와 관련하여 면제를 주장할 수 없다."},{"id":"i138","t":"타국 법정에서의 소송에 청구를 제기하기 위해 참가하는 국가는 동일한 법적 관계 또는 사실로부터 제기되는 여하한 [[반소]]와 관련하여 면제를 주장할 수 없다."},{"id":"i139","t":"타국 법정에서 자기를 상대로 제기된 소송에서 [[반소]]를 제기하는 국가는 그 주된 청구와 관련하여 면제를 주장할 수 없다."},{"id":"i140","t":"[[국가]] 간의 상업적 거래의 경우 면제가 제한되지 아니한다."},{"id":"i141","t":"피고용자가 [[공권력]]행사에 있어 특별한 기능의 수행을 위하여 고용된 경우 면제가 인정된다."},{"id":"i142","t":"피고용자가 외교관, 영사, 국제기구에 파견된 대표자인 경우 면제가 [[인정된다]]."},{"id":"i143","t":"소송의 대상이 개인의 채용, 고용의 갱신 또는 [[복직]]에 관련된 경우 면제가 인정된다."},{"id":"i144","t":"소송의 대상이 개인의 해고 또는 고용의 종료이며, 국가원수·정부수반·외무부장관에 의하여 그 소송이 그 국가의 [[안보]]상의 이익과 관련된 것임이 확인되는 경우 면제가 인정된다."},{"id":"i145","t":"국가는 자국에 귀속되는 작위 또는 부작위로 인한 [[사망]] 기타 인적 피해 또는 유형의 재산상 피해에 대한 금전적 배상 소송에서 면제를 원용할 수 없다. 단, 작위 또는 부작위가 전부 또는 일부 그 타국 영토상에서 발생하고 그 주체가 당시 그 영토상에 있는 경우에 한한다."},{"id":"i146","t":"국가는 [[법정지]]국에 소재하는 부동산에 대한 권리·이익 등의 결정과 관계된 소송에서 면제를 원용할 수 없다."},{"id":"i147","t":"선박을 소유·운영하는 국가는 소송원인 발생시 선박이 [[비상업적]] 공무 목적 이외의 용도로 사용된 경우, 선박의 운영과 관련된 소송에서 면제를 원용할 수 없다."},{"id":"i148","t":"국가에 의해 소유 또는 운영되고 당분간 오로지 [[비상업]]적 공무를 위해 사용되는 기타 선박들에 대해 면제의 제한이 적용되지 아니한다."},{"id":"i149","t":"국가가 판결 전 강제조치에 대하여 국제협정, 중재협정, 서면계약, 법정에서의 선언 등을 통해 명시적으로 [[동의]]한 경우 판결 전 강제조치가 취해질 수 있다."},{"id":"i150","t":"국가가 소송 대상 청구의 만족을 위하여 재산을 [[할당]]하거나 특정한 경우 판결 전에 강제조치를 취할 수 있다."},{"id":"i151","t":"판결 후 강제조치는, 재산이 특별히 비상업적 공무 목적 이외의 용도로 사용되거나 의도되었고 [[법정지]]국의 영토상에 존재하며 소송 상대방 단체와 관련을 가지는 재산에 대해서만 취할 수 있다."},{"id":"i152","t":"재판관할권 행사에 대한 동의는 [[강제조치]]를 취하는 데 대한 동의를 포함하지 않는다."},{"id":"i153","t":"강제집행이 제한된 재산들도 국가의 명시적·[[묵시]]적 선언에 의한 [[포기]]에 의해 강제조치의 대상이 될 수 있다."},{"id":"i154","t":"결석판결은 소환장이 적법하게 송달되었고, 송달된 때로부터 [[4]]개월 이상이 경과되었으며, 관할권 행사가 인정되는 경우 부여될 수 있다."},{"id":"i155","t":"협약의 해석·적용 분쟁으로서 교섭에 의하여 [[6]]개월 이내에 해결될 수 없는 분쟁은 중재재판에 부탁되어야 하며, 중재재판 요청일로부터 [[6]]개월이 경과한 후에도 중재재판 구성에 합의하지 못하는 경우 어느 당사국도 [[국제사법재판소]] 규정에 따라 그 분쟁을 동 재판소에 부탁할 수 있다."},{"id":"i156","t":"분쟁해결 조항에 구속받지 않음을 선언한 당사국은 언제든지 [[국제연합 사무총장]]에게 통고함으로써 그 선언을 철회할 수 있다."},{"id":"i157","t":"여하한 당사국도 [[국제연합 사무총장]]에게 서면통고를 함으로써 협약을 폐기할 수 있다. 폐기는 통고가 접수된 후 [[1년]] 후에 발효한다."}]},{"id":"i158","title":"국가면제 기출 OX","note":"","items":[{"id":"i159","t":"국가가 면제를 원용하거나 문제가 된 재산에 대한 권리를 주장하기 위한 목적으로 소송에 참여한 경우 타국 법원의 재판관할권에 동의한 것으로 간주된다.","a":"X"}]},{"id":"i160","title":"시사 – 미국의 마두로 체포","note":"2026년 1월 3일 미국은 ‘Operation Absolute Resolve’라는 군사작전을 통해 베네수엘라 카라카스 등에서 공습과 특수부대 투입을 감행해 현직 대통령 니콜라스 마두로와 그의 부인을 체포하고 미국으로 압송했으며, 마두로는 마약·나르코테러 연루 혐의로 뉴욕 연방법원에 기소되었다. 베네수엘라 정부는 이를 납치 및 주권 침해로 규정하였고, 유엔 안보리 긴급회의 소집 등 국제법 위반 논란이 일었다.","items":[{"id":"i161","t":"유엔헌장 제2조 제4항은 모든 회원국이 다른 국가의 영토보전이나 정치적 독립에 대한 [[무력]]의 위협 또는 사용을 금지한다고 규정한다."},{"id":"i162","t":"유엔헌장상 무력사용금지원칙의 예외로 제[[51]]조에 따른 자위권이 인정되는데, 무력공격이 발생한 경우 개별적 또는 집단적 자위권 행사가 허용된다."},{"id":"i163","t":"유엔헌장상 두 번째 예외는 제42조에 따른 [[안전보장이사회]]의 강제조치로서, 국제평화와 안전 유지를 위해 군사적 조치를 승인할 수 있다."},{"id":"i164","t":"유엔헌장 제53조는 지역적 기관이나 지역적 협정이 무력을 사용할 경우에도 [[안보리]]의 사전 승인 없이는 허용되지 않는다고 규정한다."},{"id":"i165","t":"현직 국가원수는 관습국제법상 국가를 대표하는 지위로 인해 외국의 형사관할권으로부터 [[인적]] 면제(immunity ratione personae)를 가진다."},{"id":"i166","t":"피노체트 사건은 전직 국가원수에게는 고문과 같은 [[국제범죄]]에 대해 물적 면제가 부인될 수 있음을 인정한 대표적 판례이다."},{"id":"i167","t":"[[아이히만]] 사건에서 이스라엘의 아르헨티나 영토 내 납치는 국제법 위반이었으나, 납치된 피의자를 국내에서 재판할 수 있는지는 국내법 문제라고 이스라엘 법원이 판단하였다."},{"id":"i168","t":"미국은 마약조직범죄를 자국의 중대한 국가적 법익 침해로 보아 [[보호]]주의 관할권을 주장할 수 있다."},{"id":"i169","t":"[[보호]]주의 관할권이 인정되더라도 외국 영토에서 혐의자를 강제로 납치하는 행위는 국제법상 허용되지 않는다."},{"id":"i170","t":"베네수엘라에서 현직 대통령을 무력으로 체포·납치하는 행위는 무력사용금지원칙과 국가원수 [[면제]] 원칙을 동시에 침해하는 중대한 국제법 위반에 해당한다."}]}]},{"id":"i171","title":"국가책임","secs":[{"id":"i172","title":"국가책임초안(2001) 조문","note":"","items":[{"id":"i173","t":"작위 또는 부작위를 구성하는 행위가 국제법에 따라 국가에 [[귀속]]될 수 있으며, 그 국가의 국제의무 위반을 구성하는 경우 국가의 국제위법행위가 존재한다."},{"id":"i174","t":"국가행위의 국제위법성은 [[국제법]]에 의하여 결정된다. 그러한 결정은 그 행위의 [[국내법]]상 적법성에 의하여 영향받지 않는다."},{"id":"i175","t":"국가기관은 당해 국가의 [[국내법]]에 따라 그같은 지위를 가진 모든 개인 또는 단체를 포함한다."},{"id":"i176","t":"국가기관 또는 공권력을 행사하도록 권한을 위임받은 개인·단체의 행위는 그 자격으로 행동하는 경우, 자신의 [[권한]]을 넘어서거나 지시를 위반하더라도 국제법상 그 국가의 행위로 간주된다."},{"id":"i177","t":"사인 또는 사인단체의 행위는 그 행위를 수행함에 있어서 사실상 한 국가의 지시를 받거나 그 지시 또는 [[통제]] 하에서 행동하는 경우 국제법상 그 국가의 행위로 간주된다."},{"id":"i178","t":"국가로 귀속될 수 없는 행위라도 국가가 문제의 행위를 자국의 행위로 [[인정]]하고 [[수락]]하는 경우, 그 범위 내에서는 그 국가의 행위로 본다."},{"id":"i179","t":"국가의 행위가 국제의무에 의하여 요구되는 바와 합치되지 않는 경우, 그 의무의 [[연원]] 또는 성격과는 관계없이, 그 국가의 국제의무 위반이 존재한다."},{"id":"i180","t":"행위의 [[발생]]시 국가가 당해 의무에 구속되지 아니한다면, 국가의 행위는 국제의무 위반에 해당하지 아니한다."},{"id":"i181","t":"지속적 성격을 갖지 않는 국가행위로 인한 국제의무의 위반은 그 [[효과]]가 지속된다 할지라도 그 행위가 [[수행]]된 시점에 발생한다."},{"id":"i182","t":"지속적 성격을 갖는 국가행위로 인한 국제의무의 위반은 그 행위가 지속되고 [[국제의무와 합치하지 않는 상태]]로 남아있는 전 기간 동안에 걸쳐 연장된다."},{"id":"i183","t":"국가에게 일정한 사건을 [[방지]]할 것을 요구하는 국제의무의 위반은 그러한 사건이 발생하는 때에 발생하며, 사건이 계속되어 그 의무와 불합치하는 상태로 남아있는 전 기간 동안에 걸쳐 [[연장]]된다."},{"id":"i184","t":"국제위법행위를 실행하는 타국을 지원·원조하는 국가는 그 국제위법행위의 상황을 [[인식]]하고 그같이 행동하며, 당해 국가가 실행하였더라도 그 행위가 국제적으로 [[위법]]할 경우 국제적으로 책임을 진다."},{"id":"i185","t":"타국이 국제위법행위를 실행하도록 타국을 지시하고 [[통제]]한 국가는 그 상황을 [[인식]]하고 그같이 행동하며, 당해 국가가 실행하였더라도 위법할 경우 그 행위에 대하여 책임을 진다."},{"id":"i186","t":"타국으로 하여금 어떠한 행위를 실행하도록 강제한 국가는 강제가 없었다면 그 행위는 피강제국의 국제위법행위가 될 것이며, 그 행위의 상황을 [[인식]]하고 강제하였다면 그 행위에 대하여 책임을 진다."},{"id":"i187","t":"한 국가가 타국의 행위실행에 대해서 한 [[유효]]한 동의는 그 행위가 그 동의의 범위 내에서 실행되는 한, 행위실행국 행위의 위법성이 조각된다."},{"id":"i188","t":"불가항력의 상황이 이를 원용하는 국가의 행위에만 의하거나 다른 요소와 결합된 행위에서 [[기인]]하는 경우 불가항력을 위법성 조각 사유로 원용할 수 없다."},{"id":"i189","t":"행위자가 위난 상황에 처하여 자신이나 그의 보호하에 맡겨진 다른 사람들의 [[생명]]을 구하기 위한 다른 합리적 방법이 없는 경우, 그 국가행위의 위법성이 조각된다."},{"id":"i190","t":"문제된 행위가 그에 [[상당]]하거나 또는 더욱 커다란 위험을 발생시킬 우려가 있는 경우 조난을 위법성 조각사유로 원용할 수 없다."},{"id":"i191","t":"국가가 필요성(긴급피난) 상황의 발생에 [[기여]]한 경우 위법성을 조각시키기 위한 사유로 원용될 수 없다."},{"id":"i192","t":"일반 국제법상의 [[강행규범]]에 따라 발생하는 의무와 합치되지 않는 어떠한 국가행위에 대해서도 위법성을 조각시키지 않는다."},{"id":"i193","t":"국제위법행위에 책임이 있는 국가는 행위가 계속되고 있다면 이를 [[중지]]할 의무 및 필요한 경우에는 [[재발방지]]에 관한 적절한 보증 및 보장을 제공할 의무를 진다."},{"id":"i194","t":"국제위법행위에 책임이 있는 국가는 [[금전배상]] 대신 원상회복에 따른 이익에 비하여 원상회복이 현저히 [[불균형]]한 부담을 수반하지 않는 경우 원상회복 의무를 부담한다."},{"id":"i195","t":"금전배상은 확정될 수 있는 범위 내의 [[상실이익]]을 포함하여 금전적으로 산정될 수 있는 모든 손해를 포괄한다."},{"id":"i196","t":"만족은 피해와 [[불균형]]을 이루어서는 아니되며, 책임국에게 모욕이 되는 형태를 취해서는 아니된다."},{"id":"i197","t":"[[강행규범]]의 중대한 위반이 있는 경우 국가들은 모든 중대한 위반을 합법적 수단을 통하여 종료시키기 위해 협력하여야 한다."},{"id":"i198","t":"국가는 위반된 의무가 개별적으로 자국을 상대로 하는 경우 [[피해국]]으로서 타국의 책임을 추궁할 수 있다."},{"id":"i199","t":"위반된 의무가 당해 국가를 포함하는 일단의 국가들 또는 [[국제공동체]] 전체를 상대로 하는 것이며, 그 위반이 당해 국가에 특별히 영향을 주는 경우 [[피해국]]으로서 책임을 추궁할 수 있다."},{"id":"i200","t":"위반된 의무가 일단의 국가들 또는 국제공동체 전체를 상대로 하는 것이며, 그 의무의 추후 이행과 관련하여 모든 다른 국가들의 입장을 급격하게 변경시키는 성질을 지닌 경우 [[피해]]국으로서 책임을 추궁할 수 있다."},{"id":"i201","t":"위반된 의무가 당해 국가를 포함한 국가집단에 대하여 부담하는 것이고 그 국가들의 [[집단적 이익]]의 보호를 위하여 수립된 경우 [[피해]]국 이외의 어떠한 국가도 책임을 추궁할 수 있다."},{"id":"i202","t":"위반된 의무가 [[국제공동체]] 전체에 대하여 부담하는 것일 경우 피해국 이외의 어떠한 국가도 타국의 책임을 추궁할 수 있다."},{"id":"i203","t":"피해국 이외의 국가는 국제위법행위의 [[중지]]와 재발방지의 보증 및 보장, 피해국을 위한 배상의무의 이행을 요구할 수 있다."},{"id":"i204","t":"피해국은 오직 책임국이 [[손해배상]] 의무를 준수하도록 하기 위하여 대응조치를 취할 수 있다."},{"id":"i205","t":"[[대응조치]]는 조치를 취하는 국가가 책임국에 대한 국제의무를 당분간 이행하지 않는 것에 한정된다."},{"id":"i206","t":"대응조치는 무력 위협·행사를 삼갈 의무, 기본적 인권 보호 의무, 복구가 금지되는 인도적 성격의 의무, 일반국제법상의 [[강행규범]]에 따른 기타 의무에 영향을 주어서는 안 된다."},{"id":"i207","t":"대응조치를 취하는 국가는 자국과 책임국 간에 적용되는 [[분쟁해결절차]]에 따를 의무의 이행으로부터 면제되지 아니한다."},{"id":"i208","t":"대응조치는 국제위법행위의 심각성과 문제되는 권리를 고려하여 입은 피해에 [[비례]]하여야 한다."},{"id":"i209","t":"대응조치를 취하기에 앞서 피해국은 책임국에게 [[손해배상]] 의무 이행을 요구하고, 대응조치 결정을 통고하며, 협상을 제안하여야 한다."},{"id":"i210","t":"국제위법행위가 중지되었고, 분쟁이 구속력 있는 결정을 내릴 수 있는 법원 또는 재판소에 계속 중인 경우 [[대응조치]]가 취하여질 수 없고, 이미 취해진 경우 지체 없이 중단되어야 한다."},{"id":"i211","t":"책임국이 국제위법행위와 관련하여 [[손해배상]] 의무를 이행한다면 대응조치는 즉시 종료되어야 한다."}]},{"id":"i212","title":"국가책임 판례","note":"","items":[{"id":"i213","t":"티노코 중재사건(1923)은 [[명백]]한 월권행위의 국가귀속성을 부정하였다."},{"id":"i214","t":"Massy사건에 의하면 [[하급]]기관의 행위도 국가로 귀속된다."},{"id":"i215","t":"니카라과 사건에서 콘트라반군은 미국의 [[사실]]상 국가기관이 아니므로 반군의 활동에 대해서는 책임을 지지 않는다고 보았다."},{"id":"i216","t":"세르비아공채사건(1929/PCIJ)에서 [[전쟁]]은 불가항력에 해당되지 않아 위법성이 조각되지 않는다고 하였다."},{"id":"i217","t":"가브치코보-나기마로스 사건에서 ICJ는 슬로바키아의 변형C 계획은 1977년 조약에 위반되며 [[비례]]성을 위반하므로 대항조치로 정당화될 수 없다고 하였다."},{"id":"i218","t":"Rainbow Warrior호 사건에서 중재법원은 프랑스가 원용한 불가항력과 [[조난]]을 위법성 조각 사유로 인정할 수 없다고 판시하였다."},{"id":"i219","t":"[[Janes]]사건에서 멕시코 당국은 미국인을 살해한 범인을 체포하기 위해 적절한 조치를 취하지 못하였으므로 자신의 부작위에 대해 국가책임을 지게 되었다."},{"id":"i220","t":"CMS Gas Transmission Company v. Argentina 사건에서 ICSID 중재재판소는 [[긴급피난]]의 항변이 위법성을 조각할 수는 있겠지만 보상의무를 배제하지는 않는다고 하였다."},{"id":"i221","t":"ICJ는 Jurisdictional Immunities of the State 사건에서 사법부의 국제의무 위반의 경우에도 판결을 [[파기]]하는 등 원상회복 의무가 부과될 수 있음을 시사하였다."},{"id":"i222","t":"Pulp Mills 판결(2010)에서 ICJ는 절차적 의무 위반에 불과한 사안에 대해 [[원상회복]]의 요구는 부적절하며, 의무 위반을 확인하는 판결로써 만족이 성립된다고 판시했다."}]},{"id":"i223","title":"외교적 보호초안(2006) 조문","note":"","items":[{"id":"i224","t":"국가는 피해 일자로부터 [[공식청구 제기일]]까지 계속하여 그 국가의 국적자인 사람에 대하여 외교적 보호를 행사할 권리를 갖는다. 국적이 양 일자에 모두 존재하는 경우, 계속성은 [[추정]]된다."},{"id":"i225","t":"국가는 [[피해]] 일자에는 자국민이 아니었으나 공식청구 제기 일자에는 자국민인 개인에 대하여 외교적 보호를 행사할 수 있다. 단, 전임국 국적을 보유하였거나, 청구 제기와 관련 없는 이유로 [[국제법]]에 불합치하지 않는 방법으로 국적을 취득한 경우에 한한다."},{"id":"i226","t":"개인의 현재 국적국은 그 개인이 이전 국적국의 국민이고 현재 국적국의 국민이 아닌 때에 입은 피해에 대하여 [[이전]] 국적국에 대하여 외교적 보호권을 행사할 수 없다."},{"id":"i227","t":"이중 또는 복수국적자의 국적국은 그 국적자와 관련하여 [[국적국]]이 아닌 국가에 대하여 외교적 보호를 행사할 수 있다."},{"id":"i228","t":"이중 또는 복수국적자와 관련하여 둘 이상의 국적국이 [[공동으로]] 외교적 보호를 행사할 수 있다."},{"id":"i229","t":"국적국은 자국의 국적이 [[피해 일자와 공식청구 제기 일자]] 양일에 [[우세]]하지 않다면 그 개인이 국적자인 다른 국가에 대하여 외교적 보호를 행사할 수 없다."},{"id":"i230","t":"국가는 피해 일자와 공식청구 제기 일자에 그 국가에서 [[합법]]적이고 [[상시]]적으로 거주 중인 무국적자에 대하여 외교적 보호를 행사할 수 있다."},{"id":"i231","t":"국가는 국제적으로 승인된 기준에 따라 난민으로 인정되고, 양 일자에 그 국가에서 합법적이고 [[상시]]적으로 거주 중인 자에 대하여 외교적 보호를 행사할 수 있다."},{"id":"i232","t":"난민의 [[국적국]]의 국제위법행위로 인한 피해와 관련하여서는 난민인정국이 외교적 보호권을 발동할 수 없다."},{"id":"i233","t":"회사의 국적국은 회사가 그 [[국내법]]에 따라 설립된 국가를 의미한다. 그러나 회사가 다른 국가의 국적인에 의해 지배되고 설립지국에 [[실질적인 사업활동]]이 없으며, [[본점소재지 및 재무지배소재지]]가 모두 다른 국가에 위치하는 경우 그 국가가 국적국으로 간주된다."},{"id":"i234","t":"국가는 [[피해]] 일자로부터 공식청구 제기 일자까지 계속하여 자국 또는 전임국의 국적인 회사와 관련하여 외교적 보호를 행사할 권리를 갖는다."},{"id":"i235","t":"국가는 [[피해]] 일자에 자국 국적이었고, 그 [[피해]]의 결과로 설립지국의 법에 따라 더 이상 존재하지 않는 회사에 대하여는 계속적으로 외교적 보호를 행사할 권리를 갖는다."},{"id":"i236","t":"회사가 [[피해]]와 관련 없는 이유로 더 이상 존재하지 않는 경우에 해당하지 않는 경우, 회사의 [[주주]]의 국적국은 회사의 피해와 관련하여 주주에 대하여 외교적 보호를 행사할 권리가 없다."},{"id":"i237","t":"회사가 [[피해]]일자에 그 피해를 야기한 책임이 있다고 주장되는 국가의 국적을 갖고 있었고, 그 국가에서 사업 수행을 위한 전제조건으로 그 국가에서의 설립이 요구된 경우가 아니면, 주주의 국적국은 회사의 피해와 관련하여 외교적 보호를 행사할 권리가 없다."},{"id":"i238","t":"국가의 국제위법행위가 회사 자체의 권리와 별개로 주주의 권리에 [[직접]]적인 피해를 야기하는 경우, 그 주주의 국적국은 외교적 보호를 행사할 권리를 갖는다."},{"id":"i239","t":"국가는 자국 국적인 또는 난민이나 무국적자에 대한 피해와 관련하여 그 피해를 입은 자가 모든 [[국내구제]]를 완료하기 전에는 국제청구를 제기할 수 없다."},{"id":"i240","t":"국제 청구 또는 그 청구에 관한 [[선언적 판결]]에 대한 요청이 자국 국적인 또는 난민·무국적자의 피해에 [[우세]]하게 기초하여 제기되는 경우, 국내 구제는 완료되어야 한다."},{"id":"i241","t":"[[실효적]] 보상을 제공하는 합리적으로 이용가능한 국내 구제 수단이 없거나 그러한 보상의 합리적 가능성을 제공하지 않는 경우 국내 구제는 완료될 필요가 없다."},{"id":"i242","t":"피해 일자에 피해자와 책임이 있다고 주장되는 국가 사이에 [[관련성 있는 연결고리]]가 존재하지 않는 경우 국내 구제는 완료될 필요가 없다."},{"id":"i243","t":"[[책임]]이 있다고 주장되는 국가가 국내 구제완료의 요건을 포기한 경우 국내 구제는 완료될 필요가 없다."},{"id":"i244","t":"초안 규정은 [[투자보호]]를 위한 조약 규정과 같은 국제법의 특별규칙과 양립하지 않는 범위에서는 적용되지 않는다."},{"id":"i245","t":"선원이 선박에 발생한 피해와 연관되어 피해를 입은 경우, [[선원의 국적국]]이 외교적 보호권을 행사할 권리는 그 선원을 대신하여 보상을 구할 선박의 [[국적국]]의 권리에 의해 영향을 받지 않는다."}]}]},{"id":"i246","title":"대외기관","secs":[{"id":"i247","title":"외교관계협약(1961) 조문","note":"","items":[{"id":"i248","t":"[[외교직원]]은 외교관의 직급을 가진 공관직원을 말한다."},{"id":"i249","t":"[[공관직원]]이라 함은 공관의 외교직원, 행정 및 기능직원 그리고 노무직원을 말한다."},{"id":"i250","t":"공관지역이라 함은 소유자 여하를 불문하고, 공관장의 [[주거]]를 포함하여 공관의 목적으로 사용되는 건물과 건물의 부분 및 부속토지를 말한다."},{"id":"i251","t":"파견국이 1인의 공관장을 여러 국가에 파견하는 경우, 공관장이 상주하지 아니하는 각국에 [[대사대리]]를 장으로 하는 외교공관을 설치할 수 있다."},{"id":"i252","t":"2개국 또는 그 이상의 국가는, [[접수국의 반대가 없는 한]], 동일한 자를 공관장으로 타국에 파견할 수 있다."},{"id":"i253","t":"육·해·공군의 [[무관]]인 경우에는 접수국은 그의 승인을 위하여 사전에 그들의 명단 제출을 요구할 수 있다."},{"id":"i254","t":"공관의 외교직원은 언제라도 철회할 수 있는 접수국측의 [[동의]]가 있는 경우를 제외하고는 접수국의 국적을 가진 자 중에서 임명하여서는 아니된다. (제3국 국민도 동일)"},{"id":"i255","t":"파견국은 접수국의 [[명시적인 사전]] 동의가 없이는, 공관이 설립된 이외의 다른 장소에 공관의 일부를 구성하는 사무소를 설치할 수 없다."},{"id":"i256","t":"신임장이나 신임장의 진정등본 제출순서는 공관장의 [[도착]]일자와 시간에 의하여 결정한다."},{"id":"i257","t":"서열 및 [[의례]]에 관계되는 것을 제외하고는 그들의 계급으로 인한 공관장간의 차별이 있어서는 아니된다."},{"id":"i258","t":"공관장은 그 직무를 개시한 일자와 시간의 순서로 각자의 해당계급내의 [[서열]]이 정하여진다."},{"id":"i259","t":"공관장이 공석이거나 직무를 수행할 수 없을 경우에는 [[대사대리]]가 잠정적으로 공관장으로서 행동한다."},{"id":"i260","t":"접수국에 공관의 외교직원이 없는 경우, 파견국은 접수국의 [[동의]]를 얻어 행정 및 기능직원을 공관의 일상관리 사무를 담당하도록 지명할 수 있다."},{"id":"i261","t":"파견국 및 공관장은 공관지역에 대한 국가, 지방 또는 지방자치단체의 모든 조세와 [[부과금]]으로부터 면제된다."},{"id":"i262","t":"위 조세의 면제는 파견국 또는 공관장과 [[계약을 체결하는 자]]가 접수국의 법률에 따라 납부하여야 하는 조세나 부과금에는 적용되지 아니한다."},{"id":"i263","t":"외교행낭은 상업용항공기의 기장에게 위탁할 수 있다. 동 기장은 포장물의 수를 표시하는 공문서를 소지하여야 하나 [[외교신서사]]로 간주되지는 아니한다."},{"id":"i264","t":"개인부동산에 관한 소송이라도 외교관이 공관의 목적을 위하여 [[파견국]]을 대신하여 소유하는 경우는 민사 및 행정재판 관할권으로부터의 면제를 향유한다."},{"id":"i265","t":"외교관은 [[증인]]으로서 증언을 행할 의무를 지지 아니한다."},{"id":"i266","t":"예외적 강제 집행조치라 하더라도 외교관의 [[신체]]나 주거의 불가침을 침해하지 않는 경우에 취할 수 있다."},{"id":"i267","t":"[[파견국]]은 외교관 및 그 밖에 면제를 향유하는 자에 대한 재판관할권의 면제를 포기할 수 있다."},{"id":"i268","t":"사회보장 규정으로부터의 면제는 외교관에게 전적으로 고용된 개인사용인에게도 적용된다. 단, 개인사용인이 접수국의 [[국민]]이거나 영주자가 아닐 것 등을 조건으로 한다."},{"id":"i269","t":"접수국은 공관의 공용을 위한 물품 등의 보관, 운반 및 이와 유사한 역무에 대한 [[과징금]]은 면제하지 아니한다."},{"id":"i270","t":"외교관의 세대를 구성하는 그의 가족은 [[접수국]]의 국민이 아닌 경우 특권과 면제를 향유한다."},{"id":"i271","t":"공관의 행정 및 기능직원의 민사 및 행정재판 관할권으로부터의 면제는 그들의 [[직무]] 이외에 행한 행위에는 확대되지 아니한다."},{"id":"i272","t":"접수국의 국민이나 영주자가 아닌 공관의 [[노무직원]]은 직무중에 행한 행위에 관하여 면제를 향유하며 보수에 대한 조세 및 사회보장규정으로부터의 면제를 향유한다."},{"id":"i273","t":"접수국의 국민이나 영주자인 외교관은 그의 직무수행 중에 행한 [[공적]] 행위에 대하여서만 재판관할권면제 및 불가침권을 향유한다."},{"id":"i274","t":"특권 및 면제를 받을 권리가 있는 자는 부임차 접수국의 [[영역]]에 들어간 순간부터, 이미 영역내에 있을 경우에는 임명을 외무부에 통고한 순간부터 특권과 면제를 향유한다."},{"id":"i275","t":"공관원으로서의 [[직무]] 수행중에 그가 행한 행위에 관하여는 직무 종료 이후에도 재판관할권으로부터의 면제가 계속 존속한다."},{"id":"i276","t":"외교관이 부임, [[귀임]] 또는 본국으로 귀국하는 도중 사증을 부여한 제3국을 통과하는 경우, 제3국은 불가침권과 통과·귀국에 필요한 기타 면제를 부여하여야 한다."},{"id":"i277","t":"외교관계가 단절되거나 공관이 소환되는 경우, 접수국은 무력충돌의 경우에라도 공관의 재산 및 문서와 더불어 공관지역을 [[존중]]하고 보호하여야 한다."},{"id":"i278","t":"외교관계가 단절되거나 공관이 소환되는 경우, 파견국은 공관지역의 보관을 [[접수국]]이 [[수락]]할 수 있는 제3국에 위탁할 수 있다."},{"id":"i279","t":"외교관의 직무와 무관한 상업적 활동과 관련된 소송의 경우 외교관에 대해 신체와 주거에 대한 침해를 포함한 강제 집행조치를 할 수 있다.","a":"X (신체·주거 침해 불가)","tag":"기출"}]},{"id":"i280","title":"영사관계협약(1963) 조문","note":"","items":[{"id":"i281","t":"[[영사관원]]이라 함은 영사기관장을 포함하여 그러한 자격으로 영사직무의 수행을 위임받은 자를 의미한다."},{"id":"i282","t":"[[영사직원]]이라 함은 영사기관장 이외의 영사관원, 사무직원 및 업무직원을 의미한다."},{"id":"i283","t":"총영사관 또는 영사관이 그 소재 지방 이외의 다른 지방에 부영사관 또는 영사대리사무소의 개설을 원하는 경우에는 [[접수국의 동의]]가 필요하다."},{"id":"i284","t":"영사기관의 소재지 이외의 다른 장소에 기존 영사기관의 일부를 이루는 사무소를 개설하기 위해서도 [[접수국의 명시적 사전 동의]]가 필요하다."},{"id":"i285","t":"파견국 국적 선박과 등록 항공기 및 그 승무원에 대하여 [[파견국]]의 법령에 규정된 감독 및 검사권을 행사하는 것은 영사의 기능이다."},{"id":"i286","t":"파견국은 관계국가 중 어느 한 국가의 [[명시적 반대가 없는 한]], 관계 국가에 통고한 후, 특정국가내에 설치된 영사기관에 대하여 제3국내에서의 영사기능의 수행을 위임할 수 있다."},{"id":"i287","t":"파견국의 영사기관은 [[접수국이 반대하지 아니하는 한]], 접수국에 적절히 통고한 후 제3국을 대표하여 접수국내에서 영사기능을 수행할 수 있다."},{"id":"i288","t":"외교공관의 외교직원이 영사기관장대리로 지정된 경우, 동 외교직원은 접수국이 [[반대하지 아니하는 한]] 외교특권과 면제를 계속 향유한다."},{"id":"i289","t":"파견국은 영사직원을 [[자유로이]] 임명할 수 있다."},{"id":"i290","t":"영사기관원으로 임명된 자는 접수국 도착 전 또는 임무 개시 전에 수락할 수 없는 인물로 선언될 수 있다. 그러한 경우 파견국은 그의 임명을 [[철회]]하여야 한다."},{"id":"i291","t":"영사관계가 단절되는 경우 파견국은 접수국이 [[수락]]하는 제3국에 대하여 영사관사와 그 재산 및 영사문서의 보관을 위탁할 수 있다."},{"id":"i292","t":"접수국은 영사기관장 또는 그가 지정한 자 또는 파견국의 [[외교공관장]]의 동의를 받는 경우를 제외하고, 전적으로 영사기관의 활동을 위하여 사용되는 영사관사의 부분에 들어가서는 아니된다."},{"id":"i293","t":"영사신서사는 접수국의 동의를 받는 경우를 제외하고 접수국의 국민이어서는 아니되고, 파견국의 국민이 아닌 경우에는 접수국의 [[영주자]]이어서는 아니된다."},{"id":"i294","t":"영사행낭은 공인 입국항에 기착되는 [[선박]] 또는 민간항공기의 기장에게 위탁될 수 있다. 동 기장은 영사신서사로 간주되지 아니한다."},{"id":"i295","t":"구금된 국민을 대신하여 영사관원이 조치를 취하는 것을 동 국민이 [[명시적으로 반대]]하는 경우에, 동 영사관원은 그러한 조치를 삼가하여야 한다."},{"id":"i296","t":"영사기관장 그 자신이 형사 조치의 대상이 되는 경우에 접수국은 [[외교경로]]를 통하여 [[파견국]]에 통고하여야 한다."},{"id":"i297","t":"영사관원 또는 사무직원은 파견국의 [[대리인]]으로서 명시적·묵시적으로 체결하지 아니한 계약으로부터 제기되는 민사소송에서 면제되지 아니한다."},{"id":"i298","t":"영사기관원은 파견국의 법에 관하여 [[감정인]]으로서 증언하는 것을 거부하는 권리를 가진다."},{"id":"i299","t":"각국은 명예영사관원을 임명하거나 접수하는 것을 결정하는 [[자유]]를 가진다."}]},{"id":"i300","title":"영사협약 관련 판례","note":"LaGrand, Medellín, Avena는 기출. Jadhav 사건 출제 가능성 높음. 판례–쟁점–결론 연결.","items":[{"id":"i301","t":"1998년 Breard사건에서 미국 연방대법원은 영사관계협약 제36조가 자기집행적이라고 가정하더라도 그 권리 주장은 미국 국내 형사절차의 절차적 포기 원칙에 종속되어 국내법을 우회할 수 없다고 판시하였다."},{"id":"i302","t":"2008년 Medellín v. Texas 사건에서 미국 연방대법원은 ICJ 판결은 이행입법 없이는 미국 국내에서 자기집행적 효력을 가지지 않으며 주 법원을 구속할 수 없다고 판시하였다."},{"id":"i303","t":"2019년 Jadhav (India v. Pakistan) 사건에서 ICJ는 국가안보·간첩 사건이라 하더라도 제36조의 영사통보·접촉권은 적용되며, 파키스탄은 형사절차의 효과적인 재검토와 재심을 제공할 의무가 있다고 판단하였다."},{"id":"i304","t":"2001년 LaGrand (Germany v. United States) 사건에서 ICJ는 제36조가 개인에게도 적용되는 권리를 포함하며, 미국은 그 위반에 대해 형사절차의 재검토와 재심을 보장할 의무가 있다고 판시하였다."},{"id":"i305","t":"1999년 LaGrand 잠정조치 사건에서 ICJ는 회복 불가능한 손해 위험이 있다고 보아 직권으로(proprio motu) 미국에 대해 사형 집행을 잠정적으로 정지할 것을 명령하였다."},{"id":"i306","t":"2001년 LaGrand 사건에서 ICJ는 ICJ 규정 제41조에 따른 잠정조치가 법적 구속력을 가진다고 보았고, 제41조의 ‘indicate’는 프랑스어 정본 ‘indiquer’에 비추어 비구속성을 의미하지 않으며, 유엔헌장 제94조 제1항에 따라 잠정조치 역시 당사국을 구속한다고 판시하였다."},{"id":"i307","t":"2010년 Diallo (Guinea v. DRC) 사건에서 ICJ는 디알로가 제3자를 통해 영사접견권의 존재를 인지하고 있었다고 하더라도, 체포국이 영사통보·접촉권을 직접 고지하지 않았다면 의무 위반은 성립한다고 판시하였다."},{"id":"i308","t":"2004년 Park v. Shin 사건에서 미국 연방지방법원은 주뉴욕 대한민국 총영사 부부가 개인적으로 고용한 가사도우미와의 근로관계는 사적 행위(acta jure gestionis)에 해당하므로 면제가 적용되지 않는다고 판시하였다."},{"id":"i309","t":"2004년 Avena 사건에서 ICJ는 제36조상 영사통보·접촉 의무는 체포·구금 시점에 즉시 성립하는 국가 간 의무로서, 국가의 협약상 의무 위반에 관한 분쟁이므로 국내 구제절차 완료 원칙은 적용되지 않는다고 판시하였다."},{"id":"i310","t":"2004년 Avena 사건에서 ICJ는 미국의 제36조 위반을 인정하고, 미국은 국내 절차 규칙과 무관하게 형사판결에 대한 효과적인 재검토와 재심(review and reconsideration)을 제공할 의무가 있다고 판시하였다."}]}]},{"id":"i311","title":"국가승계","secs":[{"id":"i312","title":"국가승계 예상논점","note":"78년조약, 83년조약, 사례(독일/소련/기타)가 출제범위. 승계유형별 법리가 달라지므로 유형별 암기 필요.","items":[{"id":"i313","t":"「국가승계에 관련된 자연인의 국적」(2000)에 의하면, 영토의 일부 이전시 승계국은 이전된 영토 내에 [[상거소]]를 갖는 자에게 자국적을 부여하며, 기존 국적 유지를 선택하지 않는 한 선행국 국적은 철회됨을 원칙으로 한다."},{"id":"i314","t":"위 문서에 의하면, 하나의 국가가 복수의 국가로 해체되는 경우 개인의 국적 선택권이 존중되어야 하며, 의사가 표시되지 않는 경우 [[상거소지국]]의 국적이 부여된다."},{"id":"i315","t":"83년조약에 의하면 영토의 일부이전 시 합의가 없는 경우 이전된 영토 내의 국유 부동산은 [[승계국]]에 이전된다."},{"id":"i316","t":"83년조약에 의하면 신생독립의 경우 식민지 안에 있던 전임국가의 국유부동산은 신생독립국에게 [[이전된다]]."},{"id":"i317","t":"83년조약에 의하면 분리독립의 경우 합의가 없으면 분리된 영토 내 국유부동산은 [[신국가]]에 이전된다."},{"id":"i318","t":"83년조약에 의하면 분열의 경우 전임국의 영토 밖에 위치한 국유부동산은 [[형평]]한 비율로 신국가에 이전된다."},{"id":"i319","t":"83년 조약에 의하면 신생독립의 경우 전임국가의 부채는 신생독립국에 이전[[되지 않는다]]."},{"id":"i320","t":"83년 조약에 의하면 분리독립의 경우 전임국가의 부채는 [[형평]]한 비율로 신 국가에 이전된다."},{"id":"i321","t":"78년조약에 의하면 [[처분적]] 조약은 승계 발생 사유와 무관하게 승계가 인정된다."},{"id":"i322","t":"일단 국경조약이 유효하게 성립되면 그에 따른 국경은 그 근거가 된 조약의 [[지속]]여부와 관계없이 효력을 유지한다."},{"id":"i323","t":"78년조약에 의하면 [[외국군대기지]] 설정 조약은 승계의무가 없다."},{"id":"i324","t":"78년 조약에 의하면 비처분적조약에 있어서 신생독립국은 다자조약은 기탁소에 통고, 양자조약은 [[합의]]를 통해 전임국이 체결한 조약을 승계할 수 있다."},{"id":"i325","t":"78년 조약에 의하면 다자조약 승계 통고시 신생국은 [[독립일]]로부터 당사국 지위를 인정받으나, 독립일과 승계통고일 사이의 기간에는 적용이 정지된다."},{"id":"i326","t":"78년 조약에 의하면 다자조약 승계 [[통고]]시 신생국은 별다른 의사표시를 하지 않으면 선행국의 유보도 유지한다고 간주되나, 새로운 유보를 첨부하거나 기존 유보를 변경할 수도 있다."},{"id":"i327","t":"78년 조약에 의하면 국가통합시 원칙적으로 조약은 통합 전 영토에 대해 적용되나, 다자조약은 [[통고]], 양자조약은 [[합의]]를 조건으로 확장 적용할 수 있다."},{"id":"i328","t":"78년 협약에 의하면 신생독립국이 식민지 관련 양자조약을 승계하기 위해서는 그 타국 사이에 합의가 있어야 하나, 이 합의는 [[명시적]] 합의임을 요하지 아니하므로 행동으로부터 추론될 수도 있다."},{"id":"i329","t":"제노사이드협약 적용 사건(ICJ)에서 [[인권조약]]의 자동승계여부가 문제되었으나, 다수의견은 특별한 입장을 표명하지 않았다."},{"id":"i330","t":"다자조약의 경우 [[러시아]]는 구소련의 조약을 승계하였다."},{"id":"i331","t":"다자조약의 경우 [[CIS국가들]]은 일률적으로 승계 또는 불승계하지 않고, 필요에 따라 별도로 가입하였다."},{"id":"i332","t":"서독이 체결한 조약은 [[조약국경이동의원칙]]에 따라 구동독지역에 확장 적용하였다."},{"id":"i333","t":"구동독이 체결한 양자조약은 [[신뢰보호]], 관련당사자 이익, 자유민주적 기본질서에 반하는지 여부 등을 고려하여 승계, 종료, 개정하였다."},{"id":"i334","t":"세르비아-[[몬테네그로]]는 유고 연방 공화국이라는 명칭으로 UN에 신규 가입했다."},{"id":"i335","t":"Gabčíkovo–Nagymaros 사건에서 ICJ는 1977년 조약이 영토와 불가분적으로 결합된 객관적 체제를 형성하는 조약이라는 점을 근거로 [[슬로바키아]]가 조약상의 권리·의무를 승계한다고 판단하였다."},{"id":"i336","t":"Genocide Convention (Bosnia v. Yugoslavia)(1996)에서 ICJ는 FRY의 승계국 여부를 명시적으로 판단하지 않으면서도 [[집단살해협약]]의 당사국 지위를 전제로 관할권을 인정하였다."},{"id":"i337","t":"Legality of Use of Force (2004)에서 ICJ는 유고연방이 승계국 지위를 자동적으로 취득한 것이 아니라고 보아 조약 및 UN 회원국 지위의 자동 승계를 [[부정]]하였다."},{"id":"i338","t":"Genocide Convention (Bosnia v. Serbia and Montenegro)(2007)에서 ICJ는 세르비아가 승계국 지위를 자동 취득한 것은 아니라고 보면서도 집단살해협약은 국가의 [[의사]]와 국제적 인정에 따라 적용될 수 있음을 전제로 책임을 판단하였다."},{"id":"i339","t":"Territorial Dispute (Libya v. Chad)에서 ICJ는 1955년 조약에 의해 설정된 [[국경]]이 차드의 독립 이후에도 유지된다고 보아 [[국경]] 설정 조약은 국가승계 시에도 계속 효력을 가진다고 판시하였다."},{"id":"i340","t":"코소보는 2008년 분리독립 이후 조약을 자동 승계하지 않고 [[백지출발주의]]에 따라 필요한 조약만 승계 선언 또는 신규 가입을 통해 선택적으로 수용하였다."},{"id":"i341","t":"조선총독부가 관리하던 재산에 관하여 대법원은 식민지 통치기관이 관리하던 공공재산이라는 점에서 [[대한민국]]에 귀속된다고 보았다."},{"id":"i342","t":"오스트리아 법원은 국가승계는 일률적으로 인정되는 것이 아니라 관련 국가들의 [[합의]]나 개별적 사정에 따라 결정된다고 판시하였다."}]}]}]},{"id":"i343","title":"INTL LAW Ⅱ","chapters":[{"id":"i344","title":"UN","secs":[{"id":"i345","title":"UN헌장 조문","note":"","items":[{"id":"i346","t":"안전보장이사회의 방지조치 또는 강제조치의 대상이 되는 회원국에 대하여는 총회가 안보리의 권고에 따라 회원국으로서의 권리와 특권의 행사를 정지시킬 수 있다. 이러한 권리와 특권의 행사는 [[안전보장이사회]]에 의하여 회복될 수 있다."},{"id":"i347","t":"총회는 모든 국제연합회원국으로 구성된다. 회원국은 총회에 [[5]]인 이하의 대표를 가진다."},{"id":"i348","t":"안보리가 어떠한 분쟁 또는 사태와 관련하여 임무를 수행하고 있는 동안에는 총회는 안보리가 [[요청]]하지 아니하는 한 어떠한 권고도 하지 아니한다."},{"id":"i349","t":"[[총회]]는 국제신탁통치제도에 관한 임무를 수행한다. 이 임무는 [[전략지역]]으로 지정되지 아니한 지역에 관한 신탁통치 협정의 승인을 포함한다."},{"id":"i350","t":"총회는 [[전문기구]]와의 재정약정 및 예산약정을 심의·승인하며, 당해 [[전문기구]]에 권고할 목적으로 그 행정적 예산을 검사한다."},{"id":"i351","t":"분담금 연체 금액이 그때까지의 만 [[2]]년간 지불하였어야 할 분담금의 금액과 같거나 초과하는 경우 총회에서 투표권을 가지지 못한다."},{"id":"i352","t":"총회 [[특별회기]]는 안보리의 요청 또는 회원국의 과반수의 요청에 따라 사무총장이 소집한다."},{"id":"i353","t":"안전보장이사회의 비상임이사국은 [[2]]년의 임기로 선출된다."},{"id":"i354","t":"분쟁의 평화적 해결에 관한 결정 및 지역적 기관의 분쟁의 평화적 해결에 관한 결정에 있어서는 [[분쟁당사국]]은 투표를 기권한다."},{"id":"i355","t":"안보리는 분쟁의 평화적 해결에 관한 권고를 함에 있어서 일반적으로 [[법률적]] 분쟁이 ICJ규정에 따라 동 재판소에 회부되어야 한다는 점도 고려하여야 한다."},{"id":"i356","t":"안보리는 어떠한 분쟁에 관하여도 모든 당사자가 [[요청]]하는 경우 그 분쟁의 평화적 해결을 위하여 그 당사자에게 [[권고]]할 수 있다."},{"id":"i357","t":"[[군사참모위원회]]는 안전보장이사회 [[상임이사국]]의 참모총장 또는 그의 대표로 구성된다."},{"id":"i358","t":"[[군사참모위원회]]는 안보리의 허가를 얻어 적절한 지역기구와 협의한 후 [[지역소위원회]]를 설치할 수 있다."},{"id":"i359","t":"경제사회이사회는 총회에 의하여 선출된 [[54]]개 회원국으로 구성된다. 18개 이사국은 3년의 임기로 매년 선출되며 연이어 재선될 자격이 있다."},{"id":"i360","t":"경제사회이사회가 전문기구와 체결하는 제휴관계 협정은 [[총회]]의 승인을 받아야 한다."},{"id":"i361","t":"경제사회이사회는 회원국 및 전문기구의 요청이 있을 때에는 [[총회]]의 승인을 얻어 용역을 제공할 수 있다."},{"id":"i362","t":"경제사회이사회는 비정부간 기구와 협의 약정을 체결할 수 있으며, 적절한 경우에는 관련 회원국과의 [[협의]] 후에 국내기구와도 체결할 수 있다."},{"id":"i363","t":"국제연합회원국간의 관계는 [[주권평등]]원칙의 존중에 기초하므로 신탁통치제도는 회원국이 된 지역에 대하여는 적용하지 아니한다."},{"id":"i364","t":"전략지역에 관한 국제연합의 모든 임무는 신탁통치협정의 조항과 그 변경 또는 개정의 승인을 포함하여 [[안전보장이사회]]가 행한다."},{"id":"i365","t":"전략지역으로 지정되지 아니한 모든 지역에 대한 신탁통치협정과 관련된 임무는 [[총회]]가 수행한다."},{"id":"i366","t":"신탁통치이사회는 시정국, 시정하지 아니하는 상임이사국, 총회에 의하여 [[3]]년의 임기로 선출된 다른 회원국으로 구성한다."},{"id":"i367","t":"회원국이 아닌 국가는 [[안전보장이사회]]의 권고에 의하여 [[총회]]가 각 경우에 결정하는 조건으로 ICJ규정의 당사국이 될 수 있다."},{"id":"i368","t":"사건의 당사자가 판결에 따른 의무를 이행하지 아니하는 경우에는 타방 당사자는 [[안전보장이사회]]에 제소할 수 있다."},{"id":"i369","t":"[[총회]]에 의하여 권한이 부여된 다른 기관 및 전문기구도 그 [[활동범위]] 안에서 발생하는 [[법적]] 문제에 관하여 권고적 의견을 요청할 수 있다."},{"id":"i370","t":"사무총장은 국제평화와 안전의 유지를 위협한다고 인정하는 어떠한 사항에도 [[안전보장이사회]]의 주의를 환기할 수 있다."},{"id":"i371","t":"헌장의 개정은 총회 구성국의 [[3분의 2]]의 투표에 의하여 채택되고, 모든 상임이사국을 포함한 회원국의 [[3분의 2]]에 의하여 비준되었을 때 발효한다."}]},{"id":"i372","title":"UN 기출 OX","note":"","items":[{"id":"i373","t":"중요한 문제에 관한 총회의 결정은 출석하여 투표하는 회원국 2/3 이상의 찬성으로 가결되며, 기권은 투표로 간주하지 않는다.","a":"O"},{"id":"i374","t":"「국제연맹규약」은 규약을 위반하여 전쟁을 개시한 회원국에 대해 일정한 경제제재조치를 취할 의무를 다른 모든 회원국에 부과하고 있다.","a":"O"}]},{"id":"i375","title":"UN 특권면제협약(1946)","note":"","items":[{"id":"i376","t":"국제연합의 재산 및 자산은 소재지 및 보유주체에 관계없이 수색·징발·몰수·[[수용]] 및 그 밖의 모든 형태의 간섭으로부터 면제된다."},{"id":"i377","t":"국제연합이 공적 사용을 위하여 수입 또는 수출하는 물품의 경우 [[관세]] 및 수출입상의 금지와 제한으로부터 면제된다."},{"id":"i378","t":"국제연합은 암호를 사용하고, [[외교]]신서사 및 [[외교]]행낭과 동일한 면제와 특권을 가지는 신서사 또는 봉인행낭에 의하여 서한을 발송·접수할 권리를 가진다."},{"id":"i379","t":"회원국 대표는 수입되는 물품([[개인수하물]]의 일부가 아닌 경우)에 대한 관세, 물품세 또는 판매세로부터의 면제를 주장할 권리를 가지지 아니한다."},{"id":"i380","t":"회원국 대표의 직무수행상 구두·서면진술 및 행위에 대한 법적 절차로부터의 면제는 대표자격을 [[상실]]한 후에도 계속 부여된다."},{"id":"i381","t":"[[회원국]]은 자국 대표에 대한 면제가 사법절차를 방해한다고 판단하고, 면제 목적을 저해함이 없이 포기될 수 있는 경우 그 면제를 포기할 권리뿐만 아니라 의무도 있다."},{"id":"i382","t":"국제연합의 직원은 [[공적]] 자격으로 행한 구두 또는 서면진술 및 모든 행위에 대한 법적 절차로부터 면제된다."},{"id":"i383","t":"사무총장과 모든 사무차장보 본인, 배우자 및 미성년 자녀에 대해서는 국제법에 따라 [[외교]] 사절에게 부여되는 특권과 면제가 부여된다."},{"id":"i384","t":"[[사무총장]]은 직원에 대한 면제가 사법절차를 방해하고, UN의 이익을 저해함이 없이 포기될 수 있다고 판단하는 경우 그 면제를 포기할 권리와 의무가 있다."},{"id":"i385","t":"UN을 위하여 임무를 수행하는 전문가는 임무와 관련된 [[여행]]시간을 포함한 임무수행 기간 동안 필요한 특권과 면제가 부여된다."},{"id":"i386","t":"전문가는 [[임무수행]] 중에 행한 구두 또는 서면진술 및 행위에 대한 모든 종류의 법적 절차로부터의 면제가 인정된다."},{"id":"i387","t":"전문가에게 부여되는 위 법적 절차로부터의 [[면제]]는 UN을 위한 임무에 더 이상 고용되어 있지 아니한 경우에도 계속 부여된다."},{"id":"i388","t":"[[UN사무총장]]은 전문가에 대한 면제가 사법절차를 방해하고 UN의 이익을 저해함이 없이 포기될 수 있는 경우 그 면제를 포기할 권리와 의무가 있다."},{"id":"i389","t":"국제연합은 그 직원에게 국제연합 [[통행증]]을 발급할 수 있으며, 이는 회원국 당국에 의하여 유효한 여행문서로서 인정되고 수락된다."},{"id":"i390","t":"사증이 요구되는 경우 국제연합 [[통행증]] 소지자의 사증신청은 UN 업무 여행 증명서가 구비되어 있을 경우 가능한 한 신속히 처리된다."},{"id":"i391","t":"국제연합 [[통행증]]의 소지자는 아니지만 UN 업무 여행 증명서를 소지한 전문가 등에게는 [[통행증]] 소지자에게 주어지는 것과 유사한 편의가 부여된다."},{"id":"i392","t":"UN의 업무로 [[통행증]]을 소지하고 여행하는 사무총장·사무차장보 및 국장에게는 [[외교사절]]에게 부여되는 것과 동일한 편의가 부여된다."},{"id":"i393","t":"다른 해결방식에 합의하지 아니하는 한, 협약의 해석 또는 적용으로부터 발생하는 모든 불일치는 [[국제사법재판소]]에 회부된다."},{"id":"i394","t":"UN과 회원국 사이에 불일치가 발생하는 경우에는 관련된 모든 법적 문제에 대하여 [[권고적 의견]]을 요청하며, 양 당사자는 재판소의 [[의견]]을 확정적인 것으로 수락한다."},{"id":"i395","t":"이 협약에 대한 가입은 [[국제연합 사무총장]]에게 가입서를 기탁함으로써 이루어진다."}]},{"id":"i396","title":"UN 전문기구 특권면제협약(1947)","note":"","items":[{"id":"i397","t":"전문기구, 그 재산 및 자산은 전문기구가 [[명시적으로]] 면제를 포기한 경우를 제외하고 모든 형태의 법적 절차로부터의 면제를 누린다."},{"id":"i398","t":"어떤 면제의 포기도 [[강제집행]]조치에까지 적용되지는 아니하는 것으로 양해된다."},{"id":"i399","t":"전문기구의 재산 및 자산은 수색·징발·몰수·[[수용]] 및 그 밖의 모든 형태의 간섭으로부터 면제된다."},{"id":"i400","t":"전문기구가 공적 사용을 위하여 수입 또는 수출하는 물품의 경우 [[관세]] 및 수출입상의 금지와 제한으로부터 면제된다."},{"id":"i401","t":"일반적으로 전문기구는 [[물품]]세와 가격의 일부를 이루는 판매세로부터의 면제를 주장하지 아니할 것이다."},{"id":"i402","t":"전문기구는 암호를 사용하고, [[외교]]신서사 및 [[외교]]행낭과 동일한 면제와 특권을 가지는 신서사 또는 봉인행낭에 의하여 서한을 발송·접수할 권리를 가진다."},{"id":"i403","t":"전문기구 회의에 참석하는 회원국 대표의 [[직무]]수행상 진술 및 행위에 관한 면제는 더 이상 그러한 [[직무]]의 수행에 종사하지 아니하더라도 계속 부여된다."},{"id":"i404","t":"[[회원국]]은 자국 대표에 대한 면제가 사법절차를 방해한다고 판단하는 경우 그 면제를 포기할 권리뿐만 아니라 의무도 있다."},{"id":"i405","t":"전문기구의 직원은 [[공적]] 자격으로 행한 구두 또는 서면진술 및 모든 행위에 관한 법적 절차로부터 면제된다."},{"id":"i406","t":"전문기구의 직원은 봉급 및 수당에 대하여 [[국제연합]]의 직원이 누리는 것과 동일한 조건으로 조세로부터의 면제를 누린다."},{"id":"i407","t":"전문기구의 직원은 국제적 위기 시에 배우자 및 부양가족과 더불어 [[외교]]공관의 상응하는 직급의 직원과 동일한 귀환편의가 부여된다."},{"id":"i408","t":"전문기구의 직원은 [[최초로 해당국가에 부임]]할 때에 그 가구 및 소유물을 면세로 수입할 권리를 가진다."},{"id":"i409","t":"전문기구 직원의 국민적 역무상 의무 면제는, 그들이 국민인 국가와의 관계에서는 [[직무]]를 이유로 명단에 기재된 직원에 한한다."},{"id":"i410","t":"전문기구의 사무장, 그를 대행하는 직원, 이들의 배우자 및 미성년 자녀에 대해서는 [[외교사절]]에게 부여되는 특권과 면제가 부여된다."},{"id":"i411","t":"[[각 전문기구]]는 직원에 대한 면제가 사법절차를 방해하고 전문기구의 이익을 저해함이 없이 포기될 수 있다고 판단하는 경우 그 면제를 포기할 권리와 의무가 있다."},{"id":"i412","t":"특권·면제의 남용에 관한 협의가 만족스러운 결과를 가져오지 못하는 경우, 남용 여부에 관한 문제는 [[국제사법재판소]]에 제소된다."},{"id":"i413","t":"전문기구의 직원은 [[국제연합 사무총장]]과 전문기구의 권한 있는 당국 간에 체결되는 행정적 약정에 따라 국제연합 통행증을 사용할 권리를 가진다."},{"id":"i414","t":"다른 해결방식에 합의하지 아니하는 한, 협약의 해석·적용으로부터 발생하는 모든 불일치는 [[국제사법재판소]]에 회부된다."},{"id":"i415","t":"전문기구와 [[회원국]] 사이에 불일치가 발생하는 경우 권고적 의견을 요청하며, 양 당사자는 재판소의 의견을 확정적인 것으로 수락한다."},{"id":"i416","t":"통행증을 소지하고 여행하는 전문기구의 사무장, 사무장보 및 [[국장급]] 이상의 직원에게는 외교공관의 상응하는 직급의 직원과 동일한 여행상의 편의가 부여된다."}]},{"id":"i417","title":"냉전기(1945–1991) 주요 안보리결의","note":"","items":[{"id":"i418","t":"결의 82호(1950.6.25): 당시 [[소련]]은 중국 대표권 문제로 안보리를 보이콧하고 있어 거부권을 행사하지 못하였다. 안보리는 북한의 공격을 [[평화의 파괴]](breach of the peace)로 규정하고 적대행위 중단과 북한군 철수를 요구하였다."},{"id":"i419","t":"결의 83호(1950.6.27): 안보리는 회원국들에게 대한민국을 지원하기 위한 군사적 원조를 제공할 것을 [[권고]]하였고, 영국·캐나다·호주·터키 등 [[16]]개국이 전투병을 파견하였다."},{"id":"i420","t":"결의 84호(1950.7.7): 안보리는 미국이 주도하는 유엔군 통합사령부 설치를 승인하고 유엔기 사용을 허가하였다. [[더글러스 맥아더]] 장군이 유엔군 총사령관으로 임명되었다."},{"id":"i421","t":"결의 221호(1966.4.9): 남로디지아 백인정권이 [[영국]]의 반대에도 일방적으로 독립을 선언하자, 안보리는 [[영국]]이 베이라항으로 향하는 유조선을 차단할 수 있도록 승인하였다. 냉전기 안보리가 명시적으로 [[무력]]조치를 승인한 대표 사례이다."},{"id":"i422","t":"결의 242호(1967.11.22): 제3차 중동전쟁에서 이스라엘이 [[시나이]]반도·가자지구·서안지구·동예루살렘·골란고원을 점령하자 안보리는 영토 획득을 위한 전쟁의 불허 원칙을 확인하고 이스라엘군 철수를 요구하였다."},{"id":"i423","t":"결의 418호(1977.11.4): 남아공의 [[아파르트헤이트]] 정책에 대해 안보리는 의무적인 무기금수조치를 부과하였다. 인권 문제를 이유로 채택된 대표적인 강제제재 사례이다."},{"id":"i424","t":"결의 435호(1978.9.29): [[남아프리카공화국]]이 점령 중이던 나미비아에 대해 유엔 감독 아래 자유선거 실시와 독립 절차를 승인하였다(1990년 독립)."},{"id":"i425","t":"결의 598호(1987.7.20): [[1980]]년부터 계속된 이란-이라크 전쟁에 대해 즉각적인 휴전과 국제감시단 파견을 요구하였다."},{"id":"i426","t":"결의 678호(1990.11.29): 이라크가 1991년 1월 15일까지 쿠웨이트에서 철수하지 않을 경우 회원국들이 “[[모든 필요한 수단(all necessary means)]]”을 사용할 수 있도록 승인하였다."},{"id":"i427","t":"결의 688호(1991.4.5): 걸프전 이후 [[이라크]] 정부가 쿠르드족과 시아파를 탄압하자 민간인 탄압 중단과 인도주의 기구의 접근 허용을 요구하였다. 무력사용을 명시적으로 승인하지는 않았지만 미·영·프는 이를 근거로 비행금지구역을 설정하였다."}]}]},{"id":"i428","title":"개인","secs":[{"id":"i429","title":"난민협약(1951) 조문","note":"","items":[{"id":"i430","t":"“[[1951]]년 1월 1일 이전에 발생한 사건”이라는 용어는 [[1951]]년 1월 1일 이전에 유럽에서 발생한 사건 또는 [[1951]]년 1월 1일 이전에 유럽 또는 기타 지역에서 발생한 사건 중 어느 하나를 의미하며, 각 체약국은 서명·비준·가입시에 선택하는 선언을 행한다."},{"id":"i431","t":"이 협약은 [[국제연합난민고등판무관]] 외에 국제연합의 기관이나 기구로부터 보호 또는 원조를 현재 받고 있는 자에게는 적용하지 아니한다."},{"id":"i432","t":"체약국은 난민에게 협약이 더 유리한 규정을 두고 있는 경우를 제외하고, 일반적으로 [[외국인]]에게 부여하는 대우와 동등한 대우를 부여한다."},{"id":"i433","t":"모든 난민은 체약국의 영역내에서 [[3]]년간 거주한 후 그 영역내에서 입법상의 [[상호주의]]로부터의 면제를 받는다."},{"id":"i434","t":"난민의 개인적 지위는 [[주소지]] 국가의 법률에 의하거나 주소가 없는 경우에는 [[거소지]] 국가의 법률에 의하여 규율된다."},{"id":"i435","t":"공급이 부족한 물자의 배급제도가 존재하는 경우, 난민은 [[내국민]]에게 부여되는 대우와 동일한 대우를 부여받는다."},{"id":"i436","t":"체약국은 난민에게 유사한 상태에 있는 [[자국민]]에
