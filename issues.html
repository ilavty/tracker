게 과하고 있는 조세 기타 공과금 이외의 공과금을 과하지 아니한다."},{"id":"i437","t":"체약국은 국가안보 또는 [[공공질서]]를 이유로 하는 경우를 제외하고 합법적으로 그 영역에 있는 난민을 추방하여서는 아니된다."},{"id":"i438","t":"그 국가의 [[안보]]에 위험하다고 인정되기에 충분한 이유가 있는 자 또는 특히 중대한 [[범죄]]에 관하여 유죄판결이 확정되고 공동체에 대하여 위험한 존재가 된 자는 강제송환금지 규정의 이익을 요구하지 못한다."},{"id":"i439","t":"협약의 해석 또는 적용에 관한 분쟁으로서 다른 방법에 의하여 해결될 수 없는 것은 분쟁당사국 중 어느 일당사국의 요청에 의하여 [[국제사법재판소]]에 부탁된다."}]},{"id":"i440","title":"난민 논점","note":"","items":[{"id":"i441","t":"난민협약은 [[유럽]] 지역에서 발생한 난민을 대상으로 하나 체약국은 유럽 이외 지역에서 발생한 난민도 보호대상으로 할 것을 선언할 수 있다."},{"id":"i442","t":"난민협약 관련 분쟁이 해결되지 않은 경우 [[국제사법재판소]]에 일방적으로 제소할 수 있다."},{"id":"i443","t":"난민협약에 의하면 합법체류 난민은 [[국가안보]], 공공질서 이유를 제외하고는 추방될 수 없다."},{"id":"i444","t":"난민자격 부여 이후 임의로 국적국의 보호를 다시 받는 경우 등에는 난민자격을 상실하며, 이 경우 일반 [[외국인]] 지위를 갖는다."},{"id":"i445","t":"우리나라에서 난민신청이유는 [[종교]]적 이유와 정치적 이유가 가장 많다."},{"id":"i446","t":"난민은 체약국 영역에서 [[3]]년간 거주 후 입법상의 상호주의로부터 면제를 받는다."},{"id":"i447","t":"개인이 국적국이나 상주국을 떠난 뒤 외국 땅에서 추후 난민이 되는 경우를 [[현장]] 난민이라고 한다."},{"id":"i448","t":"국내피난민 혹은 국내[[실향민]]은 거주지에서 쫓겨났지만 국제적으로 승인된 국경선을 넘지는 않은 사람들을 지칭한다."},{"id":"i449","t":"자국 주재 외교공관에 진입하여 외교비호를 받는 개인은 난민의 지위를 주장할 수 없다. 외교공관은 국제법상 그리고 국내법상 [[접수국]]의 영토이고 그는 여전히 자국 영토 안에 있기 때문이다."},{"id":"i450","t":"[[법정난민]]이란 난민협약 발효 이전의 국제문서에 의거하여 이미 국제난민 지위를 인정받은 사람들로서 난민협약상 보호대상이다."},{"id":"i451","t":"강제송환금지원칙은 [[난민]] 자격을 인정받지 못한 자에 대해서도 적용된다."},{"id":"i452","t":"강제송환금지원칙은 난민이 체류국의 [[안전]]을 위협하거나 중대한 범죄로 유죄판결을 받아 공동체에 위협을 주는 자에 대해서는 적용되지 않는다."},{"id":"i453","t":"강제송환금지원칙은 [[불법]] 입국자에 대해서도 적용된다."},{"id":"i454","t":"난민고등판무관(UNHCR)은 사무총장의 지명에 따라 총회에서 선출되며 임기는 [[5]]년이며 연임할 수 있다."}]},{"id":"i455","title":"대한민국 난민법","note":"","items":[{"id":"i456","t":"대한민국 안에 있는 외국인으로서 난민인정을 받으려는 사람은 [[법무부]]장관에게 난민인정 신청을 할 수 있다."},{"id":"i457","t":"법무부장관은 출입국항에서 난민인정신청서를 제출한 사람에 대하여 신청서가 제출된 날부터 [[7]]일 이내에 심사 회부 여부를 결정하여야 하며, 그 기간 안에 결정하지 못하면 입국을 허가하여야 한다."},{"id":"i458","t":"난민인정 등의 결정은 신청서를 접수한 날부터 [[6]]개월 안에 하여야 한다. 다만, 부득이한 경우에는 [[6]]개월의 범위에서 기간을 정하여 연장할 수 있다."},{"id":"i459","t":"법무부장관은 난민에 해당하지 아니한다고 결정하는 경우에는 그 사유와 [[30]]일 이내에 이의신청을 제기할 수 있다는 뜻을 적은 난민불인정결정통지서를 교부한다."},{"id":"i460","t":"난민에 해당한다고 인정하는 경우에도 [[유엔난민기구(UNHCR)]] 외에 유엔의 다른 기구 또는 기관으로부터 보호 또는 원조를 현재 받고 있는 경우에는 난민불인정결정을 할 수 있다."},{"id":"i461","t":"난민에 해당한다고 인정하는 경우에도 세계평화에 반하는 범죄, [[전쟁]]범죄 또는 인도주의에 반하는 범죄를 저지른 경우에는 난민불인정결정을 할 수 있다."},{"id":"i462","t":"난민에 해당한다고 인정하는 경우에도 입국 전 대한민국 밖에서 중대한 [[비정치적]] 범죄를 저지른 경우에는 난민불인정결정을 할 수 있다."},{"id":"i463","t":"난민불인정결정을 받은 사람 또는 난민인정이 취소·철회된 사람은 통지를 받은 날부터 [[30]]일 이내에 [[법무부]]장관에게 이의신청을 할 수 있다."},{"id":"i464","t":"법무부장관은 이의신청서를 접수한 날부터 [[6]]개월 이내에 결정을 하여야 한다. 다만, 부득이한 경우에는 [[6]]개월의 범위에서 연장할 수 있다."},{"id":"i465","t":"난민인정결정이 거짓 서류의 제출이나 거짓 진술 또는 사실의 은폐에 따른 것으로 밝혀진 경우에는 난민인정을 [[취소]]할 수 있다."},{"id":"i466","t":"난민인정자가 자발적으로 국적국의 보호를 다시 받는 경우, 국적 회복, 새로운 국적 취득, 자유로운 의사로 재정착, 사유 소멸 등의 경우에는 난민인정결정을 [[철회]]할 수 있다."},{"id":"i467","t":"대한민국에 체류하는 난민인정자는 다른 법률에도 불구하고 [[난민협약]]에 따른 처우를 받는다."},{"id":"i468","t":"난민으로 인정되어 국내에 체류하는 외국인은 타 법률에도 불구하고 [[대한민국 국민]]과 같은 수준의 사회보장을 받는다."}]},{"id":"i469","title":"국적 기출 OX","note":"","items":[{"id":"i470","t":"「국적법」에 따르면 대한민국의 국민으로서 자진하여 외국 국적을 취득한 사람은 법무부장관이 그 외국 국적의 취득을 승인한 경우 대한민국 국적을 상실한다.","a":"X (승인 불요)"}]},{"id":"i471","title":"범죄인인도","note":"","items":[{"id":"i472","t":"관행에 의하면 인도 청구 경합시 동일한 범죄로 청구한 경우 [[속지주의]]가 우선이며, [[속지주의]]국가가 없는 경우 먼저 청구한 측에 인도한다."},{"id":"i473","t":"유럽범죄인인도협약(1957)은 자국민 여부 결정에 있어서 [[인도]]에 관한 결정의 시로 규정한다."},{"id":"i474","t":"유럽범죄인인도조약은 [[1]]년 이상의 자유형을 인도대상범죄로 규정한다."},{"id":"i475","t":"미주범죄인인도조약은 [[2]]년 이상의 자유형을 인도대상범죄로 규정한다."},{"id":"i476","t":"인도 후 새로이 범한 범죄, 범인 자신이 [[동의]]하는 경우, 인도국이 다시 동의하는 경우, 출국 기회가 있었음에도 자의로 계속 체류할 경우 등에는 새로운 범죄에 대한 처벌이 가능하다."},{"id":"i477","t":"우리나라의 경우 법원의 인도허가 결정이 내려져도 대한민국의 이익보호를 위하여 인도가 특히 부적절하다고 인정되는 경우 [[법무부]]장관은 인도를 하지 않을 수 있다."},{"id":"i478","t":"Public Prosecutor v. [[Zind]]에서 이탈리아 파기원은 히틀러의 반유대인 정책을 찬양한 피고는 정치범이므로 서독으로 인도해서는 안 된다고 판결하였다."},{"id":"i479","t":"한미 범죄인인도조약은 인도 청구된 범죄의 [[행위]] 시를 기준으로 국적을 판단한다."},{"id":"i480","t":"정치범 여부는 [[피청구국]]이 결정한다."},{"id":"i481","t":"미국연방대법원은 Alvarez-Machain사건에서 [[납치]]에 의한 미국 법원의 관할권을 인정하였다."},{"id":"i482","t":"한국은 [[2011]]년 범죄인인도에 관한 유럽 협약에 가입했다."},{"id":"i483","t":"B규약위원회는 Roger Judge v. Canada(2003)에서 사형 폐지국 캐나다가 사형 불집행 보증 없이 추방한 것은 규약 제6조 1항의 [[생명]]권을 침해한 것이라고 판단하였다."},{"id":"i484","t":"유럽 체포영장 체계에 의하면 영장발부국의 법에 의해 [[3]]년 이상의 형이 언도될 수 있는 32개의 중요 범죄에 대해서는 쌍방가벌성의 원칙이 포기되었다."},{"id":"i485","t":"범죄인인도법에 의하면 범죄인이 인종·종교·국적·성별·정치적 신념 또는 특정 사회단체에 속한 것 등을 이유로 처벌되거나 불리한 처분을 받을 염려가 있다고 인정되는 경우에는 범죄인을 [[인도하여서는 아니된다]]."},{"id":"i486","t":"범죄인인도법에 의하면 범죄의 성격과 범죄인이 처한 환경 등에 비추어 인도하는 것이 비인도적이라고 인정되는 경우에는 범죄인을 [[인도하지 아니할 수 있다]]."},{"id":"i487","t":"범죄인인도법상 특정성 원칙의 예외 중 하나로, 범죄인이 자유롭게 청구국을 떠날 수 있게 된 후 [[45]]일 이내에 청구국의 영역을 떠나지 아니한 경우가 있다."},{"id":"i488","t":"범죄인인도법에 의하면 검사는 범죄인이 인도구속영장에 의하여 구속되었을 때에는 구속된 날로부터 [[3]]일 이내에 인도심사를 청구하여야 한다."},{"id":"i489","t":"범죄인인도법에 의하면 법원은 범죄인이 구속 중인 경우에는 구속된 날로부터 [[2]]월 이내에 인도심사에 관한 결정을 하여야 한다."},{"id":"i490","t":"범죄인인도법에 의하면 인도조약에 특별한 규정이 없는 경우에는 인도조약의 효력 발생 전에 범한 범죄에 관한 인도청구에 대하여도 이 법을 [[적용한다]]."},{"id":"i491","t":"한미 범죄인인도조약에 의하면 인도대상범죄는 양 체약당사국의 법률에 의하여 [[1]]년 이상의 자유형 또는 그 이상의 중형으로 처벌할 수 있는 범죄로 한다."},{"id":"i492","t":"한미 범죄인인도조약에 의하면 국적만을 이유로 자국민 인도를 거절하는 때에는, 피청구국은 청구국의 요청에 따라 자국의 기소당국에 사건을 회부[[하여야 한다]]."},{"id":"i493","t":"1991년 State v. Ebrahim사건에서 남아프리카공화국은 납치한 자에 대해 재판[[할 수 없다]]고 보았다."}]},{"id":"i494","title":"국제형사재판소(ICC) 로마규정","note":"","items":[{"id":"i495","t":"범죄구성요건은 당사국총회 회원국의 [[3분의 2]]의 다수결에 의하여 채택된다."},{"id":"i496","t":"안보리가 헌장 제7장에 따른 결의로 수사 또는 기소의 연기를 요청하는 경우 [[12]]개월의 기간 동안은 어떠한 수사나 기소도 개시되거나 진행되지 아니한다. 그 요청은 갱신될 수 있다."},{"id":"i497","t":"재판소는 범행 당시 [[18]]세 미만자에 대하여 관할권을 가지지 아니한다."},{"id":"i498","t":"재판소에는 [[18]]인의 재판관을 둔다."},{"id":"i499","t":"재판관으로 선출되는 자는 출석하여 투표한 당사국의 3분의 2 이상의 최다득표를 한 [[18]]인의 후보자로 한다."},{"id":"i500","t":"재판관은 [[9]]년간 재직하며, 재선될 수 없다."},{"id":"i501","t":"재판소장과 제1·제2부소장은 재판관들의 절대다수결로 선출되며, 각각 [[3]]년의 임기 또는 재판관 임기 종료 중 먼저 만료되는 때까지 재직하고 한 번 재선될 수 있다."},{"id":"i502","t":"재판소는 최고 [[30]]년을 초과하지 아니하는 유기징역 또는 정당화될 경우 무기징역 중 하나를 부과할 수 있다."},{"id":"i503","t":"형의 3분의 2 또는 무기징역의 경우 [[25]]년을 복역한 경우, 재판소는 감형여부를 결정하기 위하여 형을 재검토한다."},{"id":"i504","t":"국가는 당사국이 될 때 규정 발효 후 [[7]]년 동안 자국민에 의하여 또는 자국 영역에서 범해진 전쟁범죄에 관하여 재판소의 관할권을 수락하지 아니한다고 선언할 수 있다."}]}]},{"id":"i505","title":"국제인권법","secs":[{"id":"i506","title":"경제적·사회적·문화적 권리규약(A규약, 1966)","note":"","items":[{"id":"i507","t":"[[자결권]]에 기초하여 모든 인민은 그들의 정치적 지위를 자유로이 결정하고, 경제적, 사회적 및 문화적 발전을 자유로이 추구한다."},{"id":"i508","t":"당사국은 규약에서 인정된 권리의 완전한 실현을 [[점진적으로]] 달성하기 위하여, 자국의 가용 자원이 허용하는 [[최대한도까지]] 조치를 취할 것을 약속한다."},{"id":"i509","t":"[[개발도상국]]은 인권과 국가 경제를 충분히 고려하여 규약에서 인정된 [[경제적]] 권리를 어느 정도까지 자국의 국민이 아닌 자에게 보장할 것인가를 결정할 수 있다."},{"id":"i510","t":"당사국은 [[초등교육]]은 모든 사람에게 무상의무교육으로 실시된다는 점을 인정한다."},{"id":"i511","t":"무상 초등의무교육을 확보할 수 없는 당사국은 점진적 시행을 위한 세부실천계획을 [[2]]년 이내에 입안, 채택할 것을 약속한다."},{"id":"i512","t":"모든 보고서는 [[국제연합 사무총장]]에게 제출되며, [[국제연합 사무총장]]은 경제사회이사회가 심의할 수 있도록 보고서 사본을 동 이사회에 송부한다."},{"id":"i513","t":"경제사회이사회는 각국 및 전문기구가 제출하는 인권 보고서 중 적당한 보고서를 [[인권위원회]]에 송부할 수 있다."},{"id":"i514","t":"경제사회이사회는 일반적 성격의 권고를 포함하는 보고서와 입수한 정보의 개요를 수시로 [[총회]]에 제출할 수 있다."},{"id":"i515","t":"규약의 어떠한 규정도 모든 사람이 그들의 천연적 [[부]]와 자원을 충분히, 자유로이 향유하고 이용할 수 있는 고유의 권리를 침해하는 것으로 해석되지 아니한다."},{"id":"i516","t":"모든 [[인민]]은 자결권을 가진다."}]},{"id":"i517","title":"A규약 선택의정서","note":"","items":[{"id":"i518","t":"규약상 권리 침해의 피해자임을 주장하는 개인이나 [[일단의 개인들]]은 직접 또는 대리인을 통해 통보를 제출할 수 있다."},{"id":"i519","t":"위원회는 [[국내적 구제방법]]이 소진된 후 1년 이내에 통보가 제출되지 않은 경우 통보를 허용할 수 없다고 선언한다(시한 내 제출 불가능을 증명한 경우 예외)."},{"id":"i520","t":"위원회는 본안판결 이전에 언제라도 돌이킬 수 없는 피해를 회피하기 위해 [[잠정조치]]의 채택을 긴급히 고려할 것을 관련 당사국에 요청할 수 있다."},{"id":"i521","t":"당사국은 당사국 간의 통보를 접수하고 심리할 위원회의 권한을 인정한다는 것을 [[언제라도]] 선언할 수 있다."},{"id":"i522","t":"최초 통보 접수 후 6개월 이내에 문제가 해결되지 않을 경우, [[어느 한 국가]]는 위원회 및 상대방 국가에 대한 통지를 통해 해당 문제를 위원회에 이첩할 권리를 가진다."},{"id":"i523","t":"당사국은 국가간 고발제도 수락 선언서를 [[국제연합 사무총장]]에게 기탁하며, [[국제연합 사무총장]]은 사본을 다른 당사국들에 송부한다."},{"id":"i524","t":"중대하거나 조직적인 침해를 나타내는 신빙성 있는 정보를 접수할 경우, 위원회는 조사절차에 대한 [[위원회의 권한을 인정]]한 당사국에 협조를 요청한다."},{"id":"i525","t":"조사가 정당한 것이고 관련 [[당사국의 동의]]가 있을 경우, 조사는 동 당사국 영토에 대한 방문을 포함할 수 있다."},{"id":"i526","t":"관련당사국은 조사결과와 논평 및 권고를 접수한 후 [[6개월]] 이내에 자국의 견해를 위원회에 제출한다."},{"id":"i527","t":"폐기는 사무총장이 통지를 접수한 날로부터 [[6개월]] 후에 효력을 발생한다."}]},{"id":"i528","title":"시민적·정치적 권리규약(B규약, 1966)","note":"","items":[{"id":"i529","t":"각 당사국은 자국의 [[영토]] 내에 있으며, 그 [[관할권]] 하에 있는 모든 개인에 대하여 어떠한 종류의 차별도 없이 규약상 권리들을 존중하고 확보할 것을 약속한다."},{"id":"i530","t":"이행정지가 허용되더라도 제6조([[생명]]권), 제7조(고문금지), 제8조(노예금지), 제11조(계약상 의무 불이행 구금 금지), 제15조(죄형법정주의), 제16조(인간으로 인정받을 권리) 및 제18조([[종교]]의 자유)에 대한 위반은 허용하지 아니한다."},{"id":"i531","t":"사형선고는 [[18]]세 미만의 자가 범한 범죄에 대하여 과하여져서는 아니되며, [[임산부]]에 대하여 집행되어서는 아니된다."},{"id":"i532","t":"모든 사람은 자국을 포함하여 어떠한 나라로부터도 자유로이 [[퇴거]]할 수 있다."},{"id":"i533","t":"어느 누구도 자국에 돌아올 권리를 [[자의적으로]] 박탈당하지 아니한다."},{"id":"i534","t":"표현의 자유의 제한은 [[법률]]에 의하여 규정되고 타인의 권리 또는 신용의 존중, [[국가안보]] 또는 공공질서·공중보건·도덕의 보호를 위하여 [[필요]]한 경우에만 한정된다."},{"id":"i535","t":"인권이사회(Human Rights Committee)는 [[18]]인의 위원으로 구성된다."},{"id":"i536","t":"(국가간 고발) 최초 통보 접수 후 6개월 이내에 조정되지 아니할 경우, 양 당사국 중 [[일방]]에 의한 이사회와 타 당사국에 대한 [[통고]]로 당해문제를 이사회에 회부할 권리를 가진다."},{"id":"i537","t":"국가간 고발제도 수락 선언문은 [[국제연합 사무총장]]에게 기탁하며, 선언은 사무총장에 대한 통고에 의하여 언제든지 철회될 수 있다."},{"id":"i538","t":"규약의 어떠한 규정도 모든 사람이 그들의 천연적 [[부와 자원]]을 충분히 자유로이 향유하고 이용할 수 있는 [[고유]]의 권리를 침해하는 것으로 해석되지 아니한다."}]},{"id":"i539","title":"B규약 선택의정서","note":"","items":[{"id":"i540","t":"의정서 당사국은 그 관할권에 속하는 자로서 B규약상 권리 침해의 희생자임을 주장하는 [[개인]]으로부터의 통보를 접수하고 심리하는 이사회의 권한을 인정한다."},{"id":"i541","t":"권리가 침해되었다고 주장하는 개인들은 모든 이용가능한 [[국내적 구제조치]]를 완료하였을 경우, 이사회에 서면통보를 제출할 수 있다."},{"id":"i542","t":"이사회는 통보가 [[익명]]이거나, 통보제출권의 [[남용]] 또는 규약규정과 양립할 수 없는 것으로 간주될 경우 그러한 통보를 허용할 수 없는 것으로 간주한다."},{"id":"i543","t":"당사국은 [[6]]개월 이내에 그 문제 및 취하여진 구제조치를 설명하는 서면 설명서 또는 진술서를 이사회에 제출한다."},{"id":"i544","t":"이사회는 개인 및 관련당사국으로부터 입수된 모든 [[서면]]정보를 참고하여 통보를 심리한다."},{"id":"i545","t":"이사회는 동일 문제가 다른 [[국제적]] 조사 또는 해결절차에 따라 심사되고 있지 않을 것을 확인한 경우가 아니면 개인의 통보를 심리하지 않는다."},{"id":"i546","t":"국내구제완료규칙은 구제조치의 적용이 [[불합리하게]] 지연되는 경우에는 적용되지 않는다."},{"id":"i547","t":"이사회는 통보를 심사할 때에는 [[비공개]] 회의를 갖는다."},{"id":"i548","t":"당사국은 언제든지 [[국제연합 사무총장]]에 대한 서면통보에 의하여 이 의정서를 폐기할 수 있으며, 폐기는 통보 접수일로부터 [[3]]개월 후에 효력을 발생한다."}]},{"id":"i549","title":"집단살해방지협약(1948)","note":"","items":[{"id":"i550","t":"체약국은 집단살해가 평시에 행해졌는지 [[전시]]에 행해졌는지를 불문하고 이를 방지하고 처벌할 것을 약속하는 국제법상의 범죄임을 확인한다."},{"id":"i551","t":"집단살해라 함은 국민적, 인종적, 민족적 또는 [[종교]]적 집단의 전체 또는 일부를 파괴할 의도로 행하여진 행위로서, 구성원 살해, 중대한 위해, 생활조건 부과, 집단 내 [[출생]]을 방지하기 위한 조치 부과, 집단 내의 [[아동]]을 강제적으로 타 집단으로 이동시키는 것을 말한다."},{"id":"i552","t":"집단살해, 공모, 직접 또는 공연한 교사, 집단살해의 [[미수]], 공범을 처벌한다."},{"id":"i553","t":"헌법상으로 책임있는 통치권자, 공무원 및 [[사인]]을 불문하고, 집단살해 등을 범하는 자는 처벌한다."},{"id":"i554","t":"체약국은 집단살해 등에 대하여 죄가 있는 자에 대해 [[유효]]한 형벌을 마련하기 위하여 필요한 법률을 제정한다."},{"id":"i555","t":"혐의가 있는 자는 그러한 행위가 [[영토]] 내에서 행해진 국가의 재판소 또는 [[국제형사재판소]]의 관할권을 수락한 체약국에 관해서는 동 재판소에 의하여 심리된다."},{"id":"i556","t":"집단살해 등은 범죄인 인도의 목적으로 [[정치적]] 범죄로 인정치 않는다."},{"id":"i557","t":"협약의 해석, 적용 또는 이행에 관한 분쟁은 국가책임에 관한 분쟁을 포함하여 분쟁 당사국의 요구에 의하여 [[국제사법재판소]]에 부탁한다."},{"id":"i558","t":"협약은 발효일로부터 [[10]]년간 효력을 갖는다. 만료 적어도 [[6]]개월 전에 폐기하지 아니한 체약국에 대하여는 그 후 [[5]]년간 계속하여 효력을 가진다."},{"id":"i559","t":"폐기는 [[국제연합사무총장]]에 대한 통고에 의하여 발효한다."}]},{"id":"i560","title":"고문방지협약(1984)","note":"","items":[{"id":"i561","t":"[[합법적]] 제재조치로부터 초래되거나, 이에 내재하거나 부수되는 고통은 고문에 포함되지 아니한다."},{"id":"i562","t":"[[전쟁]]상태, 전쟁의 위협, 국내의 정치불안정 또는 그 밖의 사회적 긴급상황 등 어떠한 예외적인 상황도 고문을 정당화하기 위하여 원용될 수 없다."},{"id":"i563","t":"당사국은 이러한 범죄가 그 [[심각성]]이 고려된 적절한 형벌로 처벌될 수 있도록 한다."},{"id":"i564","t":"당사국은 범죄가 자국 관할하의 [[영토]] 내에서 또는 자국 선박·항공기에서 실행된 경우, 범죄혐의자가 자국민인 경우, 피해자가 자국민이며 관할권 행사가 적절하다고 인정하는 경우에 관할권을 확립하기 위하여 필요한 조치를 취한다."},{"id":"i565","t":"당사국은 범죄혐의자가 자국 영토 안에 소재하나 [[인도]]하지 아니하는 경우에는, 기소를 위하여 사건을 권한있는 당국에 회부한다."},{"id":"i566","t":"고문방지위원회는 인권분야에서 능력이 인정된 [[10]]명의 전문가로 구성하며, 이들은 개인자격으로 직무를 수행한다."},{"id":"i567","t":"위원회의 위원은 [[4]]년 임기로 선출되며, 재지명되는 경우 재선될 수 있다."},{"id":"i568","t":"당사국은 협약 발효 후 1년 안에 보고서를 작성하여 [[국제연합사무총장]]을 통하여 위원회에 제출한다."},{"id":"i569","t":"그 이후 당사국은 매 [[4]]년마다 추가보고서를 제출한다."},{"id":"i570","t":"국제연합 사무총장은 보고서를 모든 [[당사국]]에 송부한다."},{"id":"i571","t":"고문이 조직적으로 자행되고 있다는 신뢰할 만한 정보를 접수하는 경우, 위원회는 그 당사국에 대하여 정보 조사에 협조하고 의견을 제출하도록 요청한다. (동의 불요 / 유보로 배제 가능)","tag":"사실심사"},{"id":"i572","t":"관련당사국과 합의하는 경우 조사에는 관련당사국의 영토 방문이 포함될 수 있다.","tag":"사실심사"},{"id":"i573","t":"당사국은 위원회가 국가간 통보를 수리하여 심리할 권능을 인정한다는 선언을 언제든지 할 수 있다. (별도 수락 요함)","tag":"국가간고발"},{"id":"i574","t":"통보접수국은 통보접수 3월 안에 통보국에 대하여 설명서나 해명서를 제공한다.","tag":"국가간고발"},{"id":"i575","t":"최초 통보 접수 후 6월 안에 조정되지 아니하는 경우, 일방 당사국은 통고를 통해 위원회에 문제를 회부할 권리를 가진다. (합의 불요 / 일방적 회부)","tag":"국가간고발"},{"id":"i576","t":"위원회는 모든 국내적 구제조치가 완료되었음을 확인한 후에 회부된 문제를 처리한다.","tag":"국가간고발"},{"id":"i577","t":"위원회는 우호적 해결을 위하여 주선을 제공하며, 적절한 경우 임시조정위원회를 설치할 수 있다.","tag":"국가간고발"},{"id":"i578","t":"당사국은 위원회가 개인 또는 대리인으로부터 통보를 수리하고 심리할 권능을 인정한다는 선언을 언제든지 할 수 있다. (별도 수락 요함)","tag":"개인청원"},{"id":"i579","t":"위원회는 개인이 모든 국내적 구제조치를 완료하였을 것을 확인하기 전에는 통보를 심리하지 아니한다.","tag":"개인청원"},{"id":"i580","t":"당사국은 국제연합 사무총장에 대한 서면통고로 탈퇴할 수 있으며, 탈퇴는 통고 접수일부터 1년 후에 발효한다."}]},{"id":"i581","title":"제노사이드 관련 판례","note":"1951년 권고적 의견: 유보는 목적·취지와 양립하는 한 허용. 보스니아-세르비아(2007): 스레브레니차 제노사이드 인정, 세르비아는 예방·처벌 의무 위반만. 콩고-우간다(2005): 특별한 의도 부정, 자위권 기각. 콩고-르완다(2006): 강행규범 최초 인정, 제9조 유보로 관할 부정. 크로아티아-세르비아(2015): 의도 불입증. 감비아-미얀마·우크라이나-러시아·남아공-이스라엘: 잠정조치 명령. 니카라과-독일(2024): 잠정조치 기각. 수단-UAE(2025): 제9조 유보로 관할 부정.","items":[{"id":"i582","t":"Reservations to the Genocide Convention(1951)에서 ICJ는 유보는 협약의 목적과 취지와 [[양립]]하는 한 허용되며, 그 [[양립]]성은 개별적으로 판단되어야 한다고 판시하였다."},{"id":"i583","t":"Bosnia and Herzegovina v. Serbia and Montenegro(2007)에서 ICJ는 [[스레브레니차]]에서 제노사이드가 발생했음을 인정하였으나, 세르비아의 직접 실행·공범 책임은 부정하고 예방 및 처벌 의무 위반만을 인정하였다."},{"id":"i584","t":"Armed Activities (DRC v. Uganda, 2005)에서 ICJ는 국제인도법·인권법 위반 책임을 인정하고 제노사이드협약 위반은 부정하였으며, 우간다의 [[자위권]] 주장은 무력공격의 귀속과 필요·비례성 요건을 충족하지 못했다는 이유로 기각되었다."},{"id":"i585","t":"Armed Activities (DRC v. Rwanda, 2006)에서 ICJ는 제노사이드 금지가 [[강행규범]]임을 처음으로 인정하면서도, 르완다의 제9조 유보를 이유로 관할권은 부정하였다."},{"id":"i586","t":"Croatia v. Serbia(2015)에서 ICJ는 광범위한 폭력의 존재는 인정하였으나, 제노사이드의 특별한 [[의도]]가 입증되지 않았다며 양국 모두에 대해 협약 위반을 부정하였다."},{"id":"i587","t":"The Gambia v. Myanmar(2020)에서 ICJ는 협약상 권리의 개연성을 인정하고 미얀마에 대해 [[잠정조치]]를 명령하였다(진행중)."},{"id":"i588","t":"Ukraine v. Russian Federation(2022)에서 ICJ는 [[일견(일응)]] 관할권을 인정한 후 러시아에 대해 군사행동 중단 등을 명하는 잠정조치를 명령하였다(진행중)."},{"id":"i589","t":"South Africa v. Israel(2024)에서 ICJ는 협약상 권리의 개연성을 인정하고 예방·인도적 조치를 포함한 [[잠정]]조치를 명령하였다(진행중)."},{"id":"i590","t":"Nicaragua v. Germany(2024)에서 ICJ는 협약상 권리 침해의 개연성과 [[긴급성]]이 충분히 입증되지 않았다는 이유로 잠정조치 청구를 기각하였다."},{"id":"i591","t":"Sudan v. United Arab Emirates(2025)에서 ICJ는 UAE의 협약 제9조 유보를 이유로 [[관할권]]이 없다고 판단하였다."}]}]},{"id":"i592","title":"해양법","secs":[{"id":"i593","title":"UN해양법협약(1982) 조문","note":"","items":[{"id":"i594","t":"[[심해저]]라 함은 국가관할권 한계 밖의 해저·해상 및 그 하층토를 말한다."},{"id":"i595","t":"모든 국가는 기선으로부터 12해리를 넘지 아니하는 범위에서 [[영해]]의 폭을 설정할 권리를 가진다."},{"id":"i596","t":"통상기선은 협약에 달리 규정된 경우를 제외하고는 연안국이 공인한 [[대축척]]해도에 표시된 해안의 저조선으로 한다."},{"id":"i597","t":"삼각주 등으로 해안선이 매우 불안정한 곳에서는 바다쪽 가장 바깥 저조선을 따라 적절한 지점을 선택할 수 있으며, 그 후 저조선이 후퇴하더라도 직선기선은 [[연안국]]에 의하여 수정될 때까지 유효하다."},{"id":"i598","t":"직선기선은 간조노출지까지 또는 간조노출지로부터 설정할 수 없다. 다만, 영구적으로 해면위에 있는 [[등대]]나 이와 유사한 시설이 세워진 경우 또는 간조노출지 사이의 기선설정이 일반적으로 국제적인 승인을 받은 경우에는 그러하지 아니하다. (군도기선과 다른 점 주의)"},{"id":"i599","t":"직선기선을 설정함으로써 종전에 내수가 아니었던 수역이 내수에 포함되는 경우, 협약에 규정된 [[무해통항권]]이 그 수역에서 계속 인정된다."},{"id":"i600","t":"강이 직접 바다로 유입하는 경우, 기선은 양쪽 강둑의 [[저조선]]상의 지점을 하구를 가로 질러 연결한 직선으로 한다."},{"id":"i601","t":"만의 자연적 입구 양쪽의 저조지점간의 거리가 [[24]]해리를 넘지 아니하는 경우, [[폐쇄선]]을 두 저조지점간에 그을 수 있으며, 이 안에 포함된 수역은 내수로 본다."},{"id":"i602","t":"선박이 화물을 싣고, 내리고, 닻을 내리기 위하여 통상적으로 사용되는 [[정박지]]는 전부 또는 일부가 영해의 바깥한계 밖에 있는 경우에도 영해에 포함된다."},{"id":"i603","t":"해안이 마주보거나 인접한 경우, 달리 합의하지 않는 한 [[중간선]] 밖으로 영해를 확장할 수 없다. 다만, 역사적 권원이나 그 밖의 특별한 사정이 있는 경우에는 적용하지 아니한다."},{"id":"i604","t":"영해에서 통항은 계속적이고 신속하여야 한다. 다만, 통상적인 항행에 부수되는 경우, [[불가항력]]이나 [[조난]]으로 인하여 필요한 경우, 또는 위험·조난상태의 인명·선박·항공기를 구조하기 위한 경우에는 정선·투묘도 통항에 포함된다. (3가지 예외)"},{"id":"i605","t":"연안국은 안전보호상 긴요한 경우 영해의 지정된 수역에서 외국선박을 차별하지 아니하고 무해통항을 일시적으로 정지시킬 수 있다. 이러한 정지조치는 적절히 [[공표]]한 후에만 효력을 가진다."},{"id":"i606","t":"연안국의 형사관할권은 범죄 결과가 연안국에 미치는 경우, 평화·공공질서 교란, 그 선박의 [[선장]]이나 기국의 외교관·영사의 지원 요청, 마약 불법거래 진압에 필요한 경우를 제외하고는 통항 중인 외국선박 내에서 행사될 수 없다."},{"id":"i607","t":"연안국은 [[내수]]를 떠나 영해를 통항중인 외국선박내에서의 체포나 수사를 목적으로 자국법이 허용한 조치를 취할 수 있다."},{"id":"i608","t":"연안국은 외국선박이 내수에 들어오지 아니하고 단순히 영해를 통과하는 경우, 영해에 들어오기 전에 발생한 범죄와 관련하여 체포·수사를 위해 선박 내에서 어떠한 조치도 취할 수 없다. (금지규정)"},{"id":"i609","t":"군함이 연안국 법령을 준수하지 아니하고 준수 요구를 무시하는 경우, 연안국은 그 군함에 대하여 영해에서 즉시 [[퇴거]]할 것을 요구할 수 있다."},{"id":"i610","t":"접속수역에서 연안국은 관세·재정·출입국관리 또는 [[위생]]에 관한 법령의 위반방지 또는 처벌을 위하여 필요한 통제를 할 수 있다."},{"id":"i611","t":"접속수역은 영해기선으로부터 [[24]]해리 밖으로 확장할 수 없다."},{"id":"i612","t":"해협 관련 규정은 특정해협에 관하여 장기간에 걸쳐 유효한 국제협약에 따라 통항이 규제되고 있는 해협의 법제도에 영향을 미치지 아니한다. (특별법 우선)"},{"id":"i613","t":"선박과 항공기는 통과통항권 행사시 불가항력 또는 조난으로 필요한 경우를 제외하고는 계속적이고 신속한 통과의 통상적인 방식에 따르지 아니하는 활동을 자제한다. (예외 1가지 – 영해는 3가지)"},{"id":"i614","t":"해양과학조사선과 수로측량선을 포함한 외국선박은 통과통항중 해협연안국의 사전허가 없이 어떠한 조사·측량활동도 수행할 수 없다."},{"id":"i615","t":"해협연안국은 항로대·통항분리방식을 지정·설정하기에 앞서 권한있는 국제기구가 이를 채택하도록 제안하며, 국제기구는 해협연안국과 합의된 것만 채택할 수 있다. (일방적 설정 불가)"},{"id":"i616","t":"군도직선기선은 간조노출지와 연결하여 설정할 수 없다. 다만, 등대 등이 설치되어 있거나, 간조노출지가 가장 가까운 섬으로부터 영해폭을 넘지 아니하는 거리에 있는 경우에는 그러하지 아니하다. (영해 직선기선과 다름)"},{"id":"i617","t":"군도국가의 주권은 군도수역의 상공·해저와 하층토 및 이에 포함된 자원에까지 미친다."},{"id":"i618","t":"모든 국가의 선박은 군도수역에서 무해통항권을 향유한다. (원칙적 통항은 무해통항)"},{"id":"i619","t":"군도국가는 안전 보장을 위해 불가피한 경우 군도수역의 특정수역에서 무해통항을 일시적으로 정지시킬 수 있으며, 적절히 공표한 후에만 효력을 가진다."},{"id":"i620","t":"군도국가는 계속적이고 신속한 통항에 적합한 항로대와 항공로를 지정할 수 있다. (재량)"},{"id":"i621","t":"군도국가의 항로대·통항분리방식은 권한 있는 국제기구에 제안하여 채택된 이후에야 지정·설정할 수 있다."},{"id":"i622","t":"배타적경제수역은 영해기선으로부터 [[200]]해리를 넘을 수 없다."},{"id":"i623","t":"연안국은 EEZ의 인공섬, 시설 및 구조물에 대하여 관세·재정·위생·안전 및 출입국관리 법령에 관한 관할권을 포함한 배타적 관할권을 가진다."},{"id":"i624","t":"EEZ의 안전수역은 일반적으로 수락된 국제기준 등의 경우를 제외하고는 그 바깥쪽 끝의 각 점으로부터 측정하여 [[500]]미터를 넘을 수 없다."},{"id":"i625","t":"[[소하성]]어족이 기원하는 하천의 국가는 이 어족에 대한 일차적 이익과 책임을 가진다."},{"id":"i626","t":"강하성어종이 그 생존기간의 대부분을 보내는 수역의 연안국은 그 어종의 관리에 대한 책임을 지며 회유어의 출입을 보장한다."},{"id":"i627","t":"배타적경제수역에 관한 규정은 정착성어종에는 적용하지 아니한다."},{"id":"i628","t":"EEZ에서 어업법령 위반에 대한 연안국의 처벌에는 관련국간 달리 합의하지 아니하는 한 [[금고]] 또는 다른 형태의 체형이 포함되지 아니한다."},{"id":"i629","t":"EEZ 경계획정은 형평한 해결에 이르기 위하여 국제사법재판소규정 제[[38]]조에 언급된 국제법을 기초로 하는 합의에 의하여 이루어진다."},{"id":"i630","t":"경계획정 합의에 이르는 동안 관련국은 실질적인 잠정약정을 체결할 수 있도록 노력하며, 과도적인 기간동안 최종 합의를 위태롭게 하거나 방해하지 아니한다."},{"id":"i631","t":"대륙붕은 영해 밖으로 영토의 자연적 [[연장]]에 따라 대륙변계의 바깥끝까지, 또는 대륙변계가 200해리에 미치지 아니하는 경우 200해리까지의 해저와 하층토로 이루어진다."},{"id":"i632","t":"대륙변계는 연안국 육지의 해면 아래쪽 연장으로서 대륙붕·대륙사면·대륙융기의 해저와 하층토로 이루어지며, 해양산맥을 포함한 심해대양저나 그 하층토를 포함하지 아니한다."},{"id":"i633","t":"대륙붕의 바깥한계선을 이루는 고정점은 영해기선으로부터 [[350]]해리를 넘거나 2500미터 등심선으로부터 100해리를 넘을 수 없다."},{"id":"i634","t":"[[해저산맥]]에서는 대륙붕의 바깥한계는 영해기선으로부터 350해리를 넘을 수 없다."},{"id":"i635","t":"연안국은 200해리를 넘는 대륙붕의 한계에 관한 정보를 [[대륙붕한계위원회]]에 제출하며, 위원회의 권고를 기초로 연안국이 확정한 대륙붕의 한계는 최종적이며 구속력을 가진다."},{"id":"i636","t":"연안국이 대륙붕을 탐사하지 아니하거나 천연자원을 개발하지 아니하더라도 다른 국가는 연안국의 명시적인 동의없이는 이러한 활동을 할 수 없다."},{"id":"i637","t":"대륙붕에 대한 연안국의 권리는 실효적이거나 관념적인 [[점유]] 또는 명시적 선언에 의존하지 아니한다."},{"id":"i638","t":"대륙붕의 천연자원은 해저와 하층토의 광물, 그 밖의 무생물자원 및 정착성어종에 속하는 생물체로 구성된다."},{"id":"i639","t":"대륙붕에서 관선 부설경로의 설정은 연안국의 동의를 받아야 한다."},{"id":"i640","t":"자국의 대륙붕에서 생산되는 광물자원의 순수입국인 개발도상국은 그 광물자원에 대한 금전지급이나 현물공여로부터 면제된다."},{"id":"i641","t":"200해리 밖 대륙붕 개발의 금전지급·현물공여 비율은 6년째 1%로 하고 12년째까지 매년 1%씩 증가시키며 그 이후에는 [[7]]퍼센트로 한다."},{"id":"i642","t":"공해는 어느 한 국가의 배타적경제수역·영해·내수 또는 군도국가의 군도수역에 속하지 아니하는 바다를 말한다."},{"id":"i643","t":"선박은 진정한 소유권 이전 또는 등록변경의 경우를 제외하고는 항행중이나 기항중에 그 국기를 바꿀 수 없다."},{"id":"i644","t":"공해상 충돌 등 항행사고로 인한 형사·징계 절차는 그 선박의 기국이나 관련자의 국적국의 사법 또는 행정당국 외에서는 제기될 수 없다."},{"id":"i645","t":"승무원이 반란을 일으켜 그 지배하에 있는 군함·정부선박·정부항공기가 해적행위를 하는 경우, 민간선박 또는 민간항공기에 의한 행위로 본다."},{"id":"i646","t":"자국기를 게양한 선박이 마약 불법거래에 종사하고 있다고 믿을 만한 합리적인 근거를 가진 국가는 다른 국가에 대하여 진압을 위한 협력을 요청할 수 있다."},{"id":"i647","t":"외국선박이 접속수역에 있을 경우 추적은 그 수역을 설정함으로써 보호하려는 권리가 침해되는 경우에 한하여 행할 수 있다."},{"id":"i648","t":"“폐쇄해 또는 반폐쇄해”라 함은 2개국 이상에 의하여 둘러싸이고 좁은 출구에 의하여 다른 바다나 대양에 연결되거나, 전체나 그 대부분이 2개국 이상 연안국의 영해와 EEZ로 이루어진 바다를 말한다."},{"id":"i649","t":"심해저 자원은 양도의 대상이 될 수 없다."},{"id":"i650","t":"심해저활동은 심해저공사와, 해저기구와 제휴한 당사국 또는 당사국이 보증하는 국영기업·자연인·법인 등에 의하여 수행된다. (병행개발체제)"},{"id":"i651","t":"해저기구의 사무총장은 이사회가 제안한 후보자중에서 총회에 의하여 4년 임기로 선출되며 재선될 수 있다."},{"id":"i652","t":"해저분쟁재판부는 총회나 이사회의 활동범위 안에서 발생하는 법률문제에 관하여 총회나 이사회의 요청에 따라 권고적 의견을 제시한다."},{"id":"i653","t":"각국은 계획된 활동이 해양환경에 실질적인 오염이나 중대하고 해로운 변화를 가져올 것이라고 믿을만한 합리적인 근거가 있는 경우, 잠재적 영향을 평가하고 보고서를 송부한다. (환경영향평가)"},{"id":"i654","t":"영해와 EEZ에서의 투기 또는 대륙붕상의 투기는 연안국의 명시적인 사전승인 없이는 행할 수 없다."},{"id":"i655","t":"선박이 항구나 연안정박시설에 자발적으로 들어온 경우 그 국가는 자국 관할수역 밖에서 행하여진 배출에 관하여 조사를 행하고 소송을 제기할 수 있다. (기항국 관할)"},{"id":"i656","t":"다른 국가의 내수, 영해나 EEZ에서의 배출 위반에 관한 기항국 소송은 그 국가·기국·피해국의 요청이 있거나 위반이 소송 제기국 수역에 오염을 초래(위험)하는 경우를 제외하고는 제기될 수 없다."},{"id":"i657","t":"국가는 해난사고로 인한 오염 또는 그 위험으로부터 자국의 해안이나 어로 등을 보호하기 위하여 피해에 상응하는 조치를 영해밖까지 취하고 집행할 권리를 갖는다."},{"id":"i658","t":"영해에서 고의적으로 중대한 오염행위를 한 경우를 제외하고는 외국선박의 영해 내 해양환경 법령 위반에 대하여는 벌금만 부과할 수 있다. (형벌제한)"},{"id":"i659","t":"영해에서의 해양과학조사는 연안국의 명시적 동의와 연안국이 정한 조건에 따라서만 수행된다."},{"id":"i660","t":"EEZ와 대륙붕에서의 해양과학조사는 연안국의 동의를 얻어 수행한다."},{"id":"i661","t":"협약의 해석·적용에 관한 분쟁이 해결되지 아니하는 경우, 어느 한 분쟁당사자의 요청이 있으면 관할권을 가지는 재판소에 회부된다."},{"id":"i662","t":"어떠한 국가도 서면 선언에 의하여 국제해양법재판소, 국제사법재판소, 중재재판소, 특별중재재판소 중의 어느 하나 또는 그 이상을 자유롭게 선택할 수 있다."},{"id":"i663","t":"재판소가 관할권을 가지는지 여부에 관한 분쟁이 있는 경우, 그 문제는 그 재판소의 결정에 의하여 해결한다. (선결적 항변 결정 주체)"},{"id":"i664","t":"재판소가 일응 관할권을 가지는 것으로 판단하는 경우, 각 분쟁당사자의 이익 보전 또는 해양환경에 대한 중대한 손상 방지를 위하여 잠정조치를 명령할 수 있다."},{"id":"i665","t":"중재재판소 구성 중 잠정조치 요청이 있는 경우 당사자가 합의하는 재판소가, 요청 후 2주일 이내에 합의가 없으면 국제해양법재판소(심해저활동은 해저분쟁재판부)가 잠정조치를 명령할 수 있다."},{"id":"i666","t":"적정한 보석금 예치에도 억류국이 선박·선원을 신속히 석방하지 아니하는 경우, 억류일로부터 10일 이내에 합의가 이루어지지 아니하면 억류국이 수락한 재판소나 국제해양법재판소에 회부될 수 있다.","tag":"신속석방"},{"id":"i667","t":"재판소는 청구가 법적 절차의 남용에 해당되는지나 일응 정당한 근거가 있는지를 어느 한 당사자의 요청 또는 직권으로 결정할 수 있다."},{"id":"i668","t":"연안국은 EEZ 생물자원에 대한 주권적 권리 및 그 행사에 관련된 분쟁을 해결절차에 회부할 의무를 지지 아니하며, 이 경우 분쟁은 어느 한 당사자의 요청에 따라 강제조정절차에 회부된다."},{"id":"i669","t":"해양경계획정·역사적 만 또는 권원 분쟁, 군사활동 분쟁, 법집행활동 분쟁, 안보리가 권한을 수행하고 있는 분쟁에 관하여 강제절차를 수락하지 아니한다는 서면선언을 할 수 있다. (선택적 배제)"},{"id":"i670","t":"선택적 배제 선언을 행한 당사국은 배제된 범주의 분쟁을 다른 당사국의 동의없이 협약의 절차에 회부할 수 없다. (상호주의)"},{"id":"i671","t":"협약은 협약 규율사항에 관한 권한(조약체결권 포함)을 가지는 모든 자치연합국과 국제기구의 가입을 허용한다."},{"id":"i672","t":"국가는 국내법령을 협약과 조화시킬 목적으로 협약의 서명, 비준, 가입시 선언이나 성명을 행할 수 있다. (해석선언 – 시점 제한)"},{"id":"i673","t":"당사국은 사무총장에 대한 서면통고를 통하여 협약을 폐기할 수 있으며, 폐기이유 미명시는 효력에 영향이 없고, 통고수령일 후 1년이 지난 날부터 유효하다."},{"id":"i674","t":"해양법재판소는 해양법분야에서 능력이 인정된 [[21]]인의 독립적 재판관으로 구성된다."},{"id":"i675","t":"재판소는 업무를 [[신속]]히 처리하기 위하여 약식절차에 따라 분쟁을 처리하는 5인의 재판관으로 구성되는 재판정을 매년 구성한다."},{"id":"i676","t":"해저분쟁재판부는 선출된 재판관들이 다수결로 뽑은 [[11]]인의 재판관으로 구성한다."},{"id":"i677","t":"해저분쟁재판부를 구성하는데 필요한 재판관 정족수는 [[7]]인으로 한다."},{"id":"i678","t":"부속서Ⅶ 중재재판소는 [[5]]인의 중재재판관으로 구성된다."},{"id":"i679","t":"최초 서면통고 후 60일 이내에 중재재판관 또는 소장 선임에 합의하지 못하는 경우, 남은 임명은 [[국제해양법재판소]] 소장의 선임에 따라 이루어진다."}]},{"id":"i680","title":"해양법 기출 OX","note":"","items":[{"id":"i681","t":"모든 국가는 공해에서 국제협약을 위반하여 마약과 향정신성물질을 불법적으로 거래하는 모든 선박을 나포할 수 있다.","a":"X (보편주의 비적용)"}]},{"id":"i682","title":"해협","note":"미국-이란 전쟁 과정에서 이란이 호르무즈 해협을 봉쇄하고 있는 것과 관련하여 출제 가능.","items":[{"id":"i683","t":"통과통항 제도는 제[[3]]차 해양법회의에서 처음 도입되었다."},{"id":"i684","t":"해협에서 원칙적 통항제도는 [[통과통항]]이며, 예외적으로 무해통항이 인정된다."},{"id":"i685","t":"해협에서 모든 선박과 [[항공기]]는 통과통항권을 가지며, 잠수함의 잠항도 인정된다."},{"id":"i686","t":"해협에서 군함과 군용항공기도 [[통과통항]]권을 갖는다."},{"id":"i687","t":"통과통항이 인정되는 해협은 해협의 양 입구가 모두 공해나 [[EEZ]]로 연결되어야 한다."},{"id":"i688","t":"통항로 입구 일방이 타국 [[영해]]로 연결된 경우 무해통항만 인정되며, 이 경우 무해통항은 일시 정지할 수 없다."},{"id":"i689","t":"해협 내에 공해나 EEZ가 존재하고, [[영해]] 측과 유사하게 편리한 수로가 있는 경우 영해 측에서는 무해통항만 인정된다."},{"id":"i690","t":"해협이 본토와 섬 사이에 형성되고, 섬 외측으로 유사하게 편리한 수로가 있는 경우 해협에서는 [[무해통항]]만 인정된다."},{"id":"i691","t":"해협국은 통항로 지정권, 관련 법령제정권, [[분리통항]]방법설정권을 갖는다."},{"id":"i692","t":"해협국은 통과통항을 방해하거나 [[일시정지]] 할 수 없으며, 위험사항을 공시해야 한다."},{"id":"i693","t":"대한해협은 3해리 영해 외측에 EEZ가 존재하므로 영해 부분에서는 [[무해통항]]이 인정된다."},{"id":"i694","t":"제주해협 내에서는 통과통항이 아닌 무해통항만 인정되며, 이 무해통항은 정지시킬 수 [[없다]]. (정인섭: 한국 법령상 제주해협은 통과통항이 배제되는 수역이라는 규정은 없다)"},{"id":"i695","t":"남북해운합의서를 통해 2005년 8월 15일부터 북한 상선의 제주해협 통과가 인정되었으나 2010년 [[5.24조치]]를 통해 합의서 적용을 중지하였다."},{"id":"i696","t":"해협 내의 내수에서는 무해통항과 통과통항이 인정되지 않지만, [[직선기선]]의 채택으로 내수로 된 수역에서는 통과통항과 무해통항이 보장된다."},{"id":"i697","t":"통과통항 체제하에서 해협연안국은 자신의 제안이 권한 있는 [[국제기구]]에 의하여 채택된 이후라야 항로대나 통항분리방식을 지정·설정할 수 있다. (무해통항 체제에서는 권고를 단지 고려)"}]},{"id":"i698","title":"중국의 서해 구조물 설치","note":"한·중은 2001년 한중 어업협정으로 서해에 잠정조치수역(PMZ)을 설정하여 양국 어선의 조업·항행을 허용하고 각국이 자국 선박만 단속해 왔다. 최근 중국이 PMZ 안에 선란 1·2호 등 철제 구조물과 부표를 설치하고, 한국 해양조사선의 조사를 해경이 차단·방해하는 대치가 반복되었다. 중국은 어업·양식·관측 설비일 뿐이라고 주장하나, 한국 등은 일방적 구조물 설치와 조사 방해가 협정 취지와 UNCLOS에 어긋날 소지가 크다고 평가한다.","items":[{"id":"i699","t":"잠정조치수역(PMZ)은 한중 어업협정에 따른 공동관리 수역으로, 각국이 자국 선박과 자국민에 대해서만 단속권을 행사하는 [[기국]]주의가 적용된다."},{"id":"i700","t":"한중 어업협정에서 PMZ의 경계는 해리 기준이 아니라 위도와 경도 좌표로 설정되어, EEZ 경계 획정 전까지 임시 관리구역으로 기능한다."},{"id":"i701","t":"UNCLOS 제56조는 연안국이 EEZ에서 자원의 탐사·개발·관리 및 인공섬·시설·구조물의 설치에 관한 [[주권]]적 권리를 가진다고 규정한다."},{"id":"i702","t":"UNCLOS 제60조 제1항은 연안국이 EEZ에서 인공섬·시설·구조물의 건설·허가·규제를 할 권한을 가진다고 규정한다."},{"id":"i703","t":"UNCLOS 제60조 제5항은 EEZ에 적법하게 설치된 구조물 주위에 최대 [[500]]미터의 안전수역을 설정할 수 있음을 규정한다."},{"id":"i704","t":"UNCLOS 제74조 제1항은 중첩되는 EEZ 경계가 국제법에 따라 [[형평]]한 해결에 의해 획정되어야 함을 규정한다."},{"id":"i705","t":"UNCLOS 제74조 제3항은 EEZ 경계 획정 전까지 당사국들이 협력하고 [[잠정]]조치를 취할 수 있음을 규정한다."},{"id":"i706","t":"UNCLOS 제58조 제1항은 EEZ에서 모든 국가는 항행과 비행의 자유 및 해저케이블과 파이프라인 부설의 자유를 향유한다고 규정한다."},{"id":"i707","t":"UNCLOS 제87조 제1항은 공해에서 모든 국가는 항행의 자유를 포함한 여러 자유를 향유한다고 규정한다."},{"id":"i708","t":"Guyana 대 Suriname 중재판정(2007)은 해양경계 미획정 수역에서 당사국들은 잠정적 합의를 위해 성실히 협력해야 하며 일방적으로 물리적 현상 변경을 초래하는 활동을 해서는 안 된다고 판시하였다."}]},{"id":"i709","title":"미국 군함의 러시아 유조선 공해상 나포","note":"2026년 1월 7일 미국 해안경비대와 군사력은 북대서양 공해상에서 베네수엘라와 연계된 러시아 국적 유조선 ‘마리네라(전 Bella-1)’를 대베네수엘라 제재 회피 혐의로 미 연방법원 영장에 따라 나포했다. 러시아는 이를 국제해양법 위반이자 사실상 해적 행위라고 비난했다.","items":[{"id":"i710","t":"국제해양법상 공해에서는 [[기국주의]]가 원칙이어서 선박은 자신의 국적국의 배타적 관할에만 복속된다."},{"id":"i711","t":"UNCLOS는 기국주의 원칙의 예외로 [[해적]]행위, 노예무역, 무허가 방송, 무국적선 등의 경우에 한해 타국의 방문·검색·나포를 허용한다."},{"id":"i712","t":"러시아 국적 유조선이 위 예외에 해당하지 않는다면, 미국의 공해상 나포는 원칙적으로 [[기국주의]] 위반이 된다."},{"id":"i713","t":"선박은 자유롭게 국적 변경을 할 수 있으나, UNCLOS 제91조가 요구하는 기국과의 [[진정한]] [[관련성]]이 없는 형식적·위장적 변경은 제3국이 다툴 수 있다."},{"id":"i714","t":"미국이 해당 유조선의 러시아 국적이 [[진정한]] [[관련성]]이 없는 허위 국적이라고 입증하지 못하면, 그 선박은 러시아의 보호를 받는 합법적 국적선으로 취급된다."},{"id":"i715","t":"미국의 대베네수엘라 제재는 미국 국내법상 의무일 뿐, 제3국 선박이나 제3국 국민에게 국제법상 직접적 효력을 갖지 않는다."},{"id":"i716","t":"미국이 자국 법원 영장이나 국내법을 근거로 공해에서 외국 선박을 강제 집행하는 것은 관할권의 [[역외적용]]으로 국제법 위반 소지가 있다."},{"id":"i717","t":"유엔 안보리 승인 없는 해상차단이나 봉쇄는 무력사용금지원칙(유엔 헌장 제[[2]]조 4항)에 위반될 수 있다."},{"id":"i718","t":"국제법상 해적행위는 [[사]]적 이익을 위한 폭력과 억류를 요건으로 하므로, 국가 공권력에 의한 나포는 전통적 의미의 해적에는 해당하지 않는다."},{"id":"i719","t":"이 사건은 공해 [[기국]]주의, 제재의 역외 집행, 해상봉쇄의 적법성이 충돌하는 전형적 국제법 분쟁으로서 미국 조치는 국제법에 위배될 가능성이 높다."}]},{"id":"i720","title":"ITLOS 심해저 권고적 의견(2011)","note":"후원국의 의무 내용, 책임형태, 사전주의원칙, 환경영향평가원칙, 대세적 의무. ISA 법률·기술위원회가 후원국(sponsoring State) 책임의 범위와 성격에 대한 불확실성 해소를 위해 UNCLOS 제187조·제191조에 근거하여 요청. 예: 삼성물산이 심해저 활동을 할 때 우리나라 = 후원국.","items":[{"id":"i721","t":"후원국의 기본 의무는 계약자가 협약과 관련 규범을 준수하도록 보장하기 위해 합리적으로 적절한 법령과 행정조치를 제정·집행해야 하는 수단의무이며, 결과의무가 아니라 상당한 주의를 기울여야 하는 행위의무이다."},{"id":"i722","t":"후원국은 사전주의 접근, 최적환경관리방안, 환경영향평가, 긴급명령 이행 능력 보장, 피해배상 절차 보장 등의 직접 의무를 부담하며, 그 이행 여부는 주의의무 이행 판단의 핵심 요소가 된다."},{"id":"i723","t":"사전주의 접근은 해저기구 규칙을 통해 구속력 있는 의무로 전환되었다. (사전주의 접근 자체가 구속력이 있다는 의미는 아님)"},{"id":"i724","t":"사전주의 접근은 국제관습법으로 발전해가는 경향을 보인다. (관습법이라고 단정하지는 않음)"},{"id":"i725","t":"환경영향평가는 계약자가 준수하도록 후원국이 보장해야 할 절차적 의무이자 후원국이 ISA와 협력하여 운영·감독해야 하는 직접 의무이다."},{"id":"i726","t":"환경영향평가원칙은 이미 관습법적 의무로 인정되어 심해저 활동에도 동일하게 적용된다. (ICJ와 마찬가지)"},{"id":"i727","t":"후원국의 책임은 계약자의 행위 자체가 아니라 후원국 자신의 주의의무를 위반한 경우에만 발생한다."},{"id":"i728","t":"배상 가능한 피해에는 심해저 자원과 해양환경에 대한 손해가 포함되고 모든 당사국이 청구할 수 있다는 점에서 환경보호 의무는 erga omnes적 성격을 갖는다."},{"id":"i729","t":"후원국 관련 규정은 선진국과 개발도상국 모두에게 동일하게 적용되지만, 사전주의 원칙이 각국의 능력에 따라 적용되어야 한다는 점에서 이행의 방식과 강도는 일정한 차이를 허용한다."}]},{"id":"i730","title":"ARA Libertad 사건(아르헨티나 v. 가나, 2012, ITLOS 잠정조치)","note":"아르헨티나 군함 ARA Libertad가 가나 테마항 기항 중 민사채권자 신청에 따른 가나 법원 명령으로 억류되었다. ITLOS는 2012.12.15. 즉각적 석방을 명령하였고, 가나가 이행하자 양국은 소를 취하하여 본안판단 없이 종결되었다.","items":[{"id":"i731","t":"ITLOS는 제290조 제5항에 따라 본안이 회부될 재판기구가 prima [[facie]] 관할권을 가질 [[개연성]]이 있는지를 심사한다.","tag":"잠정조치 요건①"},{"id":"i732","t":"신청인이 주장하는 권리가 그럴듯한 권리(plausible rights)에 해당하고, 요청된 조치가 그 권리의 보전과 충분한 관련성(link)을 가져야 한다.","tag":"잠정조치 요건②"},{"id":"i733","t":"회복하기 어려운 손해가 발생할 현실적·임박한 위험, 즉 [[긴급성(urgency)]]이 존재하여야 한다.","tag":"잠정조치 요건③"},{"id":"i734","t":"잠정조치는 본안을 선결하지 않으면서 권리 보전을 위해 [[필요]]하고 비례적인 조치여야 한다.","tag":"잠정조치 요건④"},{"id":"i735","t":"아르헨티나는 ARA Libertad가 제29조의 군함에 해당하며, 제32조·제95조 및 관습국제법에 따라 연안국의 관할권으로부터 완전한 [[면제]]와 불가침성을 향유한다고 주장하였다."},{"id":"i736","t":"가나는 항만 이용에 따라 자발적으로 관할권에 복종한 측면이 있고, 억류는 국내법원의 민사 집행 절차이며, 긴급성이나 회복불가능한 손해는 존재하지 않는다고 항변하였다."},{"id":"i737","t":"법원은 부속서Ⅶ 중재재판부가 제32조 해석·적용 분쟁으로서 prima facie 관할권을 가질 개연성이 있고 제283조의 견해교환도 이루어졌으며, 군함 억류가 계속될 경우 회복하기 어려운 손해 위험이 있다고 보아 즉각적 석방을 명령하였다."},{"id":"i738","t":"제290조 제1항: 재판소가 [[일응]] 관할권을 가지는 것으로 판단하는 경우, 최종 판결이 날 때까지 잠정조치를 명령할 수 있다."},{"id":"i739","t":"제290조 제5항: 잠정조치 요청 후 [[2]]주일 이내에 재판소 합의가 이루어지지 아니하는 경우에는 [[국제해양법]]재판소가 잠정조치를 명령할 수 있다."}]}]},{"id":"i740","title":"국제법 객체","secs":[{"id":"i741","title":"남극조약(1959)","note":"","items":[{"id":"i742","t":"남극지역은 평화적 [[목적]]을 위하여서만 이용된다. 군사기지·방비시설의 설치, 무기실험 및 군사훈련 등 군사적 성격의 조치는 금지된다."},{"id":"i743","t":"감시원은 남극지역의 어느 지역 또는 모든 지역에 언제든지 접근할 완전한 [[자유]]를 가진다."},{"id":"i744","t":"조약의 어떠한 규정도 종전에 주장한 남극지역에서의 영토주권 또는 청구권을 [[포기]]하는 것으로 해석되지 아니한다."},{"id":"i745","t":"조약 발효 중에 발생하는 어떠한 행위 또는 활동도 영토주권에 관한 [[청구권]]을 주장·지지·부인하기 위한 근거가 되지 아니한다."},{"id":"i746","t":"남극지역에서의 모든 [[핵폭발]]과 방사선 폐기물의 처분은 금지된다."},{"id":"i747","t":"조약의 제규정은 모든 빙산을 포함하여 남위 [[60]]도 이남의 지역에 적용된다."},{"id":"i748","t":"조약의 어떠한 규정도 동 지역내의 [[공해]]에 관한 국제법상의 어느 국가의 권리 또는 권리의 행사에 영향을 미치지 아니한다."},{"id":"i749","t":"감시원은 그를 지명하는 체약당사국의 [[국민]]이어야 한다."},{"id":"i750","t":"감시원과 과학요원 및 동행 직원은 남극지역에 있는 동안 임무 수행 중의 작위·부작위에 대하여 그들의 [[국적국]]인 체약당사국의 관할권에만 복종한다."},{"id":"i751","t":"조약의 해석·적용에 관한 분쟁이 평화적 수단으로 해결되지 않는 경우 모든 분쟁당사국의 동의를 얻어 [[국제사법재판소]]에 회부되어야 한다."}]},{"id":"i752","title":"외기권 물체 등록협약(1974 채택/1976 발효/1981 한국 발효)","note":"","items":[{"id":"i753","t":"우주 물체가 지구 궤도 또는 그 이원에 발사되었을 때, 발사국은 유지하여야 하는 적절한 등록부에 등재함으로써 우주 물체를 [[등록]]하여야 한다."},{"id":"i754","t":"발사국은 등록의 확정을 [[국제연합 사무총장]]에게 통보하여야 한다."},{"id":"i755","t":"발사국이 둘 또는 그 이상일 경우 그들 중의 [[일국]]이 등록을 하여야 함을 공동으로 결정하여야 한다."},{"id":"i756","t":"각 등록의 내용 및 그것이 유지되는 조건은 관련 [[등록국]]에 의하여 결정되어야 한다."},{"id":"i757","t":"[[국제연합 사무총장]]은 제공된 정보가 기록되어야 하는 등록부를 유지하여야 한다."},{"id":"i758","t":"등록국은 등록된 각 우주 물체에 관련한 정보를 실행가능한 한 신속히 [[국제연합 사무총장]]에게 제공하여야 한다."},{"id":"i759","t":"각 등록국은 때때로 등록된 우주 물체에 관련된 [[추가]] 정보를 국제연합 사무총장에게 제공할 수 있다."},{"id":"i760","t":"각 등록국은 이전에 정보를 전달하였으나 지구 궤도상에 존재하지 않는 우주 물체에 대해서도 가능한 한 신속히 사무총장에게 [[통보]]하여야 한다."},{"id":"i761","t":"정부간 국제기구가 협약상 권리 의무의 수락을 선언하고 그 다수 회원국이 본 협약 [[및]] 외기권조약의 당사국일 경우 당해 기구에도 해당하는 것으로 간주된다."},{"id":"i762","t":"탈퇴는 통고의 수령일로부터 [[1]]년이 경과하였을 시 효력이 있다."}]},{"id":"i763","title":"영토 관련 주요 판례","note":"","items":[{"id":"i764","t":"ICJ는 Land, Island and Maritime Frontier Dispute (El Salvador/[[Honduras]]: [[Nicaragua]] intervening)에서 폰세카 만이 니카라과, 엘살바도르, 온두라스의 공동 주권에 속하는 역사적 수역임을 인정했다."},{"id":"i765","t":"Frontier Dispute (Burkina Faso/Mali)사건에서 ICJ는 [[effectivités]] 개념을 처음으로 언급하였다. 이는 권원 취득에 직접 관계되는 주권의 표시 또는 이미 성립된 권원을 확인하기 위한 증거로서의 관할권 행사나 표시를 의미한다."},{"id":"i766","t":"ICJ는 Cameroon v. Nigeria(2002)에서 de Visscher가 제안한 역사적 응고이론(historical consolidation) 개념을 [[배척]]했다."},{"id":"i767","t":"Minquiers and Ecrehos Case(1953)에서 ICJ는 실효적 지배의 상대적 힘에 따라 [[영국]]의 영유권을 인정하였다."},{"id":"i768","t":"Pulau Ligitan and Pulau Sipadan 판결(2002)에서 ICJ는 섬 주변 수역의 [[사인]]의 어로행위는 영유권 판단에 미칠 effectivités에 해당하지 않는다고 평가했다."},{"id":"i769","t":"Clipperton Island(1931)나 Eastern Greenland(1933)사건에서는 무인도나 정주인구가 없는 지역에 대해서는 [[상징]]적 지배가 인정된다고 하였다."},{"id":"i770","t":"Eastern Greenland (Denmark v. Norway)(1933)에서 [[노르웨이]] 외무장관의 부작위 약속(Ihlen 선언)은 일방적 행위로서 구속력이 있다고 판시하였다."},{"id":"i771","t":"Kasikili/Sedudu(1999)에서 ICJ는 주민의 장기간 이용은 국가 주권 행위가 아니므로 [[시효]] 취득을 구성하지 않고, 경계를 규정한 조약이 존재하는 경우 [[시효]]취득 논리는 배제된다고 판시하였다."},{"id":"i772","t":"Temple of Preah Vihear(1962)사건에서 태국이 적절한 시간 내에 [[항의]]하지 않았으므로 캄보디아의 영유권을 인정하였다."},{"id":"i773","t":"Frontier Dispute (Benin/Niger, 2005)에서 ICJ는 국경을 형성하는 [[가항]]하천 위에 교량이 있는 경우 별도 합의가 없는 한 중간선이 아닌 중심수류의 수직상공에 해당하는 교량 지점을 국경으로 판단했다."}]}]},{"id":"i774","title":"환경법","secs":[{"id":"i775","title":"국제환경법의 발달사","note":"","items":[{"id":"i776","t":"[[람사르]]협약(1971/1975)은 국제적으로 중요한 습지를 [[람사르]]목록에 등재하여 보전하고 “현명한 이용(wise use)” 원칙에 따라 관리하도록 의무를 부과한 협약이다."},{"id":"i777","t":"[[런던]]협약(1972/1975)은 폐기물 등의 해양투기를 원칙적으로 금지하거나 허가제로 규제한 해양환경보호 협약이다."},{"id":"i778","t":"세계[[유산]]협약(1972/1975)은 탁월한 보편적 가치(OUV)를 가지는 문화·자연[[유산]]을 세계[[유산]]목록에 등재하고 국제협력을 통해 보호하도록 한 협약이다."},{"id":"i779","t":"CITES([[1973]]/1975)는 멸종위기 야생동식물을 부속서 I·II·III로 구분하고 수출입 허가제를 통해 국제거래를 통제하는 협약이다."},{"id":"i780","t":"장거리월경대기오염협약(LRTAP, 1979/1983)은 [[산성비]] 등 월경 대기오염을 감축하기 위한 기본협약이다."},{"id":"i781","t":"해양법협약(1982/[[1994]])은 국가에게 해양환경 보호·보전 의무와 오염방지 조치 의무를 부과한 협약이다."},{"id":"i782","t":"비엔나협약(1985/1988)은 [[오존층]] 보호를 위한 일반적 협력의 틀을 규정한 기본협약이다."},{"id":"i783","t":"[[몬트리올]] 의정서(1987/1989)는 오존층 파괴물질의 생산과 소비를 단계적으로 감축·폐지하는 감축의무와 이행점검체계를 도입하였다."},{"id":"i784","t":"바젤협약(1989/[[1992]])은 유해폐기물의 국경간 이동을 사전통보승인절차(PIC)에 따라 통제하는 협약이다."},{"id":"i785","t":"[[에스푸(Espoo)]] 협약(1991/1997)은 초국경적 환경영향이 예상되는 사업에 대해 사전 통보, 환경영향평가, 협의 및 정보제공을 의무화한 절차적 협약이다."},{"id":"i786","t":"기후변화협약([[1992]]/1994)은 공동책임·차별적 책임(CBDR) 원칙에 기초한 기후체제의 기본협약이다."},{"id":"i787","t":"생물다양성협약(1992/1993)은 생물다양성의 보전, [[지속가능]]한 이용, 이익의 공정·공평한 공유를 3대 목표로 하는 협약이다."},{"id":"i788","t":"[[사막]]화방지협약(UNCCD, 1994/1996)은 건조지역에서의 [[사막]]화 및 토지황폐화 방지를 위한 협약이다."},{"id":"i789","t":"교토의정서(1997/2005)는 선진국에 [[온실가스]] 감축목표를 설정하고 배출권거래제·CDM·JI 등 유연성 메커니즘을 도입하였다."},{"id":"i790","t":"[[카르타헤나]] 의정서(2000/2003)는 유전자변형생물체(LMOs)의 국가 간 이동에 대해 사전통보승인(AIA) 절차와 위험평가를 요구한다."},{"id":"i791","t":"[[스톡홀름]]협약(2001/2004)은 잔류성유기오염물질(POPs)의 생산·사용·배출을 감축·폐지하는 협약이다."},{"id":"i792","t":"나고야 의정서(2010/[[2014]])는 유전자원 접근 시 PIC과 MAT를 요구하는 접근·이익공유(ABS) 체제를 구체화하였다."},{"id":"i793","t":"미나마타협약(2013/2017)은 [[수은]]의 채굴·무역·사용·배출·폐기까지 전주기를 규제한다."},{"id":"i794","t":"[[파리]]협정(2015/2016)은 모든 당사국이 NDC를 제출·갱신하고, 기온 상승을 2℃ 이하(가능하면 1.5℃)로 제한하는 것을 목표로 한다."}]},{"id":"i795","title":"환경 다자조약 예상논점","note":"","items":[{"id":"i796","t":"오존층보호협약에 대한 [[몬트리올의정서]]는 환경문제와 무역문제를 연계시킨 최초 환경협약이다."},{"id":"i797","t":"오존층보호를 위한 빈협약은 [[사전주의원칙]]을 최초로 규정한 문서이다."},{"id":"i798","t":"[[비준수절차]]는 1992년 코펜하겐회의에서 몬트리올의정서의 이행제도로 도입되었으며, 자국 이익 침해와 무관하게 타당사국의 비준수를 통보할 수 있다."},{"id":"i799","t":"기후변화협약(1992)에는 CBDR, 사전예방원칙, [[사전주의]]원칙, 지속가능개발원칙 등이 규정되어 있다."},{"id":"i800","t":"교토의정서 이행에 있어서 [[공동이행]]은 부속서Ⅰ국가 간 협조체제로서 타국에 지원하여 감축한 일부를 자국 감축분으로 인정받는 제도이다."},{"id":"i801","t":"교토의정서 이행에 있어서 [[청정개발체제]]는 부속서Ⅰ국가와 비부속서Ⅰ국가 간 협조체제이다."},{"id":"i802","t":"파리협정은 지구 평균 기온 상승을 [[산업화]] 이전 대비 2℃, 최대한 1.5℃로 제한하기로 하였다."},{"id":"i803","t":"파리협정에 의하면 [[2023]]년부터 5년 단위로 전지구적 이행점검을 실시하며, 이는 전체 이행 수준을 평가하는 방식이다."},{"id":"i804","t":"파리협정 당사국들은 [[5]]년마다 국가결정공약을 제출해야 한다."},{"id":"i805","t":"파리협정에 의하면 최빈개도국과 군소도서국가를 제외하고 모든 당사국은 [[2]]년마다 이행보고서를 제출해야 한다."},{"id":"i806","t":"런던협약(1972)은 각국 [[내수]]를 제외한 전 세계 해양에 적용된다."},{"id":"i807","t":"1996년 런던의정서는 7가지 지정물질을 제외한 모든 물질의 해양투기를 [[금지]]하였다."},{"id":"i808","t":"런던덤핑의정서(1996)는 사전주의 접근법과 [[오염자]]부담 접근법을 법전화하였다."},{"id":"i809","t":"런던덤핑협약은 [[금지물질]] 열거방식을 채택한 반면, 의정서는 역리스트 방식을 채택하였다."},{"id":"i810","t":"MARPOL 73/78상 유출에는 고의적 유출뿐만 아니라 [[비고의적]] 유출도 포함된다."},{"id":"i811","t":"MARPOL 당사국은 [[비당사국]] 선박에 대해서도 협약을 적용해야 한다."},{"id":"i812","t":"바젤협약 당사국은 원칙적으로 [[비당사국]]과의 유해폐기물 수출입을 허가할 수 없다."},{"id":"i813","t":"바젤협약에 의하면 경유국 동의가 필요하나, [[60]]일 내 회답이 없으면 수출국이 이동을 허가할 수 있다."},{"id":"i814","t":"1995년 바젤협약 당사국회의는 [[Ban Amendment]]를 채택하였다."},{"id":"i815","t":"1999년 당사국회의는 책임과 [[보상]]에 관한 의정서를 채택하였다."},{"id":"i816","t":"바젤협약은 [[가정]]폐기물과 유해폐기물만을 규제한다."},{"id":"i817","t":"[[방사능]]폐기물은 별도 국제합의에 따라 규제되어 바젤협약 대상에서 제외된다."},{"id":"i818","t":"Basel Ban Amendment 적용 대상 국가는 [[OECD]] 회원국, EU, 리히텐슈타인 등이다."},{"id":"i819","t":"Ban Amendment에 의하면 최종처리용 [[유해]]폐기물 이동은 즉시 금지되고, 재활용 폐기물은 1997년 12월 31일까지 금지된다."},{"id":"i820","t":"바젤책임배상의정서는 관련자에게 [[엄격(절대)]]책임을 부과하고 기타 자에게는 과실책임을 부과한다."},{"id":"i821","t":"생물다양성협약(1992)에는 [[지속가능]]발전원칙과 관리책임원칙이 규정되어 있다."},{"id":"i822","t":"생물다양성협약에는 [[환경]]영향평가원칙이 포함되어 있다."},{"id":"i823","t":"[[나고야]]의정서는 유전자원 이용 및 이익 공유를 규정하며 2010년 채택되었다."},{"id":"i824","t":"[[카르타헤나]] 의정서는 과학적 불확실성이 있는 경우에도 사전주의에 따라 수입국이 규제할 수 있도록 한다."},{"id":"i825","t":"나고야의정서에 의하면 타국 유전자원 접근 시 사전통보 및 [[승인(동의)]]이 필요하다."},{"id":"i826","t":"나고야의정서는 [[토착]]공동체의 전통지식에도 적용된다."},{"id":"i827","t":"나고야의정서는 [[공해]] 및 남극의 유전자원에는 적용되지 않는다."}]},{"id":"i828","title":"국제환경법 기본원칙 판례","note":"","items":[{"id":"i829","t":"Trail Smelter 중재(1941)는 국가는 자국 활동으로 타국에 중대한 환경손해를 야기하지 않을 [[무해원칙(no-harm rule)]]과 손해배상 책임을 부담한다고 판시하였다."},{"id":"i830","t":"Lake Lanoux 중재(1957)는 사전 통보와 성실한 협의 의무는 인정되나 상대국의 [[동의]]권이나 거부권은 존재하지 않는다고 판시하였다."},{"id":"i831","t":"Gabčíkovo–Nagymaros(ICJ, 1997)는 경제개발과 환경보호의 조화를 요구하는 [[지속가능발전]]을 국제법상 고려 요소로 명시하였다."},{"id":"i832","t":"Southern Bluefin Tuna 중재(2000)는 국가들은 자원 보존을 위하여 [[사전주의 조치]]와 협력 의무를 부담하여야 한다고 판시하였다."},{"id":"i833","t":"Rhine Chlorides 중재(2004)는 [[오염자부담]]원칙을 관습국제법으로 승인하지 않고 조약 문언 해석에 따라 비용부담 범위를 제한적으로 결정하였다."},{"id":"i834","t":"Iron Rhine 중재(2005)는 통과권은 인정하면서도 환경보전 및 복원조치를 병행하여야 한다고 판시하여 [[지속가능발전]] 원칙을 구체적으로 적용하였다."},{"id":"i835","t":"Pulp Mills(ICJ, 2010)는 사전 통보·협의 의무와 함께 [[환경영향평가(EIA)]]가 관습국제법상 요구되는 절차적 의무라고 최초로 명확히 선언하였다."},{"id":"i836","t":"ITLOS 심해저분쟁부 권고적 의견(2011)은 후원국은 엄격한 주의의무를 부담하며 [[환경영향평가(EIA)]]를 수행할 의무가 관습국제법상 직접적으로 발생한다고 판시하였다."},{"id":"i837","t":"Indus Waters Kishenganga 중재(2013)는 최소유량 유지와 [[환경영향평가]] 실시 등 환경보호를 고려한 하천 이용 의무를 인정하였다."},{"id":"i838","t":"Certain Activities / Construction of a Road(ICJ, 2015)는 사전 환경영향평가는 [[관습국제법]]상 의무이며 이를 이행하지 않은 국가는 국제책임을 부담한다고 판시하였다."},{"id":"i839","t":"South China Sea 중재(Philippines v. [[China]], 2016)는 대규모 매립과 산호초 파괴에 대해 해양환경 보호·보존 의무 위반을 인정하였다."}]}]},{"id":"i840","title":"분쟁해결제도","secs":[{"id":"i841","title":"국제사법재판소(ICJ) 규정·절차","note":"","items":[{"id":"i842","t":"ICJ는 1993년 처음으로 7인의 판사로 구성된 [[환경]]담당 소재판부를 설치하여 2006년까지 유지해 왔으나 현재는 더 이상 설치하지 않고 있다."},{"id":"i843","t":"[[간이]]절차부는 5인으로 구성되며 매년 설치되고, 출석 불가한 재판관을 대리할 2인의 재판관을 선정해야 한다."},{"id":"i844","t":"1982년 [[메인만]] 경계획정사건에서 처음으로 특별재판부가 설치되었으나 근래 이용도가 떨어진 상태이다."},{"id":"i845","t":"임시재판관제도는 소법정, 권고적 사건에 적용되나, [[잠정]]조치 결정시에는 적용되지 않는다."},{"id":"i846","t":"판결 정족수는 출석 재판관 과반수이며 가부동수인 경우 [[재판소장]]이 결정투표권을 갖는다."},{"id":"i847","t":"규정당사국이 아닌 국가는 [[안보리]] 권고, [[총회]] 결정으로 규정당사국이 될 수 있다."},{"id":"i848","t":"Genocide Convention (Croatia v. Serbia) 선결적 항변에서, 소 제기 당시 [[세르비아]]가 재판소 출입 요건을 충족하지 못했더라도 소 제기 후 UN 가입 등으로 사후에 충족될 수 있다고 하였다."},{"id":"i849","t":"[[약정]]관할은 사전에 재판부탁조약이나 재판부탁 조항을 둔 경우를 말하며, 분쟁 발생 시 합의 없이 일방적으로 제소할 수 있다."},{"id":"i850","t":"확대관할권은 ICJ의 경우 [[코르푸해협]]사건에서 처음으로 인정되었다."},{"id":"i851","t":"2002년 콩고와 프랑스 간 사건에서 [[확대]]관할권이 인정되었다. 콩고의 일방적 제소와 프랑스의 응소로 성립하였으나 콩고의 제소철회로 판결없이 종결되었다."},{"id":"i852","t":"관할권 성립여부는 제소시점을 기준으로 판단하며, 일단 성립하면 이후 사태 발전은 관할권 존속 여부에 영향을 미치지 아니한다([[노테봄]]규칙)."},{"id":"i853","t":"선택조항수락선언서는 [[유엔사무총장]]에게 기탁하고, 사무총장은 사본을 규정 당사국과 ICJ 서기에게 송부한다."},{"id":"i854","t":"선택조항 수락 선언 [[철회]]에 대한 의사를 미리 표시하지 않았어도 [[철회]]할 수 있다."},{"id":"i855","t":"금화원칙과 관련하여 ICJ는 제3국의 법익이 바로 재판의 [[주제]]에 해당하지 않는 한 관할권 행사가 가능하다고 보고 있다."},{"id":"i856","t":"2016년 Nicaragua v. Colombia(Preliminary Objections)에서 ICJ의 [[고유]]관할권 주장이 제기된 바 있으나, 재판소는 이 문제에 대한 판단을 회피하였다."},{"id":"i857","t":"[[라그란드]] 사건에서 재판소는 처음으로 직권으로 잠정조치를 결정했다."},{"id":"i858","t":"잠정조치 결정과 본안판단 가능 여부에 대한 결정은 별개이므로 잠정조치가 지시된 경우에도 당사국은 [[선결적 항변]]을 제기할 수 있다."},{"id":"i859","t":"[[금화]]사건에서는 원고인 이탈리아가 선결적 항변을 제기하였다."},{"id":"i860","t":"사건이 재판부탁에 관한 특별협정에 의해 부탁된 경우에도 당사자 일방에 의해 선결적 항변이 제기될 수 있다.","a":"O"},{"id":"i861","t":"재판소가 부수적 관할권을 행사하는 사건에서도 선결적 항변이 제기되기도 한다.","a":"O"},{"id":"i862","t":"선결적 항변에 대한 판결에 대해서도 판결 해석신청의 대상이 될 수 있다.","a":"O"},{"id":"i863","t":"1990년 ICJ는 엘살바도르와 온두라스 간 국경분쟁사건에서 [[니카라과]]에게 소송참가를 처음으로 허용했다."},{"id":"i864","t":"남극해 포경 사건에서 [[뉴질랜드]]는 63조(해석적 참가)에 따른 소송참가권을 행사하였고 ICJ는 이를 허용하였다."},{"id":"i865","t":"ICJ는 ‘아야 데 라 토레 사건’에서 [[쿠바]]의 해석적 참가를 처음으로 허용하였다."},{"id":"i866","t":"ICJ판결에 대해서는 [[재심]]절차가 있으나, 권고적 의견에 대해서는 [[재심]]절차가 없다."},{"id":"i867","t":"판결에 대한 해석 요청은 [[주문]]에 대한 것이어야 한다."},{"id":"i868","t":"아직까지 안보리가 ICJ판결을 강제하기 위한 결의를 채택한 사례는 없다.","a":"O"},{"id":"i869","t":"[[권고적 의견]]은 재판과 달리 구체적 분쟁을 전제로 하지 않으며 가설적이거나 추상적 문제에 대해서도 의견을 부여할 수 있다."},{"id":"i870","t":"안보리의 경우 권고적 의견 요청은 [[비절차사항]]이므로 상임이사국들의 거부권이 적용된다."},{"id":"i871","t":"유엔 주요 기관 중 [[사무국]]은 권고적 의견 요청과 관련하여 총회로부터 포괄적 사전승인을 받지 않았다."},{"id":"i872","t":"권고적 사건에 있어서 국가는 특정 판사에 대해 [[기피]]신청을 할 수 있다."},{"id":"i873","t":"ICJ는 Western Sahara 사건에서 권고적 관할권을 행사함에 있어 이해관계국의 [[동의]]가 있어야 하는 것은 아니라고 밝힌 바 있다."}]},{"id":"i874","title":"ICJ 소송참가 사례","note":"","items":[{"id":"i875","t":"Haya de la Torre(1951)는 [[쿠바]]가 Havana Convention의 [[해석]]과 관련하여 참가하였고 ICJ가 이를 인용함으로써 제63조에 따른 해석적 참가가 최초로 인정된 사례이다."},{"id":"i876","t":"Continental Shelf(Libya/Malta, 1984)는 [[이탈리아]]가 법적 이익을 근거로 참가를 신청하였으나 기각되어 제62조 자발적 참가가 허용되지 않은 사례이다."},{"id":"i877","t":"Land, Island and Maritime Frontier Dispute(1990)는 [[니카라과]]의 법적 이해관계를 인정하여 제62조 [[자발적]] 참가가 최초로 허가된 사례이다."},{"id":"i878","t":"Cameroon v. Nigeria(1999)는 [[적도기니]]의 참가 신청이 직접적 법적 이익 부족을 이유로 기각된 사례이다."},{"id":"i879","t":"Pulau Ligitan and Pulau Sipadan(2001)은 [[필리핀]]의 참가 신청이 직접적 법적 관련성 부족으로 거부된 사례이다."},{"id":"i880","t":"Jurisdictional Immunities of the State(2011 Order)는 [[그리스]]가 자국 판결의 집행과 관련된 법적 이해관계를 인정받아 참가가 허용된 사례이다."},{"id":"i881","t":"Nicaragua v. Colombia(2011 Orders)는 코스타리카와 [[온두라스]]의 참가 신청이 모두 기각된 사례이다."},{"id":"i882","t":"(2012–2013 Orders)는 [[에콰도르]]와 콜롬비아가 기존 해양경계 협정에 따른 직접적 법적 이해관계를 인정받아 각각 참가가 허용된 사례이다."},{"id":"i883","t":"Whaling in the Antarctic(2014)은 [[뉴질랜드]]가 포경규제협약의 해석과 관련하여 참가하였고 자동 인용되어 제63조 해석적 참가가 인정된 사례이다."},{"id":"i884","t":"The Gambia v. Myanmar(2022 이후)는 다수 국가가 [[제노사이드]]협약 해석을 이유로 참가하여 제63조 해석적 집단 참가가 폭넓게 인정된 사례이다."},{"id":"i885","t":"Ukraine v. Russia(2022 이후)는 30여 개 국가가 참가하여 제[[63]]조 해석적 참가가 역사상 최대 규모로 허용된 사례이다."},{"id":"i886","t":"South Africa v. Israel(2024 이후)은 다수 국가의 참가가 자동 인용되어 제[[63]]조 해석적 참가가 확대되고 있음을 보여주는 최신 사례이다."}]},{"id":"i887","title":"ICJ 주요 권고적 의견","note":"","items":[{"id":"i888","t":"Reparation for Injuries(1949): UN의 국제법상 법인격이 쟁점이었고, ICJ는 UN이 독자적인 국제법 주체로서 손해배상을 청구할 수 있다고 판단하였다."},{"id":"i889","t":"Admission of a State to the UN(1950): 회원국 가입에 정치적 조건을 부과할 수 있는지가 쟁점이었고, ICJ는 헌장 제4조의 요건 외의 조건을 부과하는 것은 허용되지 않는다고 판단하였다."},{"id":"i890","t":"International Status of South-West Africa(1950): 위임통치는 계속 존속하며 UN의 감독 하에 놓인다고 판단하였다."},{"id":"i891","t":"Reservations to the Genocide Convention(1951): 유보가 조약의 목적과 취지에 반하지 않고 양립하는 한 허용된다고 판단하였다."},{"id":"i892","t":"Effect of Awards of UN Administrative Tribunal(1954): UN은 행정재판소 판결을 존중하고 이행할 국제법상 의무를 진다고 판단하였다."},{"id":"i893","t":"Voting Procedure on South-West Africa(1955): 중요한 문제에 해당하므로 출석·투표 과반수 다수결이 요구된다고 판단하였다."},{"id":"i894","t":"Certain Expenses of the UN(1962): 평화유지활동 비용은 헌장상 UN의 합법적 경비로 회원국이 분담해야 한다고 판단하였다."},{"id":"i895","t":"Namibia(1971): 남아공의 점령은 불법이며 모든 국가는 이를 승인하거나 지원해서는 안 된다고 판단하였다."},{"id":"i896","t":"Western Sahara(1975): 어떠한 주권적 귀속도 주민의 자기결정권을 부정할 정도로 존재하지 않는다고 판단하였다."},{"id":"i897","t":"Applicability of Art. VI, Sec. 22 of the UN Privileges Convention(1989): 임무 수행 중인 전문가는 기능적 면제를 가진다고 판단하였다."},{"id":"i898","t":"Nuclear Weapons(1996): 일반적으로 국제인도법에 위반되지만 국가 존망이 걸린 극단적 경우에는 위법성을 단정할 수 없다고 판단하였다."},{"id":"i899","t":"Immunity of a Special Rapporteur(1999): 사무총장이 면제를 인정하면 국내법원은 이를 존중해야 한다고 판단하였다."},{"id":"i900","t":"Wall(2004): 장벽은 국제인도법과 인권법을 위반하며 철거와 배상 의무가 발생한다고 판단하였다."},{"id":"i901","t":"Kosovo(2010): 독립선언 그 자체는 국제법에 의해 금지되지 않는다고 판단하였다."},{"id":"i902","t":"Chagos(2019): 영국의 분리는 위법이며 모리셔스의 탈식민화는 완결되지 않았다고 판단하였다."},{"id":"i903","t":"Occupied Palestinian Territory(2024): 이스라엘의 점령정책과 관행이 자기결정권과 국제인도법 및 인권법을 중대하게 위반한다고 판단하였다."}]},{"id":"i904","title":"Nicaragua v. Germany(잠정조치 기각, 2024)","note":"니카라과는 독일이 이스라엘에 대한 무기 수출과 UNRWA 지원 중단 등으로 집단학살 방지의무 및 국제인도법상 의무를 위반하였다고 주장하며 2024.3.1. 제소·잠정조치 신청. ICJ는 2024.4.30. 일응 관할권은 인정하면서도 긴급성과 직접적 연관성이 충분히 입증되지 않았다고 보아 잠정조치를 기각하였고, 본안 심리 중. (학습포인트: 잠정조치 요건, 일견 관할권, 라그란드)","items":[{"id":"i905","t":"니카라과는 독일의 무기 이전과 UNRWA 지원 중단이 집단살해방지협약, 국제인도법 및 강행규범상 의무를 위반하였으며, 집단살해 및 중대한 국제인도법 위반을 방조할 위험이 있다고 주장하였다."},{"id":"i906","t":"ICJ는 규정 제[[41]]조에 따라 잠정조치를 명하기 위해서는 집단살해방지협약 제9조에 기초한 [[일견(prima facie)]] 관할권의 존재, 보호될 권리의 개연성, 긴급성 및 회복불가능한 손해의 위험이 충족되어야 한다고 전제하였다."},{"id":"i907","t":"ICJ는 독일이 ATT, EU 공통입장, 국내법에 따라 다층적 허가·심사 체계를 운영하고, 2023년 11월 이후 무기 수출 허가 규모가 현저히 감소하였다는 점을 고려하였다."},{"id":"i908","t":"ICJ는 독일의 무기 이전과 가자지구의 인도적 피해 사이에 회복불가능한 손해의 [[긴급]]한 위험이 충분히 소명되었다고 보기 어렵다고 판단하였다."},{"id":"i909","t":"UNRWA 지원은 법적 의무가 아닌 자발적 기여이며, 독일이 다른 경로를 통해 인도적 지원을 계속하고 있다는 점을 고려하였다."},{"id":"i910","t":"ICJ는 독일의 [[관할권]] 부존재 주장을 받아들이지 않고, 명백한 [[관할권]] 결여는 존재하지 않는다며 사건을 계속 심리 대상에 두었다."},{"id":"i911","t":"LaGrand ([[Germany]] v. United States, 2001)에서 ICJ는 잠정조치의 구속력을 인정하면서, 유엔헌장 제[[94]]조 제1항은 ‘판결’ 이행 의무 조항일 뿐 잠정조치의 구속력을 배제하는 규정이 아니며, 제[[94]]조 제2항의 안보리 회부 절차 역시 잠정조치의 법적 성질을 부인하는 근거가 될 수 없다고 해석하였다."}]},{"id":"i912","title":"ICJ 최근 판례 동향","note":"","items":[{"id":"i913","t":"Ukraine v. Russian Federation(2024.2.2.): ICJ는 러시아의 선결적 항변을 대부분 기각하고 본안 심리를 계속하기로 결정하였으며, 협약 위반 여부에 대한 본안판단은 하지 않았다. (제노사이드협약/선결적 항변)"},{"id":"i914","t":"South Africa v. Israel(2024.1.26./3.28./5.24.): ICJ는 협약상 권리가 개연적으로 침해될 위험이 있다고 보아 민간인 보호, 인도적 지원 보장, 라파 군사작전 중단 등 잠정조치를 단계적으로 명령하였다. (잠정조치)"},{"id":"i915","t":"Nicaragua v. Germany(2024.4.30.): 긴급성과 회복할 수 없는 손해 요건 불충족으로 잠정조치 신청을 기각하면서도 모든 국가의 국제인도법 준수 의무를 재확인하였다. (잠정조치)"},{"id":"i916","t":"Mexican Embassy in Quito (Mexico v. Ecuador)(2024.5.23.): ICJ는 잠정조치 신청은 기각하였으나 외교공관의 불가침은 외교관계법의 기본원칙임을 강조하였다. (공관 불가침/잠정조치)"},{"id":"i917","t":"Occupied Palestinian Territory 권고적 의견(2024.7.19.): 점령과 정착촌 정책이 국제법에 위반되고 이스라엘은 이를 신속히 종료할 의무가 있으며, 다른 국가들은 그 불법상황을 승인하거나 원조·지원해서는 안 된다. (강행규범·대세적 의무 위반 시 국가들의 의무)"},{"id":"i918","t":"Gabon/Equatorial Guinea(2025.5.19.): ICJ는 1900년 식민지 조약에 근거하여 적도기니의 영유권을 인정하고, 가봉이 제시한 1974년 바타협정은 법적 구속력이 있는 조약이 아니라고 판단하였다. (조약의 정의 및 포섭)"},{"id":"i919","t":"Sudan v. UAE(2025.5.5.): UAE의 협약 제9조 유보로 관할이 인정되지 않는다고 보아 사건을 각하하고 잠정조치 신청도 받아들이지 않았다. (제노사이드협약/유보)"},{"id":"i920","t":"Climate Change 권고적 의견(2025.7.23.): 모든 국가는 기후변화 예방을 위해 상당한 주의의무를 부담하고, 기후변화조약뿐 아니라 관습국제법·인권법·해양법상 의무도 이행해야 하며, 위반 시 국가책임이 성립할 수 있다. (기후변화협약상 의무/위반시 책임)"},{"id":"i921","t":"UN 등의 점령지 내 활동에 관한 이스라엘의 의무 권고적 의견(2025.10.22.): 이스라엘은 UN과 국제기구의 활동을 존중하고, 인도적 구호와 필수 물자의 방해 없는 제공을 보장할 의무가 있다."},{"id":"i922","t":"Arbitral Award of 3 October 1899 (Guyana v. Venezuela)(계속 중): 에세키보 지역 영유권이 쟁점이며, 현상 변경 일방적 조치를 삼가도록 하는 잠정조치를 유지한 가운데 본안 심리를 계속하고 있다. (중재판정에 대한 ICJ 관할/잠정조치)"}]}]},{"id":"i923","title":"전쟁법","secs":[{"id":"i924","title":"무력사용 및 자위권","note":"2026년 2월 말, 미국과 이스라엘은 이란에 대한 대규모 군사 작전인 “Operation Epic Fury”를 감행하여 최고지도자 하메네이를 포함한 이란 관리 다수를 사살하였고, 이란은 중동 각국의 미군 기지와 이스라엘 주요 도시에 미사일·드론 보복 공격을 실시하였다.","items":[{"id":"i925","t":"UN헌장 제2조 제4항은 모든 회원국이 국제관계에서 타국의 영토보전 또는 정치적 독립에 대한 무력의 [[위협]]이나 사용을 금지한다고 규정한다."},{"id":"i926","t":"무력사용금지원칙은 관습국제법이자 [[강행]]규범으로서 국제공동체 전체에 대한 대세적 의무를 형성한다."},{"id":"i927","t":"19[[74]]년 「침략의 정의에 관한 UN총회 결의(3314)」는 침략을 무력사용으로 정의하고 침공·폭격·봉쇄·무장집단 파견 등을 예시하였다."},{"id":"i928","t":"1970년 「우호관계선언」은 무력에 의한 영토취득은 불법이며 [[승인]]될 수 없다고 선언하였다."},{"id":"i929","t":"UN헌장상 허용되는 무력사용에는 제42조 군사적 조치, 제51조 자위권, 제53조 지역적 강제조치(안보리 [[승인]] 하), 제107조 구적국조항이 포함된다."},{"id":"i930","t":"Nicaragua v. United States(1986)에서 자위권 행사를 위해서는 무력공격의 존재와 [[필요성]] 및 비례성 요건이 충족되어야 하며 그 입증책임은 자위권을 원용하는 국가에 있다고 판시하였다."},{"id":"i931","t":"Oil Platforms(2003)에서 재판소는 [[미국]]이 무력공격의 존재와 필요성 및 비례성을 입증하지 못하였다고 판단하였다."},{"id":"i932","t":"Armed Activities (DRC v. Uganda, 2005)에서 재판소는 자위권 주장을 엄격히 해석하고 우간다의 군사행동이 필요성 및 [[비례성]] 요건을 충족하지 못하였다고 판시하였다."},{"id":"i933","t":"The Caroline Incident(1837–1842)는 필요성이 “즉각적이고 압도적이며 다른 수단의 선택이나 숙고의 여지가 없어야 한다”는 기준을 제시하고, 대응조치는 위협에 [[비례]]하여 과도하지 않아야 한다는 원칙을 확립하였다."},{"id":"i934","t":"ICJ는 자위권은 “무력공격이 발생한 경우”에 한정된다고 해석함으로써 [[예방]]적 자위권을 명시적으로 승인하지 아니하였다."}]},{"id":"i935","title":"러시아-우크라이나 전쟁의 국제법적 쟁점","note":"러시아는 2022년 2월 우크라이나를 전면 침공하였고, 2022년 9월 우크라이나 4개 주를 불법적으로 병합 선언하였다. 침략금지 원칙 위반, 자위권·집단적 자위권, 점령지의 법적 지위, 전쟁범죄 책임 문제가 핵심 쟁점으로 남아 있다.","items":[{"id":"i936","t":"러시아의 2022년 침공은 UN 헌장 제[[2]]조 제4항이 금지하는 무력사용과 우크라이나의 영토보전을 명백히 침해하였다."},{"id":"i937","t":"크림반도 및 2022년 점령지 병합은 무력에 의한 영토취득 금지 원칙에 위반되어 국제사회에서 모두 [[무효]]로 간주된다."},{"id":"i938","t":"분쟁은 국제적 무력분쟁으로 분류되어 제네바협약과 제[[1]]추가의정서가 적용된다. (제2추가의정서는 비국제적 무력충돌에 적용)"},{"id":"i939","t":"민간인 살해·고문·강제이주 등은 [[전쟁]]범죄·인도에반한죄·일부는 집단살해죄 혐의까지 포함되어 ICC 수사의 대상이 된다."},{"id":"i940","t":"러시아의 침공은 로마규정상 [[침략]]범죄 정의에 부합하지만 관련 조항을 비준하지 않아 ICC는 [[침략]]범죄에 관할권을 행사할 수 없다."},{"id":"i941","t":"러시아의 거부권으로 안보리가 기능하지 못하자 [[총회]]가 ‘평화를 위한 단결’ 절차를 활용하여 침략 규탄 및 국제적 책임을 촉구하였다."},{"id":"i942","t":"러시아의 불법 무력사용은 국제위법행위에 해당하여 침해 중지와 배상 의무가 발생한다."},{"id":"i943","t":"러시아는 ICC [[로마]]규정 당사국이 아니지만, 우크라이나는 당사국이 아니어도 로마규정 제12조(3)에 따른 관할권 수락 선언을 통해 ICC가 자국 영토 내 국제범죄를 조사·기소할 수 있도록 허용하였다."},{"id":"i944","t":"UN 총회는 2022년 긴급특별총회 결의(ES-11/1)에서 러시아의 침공을 ‘[[침략]]’으로 규정하고, 러시아가 주장한 자위권은 어떤 근거도 갖지 않는다고 명시적으로 부정하였다."},{"id":"i945","t":"러시아의 승리로 우크라이나의 ‘영토 할양 동의’를 강요하는 방식은 비엔나협약 제52조와 무력에 의한 영토 취득 금지 원칙에 반해 [[무효]]이며 법적 효력이 발생하지 않는다."}]},{"id":"i946","title":"미국-이란 전쟁 관련 국제법적 쟁점","note":"미국은 이란 정권 교체와 민주화를 명분으로 이란 영토를 공격하였고, 이란은 중동 미군 기지에 대한 미사일·드론 보복 공격으로 대응하였다. 공습으로 초등학교가 공격받아 약 170명의 학생이 사망하였고 최고지도자 하메네이와 일부 가족도 사망한 것으로 알려졌다. 이란은 호르무즈 해협 봉쇄를 선언하면서 중국 등 우호국에는 선별적 통과를 허용하였고, 미국은 한국 등 동맹국에 참전을 요청하였다.","items":[{"id":"i947","t":"미국의 이란에 대한 무력공격은 헌장 제2조 제4항이 금지하는 무력 사용에 해당하며, 이란의 선행 [[무력공격]]이 존재하지 않는 한 제51조의 자위권으로 정당화되기 어렵다."},{"id":"i948","t":"정권 교체와 민주화를 명분으로 한 군사력 사용은 헌장 제2조 제[[7]]항의 국내문제 불간섭 원칙에 위반되는 것으로 평가될 가능성이 높다."},{"id":"i949","t":"이란의 미군 기지 공격은 미국의 무력공격이 선행하였다면 자위권 행사로 인정될 여지가 있으나, 공격 범위와 강도가 [[필요성]]·비례성 원칙을 충족하는지가 판단 기준이 된다."},{"id":"i950","t":"초등학교 공격으로 다수의 아동이 사망한 경우 제네바협약 및 제[[1]]추가의정서가 규정하는 민간인 보호 원칙과 구별 원칙 위반에 해당할 가능성이 높다."},{"id":"i951","t":"학교가 군사목표로 사용되었다는 명확한 증거가 없는 한 이러한 공격은 로마규정 제8조상 [[전쟁범죄]]로 평가될 가능성이 있다."},{"id":"i952","t":"최고지도자가 합법적 군사목표로 인정될 수 있는지가 문제되며, 가족과 같은 민간인이 동시에 사망하였다면 [[비례성]] 원칙 위반 가능성이 제기될 수 있다."},{"id":"i953","t":"이란의 호르무즈 해협 봉쇄는 유엔해양법협약 제37조 이하의 국제해협 [[통과통항권]]을 제한하는 것으로 평가될 수 있으나, 무력충돌 상황에서는 해상봉쇄의 전쟁법 규칙에 따라 일정한 조건하에서 인정될 여지도 있다."},{"id":"i954","t":"해협에 기뢰를 설치하여 통항을 방해하는 행위는 제37조–제44조가 보장하는 [[통과통항권]]을 침해할 가능성이 크며, 무력충돌 상황에서도 1907년 헤이그 제8협약과 해전법 규칙에 따라 엄격한 제한을 받는다."},{"id":"i955","t":"동맹국이 군사행동에 참여하려면 제51조에 따른 [[집단적 자위권]] 요건이 충족되어야 하며, 미국의 무력행사가 위법한 경우 동맹국의 개입도 정당화되기 어려울 수 있다."},{"id":"i956","t":"국제해협에서는 제38조와 제44조에 따라 [[모든]] 국가의 선박이 통과통항권을 향유하므로, 특정 국가 선박에게만 통과를 허용하거나 제한하는 조치는 협약 체계와 충돌할 가능성이 크다."}]},{"id":"i957","title":"전쟁법 기출 OX","note":"","items":[{"id":"i958","t":"「핵무기금지조약」의 존속기간은 정해져 있지 않으며, 해당 조약에 대한 유보와 탈퇴는 허용되지 않는다.","a":"X (탈퇴 허용)"}]}]}]},{"id":"i959","title":"INTL ECON LAW","chapters":[{"id":"i960","title":"GATT1994","secs":[{"id":"i961","title":"제3조 내국민대우 주요 판례","note":"","items":[{"id":"i962","t":"India – Solar Cells(2016): 국내산 셀·모듈 사용요건이 수입 셀·모듈의 [[경쟁조건]]을 불리하게 변경한 것으로 보아 GATT 제3조 제4항 위반을 인정하였다."},{"id":"i963","t":"Brazil – Taxation(패널 2017, 상소 2018): 국내 생산을 조건으로 한 세제 감면에 대해 EU·[[일본]]이 제소하였고, 수입품에 불리한 세제구조로 보아 제3조 제2항 및 제4항 위반을 인정하였다."},{"id":"i964","t":"Canada – Renewable Energy/FIT(2013): 패널은 국내산 부품 사용요건을 제3조 제[[4]]항 위반으로 보았으나, 상소기구는 패널의 법적 분석을 뒤집어 최종적으로 제3조 제[[4]]항 위반을 확정하지는 않았다."},{"id":"i965","t":"Korea – Various Measures on Beef(2001): 수입 쇠고기 별도 유통망 요구에 대해 수입 쇠고기에 불리한 [[경쟁조건]]을 부과한 것으로 보아 제3조 제4항 위반을 인정하였다."},{"id":"i966","t":"Chile – Alcoholic Beverages(2000): 알코올 도수에 따른 차등세율이 보호적 과세로서 제3조 제[[2]]항 제2문 위반에 해당한다고 인정하였다."},{"id":"i967","t":"Japan – Alcoholic Beverages Ⅱ(1996): 소주와 수입 보드카 등이 [[동종상품]]임에도 차별적 과세를 하여 제3조 제2항 위반을 인정하였다."},{"id":"i968","t":"Dominican Republic – Cigarettes(2005): 수입 담배에 대한 추가 세무보증 및 행정요건이 불리한 경쟁조건을 조성한 것으로 보아 제3조 제[[4]]항 위반을 인정하였다."},{"id":"i969","t":"China – Auto Parts(2009): 일정 비율 이상의 수입 부품 사용 시 추가 부과금은 수입 부품에 [[불리]]한 대우를 부과한 것으로 보아 제3조 제2항 제1문 및 제4항 위반을 인정하였다."},{"id":"i970","t":"Korea – Taxes on Alcoholic Beverages(1999): 소주와 수입 증류주가 [[직접경쟁 또는 대체가능]] 상품에 해당하며 보호적 효과가 존재한다고 보아 제3조 제2항 제2문 위반을 인정하였다."},{"id":"i971","t":"EC – Asbestos(2001): 석면과 대체 섬유제품이 동종상품에 해당하지 않는다고 보아 제3조 제4항 위반을 부정하였으며, 설령 차별이 존재하더라도 제20조 [[(b)]] 예외가 적용될 수 있음을 확인하였다."}]}]}]}]},{"id":"ir","name":"국제정치학","parts":[{"id":"i972","title":"IR 이론","chapters":[{"id":"i973","title":"제국주의론","secs":[{"id":"i974","title":"제국주의이론가","note":"불의타 대비용/각 학자의 핵심 주장 암기/25년 제국주의 출제되었음","items":[{"id":"i975","t":"J. A. 홉슨(J. A. Hobson)은 『Imperialism: A Study』(1902)에서 국내의 과잉저축과 소득불평등으로 인한 유효[[수요]] 부족이 자본가들로 하여금 해외 식민지로 투자를 강요하게 만들어 제국주의가 발생한다고 분석하였다."},{"id":"i976","t":"루돌프 힐퍼딩(Rudolf Hilferding)은 『Finance Capital』(1910)에서 산업자본과 은행자본이 결합한 [[금융]] 자본이 국가를 지배하면서 해외시장과 투자처를 확보하기 위한 제국주의적 팽창을 구조적으로 요구한다고 설명하였다."},{"id":"i977","t":"로자 룩셈부르크(Rosa Luxemburg)는 『The Accumulation of Capital』(1913)에서 [[자본]]주의는 비자본주의적 영역을 끊임없이 흡수해야만 축적이 가능하므로 식민지 확장과 제국주의는 체제 유지의 필연적 결과라고 주장하였다."},{"id":"i978","t":"블라디미르 레닌(V. I. Lenin)은 『Imperialism, the Highest Stage of Capitalism』(1917)에서 제국주의를 금융자본 지배, 독점자본의 형성, 자본수출, 세계 분할이라는 특징을 지닌 [[자본]]주의의 최종 단계로 규정하였다."},{"id":"i979","t":"니콜라이 부하린(Nikolai Bukharin)은 『Imperialism and World Economy』(1915)에서 각국 자본주의가 [[국가]]와 결합한 국가자본주의적 트러스트로 발전하면서 세계시장을 둘러싼 국가 간 제국주의 경쟁이 필연화된다고 분석하였다."},{"id":"i980","t":"요제프 슘페터(Joseph Schumpeter)는 『Imperialism and Social Classes』(1919)에서 제국주의를 자본주의의 경제적 논리가 아니라 전근대적 [[군국]]주의와 엘리트 계층의 잔존물로 해석하며, 순수한 자본주의는 본질적으로 평화적이라고 주장하였다."},{"id":"i981","t":"해나 아렌트(Hannah Arendt)는 『The Origins of Totalitarianism』(1951)에서 제국주의를 민족국가 체제가 초과 자본과 초과 [[인구]] 를 흡수하지 못해 무한한 팽창으로 전환된 정치적 위기로 해석하였다."},{"id":"i982","t":"에릭 홉스봄(Eric Hobsbawm)은 『The Age of Empire 1875–1914』(1987)에서 제국주의를 산업자본주의가 세계시장과 [[원료]] 공급지를 확보하기 위해 국가 권력을 동원한 글로벌 체제 확장으로 분석하였다."},{"id":"i983","t":"임마누엘 월러스틴(Immanuel Wallerstein)은 『The Modern World-System』(1974~)에서 제국주의를 중심부, 반주변부, 주변부로 구성된 세계체제 속에서 중심부 국가가 [[반주변부]]를 매개로 주변부의 잉여를 지속적으로 흡수하는 구조적 메커니즘으로 설명하였다."},{"id":"i984","t":"지오바니 아리기(Giovanni Arrighi)는 『The Long Twentieth Century』(1994)에서 제국주의를 금융화와 패권 교체의 장기 주기 속에서 지배국이 [[군사]]력과 자본력을 결합해 세계질서를 재편하는 과정으로 이론화하였다."}]}]},{"id":"i985","title":"동맹이론","secs":[{"id":"i986","title":"동맹이론가","note":"","items":[{"id":"i987","t":"케네스 왈츠(Kenneth Waltz)는 『Theory of International Politics』(1979)에서 국제체제의 [[무정부]]과 권력분포 때문에 국가는 생존을 위해 세력균형(balance of power)을 형성하는 동맹을 구축한다고 설명했다."},{"id":"i988","t":"스티븐 왈트(Stephen Walt)는 『The Origins of Alliances』(1987)에서 국가는 ①총합적 군사력, ②지리적 근접성, ③공격능력, ④공격의도로 구성된 [[위협]]에 균형을 맞추기 위해 동맹을 선택한다고 보았다."},{"id":"i989","t":"글렌 스나이더(Glenn Snyder)는 『Alliance Politics』(1997)에서 동맹국이 방기(abandonment)와 연루(entrapment) 사이의 동맹안보 딜레마에 놓이며, 양극체제에서는 [[연루]] 위험이, 다극체제에서는 [[방기]] 위험이 더 커진다고 분석했다."},{"id":"i990","t":"폴 슈뢰더(Paul Schroeder)는 『The Transformation of European Politics 1763–1848』(1994)에서 약소국은 세력균형을 맞추기보다 우월한 강대국에 [[편승]]하는 동맹을 선택해 생존을 확보한다고 설명했다."},{"id":"i991","t":"맨커 올슨(Mancur Olson)은 『The Logic of Collective Action』(1965)에서 동맹이 생산하는 안보가 [[공공재]]이므로 동맹국들이 무임승차를 추구해 분담금 갈등이 발생한다고 분석했다."},{"id":"i992","t":"한스 모겐소(Hans Morgenthau)는 『Politics Among Nations』(1948)에서 동맹을 권력을 [[극대화]]하기 위한 수단으로 보며 영구적 동맹은 존재하지 않는다고 주장했다."},{"id":"i993","t":"존 허츠(John H. Herz)는 『Political Realism and Political Idealism』(1951)에서 국제정치의 무정부성과 상대국의 의도를 확신할 수 없는 불확실성이 국가들로 하여금 자구적 군비와 동맹을 추구하게 만들고, 그 결과 상호 불신과 안보 경쟁이 발생하는 [[안보딜레마]]를 낳는다고 설명했다."},{"id":"i994","t":"댄 라이터(Dan Reiter)는 「Learning, Realism, and Alliances」(World Politics, 1994)에서 국가는 과거의 동맹 성공·방기·전쟁 경험을 [[학습]]해 더 안전한 동맹 형태와 공약 수준을 선택한다고 주장했다."},{"id":"i995","t":"존 미어샤이머(John Mearsheimer)는 『The Tragedy of Great Power Politics』(2001)에서 동맹은 패권국을 견제하기 위한 일시적 수단일 뿐 장기적 신뢰의 기반은 아니라고 보았다."},{"id":"i996","t":"[[스티븐 반 에베라(Stephen Van Evera)]]는 『Causes of War』(1999)에서 공격–방어 균형에 따라 공격이 우세하다고 인식될수록 불안정한 공격적 동맹이, 방어가 우세하다고 인식될수록 억지 중심의 안정적 동맹이 형성된다고 설명했다."}]}]},{"id":"i997","title":"핵 이론","secs":[{"id":"i998","title":"핵이론가","note":"","items":[{"id":"i999","t":"[[케네스 왈츠]]는 Theory of International Politics, 1979; The Spread of Nuclear Weapons, 1981에서 핵무기의 확산이 상호확증파괴(MAD)를 통해 전쟁 유인을 억제하여 국제체제의 안정성을 높인다고 본다."},{"id":"i1000","t":"존 미어샤이머(John J. Mearsheimer, Conventional Deterrence, 1983; The Tragedy of Great Power Politics, 2001)는 핵균형이 대국 간 전쟁을 억제해 왔으며 [[제한]]적 핵확산은 안정성을 증대시킬 수 있다고 본다."},{"id":"i1001","t":"로버트 저비스(Robert Jervis, The Meaning of the Nuclear Revolution, 1989)는 핵무기가 [[방어]]우위와 억지를 강화하여 전면전 가능성을 구조적으로 감소시킨다고 본다."},{"id":"i1002","t":"찰스 글레이저(Charles Glaser, Rational Theory of International Politics, 2010)는 합리적 국가들은 핵보유 하에서 전쟁의 [[비용]]을 인식하고 충돌을 회피한다고 보는 왈츠 계열의 핵확산 낙관론자이다."},{"id":"i1003","t":"스콧 세이건(Scott Sagan, The Limits of Safety, 1993; Moving Targets, 2005)은 핵무기가 합리적 억지수단이라기보다 오류·은폐·경직된 절차를 가진 군과 관료조직에 의해 운용되면서 사고와 오판, 무단행동을 통해 핵전쟁 위험을 증폭시키므로 핵확산은 국제평화를 위협한다고 본다."},{"id":"i1004","t":"리처드 베츠(Richard Betts, Nuclear Blackmail and Nuclear Balance, 1987)는 핵보유국이 늘어날수록 위기에서의 [[오판]]과 우발적 충돌 위험이 급증한다고 본다."},{"id":"i1005","t":"그레이엄 앨리슨(Graham Allison, Nuclear Terrorism, 2004; Destined for War, 2017)은 핵무기가 불량국가나 [[테러]]집단으로 확산될 경우 억지가 붕괴될 수 있다고 경고한다."},{"id":"i1006","t":"브루스 부에노 데 메스키타(Bruce Bueno de Mesquita, The Logic of Political Survival, 2003)는 불안정한 정치체제의 지도자들이 핵무기를 국내 정치 생존을 위해 위험하게 사용할 수 있다고 본다."},{"id":"i1007","t":"존 루이스 개디스(John Lewis Gaddis, The Long Peace, 1987; We Now Know, 1997)는 핵무기가 미 소 간 총력전을 억제하여 [[냉전]]기의 장기적 평화를 만들어냈다고 평가한다."},{"id":"i1008","t":"마이클 오핸론(Michael O’Hanlon, The Nuclear Future, 2014)은 다극적 핵질서에서는 위기관리와 [[억지]]가 약화되어 핵확산이 국제평화를 위협한다고 본다."}]}]},{"id":"i1009","title":"전쟁 원인론","secs":[{"id":"i1010","title":"전쟁 원인론에 대한 학자들","note":"","items":[{"id":"i1011","t":"칼 폰 클라우제비츠: 『전쟁론』에서 전쟁은 정치의 연속이며, 국민의 감정·군대의 우연성·정부의 [[이성]]이 결합된 삼위일체로 설명되며, 전쟁은 정치적 목적과 권력경쟁에서 발생하고 예방은 정치적 통제와 제한전을 통해 가능하다고 보았다."},{"id":"i1012","t":"투키디데스: 『펠로폰네소스 전쟁사』에서 전쟁은 공포·이익·명예에서 비롯되며 특히 세력전이에 따른 [[공포]]가 핵심 원인이라고 보았다."},{"id":"i1013","t":"토머스 셸링: 『Arms and Influence』에서 전쟁은 [[협상]] 실패와 전략적 상호작용의 산물이며, 예방은 억지와 강압, 신뢰성 있는 위협과 위험조성을 통한 위기관리에 있다고 보았다."},{"id":"i1014","t":"케네스 월츠: 『Man, the State, and War』에서 전쟁 원인을 개인·국가·체제 수준으로 분석하고 특히 무정부적 국제체제가 핵심 원인이라고 보았으며, 예방은 [[세력균형]] 유지에 있다고 보았다."},{"id":"i1015","t":"존 미어샤이머: 『The Tragedy of Great Power Politics』에서 국가는 생존을 위해 공격적 패권추구를 하며 전쟁이 발생한다고 보았고, 예방은 [[지역]]패권 확보와 경쟁국 억제에 있다고 보았다."},{"id":"i1016","t":"한스 모겐소: 『Politics Among Nations』에서 전쟁은 인간 [[본성]]에 내재한 권력욕과 국가이익 충돌에서 발생한다고 보았으며, 예방은 힘의 균형과 외교적 신중성에 있다고 보았다."},{"id":"i1017","t":"버나드 브로디: 『Strategy in the Missile Age』에서 핵시대 전쟁은 상호파괴 위험 속에서도 발생 가능하지만, 예방은 핵억지와 [[2차 보복능력]] 확보를 통한 억지 유지에 있다고 보았다."},{"id":"i1018","t":"[[로버트 저비스]]: 『Perception and Misperception in International Politics』에서 전쟁은 안보딜레마와 오인에서 발생하며, 예방은 투명성 확대와 신뢰구축 및 의사소통 개선에 있다고 보았다."},{"id":"i1019","t":"[[제임스 피어론]]: 「Rationalist Explanations for War」에서 전쟁은 합리적 국가 간에도 협상 실패로 발생하며, 그 원인은 상대의 능력과 의도에 대한 정보 비대칭으로 인한 오판, 미래에 합의가 지켜지지 않을 것이라는 약속 불이행 문제, 그리고 영토·주권 등 분할이 어려운 쟁점으로 인한 타협 불가능성에 있고, 예방은 정보 공개, 제도적 보증, 보상과 쟁점 재구성을 통한 신뢰 확보에 있다고 보았다."},{"id":"i1020","t":"케네스 볼딩: 『Conflict and Defense』에서 전쟁은 위협체계의 극단적 형태로 발생하며 사회는 위협·교환·통합의 방식으로 조직된다고 보았고, 예방은 교환과 [[통합]]을 통한 갈등관리 구조 형성에 있다고 보았다."}]}]},{"id":"i1021","title":"국제사회론(영국학파)","secs":[{"id":"i1022","title":"국제사회론자","note":"","items":[{"id":"i1023","t":"Martin Wight는 『International Theory』에서 국제정치 사상을 현실주의, [[합리주의]], 혁명주의의 세 전통으로 구분하였다."},{"id":"i1024","t":"Martin Wight는 『Systems of States』에서 국제정치가 단순한 [[권력투쟁]]이 아니라 규범과 제도가 작동하는 국제사회적 성격을 가진다고 보았다."},{"id":"i1025","t":"Hedley Bull은 『The Anarchical Society』에서 국제체제 속에서도 국가들이 공통의 규범과 제도를 공유함으로써 [[국제사회]]를 형성한다고 보았다."},{"id":"i1026","t":"Hedley Bull은 『The Anarchical Society』에서 주권, 외교, 국제법, [[세력균형]] 등의 제도가 무정부 상태에서도 질서를 유지하게 하는 핵심 요소라고 주장하였다."},{"id":"i1027","t":"Adam Watson은 『The Evolution of International Society』에서 국제사회가 [[무정부]] 상태와 제국적 질서 사이의 연속선상에서 역사적으로 변화해 왔다고 보았다."},{"id":"i1028","t":"Barry Buzan은 『From International System to International Society』에서 국제체제, 국제사회, [[세계사회]]를 구분하여 국제사회학파 이론을 체계화하였다."},{"id":"i1029","t":"Barry Buzan은 『People, States and Fear』에서 국제질서를 이해하기 위해 국가뿐 아니라 사회적 요소와 [[비국가행위자]]까지 포함해야 한다고 보았다."},{"id":"i1030","t":"Tim Dunne은 『Inventing International Society』에서 국제사회학파를 현실주의와 [[자유주의]] 사이의 중간적 전통으로 설명하였다."},{"id":"i1031","t":"Andrew Linklater는 『The Transformation of Political Community』에서 국제사회학파를 [[비판]]이론과 결합하여 규범적 확장을 시도하였다."},{"id":"i1032","t":"Andrew Linklater는 『The Transformation of Political Community』에서 국제사회가 [[국가]] 중심 질서를 넘어 인간의 해방과 세계사회를 지향해야 한다고 주장하였다."}]}]},{"id":"i1033","title":"이론의 사례 적용","secs":[{"id":"i1034","title":"미국의 이란 공격 분석(공격적 현실주의)","note":"공격적 현실주의 관점에서 본 미국의 이란 공격","items":[{"id":"i1035","t":"John J. Mearsheimer에 따르면 국제체제는 상위 권위가 존재하지 않는 [[무정부]]적 구조로 이루어져 있으며, 이로 인해 국가들은 타국의 [[의도]]를 확실히 알 수 없기 때문에 항상 잠재적 전쟁 상태 속에서 생존을 보장해야 한다. 이러한 구조적 조건에서 국가는 안전을 확보하기 위한 가장 확실한 방법으로 [[권력]]의 극대화와 패권 추구를 지향하게 되며, 현실적으로 세계 패권은 지리적 제약과 다른 강대국의 견제 때문에 달성하기 어렵기 때문에 각 국가는 우선 자신이 속한 [[지역]]에서의 패권을 확보하려 한다. 동시에 이미 지역 패권을 달성한 국가는 다른 지역에서 새로운 패권국이 등장하는 것을 자신의 안보에 대한 잠재적 위협으로 인식하기 때문에 타 지역에서 패권국의 등장을 저지하는 [[역외균형(offshore balancing)]] 전략을 추구하게 되며, 필요할 경우 군사적 개입을 통해 그 균형을 유지하려 한다.","tag":"이론"},{"id":"i1036","t":"John J. Mearsheimer의 관점에서 보면 미국의 이란 공격은 중동을 직접 지배하려는 시도라기보다는 [[잠재적]] 지역패권의 형성을 사전에 차단하려는 전략적 행동으로 해석된다. 이미 [[서반구]]에서 압도적 우위를 확보한 미국은 다른 지역에서 단일 국가가 군사력과 핵능력을 기반으로 영향력을 확대하여 지역 질서를 지배하게 될 경우 장기적으로 자신의 안보와 국제적 지위에 위협이 될 수 있다고 판단한다. 특히 이란이 핵개발 능력과 미사일 전력, 그리고 중동 내 다양한 비국가 행위자 네트워크를 통해 정치·군사적 영향력을 확장할 경우 중동에서 [[세력균형]]이 붕괴될 가능성이 있기 때문에 미국은 이를 억제하기 위해 제한적 군사개입과 지역 동맹국 지원을 통해 균형을 유지하려 한다. 따라서 이러한 군사행동은 특정 [[자원]]을 직접 확보하려는 목적이라기보다는 중동에서 어느 한 국가가 압도적 우위를 확보하지 못하도록 관리하려는 [[역외균형]] 전략의 일환으로 이해될 수 있다.","tag":"적용"}]},{"id":"i1037","title":"미국의 이란 공격 해석(전환전쟁론)","note":"전쟁 개시에는 여러 요인들이 작용할 수 있다. Donald Trump의 경우도 개인적·국내정치적 측면에서 이란 공격이 이루어진 시점의 정치적 상황을 통해 설명될 수 있다. 첫째, 트럼프는 불법이민 단속 강화, 국경 장벽 건설, 대규모 추방 정책 등 강경한 이민정책을 추진해 왔는데, 이러한 정책은 미국 내에서 인권 문제와 경제적 영향 등을 둘러싼 정치적 논쟁을 불러일으켰고, 일부 여론조사에서는 이민정책과 관련된 갈등이 지지율 하락의 요인으로 지적되기도 하였다. 둘째, 트럼프는 성추문과 관련된 금전 지급 사건과 관련하여 형사 재판 절차에 직면하였으며, 이 사건은 2016년 대선 직전 성관계 의혹을 제기한 인물에게 금전이 지급된 과정에서 회계 처리와 선거법 위반 여부가 쟁점이 되면서 미국 정치권과 언론에서 큰 논쟁의 대상이 되었다. 셋째, 트럼프는 대통령 재임 이후 백악관 기밀문서를 개인 사저로 반출하여 보관한 혐의와 관련하여 연방 수사와 기소에 직면하였으며, 해당 사건은 국가기밀 취급 및 보안 관리 문제와 관련하여 미국 정치권에서 큰 정치적 논쟁을 야기하였다.","items":[{"id":"i1038","t":"[[Georg Simmel]]은 저서 Conflict에서 외부 집단과의 갈등이 내부 집단 구성원 간의 결속과 통합을 강화한다고 설명하였다."},{"id":"i1039","t":"[[John E. Mueller]]는 논문 “Presidential Popularity from Truman to Johnson”(1970)에서 국제위기나 전쟁 발생 시 국민이 지도자 주변으로 결집하여 지지율이 상승하는 Rally round the flag effect를 제시하였다."},{"id":"i1040","t":"[[Jack S. Levy]]는 논문 “The Diversionary Theory of War: A Critique”(1989)에서 국내 정치적 위기나 지지도 하락을 겪는 지도자가 국민의 관심을 외부 갈등으로 전환하기 위해 군사적 분쟁을 선택할 수 있다는 전환전쟁 논리 또는 관심전환이론(diversionary theory of war)을 체계적으로 설명하였다."},{"id":"i1041","t":"[[Bruce Bueno de Mesquita]]는 저서 The Logic of Political Survival에서 지도자가 정치적 생존을 위해 외부 갈등이나 군사적 행동을 전략적으로 활용할 수 있음을 설명하였다."},{"id":"i1042","t":"[[T. Clifton Morgan]]은 논문 “Domestic Support and Diversionary External Conflict in Great Britain, 1950–1992”(1995) 등에서 국내 정치적 취약성이 외부 분쟁 가능성을 높일 수 있다는 관심전환가설(diversionary hypothesis)을 경험적으로 분석하였다."},{"id":"i1043","t":"9.11테러 이후 미국에서는 외부 위협에 대응하는 과정에서 국민이 지도자 주변으로 결집하는 [[Rally round the flag effect]]가 나타났으며, George W. Bush의 지지율이 급격히 상승하였다."},{"id":"i1044","t":"Bill Clinton은 [[1997]]년 이라크에 대한 군사 공격을 단행하여 대외 군사 압박을 강화하였는데, 이러한 군사 행동은 국내 정치적 부담 속에서 외부 갈등을 활용한 사례로 전환전쟁 논리(diversionary theory of war)로 평가되기도 한다."},{"id":"i1045","t":"Donald Trump가 이란에 대해 군사적 공격을 단행한 최근 사례도 일부 분석에서는 국내 정치적 상황과 결부되어 [[관심전환 가설(diversionary hypothesis)]]의 관점에서 해석될 수 있는 사례로 논의된다."},{"id":"i1046","t":"Falklands War는 군사정권 하에 있던 [[아르헨티나]]가 국내 정치적 위기 속에서 포클랜드 제도 점령을 시도하면서 발생한 전쟁으로, 외부 갈등이 국내 정치 문제와 결부될 수 있음을 보여주는 사례로 관심전환가설로 설명 가능하다."},{"id":"i1047","t":"위의 이론들 사이의 관계를 보면, 외부 갈등이 내부 결속을 강화한다는 [[짐멜]]의 사회학적 통찰이 이론적 배경을 이루고, [[뮐러]]가 국제위기 시 지도자 지지율 상승이라는 국기결집효과를 경험적으로 설명하였으며, 레비·메스키타·모건 등은 이러한 효과를 이용하여 지도자가 국내 정치 위기를 완화하기 위해 외부 갈등을 유발할 수 있다는 전환전쟁 논리 또는 관심전환가설을 발전시킨 것으로 정리할 수 있다."}]}]}]},{"id":"i1048","title":"국제기구·다자협력","chapters":[{"id":"i1049","title":"국제기구","secs":[{"id":"i1050","title":"주요 국제기구 핵심 정보","note":"","items":[{"id":"i1051","t":"국제연합(United Nations, UN)은 1945년에 창설된 보편적 국제평화·안보기구로서 사무총장(Secretary-General)의 임기는 5년이며 현재 안토니우 구테흐르스(António Guterres)가 재임 중이고 한국은 1991년 [[노태우]] 정부에서 정식 회원국으로 가입하였다."},{"id":"i1052","t":"국제통화기금(International Monetary Fund, IMF)은 1945년에 창설된 국제금융 안정기구로서 총재(Managing Director)의 임기는 5년이며 현재 크리스탈리나 게오르기에바(Kristalina Georgieva)가 직을 수행하고 있고 한국은 [[1955]]년 이승만 정부에서 회원국으로 가입하였다."},{"id":"i1053","t":"세계은행(World Bank Group, WBG)은 1944년에 출범한 국제개발금융기구로서 총재(President)의 임기는 5년이며 현재 아제이 방가(Ajay Banga)가 재임 중이고 한국은 [[1955]]년 이승만 정부에서 IMF와 함께 가입하였다."},{"id":"i1054","t":"세계무역기구(World Trade Organization, WTO)는 1995년 1월 1일 설립된 다자간 무역기구로서 사무총장(Director-General)의 임기는 [[4]]년이며 현재 응고지 오콘조-이웨알라(Ngozi Okonjo-Iweala)가 직을 맡고 있고 한국은 1995년 김영삼 정부에서 창립회원국으로 참여하였다."},{"id":"i1055","t":"국제노동기구(International Labour Organization, ILO)는 [[1919]]년에 창설된 노동전문기구로서 사무총장(Director-General)의 임기는 5년이며 현재 질베르 후웡보(Gilbert F. Houngbo)가 재임 중이고 한국은 1991년 노태우 정부에서 가입하였다."},{"id":"i1056","t":"식량농업기구(Food and Agriculture Organization, FAO)는 1945년에 설립된 식량·농업 분야 UN 전문기구로서 사무총장(Director-General)의 임기는 4년이며 현재 취 디옹유(Qu Dongyu)가 직을 수행하고 있고 한국은 [[1949]]년 이승만 정부에서 회원국으로 가입하였다."},{"id":"i1057","t":"세계보건기구(World Health Organization, WHO)는 1948년에 설립된 국제보건 전문기구로서 사무총장(Director-General)의 임기는 [[5]]년이며 현재 테드로스 아드하놈 게브레예수스(Tedros Adhanom Ghebreyesus)가 재임 중이고 한국은 1949년 이승만 정부에서 가입하였다."},{"id":"i1058","t":"경제협력개발기구(Organisation for Economic Co-operation and Development, OECD)는 1961년에 출범한 경제정책 협력기구로서 사무총장(Secretary-General)의 임기는 5년이며 현재 마티아스 코르만(Mathias Cormann)이 직을 맡고 있고 한국은 [[1996]]년 김영삼 정부에서 정식 회원국이 되었다."},{"id":"i1059","t":"아시아인프라투자은행(Asian Infrastructure Investment Bank, AIIB)은 2016년에 설립된 다자개발은행으로서 총재(President)의 임기는 5년이며 현재 저우 지아이(Zou Jiayi)가 직을 수행하고 있고 한국은 2015년 [[박근혜]] 정부에서 창립회원국으로 참여하였다."},{"id":"i1060","t":"유럽연합 집행위원회(European Commission, EC)는 1958년에 출범한 유럽연합(European Union, EU)의 상설 집행기관으로서 집행위원장(President)의 임기는 [[5]]년이며 현재 우르줄라 폰 데어 라이엔(Ursula von der Leyen)이 재임 중이다."}]},{"id":"i1061","title":"미국과 국제기구(제도)","note":"도널드 트럼프 미국 대통령이 유엔 산하기관을 포함한 66개 국제기구에서 미국이 탈퇴하는 조치에 공식 서명했다. 다자 협력보다는 ‘미국 우선주의(America First)’를 앞세운 트럼프식 외교 노선이 재확인됐다는 평가가 나온다. 7일(현지시간) 로이터통신과 AP통신, 워싱턴포스트(WP) 등에 따르면 트럼프 대통령은 이날 미국의 국제기구 참여를 대폭 축소하는 내용의 포고문(대통령 각서)에 서명했다. 백악관은 이번 조치로 유엔 산하 기구 31개와 비(非)유엔 기구 35개, 총 66개 국제기구에서 미국이 탈퇴하거나 지원을 중단하게 된다고 밝혔다. 트럼프 대통령은 1기 재임 시절에도 세계보건기구(WHO) 탈퇴 선언, 파리기후변화협약 이탈, 유네스코(UNESCO) 및 유엔 인권이사회 탈퇴, 팔레스타인 난민구호기구(UNRWA) 지원 중단 등으로 국제사회와 마찰을 빚은 바 있다. [출처:중앙일보]","items":[{"id":"i1062","t":"국제연맹 불가입(1919–1920): 1919~1920년 [[우드로 윌슨]] 대통령 재임 중 미국은 국제연맹 창설을 주도했음에도 상원이 베르사유조약 비준을 거부하여 국제연맹에 가입하지 않았다."},{"id":"i1063","t":"유엔 창설국 가입(1945.10.24): 1945년 10월 24일 [[해리 S. 트루먼]] 대통령 재임 중 유엔헌장이 발효되면서 미국은 창설국이자 안전보장이사회 상임이사국으로 유엔에 가입했다."},{"id":"i1064","t":"유네스코 탈퇴와 재가입: 미국은 [[1984]]년 로널드 레이건 대통령 재임 중 유네스코를 탈퇴했으나 2003년 조지 W. 부시 대통령 재임 중 다시 가입했다."},{"id":"i1065","t":"ABM 조약 체결과 탈퇴: 미국은 1972년 리처드 닉슨 대통령 재임 중 소련과 ABM 조약을 체결했으나 [[2002]]년 6월 조지 W. 부시 대통령 재임 중 미사일방어체제 구축을 이유로 이를 탈퇴했다."},{"id":"i1066","t":"교토의정서 불이행: 미국은 [[1998]]년 빌 클린턴 대통령 재임 중 교토의정서에 서명했으나 2001년 조지 W. 부시 대통령이 서명을 철회하였다."},{"id":"i1067","t":"파리기후협정 타결과 탈퇴: 미국은 2015년 [[버락 오바마]] 대통령 재임 중 파리기후협정을 타결했으나 2017년 도널드 트럼프 대통령이 탈퇴를 통보하고 2020년에 공식 탈퇴했다."},{"id":"i1068","t":"이란 핵합의(JCPOA) 타결과 탈퇴: 미국은 2015년 버락 오바마 대통령 재임 중 이란과 JCPOA를 체결했으나 [[2018]]년 5월 도널드 트럼프 대통령이 이를 일방 탈퇴했다."},{"id":"i1069","t":"세계보건기구(WHO) 탈퇴 통보와 철회: 미국은 2020년 도널드 트럼프 대통령이 WHO 탈퇴를 통보했으나 2021년 [[조 바이든]] 대통령이 이를 철회했다."},{"id":"i1070","t":"중거리핵전력(INF) 조약 체결과 탈퇴: 미국은 1987년 [[로널드 레이건]] 대통령 재임 중 소련과 INF 조약을 체결했으나 2019년 도널드 트럼프 대통령이 러시아의 위반을 이유로 탈퇴했다."},{"id":"i1071","t":"파리기후협정 복귀: 미국은 [[2021]]년 조 바이든 대통령 취임 직후 파리기후협정에 재가입했다."},{"id":"i1072","t":"유엔인권이사회 탈퇴와 재가입: 미국은 [[2018]]년 도널드 트럼프 대통령이 유엔인권이사회에서 탈퇴했으나 2021년 조 바이든 대통령 재임 중 다시 선출되어 복귀했다."},{"id":"i1073","t":"국제형사재판소(ICC) 로마규정 서명과 서명 철회: 미국은 [[2000]]년 빌 클린턴 대통령 재임 중 로마규정에 서명했으나 2002년 조지 W. 부시 대통령이 서명을 철회했다."},{"id":"i1074","t":"UN 해양법협약(UNCLOS) 비서명: 미국은 [[1982]]년 협약 채택 당시 로널드 레이건 대통령 재임 중에도 서명하지 않았고 이후에도 어떤 행정부도 서명·비준하지 않았다."},{"id":"i1075","t":"오타와 지뢰금지협약 미서명: 미국은 [[1997]]년 오타와 협약 채택 당시 빌 클린턴 대통령 재임 중에도 서명하지 않았고 이후에도 서명·비준하지 않았다."},{"id":"i1076","t":"포괄적 핵실험금지조약(CTBT) 서명·비비준: 미국은 [[1996]]년 빌 클린턴 대통령 재임 중 CTBT에 서명했으나 상원 비준을 받지 못해 현재까지 당사국이 아니다."}]},{"id":"i1077","title":"UN안전보장이사회의 무력사용 허가 결의(탈냉전기)","note":"","items":[{"id":"i1078","t":"결의 678호 (1990): 이라크의 [[쿠웨이트]] 철수 불이행 시 다국적군이 공습·지상전 등 전면적 군사작전을 포함한 모든 무력수단을 사용할 수 있도록 허가하였다."},{"id":"i1079","t":"결의 794호 (1992): [[소말리아]]에서 구호활동 보호를 위해 미군 주도 다국적군이 무장 병력을 투입하고 치안 확보를 위한 무력사용을 할 수 있도록 허가하였다."},{"id":"i1080","t":"결의 816호 (1993): [[보스니아]] 상공에서 비행금지구역을 위반하는 항공기에 대해 요격·격추 등 공중무력행사를 허가하였다."},{"id":"i1081","t":"결의 940호 (1994): [[아이티]] 군사정권 축출을 위해 다국적군이 무장 병력을 투입하여 군사적 강제조치를 수행할 수 있도록 허가하였다."},{"id":"i1082","t":"결의 929호 (1994): 르완다에서 민간인 보호를 위해 [[프랑스]] 주도 병력이 무장 개입하여 안전지대를 확보하고 보호활동을 수행할 수 있도록 허가하였다."},{"id":"i1083","t":"결의 1031호 (1995): [[보스니아]] 평화이행군(IFOR)이 중화기 통제, 교전세력 분리, 합의 이행 강제를 위해 필요 시 무력사용을 할 수 있도록 허가하였다."},{"id":"i1084","t":"결의 1244호 (1999): [[코소보]]에서 국제안보군(KFOR)이 무장 병력을 통해 치안 유지, 무장세력 해체, 안전 확보를 위해 무력사용을 할 수 있도록 허가하였다."},{"id":"i1085","t":"결의 1386호 (2001): [[아프가니스탄]]에서 ISAF가 무장 병력을 통해 수도 카불 및 주변 지역의 치안 유지와 정부 보호를 위해 무력사용을 할 수 있도록 허가하였다."},{"id":"i1086","t":"결의 1511호 (2003): [[이라크]]에서 다국적군이 무장 병력을 활용하여 치안 유지, 반군 대응, 안정화 작전을 위해 무력사용을 할 수 있도록 승인하였다."},{"id":"i1087","t":"결의 1973호 (2011): [[리비아]]에서 민간인 보호를 위해 공습, 비행금지구역 설정, 방공망 타격 등 군사적 무력행사를 포함한 모든 필요한 조치를 허가하였다."}]},{"id":"i1088","title":"G7","note":"","items":[{"id":"i1089","t":"1975년 프랑스의 발레리 지스카르 데스탱 대통령 주도로 프랑스 랑부예(Rambouillet)에서 미국, 영국, 프랑스, 서독, 이탈리아, 일본 정상들이 모여 제1차 정상회의를 개최하면서 G6가 출범하였다."},{"id":"i1090","t":"G6는 1970년대 브레턴우즈 체제 붕괴와 제1차 오일쇼크 이후 세계 경제위기에 대응하기 위한 선진국 협의체로 만들어졌다."},{"id":"i1091","t":"1976년 캐나다가 가입하면서 현재의 G7(Group of Seven) 체제가 성립되었다."},{"id":"i1092","t":"1977년부터 유럽공동체(EC), 현재의 유럽연합(EU)이 정상회의에 참가하기 시작하였다."},{"id":"i1093","t":"G7 회원국은 미국, 영국, 프랑스, 독일(당시 서독), 이탈리아, 일본, 캐나다의 7개국이다."},{"id":"i1094","t":"G7은 조약이나 헌장에 의해 설립된 국제기구가 아니며, 상설 사무국이나 법적 구속력 없이 회원국 간 합의를 통해 국제 현안을 조정하는 비공식 협의체이다."},{"id":"i1095","t":"1998년 영국 버밍엄(Birmingham) 정상회의에서 러시아가 정식 회원국으로 참여하면서 G8 체제가 출범하였으나, 2014년 러시아의 크림반도 병합 이후 참가가 중단되면서 다시 G7 체제로 운영되고 있다."},{"id":"i1096","t":"1985년 미국 뉴욕(New York) 플라자호텔에서 개최된 G5 재무장관 회의에서는 달러 가치 하락을 유도한 플라자합의가 이루어져 국제통화질서에 큰 영향을 미쳤다."},{"id":"i1097","t":"2026년 프랑스 에비앙(Evian) 정상회의에서는 우크라이나 지원 지속, 대러 제재 강화, 중국 관련 경제안보와 공급망 안정화, 인공지능(AI) 규범, 에너지 안보, 이란 핵문제와 중동 정세 등이 주요 의제로 논의되었으며, 한국·인도·브라질·남아프리카공화국·호주·멕시코가 초청국으로 참석하였다."},{"id":"i1098","t":"한국은 2021년 영국 콘월(Cornwall) 정상회의에 문재인 대통령이 초청받아 참석하였고, 2023년 일본 히로시마(Hiroshima) 정상회의에는 윤석열 대통령이 초청받아 참석하였으며, 2025년 캐나다 카나나스키스(Kananaskis) 정상회의와 2026년 프랑스 에비앙(Evian) 정상회의에도 초청국 자격으로 참여하여 G7과의 협력을 확대하고 있다."}]}]},{"id":"i1099","title":"다자안보·다자회의","secs":[{"id":"i1100","title":"다자안보사례","note":"","items":[{"id":"i1101","t":"ASEAN Regional Forum(ARF): 1994년 창설된 아시아·태평양 지역 최초의 정부 간 포괄적 다자안보협의체로, ASEAN 10개국을 중심으로 한국(1994), North Korea(2000), United States(1994), China(1994), Japan(1994), Russia([[1994]]), EU 등이 참여한다. 역내 신뢰구축조치(CBM), 예방외교(PD), 분쟁 해결을 단계적으로 추진하며, 북핵 문제·남중국해 문제·해양안보 등을 논의하는 동아시아 대표 안보포럼이다."},{"id":"i1102","t":"Council for Security Cooperation in the Asia Pacific(CSCAP): [[1993]]년 설립된 아시아·태평양 지역의 대표적 Track 2 안보협의체로, 학자·전직 외교관·군사전문가·연구기관 인사들이 참여한다. 정부 간 공식 협상이 어려운 안보 현안을 비공식적으로 논의하며, ARF 등에 정책 제언과 연구 결과를 제공하는 역할을 수행한다."},{"id":"i1103","t":"Northeast Asia Cooperation Dialogue(NEACD): 1993년 미국 University of California, San Diego(UCSD) 주도로 시작된 동북아 반관반민(Track [[1.5]]) 대화체로, 한국·북한·미국·중국·일본·러시아 등이 참여한다. 북핵 문제, 군사적 신뢰구축, 지역 안보협력 등을 논의하며, 과거 6자회담 관련 비공식 접촉 창구 역할도 수행하였다."},{"id":"i1104","t":"Northeast Asia Security Dialogue(NEASD, 동북아안보대화): 유럽의 [[CSCE]] 모델을 참고하여 동북아 지역에 다자안보협력체제를 구축하자는 구상으로, 냉전 종식 이후 1990년대부터 논의되었다. 북핵 문제·미중 전략경쟁·역사갈등 등으로 인해 아직 OSCE와 같은 제도화된 상설기구는 출범하지 못하였다."},{"id":"i1105","t":"Conference on Security and Co-operation in Europe(CSCE): 1975년 [[Helsinki Accords]]를 통해 출범한 유럽 안보협력회의로, 냉전기 미국·소련 및 유럽 국가들이 참여하였다. 군사안보·경제협력·인권 문제를 포괄적으로 다루었으며, 헬싱키 최종의정서를 통해 국경 불가침·무력 불사용·인권 존중 원칙 등을 확인하여 동서 진영 간 긴장완화에 기여하였다."},{"id":"i1106","t":"Organization for Security and Co-operation in Europe(OSCE): [[1995]]년 CSCE가 상설기구화되어 출범한 세계 최대 지역안보기구로, 유럽·북미·중앙아시아 국가들이 참여한다. 군비통제, 선거감시, 민주주의·인권 보호, 소수민족 문제, 분쟁 예방 및 사후 복구 활동 등을 수행하며, 우크라이나 분쟁 감시 활동에서도 중요한 역할을 수행하였다."},{"id":"i1107","t":"Shangri-La Dialogue(샹그릴라 대화): 2002년 영국의 국제전략문제연구소인 International Institute for Strategic Studies (IISS)와 Singapore 정부의 주도로 시작된 아시아 최대 규모의 국방안보회의이다. [[싱가포르]]에서 매년 개최되며, 미국·중국·일본·한국·ASEAN 국가 국방장관 및 군 고위인사들이 참여하여 남중국해·대만해협·북핵·인도·태평양 전략 등을 집중 논의한다."},{"id":"i1108","t":"Munich Security Conference(뮌헨안보회의): [[1963]]년 독일에서 시작된 세계적 안보포럼으로, 각국 정상·외교장관·국방장관·NATO 및 EU 지도부·전문가들이 참여한다. 냉전기에는 대서양동맹 중심 논의가 이루어졌으나, 현재는 우크라이나 전쟁·러시아 안보·중국 부상·사이버안보·기후안보 등 글로벌 전략 현안을 폭넓게 논의한다."},{"id":"i1109","t":"Conference on Interaction and Confidence Building Measures in Asia(CICA): 1992년 [[카자흐스탄]] 대통령 누르술탄 나자르바예프의 제안으로 시작된 아시아 지역 다자안보협의체로, ‘아시아판 OSCE’를 지향한다. 중국·러시아·인도·파키스탄·중동 국가 등 다수 국가가 참여하며, 군사·경제·환경·대테러 분야의 신뢰구축조치와 분쟁 예방을 추진한다."},{"id":"i1110","t":"IISS Manama Dialogue(마나마 대화): International Institute for Strategic Studies (IISS)가 2004년부터 [[바레인]] 마나마에서 개최하는 중동 안보회의로, 걸프협력회의(GCC) 국가들과 미국·유럽 국가의 국방·외교 고위인사들이 참여한다. 이란 핵문제, 중동 해양안보, 에너지 안보, 테러 대응, 역내 군사균형 등을 논의하는 대표적 중동 다자안보대화체이다."}]},{"id":"i1111","title":"다보스포럼 및 주요 다자회의(Track1, 1.5, 2)","note":"세계 정·재계 지도자들이 한자리에 모이는 세계경제포럼(WEF) 연차총회가 19일(현지시간) 스위스 휴양지 다보스에서 개막했다. 올해로 56회를 맞은 이번 포럼은 ‘대화의 정신’을 주제로 23일까지 닷새간 열리며 정상급 특별연설, 패널 토론 등 200여개 세션이 마련됐다. 미 월스트리트저널(WSJ)은 “올해 다보스 포럼의 공식 의제에는 기후를 보호하면서도 혁신과 경제성장을 이뤄내는 방법에 대한 논의가 포함됐지만 이러한 전통적 의제들은 퇴조하고 트럼프 대통령의 현실 정치에 따른 미국의 국내외 정책이 핵심 의제로 떠올랐다”고 짚었다. 트럼프 대통령은 최근 그린란드 강제 병합 시도를 주권 훼손으로 규정하고 그린란드에 군사 훈련 차원에서 소규모 병력을 파견한 덴마크와 영국·프랑스·독일 등 유럽 8개 국가에 그린란드 매입에 협조하지 않을 경우 2월부터 10%, 6월부터 25%의 관세를 부과하겠다고 예고했다. 해당 8개국은 이를 “동맹에 대한 위협”으로 간주하고 930억 유로(약 160조원) 규모의 대대적 보복 관세 카드 검토에 들어간 상태다. 이번 포럼에서는 그린란드 이슈 외에도 우크라이나 종전, 팔레스타인 가자지구 평화 협상, 베네수엘라 안정화, 대중(對中) 기술·통상 전략, 인공지능(AI) 규제와 공급망 재편 문제 등이 폭넓게 논의될 전망이다. [출처:중앙일보]","items":[{"id":"i1112","t":"다보스포럼은 매년 1월 [[스위스]] 다보스에서 개최하는 민간 주도의 비공식 국제 포럼으로, 각국 정상과 글로벌 기업·국제기구 지도자들이 참여해 세계 경제를 중심으로 지정학·안보, 기후변화, 기술·AI, 공급망과 불평등 등 핵심 글로벌 의제를 논의한다."},{"id":"i1113","t":"유럽안보협력회의(CSCE)는 1975년 헬싱키 최종의정서로 출범한 정부 간 다자 안보 협의체로, 미·소가 공동 주도하여 유럽 국가들과 함께 냉전기 군사적 신뢰구축과 인권을 포괄한 안보 대화를 추진하였으며 한국은 참여하지 않았다. 한편, 유럽안보협력기구(OSCE)는 [[1995]]년 CSCE가 제도화되어 출범한 정부 간 상설기구로, 유럽·북미 57개국이 참여한다."},{"id":"i1114","t":"아세안지역안보포럼(ARF)은 1994년 [[아세안]] 주도로 출범한 정부 간 다자 안보 협의체로, 한국이 정식 회원국으로 참여하며 아시아·태평양 지역에서 신뢰구축과 예방외교를 중심으로 느슨한 합의 방식의 안보 대화를 진행한다."},{"id":"i1115","t":"동북아협력대화(NEACD)는 1993년 미국 학계 주도로 시작된 민간 중심 Track [[1.5]] 안보 대화로, 한국이 참여하고 있으며 학자·전직 관료가 비공식 자격으로 동북아 군비통제와 위기관리 의제를 사전 조율한다."},{"id":"i1116","t":"샹그릴라 대화는 영국에 본부를 둔 국제전략문제연구소(IISS)가 [[싱가포르]] 정부와 함께 주도하여 2002년 시작한 민간 형식의 혼합형 안보 포럼으로, 한국 국방장관이 공식 직함으로 참석하며 아시아 안보 현안에 대한 정부 간 입장 표명과 고위급 접촉의 장으로 기능한다."},{"id":"i1117","t":"뮌헨안보회의는 [[1963]]년 독일에서 시작된 민간 주도의 혼합형 글로벌 안보 포럼으로, 한국 고위 외교·안보 인사가 참여하며 법적 구속력은 없지만 강대국의 전략적 신호가 집중적으로 표출되는 것이 특징이다."},{"id":"i1118","t":"아스펜 안보 포럼은 2010년 [[미국]] 아스펜연구소가 시작한 민간 차원의 안보 포럼으로, 한국 인사가 제한적으로 참여하며 [[미국]] 중심의 외교·안보 전략 담론과 엘리트 간 비공식 토론에 초점을 둔다."},{"id":"i1119","t":"동북아안보대화(NEASD)는 [[1991]]년 남북기본합의서 이후 한국 정부가 제안한 정부 차원의 다자 안보 협의 구상으로, 한국이 주도하였으나 제도화에는 실패했고 동북아판 다자 안보체제 모색의 시도로 평가된다."},{"id":"i1120","t":"아시아태평양안보협력이사회(CSCAP)는 1993년 출범한 민간 Track [[2]] 안보 네트워크로, 한국이 적극 참여하고 있으며 ARF에 정책 아이디어와 신뢰구축 방안을 제공하는 자문·연구 기능을 수행한다."},{"id":"i1121","t":"아세안 확대 국방장관회의(ADMM-Plus)는 [[2010]]년 아세안 주도로 출범한 정부 차원의 다자 안보 협의체로, 한국이 정식 참여국이며 국방장관급 회의를 통해 해양안보·재난구호·대테러 등 실질적 군사 협력을 제도적으로 추진한다."}]}]},{"id":"i1122","title":"국제통상","secs":[{"id":"i1123","title":"CPTPP","note":"(Comprehensive and Progressive Agreement for Trans-Pacific Partnership)\n이재명 정부는 시장 확대를 위해 포괄적·점진적 환태평양경제동반자협정(CPTPP) 가입 추진을 본격화하고 있다. CPTPP는 지난 2018년 3월 출범한 다자간 자유무역협정(FTA)이다. 현재 일본을 비롯해 호주·브루나이·캐나다·칠레·멕시코·베트남·말레이시아·싱가포르 등이 참여하고 있으며, 2024년 12월에는 영국이 가입했다. CPTPP에는 최대 96%의 ‘품목 관세’를 철폐하는 조항이 포함돼 있다. 허윤 서강대 국제대학원 교수는 “CPTPP는 미국·중국이 빠져 있지만, 가장 발전된 형태의 다자 무역 협정으로 한국에도 매력적”이라고 평가했다. 우선 경제적 효과가 크다. 지난해 대외경제정책연구원은 한국이 CPTPP에 가입하면 GDP가 0.38%포인트 증가하는 효과가 나타난다고 분석했다. 한국은 CPTPP 가입국 중 일본·멕시코와 아직 FTA를 체결하지 않아 가입 시 수출 시장이 확대되는 효과도 누릴 수 있다. 한국은 문재인 정부 시절인 2021년 CPTPP 가입 검토 방침을 처음 공식화했다. 이후 ‘추진 검토’ 입장을 일관되게 유지했다. 다만 호주·캐나다·뉴질랜드·베트남 등 농축산물 강국과 일본 등의 수산국이 회원국으로 포진해 있어, 농수산물 시장 개방에 대한 우려도 크다. 농어민 반발 잠재우기와 일본 설득이 필요하다는 의미다. 특히 CPTPP 가입 승인 구조가 회원국 총의제이기 때문에 일본의 태도가 결정적인 변수다. 일본이 그간 우리 정부에 지속해 요구한 수산물 수입 금지 조치 해제 문제가 CPTPP 가입 해결에 가장 큰 쟁점이 될 전망이다. (중앙일보/250930/발췌)","items":[{"id":"i1124","t":"2004년 싱가포르·뉴질랜드·칠레가 고수준 소규모 자유무역협정 구상을 시작하였고 2005년 6월 3일 싱가포르·뉴질랜드·칠레·[[부르나이]]가 환태평양 전략적 경제동반자 협정(P4)에 서명하였으며 2006년 5월 28일 이를 발효시켰다."},{"id":"i1125","t":"미국은 2008년 9월 조지 W. 부시 행정부 말기에 P4 협상 참여 의사를 공식 표명한 뒤 2009년 1월 20일 출범한 [[버락 오바마]] 행정부 하에서 이를 환태평양 파트너십(TPP)으로 확대하며 협상을 주도하였다."},{"id":"i1126","t":"2015년 버락 오바마 대통령 재임 하에 미국·일본·캐나다·호주·뉴질랜드·멕시코·칠레·페루·말레이시아·[[베트남]]·싱가포르·브루나이 12개국이 참여한 TPP 협상이 2015년 10월 5일 미국 애틀랜타에서 최종 타결되었다."},{"id":"i1127","t":"2017년 도널드 트럼프 행정부는 다자무역협정이 미국의 정책 자율성을 제약하고 무역적자를 심화시킨다는 인식 하에 2017년 1월 23일 TPP 탈퇴를 공식 선언하였다."},{"id":"i1128","t":"2018년 미국 탈퇴 이후 일본은 [[아베 신조]] 총리 주도로 협상을 재정비하여 일본·캐나다·호주·뉴질랜드·멕시코·칠레·페루·말레이시아·베트남·싱가포르·브루나이 11개국이 2018년 3월 8일 CPTPP에 서명하고 2018년 12월 30일 이를 발효시켰다."},{"id":"i1129","t":"CPTPP 신규 가입은 기존 회원국 간 [[총의(consensus)]]에 의해 결정되며, 가입국은 협정문 전체 수용, 관세 철폐, 서비스·투자 자유화, 국영기업 규율, 노동·환경, 디지털 무역 규범을 모두 이행해야 한다."},{"id":"i1130","t":"CPTPP는 회원국이 탈퇴 의사를 서면 통보한 날로부터 [[6]]개월 경과 시 탈퇴가 가능하다."},{"id":"i1131","t":"영국은 2021년 가입 신청, 2023년 협상 타결 및 7월 16일 가입 의정서 서명, [[2024]]년 12월 15일 발효를 거쳐 CPTPP는 12개 회원국 체제로 확대되었다."},{"id":"i1132","t":"RCEP 회원국은 아세안 10개국과 비아세안 5개국(한국·중국·일본·호주·뉴질랜드) 총 15개국이며, 이 중 CPTPP에도 가입한 국가는 일본·호주·뉴질랜드·말레이시아·베트남·싱가포르·브루나이이다. [[동티모르]]는 2025년 ASEAN가입국이지만 RCEP회원국은 아니다. 별도로 가입해야한다. 한편, 홍콩, 스리랑카, 칠레, 방글라데시 등이 RCEP가입을 추진 중이다."},{"id":"i1133","t":"ASEAN 회원국은 [[11]]개국이며, 이 중 CPTPP 가입국은 [[말레이시아]]·베트남·싱가포르·브루나이이다."}]},{"id":"i1134","title":"NAFTA/USMCA","note":"최근 도널드 트럼프 미국 대통령이 USMCA(미국·멕시코·캐나다 협정)의 탈퇴 가능성을 언급하면서 북미 3국 간 무역관계가 긴장 국면에 들어섰다. 트럼프 대통령은 2026년 발효 6주년 공동검토를 앞두고 미국이 협정을 계속 유지해야 하는지에 대해 의문을 제기하며 탈퇴 옵션을 검토할 수 있음을 시사하였고, 이는 협정의 향후 연장 여부에 대한 불확실성을 높이고 있다. 미국과 캐나다 간에는 관세, 에너지·환경 정책, 산업보조금 문제 등을 둘러싼 갈등이 반복되며 관계가 다소 경색된 상황이고, 멕시코와도 이민·국경 문제 및 산업정책을 둘러싼 이견이 존재한다. 멕시코와 캐나다는 협정의 안정적 유지를 강조하고 있으나, 미국 내에서는 양자협정 전환 가능성이나 재협상 필요성이 거론되고 있어 북미 지역주의가 단순한 자유무역 체제를 넘어 경제안보 중심의 재조정 단계에 들어섰다는 평가가 제기되고 있다.","items":[{"id":"i1135","t":"1992.12.17 미국의 대통령 George H. W. Bush 행정부 하에서 미국·캐나다·멕시코는 North American Free Trade Agreement (NAFTA)를 체결하였고,[[1994]]년.01.01 발효하여 북미 3국 간 관세를 단계적으로 철폐하고 세계 최대 규모의 자유무역지대를 형성하였다."},{"id":"i1136","t":"NAFTA는 상품무역 자유화에는 성공하였으나, 미국 제조업 공동화와 대멕시코 무역적자 확대 논란, 노동·환경 규범의 집행력 부족 등 구조적 한계를 노정하였다."},{"id":"i1137","t":"NAFTA는 제11장을 통해 투자자-국가 간 분쟁해결제도(ISDS)를 도입하여 역내 투자자 보호를 강화하였으나, 국가 규제권을 제약한다는 비판과 함께 재협상 요구의 주요 쟁점이 되었다."},{"id":"i1138","t":"NAFTA의 문제점을 고려하여 미국은 재협상을 요구하였고, [[2018]]년.11.30 United States–Mexico–Canada Agreement (USMCA)에 서명하여 NAFTA를 대체하기로 합의하였다."},{"id":"i1139","t":"USMCA는 각국 의회의 비준을 거쳐 2020.07.01 발효되었으며, 당시 미국 대통령은 [[도날드 트럼프]]다."},{"id":"i1140","t":"USMCA 체결 배경에는 미국의 무역적자 문제뿐 아니라, [[중국]]의 부상과 글로벌 공급망 재편에 대응하여 북미 경제권을 전략적으로 재구성하려는 경제안보적 고려가 작용하였다."},{"id":"i1141","t":"NAFTA는 기업들이 생산비 절감을 위해 멕시코로 생산기지를 이전하도록 유도함으로써 오프쇼어링을 촉진하였고, 이는 이후 미국 내에서 리쇼어링(reshoring) 및 니어쇼어링(nearshoring)을 통해 생산기지를 북미로 재편하려는 정책적 논의가 등장하는 배경이 되었다."},{"id":"i1142","t":"제32.10조는 당사국이 [[비시장경제국]]과 자유무역협정을 체결하여 그 협정이 발효되는 경우, 다른 당사국이 6개월 전 통보를 통해 USMCA를 종료하고 양자협정으로 대체할 수 있도록 규정함으로써 사실상 [[중국]]과의 FTA 체결을 견제하는 장치를 마련하였다."},{"id":"i1143","t":"협정은 2020.07.01 발효일로부터 16년 후인 2036.07.01 종료 예정이며, [[6]]년마다 공동검토를 실시하도록 규정하고, 최초 공동검토는 2026.07.01에 개시되도록 설계된 일몰조항을 두고 있다."},{"id":"i1144","t":"[[2026]]년.07.01 공동검토를 앞두고 미국 내에서 탈퇴 가능성이 거론되면서, NAFTA에서 USMCA로 이어진 북미 지역주의가 단순한 자유무역 체제라기보다 미·중 전략경쟁 속 경제안보 블록으로 재편되고 있다는 평가가 제기되고 있다."}]}]}]},{"id":"i1145","title":"지역·국가","chapters":[{"id":"i1146","title":"미국","secs":[{"id":"i1147","title":"19세기 미국 대외정책사","note":"","items":[{"id":"i1148","t":"1775년부터 1783년까지 진행된 American Revolutionary War 에서 미국은 Kingdom of Great Britain 으로부터 독립을 추진하였으며, 이후 1789년 초대 대통령이 된 G
