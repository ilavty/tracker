const PATCHES = [{"id": "law27-1028", "doc": "law", "secs": [{"ch": "i14", "chname": "연원", "sec": {"id": "k27s_261001_0", "title": "일반국제법 – 총론·연원 (10.01)", "note": "", "items": [{"id": "k27_261001_0_0", "y": "27", "t": "빈켈스후크는 [[착탄거리설]]을 통해 영해 3해리설을 주장하였다."}, {"id": "k27_261001_0_1", "y": "27", "t": "[[그로티우스]]는 정전론자로서 방어전쟁, 법적 청구권을 집행하기 위한 전쟁, 불법을 응징하기 위한 전쟁만 정당한 전쟁이라고 보았다."}, {"id": "k27_261001_0_2", "y": "27", "t": "[[북해대륙붕]]사건에 의하면 관습은 빠른 시간내에 성립할 수 있으나, 반드시 일반관행과 법적 확신이 있어야 한다."}, {"id": "k27_261001_0_3", "y": "27", "t": "ICJ는 영국-[[노르웨이]] 어업사건에서 [[노르웨이]]가 집요한 불복국가라고 인정하였다."}, {"id": "k27_261001_0_4", "y": "27", "t": "프레아비헤아 사원사건과 노테봄사건은 법의 일반원칙으로 [[금반언]]원칙이 거론되었다."}, {"id": "k27_261001_0_5", "y": "27", "t": "조약법협약에 따르면 강행규범 위반 관련 분쟁은 합의를 통해 [[중재]]재판에 회부하거나, 합의가 안되면 일방적으로 [[ICJ]]에 제소할 수 있다([[약정]]관할)."}, {"id": "k27_261001_0_6", "y": "27", "t": "[[대세적 의무]] 위반 시 이는 국제공동체 전체에 대한 법익의 침해이므로, 피해를 입지 않은 국가(비피해국)도 국가책임을 원용할 수 있다."}, {"id": "k27_261001_0_7", "y": "27", "t": "부르키나파소-말리 국경분쟁사건에서 [[uti possidetis]] 원칙이 일반관습이라고 보았다."}, {"id": "k27_261001_0_8", "y": "27", "t": "프랑스핵실험사건은 프랑스 대통령의 [[일방행위]]의 구속력을 인정하였다."}, {"id": "k27_261001_0_9", "y": "27", "t": "[[강행규범]]에 위반되는 조약은 무효가 되거나 종료가 된다."}]}}, {"ch": "i17", "chname": "조약법", "sec": {"id": "k27s_261002_1", "title": "조약법 (진도누적) (10.02)", "note": "", "items": [{"id": "k27_261002_1_0", "y": "27", "t": "조약의 상대적 무효사유는 국내법 위반, 전권대표의 권한 남용, 착오, [[사기]], 부패이며, 국가는 이를 조약의 무효사유로 ‘[[원용]]’ 할 수 있다."}, {"id": "k27_261002_1_1", "y": "27", "t": "조약의 중대한 위반, 후발적 이행불능, [[사정변경]]은 모두 조약의 정지나 종료 사유로 원용할 수 있다."}, {"id": "k27_261002_1_2", "y": "27", "t": "강행규범에 저촉되는 조약은 절대적 무효사유에 해당하며, 묵인에 의해서도 그 불법성이 치유되지 않으며, [[가분성]]의 원칙도 적용되지 않는다."}, {"id": "k27_261002_1_3", "y": "27", "t": "조약법협약에 따르면 [[강행규범]] 위반 관련 분쟁은 합의를 통해 중재재판에 회부하거나, 합의가 안되면 일방적으로 ICJ에 제소할 수 있다([[약정]]관할)."}, {"id": "k27_261002_1_4", "y": "27", "t": "ICJ는 Military and Paramilitary Activities in and against Nicaragua 사건에서 일방적 선언도 [[신의성실]] 원칙의 적용을 받으며, 유추에 의하여 조약법의 지배를 받는다고 판결하였다."}, {"id": "k27_261002_1_5", "y": "27", "t": "Land and Maritime Boundary between Cameroon and Nigeria사건에서 나이지리아는 재판소에 의해 조약으로 인정된 나이지리아와 카메룬 간의 한 선언(1975년의 Maroua Declaration)에 자국의 국가원수가 직접 서명은 하였으나 국내헌법에 따라 비준절차를 거치지 않았기 때문에 이 선언은 무효라고 주장하였으나, ICJ는 문제의 선언은 [[서명]]과 함께 즉시 발효하였다고 판시하였다."}, {"id": "k27_261002_1_6", "y": "27", "t": "ICJ는 “2009년 Dispute regarding Navigatinonal and Related Rights, Costa Rica v. Nicaragua”에서 조약이 [[일반적인]] 용어를 사용하고 있는 경우, 당사자들은 시간의 경과에 따라 그 의미가 발전할 수 있다는 사실을 예상하고 있다고 판단했다(진화적 해석 인정)."}, {"id": "k27_261002_1_7", "y": "27", "t": "문맥은 해석시 반드시 고려되어야 하는 필수사항인 반면 “체결시 상황”은 필요시에만 활용되는 [[보충]]수단에 불과하다."}, {"id": "k27_261002_1_8", "y": "27", "t": "카메룬-나이지리아 경계획정 사건(2002)에서 ICJ는 국가원수의 조약 체결권에 대한 제한은 적절히 [[공지]]되지 않는 한 명백하다고 할 수 없으며, 인접국이 이와 관련된 타국의 국내법상 제한을 알아야 할 의무는 없으므로 국내법에 위반된 조약이라 할지라도 무효가 되는 것은 아니라고 하였다."}, {"id": "k27_261002_1_9", "y": "27", "t": "가브치코보 나기마로스 사건에서 헝가리가 조약 종료 사유로 주장한 사정변경, 후발적 이행불능, 조약의 중대한 위반은 모두 기각되었다. [[긴급피난]] 주장도 기각되었다."}]}}, {"ch": "i840", "chname": "분쟁해결제도", "sec": {"id": "k27s_261002_2", "title": "ISD 사례 – 한국 최종 패소 (엘리엇) (10.02)", "note": "판례 자체가 출제와 직결되는 것은 아니지만, 한미 FTA협정상 분쟁해결제도, UNCITRAL의 법적 지위 등은 간략히 알아두면 좋겠습니다. 공부를 좀 한 분들도 버거운 내용일테지만 가볍게 여러 번 보시기 바랍니다. 특히 밑줄친 부분에 유의하시고.", "items": [{"id": "k27_261002_2_0", "y": "27", "t": "사건의 개요: 미국 투자펀드 엘리엇은 2015년 삼성물산·제일모직 합병 과정에서 한국 정부가 국민연금의 의결권 행사에 개입하여 손해를 입었다며, 한미 FTA에 근거한 투자자·국가 간 중재(ISDS)를 제기하였다."}, {"id": "k27_261002_2_1", "y": "27", "t": "중재·소송 경과: 2018년 중재 개시 → 2023년 한국의 배상책임 인정 → 2024년 영국 법원에서 한국의 취소청구 기각 → 2025년 한국의 항소심 승소·법원 환송 → 2026년 2월 중재판정 일부 취소·중재 환송 → 2026년 9월 30일 환송중재에서 한국의 배상책임 재인정."}, {"id": "k27_261002_2_2", "y": "27", "t": "한미 FTA 제11.1조의 적용범위: 투자규정은 상대국 투자자·보호대상 투자 등에 관련된 당사국의 조치에 적용된다. 정부·당국의 조치뿐 아니라, 정부나 당국으로부터 위임받은 권한을 행사하는 비정부기관의 조치도 포함한다."}, {"id": "k27_261002_2_3", "y": "27", "t": "한미 FTA 제11.5조의 최소대우기준: 최소대우기준(Minimum Standard of Treatment, MST)은 국제관습법상 외국인 투자에 보장해야 하는 최소한의 대우로, 공정하고 공평한 대우(Fair and Equitable Treatment, FET)와 충분한 보호 및 안전(Full Protection and Security, FPS)을 포함한다. 엘리엇 사건의 핵심 실체규정이다."}, {"id": "k27_261002_2_4", "y": "27", "t": "최소대우기준과 내국민대우의 구별: 내국민대우(National Treatment, NT)는 한미 FTA 제11.3조에 규정되어 있으며, 동종의 상황에서 외국인 투자자·투자를 자국 투자자·투자보다 불리하게 대우하지 말라는 원칙이다. 최소대우기준은 국제법상 최소 수준이 기준이고, 내국민대우는 자국민에 대한 대우가 비교기준이므로, 자국민과 동일하게 대우하더라도 최소대우기준 위반이 될 수 있다."}, {"id": "k27_261002_2_5", "y": "27", "t": "한미 FTA의 분쟁해결 선택수단: 제11.15조에 따라 우선 협의·교섭을 통한 해결을 모색하며, 비구속적인 제3자 절차를 활용할 수도 있다. 해결되지 않으면 제11.16조에 따라 ㉠ 양국이 모두 협약 당사국인 경우 ICSID 협약 중재, ㉡ 어느 한 국가만 협약 당사국인 경우 ICSID 추가절차규칙 중재, ㉢ UNCITRAL 중재규칙에 따른 중재, ㉣ 분쟁당사자들이 합의하는 그 밖의 중재기관 또는 중재규칙을 선택할 수 있다. 제11.17조는 협정에 따른 국가의 중재 동의를 규정하며, 엘리엇은 UNCITRAL 방식을 이용하였다."}, {"id": "k27_261002_2_6", "y": "27", "t": "UNCITRAL의 개요: UNCITRAL은 United Nations Commission on International Trade Law, 즉 유엔국제상거래법위원회이다. 1966년 유엔총회가 설치한 보조기관으로, 국제상거래법의 조화·통일을 위해 협약·모델법·중재규칙을 마련한다. UNCITRAL 자체가 사건을 심리하거나 판정을 내리는 것은 아니다."}, {"id": "k27_261002_2_7", "y": "27", "t": "UNCITRAL과 PCA의 역할: 엘리엇 사건에는 2013년 UNCITRAL 중재규칙이 적용되었고, 상설중재재판소(PCA)는 사무국 역할을 담당하였다. 실제 심리와 판정은 사건을 위해 구성된 3명의 중재인으로 이루어진 중재판정부가 담당하였다."}, {"id": "k27_261002_2_8", "y": "27", "t": "영국 법원이 관여한 이유: 법적 중재지가 영국 런던이었으므로, 영국 법원이 영국 중재법에 따라 판정 취소를 심사하였다. PCA의 소재지나 실제 심리 장소와 법적 중재지는 구별된다."}, {"id": "k27_261002_2_9", "y": "27", "t": "중재의 단심성과 판정 불복: 중재판정은 원칙적으로 최종적이고 구속력이 있지만, 제한된 사유에 따른 취소는 가능하다."}, {"id": "k27_261002_2_10", "y": "27", "t": "영국 중재법상 불복 사유: 제67조는 실질적 관할권의 하자를, 제68조는 중대한 불공정을 초래한 심각한 절차상 하자를 대상으로 한다. 제69조는 일정한 요건 아래 법률문제에 대한 항소를 허용한다. 엘리엇 사건에서 한국의 핵심 주장은 제67조에 따른 관할권 문제였다."}, {"id": "k27_261002_2_11", "y": "27", "t": "영국 법원 승소 후 배상책임이 재인정된 이유: 2026년 2월 영국 법원은 국민연금을 국가기관으로 보아 그 행위를 한국에 귀속시킨 판정 부분을 취소하였다. 그러나 정부 개입 자체와 엘리엇의 손해 사이의 인과관계는 중재판정부가 다시 판단하도록 하였고, 환송중재 판정부는 이를 인정하였다."}, {"id": "k27_261002_2_12", "y": "27", "t": "최종 판정 결과와 향후 절차: 2026년 9월 30일 환송중재 판정부는 한국에 배상원금 약 4,849만 달러와 연 복리 5%의 지연이자 등을 지급하라고 판정하였다. 2026년 10월 2일 기준 정부는 판정문을 분석하여 후속조치를 검토하고 있으며, 추가 취소청구 여부는 확정되지 않았다."}]}}, {"ch": "i70", "chname": "국내법 관계", "sec": {"id": "k27s_261005_3", "title": "국제법과 국내법의 관계 (10.05)", "note": "국가별 주요 관행 암기/한국 관련 사항 암기", "items": [{"id": "k27_261005_3_0", "y": "27", "t": "[[알라바마]]호 중재 사건은 국내법의 부존재를 이유로 국제법 위반을 정당화할 수 없고 국제법상 책임을 진다고 보았다."}, {"id": "k27_261005_3_1", "y": "27", "t": "Certain German Interests in Upper Silesia(1926)사건에서 PCIJ는 국제재판시 각국의 국내법은 구속력을 지닌 법이 아닌 단순한 [[사실]]로 취급된다고 하였다."}, {"id": "k27_261005_3_2", "y": "27", "t": "Ahamadou Sadio Diallo사건(2010)에서 ICJ는 [[국내법]]을 해석함에 있어서 해당 국가 당국(특히 최고재판소)의 입장을 존중해야 한다고 하였다. 단, 명백히 잘못된 해석이라면 그러하지 아니하다고 판시하였다."}, {"id": "k27_261005_3_3", "y": "27", "t": "국제법을 수용하는 경우 국제법이 국내법에 직접[[적용]]성이 있다고 표현하는데 이는 주로 헌법에서 규율하는 문제이다."}, {"id": "k27_261005_3_4", "y": "27", "t": "조약이 개인에게 직접 권리나 의무를 부과할 때 ‘직접[[효력]]’이 있다고 표현하는데 이는 조약 [[해석]]의 문제이다."}, {"id": "k27_261005_3_5", "y": "27", "t": "Trendtex Trading Corporation v. Central Bank of Nigeria사건에서 [[선례구속]]의 원칙은 국제법규에는 적용되지 않으며, 따라서 절대적 면제이론에 기초한 선례에 관계없이 변경된 신국제관습법규(즉 제한적 면제이론)를 적용할 수 있다고 판결하였다."}, {"id": "k27_261005_3_6", "y": "27", "t": "Sei Fujii 사건에 의하면 유엔헌장의 [[인권]]관련규정은 비자기집행조항이다."}, {"id": "k27_261005_3_7", "y": "27", "t": "우리나라 대법원은 항공운송에 관한 바르샤바협약(1955)은 국제항공운송에 관한 법률관계에 있어서 일반법인 민법에 대한 [[특별법]]이므로 민법보다 우선 적용된다고 하였다."}, {"id": "k27_261005_3_8", "y": "27", "t": "나미비아 사건(1971)에서 ICJ는 조약 일방 당사자의 중대한 위반이 있으면 타방 당사자는 조약을 [[종료]]시킬 수 있다고 하였다."}, {"id": "k27_261005_3_9", "y": "27", "t": "가브치코보 나기마로스 사건에서 헝가리가 조약 종료 사유로 주장한 사정변경, 후발적 이행불능, [[조약의 중대한 위반]]은 모두 기각되었다."}]}}, {"ch": "NEW:k27c_subj:국제법의 주체:i70", "chname": null, "sec": {"id": "k27s_261006_4", "title": "국제법의 주체 (10.06)", "note": "국가, 국제기구, 교전단체, 민족해방운동단체, 개인 등 고루 출제됨", "items": [{"id": "k27_261006_4_0", "y": "27", "t": "1933년 국가의 권리의무에 관한 몬테비데오협약에 의하면 국가성립요건은 영토, 인구, 정부, [[외교능력]]이다."}, {"id": "k27_261006_4_1", "y": "27", "t": "ICJ는 Accordance with International Law of the Unilateral Declaration of Independence in respect of Kosovo 권고적 의견에서 영토적 일체성 존중의 원칙이란 [[국가]] 사이에 적용되는 원칙이므로 코소보의 독립선언이 일반 국제법의 위반은 아니라고 판시한 바 있다."}, {"id": "k27_261006_4_2", "y": "27", "t": "ICJ는 베르나돗테 백작사건에서 UN의 국제법인격 및 UN의 대세적 국제법인격을 인정하고, 비회원국인 [[이스라엘]]에 대해 UN이 국제청구를 제기할 수 있다고 보았다."}, {"id": "k27_261006_4_3", "y": "27", "t": "국제기구의 법인격의 범위는 1차적으로는 설립헌장을 통해 명시적으로 규정되기도 하지만 설립헌장에 명시되어 있지 않더라도 기구의 목적과 기능 그리고 실행을 통해 [[묵시적]]으로 결정되기도 한다. 이를 [[묵시적]] 권한이론이라고 한다."}, {"id": "k27_261006_4_4", "y": "27", "t": "네덜란드 대법원은 UN PKF 활동과정에서 벌어진 결과라도 문제의 행위에 대해 네덜란드 정부가 실효적 통제를 하고 있었다면 그 책임은 네덜란드에 귀속된다고 판단한 사례가 있다.([[Nuhanović]] 사건)"}, {"id": "k27_261006_4_5", "y": "27", "t": "[[국제포획]]법원이 개인의 제소권을 최초로 인정하였으나 설치되지 않았고, 중미사법법원이 설립된 재판소 중 최초로 개인의 제소권을 인정하였다."}, {"id": "k27_261006_4_6", "y": "27", "t": "동티모르 사건에서 ICJ는 [[민족자결권]]이 대세적 성격을 가지며, 현대국제법의 본질적인 원칙의 하나임을 인정하였다."}, {"id": "k27_261006_4_7", "y": "27", "t": "동티모르 사건에서 ICJ는 민족자결권의 대세적 성격에도 불구하고 필요적 공동당사자 원칙을 적용해야 한다고 하였다. 즉, 인도네시아의 당사자 참여 없이 재판을 진행할 수 없다고 보았다. [[금화]]원칙이 적용된 사례이다."}, {"id": "k27_261006_4_8", "y": "27", "t": "1737년의 Barbuit’s Case에서 대법관은 국제법이 완전히 [[영국]]법의 일부라고 하여 국제관습법의 [[영국]] 국내법에로의 수용을 확인하였다."}, {"id": "k27_261006_4_9", "y": "27", "t": "자기집행조약과 비자기집행조약의 구분이 사실상 최초로 행해진 것은 1829년의 [[Foster]] and Elam v. Neilson사건이나, 관련하여 주로 인용되는 판례는 Sei Fujii v. California이다."}]}}, {"ch": "NEW:k27c_recog:승인:k27c_subj", "chname": null, "sec": {"id": "k27s_261007_5", "title": "국가승인 (10.07)", "note": "묵시적 승인에 해당되는 국가행위가 주로 출제됨. 상조의 승인이나 승인의 철회 관련 판례나 사례 출제 예상됨", "items": [{"id": "k27_261007_5_0", "y": "27", "t": "승인은 일방적 행위이므로 신생국의 [[수락]]과 무관하게 법적 효과가 발생한다."}, {"id": "k27_261007_5_1", "y": "27", "t": "[[능력구분]]설은 국가의 법인격을 권리능력과 행위능력으로 구별하여 국가는 승인 이전에도 권리능력을 가지나, 행위능력은 승인을 통해서만 인정된다는 입장이나 선언적효력설에 가까운 입장이다."}, {"id": "k27_261007_5_2", "y": "27", "t": "[[상조]]의 승인은 위법이고 무효이며 분리독립의 경우 본국에 대해 국가책임이 성립한다."}, {"id": "k27_261007_5_3", "y": "27", "t": "현행법상 [[강행규범]]을 위반한 경우 국가로 성립할 수 없고, 타국은 승인하지 아니할 법적 의무를 부담한다."}, {"id": "k27_261007_5_4", "y": "27", "t": "법률상의 승인과 사실상의 승인은 승인의 효력이 아니라 승인의 대상이 되는 국가가 얼마나 [[확립]]되어 있는지에 관한 문제이다."}, {"id": "k27_261007_5_5", "y": "27", "t": "조건부 승인에서 신생국이 조건을 미성취하더라도 승인은 [[유효]]하나, 조건 미성취부분에 대해 법적 책임을 진다."}, {"id": "k27_261007_5_6", "y": "27", "t": "영국은 창설적 효과설을 완화하기 위해 대리인 논리를 동원하고 있다. Carl Zeiss v. Rayner and Keeler Ltd.(No.2)에서 영국 상원은 미승인국가 동독의 행위를 인정하기 위하여 동독을 독립국가가 아니라 영국의 승인을 받은 [[소련]]의 한 종속기구로 간주하였다."}, {"id": "k27_261007_5_7", "y": "27", "t": "2001년 Emin v. Yeldag사건에서 영국법원은 북싸이프러스 터키공화국(Turkish Republic of Northern Cyprus : TRNC)에서 획득한 이혼이 유효임을 정면으로 인정하였다. 이는 Namibia 권고적 의견에서 제시된 원칙과도 맥을 같이한다. ICJ는 남아프리카공화국의 [[나미비아]] 통치는 위법이라고 보면서도, 출생·사망·혼인등록 등 주민의 일상생활에 필요한 행정행위까지 모두 무효로 해서는 안 된다고 보았다."}, {"id": "k27_261007_5_8", "y": "27", "t": "ICJ는 1971년 Namibia사건에 대한 권고적 의견에서 위임통치 종료 후 남아프리카공화국이 나미비아를 위해 행한 공적 행동은 자결권을 부인하는 것으로서 대세적으로 위법이고 무효이나, 이 무효가 출생, 사망, 혼인의 등록과 같은 행위들에는 연장 적용될 수 없다고 하였다. 이 행위들을 무효화하는 경우 주민들이 피해를 입을 수 있기 때문이다. ICJ가 나미비아 사건에서 언급한 이러한 불승인 의무에 대한 예외를 ‘[[나미비아]] 예외’라고 한다."}, {"id": "k27_261007_5_9", "y": "27", "t": "국가연합에서 구성국의 위법행위는 [[구성국]]이 책임지나, 연방국가의 경우 구성국의 위법행위는 [[연방]]으로 귀속되어 연방이 책임을 진다."}]}}, {"ch": "NEW:k27c_recog:승인:k27c_subj", "chname": null, "sec": {"id": "k27s_261008_6", "title": "정부승인 및 교전단체승인 (10.08)", "note": "토바르주의 등 정부승인 관련 주장 숙지. 미승인국의 법적 지위 빈출. 교전단체 승인 이유. 교전단체 승인의 방법 및 법적 효과 출제 예상", "items": [{"id": "k27_261008_6_0", "y": "27", "t": "[[정부]]승인을 위해서는 신정부가 ‘일반적 사실상의 정부’를 수립해야 한다."}, {"id": "k27_261008_6_1", "y": "27", "t": "[[티노코]]사건(1923)은 혁명을 통해 수립된 정부도 자국을 실효적으로 통제하는 경우 타국의 승인과 무관하게 유효한 법률행위를 할 수 있다고 하여 정부승인에 있어서 사실주의를 확인하였다."}, {"id": "k27_261008_6_2", "y": "27", "t": "루터 대 사고르 사건은 정부승인의 [[소급]]효를 인정한 판례이다."}, {"id": "k27_261008_6_3", "y": "27", "t": "영국법원은 [[셀라시에]] 망명정부의 지위와 관련하여 법률상 승인을 받은 신정부는 사실상의 승인만을 받았던 시기까지 소급하여 구 정부의 권리를 승계한다고 하였다(정부승인의 소급효 인정)."}, {"id": "k27_261008_6_4", "y": "27", "t": "[[에스트라다]] 독트린은 1930년 9월 27일 멕시코 외무장관 [[에스트라다]]의 선언에서 비롯되었다. [[에스트라다]] 독트린은 이미 승인 받은 국가 내에서 혁명적인 방법으로 정부의 변경이 있더라도 신정부를 명시적이고 공식적인 승인의 대상으로 삼아서는 안 됨을 의미한다."}, {"id": "k27_261008_6_5", "y": "27", "t": "제3국이 교전단체 승인시 무력투쟁상태 존재, [[지방적]] 사실상 정부의 조직, 전쟁법규 준수의 의사와 능력, 타국의 권익 존재를 요한다."}, {"id": "k27_261008_6_6", "y": "27", "t": "제3국이 [[중립]]을 선언하는 것은 반란단체에 대한 승인의 의사표시이다."}, {"id": "k27_261008_6_7", "y": "27", "t": "교전단체 승인시 본국과 교전단체 간에는 [[전쟁]]법이, 양 행위자와 제3국간에는 [[중립]]법이 적용된다."}, {"id": "k27_261008_6_8", "y": "27", "t": "미국은 미승인국의 미국 국내적 지위에 대해, [[제소]]권은 창설적 효력설을, 국가면제나 국가행위이론은 선언적효력설을 지지한다."}, {"id": "k27_261008_6_9", "y": "27", "t": "미승인국가의 영토에서 설립된 법인(국제기구 포함)은 종래 영국법에서 그 법인격을 직접 인정받기가 어려웠다. 그러나 <외국법인법 1991(Foreign Corporations Act 1991)>은 영국 정부로부터 국가로 승인받지 못한 영토에서 설립된 법인체라도 당해 영토의 법들이 한 개의 확립된 [[재판소]] 체제에 의하여 적용되는 경우에는 영국 내에서 법인격을 갖는 것으로 간주한다고 규정하고 있다."}]}}, {"ch": "i93", "chname": "기본적 권리·의무", "sec": {"id": "k27s_261009_7", "title": "국가의 기본적 권리의무 (10.09)", "note": "자위권, 국내문제불간섭의무 위주로 출제되고 있음. 자위권 관련 세세한 법리나 판례 정리", "items": [{"id": "k27_261009_7_0", "y": "27", "t": "우호관계선언은 국가의 기본적 권리의무로 무력사용금지, 분쟁의 평화적 해결, 내정불간섭, 국제협력의무, 자결권, [[주권평등]], 신의성실원칙을 규정하였다."}, {"id": "k27_261009_7_1", "y": "27", "t": "ICJ는 Gabčikovo-Nagymaros Project에서 조약법협약 제26조에 반영된 [[신의성실]] 의무는 당사자들에게 조약을 합리적인 방식으로 그리고 조약의 목적이 실현될 수 있는 방식으로 적용할 의무를 지우고 있다고 하였다."}, {"id": "k27_261009_7_2", "y": "27", "t": "Border and Transborder Armed Action 사건에서 ICJ는 [[신의성실]] 원칙은 다른 의무가 존재하지 않는다면 그것 자체가 의무의 연원은 아니라고 하였다."}, {"id": "k27_261009_7_3", "y": "27", "t": "Oil Platform사건에서 ICJ는 [[자위권원용국]]이 발동 요건 충족에 대해 입증해야 한다고 하였다."}, {"id": "k27_261009_7_4", "y": "27", "t": "니카라과 사건에서 국제사법재판소는 무력공격과 무력사용을 구분하고, 구별기준으로 무력사용의 [[규모]]와 효과를 제시하였다. 상당한 수준 이상의 무력사용(use of force)을 무력공격으로 보았다."}, {"id": "k27_261009_7_5", "y": "27", "t": "니카라과 사건에 의하면 타국의 반군단체에게 [[자금]]을 지원하는 것은 위법한 무력사용이 아니나, 국내문제불간섭의무 위반에 해당되어 책임이 성립한다."}, {"id": "k27_261009_7_6", "y": "27", "t": "[[캐롤라인]]호 사건에서 미 국무장관 웹스터는 비례성, 필요성 요건을 자위권 발동요건으로 제시하였고 오늘날 국제관습법상의 자위권 발동 요건이다. 비례성과 필요성을 ‘Caroline Principle’또는 Webster공식이라고 한다."}, {"id": "k27_261009_7_7", "y": "27", "t": "에리트리아-에티오피아 청구 위원회는 소규모 보병부대 간 국경에서의 국지적인 조우전은 설사 인명 손실을 동반하는 것이라 하더라도 UN헌장의 목적상 [[무력공격]]을 구성하지 않는다고 하였다."}, {"id": "k27_261009_7_8", "y": "27", "t": "정부승인의 효력은 선언적, 상대적, [[소급]]적이다."}, {"id": "k27_261009_7_9", "y": "27", "t": "교전단체 승인은 [[창설]]적, 재량적, 비소급적(장래적)이다."}]}}, {"ch": "i93", "chname": "기본적 권리·의무", "sec": {"id": "k27s_261012_8", "title": "자위권 (10.12)", "note": "자위권 논점이 많아 한 번 더 출제함. 무력공격을 포함하여 세부 논점 체크. 장벽건설사건과 자위권 관련논점 출제 예상", "items": [{"id": "k27_261012_8_0", "y": "27", "t": "헌장 제[[51]]조는 국제관습법상 자위권을 모두 포괄한 것이 아니다."}, {"id": "k27_261012_8_1", "y": "27", "t": "헌장 제[[51]]조는 개별적 자위권을 확인함과 동시에 집단적 자위권을 [[창설]]하였다."}, {"id": "k27_261012_8_2", "y": "27", "t": "개별적 자위권 발동요건으로 UN헌장은 [[무력공격]]의 발생, 안보리에 사후보고, 안보리가 필요한 조치를 취할 때까지를 규정하고 있다."}, {"id": "k27_261012_8_3", "y": "27", "t": "Oil Platform사건에서 ICJ는 [[자위권원용국]]이 발동 요건 충족에 대해 입증해야 한다고 하였다."}, {"id": "k27_261012_8_4", "y": "27", "t": "니카라과 사건에서 국제사법재판소는 무력공격과 무력사용을 구분하고, 구별기준으로 무력사용의 규모와 [[효과]]를 제시하였다. 상당한 수준 이상의 무력사용(use of force)을 무력공격으로 보았다."}, {"id": "k27_261012_8_5", "y": "27", "t": "국제사법재판소에 의하면 [[집단적]] 자위권을 발동하기 위해서는 피침국의 요청이 있어야 하는데, 반드시 사후요청을 받을 필요는 없고, 사전적 요청도 충분하다."}, {"id": "k27_261012_8_6", "y": "27", "t": "국제사법재판소에 의하면 이스라엘이 팔레스타인 영토에 장벽을 건설한 행위에 대해 자위권이나 [[긴급피난]]으로 정당화할 수 없다."}, {"id": "k27_261012_8_7", "y": "27", "t": "[[캐롤라인]]호 사건에서 미 국무장관 웹스터는 비례성, 필요성 요건을 자위권 발동요건으로 제시하였고 오늘날 국제관습법상의 자위권 발동 요건이다. 비례성과 필요성을 ‘Caroline Principle’또는 Webster공식이라고 한다."}, {"id": "k27_261012_8_8", "y": "27", "t": "ICJ는 Gabčikovo-Nagymaros Project에서 조약법협약 제26조에 반영된 [[신의성실]] 의무는 당사자들에게 조약을 합리적인 방식으로 그리고 조약의 목적이 실현될 수 있는 방식으로 적용할 의무를 지우고 있다고 하였다."}, {"id": "k27_261012_8_9", "y": "27", "t": "튀니지 모로코 국적법에 관한 권고적 의견 사건에서 [[상설국제사법재판소]]는 국적문제는 국내문제이나 사정에 따라 국제문제가 될 수 있다고 보았다."}]}}, {"ch": "i96", "chname": "국가관할권·면제", "sec": {"id": "k27s_261013_9", "title": "국가관할권 (10.13)", "note": "개념이 주로 출제되나, 관행이나 판례 출제시 난도 높아집니다. 우리나라 관련 사항 출제빈도가 높습니다.", "items": [{"id": "k27_261013_9_0", "y": "27", "t": "객관적 속지주의는 범죄의 개시국과 완성국이 다른 경우 [[완성국]]이 관할권을 갖는다는 이론이다."}, {"id": "k27_261013_9_1", "y": "27", "t": "로터스호사건에서 상설국제사법재판소는 공해상 선박충돌 사건에 대해 피해선의 국적국인 [[터키/튀르키예]]가 관할권을 행사할 수 있다고 보았다."}, {"id": "k27_261013_9_2", "y": "27", "t": "[[집행]]관할권은 영토내에서는 일반적 허용이나, 영토 밖으로의 집행은 일반적 금지원칙이 적용된다."}, {"id": "k27_261013_9_3", "y": "27", "t": "미국은 ‘[[ALCOA]]’판결에서 효과이론을 도입하였다."}, {"id": "k27_261013_9_4", "y": "27", "t": "미국은 [[Yunis]]사건(1988)에서 항공기 납치행위는 보편관할권의 적용 대상이라고 보았으며, 피랍항공기에 미국인이 탑승했음을 이유로 수동적 속인주의(피해자 국적주의)도 적용된다고 보았다."}, {"id": "k27_261013_9_5", "y": "27", "t": "전직대통령에 대한 고문방지협약 적용 사건(2012)에서 ICJ는 고문방지협약의 모든 당사국은 혐의자가 소재하는 당사국에게 ‘기소 또는 인도’의무 이행을 요구할 수 있는 권리가 있다고 하였다. 또한 ICJ는 협약 상 기소 또는 인도 의무는 협약의 모든 당사국들에 대한 [[대세적]] 의무라고 하였다. 또한 [[인도]]의무보다는 [[기소]]의무가 1차적 의무라고 보았다."}, {"id": "k27_261013_9_6", "y": "27", "t": "미국은 [[Alvarez-Machain/노리에가]]사건에서 피고인이 납치에 의해 재판정에 앉아있다고 해도 재판관할권을 행사할 수 있다고 하였다."}, {"id": "k27_261013_9_7", "y": "27", "t": "체포영장사건에서 [[벨기에]]는 보편주의에 기초하여 관할권을 가진다고 보았으나, 현직 외무장관에 대한 영장 발부는 인적 면제를 침해하여 위법이라고 보았다."}, {"id": "k27_261013_9_8", "y": "27", "t": "니카라과 사건에 의하면 타국의 반군단체에게 [[자금]]을 지원하는 것은 위법한 무력사용이 아니나, 국내문제불간섭의무 위반에 해당되어 책임이 성립한다."}, {"id": "k27_261013_9_9", "y": "27", "t": "[[Oil Platforms]] 사건에서 ICJ는 미국 국기를 게양한 한 상선에 대한 기뢰에 의한 공격은 무력공격을 구성할 수 있다고 판시하였다. 즉, 다른 모든 조건이 충족된다면 특정 국가의 국기를 게양한 단 한 척의 상선에 대한 무력공격도 그 국가에 대한 공격과 동일시 할 수 있음을 시사하는 것으로 평가된다."}]}}, {"ch": "i96", "chname": "국가관할권·면제", "sec": {"id": "k27s_261014_10", "title": "국가면제 (1) (10.14)", "note": "국가면제 논점이 많아 두 번 정리합니다. 유엔협약 중심으로 출제되고 있습니다. 면제의 묵시적 포기에 해당하는 행위, 강제집행권면제의 포기 등이 출제 예상됩니다.", "items": [{"id": "k27_261014_10_0", "y": "27", "t": "[[재판]]관할권으로부터의 면제와 집행관할권으로부터의 면제는 별개로 취급된다."}, {"id": "k27_261014_10_1", "y": "27", "t": "인적면제는 신분상 면제로서 관습법상 국가원수, [[정부수반]], 외교부장관, 외교관이 향유하며, 신분종료시 인적면제는 종료된다."}, {"id": "k27_261014_10_2", "y": "27", "t": "[[피노체트]] 사건에서 영국 대법원은 국가원수의 국제범죄는 국가원수의 직무행위로 볼 수 없으므로 퇴직 후에는 타국의 형사소추를 받을 수 있다고 하였다."}, {"id": "k27_261014_10_3", "y": "27", "t": "제한면제론은 국가의 권력작용(acta jure imperii)에 대해서는 면제를 인정하나, 비권력작용([[acta jure gestionis]])에 대해서는 면제를 부인한다."}, {"id": "k27_261014_10_4", "y": "27", "t": "유엔협약은 국가행위 구분 기준으로서 [[성질]]을 우선 고려하되 [[목적]]도 고려할 수 있다고 규정한다."}, {"id": "k27_261014_10_5", "y": "27", "t": "ILC는 전염병 확산을 막기 위한 의료품의 공급계약, 기근이 발생한 지역의 주민에게 공급할 식량 구입계약 등이 [[목적]]에 근거하여 주권면제가 부여될 수 있는 행위로 예시했다."}, {"id": "k27_261014_10_6", "y": "27", "t": "대림기업사건에서 우리나라는 [[제한]]면제론을 적용하였다."}, {"id": "k27_261014_10_7", "y": "27", "t": "주한미군 고용계약사건에서 우리나라는 [[제한]]면제론을 적용하였다."}, {"id": "k27_261014_10_8", "y": "27", "t": "미국은 Filartiga v. Pena-Irala판결에서 Alien Tort Act에 근거하여 미국 영토 밖에서 발생한 불법행위로 인해 피해를 입은 외국인은 연방법원에 민사소송을 제기할 수 있다고 판시하였다. 이후 미국은 2013년 [[Kiobel]] v. Royal Dutch Petroleum Co.사건에서 Alien Tort Act의 역외적용가능성을 부인하였다."}, {"id": "k27_261014_10_9", "y": "27", "t": "페스카마호사건(1996)은 공해상에서 온두라스 국적 페스카마호에 승선한 중국인 선원이 한국인 등을 살해한 사건으로서 [[한국]]은 피해자의 국적국으로서 형사관할권을 행사하였다(수동적 속인주의)."}]}}, {"ch": "i96", "chname": "국가관할권·면제", "sec": {"id": "k27s_261015_11", "title": "국가면제 (2) (10.15)", "note": "국가면제 관련 판례는 독일-이탈리아 간 판례가 지속적으로 출제되고 있습니다. 그 밖에 법정지영토 밖의 사건에 대해 면제를 제한한 오토 웜비어 사건도 출제가 임박했습니다.", "items": [{"id": "k27_261015_11_0", "y": "27", "t": "유엔협약에 의하면 상업적 거래는 원칙적으로 면제가 제한되나, [[국가]]간 상업적 거래는 면제를 인정한다."}, {"id": "k27_261015_11_1", "y": "27", "t": "유엔협약에 의하면 고용계약은 면제가 제한되나, 법정지국과의 [[영토]]관련성을 가져야 한다. 즉, 고용계약의 전부 또는 일부가 법정지국 내에서 이행되었거나 이행될 예정이어야 한다."}, {"id": "k27_261015_11_2", "y": "27", "t": "Al-Adsani사건에서 영국은 불법행위가 [[영국]] 밖에서 발생했음을 이유로 아자니의 청구를 각하하였으며, 유럽인권법원 역시 이러한 영국의 조치가 아자니의 유럽인권협약상 재판청구권을 침해한 것은 아니라고 판시하였다."}, {"id": "k27_261015_11_3", "y": "27", "t": "[[이탈리아]]는 Ferrini사건에서 강행규범위반의 경우 법정지영토 밖에서 발생했다고 하더라도 면제의 묵시적 포기이론에 따라 면제를 제한할 수 있다고 본다."}, {"id": "k27_261015_11_4", "y": "27", "t": "독일-이탈리아간 국가면제 사건에서 국제사법재판소는 [[강행규범]]위반행위라도 법정지영토 밖에서 발생한 경우 면제를 인정하는 것이 현행관습이라고 보아 이탈리아의 조치는 관습법을 위반한 것이라고 판시하였다."}, {"id": "k27_261015_11_5", "y": "27", "t": "유엔협약에 의하면 법정지국에 소재하는 재산에 대해 재판 후에는 일정한 조건하에 강제집행할 수 있다. 단, 재산이 [[권력]]적 목적 이외 용도로 사용되고, 법정지국 영토 내에 소재하며, 소송의 대상이 된 실체와 관련이 있어야 한다."}, {"id": "k27_261015_11_6", "y": "27", "t": "유엔협약에 의하면 [[원고]]로서 소를 제기하는 경우 면제의 묵시적 포기이다."}, {"id": "k27_261015_11_7", "y": "27", "t": "재판관할권에 대한 면제의 포기가 [[집행]]관할권에 대한 면제의 포기를 포함하는 것은 아니므로 별도의 포기를 요한다."}, {"id": "k27_261015_11_8", "y": "27", "t": "체포영장사건에서 벨기에는 [[보편주의]]에 기초하여 관할권을 가진다고 보았으나, 현직 외무장관에 대한 영장 발부는 인적 면제를 침해하여 위법이라고 보았다."}, {"id": "k27_261015_11_9", "y": "27", "t": "로터스호사건에서 상설국제사법재판소는 공해상 선박충돌사건에 대해 가해선의 국적국이 관할권을 갖는 것이 관습이라는 [[프랑스]]의 주장을 배척했으나, 이후 가해선 국적국 관할권이 관습으로 확립되었다."}]}}, {"ch": "i96", "chname": "국가관할권·면제", "sec": {"id": "k27s_261016_12", "title": "국가행위이론 (10.16)", "note": "출제빈도가 높진 않지만, 간과할 수는 없는 테마입니다. 미국의 판례를 중심으로 정리하고, 국가면제와의 차이점 등을 숙지해야 합니다.", "items": [{"id": "k27_261016_12_0", "y": "27", "t": "국가행위이론은 [[영미]]법계 국내법상 원칙이다."}, {"id": "k27_261016_12_1", "y": "27", "t": "국가행위이론은 미국의 경우 헌법상 [[삼권분립]]원칙을 실현하기 위한 사법자제를 요구하는 이론이다."}, {"id": "k27_261016_12_2", "y": "27", "t": "[[미국]]은 사바티노 사건, 언더힐 대 헤르난덴스 사건 등에서 국가행위이론을 적용하였다."}, {"id": "k27_261016_12_3", "y": "27", "t": "미국은 [[번스타인]] 예외, 사바티노 수정법, 제한적 국가행위이론 등의 법리를 통해 국가행위이론의 적용을 제한한다."}, {"id": "k27_261016_12_4", "y": "27", "t": "번스타인 예외는 미국 [[국무부]]가 국가행위이론을 적용하지 않을 것을 사법부에 요청하는 경우 동 이론을 적용하지 않는 것을 말한다."}, {"id": "k27_261016_12_5", "y": "27", "t": "국가면제는 국제법원칙이나 국가행위이론은 [[영미]]법계 국내법원칙이다."}, {"id": "k27_261016_12_6", "y": "27", "t": "국가면제는 [[관할권]] 부재를 주장하는 항변으로 적용되나, 국가행위이론은 본안판단에서 타국의 공권력 행위를 심사할 수 없다는 항변으로 제기된다."}, {"id": "k27_261016_12_7", "y": "27", "t": "국가면제는 대체로 [[국가]]가 피고인 경우 제기되는 문제이나, 국가행위이론은 사인간 소송에서도 제기될 수 있다."}, {"id": "k27_261016_12_8", "y": "27", "t": "독일-이탈리아간 국가면제 사건에서 국제사법재판소는 점령지에서의 민간인 살해나 강제이주 및 강제노역에 종사하도록 하는 것은 [[강행규범]]에 위반된다고 하였다."}, {"id": "k27_261016_12_9", "y": "27", "t": "북한에서 고문 피해를 입은 미국인 오토 웜비어의 유족이 북한을 상대로 미국법원에 제기한 손해배상소송에서 미국법원은 ‘[[국가테러]]예외’를 적용하여 북한의 면제를 부인하고, 웜비어측의 승소를 판결하였다."}]}}, {"ch": "i171", "chname": "국가책임", "sec": {"id": "k27s_261019_13", "title": "국가행위책임 (10.19)", "note": "국가책임은 2001년 최종초안 중심으로 출제됩니다. 초안 규정을 정교하게 읽으면서 공부해 주세요. 7급은 판례 출제 빈도가 높아지고 있으며, 9급도 같은 방향으로 갈 가능성이 높으므로 판례도 철저하게 체크하고 암기해 주세요. 오늘은 판례위주로 출제합니다.", "items": [{"id": "k27_261019_13_0", "y": "27", "t": "티노코 중재사건(1923)은 명백한 [[월권]]행위의 국가귀속성을 부정하였다."}, {"id": "k27_261019_13_1", "y": "27", "t": "[[Massy]] 사건에 의하면 하급기관의 행위도 국가로 귀속된다."}, {"id": "k27_261019_13_2", "y": "27", "t": "Yeager 사건(1987)에서 이란-미국 간 중재재판소는 이란 혁명수비대의 위법행위는 이란 당국 부재 시 공공기능을 [[자발적으로]] 수행하는 과정에서 발생한 것이므로 이란의 행위로 귀속된다고 보았다."}, {"id": "k27_261019_13_3", "y": "27", "t": "니카라과 사건에서 콘트라반군은 미국의 [[사실상]] 국가기관이 아니므로 반군의 활동에 대해서는 책임을 지지 않는다고 보았다."}, {"id": "k27_261019_13_4", "y": "27", "t": "테헤란 사건에서 [[호메이니]]가 이란 대학생의 행위를 이란의 행위로 추인한 이후 이란 대학생들은 사실상 이란의 국가기관으로 지위가 변경되었다."}, {"id": "k27_261019_13_5", "y": "27", "t": "Caroline호 사건(1837)은 자위권에 관한 사건으로 널리 알려졌지만, ILC는 국가책임초안 제25조([[긴급피난]])에 대한 주석에서 [[긴급피난]]의 한 사례로 이 사건을 설명하고 있다. 이 사건은 실제로는 [[긴급피난]]의 항변에 관한 것이었기 때문이다."}, {"id": "k27_261019_13_6", "y": "27", "t": "CMS Gas Transmission Company v. Argentina 사건에서 ICSID 중재재판소는 [[긴급피난]]의 항변이 행위의 위법성을 조각할 수는 있겠지만, 그것은 희생을 감수해야 했던 권리소유자에 대한 보상의무를 배제하지는 않는다고 하였다."}, {"id": "k27_261019_13_7", "y": "27", "t": "Pulp Mills on the River Uruguay 사건(2010)에서 국제사법재판소는 [[절차]]적 의무 위반에 불과한 사안에 대해 원상회복의 요구는 부적절하며, 재판소가 우루과이 측의 의무 위반을 확인하는 판결을 내림으로써 [[만족(satisfaction)]]이 성립된다고 판시했다."}, {"id": "k27_261019_13_8", "y": "27", "t": "Jurisdictional Immunities of the State 사건에서 국제사법재판소는 사법부의 국제의무 위반의 경우에도 판결을 파기하는 등 [[원상회복]] 의무가 부과될 수 있음을 시사하였다. 다만 당해 사건에서 결과를 달성할 최선의 방법은 피고 국가에게 선택할 권리가 있다고 하였다."}, {"id": "k27_261019_13_9", "y": "27", "t": "Jurisdictional Immunities of the State 사건에서 국제사법재판소는 무력충돌 후 국가 간에 [[일괄해결(lump-sum)]]에 합의한 경우 피해자의 본국이 배상금을 받아 다른 용도로 사용함으로써 자기 몫을 받지 못한 피해자 개인이 다시 가해국을 상대로 청구를 제기할 권리가 있다고 보기는 어려울 것임을 시사한 바 있다."}]}}, {"ch": "i246", "chname": "대외기관", "sec": {"id": "k27s_261020_14", "title": "외교 (10.20)", "note": "외교파트는 1961년의 빈협약을 중심으로 출제됩니다. 매우 세부적인 논점도출제되므로 조약을 공부해야 합니다. 영사협약과 비교도 빈번하게 출제되므로 영사협약상 대칭 구절과의 비교도 하면서 공부해야 합니다.", "items": [{"id": "k27_261020_14_0", "y": "27", "t": "테헤란 주재 미 외교관 인질사건(1980)에서 ICJ는 미국의 과거 불법행위로 인하여 인질사태가 초래되었더라도 외교관계협약상 이란의 유일한 합법적 대응수단은 [[기피인물]]로 선언하여 퇴거를 요청하는 것밖에 없으므로 이란 정부의 미국 외교관 불법억류는 정당화될 수 없다고 하였다."}, {"id": "k27_261020_14_1", "y": "27", "t": "비호권 사건에서 국제사법재판소는 [[지역관습]] 자체의 성립 가능성은 인정하였으나, 공관 비호권이 라틴아메리카 [[지역관습]]으로 형성된 것은 아니라고 판시하였다."}, {"id": "k27_261020_14_2", "y": "27", "t": "토레 사건에서 국제사법재판소는 콜롬비아의 외교적 비호권을 부인하면서도 콜롬비아가 토레를 페루에 [[인도]]할 의무는 없다고 판단하였다."}, {"id": "k27_261020_14_3", "y": "27", "t": "Sun Yat-Sen 사건은 1896년 런던 주재 청국 공사관이 Sun Yat-Sen을 불법감금한 사건이다. 영국 [[법원]]은 외교공관의 불가침성을 이유로 인신보호영장 발부를 거절하였다. 그러나 영국 [[정부]]는 청국 공사관이 자국민을 체포·감금하고 있는 것은 외교특권의 남용이라고 비난하면서 체포된 사람의 방면을 위해 모든 조치를 취할 것이라고 하였다."}, {"id": "k27_261020_14_4", "y": "27", "t": "Armed Activities on the Territory of the Congo 사건에서 ICJ는 콩고민주공화국의 수도 킨샤사 주재 [[우간다]] 대사관과 대사관 내의 사람들에 대한 콩고 군대의 공격은 비엔나협약 제22조의 중대한 위반을 구성한다고 하면서, 공격받은 사람들이 실제로 외교관들인 경우 콩고는 추가적으로 비엔나협약 제29조(신체의 불가침)를 위반하게 된다고 하였다."}, {"id": "k27_261020_14_5", "y": "27", "t": "국제사법재판소는 United States Diplomatic and Consular Staff in Tehran 사건을 원용하면서 외교관계 비엔나협약은 접수국 자신이 사절단의 불가침성을 침해하는 것을 금지하고 있을 뿐만 아니라 다른 사람들이 사절단의 불가침성을 침해하는 것을 [[방지]]할 의무도 접수국에 지우고 있다고 하였다."}, {"id": "k27_261020_14_6", "y": "27", "t": "한국인이 주한 자이레(현 콩고민주공화국) 대사관에 대사 관저로 사용 중인 주택을 임대해 준 후 임대료를 받지 못하자 주택의 명도 및 임대료 지급을 구하는 소송을 제기하여 승소하였다. 그러나 집행관이 외교공관의 [[불가침성]]을 이유로 강제집행을 거부하자 국가를 상대로 손실보상 및 손해배상을 청구하였으나, 법원은 집행관의 강제집행 거부가 위법하지 않다고 판단하였다."}, {"id": "k27_261020_14_7", "y": "27", "t": "외교관계에 관한 비엔나협약상 외교관은 접수국의 형사재판관할권으로부터 면제되며, 민사 및 행정재판관할권으로부터도 원칙적으로 면제된다. 다만, 접수국 내 사유[[부동산]]에 관한 소송, 사인으로서 관여한 상속소송, 공적 직무 이외의 직업적 또는 상업적 활동에 관한 소송은 예외로 한다."}, {"id": "k27_261020_14_8", "y": "27", "t": "외교관은 접수국에서 증인으로서 증언할 의무가 없으며, [[파견국]]은 외교관의 재판관할권 면제를 명시적으로 포기할 수 있다. 그러나 재판관할권 면제의 포기는 판결의 집행에 관한 면제의 포기를 의미하지 않으며, 강제집행을 위해서는 별도의 포기가 필요하다."}, {"id": "k27_261020_14_9", "y": "27", "t": "외교행낭은 개봉하거나 유치할 수 없으며, 외교신서사는 직무수행 중 신체의 불가침과 체포·구금으로부터의 보호를 향유한다. 항공기 기장에게 외교행낭이 위탁된 경우 기장은 임시 외교신서사로 간주되며, 임시외교신서사의 특권과 면제는 외교행낭의 배달이 완료되면 종료된다. [[[X]. 외교신서사로 불간주.]]"}]}}, {"ch": "i246", "chname": "대외기관", "sec": {"id": "k27s_261021_15", "title": "영사 (10.21)", "note": "영사협약을 중심으로 공부합니다. 상당히 디테일하게 출제되므로 조약공부는 필수입니다. 26년에도 명예영사가 출제되었습니다. 협약내에서는 요건-동의/명시적 동의/사전동의 등-을 면밀하게 체크하시고, 협약 제36조 영사보호에 관한 판례들을 숙지해 주세요.", "items": [{"id": "k27_261021_15_0", "y": "27", "t": "Avena 사건은 미국이 [[영사고지의무]]를 태만히 하여 멕시코의 영사협약 상의 권리를 침해했다고 본 사건이다."}, {"id": "k27_261021_15_1", "y": "27", "t": "영사 기관의 소재지 이외의 다른 장소에 기존 영사기관의 일부를 이루는 사무소를 개설하기 위해서는 접수국의 [[명시적 사전 동의]]가 필요하다."}, {"id": "k27_261021_15_2", "y": "27", "t": "1997년 독일 연방 헌법 재판소는 외교관은 접수국 내의 행위에 대해 제3국의 관할권으로부터는 면제되지 않는다고 하였다.", "a": "O"}, {"id": "k27_261021_15_3", "y": "27", "t": "영사행낭은 일정한 경우 개방을 요구할 수 있고, 불응 시 발송지로 반송할 수 있다([[상대적]] 불가침)."}, {"id": "k27_261021_15_4", "y": "27", "t": "영사관원은 신체불가침을 향유하나 [[중죄]]를 범하고 관할법원의 결정이 있는 경우 미결구금할 수 있다."}, {"id": "k27_261021_15_5", "y": "27", "t": "재판관할권 면제에 대한 포기는 [[강제집행]]으로부터의 면제의 포기를 포함하지 않는다."}, {"id": "k27_261021_15_6", "y": "27", "t": "영사관원 또는 사무직원의 [[직무]] 수행 행위에 대한 면제는 기한의 제한없이 존속한다."}, {"id": "k27_261021_15_7", "y": "27", "t": "Bigelow v. Princess Zizianoff 사건에서 파리 항소재판소는 [[비자발급]] 거부행위에 대해서는 재판관할권이 없지만, 그 뒤에 행해진 [[명예훼손]]에 대해서는 재판관할권을 가진다고 판결하였다."}, {"id": "k27_261021_15_8", "y": "27", "t": "특별사절단의 구성원은 공적 직무 밖에서의 자동차사용으로부터 야기된 손해배상청구소송에 대해서는 면제를 향유하지 못한다.", "a": "O"}, {"id": "k27_261021_15_9", "y": "27", "t": "뉴질랜드 항소재판소는 L.v. The Crown에서 [[여권발급]]행위는 협약 제5조(d)에 영사직무의 하나로 언급되고 있음에도 불구하고 여권을 발급받기 위해 자신을 찾아온 사람에게 성적 가해행위를 한 혐의로 기소된 한 영사에게 면제를 인정하지 않았다."}]}}, {"ch": "i311", "chname": "국가승계", "sec": {"id": "k27s_261022_16", "title": "승계 (10.22)", "note": "승계파트는 최근 지속적으로 출제되고 있습니다. 78년조약, 83년 조약 내용을 세심하게 정리해야 합니다. 그리고 구유고, 독일, 소련의 사례도 출제되기 시작했습니다. 가브치코보-나기마로스사건과 같이 승계와 관련된 판례도 출제됩니다. 조약, 판례, 사례 모두 빠짐없이 정리해야 합니다. 준킬러문항으로 나오는 파트여서 정답을 맞춘 경우 합격확률이 상당히 높아지게 됩니다.", "items": [{"id": "k27_261022_16_0", "y": "27", "t": "구 유고 사회주의 연방공화국은 여러 개의 국가로 [[분열]]된 사례이다. 분열 이후 어느 국가도 구 유고 연방의 계속으로 인정되지 않아 모두 새로이 UN에 가입했다."}, {"id": "k27_261022_16_1", "y": "27", "t": "「국가승계에 관련된 자연인의 국적」(2000)에 의하면, 하나의 국가가 복수의 국가로 해체되는 경우 원칙적으로 개인의 국적 선택권이 존중되어야 하며, 그러한 의사가 표시되지 않는 경우 [[상거소지]]국(state of habitual residence)의 국적이 부여된다."}, {"id": "k27_261022_16_2", "y": "27", "t": "1983년 국가재산·문서·채무승계협약에 의하면, 신생독립의 경우 전임국가의 [[부채/채무]]는 신생독립국에 이전되지 않는다."}, {"id": "k27_261022_16_3", "y": "27", "t": "1983년 국가재산·문서·채무승계협약에 의하면, 분리독립의 경우 전임국가의 부채는 [[형평한 비율]]로 신국가에 이전된다."}, {"id": "k27_261022_16_4", "y": "27", "t": "ICJ에 의하면 국가승계시 기존 경계선을 존중할 국제관습법상 의무가 있다.", "a": "O"}, {"id": "k27_261022_16_5", "y": "27", "t": "헝가리와 체코슬로바키아가 체결한 1977년 조약(부다페스트협정)은 [[처분적]] 조약이므로 슬로바키아가 승계할 의무가 있다."}, {"id": "k27_261022_16_6", "y": "27", "t": "1978년 조약승계협약에 의하면, 영토 일부 이전의 경우 [[조약국경이동]]원칙이 적용된다."}, {"id": "k27_261022_16_7", "y": "27", "t": "1978년 조약승계협약에 의하면, 신생독립국의 경우 [[백지출발]]주의가 원칙이다(승계 의무 없음)."}, {"id": "k27_261022_16_8", "y": "27", "t": "제노사이드협약 적용 사건(ICJ)에서 인권조약의 자동승계 여부가 문제되었으며, 다수의견은 이에 대한 구체적 규범이 부존재하므로 자동승계가 인정되지 않는다고 하였다.", "a": "X"}, {"id": "k27_261022_16_9", "y": "27", "t": "발트 3국은 [[회귀/복귀]]이론(Restoration Doctrine)에 따라 구소련이 체결한 조약의 효력을 부인하고, 병합되기 이전 조약의 효력이 지속된다고 보았다."}]}}, {"ch": "i428", "chname": "개인", "sec": {"id": "k27s_261023_17", "title": "국민·국적 (10.23)", "note": "국민과 국적파트에서는 특히 우리나라 국적법을 세심하게 공부해야 합니다. 출제되는 논점은 단순하지만 언제든 깊어질 수 있으므로 기본서나 요약집의 논점들을 철저하게 암기해야 합니다. 노테봄사건, 바르셀로나트랙션사건은 거의 매년 출제되는 기본판례이며, 최근에는 아마두 사디오 디알로 사건이 출제되기 시작했습니다.", "items": [{"id": "k27_261023_17_0", "y": "27", "t": "국적부여는 국내문제이나 타국에 대해 [[실효적]]으로 기능하기 위해서는 국제법상 요건을 충족해야 한다."}, {"id": "k27_261023_17_1", "y": "27", "t": "여성차별철폐협약은 [[부모양계]]혈통주의를 규정하고 있다."}, {"id": "k27_261023_17_2", "y": "27", "t": "우리나라는 [[부모양계]]혈통주의 및 부부국적[[독립]]주의를 채용하고 있다."}, {"id": "k27_261023_17_3", "y": "27", "t": "노테봄사건에서 국제사법재판소는 국적이 타국에 대해 [[대항력]]을 갖기 위해서는 ‘진정한 관련성’을 요건으로 한다고 판시하였다."}, {"id": "k27_261023_17_4", "y": "27", "t": "ILC외교보호초안은 자연인의 국적과 관련하여 [[진정한 관련성]] 규정을 두지 않았다."}, {"id": "k27_261023_17_5", "y": "27", "t": "ICJ에 의하면 법인의 국적은 [[설립지]]국 또는 [[본점소재지]]국이다."}, {"id": "k27_261023_17_6", "y": "27", "t": "ILC외교보호초안에 의하면 [[설립지]]국이 일차적 국적국이다."}, {"id": "k27_261023_17_7", "y": "27", "t": "ICJ에 의하면 [[법인]]의 국적에 있어서 설립지국과의 진정한 관련성은 요구되지 않는다고 하였다."}, {"id": "k27_261023_17_8", "y": "27", "t": "아마두 사디오 디알로 사건(2007)에서 ICJ는 주주로서의 권리침해에 대해 [[주주]]의 국적국이 보호권을 발동할 수 있으며, 또한 주주와 다른 국적을 가진 회사의 권리를 침해한 부분에 대해서는 주주의 국적국이 외교적 보호권을 행사할 수 없다고 하였다."}, {"id": "k27_261023_17_9", "y": "27", "t": "우리나라 대법원은 한일 청구권 협정에도 불구하고 징용 피해자인 개인은 여전히 손해배상 청구권을 행사할 수 있다고 하였다.", "a": "O"}]}}, {"ch": "i428", "chname": "개인", "sec": {"id": "k27s_261026_18", "title": "외국인 (10.26)", "note": "외국인파트는 출입국관리, 권리의무 등이 주로 출제되고, 외국인 추방도 빈번하게 출제되고 있습니다. 각론으로는 국유화, 범죄인인도가 주로 출제됩니다. 투자보호는 빈도가 낮긴 하지만 국제투자분쟁해결센터(ICSID)가 간헐적으로 출제됩니다.", "items": [{"id": "k27_261026_18_0", "y": "27", "t": "North American Dredging Company 사건(1926)에서 미국·멕시코 일반청구위원회는 [[칼보]]조항에 따른 멕시코 국내구제절차를 이용하지 않은 회사의 청구를 각하하였다."}, {"id": "k27_261026_18_1", "y": "27", "t": "Chahal v. United Kingdom 사건(1996)에서 유럽인권재판소는 국가안보상 [[추방]]의 필요성이 있더라도 송환국에서 고문이나 비인도적 대우를 받을 실질적 위험이 있다면 [[추방]]할 수 없다고 판단하였다."}, {"id": "k27_261026_18_2", "y": "27", "t": "국제관습법상 국가는 원칙적으로 외국인의 입국을 허용할 일반적 의무를 부담하지 않지만, [[조약]]을 통하여 출입국에 관한 의무를 부담할 수 있다."}, {"id": "k27_261026_18_3", "y": "27", "t": "외국인은 본국의 [[속인]]적 관할권과 체류국의 [[속지]]적 관할권에 의한 이중적인 지배를 받는다."}, {"id": "k27_261026_18_4", "y": "27", "t": "외국인에게는 일반적으로 [[사법]]상 권리가 인정되지만, 참정권 등 일부 공법상 권리는 제한될 수 있다."}, {"id": "k27_261026_18_5", "y": "27", "t": "체류국은 외국인의 생명과 재산 등을 보호하기 위하여 상당한 [[주의]]의무를 부담하며, 실효적인 행정적·사법적 구제수단을 제공해야 한다."}, {"id": "k27_261026_18_6", "y": "27", "t": "[[칼보독트린]]은 외국인이 체류국 국민과 동일한 보호를 받을 수 있지만 내국인보다 우월한 보호를 요구할 수는 없다는 입장이다."}, {"id": "k27_261026_18_7", "y": "27", "t": "국가는 [[영역주권]]에 기초하여 외국인을 추방할 수 있지만, 추방권은 자의적으로 행사되어서는 안 되며 정당한 사유와 적법한 절차가 요구된다."}, {"id": "k27_261026_18_8", "y": "27", "t": "시민적·정치적 권리에 관한 국제규약 제13조는 합법적으로 체류하는 외국인의 추방에 대해 원칙적으로 자기변호 및 재심사의 기회를 보장하되, [[국가안보]]상 불가피한 사유가 있는 경우 예외를 인정한다."}, {"id": "k27_261026_18_9", "y": "27", "t": "난민협약 제33조의 강제송환금지원칙에 의하면 체약국은 원칙적으로 난민의 [[생명]]이나 자유가 위협받을 우려가 있는 영역으로 난민을 추방하거나 송환해서는 안 된다."}]}}, {"ch": "i428", "chname": "개인", "sec": {"id": "k27s_261027_19", "title": "국유화 (10.27)", "note": "외국인 관련 법적 쟁점에서는 국유화, 범죄인인도의 출제 비중이 높습니다. 국유화의 경우 요건이 출제되는데, 보상이나 분쟁해결절차와 관련하여 수용을 주로 하는 개도국과 수용을 당하는 선진국의 입장차가 크기 때문에 이와 관련된 논점이 주로 출제됩니다. 특히 개도국의 입장을 반영한 것이 UN총회결의이고, 60년대와 70년대 입장 차가 크기 때문에 이 부분이 많이 출제되고 다소 어렵게 출제됩니다. 따라서 고득점을 위해서는 유엔총회 결의의 내용을 잘 체크하셔야 합니다.", "items": [{"id": "k27_261027_19_0", "y": "27", "t": "LIAMCO v. Libya 사건에서 중재인은 국유화의 합법성을 위해 [[??]] 요건이 반드시 필수적인 것은 아니라는 견해를 제시하였다."}, {"id": "k27_261027_19_1", "y": "27", "t": "Amoco International Finance Corporation v. Iran 사건에서 이란·미국 청구재판소는 수용의 공공목적에 대한 확립된 정의가 없으므로, 계약상의 의무를 회피하는 것만이 유일한 목적이라 하더라도 적법한 수용으로 볼 수 있다고 판단하였다.", "a": "??"}, {"id": "k27_261027_19_2", "y": "27", "t": "외국인 재산의 국유화 대상에는 유형재산뿐 아니라 지적재산권이나 국가계약에서 발생하는 재산적 권리 등 [[??]]도 포함될 수 있다."}, {"id": "k27_261027_19_3", "y": "27", "t": "[[??]]수용이란 재산의 법적 소유권을 이전하지 않으면서도 국가의 조치로 실질적인 재산권의 박탈이 발생하는 것으로서 [[??]]수용과 마찬가지로 수용의 적법성 요건이 문제된다."}, {"id": "k27_261027_19_4", "y": "27", "t": "외국인 재산의 국유화는 일반적으로 공익목적, [[??]] 및 보상 등의 요건을 충족해야 적법한 것으로 인정된다."}, {"id": "k27_261027_19_5", "y": "27", "t": "[[??]]에 의하면 외국인 재산의 국유화에는 신속하고 충분하며 실효적인 보상(prompt, adequate and effective compensation)이 요구된다."}, {"id": "k27_261027_19_6", "y": "27", "t": "1962년 유엔총회의 천연자원에 대한 영구주권결의 제1803호는 국유화와 수용의 권리를 인정하면서 적절한 보상에 관하여 국내법과 [[??]]에 대한 고려를 규정하였다."}, {"id": "k27_261027_19_7", "y": "27", "t": "1973년 유엔총회의 천연자원에 대한 영구주권결의 제3171호는 국유화의 경우 보상액과 지급방법을 결정할 [[??]]의 권리를 강조하였다."}, {"id": "k27_261027_19_8", "y": "27", "t": "1974년 국가의 경제적 권리의무헌장은 외국인 재산의 국유화에 관한 보상분쟁을 당사자가 달리 합의하지 않는 한 원칙적으로 [[??]]국 국내법과 국내법원에 따라 해결하도록 규정하였다."}, {"id": "k27_261027_19_9", "y": "27", "t": "외국인 재산의 국유화에 대한 보상기준과 관련하여 선진국들은 전통적으로 [[??]]을 지지한 반면, 개발도상국들은 수용국의 국내법과 관련 사정을 고려한 적절한 보상을 강조하였다."}]}}]},{"id":"fd26-1028","fd":{"i4":"2026-01-31","i5":"2026-01-31","i6":"2026-01-31","i7":"2026-01-31","i8":"2026-01-31","i9":"2026-01-31","i10":"2026-01-31","i11":"2026-01-31","i12":"2026-01-31","i13":"2026-01-31","i16":"2026-04-04","i19":"2025-12-06","i20":"2026-04-07","i21":"2026-04-07","i22":"2026-03-10","i23":"2025-12-06","i24":"2026-04-07","i25":"2025-12-06","i26":"2026-04-07","i27":"2026-03-10","i28":"2026-04-07","i29":"2026-03-10","i30":"2026-03-10","i31":"2026-03-10","i32":"2026-03-10","i33":"2026-03-10","i34":"2026-03-10","
