eorge Washington 은 [[프랑스]]의 지원과 1783년 [[파리]]조약 체결을 바탕으로 신생 미국의 외교적 기반을 구축하였다."},{"id":"i1149","t":"1793년 George Washington 대통령은 프랑스 혁명전쟁 속에서 중립선언(Proclamation of Neutrality)을 발표하여 유럽 분쟁에 개입하지 않는 초기 미국 외교의 [[고립주의]] 노선을 제시하였다."},{"id":"i1150","t":"[[1823]]년 James Monroe 대통령은 유럽 열강의 아메리카 대륙 재식민지화를 반대하고 미국의 유럽 문제 불개입을 선언한 ‘먼로 독트린(Monroe Doctrine)’을 발표하였다."},{"id":"i1151","t":"1845년 James K. Polk 대통령은 ‘[[명백한 숙명(Manifest Destiny)]]’ 사상을 바탕으로 Republic of Texas 를 병합하며 북미 대륙 확장정책을 적극 추진하였고, 텍사스는 같은 해 미국에 정식 편입되었다."},{"id":"i1152","t":"1846년부터 1848년까지 James K. Polk 대통령 시기 미국은 Mexican–American War 에서 승리한 뒤 1848년 [[과달루페 이달고 조약 (Treaty of Guadalupe Hidalgo)]] 을 통해 캘리포니아·뉴멕시코 등 광대한 영토를 획득하며 태평양까지 세력을 확대하였다."},{"id":"i1153","t":"1853년 Millard Fillmore 대통령의 지시를 받은 Matthew C. Perry 제독은 흑선 함대를 이끌고 Japan 에 개항을 요구하였으며, 이후 1854년 [[Franklin Pierce]] 대통령 시기 미·일 화친조약(가나가와 조약)이 체결되면서 일본의 개국이 본격화되었다."},{"id":"i1154","t":"[[1861]]년부터 [[1865]]년까지 Abraham Lincoln 대통령 시기 발생한 American Civil War 동안 미국은 United Kingdom 과 France 의 남부연합 승인 가능성을 저지하는 외교를 전개하였으며, 북군 승리 이후 국가 통합과 산업국가화가 가속화되었다."},{"id":"i1155","t":"1867년 Andrew Johnson 행정부에서 국무장관 William H. Seward 는 Russian Empire 로부터 [[알래스카]]를 매입하여 미국의 북태평양 전략 거점을 확보하였고, [[알래스카]]는 같은 해 미국에 공식 인도되었다."},{"id":"i1156","t":"1898년 [[William McKinley]] 대통령 시기 미국은 Spanish–American War 에서 승리한 뒤 같은 해 체결된 [[파리]]조약을 통해 필리핀·괌·푸에르토리코를 확보하고 쿠바에 영향력을 행사하면서 해외 팽창정책과 제국주의 노선을 본격화하였다."},{"id":"i1157","t":"1899년 [[William McKinley]] 행정부는 청에 대한 열강의 분할을 견제하기 위해 제1차 ‘문호개방정책(Open Door Policy)’을 제안하여 중국 시장에서의 기회균등과 영토보전을 주장하였으며, 1900년 의화단 사건 이후 이를 다시 강조하였다."}]},{"id":"i1158","title":"미국의 동맹체계","note":"최근 미국의 대외정책에서는 일부 전통적 동맹국에 대해 강한 압박이나 경제적 강경조치가 나타나면서 동맹 체제의 긴장 가능성이 언급되고 있다. 예를 들어 미국은 North Atlantic Treaty Organization회원국들에 대해 방위비 분담 확대와 국방비 지출 증가를 지속적으로 요구해 왔으며, 특히 덴마크의 자치령인 Greenland을 둘러싸고 미국이 전략적 중요성을 강조하며 구매 가능성까지 언급했던 사례가 동맹 간 긴장 요인으로 지적된 바 있다. 또한 미국은 Canada와도 철강·알루미늄 관세 및 무역 갈등 등 경제적 압박을 가한 적이 있으며, 이러한 조치들은 동맹국 사이에서도 정책 갈등이 발생할 수 있음을 보여주는 사례로 평가된다. 미국은 여전히 North Atlantic Treaty Organization과 같은 기존 동맹 구조를 공식적으로 유지하고 있고, 군사적 협력과 집단방위 체제 자체가 해체 단계에 들어갔다는 공식적인 결정이나 제도적 변화는 현재까지 나타나지 않았다. 그러나, 미국의 이러한 일방주의 정책이 계속되는 경우 미국의 동맹체계가 약화되거나 와해될 가능성도 있을 것이다.","items":[{"id":"i1159","t":"미주상호원조조약(Inter-American Treaty of Reciprocal Assistance, Rio Treaty) ([[1947]]–현재): 1947년 브라질 리우데자네이루에서 미국과 중남미 국가들이 체결한 집단방위 조약으로, 서반구에서 어느 한 국가에 대한 무력공격을 전체 국가에 대한 공격으로 간주하여 공동 대응하도록 규정한 미주 집단안보 체제의 핵심 조약이다."},{"id":"i1160","t":"북대서양조약기구(NATO) (1949–현재): 1949년 미국·캐나다와 서유럽 국가들이 소련 견제를 목적으로 체결한 집단방위 동맹으로, 북대서양조약 제[[5]]조에서 어느 한 회원국에 대한 무력공격을 전체 회원국에 대한 공격으로 간주하는 집단방위 원칙을 규정하고 있다."},{"id":"i1161","t":"ANZUS 조약(Australia–New Zealand–United States Security Treaty) (1951 체결 / 1952 발효–현재): 미국·호주·뉴질랜드가 태평양 지역 안보 협력을 위해 체결한 군사동맹으로, 1984년 [[뉴질랜드]]가 핵무기 반입을 금지하는 정책을 채택한 이후 미국이 [[뉴질랜드]]에 대한 동맹 의무 적용을 사실상 중단하여 현재는 미국–[[호주]] 동맹 중심으로 작동하지만 조약 자체는 여전히 유효하다."},{"id":"i1162","t":"미국–필리핀 상호방위조약(Mutual Defense Treaty) ([[1951]] 체결 / 1952 발효–현재): 미국과 필리핀 간 상호방위를 규정한 조약으로, 태평양 지역에서 어느 한 당사국의 군대·공공선박·항공기에 대한 무력공격이 발생할 경우 공동 대응하도록 규정하고 있어 명확한 동맹으로 인정된다."},{"id":"i1163","t":"미국–일본 안전보장조약(U.S.–Japan Security Treaty) (1951 체결 / [[1960]] 개정–현재): 1951년 샌프란시스코 평화체제와 함께 체결된 이후 [[1960]]년 「미일상호협력 및 안전보장조약」으로 개정된 동맹으로, 일본 방위와 극동 지역 안정을 위해 미군의 일본 주둔과 양국 간 안보 협력을 규정하고 있다."},{"id":"i1164","t":"미국–한국 상호방위조약 (1953 체결 / [[1954]] 발효–현재): 한국전쟁 직후 체결된 조약으로 한반도에서 어느 한 당사국에 대한 무력공격이 발생할 경우 공동 대응하도록 규정한 미국의 핵심 아시아 동맹 가운데 하나이다."},{"id":"i1165","t":"동남아시아조약기구(SEATO) (1954–1977): 미국·영국·프랑스·호주·뉴질랜드·파키스탄·태국·필리핀이 참여하여 공산주의 확산을 억제하기 위해 설립된 동남아시아 집단방위 동맹으로, [[베트남]]전쟁 이후 기능이 약화되어 1977년에 해체되었다."},{"id":"i1166","t":"미국–대만 상호방위조약(U.S.–ROC Mutual Defense Treaty) (1954 체결/1955 발효–1980 종료): 미국과 중화민국 사이에 체결된 동맹으로 중국의 군사적 위협에 대응하기 위해 대만 방위를 규정하였으나, [[1979]]년 미국과 중국이 수교하면서 공식적으로 종료되었다."},{"id":"i1167","t":"[[바그다드]]조약 (1955–1959): 터키·이라크·영국·이란·파키스탄이 중동 지역에서 소련의 영향력 확대를 억제하기 위해 체결한 반공 군사동맹으로, 미국은 정식 회원국은 아니었지만 군사·경제적으로 깊이 관여하였다."},{"id":"i1168","t":"중앙조약기구(CENTO, Central Treaty Organization) (1959–1979): 1959년 이라크가 탈퇴한 이후 바그다드 조약이 개편되어 형성된 중동 군사동맹으로 터키·[[이란]]·파키스탄·영국이 회원국이었으며 미국은 정식 회원국은 아니었지만 핵심 후원국으로 참여하였고, 1979년 [[이란]] 혁명 이후 해체되었다."}]},{"id":"i1169","title":"미국 관세·무역 법률 ①","note":"도널드 트럼프 미국 대통령은 덴마크 자치령인 그린란드에 대한 소유권 또는 통제권을 주장하면서 이를 둘러싼 외교·안보 갈등 속에서 NATO 회원국들과 유럽 동맹국들을 압박하기 위해 관세 카드를 꺼내 들었다. 트럼프는 소셜미디어를 통해 덴마크를 포함한 노르웨이·스웨덴·프랑스·독일·영국·네덜란드·핀란드 등 8개 유럽 국가들이 그린란드에 병력을 배치했거나 배치하기로 한 결정을 철회하지 않는 한, 해당 국가들의 대미 수출품에 대해 2월 1일부터 10%의 관세를 부과하고, 6월 1일부터는 이를 25%로 인상하겠다고 위협하였다. 이러한 관세 위협은 그린란드를 미국이 완전하게 인수하는 합의가 이뤄질 때까지 유지되며, 트럼프는 이를 “안보·국가이익을 위한 경제 압박 수단”이라고 설명했지만, NATO 동맹국을 겨냥한 강경 조치로 대서양 동맹과 미국–유럽 통상·안보 관계를 시험하는 외교·경제 갈등으로 비화하고 있다.","items":[{"id":"i1170","t":"관세법(Tariff Act of 1789, 1789년): 미국 최초의 연방 관세법으로, 연방정부 재정 확보를 위해 수입품에 관세를 부과하고 대외무역 통제 권한이 [[연방]]정부에 있음을 확립하였다."},{"id":"i1171","t":"1816년 관세법(Tariff of 1816, 1816년): 미영전쟁 이후 [[영국]]산 공산품 유입에 대응하여 미국 제조업 보호를 명시적 목표로 한 최초의 보호관세법이다."},{"id":"i1172","t":"모릴 관세법(Morrill Tariff, 1861년): [[남북]]전쟁 직전 제정되어 전쟁 재정 조달과 북부 산업 보호를 위해 관세를 대폭 인상하며 고율 보호관세 체제를 제도화하였다."},{"id":"i1173","t":"언더우드 관세법(Underwood Tariff Act, 1913년): 평균 관세율을 대폭 [[인하]]하고 연방 소득세를 도입하여 관세 중심 재정 구조에서 [[자유]]무역적 재정 구조로 전환하였다."},{"id":"i1174","t":"스무트–홀리 관세법(Smoot–Hawley Tariff Act, 1930년): 2만여 개 품목에 고율 관세를 부과하여 과세 대상 수입품 기준 평균 관세율이 약 [[59]]%에 달하였고, 각국의 보복 관세로 세계 무역 위축을 초래하였다."},{"id":"i1175","t":"상호무역협정법(Reciprocal Trade Agreements Act, 1934년): 대통령에게 의회의 추가 승인 없이 기존 관세율을 최대 [[50]]%까지 인하할 수 있는 권한을 부여하여 협상 기반 자유무역 체제로의 전환을 제도화하였다."},{"id":"i1176","t":"무역법(Trade Act of 1974, 1974년): 제201조(세이프가드)와 제301조(불공정무역 보복)를 도입하고, [[패스트 트랙(Fast Track)]]제도를 통해 의회가 대통령에게 무역협정 협상 권한을 사전 위임하되 협정 이행 법안은 수정 없이 찬반 표결만 허용하고 심의 기한을 제한하도록 하였다."},{"id":"i1177","t":"옴니버스 통상·경쟁력법(Omnibus Trade and Competitiveness Act, 1988년): 슈퍼 [[301]]조를 도입하여 불공정 무역국에 대한 공격적 보복을 제도화하고, 환율 문제를 통상정책과 연계하였다."},{"id":"i1178","t":"우루과이라운드 이행법(URAA, [[1994]]년): WTO 설립 협정과 우루과이라운드 합의를 미국 국내법으로 이행하여 다자무역체제에 대한 법적 구속을 승인하였다."},{"id":"i1179","t":"무역촉진권한법(TPA, Trade Promotion Authority, 최초 1974년 도입·이후 반복 갱신): 의회가 대통령에게 [[FTA]] 협상 권한을 위임하되 협정안에 대해 수정 없는 찬반 표결만 허용하는 신속 승인 절차를 규정한 제도이다."}]},{"id":"i1180","title":"미국 관세법 역사 ②","note":"최근 트럼프 행정부는 국제비상경제권한법(IEEPA)을 근거로 중국·캐나다·멕시코 등 주요 교역국에 광범위한 관세를 부과하였으나, 연방대법원은 IEEPA에는 대통령에게 일반적·포괄적 관세 부과 권한이 명시되어 있지 않다는 이유로 해당 조치를 위법으로 판단하였다. 이에 따라 해당 관세는 효력을 상실하였고, 이후 트럼프는 1974년 무역법(Trade Act of 1974) 제122조 등 다른 법적 근거를 활용하여 전 세계를 대상으로 한 일정 비율의 관세를 다시 부과하는 방식으로 대응하였다. 이 조치는 법률상 한시적 성격을 가지는 권한에 근거한 것으로, 대통령의 관세 부과 권한 범위와 의회의 통상권 통제 문제를 둘러싼 헌법적·법률적 논쟁을 다시 부각시키는 계기가 되었다.","items":[{"id":"i1181","t":"Tariff Act ([[1789]]): 미국 최초의 관세법으로 연방정부 재정 확보를 주목적으로 하면서 관세를 국가의 핵심 재원으로 확립하고 초기 산업보호 기조를 제도화하였다."},{"id":"i1182","t":"Tariff of 1816 (1816): 1812년 전쟁(미국·[[영국]] 전쟁)으로 [[영국]] 공산품 유입이 급증하자 이를 견제하고 전쟁 중 성장한 국내 제조업을 보호하기 위해 제정된 미국 최초의 본격적 보호관세법이다."},{"id":"i1183","t":"Tariff of Abominations (1828): 고율 보호관세에 반발한 사우스캐롤라이나가 연방법 [[무효]]화를 선언하는 이른바 ‘[[무효]]화 위기(Nullification Crisis)’를 촉발하여 연방과 주정부 간 갈등을 심화시킨 정치적 분수령이 된 법이다."},{"id":"i1184","t":"Morrill Tariff (1861): 남북전쟁(1861–[[1865]]) 직전 통과되어 고율 보호관세 체제를 강화하고 전쟁기 북부 산업 기반을 공고히 하며 이후 공화당 주도의 산업보호주의 체제를 확립한 법이다."},{"id":"i1185","t":"Wilson–Gorman Tariff Act (1894): 관세율 인하를 시도하면서 연방 소득세 도입을 포함하였으나 연방대법원의 위헌 판결([[Pollock]] 사건)로 소득세 조항이 무효화되어 관세 중심 재정체제의 한계를 드러낸 법이다."},{"id":"i1186","t":"Tariff Act of 1930 (Smoot–Hawley Tariff Act) (1930): 평균 약 [[40]]% 수준의 고율 관세를 부과하여 국제적 보복관세를 촉발하고 세계무역 위축을 심화시킨 대표적 보호주의 법이다."},{"id":"i1187","t":"Reciprocal Trade Agreements Act (1934): 대통령에게 외국과의 상호주의 협상에 따라 기존 관세율의 최대 [[50]]% 범위 내에서 인하할 수 있는 권한을 부여하여 의회 중심 보호주의 체제에서 행정부 중심 무역자유화 체제로 전환시킨 법이다."},{"id":"i1188","t":"Trade Expansion Act (1962): Section 232를 통해 국가[[안보]]를 이유로 대통령이 수입품에 관세를 부과할 수 있도록 규정하여 [[안보]]와 무역을 결합한 현대적 관세 권한의 근거를 마련한 법이다."},{"id":"i1189","t":"Trade Act (1974): Section [[301]]을 포함하여 외국의 불공정무역관행에 대응한 보복관세 부과 권한을 규정함으로써 현대 무역분쟁의 핵심 법적 근거가 된 법이다."},{"id":"i1190","t":"Uruguay Round Agreements Act ([[1994]]): WTO 체제 출범에 맞추어 미국 관세법을 정비하고 관세율표(HTSUS)를 현대화하여 다자무역체제와 국내 관세제도를 연결한 법이다."}]},{"id":"i1191","title":"바이든 행정부의 대외정책","note":"","items":[{"id":"i1192","t":"[[2021]]년 1월 바이든 행정부는 취임 직후 파리기후협정에 재가입하여 미국의 국제 기후 리더십 복원을 선언했다."},{"id":"i1193","t":"2021년 8월 아프가니스탄 철군은 미국–탈레반 간 [[도하]] 합의(2020)에 따른 단계적 철수 계획을 이행한 것이었으나 철군 직후 카불이 급속히 함락되어 혼란이 발생했다."},{"id":"i1194","t":"2021년 9월 미국은 영국·[[호주]]와 함께 AUKUS 안보동맹을 출범해 호주에 핵추진 잠수함 기술을 제공하기로 합의했다."},{"id":"i1195","t":"2021년 12월 미국은 [[중국]]·러시아 등 권위주의 확산을 견제하기 위해 110여 개국이 참여한 민주주의정상회의(Summit for Democracy)를 화상으로 개최하여 부패 방지·인권 수호·선거제도 강화를 주요 의제로 제시했다."},{"id":"i1196","t":"[[2022]]년 2월 러시아의 우크라이나 침공 이후 미국은 대규모 군사·재정 지원과 강력한 대러 제재를 시행했다."},{"id":"i1197","t":"2022년 [[5]]월 미국은 인도·태평양 지역의 공급망·무역 규범 협력을 목표로 IPEF(인도태평양경제프레임워크) 출범을 주도했다."},{"id":"i1198","t":"2022년 8월 미국은 반도체 공급망 강화와 기술 패권 경쟁을 위해 CHIPS and Science Act를 제정하며, 보조금 수령 기업의 중국·러시아·이란·북한 등 우려국에서의 생산 확대를 금지하고 [[한국]]·일본·대만 등과 공급망 협력을 강화했다."},{"id":"i1199","t":"2023년 4월 미국·한국 정상은 [[워싱턴]]선언을 채택하여 확장억제 강화와 핵협의그룹(NCG) 창설을 합의했다."},{"id":"i1200","t":"2023년 8월 [[캠프 데이비드]] 정상회의에서 미국·한국·일본은 3국 안보협력의 제도화(연례 정상회의·즉각적 정보 공유 등)를 공식화하고, 한국과 일본이 NPT 체제에서 비핵보유국 지위를 유지함을 재확인했다."},{"id":"i1201","t":"2023년 10월 이후 미국은 이스라엘–하마스 전쟁에서 [[이스라엘]]을 지지했다."}]},{"id":"i1202","title":"트럼프 행정부 국가안보전략보고서(NSS, 2025)","note":"(National Security Strategy)(2025.12.04.)\nNSS는 National Security Strategy(국가안보전략)의 약자로, 미국 대통령이 골드워터-니콜스 국방개혁법(1986)에 따라 정기적으로 의회에 제출하는 최고위 국가안보·대외정책 기본전략 문서를 의미하며, 미국이 추구하는 국가이익, 우선순위, 위협 인식, 동맹 및 경제·군사 전략을 종합적으로 규정해 미국 외교·안보 정책의 설계도 역할을 한다. NSS는 국방전략(NDS), 군사전략(NMS), 정보전략(NIS) 등 하위 전략 문서들의 기초가 되기 때문에 정권별 세계관이 직접적으로 반영되며, 어떤 지역과 국가를 전략적 중심에 두는지, 동맹에게 어떤 부담을 요구하는지, 군사력, 경제력, 기술, 공급망을 어떻게 활용할지를 전 세계가 판단하는 기준 문서로 기능한다. 금번 트럼프 행정부 2기 NSS는 무역안보화, 서반구 중심 본토방어, 인도 태평양 억제라는 세 가지 축을 중심으로 재편되었으며, 중국을 종합적 전략경쟁자로 규정하고 대만 억제와 동맹국의 분담증대를 강조한 점에서 이전 정부들과 구별되는 강한 미국 우선주의적 성격을 보여준다.","items":[{"id":"i1203","t":"트럼프 2기 행정부는 2025년 국가안보전략서(NSS)를 발표하며 혼재된 외교안보 행보를 일관된 전략체계로 정리했다."},{"id":"i1204","t":"전략의 중심축은 무역안보화·서반구 중심 본토방어·인도-태평양 억제라는 3대 축으로 재구조화되었다. 무역안보화란 무역을 단순한 경제활동이 아니라 국가안보의 핵심 요소로 간주하여 관세·공급망·기술표준·투자 규제를 전략적 도구로 활용하고, 중국 등 경쟁국이 미국 경제를 압박할 수 있는 구조를 사전에 차단함으로써 미국의 장기적 경제·안보 우위를 확보하려는 정책 방향을 의미한다."},{"id":"i1205","t":"미국은 중국을 군사·경제·기술·표준 전 영역에서 미국의 장기 전략적 우위를 잠식하는 종합적 위협으로 규정하며, 기존의 개방을 통한 변화 전략이 실패했음을 공식화했다."},{"id":"i1206","t":"대만은 반도체 공급망의 핵심 거점이자 제1도련선(중국의 해양 진출을 차단하는 미국·동맹국의 전방 해상 방어선)의 전략적 거점으로 재규정되었고, 미국은 중국의 대만 침공 억제를 최우선 목표로 삼으면서도 전략적 모호성을 유지했다."},{"id":"i1207","t":"미국은 동맹국들에게 국방비 증액·집단방어 참여·전력구조 기여를 요구하며, 인도-태평양 억제가 미국 단독이 아닌 동맹 공조로 이루어져야 한다는 조건을 명확히 했다."},{"id":"i1208","t":"미국은 서반구(미 대륙)를 최우선 지역으로 규정하며 트럼프 코롤러리를 제시해 역외 개입 축소와 미국 대륙 세력권 강화라는 먼로 독트린 2.0을 천명했다."},{"id":"i1209","t":"한국은 문건에서 북한보다 더 많이 언급되며, 제1도련선 핵심 동맹으로서 군사비 증액·미군 역외 임무 지원·기지 접근권 확대 등 구조적 기대가 드러났다."},{"id":"i1210","t":"미국은 한국이 대만 유사시 직접 전투 참여까지 맡을 것을 요구하지는 않지만, 서태평양 평화·안정 유지에 기여하는 구조적 역할 확대를 분명히 시사했다."},{"id":"i1211","t":"한국의 미군기지와 인프라가 향후 대중국 억제용 역외 임무 허브로 활용될 가능성이 언급되며, 이는 한미동맹 현대화가 자국방어에서 역내 공동안보로 진화하는 기반이 된다."},{"id":"i1212","t":"이번 전략에서 북한 비핵화 언급이 사라진 것은 대북정책 우선순위 하락을 의미한다."}]},{"id":"i1213","title":"미국 2026 국방전략서(NDS)","note":"미국 국방부가 공개한 2026 국방전략서(NDS)를 두고, 한미동맹이 한국의 책임 확대와 미국의 선택적 개입을 축으로 한 새로운 국면에 접어들었다는 평가가 미국 내에서 나왔다.미국 싱크탱크 스팀슨센터의 제임스 김 한국 프로그램 국장은 25일(현지시간) 최근 발표된 NDS 분석 자료를 통해 “이번 전략은 한국이 북한 억제의 주도적 역할을 맡고, 미국은 보다 제한적인 군사 지원을 제공하는 비대칭적 동맹 구조로의 전환을 시사한다”고 밝혔다.김 국장은 “미국은 선택적 관여라는 보다 광범위한 전략 아래 역내 군사적 역할을 조정하려 하고 있으며, 그 과정에서 한국이 더 큰 안보 책임을 요구받고 있다”며 “이는 70년 역사의 한미동맹이 중대한 전환점에 이르렀음을 의미한다”고 진단했다.또 미국의 전략적 우선순위 재조정도 한미동맹에 영향을 미칠 수 있다고 분석했다. 김 국장은 “트럼프 행정부가 미국 본토와 서반구 안보를 최우선 과제로 설정하면서, 서반구 외 지역에 대한 개입이 제한될 가능성이 커졌다”며 “이 흐름은 장기적으로 주한미군의 역할과 규모 논의로 이어질 수 있다”고 말했다.NDS가 ‘거부에 의한 억제(deterrence by denial)’ 강화를 인도·태평양 전략의 핵심으로 제시한 점과 관련해서는, 한국의 대중 외교와 서해 안보 환경에도 파급 효과가 있을 수 있다고 덧붙였다.(출처:뉴시안)","items":[{"id":"i1214","t":"2026년 1월 23일, 미국 국방부는 향후 군사력 운용 방향과 위협 인식을 제시하는 2026 National Defense Strategy(NDS)를 공식 발표하였다."},{"id":"i1215","t":"동 전략은 미국 [[본토 방어(Homeland Defense)]]를 국방정책의 최우선 과제로 설정하여 해외 개입보다 국내 안보 보호를 우선순위에 두었다."},{"id":"i1216","t":"[[중국]]은 여전히 미국에 대한 가장 중대한 장기적 전략경쟁자(pacing challenge)로 규정되었으며, 인도-태평양 억제가 핵심 축으로 유지되었다."},{"id":"i1217","t":"대중 전략은 승리나 정복이 아니라 중국이 미국과 [[동맹]]을 지배하지 못하도록 하는 거부에 의한 억지(거부적 억지)(deterrence by denial) 중심 접근을 채택하였다."},{"id":"i1218","t":"미국은 동맹과 파트너의 부담분담(burden-sharing) 확대와 자주적 방위역량 강화를 명시하며 안보 책임을 분산시키려는 기조를 분명히 하였다."},{"id":"i1219","t":"유럽 지역에서는 러시아 위협 대응의 주된 책임을 NATO와 유럽 동맹에 맡기고 미국의 직접 개입 비중을 상대적으로 [[축소]]하는 방향을 제시하였다."},{"id":"i1220","t":"한반도와 관련하여 북한 억제에서 [[한국]]의 주도적 역할 확대가 강조되었으며, 미국은 지원·보완적 역할을 수행하는 구조가 제시되었다."},{"id":"i1221","t":"전략은 첨단기술(AI, 무인체계, 미사일방어, 산업기반 강화)을 통한 군사력 현대화와 방위산업 생산능력 확대를 핵심 수단으로 제시하였다."},{"id":"i1222","t":"중동 등 기타 지역에서는 대규모 상시 주둔보다 선택적·유연한 전력 운용(flexible posture)을 통해 전략적 과잉개입을 줄이는 방침을 채택하였다."},{"id":"i1223","t":"전체적으로 2026 NDS는 글로벌 직접 주도에서 본토 방어·중국 억제·동맹 책임 분담 중심으로 전략 축을 이동시킨 문서로 평가된다."}]},{"id":"i1224","title":"탈냉전기 미국의 역외 군사개입 사례","note":"","items":[{"id":"i1225","t":"걸프전 (1991.1~1991.2): 안보리 결의 678호(1990)에 근거하여 이라크의 [[쿠웨이트]]침공에 대응하고 국제평화를 회복하기 위해 무력행사를 실시하였고 성공하였으며, 이후 휴전은 유엔 안보리 결의 687호(1991)에 의해 확정되었다."},{"id":"i1226","t":"이라크 비행금지구역 및 공습 (1991~2003): 명시적 승인 없이 결의 [[688]]호(1991) 등을 근거로 시행되었으며 부분 성공에 그쳤고, 별도의 포괄적 평화협정 없이 2003년 전쟁으로 이어졌다."},{"id":"i1227","t":"소말리아 개입 (1992~1994): 안보리 결의 [[794]]호(1992)에 근거하여 개입하였으나 실패하였고, 명확한 평화협정 없이 종료되었다."},{"id":"i1228","t":"[[아이티]] 개입 (1994~1995): 안보리 결의 940호(1994)에 근거하여 개입하였고 부분 성공에 그쳤으며, 이후 정치적 합의로 질서가 회복되었다."},{"id":"i1229","t":"보스니아 공습 (1995): 안보리 결의 816호·836호(1993)에 근거하여 공습을 실시하였고 성공하였으며, 분쟁은 [[데이튼]] 평화협정(1995)으로 종결되었다."},{"id":"i1230","t":"수단·아프가니스탄 공습 ([[1998]]): 안보리 승인 없이 공습이 이루어졌으며 부분 실패로 평가되고, 별도의 평화협정 없이 종료되었다."},{"id":"i1231","t":"코소보 공습 (1999): 안보리 승인 없이 공습이 이루어져 부분 성공에 그쳤으며, 이후 [[쿠마노보]] 군사기술협정(1999)과 안보리 결의 1244호(1999)를 통해 사태가 정리되었다."},{"id":"i1232","t":"아프가니스탄 전쟁 ([[2001]]~2021): 자위권에 기초한 개입으로 부분 실패로 평가되며, 정치적 재건은 본 협정(Bonn Agreement)(2001)으로 시작되었으나 최종 안정화에는 이르지 못하였다."},{"id":"i1233","t":"이라크 전쟁 (2003~2011): 침공 이후 정권 교체에는 성공했으나 부분 실패로 평가되며, 이후 미군 주둔은 미국-이라크 지위협정(SOFA, [[2008]]년) 등을 통해 정리되었다."},{"id":"i1234","t":"[[파키스탄]] 드론 공격 (2004~2018, 사실상 종료): 자위권을 근거로 수행되어 부분 성공에 그쳤으며, 별도의 평화협정 없이 점진적으로 종료되었다."},{"id":"i1235","t":"리비아 공습 (2011): 안보리 결의 1973호(2011)에 근거하여 민간인 보호를 위해 개입하였고 안보리 결의 1973호(2011)에 근거하여 민간인 보호를 위해 개입하였고 [[카다피]]정권 붕괴에는 성공하였으나 이후 국가 붕괴로 이어져 장기적으로는 실패로 평가된다."},{"id":"i1236","t":"시리아 공습 (2014): [[IS]] 격퇴 작전으로 부분 성공에 그쳤으며, 현재까지 포괄적 평화협정 없이 분쟁이 지속되고 있다."},{"id":"i1237","t":"이란( [[솔레이마니]] 제거) (2020): 단기 군사행동으로 부분 실패로 평가되며, 별도의 협정 없이 긴장 상태가 지속되었다."}]}]},{"id":"i1238","title":"미주·중남미","secs":[{"id":"i1239","title":"미국의 라틴아메리카 정책 사례","note":"도널드 트럼프 미국 대통령이 16일 베네수엘라 니콜라스 마두로 정권을 ‘외국 테러 단체’로 공식 지정하고, 베네수엘라를 오가는 제재 대상 유조선의 ‘완전한 봉쇄’를 명령했다. 최근 미국이 베네수엘라의 마약 선박을 격침하고 유조선을 나포한 데 이어, 해상 봉쇄까지 선언함에 따라 카리브해의 군사적 긴장이 최고조로 치닫고 있다. 트럼프가 언급한 봉쇄는 군함을 동원해 물리적으로 선박의 입출항을 막는 행위다. 국제법상 해상 봉쇄는 사실상의 ‘전쟁 행위’로 간주될 수도 있다. 트럼프는 봉쇄 대상을 ‘제재 대상’ 유조선으로 한정했다. 이들은 중국·쿠바 등으로 원유를 수출해 정권 자금줄 역할을 하는 ‘그림자 선단’으로 불린다. 미군의 포위로 다른 유조선들도 운항을 중단할 가능성이 높아, 마두로 정권에 상당한 경제적 압박으로 작용할 것으로 보인다. 트럼프는 마두로 정권을 끝내겠다는 의지를 지속 드러내고 있다. 과거 미국이 주도한 대표적인 해상 봉쇄 사례는 1962년 쿠바에 배치된 소련 핵미사일을 둘러싸고 핵전쟁 직전까지 갔던 ‘쿠바 미사일 위기’ 때다. 당시 존 F 케네디 대통령은 미사일 기지 완공을 막기 위해 쿠바 해역을 봉쇄했다. 하지만\n‘봉쇄(Blockade)’ 대신, ‘해상 격리(Quarantine)’라는 용어를 사용해 소련과 전면전을 피했다. 반면 이날 성명에서 트럼프는 ‘완전한 봉쇄’를 명시했다. 1990년 걸프전 때 이라크 봉쇄도 있다. 당시 미국은 다국적군과 함께 이라크로 들어가는 물자를 차단하는 ‘해상 차단 작전(MIO)’을 펼쳤다. 미 해군은 수만 척의 상선을 검문하고 수천 척의 진로를 변경시켰다.","items":[{"id":"i1240","t":"먼로 선언(Monroe Doctrine, [[1823]].12.02, 제임스 먼로): 미국은 미주 대륙에 대한 유럽 열강의 재식민화와 정치적 개입을 배제하겠다고 선언하며 서반구에 대한 배타적 영향권을 설정하였다."},{"id":"i1241","t":"명백한 숙명론(Manifest Destiny, 1840년대, 제임스 K. 포크): 미국은 영토 확장과 문명 전파를 신의 섭리로 인식하며 라틴아메리카에 대한 팽창주의적 개입을 정당화하였다."},{"id":"i1242","t":"미국–멕시코 전쟁(U.S.–Mexican War, 1846–1848, 제임스 K. 포크): 미국은 멕시코와의 전쟁을 통해 남서부 영토를 획득하며 무력 개입에 의한 세력 확장의 선례를 확립하였다."},{"id":"i1243","t":"스페인–미국 전쟁(Spanish–American War, 1898, 윌리엄 매킨리): 미국은 [[쿠바]] 독립을 명분으로 스페인을 격파하고 쿠바와 푸에르토리코에 대한 지배적 영향력을 확보하였다."},{"id":"i1244","t":"거장정책(Big Stick Policy, 1901–1909, 시어도어 루스벨트): 미국은 외교적 협상을 중시하되 [[군사]]력을 배경으로 중남미 국가들에 적극 개입하는 강경 패권 외교를 전개하였다."},{"id":"i1245","t":"루스벨트추론(Roosevelt Corollary, 1904, 시어도어 루스벨트): 미국은 중남미 국가의 정치·재정 불안을 이유로 선제적 개입권을 주장하며 ‘미주 국제경찰권’을 선언하였다."},{"id":"i1246","t":"선린정책(Good Neighbor Policy, 1933, [[프랭클린]] D. 루스벨트): 미국은 직접적인 군사개입을 자제하고 외교·경제적 수단을 통한 영향력 행사로 정책 기조를 전환하였다."},{"id":"i1247","t":"미주국가연합(OAS, 1948.04, 해리 S. 트루먼): 미국 주도로 미주 지역의 집단안보와 반공 협력을 제도화한 기구로 출범하였으며, [[쿠바]]는 1962년(존 F. 케네디 행정부 시기) 회원국 권리가 정지되었고, 2009년(버락 오바마 행정부 시기) 제재가 공식 해제되었으나, OAS를 미국 주도의 제국주의적 기구로 규정하며 2025년 현재까지도 복귀를 거부하고 있다."},{"id":"i1248","t":"쿠바 혁명(Cuban Revolution, 1959, 드와이트 D. 아이젠하워): 피델 카스트로의 집권과 사회주의 노선 채택으로 라틴아메리카에서 최초의 공산 정권이 성립하였다."},{"id":"i1249","t":"피그만 침공(Bay of Pigs Invasion, [[1961]]년, 존 F. 케네디): 미국은 망명 쿠바인을 지원해 카스트로 정권 전복을 시도했으나 실패하였다."},{"id":"i1250","t":"쿠바 미사일 위기(Cuban Missile Crisis, 1962.10, 존 F. 케네디): 소련 [[흐루쇼프]]의 쿠바 핵미사일 배치에 대응해 미국은 해상봉쇄를 단행하며 냉전 최대의 핵위기를 맞았다."},{"id":"i1251","t":"진보를 위한 동맹(Alliance for Progress, 1961, 존 F. 케네디): 미국은 개발원조와 사회개혁 지원을 통해 중남미에서 공산주의 확산을 억제하려 하였다."},{"id":"i1252","t":"존슨 독트린(Johnson Doctrine, 1965, 린든 B. 존슨): 미국은 서반구(라틴아메리카)에서 공산주의 정권의 수립을 결코 용인하지 않겠다는 원칙을 공식화하였다."},{"id":"i1253","t":"도미니카공화국 군사개입(Dominican Intervention, 1965, 린든 B. 존슨): 미국은 존슨 독트린에 따라 좌파 정권 수립 가능성을 차단하기 위해 무력 개입을 실시하였다."},{"id":"i1254","t":"칠레 쿠데타 지원(Chile Coup, 1973, 리처드 닉슨): 미국은 아옌데 사회주의 정부를 견제하기 위해 피노체트 군부 쿠데타를 간접 지원하였다."},{"id":"i1255","t":"콘도르 작전(Operation Condor, 1970년대, 리처드 닉슨–제럴드 포드): 미국은 남미 군사독재 정권들과 협력하여 좌파 정치세력과 반체제 인사 탄압을 지원·묵인하였다."},{"id":"i1256","t":"니카라과 콘트라 반군 지원(Nicaragua Contra Policy, 1981–1988, 로널드 레이건): 미국은 [[산디니스타]] 좌파 정권을 전복하기 위해 콘트라 반군을 지원하며 중미에서 강경한 반공 개입을 전개하였다."},{"id":"i1257","t":"이란–콘트라 사건(Iran–Contra Affair, 1985–1987, [[로널드 레이건]]대통령): 미국 행정부는 의회의 지원 금지에도 불구하고 이란 무기 판매 대금을 니카라과 콘트라 반군에 비밀 지원한 사실이 드러나 헌정 위기로 비화하였다."},{"id":"i1258","t":"파나마 침공(U.S. Invasion of Panama, 1989, 조지 H. W. 부시): 미국은 [[노리에가]] 정권을 무력으로 전복하며 냉전 말기에도 직접 군사개입을 단행하였다."},{"id":"i1259","t":"베네수엘라에 대한 미국의 압박 정책: 미국은 차베스·마두로 정권의 반미·사회주의 노선을 이유로 제재와 외교적 고립을 강화해 왔으며, 오바마 행정부는 2015년 베네수엘라를 ‘국가비상사태’ 대상으로 지정해 제재를 제도화했고, 트럼프는 1기 행정부(2017–2021)에서 이를 ‘최대 압박(maximum pressure)’ 전략으로 확대하여 석유·금융 제재, 마두로 정권 불인정, 과이도 임시대통령 인정 정책을 추진하였으며, 2024년 이후에도 트럼프는 대선 공약과 공개 발언을 통해 베네수엘라 [[마두로]] 정권을 범죄·마약·테러 연계 독재로 규정하고 제재 유지 및 강화 방침을 재확인하고 있다."}]},{"id":"i1260","title":"미국-쿠바 관계 주요 내용","note":"도널드 트럼프의 2기 행정부 들어 대쿠바 정책은 오바마 시기의 관여·정상화 노선을 사실상 폐기하고 압박과 봉쇄의 재강화로 전환되었으며, 구체적으로는 여행·송금 제한 확대, 제3국 기업까지 포함한 거래 차단, Cuba Restricted List 강화, 테러지원국 지정 유지 등을 통해 쿠바의 경제적 고립을 심화시키고 있다. 이러한 강경책의 배경에는 첫째, 쿠바의 사회주의 체제와 인권 문제에 대한 압박을 통해 체제 변화를 유도하려는 전략적 목적, 둘째, 베네수엘라 등 중남미 좌파 정권과의 연계를 차단하려는 지역 안보 고려, 셋째, 미국 내 반(反)쿠바 여론과 특히 플로리다 지역 쿠바계 유권자 정치의 영향, 넷째, 중국·러시아의 중남미 영향력 확대를 견제하려는 지정학적 계산이 결합되어 있어, 결국 트럼프 2기 대쿠바 정책은 이념·국내정치·지정학이 결합된 복합적 압박 전략으로 이해된다.","items":[{"id":"i1261","t":"스페인-미국 전쟁 (1898): 1898년 2월 아바나 항에서 미국 전함 [[메인호(USS Maine)]]이 폭발한 뒤 미국 내 반스페인 여론이 급격히 고조되었고, 같은 해 미국은 스페인과 전쟁을 벌여 승리함으로써 쿠바에 대한 지배적 영향력을 확보하였다."},{"id":"i1262","t":"[[Big Stick]] 정책 (1900년대 초): 시어도어 루스벨트는 중남미에서 미국의 질서유지와 이익보호를 명분으로 군사력과 압박외교를 적극 활용하였고, 이러한 노선은 쿠바·도미니카 문제와 파나마 운하 확보 과정에서 현실정책으로 나타났다."},{"id":"i1263","t":"미국-쿠바 관계조약 (1903): 1903년 조약은 플랫 수정조항의 내용을 조약 형태로 구체화한 것으로, 미국이 쿠바 내 질서·재정·독립 보장을 명분으로 개입할 수 있는 구조를 제도화하고 [[관타나모]] 해군기지 사용권도 확보하게 하였다."},{"id":"i1264","t":"[[선린(Good Neighbor)]] 정책 (1930년대): 프랭클린 D. 루스벨트는 비간섭과 주권존중을 전면에 내세워 종전의 직접 군사개입 노선을 수정하였고, 그 연장선에서 미국은 1934년 쿠바에 대한 공식 개입권을 철회하는 방향으로 관계를 재조정하였다."},{"id":"i1265","t":"쿠바 혁명 (1959): 피델 카스트로의 혁명으로 바티스타 정권이 무너진 뒤 쿠바는 토지개혁, 산업 국유화, 미국 자산 몰수 등을 추진하였고, 이 과정에서 미국과의 관계는 급속히 악화되며 쿠바는 [[소련]] 쪽으로 기울어 갔다."},{"id":"i1266","t":"피그스만 침공 (1961): [[케네디]] 행정부 시기 CIA의 지원을 받은 쿠바 망명군이 피그스만에 상륙해 카스트로 정권 전복을 시도했으나 실패하였고, 그 결과 쿠바는 미국을 직접적 위협으로 인식하며 소련 의존을 더욱 강화하였다."},{"id":"i1267","t":"쿠바 미사일 위기 ([[1962]] 년): 소련이 쿠바에 핵미사일을 배치하자 미국은 이를 중대한 안보위협으로 보고 해상 ‘격리’ 조치를 시행하였으며, 결국 소련의 미사일 철수와 미국의 쿠바 불침공 약속 등을 통해 위기가 해소되었지만 냉전기의 최정점 위기로 남았다."},{"id":"i1268","t":"미주국가기구 참여정지 (1962): OAS는 1962년 쿠바 정부를 미주체제 참여에서 배제하는 결정을 내렸고, [[2009]] 년 그 결의의 효력은 철회되었지만 쿠바는 여전히 OAS에 적극 복귀하지 않았으므로, 쿠바 문제는 장기간 지역적 외교고립의 상징으로 남았다."},{"id":"i1269","t":"[[토리첼리법(Cuban Democracy Act)]] (1992): 미국은 이 법으로 미국 기업의 해외 자회사와 쿠바의 거래를 제한하고, 쿠바에 기항한 선박의 미국 항구 입항을 제한하는 등 기존 엠바고를 크게 강화하였으며, 대쿠바 압박을 단순한 양자제재가 아니라 광범위한 경제봉쇄 체제로 정교화하였다."},{"id":"i1270","t":"[[헬름스-버턴법 (Cuban Liberty and Democratic Solidarity Act)]] (1996): 미국은 이 법으로 대쿠바 제재를 연방법 차원에 고정하여 대통령의 완화 재량을 좁혔고, 혁명 이후 몰수재산을 이용한 외국 기업에 대한 소송과 입국제한 근거까지 마련하여 제재를 제3국 기업으로 확장하였다."},{"id":"i1271","t":"버락 오바마의 미–쿠바 관계 정상화 (2014~2016): 2014년 12월 17일 쿠바와의 관계 전환을 공식 발표하며 수감자 교환, 외교관계 정상화 추진, 송금·여행·통신 분야 완화 등을 시작했고, 2015년 5월 29일 쿠바를 [[테러지원국]] 명단에서 해제하였으며, 2015년 7월 20일 양국은 대사관을 재개설하여 반세기 적대관계를 완화하였다."},{"id":"i1272","t":"도널드 트럼프의 대쿠바 재경색 정책 (현재): 오바마 시기의 완화 기조를 되돌리며 여행·송금·거래 제한을 재강화하고 포괄적 엠바고를 유지하였으며, 최근에는 대쿠바 강경노선을 재확인하여 관계가 다시 압박과 [[봉쇄]] 중심으로 전환되고 있다."}]}]},{"id":"i1273","title":"중국","secs":[{"id":"i1274","title":"중국 지도자 변동과 핵심정책","note":"-중국 지도자 재임기와 핵심정책 암기-\n2025~2026년 들어 중국의 강대국 외교는 미·중 전략경쟁의 구조화 속에서 유럽과의 실용적 협력 공간을 확대하려는 방향으로 전개되고 있다. 특히 United States가 대중 기술통제와 공급망 재편을 지속하면서 동시에 유럽을 상대로 방위비·산업보조금·대중 견제 동참을 압박하자, 중국은 이를 “전략적 자율성” 담론과 연결해 유럽과의 관계를 관리하고 있다. Germany와는 2025년 고위급 경제·기후 대화를 재가동하며 전기차 관세 문제와 배터리 공급망 협력을 병행 논의하였고, 독일의 ‘디리스킹(de-risking)’ 기조를 존중한다는 메시지를 발신하며 완전한 탈동조(decoupling)에는 반대하는 입장을 공유하려 했다. France와는 항공·원전·친환경 전환 분야 협력을 확대하고, 다자주의 및 우크라이나 전쟁 이후의 유럽 안보질서 문제에서 중재·대화 역할을 강조하며 정치적 신뢰 회복을 시도하였다. 한편 Canada와는 2018년 이후 경색되었던 관계를 점진적으로 관리하면서 농산물·기후변화·북극항로 등 실용 의제를 중심으로 협의를 재개하는 움직임을 보였다. 전반적으로 2025~2026년 중국 외교는 미국의 대중 압박이 유럽 경제에 비용을 초래한다는 점을 부각시키면서, 경제 실용주의·기후협력·다자주의를 매개로 유럽과의 선택적 밀착을 도모하는 ‘분화 전략’의 성격을 띠고 있다.","items":[{"id":"i1275","t":"마오쩌둥(1949-1976, 중국공산당 주석)은 1950년 10월 ‘[[항미원조(抗美援朝)]]’를 기치로 한국전쟁에 참전하여 압록강 방어선을 확보하고 신생 공산정권의 체제 안전을 보장하였다."},{"id":"i1276","t":"마오쩌둥(1949-1976, 중국공산당 주석)은 [[1964]]년 10월 16일 로프노르에서 첫 원자폭탄 실험에 성공하고 1967년 수소폭탄 실험까지 완성하여 핵보유국 지위를 확보하였다."},{"id":"i1277","t":"[[화궈펑]](1976-1981, 중국공산당 주석·국무원 총리)은 1978년 미·중 수교 합의를 확정하고 1979년 1월 1일 공식 수교를 실현하는 과도기 외교를 수행하였다."},{"id":"i1278","t":"덩샤오핑(1978-1992, 중앙군사위원회 주석·실질적 최고지도자)은 [[1978]]년 제11기 3중전회에서 개혁·개방 노선을 채택하고 1980년 선전 등 경제특구를 설치하여 대외개방을 제도화하였다."},{"id":"i1279","t":"덩샤오핑(1978-1992, 중앙군사위원회 주석·실질적 최고지도자)은 ‘도광양회(韬光养晦)’ 전략을 제시하고 1992년 [[남순강화]]를 통해 사회주의 시장경제 노선을 재확인하였다."},{"id":"i1280","t":"장쩌민(1989-2002, 중국공산당 총서기·국가주석)은 1996년 포괄적핵실험금지조약(CTBT)에 서명하고 [[2001]]년 12월 WTO 가입을 성사시켜 중국을 다자안보·다자무역체제에 동시에 편입시켰다."},{"id":"i1281","t":"후진타오(2002-2012, 중국공산당 총서기·국가주석)은 ‘[[화평발전(和平发展)]]’과 ‘조화세계(和谐世界)’ 기조를 제시하고 2008년 베이징 올림픽과 2010년 상하이 엑스포를 통해 책임대국 이미지를 강화하였다."},{"id":"i1282","t":"시진핑 1기(2012-2017, 중국공산당 총서기·국가주석)는 [[2013]]년 일대일로(一带一路) 구상을 제창하고 2015년 AIIB를 출범시켜 중국 중심의 인프라·금융 네트워크 확장을 추진하였다."},{"id":"i1283","t":"시진핑 2기(2017-2022, 중국공산당 총서기·국가주석)는 2018년 미·중 무역전쟁에 대응하며 ‘[[전랑외교(战狼外交)]]’를 강화하여 외교관들이 공개적으로 강경하고 공세적인 언사를 사용하는 대외 강경노선을 제도화하였다."},{"id":"i1284","t":"시진핑 3기(2022-현재, 중국공산당 총서기·국가주석)는 [[글로벌 발전구상]](GDI, 全球发展倡议)과 글로벌 안보구상(GSI, 全球安全倡议)을 본격화하고 2023년 브릭스 확대를 통해 글로벌 사우스 결집과 대안적 국제질서 구축을 시도하고 있다."}]},{"id":"i1285","title":"모택동의 대외정책 사례","note":"","items":[{"id":"i1286","t":"중소동맹 체결 ([[1950]].2.14): 소련과 중소우호동맹상호원조조약을 체결하여 군사적 상호방위와 경제·기술 지원을 약속받았고, 이는 중국 초기 산업화와 안보 기반을 구축하는 핵심 축으로 작용하였다."},{"id":"i1287","t":"한국전쟁 참여 (1950.10.19 ~ 1953.7.27): 한국전쟁에서 ‘[[항미원조]]’ 명분으로 1950년 10월 19일 인민지원군을 파병하여 북진하는 유엔군을 저지하고, 1953년 7월 27일 정전까지 한반도에서 미국의 영향력 확대를 견제하며 사회주의 진영 결속을 강화하였다."},{"id":"i1288","t":"평화공존 5원칙 제창 (1954.6.28): [[저우언라이]]를 중심으로 인도와의 공동성명을 통해 주권·영토보전 상호존중, 상호불가침, 내정불간섭, 평등·호혜, 평화공존의 5원칙을 제시하여 냉전 속에서도 비동맹·제3세계 국가들과의 외교적 협력 기반을 확대하였다."},{"id":"i1289","t":"대만 해협 제1차 위기 (1954.9.3 ~ 1955.5.1): 1954년 9월 3일 금문도 포격을 시작으로 대만이 점유한 금문·마조에 대한 군사적 압박을 가하여 ‘하나의 중국’ 원칙 하의 통일 의지를 과시하였고, 이에 대응해 미국은 1954년 [[12]]월 2일 대만과 상호방위조약을 체결하는 등 냉전 긴장이 고조되었다."},{"id":"i1290","t":"반둥회의 참여 (1955.4.18 ~ 1955.4.24): 반둥회의에서 [[저우언라이]]를 중심으로 온건·협력 노선을 강조하며 중국의 평화적 이미지와 제3세계 지도국으로서의 위상을 강화하였다."},{"id":"i1291","t":"대만 해협 제2차 위기 (1958.8.23 ~ 1958.10.6): 1958년 8월 23일 [[금문도]] 등에 대한 집중 포격을 개시하고 봉쇄를 시도하여 긴장을 고조시켰으며, 미국의 군사적 개입 속에서도 10월 6일 부분 휴전에 이르기까지 제한적 군사행동을 통해 통일 압박 전략을 지속하였다."},{"id":"i1292","t":"북중동맹 체결 (1961.[[7]].11): 북한과 조중우호협력상호원조조약을 체결하여 유사시 자동 군사개입 조항을 포함한 동맹을 구축하고, 한반도에서의 전략적 완충지대를 확보하였다."},{"id":"i1293","t":"핵무장 성공 ([[1964]].10.16): 신장 로프노르에서 첫 핵실험에 성공하여 전략적 억지력을 확보하고, 미국·소련에 종속되지 않는 자주적 군사강국으로서의 지위를 확립하였다."},{"id":"i1294","t":"베트남전쟁 지원 (1965.6 ~ 1968.3 중심): 베트남 전쟁에서 북베트남에 무기·물자 지원뿐 아니라 1965년 6월 이후 공병·방공부대 등을 대규모로 파견하여 군사적·후방 지원을 수행함으로써 [[미국]]의 동남아 영향력 확대를 억제하였다."},{"id":"i1295","t":"중소분열 심화 및 국경충돌 (1969.3.2): 소련과의 이념·노선 갈등이 심화된 가운데 1969년 3월 2일 우수리강 [[다만스키(진보도 (珍宝岛))]]섬에서 무력충돌이 발생하여 양국 관계가 사실상 적대적 수준으로 전환되었다."},{"id":"i1296","t":"유엔 대표권 확보 (1971.10.25): 유엔 총회 결의 2758호가 채택됨에 따라 중국이 국제연합에서의 합법적 대표권을 획득하고 [[대만]]을 축출함으로써 국제적 정통성과 외교적 영향력을 크게 강화하였다."},{"id":"i1297","t":"상하이 공동성명 (1972.2.28): 상하이 공동성명을 통해 [[닉슨]] 방중을 계기로 ‘하나의 중국’ 원칙에 대한 미국의 입장 표명을 이끌어내고, 소련 견제를 위한 전략적 관계 개선과 국제정치 구조 재편의 계기를 마련하였다."}]},{"id":"i1298","title":"시진핑 정부의 주요 대외정책 사례 정리(2013~)","note":"","items":[{"id":"i1299","t":"2013년 시진핑은 카자흐스탄·인도네시아 순방에서 ‘실크로드 경제벨트’와 ‘21세기 해상 실크로드’를 제안하며 [[일대일로]](BRI)를 중국 대외전략의 핵심 프로젝트로 출범시켰다."},{"id":"i1300","t":"2013년 중국은 아시아 인프라투자은행(AIIB) 구상을 공식화하고, 2015년 설립협정 서명과 [[2016]]년 1월 16일 공식 출범을 통해 서방主導 개발금융체제에 대한 대안적 다자개발은행을 출범시켰다."},{"id":"i1301","t":"2016년 시진핑 지도부는 미국과 함께 파리기후변화협정에 서명·비준하며 조기 발효를 견인하였다."},{"id":"i1302","t":"2016년 7월 남중국해 중재판정부가 [[필리핀]]의 손을 들어주는 판정을 내리자, 중국 정부는 이를 “불법·무효”라며 수용을 거부하고, 인공섬 군사기지화와 해군·해경 활동을 강화해 실효 지배를 공고히 하였다."},{"id":"i1303","t":"2017년 중국은 아프리카 [[지부티]]에 인민해방군 해군지원기지를 공식 개설하여 첫 해외 군사기지를 확보함으로써 인도양과 홍해 일대에서의 원해(遠海) 군사력 투사 능력을 대폭 확대하였다."},{"id":"i1304","t":"2017년 중국은 19차 당대회에서 ‘신형[[국제]]관계(New Type of International Relations)’를 제시하며 미국 중심 국제질서 대안을 담론화하였다."},{"id":"i1305","t":"트럼프 행정부가 2018년부터 관세를 부과하자, 시진핑 정부는 보복관세와 [[쌍순환]] 정책을 채택하였다. [[쌍순환]]정책은 2020년 시진핑이 공식 발표한 전략으로, 국내대순환을 발전의 기본축으로 두고 국제대순환과 상호 촉진시키는 방식으로 기술자립·내수강화·대외개방을 동시에 추구하는 중국의 신발전구도이다."},{"id":"i1306","t":"2020년 6월 베이징은 [[홍콩]] 국가보안법(NSL)을 일방적으로 제정·시행하여 분리·전복·테러·외세결탁을 광범위하게 처벌함으로써 ‘일국양제’를 사실상 재구성하였다."},{"id":"i1307","t":"[[2021]]년 9월 시진핑은 UN 총회 일반토의 연설에서 글로벌 개발 이니셔티브(GDI)를 제안하며, 2030 지속가능발전목표(SDGs) 이행을 지원하는 ‘글로벌 공공재 제공자’로서 중국의 이미지를 부각시키는 개발외교를 전개하였다."},{"id":"i1308","t":"2022년 4월 [[보아오]]포럼 연설에서 시진핑은 글로벌 안보 이니셔티브(GSI)를 제시하여 ‘공동·종합·협력·지속가능 안보’와 주권·영토보전을 내세운 중국식 안보질서 구상을 국제사회에 제도화된 담론으로 제안하였다."},{"id":"i1309","t":"2022년 4월 중국은 [[솔로몬]]제도와 안보협력협정을 체결해 중국 경찰·군의 파견과 함정 기항을 가능하게 함으로써, 남태평양에서의 치안·군사 존재감 확대와 미국·호주 중심 안보질서에 대한 도전을 본격화하였다."},{"id":"i1310","t":"2023년 중국은 중앙아시아 5개국(C5)과 ‘[[시안]] 정상회의’를 개최하여 에너지·안보·인프라 협력을 체계화하고 러시아 영향력을 일부 대체하려는 구도를 강화하였다."},{"id":"i1311","t":"2023년 3월 베이징에서 중국 중재로 사우디아라비아와 [[이란]]이 외교관계 복원 합의를 발표하면서, 시진핑 정부는 중동에서 미국을 대체하는 ‘중재자·조정자’ 역할을 부각시키는 중동외교의 새로운 위상을 과시하였다."}]},{"id":"i1312","title":"중국 대외정책 기조 ①","note":"","items":[{"id":"i1313","t":"과학적 발전관(科學發展觀, Scientific Outlook on Development, 2003 제기·2007 공식화) : [[후진타오]] 시기 제시된 발전 이념으로, 단순한 GDP 성장 중심 노선에서 벗어나 인간 중심·균형 발전·지속가능 발전·사회 조화를 강조하였으며, 대외적으로는 안정적 국제환경과 “조화세계” 구축을 중시하였다."},{"id":"i1314","t":"신형대국관계(新型大國關係, 2012~2013 본격 제시) : 시진핑 집권 초기 미국과의 관계 설정 과정에서 등장한 개념으로, 기존 패권국과 신흥국 간 충돌을 의미하는 “[[투키디데스]] 함정”을 피하고 상호존중·상생협력을 추구하자는 미·중 관계 관리 논리이다."},{"id":"i1315","t":"신시대 중국특색 사회주의(新時代中國特色社會主義) : 시진핑이 [[2017]]년 제19차 중국공산당 당대회에서 공식화한 통치이념으로, 중국공산당의 영도 강화·사회주의 현대화·강군 건설·중화민족의 위대한 부흥을 핵심 목표로 하며, 대외적으로는 중국식 발전모델의 정당성과 강대국화를 강조한다."},{"id":"i1316","t":"[[인류]]운명공동체([[人類]]命運共同體) : 2017년 이후 중국 외교의 핵심 이념으로 자리잡은 개념으로, 각국이 상호의존 속에서 공동번영·공동안보를 추구해야 한다고 주장하며 중국식 글로벌 거버넌스 비전을 제시한다."},{"id":"i1317","t":"신형국제관계(新型國際關係) : 시진핑 [[2기]] 들어 본격 강조된 국제질서 구상으로, 냉전적 동맹·패권정치·제로섬 경쟁을 비판하고 상호존중·협력·윈윈(win-win)을 기반으로 한 새로운 국제관계를 구축하자는 개념이다."},{"id":"i1318","t":"[[전랑]]외교([[戰狼]]外交, Wolf Warrior Diplomacy, 2019~2020 본격화) : 중국 외교관들이 미국·유럽·호주 등의 비판에 대해 공격적이고 민족주의적으로 대응하는 강경 외교 스타일을 의미하며, 대만·홍콩·신장·남중국해 문제에서 중국의 핵심이익 수호를 강하게 주장하는 특징을 가진다."},{"id":"i1319","t":"쌍순환(雙循環) 전략: 미국의 기술·무역 압박과 공급망 재편에 대응하기 위해 2020년 공식 제시된 전략으로, 국내대순환(내수 확대·[[기술]]자립)을 중심축으로 삼으면서 국제순환(무역·투자)을 병행하여 경제안보와 자립성을 강화하려는 노선이다."},{"id":"i1320","t":"글로벌 발전 이니셔티브(GDI, Global Development Initiative) : 시진핑이 [[2021]]년 UN총회에서 제시한 구상으로, 개발도상국 지원·빈곤감축·디지털 전환·지속가능 발전 협력을 강조하며 글로벌 남반구에서 중국의 영향력 확대를 추구한다."},{"id":"i1321","t":"글로벌 안보 이니셔티브(GSI, Global Security Initiative) : 시진핑이 2022년 [[보아오]] 포럼에서 제시한 안보 구상으로, 미국 중심 동맹체제와 냉전적 안보관을 비판하고 공동안보·포괄안보·협력안보·지속가능 안보를 강조한다."},{"id":"i1322","t":"글로벌 문명 이니셔티브(GCI, Global Civilization Initiative) : 시진핑이 2023년 세계 정당 고위급 대화에서 제시한 문명 구상으로, 서구 보편가치 중심 질서에 대응하여 문명 [[다양성]]·상호존중·교류·상호학습을 강조하며 중국식 가치관과 정치체제의 국제적 정당성을 부각하려는 전략이다."}]},{"id":"i1323","title":"중국 대외정책 기조 ②","note":"","items":[{"id":"i1324","t":"도광양회(韬光养晦)(덩샤오핑): 힘을 감추고 때를 기다리며 국력을 축적한다는 대외전략으로, 개혁·개방기 중국 외교의 기본 노선이 되었다."},{"id":"i1325","t":"유소작위(有所作为)(덩샤오핑): 도광양회를 유지하되 국익에 관한 사안에서는 적극적으로 역할을 수행한다는 전략으로, 국제사회에서 중국의 영향력을 점진적으로 확대하였다."},{"id":"i1326","t":"화평굴기(和平崛起)(2003): 평화적인 방식으로 강대국으로 부상한다는 개념으로, 중국의 부상에 대한 국제사회의 우려를 완화하기 위해 제시되었으나 이후 '화평발전'으로 대체되었다."},{"id":"i1327","t":"화평발전(和平发展)(후진타오): 평화와 협력을 통해 발전을 추구하고 국제사회와 공동번영을 도모한다는 중국의 공식 대외정책 노선이 되었다."},{"id":"i1328","t":"조화세계(和谐世界)(후진타오): 국가 간 대화·협력과 다자주의를 통해 조화로운 국제질서를 구축한다는 외교이념으로, 유엔 중심의 국제협력을 강조하였다."},{"id":"i1329","t":"분발유위(奋发有为)(시진핑): 도광양회를 넘어 축적된 국력을 바탕으로 국제질서와 글로벌 거버넌스에 적극 참여하고 중국의 핵심이익을 강경하게 수호하는 공세적 대국외교를 의미한다."},{"id":"i1330","t":"신형대국관계(新型大国关系)(시진핑 1기): 미국과 중국이 기존 강대국 간 충돌을 피하고 새로운 강대국 관계를 구축하자는 구상으로, 2013년 시진핑이 제안하고 같은 해 왕이가 비충돌·비대항(不冲突、不对抗), 상호존중(相互尊重), 협력공영(合作共赢)의 3대 원칙을 구체적으로 제시하였다."},{"id":"i1331","t":"신형국제관계(新型国际关系)(시진핑 2기): 상호존중·공평정의·협력공영을 바탕으로 모든 국가를 대상으로 새로운 국제질서를 구축하자는 다자 중심의 외교이념으로 발전하였다."},{"id":"i1332","t":"대국외교(大国外交)(시진핑): ‘중국 특색의 대국외교’를 통해 중국을 글로벌 강대국으로 자리매김하고 국제질서와 글로벌 거버넌스를 주도한다는 외교전략이다."},{"id":"i1333","t":"인류운명공동체(人类命运共同体)(시진핑): 인류가 공동의 운명을 공유한다는 인식 아래 공동발전·공동안보를 추구하고, 중국이 제시하는 새로운 국제질서를 구축하자는 외교이념이다."}]},{"id":"i1334","title":"중국의 Global South 외교","note":"새해 첫 순방지로 아프리카를 택해 중국 외교의 36년 전통을 이어온 왕이 중국공산당 외사판공실 주임 겸 외교부장이 ‘식민주의와 맞서 싸운 역사’를 언급하고 일대일로 성과를 칭찬했다. 남아공에서 브릭스(BRICS) 첫 합동 군사훈련도 시작했다. 11일 중국 외교부에 따르면 왕 부장은 마무드 타빗 콤보 탄자니아 외교·동아프리카협력부 장관과 9일(현지시간) 공동 기자회견을 열고 “우리는 정의를 수호해야 한다”며 “중국과 아프리카는 제국주의와 식민주의에 맞서 싸우고, 민족 해방을 위해, 그리고 발전과 부흥을 추구하는 힘겨운 투쟁을 함께 해 왔다”고 말했다. 왕 부장은 탄자니아-잠비아 철도 개통을 언급했다. 탄자니아 항구도시이자 동아프리카 관문항인 다르에스살람 항만과 아프리카 내륙을 연결하는 이 철도는 중국 일대일로 프로젝트 사업에 따라 건설돼 지난해 11월 개통했다.중국은 외교 사령탑이 새해 첫 해외 일정으로 아프리카를 방문하는 관례를 1990년 이후 36년째 이어오고 있다. 지난 7일 순방 일정을 시작한 왕 부장의 올해 방문지는 동아프리카의 에티오피아, 탄자니아, 레소토, 소말리아 4개국이다. 에티오피아·탄자니아는 동아프리카의 경제 중심지이며 중국과 긴밀하게 협력한다. 남아공과 인접한 레소토는 도널드 트럼프 미국 대통령이 지난해 4월 상·하원 합동 연설에서 해외 원조 예산 삭감을 설명하며 “아무도 모를 나라”라고 언급한 나라다. 소말리아는 이스라엘의 소말릴란드를 국가 승인에 반발하고 있다. 중국은 이날 남아공 해상에서 브릭스 첫 합동 군사훈련을 시작했다. 로이터통신에 따르면 ‘평화의 의지 2026’이라고 명명된 훈련은 일주일 간 진행된다. 브릭스 회원국인 중국·남아공·러시아·이란에 더해 브라질, 이집트, 에티오피아가 참관국 자격으로 참가한","items":[{"id":"i1335","t":"[[덩샤오핑]] 시기 중국은 1982년 ‘대외 원조 4원칙’을 발표하여 아프리카와 개도국에 대해 정치적 조건을 붙이지 않는 원조 외교 노선을 공식화했다."},{"id":"i1336","t":"장쩌민 시기 중국은 [[2000]]년에 중국-아프리카 협력포럼(FOCAC)을 창설하여 아프리카에 대한 원조·차관·무역·군사협력을 제도화했다."},{"id":"i1337","t":"장쩌민 시기 중국은 2000년대 초 아프리카 국가들의 [[대만]]과의 단교를 대가로 차관과 원조를 제공하는 외교 전략을 확립했다."},{"id":"i1338","t":"시진핑 시기 중국은 [[2013]]년 니카라과 운하 사업권을 HKND가 부여받았으나 2024년 니카라과 의회가 이를 취소하면서 프로젝트가 폐기되었다."},{"id":"i1339","t":"시진핑 시기 중국은 [[지부티]]에 해외 해군기지(2017)를 설치하여 아프리카·중동 항로를 통제하는 첫 해외 군사거점을 구축했다."},{"id":"i1340","t":"시진핑 시기 중국은 파키스탄 경제회랑과 [[스리랑카]] 함반토타항을 결합하여인도양과 남아시아를 연결하는 해상·육상 전략 거점망을 구축했다."},{"id":"i1341","t":"시진핑 시기 중국은 [[솔로몬]]제도에서 2019년 대만 단교 이후 치안·인프라 지원을 제공하여 태평양 도서국을 중국의 영향권으로 편입시켰다."},{"id":"i1342","t":"시진핑 시기 중국은 [[키리바시]](2019)의 대만 단교 이후 항공기·항만·통신 지원을 제공하여태평양에서 대만의 외교 공간을 축소했다."},{"id":"i1343","t":"시진핑 시기 중국은 솔로몬제도와 안보협정([[2022]]년)을 체결하여 경찰·군사력 파견을 통해 태평양 도서국에 대한 통제력을 제도화했다."},{"id":"i1344","t":"시진핑 시기 중국은 [[2022]]년 글로벌 안보 이니셔티브(GSI)를 제시하고 아프리카에 군사교육·경찰훈련·장비·대테러·해적 대응 협력을 확대했다."},{"id":"i1345","t":"시진핑 시기 중국은 파푸아뉴기니·바누아투·키리바시 등에 항만과 통신망을 건설하여 태평양에서 [[미국]]과 대만을 동시에 견제하는 거점망을 구축했다."},{"id":"i1346","t":"시진핑 시기 중국은 앙골라·나이지리아·콩고 등 산유국에 인프라를 제공하고 [[석유]]를 확보하는 ‘자원–개발 교환 외교’를 강화했다."},{"id":"i1347","t":"아프리카에서는 대만이[[에스와티니]]와만 공식 수교를 유지하여 중국의 외교 압박 속에서 사실상 유일한 외교 거점을 보유하고 있다."},{"id":"i1348","t":"태평양에서는 대만이 마셜제도·팔라우·[[투발루]]와 수교를 유지하여 중국의 영향력 확대 속에서도 제한적이나마 외교 공간을 유지하고 있다."}]}]},{"id":"i1349","title":"대만·홍콩·남중국해","secs":[{"id":"i1350","title":"대만의 역사와 국제관계","note":"","items":[{"id":"i1351","t":"1949년 12월 중화민국 정부의 대만 이전:1949년 12월 7일, 국공내전에서 패배한 중화민국 총통 [[장제스]]는 정부를 중국 대륙에서 대만으로 이전하였다. 중국 대륙에서는 같은 해 [[10]]월 1일 마오쩌둥이 중화인민공화국(PRC) 수립을 선포하였다."},{"id":"i1352","t":"1954년 12월 미·대만 상호방위조약 체결: 1954년 12월 2일 미국 대통령 [[아이젠하워]]와 중화민국 총통 장제스는 미·대만 상호방위조약(Mutual Defense Treaty)을 체결하였다. [[한국]]전쟁 이후 미국은 공산주의 확산을 저지하기 위한 봉쇄정책을 추진하고 있었으며, 대만을 서태평양 방위선의 핵심 거점으로 인식하였다. 동 조약은 1955년 3월 3일 발효하였다."},{"id":"i1353","t":"1954~1955년 제1차 및 1958년 제2차 대만해협 위기: 제1차 위기 당시 중국의 마오쩌둥은 [[진먼도]]와 마쭈열도에 대한 포격을 개시하여 대만에 군사적 압박을 가하였다. 이에 미국 대통령 드와이트 D. 아이젠하워는 1955년 [[포모사 결의안(Formosa Resolution)]]을 통해 군사개입 권한을 확보하였다. 이어 1958년 제2차 위기에서도 중국은 진먼도를 집중 포격하였으며, 미국은 해군 함대를 파견하여 총통 장제스의 대만을 지원하였다. 이 과정에서 핵무기 사용 가능성까지 거론되며 냉전기 동아시아의 대표적 위기로 발전하였다."},{"id":"i1354","t":"[[1971]]년 10월 유엔 대표권 상실: [[1971]]년 10월 25일 유엔총회는 결의 제2758호를 채택하였다. 당시 중국은 [[마오쩌둥]] 체제였으며, 대만은 총통 [[장제스]]가 통치하고 있었다. 결의안은 중화인민공화국을 중국의 유일한 합법정부로 인정하고 중화민국 대표를 축출하도록 규정하였다. 이 결정으로 대만은 유엔 및 대부분의 국제기구에서 탈퇴하게 되었으며, 이후 국제사회에서 외교적 고립이 심화되었다."},{"id":"i1355","t":"1979년 1월 미국-중국 수교: 1979년 1월 1일 미국 대통령 [[지미 카터]]는 중국의 실질적 최고지도자 덩샤오핑과 공식 수교를 단행하였다. 미국은 베이징 정부를 중국의 유일한 합법정부로 인정하였으며, 대만의 총통 [[장징궈]] 정부와는 외교관계를 종료하였다."},{"id":"i1356","t":"[[1979]]년 4월 대만관계법(Taiwan Relations Act) 제정: 미국 의회는 수교 직후인 [[1979]]년 4월 10일 대만관계법을 제정하였다. 당시 미국 대통령은 지미 카터였으며, 대만 총통은 장징궈였다. 이 법은 미국이 대만에 방어용 무기를 판매할 수 있도록 규정하고, 대만의 안전이 위협받는 상황을 미국의 중대한 관심사로 선언하였다."},{"id":"i1357","t":"1992년 92공식(九二共識) 형성: 1992년 대만의 총통 [[리덩후이]]와 중국 공산당 총서기 [[장쩌민]] 시기에 양안 실무기구가 홍콩에서 회담을 개최하였다. 이 과정에서 양측은 '하나의 중국' 원칙을 인정하되 그 의미는 각자 해석한다는 입장에 도달한 것으로 알려졌다. 이후 국민당 정부는 이를 양안관계의 정치적 기초로 수용하였으나, 민진당은 공식 합의의 존재 자체에 대해 비판적 입장을 유지하고 있다."},{"id":"i1358","t":"2002년 WTO 가입: 2002년 1월 1일 대만은 총통 [[천수이벤]] 집권기, 중국은 국가주석 [[장쩌민]] 집권기에 ‘타이완·펑후·진먼·마쭈 개별관세영역(Chinese Taipei)’ 명의로 World Trade Organization 에 가입하였다. 중국이 [[2001]]년 12월 WTO에 가입한 직후 이루어진 가입으로, 대만은 국가가 아닌 관세영역 자격으로 가입하였다."},{"id":"i1359","t":"2010년 양안경제협력기본협정(Economic Cooperation Framework Agreement, ECFA) 체결: 2010년 6월 29일 대만 총통 [[마잉주]]와 중국 국가주석 [[후진타오]] 시기에 양안경제협력기본협정(ECFA)이 체결되었다. 협정은 관세 인하, 투자 확대, 서비스시장 개방 등을 주요 내용으로 하였다. ECFA는 양안 간 경제통합을 크게 촉진하였으며, 대만 기업의 중국시장 진출 확대에 중요한 역할을 하였다."},{"id":"i1360","t":"2023년 미·대만 21세기 무역 이니셔티브 체결: 2023년 6월 미국 대통령 [[조 바이든]]과 대만 총통 [[차이잉원]] 시기에 「U.S.-Taiwan Initiative on 21st-Century Trade」의 첫 협정이 체결되었다. 협정은 무역 원활화, 공급망 안정, 중소기업 지원, 반부패, 규제 투명성 강화 등을 포함하고 있다. 이는 미국과 대만의 경제안보 협력을 크게 강화한 사례이며, 중국 국가주석 [[시진핑]] 정부는 이에 강하게 반발하였다."}]},{"id":"i1361","title":"홍콩의 역사 ①","note":"","items":[{"id":"i1362","t":"난징조약([[1842]]년)은 제1차 아편전쟁 종전조약으로서 청나라가 홍콩섬 전부를 영국에 영구적으로 할양하고 통상항 개방과 치외법권을 인정함으로써 홍콩의 영국 식민지 지배가 법적으로 시작된 최초의 불평등조약이다."},{"id":"i1363","t":"베이징조약(1860)은 제2차 아편전쟁 종전 후 체결된 조약으로 청이 [[구룡]]반도를 영국에 영구 할양하여 홍콩섬과 구룡이 하나의 식민지 행정권 아래 통합되는 영토적 기반을 마련하였다."},{"id":"i1364","t":"홍콩 영토 확장 협약(1898)은 홍콩의 방위와 행정 편의를 명분으로 구룡 북부와 [[신계]] 등을 99년간 임대(lease)하는 형식으로 영국의 통치권을 확대하였으며, 이 임대기간 만료(1997년)가 훗날 홍콩 전면 반환의 직접적 법적 계기가 되었다."},{"id":"i1365","t":"중영 공동선언(1984)은 중국과 영국이 홍콩 전역을 1997년 중국에 반환하기로 합의하면서 ‘일국양제(one country, two systems)’와 [[50]]년간 고도의 자치, 자본주의 체제 및 기존 생활방식의 유지를 국제법상 조약 형식으로 보장한 반환 합의문이다."},{"id":"i1366","t":"홍콩 기본법(1990 채택, 1997 시행)은 중영 공동선언을 구체화한 홍콩 특별행정구의 헌법적 기본법으로서 행정·입법·사법권의 구조, 최종심법원 설치, 기본권 보장, 독자적 [[관세]]·통화·출입경 제도 등 ‘고도의 자치’의 제도적 내용을 규정한다."},{"id":"i1367","t":"United States–Hong Kong Policy Act([[1992]])은 미국이 홍콩을 중국 본토와 구별되는 별개의 관세·무역·수출통제·비자 체계로 취급하도록 규정하여 홍콩에 대해 독립된 경제적·법적 지위를 인정하고, 자치 훼손 시 이러한 특별대우를 철회할 수 있도록 한 미국 국내법이다."},{"id":"i1368","t":"Hong Kong Human Rights and Democracy Act([[2019]])은 홍콩의 자치 수준과 인권 상황을 매년 평가하여 의회에 보고하도록 하고, 자치 침해나 인권 탄압에 책임이 있는 개인과 기관에 대해 비자 제한 및 자산동결 등 제재를 부과할 수 있도록 한 미국의 인권 중심 제재 입법이다."},{"id":"i1369","t":"홍콩 국가보안법([[2020]])은 중국 전국인민대표대회 상무위원회가 도입한 법률로서 분열, 국가전복, 테러, 외세결탁 범죄를 신설하고 중앙정부 국가안전기구의 홍콩 내 활동을 허용함으로써 홍콩의 자치권을 실질적으로 축소시킨 국가안보 통제법이다."},{"id":"i1370","t":"Safeguarding National Security Ordinance(2024)은 기본법 제23조의 입법 의무에 따라 홍콩 입법회가 자체 제정한 국가안보 조례로서 반역, 내란, [[간첩]], 국가기밀 침해, 외국세력과의 공모 등 범죄를 추가 규율하여 기존 국가보안법 체계를 보완·강화하였다."},{"id":"i1371","t":"Safeguarding National Security regulation은 국가보안법과 제23조 조례의 집행을 위하여 경찰의 압수·수색, 정보제출 명령, 전자정보 삭제, 자산동결, 출국금지 등 강력한 수사·집행 권한과 절차를 규정한 하위 시행규정으로 실질적 집행수단을 구체화한다."}]},{"id":"i1372","title":"홍콩의 역사 ②","note":"","items":[{"id":"i1373","t":"홍콩 민주진영 최대 정당인 민주당이 31년 만에 해산했다. 이는 [[2047]]년까지 홍콩의 자치권을 보장한 ‘일국양제(一國兩制·한 국가 두 체제)’ 약화와 중국 중앙정부의 통치 강화 흐름을 보여주는 사례로 평가된다. 민주당은 영국 통치 시기였던 1994년, 1989년 톈안먼 민주화 운동을 계기로 설립된 홍콩민주동맹과 회점이 합병해 출범했다. 일국양제 지지를 내세워 홍콩 민주진영을 대표해 왔으며 1997년 홍콩의 중국 반환 전후로 열린 선거에서 입법회 최대 의석을 차지하며 한때 민주파의 중심 세력으로 활동했다. 그러나 2020년 홍콩 국가보안법 시행 이후 상황은 급변했다. 민주당 소속 인사 다수가 민주파 예비선거 사건과 국가보안법 위반 혐의로 체포·수감됐고 홍콩 선거제도 개편과 ‘애국자만 출마’ 원칙 도입으로 민주파의 제도권 정치 참여는 사실상 차단됐다. 민주당뿐만 아니라 홍콩의 민주진영 정당과 시민단체 10여 곳이 최근 몇 년 사이 잇따라 문을 닫았다. 홍콩 제2야당이었던 시민당은 2023년 해산했고, 시민단체 사회민주연맹도 올해 6월 “막대한 정치적 압박”을 이유로 활동을 중단했다.","tag":"기사"},{"id":"i1374","t":"난징조약 체결과 홍콩섬 할양(1842): 1842년 제1차 [[아편]]전쟁의 결과로 체결된 난징조약에 따라 청나라는 홍콩섬을 영국에 영구 할양하였다."},{"id":"i1375","t":"베이징조약 체결과 구룡반도 남부 할양(1860): 1860년 제2차 아편전쟁 후 체결된 베이징조약에 따라 영국은 구룡반도 남부 지역을 추가로 할양받았다."},{"id":"i1376","t":"신계 99년 조차(1898): 1898년 체결된 홍콩 신계 조차조약에 따라 영국은 신계(New Territories)를 [[99]]년간 조차하였고, 이 조차 기간의 만료가 훗날 홍콩 반환 문제를 구조적으로 예정하였다."},{"id":"i1377","t":"중영 공동선언 채택(1984): 1984년 영국 총리 [[마거릿 대처]]와 중국 최고지도자 덩샤오핑의 지도 아래 체결된 중영 공동선언에서 영국은 1997년 7월 1일 홍콩에 대한 모든 통치권을 중국에 반환하기로 합의하였고, 중국은 홍콩을 특별행정구로 설치하여 외교·국방을 제외한 고도의 자치권을 부여하며, 자본주의 경제체제·사유재산·자유무역·금융제도·사법 독립·기존의 권리와 자유를 최소 [[50]]년간 유지하고, 홍콩인의 홍콩 통치 원칙에 따라 행정장관을 임명하며, 이러한 사항을 홍콩 기본법에 규정하기로 합의하였다."},{"id":"i1378","t":"홍콩 기본법 채택(1990): 1990년 중국 전국인민대표대회는 홍콩 기본법을 채택하여, 반환 이후 홍콩의 정치·경제·사법 제도의 근간과 자치의 범위를 규정하였다."},{"id":"i1379","t":"미국의 홍콩정책법 제정(1992): 1992년 미국 대통령 [[조지 H. W. 부시]] 행정부는 홍콩정책법을 제정하여, 홍콩을 중국과 별도의 관세·무역·비자·금융 체계로 취급하되 그 전제조건으로 홍콩의 고도의 자치 유지를 명시하였다."},{"id":"i1380","t":"홍콩 반환 및 특별행정구 출범(1997): 1997년 7월 1일 영국은 홍콩을 중국에 공식 반환하였고, 홍콩은 중화인민공화국 홍콩특별행정구로 출범하였다."},{"id":"i1381","t":"[[우산]]혁명(2014): 2014년 중국 전국인민대표대회 상무위원회의 행정장관 선거 방식 결정에 반발하여, 홍콩에서는 보통선거와 민주적 선거제도를 요구하는 대규모 시위인 [[우산]]혁명이 전개되었다."},{"id":"i1382","t":"범죄인 인도법 반대 시위(2019): 2019년 홍콩 정부가 중국 본토로의 범죄인 인도를 허용하는 법안을 추진하자 대규모 민주화 시위가 발생하였다."},{"id":"i1383","t":"미국의 홍콩인권·민주주의법 제정(2019): 2019년 미국 대통령 [[도널드 트럼프]] 행정부는 홍콩인권·민주주의법을 제정하여, 홍콩의 자치와 인권 상황을 매년 평가하고 이를 근거로 중국 및 홍콩 인사에 대한 제재를 부과할 수 있도록 하였다."},{"id":"i1384","t":"홍콩 국가보안법 제정·시행(2020): 2020년 중국 국가주석 [[시진핑]] 지도부 하에서 중국 전국인민대표대회 상무위원회는 홍콩 국가보안법을 제정·시행하여 분열·전복·테러·외세 개입 행위를 처벌 대상으로 규정하였고, 이는 홍콩의 정치적 자유와 자치 축소 논란을 초래하였다."},{"id":"i1385","t":"미국의 홍콩 특별지위 박탈 선언(2020): 2020년 미국 대통령 [[도널드 트럼프]] 행정부는 시진핑 지도부의 홍콩 국가보안법 제정을 이유로 홍콩의 미국 내 특별지위 박탈을 선언하였고, 홍콩 문제는 미·중 전략 경쟁의 핵심 외교·안보 쟁점으로 편입되었다."}]},{"id":"i1386","title":"남중국해 영유권 분쟁","note":"","items":[{"id":"i1387","t":"South China Sea는 중국 남부와 동남아시아(Vietnam·Philippines·Malaysia·Brunei·Indonesia) 사이에 위치한 서태평양의 [[반폐쇄해]]로서 세계 해상교통의 핵심 통로이자 자원이 풍부한 전략 해역이다."},{"id":"i1388","t":"[[스프래틀리]] 제도(남사군도)는 China·Vietnam·Philippines·Malaysia·Brunei(및 Taiwan)이 도서 영유권과 해양권을 중첩 주장하는 대표적 다자 분쟁 지역이다."},{"id":"i1389","t":"서사군도(파라셀 제도)는 China과 [[베트남]] 간 영유권 분쟁 지역으로 현재 중국이 실효적으로 지배하고 [[베트남]]이 이에 대해 이의를 제기하고 있다."},{"id":"i1390","t":"스카버러 숄(Scarborough Shoal)은 [[필리핀]] 루손섬 서쪽 해상에 위치한 암초로 중국과 [[필리핀]]이 영유권을 다투며 현재 중국이 사실상 통제하고 있다."},{"id":"i1391","t":"Philippines v. China South China Sea Arbitration은 중국의 [[9단선]]에 기초한 역사적 권리를 부정하고 다수 해양지형이 EEZ를 발생시키지 못한다고 판시하여 UNCLOS 중심 질서를 확인하였다."},{"id":"i1392","t":"Declaration on the Conduct of Parties in the South China Sea는 [[2002]]년 Association of Southeast Asian Nations(ASEAN)과 중국이 분쟁의 평화적 해결, 무력사용 자제 및 현상 변경 금지를 약속한 비구속적 정치 선언이다."},{"id":"i1393","t":"Code of Conduct in the South China Sea는 [[2002]]년 DOC에서 채택이 합의된 이후 지연되다가 2013년부터 ASEAN과 중국 간 본격 협상이 시작되어 2017년 프레임워크 채택, 2018년 단일 협상 초안 마련 등 진전이 있었으나 법적 구속력, 적용 범위, 군사활동 규제 등을 둘러싼 이견으로 아직 최종 합의에 이르지 못하고 있다.<남사군도>"},{"id":"i1394","t":"China:남사군도 전역에 대한 주권과 [[9단선]]에 기초한 역사적 권리를 주장하며 피어리 크로스 암초, 수비 암초, 미스치프 암초 등을 인공섬화하여 실효적 지배를 확대하고 있다."},{"id":"i1395","t":"[[베트남]]:남사군도 전역에 대한 주권을 주장하면서 스프래틀리 섬, 남옛 섬, 신 카우 암초 등 약 20~30개 지형을 점유하고 있으며 파라셀 제도에 대해서도 권리를 주장한다."},{"id":"i1396","t":"Philippines:[[킬라 얀]] 군도 내 일부 도서 주권과 EEZ를 근거로 파가사 섬, 롱 섬, 코타 섬 등을 점유하며 2016년 판정을 근거로 중국 주장에 대응하고 있다."},{"id":"i1397","t":"[[말레이시아]]:남사군도 남부 일부 도서에 대해 주권을 주장하며 스왈로우 암초, 아르다스이어 암초, 마리블레스 암초 등을 점유하고 있다."},{"id":"i1398","t":"[[브루나이]]:도서 영유권은 주장하지 않고 EEZ와 대륙붕에 대한 해양권을 주장하고 있다."},{"id":"i1399","t":"Taiwan:중국과 동일하게 남사군도 전역에 대한 주권을 주장하며 [[이투아바]] 섬을 점유하고 있다."},{"id":"i1400","t":"Indonesia:남사군도 도서 영유권은 주장하지 않지만 [[나투나]] 제도 주변 EEZ를 근거로 중국의 9단선과 충돌하며 UNCLOS 체계를 지지하는 입장을 보여주고 있다."}]}]},{"id":"i1401","title":"일본·중일관계","secs":[{"id":"i1402","title":"일본 주요 총리 대외정책","note":"","items":[{"id":"i1403","t":"요시다 시게루 (1946~1947, 1948~1954) : [[샌프란시스코]] 강화조약(1951)과 미일안전보장조약 체제를 구축하였다. 군사력 증강보다 경제 부흥을 우선시하고 안보는 미국에 의존하는 ‘요시다 독트린’을 확립하여 전후 일본 외교·안보 노선의 기초를 만들었다."},{"id":"i1404","t":"[[기시 노부스케]] (1957~1960) : 1960년 미일안보조약 개정을 강행하여 미일동맹을 강화하였다."},{"id":"i1405","t":"사토 에이사쿠 (1964~1972) : 1972년 미국으로부터 오키나와 반환을 실현하였다. 또한 “핵무기를 만들지도, 가지지도, 반입하지도 않는다”는 비핵 3원칙을 제시하여 일본의 비핵 노선을 제도화하였다. 아울러 1967년 [[무기 수출 3원칙]]을 발표하여 공산권 국가, 유엔 무기금수 대상국 ,국제분쟁 당사국 또는 분쟁 우려국에 대한 무기수출을 금지함으로써 전후 일본의 평화주의·군사억제 노선을 강화하였다."},{"id":"i1406","t":"[[다나카 가쿠에이]] (1972~1974) : 1972년 마오쩌둥 · 저우언라이 지도부와 회담하여 중일 국교정상화를 실현하고, 중화민국(대만)과 단교한 뒤 중화인민공화국을 중국의 유일한 합법정부로 승인하였다."},{"id":"i1407","t":"미키 다케오 (1974~1976) : 미일동맹 유지와 아시아·중동 외교 확대를 추진하였고, [[1976]]년 일본 최초의 「방위계획의 대강」을 제정하여 ‘전수방위’, ‘비핵 3원칙’, ‘군사대국이 되지 않는다’는 전후 일본 안보정책의 기본 방향을 제도화하였다."},{"id":"i1408","t":"후쿠다 다케오 (1976~1978) : 1977년 ‘후쿠다 독트린’을 발표하여 일본이 [[군사대국]]이 되지 않을 것임을 천명하고 ASEAN 국가들과 신뢰관계를 구축하겠다고 선언함으로써 일본-동남아 관계 개선의 전환점을 마련하였다."},{"id":"i1409","t":"[[미야자와 기이치]] (1991~1993) : 냉전 종식 이후 국제사회 기여 확대를 추진하였으며, 1992년 PKO협력법 제정을 통해 자위대의 유엔 평화유지활동 참여를 가능하게 하였다."},{"id":"i1410","t":"하시모토 류타로 (1996~1998) : 외교·안보 면에서는 빌 클린턴과의 정상외교를 통해 미일동맹 재강화를 추진하였으며, 1996년 「미일안전보장 공동선언」을 발표하여 냉전 이후에도 미일동맹이 아시아·태평양 지역 안정의 핵심이라는 점을 재확인하였다. 이어 [[1997]]년 미일방위협력지침(가이드라인) 개정을 통해 일본 주변 유사시 자위대의 후방지원·수송·정보협력 범위를 확대하여 자위대 역할을 강화하였다."},{"id":"i1411","t":"고이즈미 준이치로 (2001~2006) : 미국의 대테러전쟁을 지지하며 자위대를 이라크에 파병하여 미일동맹을 강화하였고, 2002년과 2004년 두 차례 북한을 방문하여 김정일 과 정상회담을 개최하였다. 특히 [[2002]]년 「평양선언」을 통해 북일 국교정상화 추진, 일본의 식민지 지배에 대한 반성과 경제협력, 핵·미사일 문제 해결 및 납치 문제 재발 방지 등을 합의하였으며, 이 과정에서 북한은 일본인 납치 사실을 일부 인정하였다."},{"id":"i1412","t":"아베 신조 (2006~2007, 2012~2020) : 헌법 해석 변경을 통해 [[집단적 자위권]] 행사를 일부 허용하고 안보법제를 정비하여 일본의 안보 역할 확대를 추진하였으며, ‘자유롭고 열린 인도·태평양’ 전략을 통해 미일동맹과 대중 견제 협력을 강화하였다."}]},{"id":"i1413","title":"중일관계사","note":"다카이치 사나에 일본 총리가 대만 유사시 일본의 개입 가능성을 언급한 발언은 중국에 강한 불만을 불러왔고, 이 발언을 계기로 양국 관계는 빠르게 경색됐다. 중국은 처음에는 여행·유학 자제 권고, 일본산 수산물 수입 중단 등 비교적 경미한 보복 조치를 취했고, 이어 대만 문제에 대한 일본의 태도를 중국의 내정 간섭 및 ‘하나의 중국’ 원칙 위반으로 규정하며 외교적 갈등을 고조시켰다. 그 정점에서 2026년 1월 중국 상무부는 일본을 겨냥해 이중용도 물자 및 핵심 전략물자(희토류 등 포함 가능)의 수출을 전면적으로 통제·금지하는 조치를 발표, 일본의 군사적 활용 가능성이 있는 품목의 수출을 즉각 금지함으로써 양국간 무역·외교 갈등을 새로운 ‘전략적’ 국면으로 끌어올렸다. 일본 정부는 이를 “수용할 수 없는 조치”라며 철회를 요구하면서 외교적 긴장이 더욱 높은 수준으로 이어지고 있다. (한국경제신문.0106)","items":[{"id":"i1414","t":"[[1871]]년 9월 13일, 청나라 동치제와 메이지 천황 치하에서 청과 일본은 「중일수호통상조약」을 체결하여 근대 국제법상 중‧일 국교를 처음 수립하였다."},{"id":"i1415","t":"[[1894]]년 7월 25일, 청나라 광서제와 메이지 천황 시기에 조선 문제를 둘러싼 갈등이 군사 충돌로 비화되며 청일전쟁이 발발하였다."},{"id":"i1416","t":"1895년 4월 17일, 광서제의 청조와 메이지 일본은 「시모노세키조약」을 체결하여 청이 [[대만]]과 펑후제도를 일본에 할양함으로써 일본의 동아시아 패권이 확립되었다."},{"id":"i1417","t":"1915년 5월 25일, 중화민국 [[위안스카이]] 정부와 다이쇼 천황 치하의 일본 사이에 21개조 요구를 수용하는 조약이 체결되어 중국의 주권이 심각하게 침해되었다."},{"id":"i1418","t":"1931년 9월 18일, 장제스의 중화민국 정부와 쇼와 천황 시기의 일본 관동군이 [[만주]]사변을 일으켜 만주를 군사 점령함으로써 중국 침략이 본격화되었다."},{"id":"i1419","t":"1937년 7월 7일, 장제스 국민정부와 쇼와 천황 시기의 일본이 [[노구교]] 사건을 계기로 중일전쟁을 전면전으로 확대하였다."},{"id":"i1420","t":"1972년 9월 29일, 마오쩌둥·저우언라이 지도부와 [[다나카 가쿠에이]] 총리·쇼와 천황 시기의 일본은 중일공동성명을 통해 국교를 정상화하였다."},{"id":"i1421","t":"1978년 8월 12일, 덩샤오핑 지도부와 [[후쿠다 다케오]] 총리·쇼와 천황 하의 일본은 중일평화우호조약을 체결하여 전후 중‧일 관계의 제도적 기반을 확립하였다."},{"id":"i1422","t":"1992년 10월 23~28일, 장쩌민 국가주석과 [[아키히토]] 천황 시기에 일본 천황이 중국을 공식 방문하여 침략 역사에 대한 유감을 표명하며 화해를 상징적으로 확인하였다."},{"id":"i1423","t":"2010년 9월 7일, 중국의 [[후진타오]] 국가주석과 간 나오토 총리 시기에 센카쿠 열도 인근 충돌이 발생하였고, 이어 중국이 희토류의 대일 수출을 사실상 통제하면서 중일 갈등이 경제안보 문제로 비화하였다."}]}]},{"id":"i1424","title":"아세안·인도·베트남","secs":[{"id":"i1425","title":"ASEAN 확대","note":"","items":[{"id":"i1426","t":"(서울=연합뉴스) 강종훈 기자 = 동티모르가 아세안(ASEAN·동남아시아국가연합) 11번째 회원국이 됐다. 2025년 10월 26일(현지시간) AP통신 등 외신에 따르면 이날 말레이시아 쿠알라룸푸르에서 개막한 아세안 정상회의에서 동티모르는 회원국으로 공식 승인됐다. 동티모르의 아세안 가입은 2011년 신청 이후 14년 만에 승인됐다. 사나나 구스마오 동티모르 총리는 \"오늘 역사가 만들어졌다\"며 \"동티모르인들의 꿈이 실현된 것일 뿐 아니라 우리의 여정을 강력히 인정받은 것\"이라고 말했다. 인구 약 140만명의 동티모르는 동남아 최빈국으로 꼽힌다. 인구 40%가량이 빈곤층으로 불평등, 영양실조, 높은 실업률 등으로 어려움을 겪고 있다. 450년 동안 [[포르투갈]]의 식민 지배를 받다가 1975년 독립했고, 다시 [[인도네시아]]의 지배를 받다가 2002년 독립했다. 아세안에 신규 회원국이 가입한 것은 2000년대 들어 처음이다. 기존 아세안 회원국 10개국은 인도네시아, 말레이시아, 태국, 필리핀, 싱가포르, [[브루나이]], 베트남, 라오스, 미얀마, 캄보디아다.","tag":"기사"},{"id":"i1427","t":"1967년 8월 8일, 아세안은 인도네시아·말레이시아·필리핀·싱가포르·태국 5개국이 방콕 선언을 통해 창설되었고, 이후 1984년 브루나이, 1995년 베트남, 1997년 라오스·미얀마, 1999년 [[캄보디아]]가 가입해 10개국 체제가 완성되었다."},{"id":"i1428","t":"1971년, 아세안은 외세 군사개입 배제·내정 불간섭·핵·WMD 배치 지양을 내용으로 하는 동남아 평화·자유·중립지대(ZOPFAN) 선언을 채택하였다."},{"id":"i1429","t":"1976년, 아세안은 발리에서 동남아우호협력조약(TAC)을 채택하였고 이후 중국(2003), 일본(2004), 한국(2004), 미국([[2009]]), EU(2012) 등이 가입하며 평화적 분쟁 해결과 상호 불간섭 규범을 역내·역외로 확대하였다."},{"id":"i1430","t":"1994년, 한국(1994), 중국(1994), 일본(1994), 미국(1994), 러시아(1994), EU(1994) 등이 참여한 가운데 아세안지역포럼(ARF)이 출범하였으며, 북한은 [[2000]]년에 가입해 ARF는 총 27개국·기구로 구성된 역내 최대 안보협의체가 되었다."},{"id":"i1431","t":"1995년, 아세안은 핵무기 개발·획득·배치·실험·사용을 금지하는 동남아 비핵지대조약(SEANWFZ)을 체결하였고 이 조약은 1997년에 발효되었다."},{"id":"i1432","t":"1997년, 아시아 금융위기 대응을 계기로 아세안과 한국·[[중국]]·일본이 ASEAN+3 협력체제를 출범시켜 동아시아 다자협력의 제도적 기반을 마련하였다."},{"id":"i1433","t":"2003년에 채택된 아세안 공동체 구상은 2015년 공식 출범하였으며 정치·안보·경제·사회문화 공동체를 갖춘 제도적 협력 틀을 확립하였다."},{"id":"i1434","t":"RCEP은 2012년 협상이 시작되어 2020년 타결되고 2022년에 발효되었으며, 아세안 10개국 외에 한국·중국·일본·호주·뉴질랜드가 참여해 총 15개국이 가입한 세계 최대 FTA가 되었고, [[인도]]는 시장 개방 부담과 중국산 제품 급증 우려 등을 이유로 2019년에 협상에서 이탈하여 최종 협정에 참여하지 않았다."},{"id":"i1435","t":"[[동티모르]]는 2025년 10월 아세안의 정식 제11번째 회원국으로 가입이 확정되었으며, 이는 회원 확대의 중요한 전환점이 되었다."},{"id":"i1436","t":"2012년, 아세안은 발리에서 아세안 인권 선언(AHRD)을 채택하여 생명권·자유권·공정한 재판을 받을 권리·사회경제적 권리 등을 재확인하였으나, 국가의 문화·역사·발전 수준을 고려한다는 조항으로 인해 보편적 인권 기준과의 긴장이 제기되었다."}]},{"id":"i1437","title":"인도 대외정책사 / 한-인도 관계","note":"2026년 4월 21일 한국–인도 정상회담은 미·중 전략경쟁 심화와 글로벌 공급망 재편, 러시아–우크라이나 전쟁 이후 에너지·원자재 불안정, 인도-태평양 지역에서의 경제안보 협력 필요성 증대라는 배경 속에서 개최되었으며, 양국은 1973년 수교 이후 2010년 CEPA 체결과 2015년 ‘특별 전략적 동반자 관계’ 격상으로 축적된 협력 기반을 토대로 반도체·배터리·방산·디지털 전환 등 핵심 전략 산업 분야에서 협력을 확대하고 공급망 안정화 및 기술협력을 강화하기로 하였고, 이를 통해 중국 의존도를 완화하면서 인도-태평양 전략 하에서 경제안보와 산업 협력을 동시에 심화시키는 방향으로 양국 관계를 한 단계 발전시키는 데 합의하였다.","items":[{"id":"i1438","t":"인도 독립 및 비동맹운동 주도 (1947~1961) : 인도는 1947년 8월 15일 영국으로부터 독립하면서 인도와 파키스탄으로 분리되었고, 이후 초대 총리인 [[자와할랄 네루]] 는 냉전기 미·소 양극체제 속에서 자주외교를 추구하며 [[반둥]] 회의(1955)에 참여하여 아시아·아프리카 신생 독립국 간 연대를 형성하고 평화공존·반식민주의 원칙을 제시하였으며, 이어 [[비동맹]] 운동(1961) 창설을 주도함으로써 어느 진영에도 속하지 않는 비동맹 외교노선을 제도화하여 제3세계 외교의 중심국가로 자리매김하였다."},{"id":"i1439","t":"중국과의 국경전쟁 (1962) : 중인전쟁은 히말라야 국경 분쟁에서 발생하였다. 특히 [[맥마흔 라인(McMahon Line)]] 을 둘러싼 인도와 중국 간 인식 차이가 분쟁의 핵심 원인으로 작용하였는데, 이는 1914년 [[시믈라]] 협정에서 영국령 인도와 티베트 사이에 설정된 경계선으로 인도는 이를 합법적 국경으로 인정한 반면 중국은 제국주의적 산물로 간주하여 이를 부인하였기 때문이다. 이러한 배경 속에서 인도는 이 전쟁에서 군사적으로 패배한 이후 기존의 이상주의적 평화공존 외교에서 벗어나 군비 증강과 현실주의적 안보전략을 채택하며 강대국과의 제한적 협력을 병행하는 방향으로 외교노선을 전환하였다."},{"id":"i1440","t":"[[방글라데시]] 독립 지원 (1971) : [[방글라데시]] 독립전쟁에서 인도는 동파키스탄 독립세력을 군사적으로 지원하고 직접 개입하여 단기간 내 승리를 거두었으며 그 결과 [[방글라데시]]의 독립을 성취시키고 남아시아에서 군사적·정치적 영향력을 확대하여 지역 패권국으로 부상하였다."},{"id":"i1441","t":"[[소련]] 과 전략협력 강화 (1971) : 인도-[[소련]] 우호협력조약 체결을 통해 인도는 사실상 [[소련]] 과의 안보협력 관계를 구축하였고 특히 파키스탄 및 미국·중국 간 전략적 연계에 대응하기 위한 외교적·군사적 안전망을 확보하였으며 이는 비동맹 노선이 형식적으로 유지되면서도 실질적으로는 특정 강대국과의 협력을 병행하는 방향으로 수정되었음을 보여준다."},{"id":"i1442","t":"핵실험 및 핵보유국화 ([[1998]] ) : 인도는 [[1998]] 년 포카라 핵실험(Pokhran-II)을 단행하여 사실상 핵보유국임을 선언하였고 핵확산금지조약(NPT)에 가입하지 않은 상태에서 독자적 핵억지력을 확보함으로써 중국 및 파키스탄에 대한 전략적 균형을 도모하고 국제정치에서의 위상과 협상력을 크게 제고하였다."},{"id":"i1443","t":"동방정책(Look East → [[Act]] East) (1990년대~현재) : 인도는 1991년 경제개혁 이후 동남아 및 동아시아 국가들과의 협력을 강화하기 위해 Look East 정책을 추진하였고 이를 발전시킨 [[Act]] East 정책을 통해 아세안과의 경제·안보 협력을 심화하며 인도-태평양 지역에서의 전략적 존재감을 확대하고 해양안보 및 공급망 협력까지 외교 범위를 확장하였다."},{"id":"i1444","t":"신흥국 연대 강화 (BRICS, 2009~) : BRICS는 2009년 정상회의를 기점으로 브라질·러시아·인도·중국이 참여하고 2010년 [[남아프리카공화국]] 이 가입하여 구성된 협력체로서 인도는 이 틀을 통해 글로벌 금융질서 개편과 개발협력 강화를 추진하였으며 특히 신개발은행(NDB) 설립 등을 통해 서방 중심 국제경제질서에 대한 대안을 모색하고 다극체제 형성에 기여하였다."},{"id":"i1445","t":"쿼드 안보협력 참여 (2017~) : 쿼드는 2007년 최초 제안 이후 중단되었다가 2017년 재가동되었으며 인도는 이에 참여하여 미국·일본·호주와 함께 인도-태평양 지역에서의 해양안보, 항행의 자유, 공급망 안정 등을 협력 의제로 삼고 [[중국]] 의 영향력 확대에 대응하는 전략적 협력체로서 기능하고 있다."},{"id":"i1446","t":"한국과의 수교 및 전략적 협력 발전 ([[1973]]~현재) : 대한민국과 인도는 [[1973]]년 외교관계를 수립한 이후 교역 및 투자 협력을 지속적으로 확대해 왔으며 특히 이명박 정부 시기인 [[2010]]년 포괄적 경제동반자협정(CEPA) 발효를 통해 경제협력의 제도적 기반을 구축하고 이어 박근혜 정부 시기인 [[2015]]년 정상회담을 통해 ‘[[특별]] 전략적 동반자 관계’로 격상된 이후 최근에는 반도체, 배터리, 디지털, 방산 등 전략 산업과 글로벌 공급망 협력까지 확대되었다."},{"id":"i1447","t":"한–인도 정상회담 및 전략협력 심화 (2026.4.21) : 2026년 4월 21일 양국 정상회담을 통해 기존 ‘[[특별]] 전략적 동반자 관계’를 재확인하고 반도체·배터리·방산·디지털 전환 등 핵심 산업 분야에서 협력을 한층 강화하기로 하였으며 글로벌 공급망 재편에 대응하여 안정적 공급망 구축과 기술협력 확대를 주요 의제로 설정함으로써 인도-태평양 전략 하에서 협력 수준을 질적으로 심화시키는 계기를 마련하였다."}]},{"id":"i1448","title":"베트남 대외정책사 / 한-베트남 관계","note":"2026년 4월 22일 한국–베트남 정상회담은 2022년 ‘포괄적 전략적 동반자 관계’로 격상된 이후 협력을 구체화할 필요성과 미·중 경쟁 속 글로벌 공급망 재편, 첨단산업 협력 수요 확대라는 배경 속에서 개최되었으며, 양국은 반도체·배터리 등 핵심 산업에서의 공급망 안정화와 투자 확대, 방산 및 해양안보 협력 강화, 인프라·에너지 분야 협력, 인적 교류 및 교육 협력 확대 등에 합의하였고, 이는 한국과 베트남 관계가 단순한 경제협력을 넘어 전략·안보·기술 협력을 포괄하는 수준으로 심화되었음을 보여주며, 동남아 지역에서의 협력 거점을 강화하고 ASEAN 중심 다자외교와 연계된 전략적 파트너십을 한층 공고히 하는 의미를 가진다.","items":[{"id":"i1449","t":"독립 선언 (1945.9.2) : 호치민은 일본의 패망으로 식민지 지배가 붕괴된 상황을 활용하여 하노이 바딘광장에서 베트남 민주공화국의 독립을 선언하였고, 이는 프랑스 식민지 체제로부터의 탈피와 민족자결을 기반으로 한 근대 베트남 국가 형성의 출발점이 되었으나 곧 [[프랑스]]의 재지배 시도로 인해 무력충돌로 이어지는 계기가 되었다."},{"id":"i1450","t":"프랑스와의 전쟁 (1946~1954) : 프랑스가 인도차이나 식민지 회복을 시도하자 베트남은 전면적인 항전(제1차 인도차이나 전쟁)에 돌입하였고, 게릴라전과 장기전을 병행한 끝에 1954년 [[디엔비엔푸]] 전투에서 결정적 승리를 거두어 프랑스의 식민지 지배를 종식시켰으며, 이후 제네바 협정에 따라 베트남은 북위 17도선을 기준으로 남북으로 분단되는 결과를 낳았다."},{"id":"i1451","t":"미국과의 전쟁 (1955~1975) : 냉전 구도 속에서 북베트남은 사회주의 체제를, 남베트남은 미국의 지원을 받는 반공 체제를 유지하면서 충돌하였고, 미국은 도미노 이론에 따라 군사개입을 확대하여 대규모 병력을 투입하였으나, 베트남은 게릴라전과 민중 동원을 통해 장기전을 수행하여 결국 1975년 [[사이공]] 함락을 통해 전쟁에서 승리하고 1976년 통일 국가를 수립하였다."},{"id":"i1452","t":"캄보디아 침공 (1978.12) : 베트남은 국경분쟁과 대량학살을 자행하던 폴 포트의 [[크메르루주]] 정권을 제거하기 위해 캄보디아를 군사적으로 침공하였고, 프놈펜을 점령하여 친베트남 성향의 정권을 수립하였으나, 이로 인해 중국 및 서방과의 관계가 악화되고 국제적 고립이 심화되는 결과를 초래하였다."},{"id":"i1453","t":"중국과의 전쟁 (1979.2) : 캄보디아 침공에 반발하고 베트남의 [[소련]] 밀착을 견제하기 위해 중국이 ‘징벌적 전쟁’을 명분으로 베트남 북부를 공격하면서 중월전쟁이 발발하였고, 약 한 달간의 국지전 이후 중국군이 철수하였으나 이후에도 양국 간 국경 긴장이 지속되며 베트남의 안보 환경을 크게 악화시켰다."},{"id":"i1454","t":"[[도이머이(Đổi Mới)]] 정책 (1986) : 베트남 공산당은 제6차 당대회에서 계획경제의 비효율과 경제난을 극복하기 위해 [[도이머이(Đổi Mới)]] 정책을 채택하여 시장경제 요소 도입, 외국인 투자 유치, 농업 생산 자유화 등을 추진하였고, 이는 경제성장 기반을 마련함과 동시에 대외정책을 이념 중심에서 실용주의와 개방노선으로 전환하는 결정적 계기가 되었다."},{"id":"i1455","t":"한국과 수교 ([[1992]]) : 냉전 종식 이후 베트남은 외교 다변화 전략의 일환으로 대한민국과 외교관계를 수립하였고, 이후 한국은 베트남의 주요 투자국이자 교역 파트너로 부상하면서 산업화·수출 확대 과정에서 핵심적인 경제협력 관계를 형성하였다."},{"id":"i1456","t":"미국과 수교 ([[1995]]) : 장기간 적대 관계였던 미국과 베트남은 전쟁 이후 약 20년 만에 외교관계를 정상화하였고, 이는 베트남이 국제사회로 복귀하고 서방 국가들과의 경제협력을 확대하는 중요한 전환점이 되었으며 이후 무역, 안보, 전략적 협력 관계가 점진적으로 심화되었다."},{"id":"i1457","t":"아세안 가입 ([[1995]]) : 베트남은 ASEAN에 가입하여 동남아 지역 협력체제에 편입되었고, 이를 통해 역내 안정과 경제통합에 참여하는 동시에 다자외교를 강화하고 외교적 고립에서 완전히 벗어나는 계기를 마련하였다."},{"id":"i1458","t":"WTO 가입 ([[2007]]) : 베트남은 세계무역기구에 가입함으로써 관세 인하, 시장 개방, 규범 수용 등을 통해 세계 무역체제에 본격적으로 편입되었고, 이는 외국인 투자 확대와 수출 주도형 성장 전략을 가속화시키는 핵심 제도적 기반이 되었다."},{"id":"i1459","t":"한국과 FTA 체결 ([[2015]]) : 양국은 자유무역협정(KVFTA)을 체결하여 관세 인하와 시장 개방을 확대하였고, 이를 통해 교역 규모가 증가하며 공급망 협력이 심화되었다."},{"id":"i1460","t":"[[포괄적]] 전략적 동반자 관계 격상 (2022) : 한국과 베트남은 정상회담을 통해 관계를 최고 수준의 협력 단계로 격상하여 외교·안보·경제 전반에서 협력을 확대하였다."},{"id":"i1461","t":"한국–베트남 정상회담 (2026.4.22) : 양국 정상은 공급망 안정과 첨단산업 협력(반도체·배터리), 방산 및 [[해양안보]] 협력 확대, 인프라·에너지 분야 투자 확대, 인적 교류 및 교육 협력 강화 등을 주요 내용으로 하는 협력 심화에 합의하였다."}]}]},{"id":"i1462","title":"러시아·유라시아","secs":[{"id":"i1463","title":"소련/러시아의 지도자들","note":"","items":[{"id":"i1464","t":"블라디미르 레닌(1917–1924): 1917년 볼셰비키 혁명을 통해 소비에트 정권을 수립하고, 1918년 [[브레스트-리토프스크]] 평화조약을 체결하여 제1차 세계대전에서 이탈하였으며, 1922년 소비에트 사회주의 공화국 연방(USSR)을 창설하였다."},{"id":"i1465","t":"요시프 스탈린(1924–1953): 1939년 독소불가침조약을 체결하였으며, 1945년 제2차 세계대전 승리 이후 동유럽 공산권을 형성하고 [[1947]] 년 코민포름을 창설하였다."},{"id":"i1466","t":"[[게오르기 말렌코프]] (1953–1955): 1953년 스탈린 사망 이후 집단지도체제를 형성하고 경공업과 소비재 생산을 강조하는 정책을 시도하였으며, 1955년 권력투쟁에서 흐루쇼프에게 밀려 실각하였다."},{"id":"i1467","t":"니키타 흐루쇼프(1955–1964): 1955년 바르샤바조약기구 창설을 통해 동구권 군사동맹 체제를 강화하고, 1956년 공산당 제20차 당대회 비밀연설을 통해 탈스탈린화를 추진하였으며, 1957년 스푸트니크 발사를 통해 우주개발 경쟁을 시작하고, [[1961]] 년 베를린 장벽 건설을 승인하였으며, 1962년 쿠바 미사일 위기에서 미국과 충돌하였다."},{"id":"i1468","t":"레오니드 브레즈네프(1964–1982): 1968년 브레즈네프 독트린을 제시하여 사회주의권 국가에 대한 군사개입 원칙을 선언하고 같은 해 [[체코슬로바키아]] 에 군사개입하였으며, 1972년 미국과 전략무기제한협정(SALT I)을 체결하고, 1975년 헬싱키 최종의정서를 채택하였으며, 1979년 아프가니스탄에 군사개입하였다."},{"id":"i1469","t":"[[유리 안드로포프]] (1982–1984): 1983년 부패 척결과 노동규율 강화 등 제한적 개혁을 시도하고 경제 효율성 제고 정책을 추진하였다."},{"id":"i1470","t":"[[콘스탄틴 체르넨코]] (1984–1985): 기존의 보수적 노선을 유지하며 체제 변화를 억제하고 현상 유지 정책을 지속하였다."},{"id":"i1471","t":"미하일 고르바초프(1985–1991): 1985년 페레스트로이카 정책을 추진하고 1986년 글라스노스트 정책을 실시하였으며, [[1987]] 년 미국과 INF 조약을 체결하고, 1989년 동유럽에 대한 군사개입을 포기하는 이른바 ‘신사고 외교’를 추진하였으며, 1991년 소련 해체로 이어지는 체제 변화를 겪었다."},{"id":"i1472","t":"[[보리스 옐친]] (1991–1999): 1992년 시장경제 전환을 위한 충격요법 개혁을 추진하고, 1993년 헌정위기를 거쳐 신헌법을 제정하여 강한 대통령제를 확립하였으며, 1994년 제1차 체첸 전쟁을 수행하였다."},{"id":"i1473","t":"[[블라디미르 푸틴]] (2000–2008): 2000년 제2차 체첸 전쟁을 종결하고 중앙집권적 국가권력을 강화하였으며, 2001년 미국의 9·11 테러 이후 대테러 협력을 선언하였다."},{"id":"i1474","t":"드미트리 메드베데프(2008–2012): 2008년 러시아-조지아 전쟁을 수행하고 남오세티야와 [[압하지야]] 의 독립을 승인하였다."},{"id":"i1475","t":"블라디미르 푸틴(2012–현재): 2014년 크림반도를 병합하고 같은 해 유라시아경제연합(EAEU) 창설을 추진하였으며, 2015년 시리아 내전에 군사개입하고, 2020년 헌법 개정을 통해 장기집권 기반을 마련하였으며, [[2022]] 년 우크라이나 침공을 단행하였다."}]},{"id":"i1476","title":"탈냉전기 러시아 주요 대외정책","note":"","items":[{"id":"i1477","t":"[[1991]]년 12월 25일 보리스 옐친 대통령은 소련 해체와 함께 러시아연방을 출범시켰으며, 러시아는 소련의 법적 승계국으로서 유엔 안전보장이사회 상임이사국 지위와 핵전력을 승계하였다."},{"id":"i1478","t":"1992년 5월 23일 보리스 옐친 대통령은 미국·우크라이나·벨라루스·카자흐스탄과 함께 [[리스본]] 의정서에 서명하였으며, 이를 통해 구소련 핵보유 공화국들의 START I 승계와 비핵화를 추진하였다. 이 의정서는 [[1994]]년 12월 5일 발효되었다."},{"id":"i1479","t":"1993년 1월 3일 보리스 옐친 대통령은 [[조지 H. W. 부시]] 대통령과 제2차 전략무기감축조약에 서명하여 다탄두(MIRV) 대륙간탄도미사일 감축에 합의하였으나, 이 조약은 결국 발효되지 못하였다."},{"id":"i1480","t":"1994년 12월 5일 [[보리스 옐친]] 대통령은 미국·영국과 함께 [[부다페스트]] 각서를 체결하여 우크라이나·벨라루스·[[카자흐스탄]]의 비핵화에 대한 대가로 이들 국가의 독립·주권·영토보전을 존중할 것을 약속하였다."},{"id":"i1481","t":"1997년 5월 27일 보리스 옐친 대통령은 [[NATO]]-러시아 기본문서 체결을 통해 북대서양조약기구 와의 협력체제를 구축하였으며, 이는 옐친 시기 친서방 외교의 대표적 성과로 평가된다."},{"id":"i1482","t":"2001년 9·11 테러 이후 [[블라디미르 푸틴]] 대통령은 미국의 대테러전쟁을 지지하고 아프가니스탄 작전에 협력함으로써 냉전 이후 미·러 협력관계를 일시적으로 강화하였다."},{"id":"i1483","t":"[[2002]]년 5월 24일 블라디미르 푸틴 대통령은 조지 W. 부시 대통령과 전략공격무기감축조약을 체결하여 실전배치 전략핵탄두를 1,700~2,200기로 감축하기로 합의하였다."},{"id":"i1484","t":"2008년 8월 8일부터 12일까지 [[드미트리 메드베데프]] 대통령은 조지아와 전쟁을 수행하였으며, 전쟁 이후 압하지야 와 남오세티야 의 독립을 승인하여 러시아의 영향력 확대를 시도하였다."},{"id":"i1485","t":"2010년 4월 8일 드미트리 메드베데프 대통령은 [[버락 오바마]] 대통령과 신전략무기감축조약에 서명하여 배치 전략핵탄두를 1,550기로 제한하는 탈냉전기 최대 규모의 핵군축 합의를 이끌어냈다."},{"id":"i1486","t":"2014년 3월 18일 블라디미르 푸틴 대통령은 [[크림반도]]를 병합하였으며, 이를 계기로 러시아와 서방 간의 대립이 본격적으로 심화되었다."}]},{"id":"i1487","title":"구소련권 국가들의 대외정책 성향","note":"최근 구 소련 출신 국가들 사이에서 가장 중요한 변화는 몰도바의 독립국가연합 탈퇴 절차 본격화이다. 2026년 몰도바 정부는 CIS 창설협정과 헌장 등 핵심 조약 탈퇴를 승인하면서 공식적인 탈퇴 절차를 개시하였고, 규정상 약 1년 후 완전 탈퇴가 예상된다. 이러한 움직임은 단순한 제도적 변화가 아니라, 2022년 러시아의 우크라이나 침공 이후 동유럽 전반의 안보 환경이 급격히 변화한 데 따른 것이다. 몰도바는 자국 내 친러 분리지역인 트란스니스트리아 문제로 인해 러시아의 군사적 영향력을 직접적으로 체감하고 있으며, 이에 따라 러시아 중심 질서에서 이탈하고 EU 중심 질서로 편입하려는 전략을 강화하고 있다. 따라서 최근 CIS 이탈 움직임은 친서방 재편과 러시아 영향권 약화라는 구조적 변화의 일환으로 이해된다.","items":[{"id":"i1488","t":"에스토니아는 CIS에 처음부터 가입하지 않고 EU([[2004]]년)·NATO(2004)에 가입한 대표적 친서방 국가이다."},{"id":"i1489","t":"[[라트비아]]는 CIS 미가입 상태에서 EU(2004)·NATO(2004)에 편입된 친서방 국가이다."},{"id":"i1490","t":"리투아니아는 CIS에 참여하지 않고 EU(2004)·NATO([[2004]])에 가입한 강경 친서방 국가이다."},{"id":"i1491","t":"[[우크라이나]]는 CIS 창설에는 참여했으나 정식 회원이 아니고 현재 사실상 탈퇴 상태에서 친서방 노선을 취하고 있다."},{"id":"i1492","t":"[[조지아]]는 CIS에 가입하였다가 2008년 탈퇴하고 친서방 노선을 강화하였다."},{"id":"i1493","t":"[[몰도바]]는 CIS 회원국 지위는 유지하나 최근 다수 협정을 폐기하며 사실상 이탈한 친서방 성향을 보이고 있다."},{"id":"i1494","t":"[[러시아]]는 CIS 창설 주도국으로 현재도 핵심 회원국이며 구소련 영향권 유지 정책을 추진한다."},{"id":"i1495","t":"[[벨라루스]]는 CIS 핵심 회원국으로 러시아와 밀착된 친러 외교를 유지한다."},{"id":"i1496","t":"아르메니아는 CIS 회원국으로 전통적으로 [[러시아]]에 안보를 의존하면서도 최근 일부 균형외교를 시도한다."},{"id":"i1497","t":"카자흐스탄은 CIS 회원국으로 러시아·[[중국]]·서방 간 균형외교를 추진한다."},{"id":"i1498","t":"우즈베키스탄은 CIS 회원국으로 자주성을 중시하는 [[실용]]적 균형외교를 전개한다."},{"id":"i1499","t":"[[투르크메니스탄]]은 CIS 정회원이 아닌 준회원으로 영세중립 정책을 유지한다."},{"id":"i1500","t":"키르기스스탄은 CIS 회원국으로 러시아 의존적이면서도 제한적 [[균형]]외교를 병행한다."},{"id":"i1501","t":"[[타지키스탄]]은 CIS 회원국으로 안보 측면에서 러시아 의존도가 높은 국가이다."},{"id":"i1502","t":"[[아제르바이잔]]은 CIS 회원국으로 에너지 외교를 기반으로 한 실용적 균형외교를 수행한다."}]},{"id":"i1503","title":"러시아 주도 다자협력","note":"","items":[{"id":"i1504","t":"Commonwealth of Independent States는 1991년 12월 [[벨라베자]] 협정을 통해 창설되고 같은 달 알마아타 선언으로 확대·확인되었으며, 이후 민스크 협정을 통해 제도적 기반을 갖추며 구소련 국가 간 협력을 유지하는 협의체로 출범하였다."},{"id":"i1505","t":"Commonwealth of Independent States는 현재 Russia, Belarus, Kazakhstan, Uzbekistan, Armenia, Kyrgyzstan, Tajikistan, Azerbaijan이 안정적으로 참여하고 있으며, [[Moldova]]는 탈퇴 절차 진행 중이고 Ukraine와 Georgia는 사실상 이탈하였다."},{"id":"i1506","t":"Collective Security Treaty Organization는 1992년 집단안보조약을 기반으로 [[2002]]년 정식 기구화된 러시아 주도의 군사동맹이다."},{"id":"i1507","t":"Collective Security Treaty Organization는 현재 Russia, Belarus, Kazakhstan, Kyrgyzstan, Tajikistan이 실질적으로 참여하며, [[Armenia]]는 참여를 동결하여 사실상 이탈 상태이다."},{"id":"i1508","t":"Eurasian Economic Union는 [[2015]]년 출범한 경제통합체로 관세동맹과 단일시장 구축을 목표로 한다."},{"id":"i1509","t":"Eurasian Economic Union는 현재 Russia, Belarus, Kazakhstan, [[Armenia]], Kyrgyzstan이 참여하는 고정된 5개국 체제이다."},{"id":"i1510","t":"Shanghai Cooperation Organization는 [[2001]]년 창설된 유라시아 다자협력기구로 안보뿐 아니라 경제·에너지·교통·문화 협력까지 포함하는 포괄적 협력체이다."},{"id":"i1511","t":"Shanghai Cooperation Organization는 현재 China, Russia, Kazakhstan, Kyrgyzstan, Tajikistan, Uzbekistan, India, Pakistan, Iran, [[Belarus]]이 참여하는 10개국 체제이다."},{"id":"i1512","t":"BRICS는 2009년 [[러시아]]의 Yekaterinburg에서 브라질·러시아·인도·중국 정상들이 참여한 제1차 정상회의를 통해 출범한 신흥국 협의체이다."},{"id":"i1513","t":"BRICS는 현재 Brazil, Russia, India, China, South Africa, Saudi Arabia, United Arab Emirates, Iran, Egypt, Ethiopia 등으로 확대되었으며, 2014년 설립이 합의되고 [[2015]]년 출범한 New Development Bank를 통해 대안적 개발금융 기능을 수행한다."}]}]},{"id":"i1514","title":"유럽","secs":[{"id":"i1515","title":"유럽 강대국 상호관계 주요 사건","note":"","items":[{"id":"i1516","t":"1947년 3월 4일 영국과 [[프랑스]]는 제2차 세계대전 이후 독일의 재침략 방지를 명분으로 《됭케르크 조약(Treaty of Dunkirk)》을 체결하였으며, 이는 전후 서유럽 방위협력의 출발점이 되었다."},{"id":"i1517","t":"1948년 3월 17일 영국·프랑스·벨기에·네덜란드·룩셈부르크는 《브뤼셀 조약(Brussels Treaty)》을 체결하여 서유럽동맹(Western Union)을 창설하였고, 이는 이후 NATO와 [[서유럽연합(WEU)]]의 기반이 되었다."},{"id":"i1518","t":"1949년 4월 4일 영국·프랑스 등 서유럽 국가들은 미국·캐나다와 함께 NATO를 창설하였으며, 같은 해 [[5]]월 23일 서독(Federal Republic of Germany)이 수립되고 [[10]]월 7일 동독(German Democratic Republic)이 건국되면서 독일 분단과 유럽 냉전질서가 본격적으로 형성되었다."},{"id":"i1519","t":"1951년 4월 18일 프랑스·서독·이탈리아·벨기에·네덜란드·룩셈부르크는 《유럽석탄철강공동체(ECSC)》 창설조약인 [[파리조약(Treaty of Paris)]]에 서명하였으며, 이는 프랑스와 서독 간 화해 및 유럽통합의 출발점이 되었다."},{"id":"i1520","t":"[[1955]]년 5월 서독의 NATO 가입이 발효되자, 소련과 동유럽 사회주의 국가들은 [[1955]]년 5월 14일 WTO를 창설하여 대응하였으며, 유럽은 군사적으로 동서 양대 진영으로 완전히 고착되었다."},{"id":"i1521","t":"1963년 1월 22일 프랑스 대통령 Charles de Gaulle 와 서독 총리 [[Konrad Adenauer]] 는 [[엘리제(Élysée)]]을 체결하여 외교·국방·청소년 교류 협력을 제도화하였고, 이는 이후 프랑스-독일 협력축의 핵심 기반이 되었다."},{"id":"i1522","t":"[[1972]]년 12월 21일 서독과 동독은 《동·서독 기본조약(Basic Treaty)》을 체결하여 상호 관계를 정상화하였으며, 서독 총리 [[Willy Brandt]]의 동방정책(Ostpolitik)은 동서 진영 긴장완화의 중요한 계기가 되었다. 이후 동서독은 [[1973]]년 9월 18일 동시에 UN에 가입하였다."},{"id":"i1523","t":"[[1975]]년 8월 1일 영국·프랑스·서독·소련 등 35개국은 《헬싱키 최종의정서(Helsinki Final Act)》를 채택하여 유럽안보협력회의(CSCE)를 출범시켰으며, 국경 불가침과 인권 존중 원칙을 동시에 확인함으로써 동서관계 완화(detente)의 상징이 되었다."},{"id":"i1524","t":"1989년 11월 9일 베를린장벽 붕괴 이후 독일 통일 논의가 급속히 진행되었고, 1990년 9월 12일 [[미국·소련·영국·프랑스]] 및 동·서독은 《2+4 조약(Treaty on the Final Settlement with Respect to Germany)》을 체결하였다. 이어 1990년 10월 3일 독일 통일이 이루어지면서 냉전기 유럽 분단체제가 종식되었다."},{"id":"i1525","t":"[[1992]]년 2월 7일 프랑스와 [[독일]]의 주도로 《마스트리히트 조약(Maastricht Treaty)》이 체결되어 유럽연합(EU)이 창설되었다."}]},{"id":"i1526","title":"1930년대 독일 대외정책 사례","note":"","items":[{"id":"i1527","t":"독일–오스트리아 관세동맹 추진(1931.3): 독일은 1931년 3월 오스트리아와 관세동맹 계획을 발표하여 [[베르사유]]·생제르맹 체제가 금지한 독일–오스트리아 결합을 경제적으로 우회하려 하였다."},{"id":"i1528","t":"국제연맹 탈퇴(1933.10): 히틀러는 1933년 10월 독일을 국제연맹과 세계군축회의에서 탈퇴시켜 전후 국제질서의 구속을 공식적으로 거부하였다."},{"id":"i1529","t":"독일 재군비 선언(1935): 독일의 재군비 선언(1935.3)에 대응하여 영국·프랑스·이탈리아는 1935년 4월 [[스트레자]] 전선을 형성해 베르사유 체제 유지를 확인하였다."},{"id":"i1530","t":"영독 해군협정 체결(1935.6): 독일은 1935년 6월 영국과 해군협정을 체결하여 해군 증강에 대해 영국의 사실상 승인을 획득하였다."},{"id":"i1531","t":"로마–베를린 추축 형성(1936.10): 독일은 1936년 10월 [[이탈리아]]와 로마–베를린 추축을 선언하여 파시스트 국가 간 외교·군사 협력축을 구축하였다."},{"id":"i1532","t":"반코민테른 협정 체결(1936.11): 독일은 1936년 11월 [[일본]]과 반코민테른 협정을 체결하여 소련과 국제공산주의에 공동 대응하는 외교노선을 확립하였다."},{"id":"i1533","t":"오스트리아 병합(1938.3): 독일은 1938년 3월 오스트리아를 병합하여 독일 민족 통합을 실현하였다."},{"id":"i1534","t":"뮌헨 협정(1938.9): 독일은 1938년 9월 뮌헨 협정을 통해 [[체코슬로바키아]]의 수데텐란트를 획득하였다."},{"id":"i1535","t":"체코 병합(1939.3): 독일은 1939년 3월 보헤미아·모라비아를 점령하여 체코를 병합하고 체코슬로바키아를 해체하였다."},{"id":"i1536","t":"독소 불가침조약 체결(1939.8): 독일은 1939년 8월 소련과 독소 불가침조약을 체결하여 [[폴란드]] 침공에 앞서 동부전선의 전략적 위험을 제거하였다."}]},{"id":"i1537","title":"이탈리아 역사","note":"","items":[{"id":"i1538","t":"1861.03.17 이탈리아 왕국 성립: 이탈리아 통일 운동(리소르지멘토)의 결과로 사르데냐 왕국의 국왕 비토리오 엠마누엘 2세가 이탈리아 국왕에 즉위하면서 이탈리아 왕국이 출범하였다."},{"id":"i1539","t":"1870.09.20 로마 점령: 로마 점령 사건을 통해 이탈리아군이 교황령의 수도 로마를 점령하였다. 로마는 1871년 이탈리아의 수도가 되었으며 이탈리아 통일이 사실상 완성되었다."},{"id":"i1540","t":"1882.05.20 삼국동맹 체결: 이탈리아는 독일·오스트리아-헝가리와 함께 삼국동맹을 체결하였다. 이를 통해 유럽의 세력균형 체제에 본격적으로 참여하게 되었다."},{"id":"i1541","t":"1915.04.26 런던조약 체결 및 제1차 세계대전 참전: 런던조약에 따라 이탈리아는 독일·오스트리아-헝가리 진영을 떠나 영국·프랑스·러시아가 이끄는 연합국 측에 가담하였다."},{"id":"i1542","t":"1922.10.28 로마 진군: 로마 진군을 계기로 베니토 무솔리니가 총리에 임명되었다. 이후 이탈리아는 세계 최초의 파시스트 정권으로 전환되었다."},{"id":"i1543","t":"1935.10 에티오피아 침공: 이탈리아는 에티오피아를 침공하여 식민지 제국 건설을 시도하였다. 국제연맹은 제재를 가했지만 이를 막지 못해 집단안보체제의 한계를 드러냈다."},{"id":"i1544","t":"1940.06.10 제2차 세계대전 참전: 무솔리니 정권은 독일 편에서 전쟁에 참전하였다. 이후 북아프리카와 발칸반도 전선에서 패배를 거듭하며 정권 붕괴의 길로 들어섰다."},{"id":"i1545","t":"1946.06.02 공화국 수립: 국민투표 결과 왕정이 폐지되고 이탈리아 공화국이 수립되었다. 사보이 왕조는 퇴위하였고 현대 이탈리아 국가체제가 시작되었다."},{"id":"i1546","t":"1957.03.25 로마조약 체결: 이탈리아를 포함한 서유럽 6개국이 로마조약을 체결하여 유럽경제공동체(EEC)와 유럽원자력공동체(Euratom)를 창설하였다."},{"id":"i1547","t":"1992.02.07 마스트리히트 조약 서명: 이탈리아는 마스트리히트 조약에 참여하여 유럽연합(EU) 창설에 기여하였다."}]},{"id":"i1548","title":"바티칸시국","note":"","items":[{"id":"i1549","t":"교황령의 성립(754년): 교황 Stephen II는 프랑크 왕국의 피핀 3세(Pepin the Short)로부터 영토를 기증받아 교황령(Papal States)을 수립하였고, 이후 교황은 약 1,100년 동안 종교 지도자이자 세속 군주로서 통치하였다."},{"id":"i1550","t":"교황령의 소멸(1870년): 로마 점령(Capture of Rome) 으로 이탈리아 왕국이 교황령을 병합하면서 교황령이 소멸하였고, 교황은 자신을 “바티칸의 포로\"라고 부르며 이탈리아 정부와 대립하였다."},{"id":"i1551","t":"라테란 조약(Lateran Treaty)과 바티칸 시국 수립(1929년): 교황청과 Italy 정부는 라테란 조약(Lateran Treaty)을 체결하여 로마 문제를 해결하였고, 바티칸 시국(Vatican City State)이 독립국으로 탄생하였다."},{"id":"i1552","t":"대한민국과 교황청의 수교(1963년): 대한민국과 교황청은 공식 외교관계를 수립하였다."},{"id":"i1553","t":"유엔(United Nations) 상임옵서버국 지위 획득(1964년): 교황청은 유엔(United Nations)에서 상임옵서버국(Permanent Observer State) 지위를 획득하였으며, 현재까지도 유엔 회원국에는 가입하지 않고 있다."},{"id":"i1554","t":"핵확산금지조약(Treaty on the Non-Proliferation of Nuclear Weapons, NPT) 가입(1971년): 교황청은 핵확산금지조약(NPT)에 가입하여 핵무기 비확산과 핵군축을 지지하는 입장을 공식화하였다."},{"id":"i1555","t":"포괄적핵실험금지조약(Comprehensive Nuclear-Test-Ban Treaty, CTBT) 비준(1996년): 교황청은 포괄적핵실험금지조약(CTBT)을 비준하여 모든 핵실험의 금지를 지지하였다."},{"id":"i1556","t":"대인지뢰금지협약(Ottawa Treaty 또는 Mine Ban Treaty) 가입(1997년): 교황청은 대인지뢰금지협약에 가입하여 대인지뢰의 사용·생산·비축 금지를 지지하였다."},{"id":"i1557","t":"생물무기금지협약(Biological Weapons Convention, BWC) 가입(1999년): 교황청은 생물무기금지협약(BWC)에 가입하여 생물무기의 개발·생산·비축 금지 원칙을 수용하였다."},{"id":"i1558","t":"화학무기금지협약(Chemical Weapons Convention, CWC) 가입(2001년): 교황청은 화학무기금지협약(CWC)에 가입하여 화학무기의 전면 폐기를 지지하였다."},{"id":"i1559","t":"집속탄금지협약(Convention on Cluster Munitions, CCM) 가입(2008년): 교황청은 집속탄금지협약(CCM)에 서명하고 이후 비준하여 집속탄의 사용·생산·비축 금지에 동참하였다."},{"id":"i1560","t":"핵무기금지조약(Treaty on the Prohibition of Nuclear Weapons, TPNW) 가입(2017년): 교황청은 핵무기금지조약(TPNW)에 가장 먼저 서명한 국가들 가운데 하나가 되었으며, 이후 비준을 완료하여 핵무기의 개발·생산·보유·사용 금지를 지지하였다."},{"id":"i1561","t":"영세중립 정책 채택(1929년): 교황청은 라테란 조약(Lateran Treaty)을 통해 국제 분쟁에서 영구적인 중립성을 유지할 것을 선언하였으며, 이후 군사동맹이나 전쟁에 참여하지 않고 평화 중재와 인도주의 외교를 추구해 왔다."}]},{"id":"i1562","title":"덴마크의 역사 및 대외정책사","note":"최근 미국과 덴마크는 북극 전략 요충지인 그린란드를 둘러싸고 외교적 갈등을 겪었다. 트럼프 행정부는 그린란드의 군사·자원·북극 항로 통제 가치를 이유로 미국의 영향력 확대 의사를 공개적으로 표명하며 관세 인상 등 경제적 압박을 가하였으나, 덴마크와 그린란드 자치정부는 영토와 주권은 협상 대상이 아니라는 입장을 명확히 하며 이를 거부하였다. 이러한 긴장은 경제 영역으로도 확산되어 덴마크의 주요 연기금은 미국 자산 비중을 축소하고 미국 국채를 매각하였으며, 이는 미 국채 수요 감소와 금리 상승 압력을 통해 미국의 재정 조달 비용을 높이고 달러 신뢰도와 금융시장 안정성에 부담을 줄 수 있다는 점에서 미국 경제에도 일정한 타격을 가하는 조치로 평가된다.","items":[{"id":"i1563","t":"1814년 1월 14일, 덴마크는 나폴레옹 전쟁 패전 결과 체결된 킬 조약(Treaty of Kiel)에 따라 [[노르웨이]]를 스웨덴에 할양하고 북유럽 지역 강국 지위를 상실하였다."},{"id":"i1564","t":"[[1815]]년, 빈 회의(Congress of Vienna)에서 덴마크는 열강 체제에서 배제된 채 완충적 중소국으로 재편되어 유럽 세력균형 질서에 편입되었다."},{"id":"i1565","t":"1849년 6월 5일, 덴마크는 6월 헌법을 제정하여 [[절대왕정]]을 폐지하고 입헌군주제 및 의회정치를 확립하였다."},{"id":"i1566","t":"1864년 10월 30일, 덴마크는 제2차 슐레스비히 전쟁 패전 후 체결된 빈 조약(Treaty of Vienna)으로 슐레스비히· [[홀슈타인]]·라우엔부르크를 프로이센·오스트리아에 할양하여 영토와 국력이 크게 약화되었다."},{"id":"i1567","t":"1914~1918년, 덴마크는 제1차 세계대전 동안 엄격한 [[중립]] 정책을 유지하여 참전을 회피하고 소국 생존전략으로서 중립외교 노선을 공고히 하였다."},{"id":"i1568","t":"[[1940]]년 4월 9일, 독일이 덴마크를 침공하자 덴마크는 단기간 내 항복하였고 이후 나치 독일의 군정 점령하에 들어갔다."},{"id":"i1569","t":"1945년 [[5]]월 5일, 덴마크는 해방되었으며 이후 전통적 중립정책을 포기하고 집단안보 중심의 대서양 협력 노선으로 외교전략을 전환하였다."},{"id":"i1570","t":"[[1949]]년 4월 4일, 덴마크는 북대서양조약(North Atlantic Treaty) 체결과 함께 NATO 창설 회원국으로 가입하여 미국 주도의 서방 집단방위체제에 편입되었다."},{"id":"i1571","t":"1973년 1월 1일, 덴마크는 1972년 EC 가입조약(Act of Accession) 발효에 따라 [[영국]]·아일랜드와 함께 유럽공동체(EC)에 가입하여 유럽 경제통합 과정에 본격 참여하였다."},{"id":"i1572","t":"1993년, 덴마크는 에든버러 합의(Edinburgh Agreement)에 따라 유로화·공동국방·사법내무 분야에서 opt-out( [[선택적]] 배제)을 인정받는 조건으로 마스트리흐트 조약을 비준하고 유럽연합(EU) 회원국 지위를 확정하였다."}]},{"id":"i1573","title":"한불관계/프랑스 주요 대외정책 사례","note":"2026년 4월 3일 대한민국의 이재명 대통령과 프랑스의 에마뉘엘 마크롱 대통령은 수교 140주년을 맞아 정상회담을 갖고 양국 관계를 기존 ‘21세기 포괄적 동반자 관계’에서 글로벌 전략적 동반자 관계로 격상하며 국방·안보, 교역·투자, 원자력·해상풍력 등 에너지 협력, AI·반도체·양자·우주 등 첨단산업, 문화·인적교류 전반에서 협력을 심화·확대하기로 합의하였다. 양측은 중동 정세와 에너지·경제 충격 대응에 대한 정책 공조, 공급망 안정 및 해상교통로 안전 확보 협력에도 뜻을 같이했으며, 다수의 협정 개정과 MOU 체결 및 공동성명 채택을 통해 협력의 제도적 기반을 강화하였다. 또한 인태지역 안보협력과 국제규범 기반 질서 수호, 해양·개발협력 등 글로벌 현안 공조를 확인하고, 교역 확대 및 인적교류 증진을 추진하는 한편, 마크롱 대통령의 G7 정상회의 초청과 향후 정상외교 지속에도 합의하였다.","items":[{"id":"i1574","t":"[[병인양요]] (1866): 1866년 조선에서 대원군의 강력한 천주교 박해로 프랑스 선교사들이 처형되자, 프랑스는 이를 명분으로 군함을 보내 강화도를 공격하였다. 그러나 조선군의 저항과 보급 문제로 인해 프랑스군은 한양 진입에 실패하고 철수하였으며, 이 사건은 서구 열강과의 최초 무력 충돌 중 하나로서 이후 개항 압력의 계기가 되었다."},{"id":"i1575","t":"조선–프랑스 수교(수호통상조약) 체결 ([[1886]]년): [[1886]]년 조선과 프랑스는 통상수호조약을 체결하여 공식 외교관계를 수립하였다. 이 조약은 치외법권, 영사재판권, 무역 허용 등을 포함한 불평등적 성격을 지니면서도, 조선이 서구 열강과 맺은 근대적 외교·통상체제의 일환으로서 국제사회 편입을 상징하는 의미를 갖는다."},{"id":"i1576","t":"던케르크 조약 (1947): 제2차 세계대전 이후 프랑스와 [[영국]]은 독일의 재부상을 견제하기 위해 상호방위를 약속하는 던케르크 조약을 체결하였다. 이는 서유럽 집단안보체제의 출발점이 되었고, 이후 [[브뤼셀]] 조약(1948)과 북대서양조약기구 창설로 이어지는 유럽 안보협력의 기반을 형성하였다."},{"id":"i1577","t":"[[슈만]] 플랜 발표 (1950): 1950년 [[슈만]]은 프랑스와 서독의 석탄·철강 산업을 공동 관리하자는 계획을 발표하였다. 이는 전쟁의 원인이 되었던 중공업 자원을 공동 통제함으로써 전쟁을 구조적으로 불가능하게 만들려는 구상이었으며, 이후 유럽석탄철강공동체(ECSC) 창설로 이어져 유럽통합의 출발점이 되었다."},{"id":"i1578","t":"프랑스 핵개발 성공 ([[1960]]년): 프랑스는 [[1960]]년 알제리 사하라 사막에서 첫 핵실험에 성공하여 핵보유국이 되었다. 이는 미국·소련 중심의 핵질서에서 벗어나 독자적 핵억지력(Force de frappe)을 구축하려는 전략적 선택이었으며, 프랑스의 외교·안보에서 ‘전략적 자율성’ 노선을 상징하는 핵심 사건이다."},{"id":"i1579","t":"[[엘리제]] 조약 체결 (1963): 1963년 프랑스와 독일은 [[엘리제]] 조약을 체결하여 정치·외교·군사·청년교류 등 다양한 분야에서 정례적 협력을 제도화하였다. 이는 역사적 적대 관계를 청산하고 유럽통합의 핵심 축인 프랑스–독일 협력을 형성하는 계기가 되었다."},{"id":"i1580","t":"NATO 군사기구 탈퇴 (1966): [[드골]]은 미국 중심의 군사통제에 반발하여 북대서양조약기구의 통합군사기구에서 탈퇴하였다. 다만 NATO 자체를 탈퇴한 것은 아니며 정치적 회원국 지위는 유지하였다. 이는 프랑스의 독자적 국방정책과 전략적 자율성을 강조하는 ‘[[드골]]주의’ 외교노선의 대표적 사례이다."},{"id":"i1581","t":"공석의 위기 (1965~1966): 프랑스는 유럽공동체(EEC)에서 다수결 확대에 반대하여 각료이사회 참석을 거부하는 ‘공석 정책’을 시행하였다. 이 위기는 [[룩셈부르크]] 타협(1966)으로 해결되었으며, 회원국의 중대한 이익이 걸린 사안에서는 사실상 만장일치가 요구되는 관행이 형성되어 국가주권이 일정 부분 유지되었다."},{"id":"i1582","t":"NPT 가입 ([[1992]]년): 프랑스는 [[1992]]년 핵확산금지조약에 가입하여 공식적으로 핵확산 방지 체제에 참여하였다. 프랑스는 기존 핵보유국 지위를 유지하면서도 비확산·군축 노력에 동참하겠다는 입장을 표명하였으며, 이는 탈냉전기 국제핵질서에의 적극적 편입을 의미한다."},{"id":"i1583","t":"[[쌩말로]] 선언 (1998): 1998년 프랑스와 영국은 [[쌩말로]] 선언을 통해 유럽연합이 독자적 군사행동 능력을 갖추어야 한다는 데 합의하였다. 이는 미국과 NATO에 의존하던 유럽 안보 구조에서 벗어나 EU 차원의 공동안보·방위정책 발전을 촉진한 전환점이 되었다."},{"id":"i1584","t":"[[쾰른]] 정상회담 (1999): 1999년 유럽연합 [[쾰른]] 정상회담에서는 공동안보·방위정책의 구체적 추진이 결정되었으며, 고위대표직 신설과 위기관리 능력 강화가 합의되었다. 이는 [[쌩말로]] 선언의 구상을 제도화한 것으로, EU가 군사·안보 영역에서도 행위자로 등장하는 계기를 마련하였다."},{"id":"i1585","t":"한–프랑스 21세기 포괄적 동반자 관계 ([[2004]]년): [[2004]]년 대한민국과 프랑스는 ‘21세기 포괄적 동반자 관계’를 선언하여 정치·경제·과학기술·문화 등 전 분야에서 협력을 확대하였다. 이는 양국 관계를 단순 외교관계에서 전략적 협력 관계로 격상시키는 계기가 되었으며, 정상회담 및 고위급 교류가 정례화되었다."},{"id":"i1586","t":"한–EU FTA 잠정 발효 ([[2011]]년): [[2011]]년 대한민국과 유럽연합 간 자유무역협정이 잠정 발효되면서 관세 철폐와 서비스·투자 자유화가 확대되었다. 이로 인해 프랑스를 포함한 EU 국가들과의 교역이 크게 증가하였고, 자동차·기계·화학 등 산업 전반에서 경제협력이 심화되었다. 이후 [[2015]]년 정식 발효되었다."},{"id":"i1587","t":"한–프랑스 글로벌 [[전략적]] 동반자 관계 격상 (2026): 2026년 4월 3일 대한민국과 프랑스 정상회담에서 양국 관계를 기존의 ‘21세기 포괄적 동반자 관계’에서 글로벌 [[전략적]] 동반자 관계로 격상하였다. 이를 통해 안보·방산·경제·첨단기술·기후변화 등 전 분야에서 협력을 확대하고, 국제무대에서의 공조를 강화하는 방향으로 관계가 발전하였다."}]},{"id":"i1588","title":"유럽통합사","note":"최근 유럽연합(EU)과 미국 간 관계는 전통적 동맹임에도 불구하고 통상·안보 정책을 둘러싼 인식 차이로 긴장 국면을 보이고 있다. 미국이 관세 인상과 자국 우선주의적 산업정책, 공급망 재편 압박 등을 통해 동맹국에도 강경한 통상 조치를 취하자, EU 내부에서는 이를 ‘동맹에 대한 일방주의’로 비판하며 미국 의존을 줄이고 전략적 자율성을 강화해야 한다는 목소리가 커지고 있다. 이에 따라 EU는 미국과의 협력은 유지하되 무역·기술·안보 분야에서 조건부 협력과 방어적 통상수단을 병행하는 신중한 태도를 보이고 있으며, 동시에 대외경제 관계를 다변화하는 방향으로 정책을 전환하고 있다. 이러한 맥락에서 EU는 인도와의 자유무역협정(FTA) 협상을 적극 추진하여 거대 신흥시장과의 공급망·시장 연계를 강화하고 있으며, 이는 미국 중심 질서에 대한 완충 장치를 마련하고 독자적 경제권을 확대하려는 전략적 선택으로 평가된다. 결국 최근 흐름은 EU가 미국과의 ‘동맹 유지’와 ‘자율성 확대’를 동시에 추구하면서, 인도 등 제3국과의 협력을 통해 균형외교와 경제안보를 병행하는 방향으로 재편되고 있음을 보여준다.","items":[{"id":"i1589","t":"1951.04.18 체결되고 1952.07.23 발효된 [[파리]]조약에 따라 프랑스·서독·이탈리아·벨기에·네덜란드·룩셈부르크 6개국은 유럽석탄철강공동체(ECSC)를 창설하여 석탄·철강 산업을 공동 관리함으로써 전쟁 억지와 유럽통합을 개시하였다."},{"id":"i1590","t":"1957.03.25 체결되고 1958.01.01 발효된 로마조약에 따라 [[유럽경제공동체(EEC)]]와 유럽원자력공동체(Euratom)가 설립되어 관세동맹과 공동시장 형성이 추진되었다."},{"id":"i1591","t":"1965.04.08 체결되고 1967.07.01 발효된 합병조약([[브뤼셀]]조약)에 따라 세 공동체의 집행기관이 통합되어 단일 제도 구조의 유럽공동체(EC)가 성립하였다."},{"id":"i1592","t":"1973.01.01 발효된 가입조약에 따라 [[영국]]·아일랜드·덴마크가 공동체에 가입하면서 최초의 확대가 이루어져 통합 범위가 서유럽 전역으로 확장되었다."},{"id":"i1593","t":"1979.06.07~06.10, [[유럽의회]] 의원 직선제가 최초로 실시되어 공동체의 민주적 정당성이 제도적으로 강화되었다."},{"id":"i1594","t":"1986.02 체결되고 1987.07.01 발효된 단일유럽의정서에 따라 1992년까지 단일시장 완성을 목표로 설정하고, [[다수결]] 의사결정이 도입되었으며 공동체 권한이 강화되었다."},{"id":"i1595","t":"1992.02.07 체결되고 1993.11.01 발효된 마스트리히트조약에 따라 유럽연합이 공식 출범하고 경제통화동맹, [[공동외교안보정책]] 및 사법·내무 협력이 3기둥 구조로 제도화되었다."},{"id":"i1596","t":"[[2002]]년.01.01, 유로 지폐와 동전이 공식 유통되면서 단일통화 체제가 완성되고 통화정책 권한이 유럽중앙은행으로 일원화되었다."},{"id":"i1597","t":"2007.12.13 체결되고 2009.12.01 발효된 [[리스본]]조약에 따라 EU는 단일 법인격을 부여받고 유럽이사회 상임의장 및 외교·안보 고위대표 제도가 도입되는 등 제도 개혁이 이루어졌다."},{"id":"i1598","t":"2007년 협상을 시작했다가 2013년 중단되었던 유럽연합(EU)과 [[인도]] 간 자유무역협정(FTA) 협상은 2022년 재개된 이후 공급망 다변화와 전략적 자율성 강화를 목표로 진행되었고, 약 20년 만인 2026년 1월 27일에 협상이 타결되어 서명에 이르렀으나, 각 당사자의 비준 절차가 남아 있어 아직 공식 발효 단계에는 이르지 않았다."}]},{"id":"i1599","title":"유럽 독자 방어체제의 역사와 사례","note":"최근 미국이 북대서양조약기구 탈퇴 가능성을 시사하는 발언을 하면서, 유럽에서는 미국 안보우산에 대한 의존의 한계를 인식하고 전략적 자율성(Strategic Autonomy) 확보 필요성이 급격히 부각되고 있으며, 이에 따라 유럽연합은 공동안보·방위정책(Common Security and Defence Policy, CSDP)과 상설구조적협력(PESCO)을 중심으로 독자적 군사능력 구축과 방위산업 협력을 강화하려는 움직임을 보이고 있다.","items":[{"id":"i1600","t":"유럽방위공동체(European Defence Community, EDC, 1950~1954)는 [[플레벤]] 계획에 따라 유럽 공동군 창설을 시도한 최초의 방위통합 구상이었으나, 1954년 프랑스 의회의 비준 거부로 무산되었다."},{"id":"i1601","t":"서유럽연합(Western European Union, WEU, 1954~2011)은 1954년 [[브뤼셀]] 조약 개정을 통해 집단방위 틀을 마련하였으나 실제 군사력은 북대서양조약기구에 의존하였고, 1990년대 발칸 해상봉쇄 및 보스니아 지원 등 제한적 임무만 수행한 채 상징적 기구로 기능하다가 2011년 해체되었다."},{"id":"i1602","t":"생말로 선언(1998)은 [[영국]]과 프랑스가 유럽연합의 자율적 군사행동 능력 필요성을 공식 선언한 것으로, 유럽이 NATO 의존에서 벗어나 전략적 자율성을 추구하기 시작한 결정적 전환점이 되었다."},{"id":"i1603","t":"쾰른 정상회담(1999)에서 유럽연합 차원의 [[공동안보·방위정책(Common Security and Defence Policy, CSDP)]]창설이 결정되고 WEU 기능이 유럽연합으로 이전됨으로써 유럽 방위협력이 제도적으로 유럽연합 중심 체제로 전환되는 계기가 마련되었다."},{"id":"i1604","t":"유럽연합(European Union, EU)의 공동안보·방위정책(Common Security and Defence Policy, CSDP, 1999~현재)은 [[리스본]] 조약(2007 체결, 2009 발효)에 의해 법적 기반이 확립되었으며, 평화유지, 위기관리, 군사·민간 임무 수행을 통해 EU가 독자적으로 안보 역할을 수행하는 제도적 틀이 되었고 이후 다양한 해외 작전의 기반이 되었다."},{"id":"i1605","t":"콩고에서의 Operation [[Artemis]](2003)는 UN 요청에 따라 민간인 보호와 치안 안정을 위해 수행된 EU의 최초 해외 군사작전으로, EU가 실제 군사력을 활용한 위기관리 행위자로 등장한 출발점이다."},{"id":"i1606","t":"보스니아에서의 European Union Force Althea(EUFOR Althea, 2004~현재)는 북대서양조약기구(North Atlantic Treaty Organization, NATO)의 Stabilisation Force(SFOR) 임무를 EU가 인수하여 수행한 안정화 작전으로, EU가 기존 [[NATO]] 임무를 대체하며 유럽 안보에서 독자적 역할을 확대한 대표 사례이다."},{"id":"i1607","t":"소말리아 해역의 European Union Naval Force Somalia–Operation Atalanta(EUNAVFOR Atalanta, 2008~현재)는 해적 퇴치와 인도적 지원 선박 보호를 목적으로 한 해상안보 작전으로, EU가 [[비전통안보]] 영역까지 군사활동 범위를 확장한 사례이다."},{"id":"i1608","t":"말리의 European Union Training Mission in Mali(EUTM Mali, 2013~)는 현지 군대의 훈련과 역량 강화를 지원하는 군사자문 임무로, EU가 직접 전투가 아닌 [[간접적 군사개입]] 방식도 활용하고 있음을 보여준다."},{"id":"i1609","t":"상설구조적협력(Permanent Structured Cooperation, PESCO, 2017~)는 일부 EU 회원국이 참여하는 상설구조적협력으로, 공동 무기개발과 군사능력 통합을 통해 유럽의 전략적 자율성을 한층 심화시키는 단계에 해당하며, 주요 참여국으로는 [[독일]], 프랑스, 이탈리아, 스페인, 폴란드 등이 있다."}]},{"id":"i1610","title":"NATO의 역사","note":"최근 덴마크령 그린랜드를 둘러싼 미국과 유럽 국가들 간 갈등은 미국 도널드 트럼프 대통령이 그린랜드를 전략적 요충지로 보고 미국 영토화 또는 통제 의지를 반복적으로 표명하면서 촉발됐다. 트럼프 행정부는 그린랜드를 “필수 국가 안보 자산”이라며 구매나 소유를 주장하고, 심지어 군사적 옵션까지 배제하지 않는 발언을 해 덴마크와 그린랜드 정부의 강한 반발을 샀다. 이에 덴마크와 그린랜드는 “그린랜드는 그린란드 주민의 것”이라며 미국의 주장을 거부하고, 나토 틀 안에서 유럽 동맹국들과 함께 북극 지역 안보를 강화하려는 움직임을 보이고 있다. 유럽 국가들은 프랑스, 독일, 스웨덴 등 여러 나라가 순환 배치 형태로 그린랜드에 병력을 보내면서 집단적 안보 협력을 강조하고 있지만, 미국은 이러한 병력 전개가 자국의 계획에 영향을 주지 못한다고 선을 긋는 등 갈등이 지속되고 있다.","items":[{"id":"i1611","t":"1947년 제2차 세계대전 직후 안보 불안 속에서 영국과 프랑스는 독일 재위협과 소련 팽창에 대비하기 위해 [[덩케르크]] 조약을 체결하였다."},{"id":"i1612","t":"1948년 미국 상원은 [[반덴버그]] 결의를 채택하여 미국이 평시에도 집단안보 동맹에 참여할 수 있는 법적 기반을 마련하였다."},{"id":"i1613","t":"1948년 영국·프랑스·벨기에·네덜란드·룩셈부르크는 [[브뤼셀]] 조약을 체결하여 유럽 차원의 집단방위 동맹을 형성하였다."},{"id":"i1614","t":"[[1949]]년 4월 4일 미국·영국·프랑스·덴마크 등 12개국은 북대서양조약을 체결하여 NATO를 창설하였고 덴마크는 창설 회원국으로 가입하였다."},{"id":"i1615","t":"[[1955]]년 서독은 파리협정에 따라 재무장이 허용된 이후 소련의 위협에 대응하고 서방 진영으로의 정치·군사적 통합을 완성하기 위해 NATO에 가입하였다."},{"id":"i1616","t":"1967년 프랑스의 군사기구 탈퇴 결정에 따라 NATO 본부는 파리에서 [[브뤼셀]]로 이전되었다."},{"id":"i1617","t":"1999년 NATO는 유엔 안보리의 명시적 승인 없이 [[코소보]] 공습을 단행하여 인도적 개입과 주권 원칙을 둘러싼 국제적 논쟁을 촉발하였다."},{"id":"i1618","t":"2001년 9·11 테러 이후 NATO는 역사상 처음으로 집단적 자위권 조항인 제[[5]]조를 발동하였다."},{"id":"i1619","t":"NATO는 1999년 폴란드·체코·헝가리 2004년 발트 3국과 루마니아·불가리아·슬로바키아·슬로베니아 2009년 알바니아·크로아티아 2017년 몬테네그로 2020년 [[북마케도니아]]를 순차적으로 가입시켰다."},{"id":"i1620","t":"2023년과 2024년 러시아의 우크라이나 침공 이후 안보 환경 변화 속에서 전통적 중립국이던 핀란드와 [[스웨덴]]이 NATO에 가입하였다."}]}]},{"id":"i1621","title":"중동","secs":[{"id":"i1622","title":"중동지역 관련 주요 출제 포인트","note":"","items":[{"id":"i1623","t":"후세인–맥마흔 서한(1915~1916): 제1차 세계대전 중 영국의 Henry McMahon은 메카의 지도자 Hussein bin Ali에게 “[[오스만제국]]을 상대로 반란을 일으키면 전쟁 후 아랍 독립국가 건설을 도와주겠다”는 취지의 약속을 하였고, 이는 이후 아랍 민족주의 확산의 중요한 계기가 되었다."},{"id":"i1624","t":"사이크스–피코 협정([[1916]]년): 영국의 Mark Sykes와 프랑스의 François Georges-Picot는 오스만 제국 붕괴 이후 중동 지역을 서로 나누어 지배하기로 비밀리에 합의하였다."},{"id":"i1625","t":"[[밸푸어]] 선언(1917): 영국 외무장관 [[밸푸어]]는 팔레스타인 지역에 유대인의 “민족적 고향(national home)” 건설을 지지한다고 선언하였고, 이는 유대인들의 국가 건설 움직임을 국제적으로 지원하는 계기가 되었다."},{"id":"i1626","t":"유엔총회 팔레스타인 분할결의(UNGA Resolution 181, 1947): 유엔총회는 팔레스타인 지역을 유대국가와 아랍국가로 분할하고 [[예루살렘]]은 국제적으로 관리하자는 결의를 채택하였으나, 유대 측은 찬성하고 아랍 측은 반대하면서 이후 전쟁의 직접적 원인이 되었다."},{"id":"i1627","t":"이스라엘 건국(1948): [[David Ben-Gurion]]은 1948년 5월 14일 이스라엘 독립을 선언하였고, 이에 아랍국가들이 반발하면서 중동전쟁이 시작되었다."},{"id":"i1628","t":"제1차 중동전쟁(1948~1949): Israel 건국 직후 이집트·요르단·시리아·이라크 등 아랍국가들이 공격하였으나 이스라엘이 승리하였고, 이 과정에서 약 70만 명 이상의 팔레스타인 난민(이른바,[[나크바]]난민)이 발생하였다."},{"id":"i1629","t":"제2차 중동전쟁(수에즈 전쟁, 1956): 이집트 대통령 Gamal Abdel Nasser가 수에즈 운하를 국유화하자 영국·[[프랑스]]·이스라엘이 군사공격을 실시하였으나, 미국과 소련의 압력으로 철수하면서 유럽 열강의 중동 영향력이 약화되었다."},{"id":"i1630","t":"Palestine Liberation Organization(PLO, 1964): 팔레스타인 독립국가 건설을 목표로 창설된 조직으로, 이후 [[Yasser Arafat]]가 지도자가 되어 무장투쟁과 외교활동을 병행하며 국제사회에서 팔레스타인 주민의 대표기구로 인정받았다."},{"id":"i1631","t":"제3차 중동전쟁(6일전쟁, 1967): 이스라엘은 이집트 대통령 Gamal Abdel Nasser 정부와 시리아·요르단을 상대로 선제공격을 감행하여 단기간에 승리하였고, 가자지구·서안지구·동예루살렘·골란고원·[[시나이]]반도를 점령하였다."},{"id":"i1632","t":"제4차 중동전쟁(욤키푸르 전쟁, 1973): 이집트 대통령 [[Anwar Sadat]]와 시리아는 유대교 명절인 속죄일(Yom Kippur)에 기습공격을 감행하였고, 이후 아랍 산유국들의 석유금수조치로 제1차 석유위기가 발생하였다."},{"id":"i1633","t":"캠프데이비드 협정(1978): 미국 대통령 [[Jimmy Carter]]의 중개 아래 이집트 대통령 Anwar Sadat와 이스라엘 총리 Menachem Begin은 평화협정에 합의하였고, 이집트는 최초로 이스라엘을 공식 승인하였으며 이후 이스라엘은 시나이반도를 반환하였다."},{"id":"i1634","t":"[[Hamas]](1987): 제1차 인티파다 시기에 Ahmed Yassin 등을 중심으로 창설된 팔레스타인 이슬람 조직으로, 이스라엘에 대한 무장저항과 가자지구 통치를 특징으로 한다."},{"id":"i1635","t":"[[오슬로]] 협정(1993): 이스라엘 총리 Yitzhak Rabin과 Yasser Arafat는 미국 대통령 Bill Clinton의 중재 아래 상호 인정과 팔레스타인 자치정부(PA) 수립에 합의하여 중동평화 프로세스의 전환점을 마련하였다."},{"id":"i1636","t":"[[아브라함]] 협정(2020): 미국 대통령 Donald Trump의 중재 아래 United Arab Emirates와 바레인이 먼저 Israel과 관계 정상화에 합의하고 이후 모로코·수단 등이 동참하였다."}]},{"id":"i1637","title":"이스라엘 관련 주요 논점","note":"최근 이스라엘의 군사 행동은 하마스와 이란을 동시에 겨냥한 다층적 안보 대응으로 전개되고 있다. 2023년 10월 하마스의 대규모 기습 공격 이후 이스라엘은 가자지구에 대해 공습과 지상작전을 병행하며 군사·행정 조직을 해체하려는 장기전을 수행하고 있고, 인질 구출과 로켓 위협 제거를 핵심 목표로 삼고 있다. 동시에 이스라엘은 이란이 하마스 및 헤즈볼라 등 친이란 세력을 지원한다고 보고 시리아 내 이란 관련 시설 공습, 핵·군사 인프라에 대한 비밀작전, 그리고 2024년 이후에는 제한적이지만 직접적인 군사 충돌까지 감수하는 강경 노선을 유지하고 있다. 특히 이란의 드론·미사일 공격과 이에 대한 이스라엘의 요격 및 보복 타격은 중동 전역으로의 확전을 우려하게 만드는 요소로 작용하고 있으며, 결과적으로 현재 상황은 가자 전쟁을 중심으로 하면서도 이란을 축으로 한 ‘대리전 + 직접 충돌 가능성’이 결합된 고강도 지역 분쟁으로 평가된다.","items":[{"id":"i1638","t":"[[시오니즘]] 운동 (19세기 말): 동유럽과 러시아 지역에서 반유대주의와 박해가 심화되자 유대인 지식인들은 민족자결에 기초한 독립국가 건설을 주장하였고, 특히 테오도어 헤르츨이 『유대국가』를 통해 팔레스타인 이주와 국가 건설을 체계적으로 제시함으로써 국제적 정치운동으로 발전하였다."},{"id":"i1639","t":"[[밸푸어]] 선언 (1917.11.2): 영국 외무장관 아서 밸푸어가 유대인의 “민족적 고향(national home)” 건설을 지지하는 서한을 발표하였으며, 이는 제1차 세계대전 중 유대인 지지를 확보하려는 전략적 목적과 함께 이후 국제사회에서 이스라엘 건국의 외교적 근거로 작용하였다."},{"id":"i1640","t":"국제연맹 위임통치 (1920~1948): 제1차 세계대전 이후 오스만제국이 해체되면서 팔레스타인은 [[영국]] 의 위임통치 하에 들어갔고, [[영국]] 은 유대인 이주를 일정 부분 허용하면서도 아랍인의 반발을 억제하지 못하여 1930~40년대에 폭력적 충돌과 봉기가 반복되는 등 구조적 갈등이 고착화되었다."},{"id":"i1641","t":"유엔 팔레스타인 분할 결의 (1947.11.29): 유엔 총회 결의 181호는 팔레스타인을 유대국가와 아랍국가로 분할하고 [[예루살렘]] 을 국제관리 하에 두는 방안을 제시하였으며, 유대 측은 이를 수용하였으나 아랍 측은 이를 거부하여 즉각적인 내전 상태로 이어졌다."},{"id":"i1642","t":"이스라엘 건국 ( [[1948]] 년.5.14): 다비드 벤구리온은 텔아비브에서 독립을 선언하였고, 미국과 소련이 빠르게 이를 승인하면서 국제적 정당성을 확보하였으나, 동시에 주변 아랍국가들의 군사 개입을 촉발하였다."},{"id":"i1643","t":"제1차 중동전쟁 (1948.5~1949.7): 이집트·요르단·시리아·이라크 등 아랍국가들이 이스라엘 건국 직후 침공하였으나, 이스라엘은 군사적으로 이를 격퇴하고 1949년 정전협정을 통해 유엔 분할안(약 55%)보다 확대된 약 78%의 영토를 확보하였으며, 구체적으로 갈릴리 전역과 네게브 사막 대부분, 서예루살렘을 장악하였다. 반면 [[요르단]] 은 요르단강 서안과 동예루살렘을 병합하고, [[이집트]] 는 가자지구를 통제하게 되었으며, 이 과정에서 약 70만 명 이상의 팔레스타인인이 난민이 되는 ‘나크바’ 문제가 발생하였다."},{"id":"i1644","t":"제2차 중동전쟁(수에즈 전쟁, 1956.10~1957.3): 가말 압델 [[나세르]] 가 수에즈 운하를 국유화하자, 이스라엘은 시나이반도를 침공하고 영국·프랑스가 개입하여 운하 통제권 회복을 시도하였으나, 미국과 소련이 모두 반대하면서 국제적 압력으로 철수하였고, [[유엔 긴급군(UNEF)]] 이 배치되는 계기가 되었다."},{"id":"i1645","t":"제3차 중동전쟁(6일 전쟁, 1967.6.5~6.10): 이집트의 티란 해협 봉쇄와 군사 집결에 대응하여 이스라엘이 선제공격을 감행하였고, 단 6일 만에 결정적 승리를 거두면서 시나이반도와 가자지구( [[이집트]] 로부터), 요르단강 서안과 동예루살렘(요르단으로부터), 골란고원( [[시리아]] 로부터)을 점령하여 전략적·종교적 핵심 지역을 모두 확보하였다."},{"id":"i1646","t":"제4차 중동전쟁( [[욤키푸르]] 전쟁, 1973.10.6~10.25): 유대교 최대 명절인 [[욤키푸르]] 에 맞춰 이집트와 시리아가 기습 공격을 감행하여 초기에는 일부 성과를 거두었으나, 이후 이스라엘이 반격하면서 전선이 교착 상태에 이르렀고, 이 과정에서 아랍 산유국들이 석유 금수 조치를 실시하여 세계 경제에 큰 영향을 미친 1차 [[오일쇼크]] 가 발생하였다."},{"id":"i1647","t":"캠프 데이비드 협정 (1978.9.17): 미국 대통령 [[지미 카터]] 의 중재 아래 이스라엘 총리 베긴과 이집트 대통령 [[사다트]] 가 회담을 통해 평화 원칙에 합의하였으며, 이는 중동에서 최초의 실질적 평화 프로세스를 출범시킨 사건이었다."},{"id":"i1648","t":"이집트-이스라엘 평화조약 (1979.3.26): 캠프 데이비드 협정을 구체화하여 체결된 조약으로, 이스라엘은 단계적으로 [[시나이반도]] 를 반환하고 이집트는 이스라엘을 공식 국가로 승인하였으며, 이집트는 그 대가로 아랍권 내에서 일시적으로 외교적 고립을 겪었다."},{"id":"i1649","t":"오슬로 협정 (1993.9.13): [[노르웨이]] 중재로 이루어진 비밀 협상을 통해 이스라엘과 [[PLO]] 가 상호 존재를 인정하고 팔레스타인 자치정부(PA) 수립에 합의하였으며, 서안과 가자 일부 지역에 단계적 자치를 부여하는 구조가 형성되었다."},{"id":"i1650","t":"이스라엘- [[요르단]] 평화조약 (1994.10.26): 이스라엘과 [[요르단]] 이 국경 문제를 해결하고 공식 외교 관계를 수립하였으며, 이는 이집트에 이어 두 번째 아랍국가와의 평화조약으로 중동 안정화에 기여하였다."},{"id":"i1651","t":"[[아브라함]] 협정 (2020.9.15): 미국의 중재 아래 이스라엘이 UAE, 바레인(이후 모로코, 수단 등 포함)과 외교 관계를 정상화함으로써, 전통적인 ‘아랍 대 이스라엘’ 구도가 약화되고 이란 견제를 중심으로 한 새로운 지역 질서가 형성되는 계기가 되었다."}]},{"id":"i1652","title":"미국-이스라엘 관계 주요 논점","note":"최근 미국의 이란에 대한 군사적 압박 및 제한적 타격은 중동에서 이란의 영향력 확대와 핵
