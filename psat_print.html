<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PSAT</title>
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSans.css" rel="stylesheet">
<style>
:root{
  --bg:#fcfbfa; --ink:#1a1a1a; --sub:#8a8580; --line:#ebe5df; --soft:#f3f1ee;
  --sky:#5aaee0; --sky-l:#e8f3fb; --sky-d:#1f5d86; --brown:#8a6a4f; --brown-l:#f4ede7;
}
*{box-sizing:border-box;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:'Paperlogy','GmarketSans',-apple-system,sans-serif;font-size:13px}
button{font-family:inherit;font-size:12px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:8px;padding:6px 10px}
button:hover{border-color:var(--ink)}
button:disabled{opacity:.45;cursor:default}
button.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
input[type=text]{font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);width:100%}
input[type=text]:focus{outline:none;border-color:var(--sky)}

.app{display:grid;grid-template-columns:350px 260px 1fr;height:100vh}
.panel{border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.ph{padding:16px 16px 10px;display:flex;align-items:center;gap:6px}
.ph h2{margin:0;font-size:13px;font-weight:600}
.cnt{color:var(--sub);font-size:11px;margin-left:4px;font-weight:400;white-space:nowrap}
.ph h2{white-space:nowrap}
.tools{display:flex;gap:5px;padding:0 10px 8px}
.tools button{padding:3px 8px;font-size:11px;white-space:nowrap}
.sp{flex:1}
.scroll{overflow-y:auto;flex:1;min-height:0}

.tabs{display:flex;gap:4px;padding:16px 16px 10px}
.tab{flex:1;text-align:center;padding:7px 0;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;user-select:none}
.tab.on{background:var(--ink);color:#fff;border-color:var(--ink)}

.kind{padding:6px 16px 2px;font-size:11px;color:var(--brown);font-weight:600}
.exams{display:flex;flex-wrap:wrap;gap:5px;padding:2px 16px 6px}
.ex{border:1px solid var(--line);border-radius:999px;padding:3px 9px;font-size:11.5px;background:#fff;cursor:pointer;user-select:none;position:relative;font-variant-numeric:tabular-nums}
.ex.on{background:var(--sky-l);border-color:var(--sky);color:var(--sky-d)}
.ex .dot{position:absolute;top:-2px;right:-2px;width:7px;height:7px;border-radius:50%;background:var(--brown)}
.ex.noans{color:#aaa}

.grid{margin:6px 12px 14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:#fff}
.grid .gh{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.grid .gt{font-weight:600}
.grid .gs{font-size:11px;color:var(--sub)}
.nums{display:grid;grid-template-columns:repeat(8,1fr);gap:5px}
.num{height:30px;border-radius:7px;border:1px solid var(--line);background:#fff;display:grid;place-items:center;cursor:pointer;user-select:none;font-size:12px;font-variant-numeric:tabular-nums}
.num:hover{border-color:var(--ink)}
.num.on{background:var(--sky);border-color:var(--sky);color:#fff}
.num.grp{grid-column:span 2;font-size:11px}
.warn{font-size:11px;color:var(--brown);margin-top:8px}

.sl{display:flex;align-items:center;gap:6px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:#fff;margin:0 10px 5px;cursor:grab}
.sl .no{width:20px;color:var(--sub);font-size:11px;text-align:right}
.sl .src{flex:1;font-size:12px;font-variant-numeric:tabular-nums}
.sl .x{border:none;padding:2px 5px;color:var(--sub);background:none}
.sl .x:hover{color:var(--ink)}
.sl .eye{border:none;background:none;padding:2px 3px;color:var(--ink);display:grid;place-items:center}
.sl .eye svg{width:15px;height:15px}
.sl.off{background:var(--soft)}
.sl.off .src,.sl.off .no{color:#b9b3ad}
.sl.off .eye{color:#b9b3ad}
.sets{display:flex;gap:6px;padding:16px 10px 4px}
.sets select{flex:1;min-width:0;font-family:inherit;font-size:12px;border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:#fff;color:var(--ink);-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--sub) 50%),linear-gradient(135deg,var(--sub) 50%,transparent 50%);background-position:calc(100% - 13px) 50%,calc(100% - 9px) 50%;background-size:4px 4px;background-repeat:no-repeat}
.sets button{padding:4px 9px;white-space:nowrap}
.sl.div{background:var(--brown-l);border-color:transparent;margin-top:10px}
.sl.div .src{font-weight:600;color:var(--brown)}
.sl.div .dtag{font-size:10px;color:var(--brown);opacity:.7}
.page .divt{position:absolute;left:0;right:0;top:120mm;text-align:center;font-size:24pt;font-weight:600}
.page .divs{position:absolute;left:0;right:0;top:136mm;text-align:center;font-size:10pt;color:#666}
.sl{cursor:pointer}
.sl.cur{border-color:var(--sky)}
#pages .q.flash,#pages .page.flash{outline:1.2mm solid rgba(90,174,224,.55);outline-offset:1mm;transition:outline-color .3s}
.sl.drag{opacity:.4}
.sl.over{border-color:var(--sky)}
.sl{position:relative}
.sl.insT::before,.sl.insB::after{content:'';position:absolute;left:-4px;right:-4px;height:3px;border-radius:3px;background:var(--brown);pointer-events:none}
.sl.insT::before{top:-5px}
.sl.insB::after{bottom:-5px}
.sl.drag{opacity:.35}
.empty{color:var(--sub);font-size:12px;padding:20px 8px;text-align:center;line-height:1.7}
.settings{border-top:1px solid var(--line);padding:12px 16px 16px;display:flex;flex-direction:column;gap:9px}
.settings label{font-size:11px;color:var(--sub);display:block;margin-bottom:3px}
.tog{display:flex;align-items:center;gap:8px;font-size:12px;cursor:pointer;user-select:none}
.tog .sw{width:28px;height:16px;border-radius:999px;background:#ddd;position:relative;flex:none;transition:.15s}
.tog .sw::after{content:'';position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:.15s}
.tog.on .sw{background:var(--sky)}
.tog.on .sw::after{left:14px}

.preview{overflow-y:auto;background:#efece8;min-height:0}
.ptop{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 18px;background:rgba(239,236,232,.92);backdrop-filter:blur(6px);font-size:12px;color:var(--sub)}
.ptop button{padding:4px 9px}
#pages{padding:10px 0 60px;display:flex;flex-direction:column;align-items:center;gap:14px;zoom:var(--z,.62)}
#msg{margin:80px auto;max-width:420px;text-align:center;color:var(--sub);line-height:1.8;font-size:13px}

#hov{position:fixed;z-index:50;pointer-events:none;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 30px rgba(0,0,0,.12);padding:10px;display:none;width:330px}
#hov img{width:100%;display:block}
#hov .hl{font-size:11px;color:var(--sub);margin-bottom:6px}

/* ───── 인쇄 페이지 ───── */
.page{width:210mm;height:297mm;background:#fff;position:relative;overflow:hidden;box-shadow:0 2px 12px rgba(0,0,0,.08);font-family:'Paperlogy','GmarketSans',sans-serif;color:#000}
.phead{position:absolute;left:8mm;right:8mm;top:6mm;height:5.9mm;display:flex;align-items:flex-start;gap:3mm;border-bottom:.2mm solid #000}
.phead .tbox{border:.25mm solid #000;height:4.6mm;display:flex;align-items:center;justify-content:center;font-size:8pt;font-weight:600;white-space:nowrap;overflow:hidden}
.phead .t1{width:60mm}
.phead .t2{width:30mm;font-size:8pt}
.phead .t3{width:9mm;font-size:6.5pt;font-weight:400}
.phead .ctr{position:absolute;left:0;right:0;top:0;line-height:4.6mm;text-align:center;font-size:10pt;font-weight:600;pointer-events:none}
.pbody{position:absolute;left:8mm;right:8mm;top:14mm;bottom:10mm}
.col{position:absolute;top:0;bottom:0;width:calc((100% - 4mm)/2)}
.col.l{left:0}
.col.r{right:0}
.vline{position:absolute;top:0;bottom:0;left:50%;border-left:.25mm solid #000}
.q{margin-bottom:8mm}
.q .lab{font-size:7.5pt;line-height:1;margin:0 0 1.4mm 1mm;font-family:-apple-system,'Paperlogy',sans-serif;text-decoration:underline;text-decoration-thickness:.2mm;text-underline-offset:.6mm}
.q img,.q .ph-img{display:block;width:100%}
.q .ph-img{background:#f6f6f6}
.atbl{position:absolute;top:2mm;border-collapse:collapse;font-size:8.5pt}
.atbl th,.atbl td{border:.2mm solid #555;text-align:center;height:6.6mm;padding:0 1mm;font-weight:400;white-space:nowrap}
.atbl th{background:#f2f2f2;font-weight:600}
.atbl td.a{background:#f0f0f0}

</style>
</head>
<body>
<div class="app">
  <section class="panel">
    <div class="tabs" id="tabs"></div>
    <div class="scroll" id="bank"></div>
  </section>

  <section class="panel">
    <div class="sets"><select id="setSel"></select><button id="setSave">저장</button><button id="setDel">삭제</button></div>
    <div id="linkInfo" style="display:none;padding:2px 14px 0;font-size:11px;color:var(--brown)"></div>
    <div class="ph" style="padding-top:8px;padding-bottom:6px"><h2>담은 문제<span class="cnt" id="selCnt"></span></h2></div>
    <div class="tools"><button id="addDiv" title="선택한 줄 아래(없으면 맨 끝)에 구분 페이지 추가">+ 구분 페이지</button><span class="sp"></span><button id="sortNo" title="구분 페이지 사이에서 시험별(오래된 시험부터)로 묶고 그 안에서 번호순">번호순</button><button id="shuffle">섞기</button><button id="clear">비우기</button></div>
    <div class="scroll" id="selList"></div>
    <div class="settings">
      <div><label>머리말 제목</label><input type="text" id="title"></div>
      <div class="tog" id="tCompact"><span class="sw"></span>짧은 문제는 한 칸에 이어서</div>
      <div class="tog" id="tAns"><span class="sw"></span>마지막 장에 정답지</div>
      <button class="primary" id="print">프린트</button>
    </div>
  </section>

  <section class="preview">
    <div class="ptop"><span id="pinfo"></span><span class="sp"></span>
      <button id="zo">－</button><button id="zi">＋</button></div>
    <div id="msg"></div>
    <div id="pages"></div>
  </section>
</div>
<div id="hov"><div class="hl" id="hovL"></div><img id="hovImg" alt=""></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
<script src="https://unpkg.com/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js"></script>
<script src="psat_bank.js"></script>
<script src="psat_sets.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

const EXAMS = window.PSAT_EXAMS || [];
const EX = Object.fromEntries(EXAMS.map(e => [e.id, e]));
const SUBS = ['언어', '자료', '상황'];
const SUB_FULL = {언어: '언어논리영역', 자료: '자료해석영역', 상황: '상황판단영역'};
const KINDS = ['민경채', '7급', '7급근로', '5급', '외교', '기타'];
const KIND_NAME = {민경채: '민경채', '7급': '7급 (2022~ 민경채 동시)', '7급근로': '근로감독 (근로감독·산업안전 분야)', '5급': '5급 · 행시', 외교: '외교관 후보자', 기타: '연도 미상'};
const CIRC = '①②③④⑤';
const LS = 'psat_print_v2';
const RS = 2;                         // 미리보기 렌더 배율

let st = {sel: [], hidden: [], sub: '상황', open: null, title: '', compact: false, ans: true, z: .62, sets: {}, cur: null, link: {}};
try { Object.assign(st, JSON.parse(localStorage.getItem(LS) || '{}')); } catch (e) {}
const save = () => {
  st.hidden = st.hidden.filter(k => st.sel.includes(k));
  if (st.cur && st.sets[st.cur]) Object.assign(st.sets[st.cur], {sel: [...st.sel], hidden: [...st.hidden], title: st.title});
  if (isLinked()) st.link[st.cur] = {order: [...st.sel], hidden: [...st.hidden], title: st.title};
  try { localStorage.setItem(LS, JSON.stringify(st)); } catch (e) {}
};

/* 키: 시험id|첫번호 */
const keyOf = (e, it) => e.id + '|' + it.n[0];
function itemOf(key) {
  const [id, n] = key.split('|'); const e = EX[id];
  if (!e) return null;
  const it = e.items.find(i => i.n[0] === +n);
  return it ? {e, it} : null;
}
st.link = st.link || {};
const isDiv = k => typeof k === 'string' && k[0] === '#';
const okKey = k => isDiv(k) || itemOf(k);
const userDiv = k => isDiv(k) && k.startsWith('#+');
const divName = k => userDiv(k) ? k.slice(k.indexOf('|') + 1) : k.slice(1);
st.sel = st.sel.filter(okKey);
st.hidden = (st.hidden || []).filter(k => st.sel.includes(k));

/* ───── PSAT 트래커 보충학습(📌) 자동 연결 (읽기만 함) ───── */
const RV_SUBJ = {언어논리: '언어', 자료해석: '자료', 상황판단: '상황'};
const LINKED = {};          // 'rv:상황판단' → {name, keys, miss}
let linkLoaded = false;
function isLinked(id = st.cur) { return !!id && (id.startsWith('rv:') || id.startsWith('th:')); }
(window.PSAT_SETS || []).forEach(t => { LINKED[t.id] = {name: t.name, keys: t.keys.filter(k => isDiv(k) || EX[k.split('|')[0]]), miss: 0}; });
function findExam(level, sub, yearRaw) {
  const y = String(yearRaw || ''), yd = (y.match(/\d{4}/) || [''])[0];
  const pool = EXAMS.filter(e => e.sub === sub);
  const pick = (kind, year, book) => pool.find(e => e.kind === kind && e.year === year && (book === undefined || (e.book === '모의') === (book === '모의')));
  if (/모의/.test(y) || (level === '7급' && yd === '2020')) return pick('7급', '2020', '모의');
  if (yd === '2025' && /근로|산업|\(\s*2\s*\)/.test(y)) return pick('7급근로', yd);   // 2025(2) = 근로감독
  if (yd === '2025' && /\(\s*1\s*\)/.test(y)) return pick('7급', yd, '');           // 2025(1) = 7급
  if (level === '민경채') return pick('민경채', yd) || pick('7급', yd, '');
  if (level === '7급') {
    if (/근로|산업|\(2\)/.test(y) && yd === '2025') return pick('7급근로', yd);
    return pick('7급', yd, '') || pick('민경채', yd);
  }
  if (/외교/.test(y)) return pick('외교', yd);
  return pick('5급', yd);
}
function buildLinked(box) {
  const by = {};
  (box || []).slice().sort((a, b) => (a.addedAt || 0) - (b.addedAt || 0)).forEach(en => {
    const parts = String(en.idKeyStr || '').split('|');
    if (parts[0] && parts[0] !== '기출') return;          // 유형모음 등은 제외
    const level = en.level || parts[1], subj = en.subject || parts[2], year = parts[3] || en.label;
    const sub = RV_SUBJ[subj]; if (!sub) return;
    const id = 'rv:' + subj;
    const g = by[id] || (by[id] = {name: subj + '_보충학습', keys: [], miss: 0});
    const e = findExam(level, sub, year);
    const it = e && e.items.find(i => i.n.includes(+en.num));
    if (!it) { g.miss++; return; }
    const k = keyOf(e, it);
    if (!g.keys.includes(k)) g.keys.push(k);
  });
  Object.keys(LINKED).filter(k => k.startsWith('rv:')).forEach(k => delete LINKED[k]);
  Object.assign(LINKED, by);
}
function linkedSel(id) {
  const L = LINKED[id], m = st.link[id] || {};
  if (!L) return {sel: [], hidden: [], title: id.slice(3) + '_보충학습'};
  const order = (m.order || []).filter(k => L.keys.includes(k) || userDiv(k));
  const sel = order.concat(L.keys.filter(k => !order.includes(k)));
  return {sel, hidden: (m.hidden || []).filter(k => sel.includes(k)), title: m.title || L.name};
}
async function loadReviewBox() {
  let box = null;
  try {
    const r = await fetch('https://tracker-d3a39-default-rtdb.firebaseio.com/psat_tracker_data/psat_tracker_data_v1/reviewBox.json', {cache: 'no-store'});
    if (r.ok) box = await r.json();
  } catch (e) {}
  if (!Array.isArray(box)) { try { box = JSON.parse(localStorage.getItem('psatTrackerReviewBox_v1') || '[]'); } catch (e) { box = []; } }
  buildLinked(box);
  linkLoaded = true;
  if (isLinked()) Object.assign(st, linkedSel(st.cur));
  renderAll();
}
if (st.cur && !st.sets[st.cur] && !/^(rv|th):/.test(st.cur)) st.cur = null;
const isOn = k => !st.hidden.includes(k);
const numStr = it => it.n.length > 1 ? it.n[0] + '-' + it.n[it.n.length - 1] : '' + it.n[0];
const kindShow = e => e.kind === '7급근로' ? '근로감독' : e.kind + (e.book === '모의' ? '모의' : '');
const srcLabel = (e, it) => [e.year, kindShow(e), numStr(it)].join('_');
const yearShow = e => e.book === '모의' ? '모의' : (e.year || '?');

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* ───── PDF 렌더 ───── */
/* 문제 PDF는 배포에 안 넣고(Vercel 저장공간 절약) GitHub에서 바로 읽어옴 */
const PDF_BASE = (location.protocol === 'file:' || /^(localhost|127\.0\.0\.1)$/.test(location.hostname)) ? 'pdf/' : 'https://raw.githubusercontent.com/ilavty/tracker/main/pdf/';
const pdfCache = {}, imgCache = {};
function getPdf(id) {
  if (!pdfCache[id]) pdfCache[id] = pdfjsLib.getDocument({url: PDF_BASE + id + '.pdf', disableAutoFetch: false}).promise
    .catch(err => { delete pdfCache[id]; throw err; });
  return pdfCache[id];
}
let queue = Promise.resolve();
function renderSeg(e, seg, scale, now) {
  const k = e.id + ':' + seg.join(',') + '@' + scale;
  if (imgCache[k]) return imgCache[k];
  const job = async () => {
    const pdf = await getPdf(e.id);
    const page = await pdf.getPage(seg[0] + 1);
    const [, x0, y0, x1, y1] = seg;
    const vp = page.getViewport({scale});
    const c = document.createElement('canvas');
    c.width = Math.ceil((x1 - x0) * scale); c.height = Math.ceil((y1 - y0) * scale);
    const ctx = c.getContext('2d');
    ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    ctx.translate(-x0 * scale, -y0 * scale);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    const blob = await new Promise(r => c.toBlob(r, 'image/png'));
    return URL.createObjectURL(blob);
  };
  imgCache[k] = (now ? job() : (queue = queue.then(job, job))).catch(err => { delete imgCache[k]; throw err; });
  return imgCache[k];
}

/* ───── 왼쪽: 시험 고르기 ───── */
function renderTabs() {
  $('tabs').innerHTML = SUBS.map(s => `<div class="tab ${st.sub === s ? 'on' : ''}" data-s="${s}">${s}</div>`).join('');
}
function selCountIn(e) { return st.sel.filter(k => k.startsWith(e.id + '|')).length; }
function renderBank() {
  const list = EXAMS.filter(e => e.sub === st.sub);
  let html = '';
  for (const k of KINDS) {
    const es = list.filter(e => e.kind === k).sort((a, b) => (b.year || '0').localeCompare(a.year || '0') || (a.book === '모의') - (b.book === '모의'));
    if (!es.length) continue;
    html += `<div class="kind">${KIND_NAME[k]}</div><div class="exams">` + es.map(e => {
      const lab = e.kind === '기타' ? (e.book ? e.book + '책형' : '책형 없음') : yearShow(e);

// 프린터 여백 고려: 100%로 찍어도 안 잘리게 바깥 여백 확보
const ML = 8, MT = 5, BT = 14, MB = 10, CW = 210 - 2 * ML;

function layout() {

  const newPage = () => { cur = {cols: [[], []]}; pages.push(cur); ci = 0; used = 0; };
  const nextCol = () => { if (ci === 0) { ci = 1; used = 0; } else newPage(); };
  for (let idx = 0; idx < st.sel.length; idx++) {
    const k = st.sel[idx];
    if (!isOn(k)) continue;
    if (isDiv(k)) { pages.push({div: divName(k), idx}); cur = null; continue; }
    const {e, it} = itemOf(k);
    const parts = it.s.map((seg, si) => {
      const w = seg[3] - seg[1], hpt = seg[4] - seg[2];
      const lab = si === 0 ? LAB_H : 0;
      let hmm = hpt * COL_W / w, wmm = COL_W;
      if (hmm > COL_H - lab) { wmm = COL_W * (COL_H - lab) / hmm; hmm = COL_H - lab; }
      return {seg, si, wmm, hmm, h: lab + hmm};
    });
    const fitsAt = (u, h) => st.compact ? (u === 0 || u + h <= COL_H + .1) : u === 0;
    // 지문+문제 묶음이 다음 쪽으로 넘어가 잘리면 → 새 쪽에서 시작 (한 쪽에 다 들어갈 때만)
    const splits = (c, u) => { let br = 0; parts.forEach((p, i) => { if (!fitsAt(u, p.h)) { if (c === 0) { c = 1; u = 0; } else { if (i > 0) br++; c = 0; u = 0; } } u += p.h + GAP; }); return br; };
    if (cur && parts.length > 1 && splits(ci, used) && !splits(0, 0)) newPage();
    parts.forEach(p => {
      if (!cur) newPage();
      if (!fitsAt(used, p.h)) nextCol();
      cur.cols[ci].push({e, it, seg: p.seg, si: p.si, wmm: p.wmm, hmm: p.hmm, idx});
      used += p.h + GAP;
    });

}
function head(pno, center, area) {

    <div class="tbox t3">${center ? '답지' : pno + '쪽'}</div></div>`;
}
function subsOfSel() { return [...new Set(st.sel.filter(k => !isDiv(k)).map(k => itemOf(k).e.sub))]; }
function defaultTitle() { const s = subsOfSel(); return s.length === 1 ? SUB_FULL[s[0]].replace('영역', '') + ' 기출모음' : 'PSAT 기출모음'; }

function answerRows() {

function answerPages() {
  const rows = answerRows();
  const PER = Math.floor((COL_H - 4) / 6.6) - 1;
  const chunks = []; for (let i = 0; i < rows.length; i += PER) chunks.push(rows.slice(i, i + PER));
  const out = [];
  for (let p = 0; p < chunks.length; p += 3) {
    const tbls = chunks.slice(p, p + 3).map((rs, ci) => {
      let body = '';
      rs.forEach((r, i) => {
        let kc = '';
        if (i === 0 || rs[i - 1].k !== r.k) { let sp = 1; while (i + sp < rs.length && rs[i + sp].k === r.k) sp++; kc = `<td rowspan="${sp}">${esc(r.k)}</td>`; }
        body += `<tr>${kc}<td>${esc(r.y)}</td><td>${r.n}</td><td class="a">${r.a}</td></tr>`;
      });

/* ───── 인쇄용 PDF 만들기 (문제=원본 PDF 벡터, 글자=Paperlogy 벡터) ───── */
const MM = 72 / 25.4, PW = 595.28, PH = 841.89;
const srcDocs = {};
let building = false, fontBytes = null;
function srcDoc(id) {
  if (!srcDocs[id]) srcDocs[id] = fetch(PDF_BASE + id + '.pdf')
    .then(r => { if (!r.ok) throw new Error('pdf ' + r.status); return r.arrayBuffer(); })
    .then(b => PDFLib.PDFDocument.load(b))
    .catch(err => { delete srcDocs[id]; throw err; });
  return srcDocs[id];
}
function getFonts() {
  if (!fontBytes) fontBytes = Promise.all(['fonts/Paperlogy-4Regular.ttf', 'fonts/Paperlogy-6SemiBold.ttf']
    .map(u => fetch(u).then(r => { if (!r.ok) throw new Error('font ' + r.status); return r.arrayBuffer(); })))
    .catch(err => { fontBytes = null; throw err; });
  return fontBytes;
}
// mm 좌표(위에서부터) → pdf 좌표
const Y = mm => PH - mm * MM;
function txt(pg, t, font, sizeMm, x, cy, align = 'center', maxW = 999) {
  t = String(t); let size = sizeMm * MM;
  let w = font.widthOfTextAtSize(t, size);
  if (w > maxW * MM) { size *= maxW * MM / w; w = maxW * MM; }
  const xx = align === 'center' ? x * MM - w / 2 : x * MM;
  pg.drawText(t, {x: xx, y: Y(cy) - size * 0.36, size, font, color: PDFLib.rgb(0, 0, 0)});
  return w / MM;
}
function rect(pg, x, y, w, h, opt = {}) {
  pg.drawRectangle({x: x * MM, y: Y(y + h), width: w * MM, height: h * MM,
    borderColor: opt.stroke === false ? undefined : PDFLib.rgb(...(opt.sc || [0, 0, 0])), borderWidth: (opt.bw ?? .25) * MM,
    color: opt.fill ? PDFLib.rgb(...opt.fill) : undefined});
}
// 머리말: 페이지 (ML, MT) 기준, 폭 CW
function drawHead(pg, F, title, center, area, right) {
  const y = MT + 1;
  const box = (bx, w, t, size, f) => { rect(pg, ML + bx, y, w, 4.6); txt(pg, t, f || F.b, size, ML + bx + w / 2, y + 2.3, 'center', w - 2); };
  box(0, 60, title, 2.82);
  box(CW - 9, 9, right, 2.3, F.r);
  if (center) txt(pg, center, F.b, 3.5, 105, y + 2.3);
  pg.drawLine({start: {x: ML * MM, y: Y(MT + 6)}, end: {x: (ML + CW) * MM, y: Y(MT + 6)}, thickness: .2 * MM, color: PDFLib.rgb(0, 0, 0)});
}
async function buildPdf() {
  if (!st.sel.length || building) return;
  building = true; $('print').disabled = true; $('print').textContent = 'PDF 만드는 중…';
  const win = window.open('', '_blank');
  try { if (win) win.document.write('<p style="font-family:-apple-system,sans-serif;padding:40px;color:#888">PDF 만드는 중…</p>'); } catch (e) {}
  try {
    const {PDFDocument, rgb} = PDFLib;
    const out = await PDFDocument.create();
    out.registerFontkit(fontkit);
    const [rb, bb] = await getFonts();
    const F = {r: await out.embedFont(rb, {subset: true}), b: await out.embedFont(bb, {subset: true})};
    const pages = layout(), area = areaName(), title = st.title || defaultTitle();
    // 시험(원본 PDF)별로 필요한 페이지를 한 번에 넣어서 글꼴 중복 없이
    const embedCache = {}, need = {};
    pages.forEach(pp => (pp.cols || []).flat().forEach(b => { (need[b.e.id] = need[b.e.id] || new Set()).add(b.seg[0]); }));
    for (const id of Object.keys(need)) {
      const doc = await srcDoc(id), idx = [...need[id]];
      const eps = await out.embedPdf(doc, idx);
      idx.forEach((p, i) => { embedCache[id + ':' + p] = {ep: eps[i], H: doc.getPage(p).getHeight()}; });
    }
    for (let pi = 0; pi < pages.length; pi++) {
      const pg = out.addPage([PW, PH]);
      drawHead(pg, F, title, '', area, (pi + 1) + '쪽');
      if (pages[pi].div) {
        txt(pg, pages[pi].div, F.b, 8.5, 105, 125);
        pg.drawText(title, {x: 105 * MM - F.r.widthOfTextAtSize(title, 10) / 2, y: Y(138) - 3.5, size: 10, font: F.r, color: rgb(.4, .4, .4)});
        continue;
      }
      pg.drawLine({start: {x: 105 * MM, y: Y(BT)}, end: {x: 105 * MM, y: Y(297 - MB)}, thickness: .25 * MM, color: rgb(0, 0, 0)});
      for (let ci = 0; ci < 2; ci++) {
        let y = BT; const x0 = ML + (ci ? COL_W + 4 : 0);
        for (const b of pages[pi].cols[ci]) {
          if (b.si === 0) {
            const w = txt(pg, srcLabel(b.e, b.it), F.r, 2.65, x0 + 1, y + 1.5, 'left');
            pg.drawLine({start: {x: (x0 + 1) * MM, y: Y(y + 2.95)}, end: {x: (x0 + 1 + w) * MM, y: Y(y + 2.95)}, thickness: .2 * MM, color: rgb(0, 0, 0)});
            y += LAB_H;
          }
          // 원본 페이지는 한 번만 넣고, 필요한 영역만 잘라서(clip) 보여줌 → 파일 크기 작게
          const [p, sx0, sy0, sx1, sy1] = b.seg;

          const O = PDFLib;

          pg.drawPage(ep, {x: tx - sx0 * k, y: ty - (H - sy1) * k, xScale: k, yScale: k});

        }

    }
    if (st.ans) {
      const rows = answerRows();
      const W = [18, 15, 14, 15], RH = 6.6, PER = Math.floor((COL_H - 4) / RH) - 1;
      const chunks = []; for (let i = 0; i < rows.length; i += PER) chunks.push(rows.slice(i, i + PER));
      for (let p = 0; p < chunks.length; p += 3) {
        const pg = out.addPage([PW, PH]);
        drawHead(pg, F, title, '<정답지>', 'PSAT', '답지');
        chunks.slice(p, p + 3).forEach((rs, ci) => {
          const tx = ML + ci * 66, ty = BT + 2;
          const cell = (cx, cy, w, h, t, fill, bold) => {
            rect(pg, cx, cy, w, h, {fill, sc: [.33, .33, .33], bw: .2});
            if (t !== '' && t != null) txt(pg, t, bold ? F.b : F.r, 3, cx + w / 2, cy + h / 2, 'center', w - 1);
          };
          let cx = tx; ['구분', '연도', '문번', '정답'].forEach((h, i) => { cell(cx, ty, W[i], RH, h, [.95, .95, .95], true); cx += W[i]; });
          rs.forEach((r, i) => {
            const cy = ty + RH * (i + 1);
            if (i === 0 || rs[i - 1].k !== r.k) { let sp = 1; while (i + sp < rs.length && rs[i + sp].k === r.k) sp++; cell(tx, cy, W[0], RH * sp, r.k); }
            cell(tx + W[0], cy, W[1], RH, r.y);
            cell(tx + W[0] + W[1], cy, W[2], RH, r.n);
            cell(tx + W[0] + W[1] + W[2], cy, W[3], RH, r.a, [.94, .94, .94]);
          });
        });
      }
    }
    const bytes = await out.save();
    const url = URL.createObjectURL(new Blob([bytes], {type: 'application/pdf'}));
    if (win && !win.closed) win.location.href = url;
    else { const a = document.createElement('a'); a.href = url; a.download = (title || 'PSAT') + '.pdf'; document.body.appendChild(a); a.click(); a.remove(); }
  } catch (err) {
    console.error(err);
    try { if (win) win.close(); } catch (e) {}
    alert('PDF 만들기 실패: ' + err.message);
  } finally {
    building = false; $('print').disabled = !st.sel.length; $('print').textContent = '프린트 (PDF)';
  }
}

/* ───── 이벤트 ───── */
$('tabs').onclick = e => { const s = e.target.dataset.s; if (!s) return; st.sub = s; st.open = null; renderTabs(); renderBank(); save(); };
$('bank').onclick = ev => {
  const ex = ev.target.closest('.ex');
  if (ex) { st.open = st.open === ex.dataset.e ? null : ex.dataset.e; renderBank(); save(); return; }
  const all = ev.target.dataset.all;
  if (all && lockLinked()) return;
  if (all) {
    const e = EX[all], keys = e.items.map(it => keyOf(e, it));
    const on = keys.every(k => st.sel.includes(k));
    st.sel = on ? st.sel.filter(k => !keys.includes(k)) : st.sel.concat(keys.filter(k => !st.sel.includes(k)));
    renderAll(); return;
  }
  const n = ev.target.closest('.num');
  if (n && lockLinked()) return;
  if (n) { const k = n.dataset.k; st.sel = st.sel.includes(k) ? st.sel.filter(x => x !== k) : [...st.sel, k]; renderAll(); }
};
$('addDiv').onclick = () => {
  const name = (prompt('구분 페이지 이름 (예: 1회독 오답)') || '').trim(); if (!name) return;
  const k = '#+' + Date.now().toString(36) + '|' + name;
  const cur = document.querySelector('.sl.cur');
  const at = cur ? +cur.dataset.i + 1 : st.sel.length;
  st.sel.splice(at, 0, k); renderAll();
};
function lockLinked() {
  if (!isLinked()) return false;
  alert((st.cur.startsWith('th:') ? '모음집 묶음은 고정이에요.' : '보충학습 묶음은 PSAT 트래커의 📌로 관리돼요.') + '\n여기서 바꾸려면 위에서 [복사]해서 내 묶음으로 만들어줘!');
  return true;
}
$('clear').onclick = () => { if (lockLinked()) return; if (st.sel.length && confirm('담은 문제 다 비울까?')) { st.sel = []; st.hidden = []; renderAll(); } };
$('setSel').onchange = e => {
  save();
  const id = e.target.value;
  if (!id) { st.cur = null; st.sel = []; st.hidden = []; st.title = ''; }
  else if (isLinked(id)) { st.cur = id; Object.assign(st, linkedSel(id)); }
  else { const s = st.sets[id]; st.cur = id; st.sel = s.sel.filter(okKey); st.hidden = (s.hidden || []).filter(k => st.sel.includes(k)); st.title = s.title || ''; }
  renderAll();
};
$('setSave').onclick = () => {
  if (isLinked()) {
    const name = (prompt('내 묶음으로 복사할 이름', st.title) || '').trim(); if (!name) return;
    const id = 's' + Date.now().toString(36);
    st.sets[id] = {name, sel: [...st.sel], hidden: [...st.hidden], title: st.title};
    st.cur = id; renderAll(); return;
  }
  const old = st.cur ? st.sets[st.cur].name : '';
  const name = (prompt(st.cur ? '묶음 이름 바꾸기' : '이 묶음 이름 (예: 논리 퀴즈)', old || st.title || '') || '').trim();
  if (!name) return;
  if (st.cur) st.sets[st.cur].name = name;
  else { const id = 's' + Date.now().toString(36); st.sets[id] = {name, sel: [], hidden: [], title: st.title}; st.cur = id; }
  renderAll();
};
$('setDel').onclick = () => {
  if (!st.cur || !confirm(`'${st.sets[st.cur].name}' 묶음을 지울까?`)) return;
  delete st.sets[st.cur]; st.cur = null; st.sel = []; st.hidden = []; st.title = '';
  renderAll();
};
$('sortNo').onclick = () => {
  const yr = e => e.book === '모의' ? 2020.5 : (+e.year || 0);
  const out = []; let seg = [];
  const flush = () => { seg.sort((a, b) => { const A = itemOf(a), B = itemOf(b); return yr(A.e) - yr(B.e) || String(A.e.book).localeCompare(String(B.e.book)) || String(A.e.kind).localeCompare(String(B.e.kind)) || A.it.n[0] - B.it.n[0]; }); out.push(...seg); seg = []; };
  st.sel.forEach(k => { if (isDiv(k)) { flush(); out.push(k); } else seg.push(k); }); flush();
  st.sel = out; renderAll();
};
$('shuffle').onclick = () => { for (let i = st.sel.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [st.sel[i], st.sel[j]] = [st.sel[j], st.sel[i]]; } renderAll(); };
$('selList').onclick = e => {
  const eye = e.target.closest('[data-eye]');
  if (eye) { const k = st.sel[+eye.dataset.eye]; st.hidden = st.hidden.includes(k) ? st.hidden.filter(x => x !== k) : [...st.hidden, k]; renderAll(); return; }
  const x = e.target.closest('[data-x]');
  if (!x) {   // 줄 누르면 미리보기에서 그 문제로 이동
    const row = e.target.closest('.sl'); if (!row) return;
    const t = document.querySelector(`#pages [data-idx="${row.dataset.i}"]`);
    if (!t) return;
    t.scrollIntoView({behavior: 'smooth', block: t.classList.contains('page') ? 'start' : 'center'});
    document.querySelectorAll('#pages .flash').forEach(f => f.classList.remove('flash'));
    t.classList.add('flash'); setTimeout(() => t.classList.remove('flash'), 1400);
    document.querySelectorAll('.sl.cur').forEach(r => r.classList.remove('cur')); row.classList.add('cur');
    return;
  }
  const [k] = st.sel.splice(+x.dataset.x, 1); st.hidden = st.hidden.filter(h => h !== k); renderAll();
};
$('title').oninput = e => { st.title = e.target.value; document.querySelectorAll('.phead .t1').forEach(b => b.textContent = st.title || defaultTitle()); save(); };
$('tCompact').onclick = () => { st.compact = !st.compact; renderAll(); };
$('tAns').onclick = () => { st.ans = !st.ans; renderAll(); };
$('zi').onclick = () => { st.z = Math.min(1.2, +(st.z + .08).toFixed(2)); $('pages').style.setProperty('--z', st.z); save(); };
$('zo').onclick = () => { st.z = Math.max(.3, +(st.z - .08).toFixed(2)); $('pages').style.setProperty('--z', st.z); save(); };
$('print').onclick = buildPdf;

let dragI = null;
$('selList').addEventListener('dragstart', e => { const el = e.target.closest('.sl'); if (!el) return; dragI = +el.dataset.i; el.classList.add('drag'); e.dataTransfer.effectAllowed = 'move'; try { e.dataTransfer.setData('text/plain', ''); } catch (er) {} });
let dropAt = null;
$('selList').addEventListener('dragover', e => {
  const el = e.target.closest('.sl'); if (!el || dragI == null) return; e.preventDefault();
  const r = el.getBoundingClientRect(), before = e.clientY < r.top + r.height / 2, i = +el.dataset.i;
  dropAt = before ? i : i + 1;
  document.querySelectorAll('.sl.insT,.sl.insB').forEach(x => x.classList.remove('insT', 'insB'));
  if (dropAt !== dragI && dropAt !== dragI + 1) el.classList.add(before ? 'insT' : 'insB');
});
$('selList').addEventListener('drop', e => { if (dragI == null || dropAt == null) return; e.preventDefault(); let to = dropAt; if (to > dragI) to--; const [m] = st.sel.splice(dragI, 1); st.sel.splice(to, 0, m); dragI = null; dropAt = null; renderAll(); });
$('selList').addEventListener('dragend', () => { dragI = null; dropAt = null; document.querySelectorAll('.sl').forEach(x => x.classList.remove('drag', 'over', 'insT', 'insB')); });

// 번호 호버 → 미리보기
const hov = $('hov'); let hovKey = null;
$('bank').addEventListener('mousemove', ev => {
  const n = ev.target.closest('.num');
  if (!n) { hov.style.display = 'none'; hovKey = null; return; }
  const k = n.dataset.k;
  if (k !== hovKey) {
    hovKey = k; const {e, it} = itemOf(k);
    $('hovL').textContent = e.sub + ' ' + srcLabel(e, it) + (it.s.length > 1 ? ` (${it.s.length}칸 중 첫 칸)` : '');
    $('hovImg').removeAttribute('src');
    renderSeg(e, it.s[0], 1.4, true).then(u => { if (hovKey === k) $('hovImg').src = u; }).catch(loadFail);
  }
  hov.style.display = 'block';
  const r = n.getBoundingClientRect();
  hov.style.left = (r.right + 14) + 'px';
  hov.style.top = Math.max(10, Math.min(r.top - 40, innerHeight - hov.offsetHeight - 10)) + 'px';
});
$('bank').addEventListener('mouseleave', () => { hov.style.display = 'none'; hovKey = null; });

renderAll();
loadReviewBox();
</script>
