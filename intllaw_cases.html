<script>
/* DATABASE ↔ Firebase 동기화 (DESK와 같은 Firebase, 별도 경로) */
window.makeCloud=function(path,key,getState,applyState){
  const TK=key+'_cloud_t';
  let lt=+(localStorage.getItem(TK)||0),fresh=!lt,ready=false,db=null,timer=null;
  const setT=t=>{lt=t;try{localStorage.setItem(TK,t)}catch(e){}};
  try{if(!firebase.apps.length)firebase.initializeApp({apiKey:"AIzaSyCboDDyAjbNBN6aPQXdQD0L9jk64ykWQ8o",projectId:"time-8d30b",databaseURL:"https://tracker-d3a39-default-rtdb.firebaseio.com/"});db=firebase.database()}catch(e){}
  const push=()=>{if(!db)return;clearTimeout(timer);timer=setTimeout(()=>{db.ref(path).set({t:lt,d:JSON.stringify(getState())}).catch(()=>{})},500)};
  setTimeout(()=>{ready=true},6000);
  if(db)db.ref(path).on('value',s=>{
    const r=s.val();
    if(r&&r.t&&r.d&&(fresh||r.t>lt)){try{applyState(JSON.parse(r.d))}catch(e){}setT(r.t);fresh=false}
    else if(!r||!r.t||r.t<lt){if(!lt)setT(Date.now());fresh=false;push()}
    ready=true;
  });
  return{touched(){if(!ready)return;fresh=false;setT(Date.now());push()}};
};

const KEY="ilcases_v1";
const MK={h:"•",a:"✓",b:"-",c:"‣",d:"◦",r:"➸",p:""};
const RMK={"•":"h","✓":"a","-":"b","‣":"c","◦":"d","➸":"r"};
const root=document.getElementById("ilc");
const $=s=>root.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const yr=s=>{const m=String(s).match(/\d{4}/);return m?+m[0]:9999};

let store={added:[],edits:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||"null");if(s&&s.added&&s.edits)store=s}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store))}catch(e){};if(cloud)cloud.touched()}
let cloud=null;
function all(){return BASE.map(b=>store.edits[b.id]?{...b,...store.edits[b.id],edited:true}:b).concat(store.added.map(a=>({...a,mine:true})))}
function find(id){return all().find(r=>r.id===id)}

let active="all";
function drawChips(){
  const R=all();
  const list=[["all","전체",R.length],...G.map(([k,l])=>[k,l,R.filter(r=>r.g===k).length])];
  $("#ilc-chips").innerHTML=list.map(([k,l,n])=>`<button type="button" class="chip" data-k="${k}" aria-pressed="${k===active}">${l}<b>${n}</b></button>`).join("");
}
function noteText(n){return n?[n.src,...(n.items||[]).map(i=>i[1]),n.tags].join(" "):""}
function render(){
  const t=$("#ilc-q").value.trim().toLowerCase();
  const R=all();let html="",any=false;
  for(const [k,l] of G){
    if(active!=="all"&&active!==k)continue;
    const rows=R.filter(r=>r.g===k).filter(r=>!t||[r.court,r.name,r.year,r.parties,...r.cats.map(c=>C[c]),noteText(r.note),noteText(r.note2)].join(" ").toLowerCase().includes(t)).sort((a,b)=>yr(a.year)-yr(b.year));
    if(!rows.length)continue;any=true;
    html+=`<section><h2>${l}<span>${rows.length}건</span></h2><div class="tw"><table><colgroup><col class="c1"><col class="c2"><col class="c3"><col class="c4"><col class="c5"></colgroup><thead><tr><th>재판소</th><th>판례 이름</th><th>연도</th><th>원고 v. 피고</th><th>목차 분류</th></tr></thead><tbody>`+
    rows.map(r=>{const f=r.flag?` <span class="fl" title="${esc(r.flag)}">*</span>`:"";const yf=r.flag&&r.flag.startsWith("연도")?f:"",pf=r.flag&&!r.flag.startsWith("연도")?f:"";
      return `<tr><td class="court">${esc(r.court)}</td><td><button type="button" class="nm" data-id="${r.id}">${esc(r.name)}</button>${r.mine?'<span class="mine">추가</span>':r.edited?'<span class="mine">수정</span>':""}</td><td class="year">${esc(r.year)}${yf}</td><td>${esc(r.parties)}${pf}</td><td>${r.cats.map(c=>`<span class="cat">${C[c]||c}</span>`).join("")}</td></tr>`}).join("")+`</tbody></table></div></section>`;
  }
  $("#ilc-out").innerHTML=any?html:`<div class="empty">맞는 판례가 없어요</div>`;
}
function noteHTML(n){
  if(!n)return "";
  let h="";
  if(n.items&&n.items.length)h+=`<div class="note">${tree(n.items)}</div>`;
  if(n.tags)h+=`<div class="kw">`+n.tags.split(/,\s*/).filter(Boolean).map(x=>`<span>${esc(x)}</span>`).join("")+`</div>`;
  return h;
}

const YES=new Set(["적극","P","o","O","인정","위반","可","有","있음","위법"]),NO=new Set(["소극","N","x","X","부정","기각","불가","위반x","위반아님","위반 아님","無","없음","위법아님","위법x"]);
function yn(t){return t.replace(/(\?:?|:)(\s*)(위반 아님|위반아님|위반x|위법아님|위법x|적극|소극|인정|부정|기각|불가|위반|위법|있음|없음|可|有|無|P|N|o|O|x|X)(?=$|[\s,.(/)])/g,(m,a,sp,w)=>`${a}${sp}<span class="${YES.has(w)?"y":"n"}">${w}</span>`)}
function tree(items){
  const LV={h:0,a:1,r:1,p:1,b:2,c:3,d:4};
  const top={lv:-1,ch:[]},st=[top];
  for(const [k,t] of items){const lv=LV[k]??1;while(st[st.length-1].lv>=lv)st.pop();const n={k,t,lv,ch:[]};st[st.length-1].ch.push(n);st.push(n)}
  const it=n=>`<div class="it ${n.k}"><div class="t"><span>${yn(esc(n.t))}</span></div>${n.ch.length?`<div class="grp">${n.ch.map(it).join("")}</div>`:""}</div>`;
  let out="",buf=[],no=0;
  const fl=()=>{if(buf.length)out+=`<div class="grp" style="margin-left:0">${buf.map(it).join("")}</div>`;buf=[]};
  for(const n of top.ch){
    if(n.k==="h"){fl();no++;out+=`<div class="sec"><div class="st">${no}. ${esc(n.t)}</div>${n.ch.length?`<div class="grp">${n.ch.map(it).join("")}</div>`:""}</div>`}
    else buf.push(n);

const LVK=["h","a","b","c","d"],IND={h:0,a:2,b:4,c:6,d:8,r:2,p:0};
function fmtLine(k,t){return " ".repeat(IND[k]??0)+(MK[k]?MK[k]+" ":"")+t}
function relevel(line,dir){
  const m=line.match(/^\s*([•✓\-‣◦➸])?\s*(.*)$/);const mk=m[1],t=m[2];
  let i=mk?(mk==="➸"?1:LVK.indexOf(RMK[mk])):-1;
  i=Math.max(-1,Math.min(4,i+dir));
  return i<0?t:fmtLine(LVK[i],t);
}
function noteKeys(ta){
  ta.addEventListener("keydown",e=>{
    const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
    if(e.key==="Tab"){
      e.preventDefault();
      const ls=v.lastIndexOf("\n",a-1)+1,leRaw=v.indexOf("\n",b===a?b:b-1),le=leRaw<0?v.length:leRaw;
      const block=v.slice(ls,le).split("\n").map(l=>relevel(l,e.shiftKey?-1:1)).join("\n");
      ta.value=v.slice(0,ls)+block+v.slice(le);
      if(a===b){const nl=block.length;ta.selectionStart=ta.selectionEnd=ls+nl}else{ta.selectionStart=ls;ta.selectionEnd=ls+block.length}
    }else if(e.key==="Enter"&&!e.isComposing&&a===b){
      const ls=v.lastIndexOf("\n",a-1)+1,line=v.slice(ls,a);
      const m=line.match(/^(\s*)([•✓\-‣◦➸])(\s*)(.*)$/);if(!m)return;
      e.preventDefault();
      if(!m[4].trim()){ta.value=v.slice(0,ls)+v.slice(a);ta.selectionStart=ta.selectionEnd=ls;return}
      const ins="\n"+m[1]+m[2]+" ";ta.value=v.slice(0,a)+ins+v.slice(a);ta.selectionStart=ta.selectionEnd=a+ins.length;
    }
  });
}
let tessP=null;

  if(window.Tesseract)return Promise.resolve();
  if(!tessP)tessP=new Promise((res,rej)=>{const sc=document.createElement("script");sc.src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js";sc.onload=res;sc.onerror=()=>{tessP=null;rej(new Error("load"))};document.head.appendChild(sc)});
  return tessP;
}
async function prepImg(file){
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    const sc=img.width<1400?2:1,c=document.createElement("canvas");c.width=img.width*sc;c.height=img.height*sc;
    const x=c.getContext("2d");x.fillStyle="#fff";x.fillRect(0,0,c.width,c.height);x.imageSmoothingQuality="high";x.drawImage(img,0,0,c.width,c.height);
    return c;
  }finally{URL.revokeObjectURL(url)}
}
function fixOcr(t){
  return t.split("\n").map(l=>{
    l=l.replace(/\s+/g," ").trim();
    l=l.replace(/^(\(cid:\d+\)|[vV√✔/]|v\/)\s+/,"✓ ").replace(/^[·•●*«°e]\s+(?=\S)/,"• ").replace(/^[>»›▸]\s+/,"‣ ").replace(/^[—–―_~]\s*/,"- ").replace(/^[o0○]\s+/,"◦ ").replace(/^->\s*/,"-> ");
    l=l.replace(/(\S)\s+(?=[,.)?:])/g,"$1");
    return l;
  }).filter(Boolean).join("\n");
}
function autoParse(txt){
  const clean=txt.replace(/\(cid:\d+\)/g,"").replace(/[䡬✔︎☑]/g,"✓").replace(/䡸/g,"◦").replace(/[▪︎●・]/g,"•").replace(/\r/g,"");
  let L=clean.split("\n").map(l=>l.replace(/\s+/g," ").trim()).filter(l=>l&&!/^\d{1,2}$/.test(l));
  if(!L.length)return null;
  const isMk=l=>/^[•✓\-‣◦➸]/.test(l)||l.startsWith("->");
  const courtRe=/(PCIJ|ICJ|ITLOS|WTO|ECJ|ICTY|PCA|중재|법원|위원회|재판소|재판부|패널|상소|청구)/;
  let name="",src="";
  if(!isMk(L[0])&&!(courtRe.test(L[0])&&/\d{4}|v\./.test(L[0])))name=L.shift();
  if(L.length&&!isMk(L[0])&&(courtRe.test(L[0])||/\d{4}/.test(L[0])))src=L.shift();
  let tags="";
  if(L.length>1&&!isMk(L[L.length-1]))tags=L.pop();
  const out=[];
  for(const l of L){
    if(isMk(l)||!out.length)out.push(l.startsWith("->")?"- → "+l.slice(2).trim():l.replace(/^([•✓\-‣◦➸])\s*/,"$1 "));
    else out[out.length-1]+=" "+l;
  }
  const parts=src.split(/,|\//).map(x=>x.trim()).filter(Boolean);
  const year=(src.match(/(1[6-9]|20)\d{2}/g)||[]).join("·");
  const isV=x=>/\sv\.?\s|\svs\.?\s/.test(x);
  const isCourt=x=>courtRe.test(x)&&!isV(x);
  let parties="";
  if(parts.some(isV))parties=parts.filter(x=>!isCourt(x)&&!/^\D{0,3}\d{4}/.test(x)&&!/권고적|판례집|\dp$/.test(x)).map(x=>x.replace(/\(?\d{4}\)?/g,"").trim()).filter(Boolean).join(", ");
  let court=(parts.find(isCourt)||"").replace(/\d{4}/g,"").replace(/^K\s*/,"").trim();
  const all=name+" "+src;
  const wto=!court&&/^(EC|EU|US|미국|한국|일본|중국|캐나다|멕시코|브라질|인도|Korea|Japan|China|Dominican|도미니카)[\s-–]/i.test(name);
  if(wto){court="WTO 패널·상소기구";const m=parties.split(/\s+v\.?\s+/);if(m.length===2)parties=m[1]+" v. "+m[0]}
  const g=wto?"wto":/권고적/.test(all)?"icjao":/PCIJ/.test(all)?"pcij":/ITLOS|해양법법원/.test(all)?"itlos":/ICJ/.test(all)?"icj":/WTO|패널|상소/.test(all)?"wto":/ECJ|유럽/.test(all)?"eur":/자유권|규약위원회|HRC/.test(all)?"hrc":/ICTY|ICTR|ICC|군사/.test(all)?"icl":/중재|PCA|위원회|청구재판소/.test(all)?"arb":/미국|미 |연방|캘리포니아/.test(src)?"us":/영국|영 |스코틀랜드|귀족원/.test(src)?"uk":/캐나다|이스라엘|독일|일본/.test(src)?"etc":/대법원|고등법원|지방법원|가정법원|헌법재판소|^K\s/.test(src)?"kr":"etc";
  const body=name+" "+out.join(" ")+" "+tags;
  const CK=[[16,/해양|EEZ|대륙붕|대륙봉|추적권|영해|공해|어업|선박|해협|ITLOS/],[15,/영유|영토|국경|실효적 지배|선점|시효|uti|우티/],[14,/난민|인권|규약|제노사이드|박해/],[17,/환경|영공|항공기|하천|오염/],[19,/무력|자위권|무사금/],[8,/면제/],[7,/관할권|속인|속지|보편주의/],[11,/국가책임|배상|위법성 조각|귀속/],[2,/조약|유보/],[13,/외교적 보호|국적|국유화/],[18,/잠정조치|선결적 항변|소송참가|금화/],[20,/GATT|내국민대우|NT/],[22,/SPS|TBT/],[21,/보조금|덤핑|세이프가드|상계/]];
  const cats=[];for(const [c,re] of CK){if(re.test(body)){cats.push(c);if(cats.length>=2)break}}
  return{name,src,court,year,parties,g,cats,note:out.map(l=>{const m=l.match(/^([•✓\-‣◦➸])\s*(.*)$/);return m?fmtLine(RMK[m[1]],m[2]):l}).join("\n"),tags};
}
function toText(n){
  if(!n)return "";
  return (n.items||[]).map(([k,t])=>fmtLine(k,t)).join("\n");
}
function parse(txt){
  const items=[];
  txt.split("\n").map(l=>l.trim()).filter(Boolean).forEach(l=>{
    const m=l[0];
    if(RMK[m])items.push([RMK[m],l.slice(1).trim()]);
    else items.push(["p",l]);
  });
  return items;
}

root.addEventListener("click",e=>{

  const act=a.dataset.act,id=a.dataset.id;

/* ===== 퀴즈 문제 생성 (노트 기반) ===== */
const QY=["적극","p","o","인정","위반","위법","可","有","있음","가능","합법","충족","적법","해당"];
const QN=["소극","n","x","부정","기각","불가","무","無","없음","위반x","위반아님","위법x","위법아님","불가능","불허","관련없음","관련x","상관없음"];
const COURT_ALIAS={pcij:["pcij","상설국제사법재판소"],icj:["icj","국제사법재판소"],icjao:["icj","국제사법재판소","권고적의견"],itlos:["itlos","국제해양법재판소","해양법재판소","국제해양법법원","해양법법원"],arb:["중재","중재재판","중재재판소","중재법원","pca"],eur:["유럽인권법원","유럽인권재판소","ecj","유럽사법재판소","유럽법원"],hrc:["자유권규약위원회","규약위원회","hrc","인권위원회"],icl:["icty","뉘른베르크","국제형사재판소","국제군사재판소"],wto:["wto","패널","상소기구"],kr:["한국","대법원","고등법원","한국법원","가정법원"],us:["미국","미국법원","연방대법원","연방법원"],uk:["영국","영국법원","귀족원","항소법원"],etc:["국내법원"],none:["없음","재판없음","외교교섭","외교"]};
function qNorm(s){return String(s||"").toLowerCase().replace(/[\s·∙.,()\-~]/g,"")}
function qHash(s){let h=0;for(let i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))|0;return (h>>>0).toString(36)}
function qYN(ans){
  const a=qNorm(ans);if(!a)return null;
  const f=qNorm(ans.split(/[\s,(/]/)[0]);
  if(QN.includes(a)||QN.includes(f))return "X";
  if(QY.includes(a)||QY.includes(f))return "O";
  if(/(^|[^가-힣])(x|n)$/.test(a)&&a.length<=6)return "X";
  return null;
}
function genQuiz(cases){
  const out=[];
  const LV={h:0,a:1,r:1,p:1,b:2,c:3,d:4};
  for(const r of cases){
    const base={cid:r.id,cname:r.name,cats:r.cats||[]};
    // 1) 재판소
    const acc=[...(COURT_ALIAS[r.g]||[]),qNorm(r.court)];
    out.push({...base,id:r.id+"|court",type:"sa",q:"관할 재판소(기관)는?",a:r.court,acc,loose:qNorm(r.court)});
    // 3) 제소국
    const pv=String(r.parties||"").split(/\s+v\.?\s+/);
    if(pv.length===2&&!/—/.test(r.parties)){const p0=pv[0].replace(/\(.*?\)/g,"").trim();if(p0&&p0.length<=24)out.push({...base,id:r.id+"|plt",type:"sa",q:"원고(제소한 쪽)는?",a:p0,acc:[qNorm(p0)],loose:qNorm(p0)});
      const p1=pv[1].replace(/\(.*?\)/g,"").trim();if(p1&&p1.length<=30)out.push({...base,id:r.id+"|dfd",type:"sa",q:"피고(제소당한 쪽)는?",a:p1,acc:[qNorm(p1)],loose:qNorm(p1)})}
    // 키워드
    const tags=String(r.note&&r.note.tags||"").split(/[,，]/).map(x=>x.trim()).filter(x=>x&&x.length<=30);
    if(tags.length)out.push({...base,id:r.id+"|tag",type:"sa",q:"이 판례의 핵심 키워드는? (하나만)",a:tags.join(", "),any:tags.map(qNorm)});
    // 사건 전체 떠올리기 카드
    if(r.note&&r.note.items){
      const fact=[],gist=[];let hd="";
      for(const [k,t] of r.note.items){if(k==="h"){hd=t;continue}if(k!=="a"&&k!=="r")continue;(/사실|배경|개요/.test(hd)?fact:gist).push(t)}
      if(fact.length)out.push({...base,id:r.id+"|facts",type:"fc",q:"사실관계는?",a:fact.slice(0,6).join("\n")});
      if(gist.length>=2)out.push({...base,id:r.id+"|gist",type:"fc",q:"판결 요지(쟁점·결론)는?",a:gist.slice(0,8).join("\n")});
    }
    // 4) 노트에서
    for(const note of [r.note,r.note2]){
      if(!note||!note.items)continue;
      const it=note.items;let head="";
      for(let i=0;i<it.length;i++){
        const [k,t]=it[i];if(k==="h"){head=t;continue}if(k==="p")continue;
        if(/사실|배경|개요/.test(head))continue;
        const lvk=LV[k]??1,kids=[];
        for(let j=i+1;j<it.length;j++){const l2=LV[it[j][0]]??1;if(it[j][0]==="h"||l2<=lvk)break;kids.push(it[j][1])}
        if(k==="r"){out.push({...base,id:r.id+"|fc|"+qHash(t),type:"fc",q:"결론은?",a:t,ex:kids});continue}
        const m=t.match(/^(.{3,80}?)\s*[:：]\s*(.{1,140})$/);
        if(!m){if(/[?？]$/.test(t)&&kids.length&&qNorm(t).length>=5)out.push({...base,id:r.id+"|fc|"+qHash(t),type:"fc",q:t,a:kids[0],ex:kids.slice(1)});continue}
        let lab=m[1].trim(),ans=m[2].trim();
        if(/->|→|사실관계|^판결$|^판단$/.test(lab)||qNorm(lab).length<4)continue;
        // 해설: 하위 항목
        const lv=LV[k]??1,ex=[];
        for(let j=i+1;j<it.length;j++){const l2=LV[it[j][0]]??1;if(it[j][0]==="h"||l2<=lv)break;ex.push(it[j][1])}
        const yn=qYN(ans);
        if(yn){
          out.push({...base,id:r.id+"|ox|"+qHash(lab),type:"ox",q:lab.replace(/\?$/,"")+(lab.endsWith("?")?"?":""),a:yn,raw:ans,ex});
        }else if(ans.length<=14&&!/[?？]/.test(ans)&&lab.length<=40&&!/^\d+$/.test(ans)){
          out.push({...base,id:r.id+"|sa|"+qHash(lab),type:"sa",q:lab.replace(/\?$/,"")+"?",a:ans,acc:[qNorm(ans)],loose:qNorm(ans),ex});
        }else if(ans.length>14&&lab.length<=60){
          out.push({...base,id:r.id+"|fc|"+qHash(lab),type:"fc",q:lab.replace(/\?$/,"")+"?",a:ans,ex});
        }
      }
    }
  }
  // 판례 맞히기 객관식
  const byCat={};cases.forEach(c=>(c.cats||[]).forEach(k=>(byCat[k]=byCat[k]||[]).push(c)));
  for(const r of cases){
    const tags=String(r.note&&r.note.tags||"").trim();if(!tags||tags.length<3)continue;
    let cand=[...new Set((r.cats||[]).flatMap(k=>byCat[k]||[]))].filter(c=>c.id!==r.id&&c.name!==r.name);
    if(cand.length<3)cand=cases.filter(c=>c.id!==r.id);
    const pick=[];const cc=[...cand];while(pick.length<3&&cc.length){pick.push(cc.splice(Math.floor(Math.random()*cc.length),1)[0].name)}
    const opts=[r.name,...pick];for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
    out.push({cid:r.id,cname:"",cats:r.cats||[],id:r.id+"|mc",type:"mc",q:"키워드: "+tags,a:r.name,opts});
  }
  const seen={};out.forEach(q=>{if(seen[q.id]){q.id+="~"+(seen[q.id]++)}else seen[q.id]=1});
  return out;
}
function qCheck(q,input){
  const v=qNorm(input);if(!v)return false;
  if(q.acc&&q.acc.some(a=>a&&a===v))return true;
  if(q.any&&v.length>=2&&q.any.some(t=>t&&(t===v||t.includes(v)||v.includes(t))))return true;
  if(q.loose&&v.length>=2&&(q.loose.includes(v)||v.includes(q.loose)))return true;
  return false;
}

const GRAD=3;
function qStat(id){return rec()[id]||null}
function qState(id){const s=qStat(id);if(!s)return "new";if(s.s>=GRAD)return "grad";if(s.s===0&&s.w>0)return "wrong";return "learn"}
function allQ(){return genQuiz(all())}

function qzStart(list){QZ.rev=false;QZ.list=list||shuffle(pool()).slice(0,QZ.n);QZ.i=0;QZ.res=[];QZ.done=false;QZ.ans=null;if(QZ.list.length)qzDraw();else qzSetup()}
function caseOf(id){return find(id)}
function qzDraw(){

      <div class="qacts">${!a.ok&&q.type==="sa"?`<button type="button" class="btn" data-qa="fix">맞은 걸로</button>`:""}<button type="button" class="btn" data-qa="case">판례 노트</button><button type="button" class="btn pri" data-qa="next">${QZ.i+1<QZ.list.length?"다음 →":"결과 보기"}</button></div></div>`;

function qzMark(ok,v){

  const F=S.pz/100;r.setProperty("--f",F);r.setProperty("--pw",(210*F)+"mm");r.setProperty("--ph",(297*F)+"mm");
  r.setProperty("--fs",(S.fs*F)+"pt");r.setProperty("--lh",S.lh);r.setProperty("--cs",(S.cs*F)+"pt");r.setProperty("--ts",(S.ts*F)+"pt");
  r.setProperty("--tw",S.tw);r.setProperty("--sop",(S.so||0)+"mm");r.setProperty("--ls",(S.ls/100)+"em");r.setProperty("--tls",(S.tls/100)+"em");r.setProperty("--cg",(S.cg*F)+"mm");r.setProperty("--ind","1em");
}
function cats(){
  const cnt={};D.cases.forEach(r=>(r.cats||[]).forEach(c=>cnt[c]=(cnt[c]||0)+1));
  const on=new Set(S.cats);
  document.getElementById("cats").innerHTML='<span class="hint">목차 · 안 고르면 전체</span>'+Object.entries(D.C).filter(([k])=>cnt[k]).map(([k,v])=>'<button data-c="'+k+'" aria-pressed="'+on.has(+k)+'">'+esc(v)+'<span>'+cnt[k]+'</span></button>').join("")+(on.size?'<button class="clr" data-clr="1">선택 해제</button>':"");
}
const HOST=window.parent!==window?window.parent:window.opener;
function save(){S.t=Date.now();try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}try{HOST&&HOST.postMessage({type:"ilcPrint",S},"*")}catch(e){}}
const doClose=()=>{if(window.parent!==window)window.parent.postMessage({type:"ilcPrintClose"},"*");else window.close()};

["fs","lh","ls","cs","ts","tls","mi","mo","mt","mb","pz","so","gap","cg"].forEach(id=>{const el=document.getElementById(id);el.value=S[id];el.addEventListener("input",()=>{const v=parseFloat(el.value);if(!isNaN(v)){S[id]=v;save();redo()}})});
