<script>
/* DATABASE ↔ Firebase 동기화 (DESK와 같은 Firebase, 별도 경로) */
window.makeCloud=function(path,key,getState,applyState){
  const TK=key+'_cloud_t';
  let lt=+(localStorage.getItem(TK)||0),fresh=!lt,ready=false,db=null,timer=null;
  const setT=t=>{lt=t;try{localStorage.setItem(TK,t)}catch(e){}};
  try{if(!firebase.apps.length)firebase.initializeApp({apiKey:"AIzaSyCboDDyAjbNBN6aPQXdQD0L9jk64ykWQ8o",projectId:"time-8d30b",databaseURL:"https://tracker-d3a39-default-rtdb.firebaseio.com/"});db=firebase.database()}catch(e){}
  const push=()=>{if(!db)return;clearTimeout(timer);timer=setTimeout(()=>{db.ref(path).set({t:lt,d:JSON.stringify(getState())}).catch(()=>{})},500)};
  setTimeout(()=>{ready=true},6000);
  if(db)db.ref(path).on('value',s=>{
    const r=s.val();
    if(r&&r.t&&r.d&&(fresh||r.t>lt)){try{applyState(JSON.parse(r.d))}catch(e){}setT(r.t);fresh=false}
    else if(!r||!r.t||r.t<lt){if(!lt)setT(Date.now());fresh=false;push()}
    ready=true;
  });
  return{touched(){if(!ready)return;fresh=false;setT(Date.now());push()}};
};
</script>

const KEY='intl_law_gichul_v3',BASE=2019,F=['topic','det','etc','trap','anal'];
const FN={topic:'논점',det:'세부 논점',etc:'기타',trap:'오답유형',anal:'분석'};
let st={ov:{},kw:{topic:[],det:[],etc:[],trap:[],anal:[]},cat:[],caseTag:{},detParent:{}};
try{const s=JSON.parse(localStorage.getItem(KEY));if(s){st.ov=s.ov||{};st.kw=Object.assign(st.kw,s.kw||{});st.cat=s.cat||[];st.caseTag=s.caseTag||{};st.detParent=s.detParent||{}}}catch(e){}
const LV=['대목차','중목차'];
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};if(window.__cloud)__cloud.touched()};
const ko=(a,b)=>a.localeCompare(b,'ko');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uniq=a=>[...new Set(a)];
let ROWS=[],FIRST={},view='heat',closedBig=new Set(),openMid=new Set(),closedEtc=new Set(),newOnly=false,G='',open=new Set(),etcType='';
let flt={y1:'',y2:'',big:'',q:'',kw:null};
const navStack=[];
function goBack(){const s=navStack.pop();if(!s)return;view=s.view;etcType=s.etcType;flt.kw=s.kw;render();requestAnimationFrame(()=>scrollTo(0,s.y))}
addEventListener('popstate',()=>{if(navStack.length)goBack()});

function build(){
  ROWS=SEED.map(q=>{
    const id=`${q.g}-${q.y}-${q.n}`;
    return Object.assign({id,q,topic:q.t||[],det:q.d||[],etc:q.e||[],trap:q.p||[],anal:q.z||[],memo:q.m||''},st.ov[id]||{});
  });
  FIRST={};
  ROWS.forEach(r=>['topic','det','etc'].forEach(f=>r[f].forEach(t=>{const k=f+'|'+t;if(!(k in FIRST)||r.q.y<FIRST[k])FIRST[k]=r.q.y})));
}
const isNew=(f,t)=>FIRST[f+'|'+t]>BASE;
const gRows=()=>ROWS.filter(r=>!G||String(r.q.g)===G);
const qkey=q=>`${q.g}-${q.y}-${q.n}`;
const srcL=q=>`${q.y} · ${q.n}번${q.g===9?' (9급)':''}`;
const big=t=>t.split('›')[0];
function short(f,t){
  if(f==='etc')return t.replace(/^(판례|조약|기타):\s*/,'');
  return t;
}
function topicLabel(t){const p=t.split('›');return p.length>1?`${esc(p[0])} <span class="b">›</span> ${esc(p[1])}`:esc(p[0])}
function pool(f){const s=new Set(st.kw[f]);ROWS.forEach(r=>r[f].forEach(t=>s.add(t)));return[...s].sort(ko)}
function chip(f,t,id){
  const n=f==='etc'&&isNew(f,t)?'<b class="new">初</b>':'';
  const act=id?`data-act="rm" data-id="${id}"`:`data-act="kwf"`;
  const lab=f==='topic'?topicLabel(t):esc(short(f,t));
  return `<span class="chip c-${f}${f==='topic'?' tchip':''}" ${act} data-f="${f}" data-t="${esc(t)}" title="${esc(t)}${id?' · 클릭하면 삭제':''}">${lab}${n}</span>`;
}
const addBtn=(r,f)=>`<button class="add" data-act="add" data-id="${r.id}" data-f="${f}">+</button>`;
const cell=(r,f)=>`<div class="cell">${r[f].map(t=>chip(f,t,r.id)).join('')}${addBtn(r,f)}</div>`;
function setOv(id,f,v){st.ov[id]=st.ov[id]||{};st.ov[id][f]=v;save();build()}

/* ===== 전체 표 ===== */
function yearsAll(){return uniq(gRows().map(r=>r.q.y)).sort()}
function bigs(){return uniq(ROWS.flatMap(r=>r.topic.map(big))).sort(ko)}
function renderTableView(){
  const ys=yearsAll();
  const yo=v=>'<option value="">-</option>'+ys.map(y=>`<option ${String(y)===v?'selected':''}>${y}</option>`).join('');
  main.innerHTML=`<div class="fbar">${navStack.length?'<button class="backbtn" data-act="back">← 뒤로</button>':''}
    <label>연도 <select id="y1">${yo(flt.y1)}</select> ~ <select id="y2">${yo(flt.y2)}</select></label>
    <label>대목차 <select id="bigs"><option value="">전체</option>${bigs().map(b=>`<option ${b===flt.big?'selected':''}>${esc(b)}</option>`).join('')}</select></label>
    <input type="text" id="qs" placeholder="검색" value="${esc(flt.q)}">
    <span class="kwsel" id="kwbox"></span>
    <span class="stat" id="stat"></span></div><div id="tbl"></div>`;
  const on=(id,ev,fn)=>document.getElementById(id).addEventListener(ev,fn);
  on('y1','change',e=>{flt.y1=e.target.value;renderTable()});
  on('y2','change',e=>{flt.y2=e.target.value;renderTable()});
  on('bigs','change',e=>{flt.big=e.target.value;renderTable()});
  on('qs','input',e=>{flt.q=e.target.value.trim();renderTable()});
  renderTable();
}
function filtered(){
  return gRows().filter(r=>{
    if(flt.y1&&r.q.y<+flt.y1)return false;
    if(flt.y2&&r.q.y>+flt.y2)return false;
    if(flt.big&&!r.topic.some(t=>big(t)===flt.big))return false;
    if(flt.kw){const k=flt.kw;if(k.f==='topic'?!r.topic.some(t=>t===k.t||t.startsWith(k.t+'›')):!r[k.f].includes(k.t))return false}
    if(flt.q){const hay=[r.memo,...F.flatMap(f=>r[f])].join(' ');if(!hay.includes(flt.q))return false}
    return true;
  });
}
function renderTable(){
  const kb=document.getElementById('kwbox');
  kb.innerHTML=flt.kw?`<span class="chip c-${flt.kw.f}" data-act="clrkw" title="클릭하면 해제">${FN[flt.kw.f]}: ${flt.kw.f==='topic'?topicLabel(flt.kw.t):esc(short(flt.kw.f,flt.kw.t))} ✕</span>`:'';
  const rs=filtered().sort((a,b)=>a.q.y-b.q.y||a.q.g-b.q.g||a.q.n-b.q.n);
  document.getElementById('stat').textContent=`${rs.length}문항`;
  if(!rs.length){tbl.innerHTML='<div class="empty">조건에 맞는 문항이 없어요</div>';return}
  let h='<table class="db"><thead><tr><th>연도</th><th>번호</th><th>정답</th><th>논점</th><th>세부 논점</th><th>기타</th><th>오답유형</th><th>분석</th></tr></thead><tbody>';

function caseTagPaths(t,rs){
  if(st.caseTag[t])return st.caseTag[t];
  if(CASE_TAG[t])return CASE_TAG[t];
  const m={};rs.forEach(r=>r.topic.forEach(x=>{const b=big(x);(m[b]=m[b]||new Set()).add(x)}));
  return Object.keys(m).map(b=>m[b].size>1?b:[...m[b]][0]);
}

const GENERIC_ETC=['조약: 조약법'];
/* ===== 새 논점 ===== */
function renderNew(){
  const ys=yearsAll().filter(y=>y>BASE),grp={};
  const etcNames=new Set();ROWS.forEach(r=>r.etc.forEach(t=>{if(!GENERIC_ETC.includes(t))etcNames.add(short('etc',t))}));
  const dupCase=t=>[...etcNames].some(e=>e===t||e.startsWith(t)||t.startsWith(e));
  const bigOf=rs=>{const c={};rs.forEach(r=>r.topic.forEach(x=>{const b=big(x);c[b]=(c[b]||0)+1}));return Object.keys(c).sort((x,y)=>c[y]-c[x]||ko(x,y))[0]||'미분류'};
  collect('det').filter(i=>isNew('det',i.t)&&!dupCase(i.t)).forEach(i=>(grp[bigOf(i.rs)]=grp[bigOf(i.rs)]||[]).push(i));
  collect('etc').filter(i=>isNew('etc',i.t)&&!GENERIC_ETC.includes(i.t)).forEach(i=>{const b=big(caseTagPaths(i.t,i.rs)[0]||'미분류');(grp[b]=grp[b]||[]).push(i)});
  const bs=Object.keys(grp).sort((x,y)=>grp[y].length-grp[x].length||ko(x,y));

    grp[b].sort((x,y)=>FIRST[x.f+'|'+x.t]-FIRST[y.f+'|'+y.t]||(x.f==='det'?-1:1)-(y.f==='det'?-1:1)||ko(x.t,y.t)).forEach(i=>{
      const m=byYear(i.rs),fy=FIRST[i.f+'|'+i.t],typ=i.f==='etc'?(i.t.match(/^(판례|조약|기타):/)||[])[1]:'논점';

  });

}

function renderEtc(){
  const ys=yearsAll(),grp={},byT={};
  gRows().forEach(r=>r.etc.forEach(t=>{
    if(GENERIC_ETC.includes(t))return;
    if(etcType&&!t.startsWith(etcType))return;
    (byT[t]=byT[t]||[]).push(r);
  }));
  Object.entries(byT).forEach(([t,rs])=>{
    const b=big((CASE_TAG[t]||caseTagPaths(t,rs))[0]||'미분류');
    (grp[b]=grp[b]||{})[t]=rs;
  });
  const seg=['','판례:','조약:'].map(t=>`<button class="${etcType===t?'on':''}" data-act="etype" data-t="${t}">${t?t.slice(0,-1):'전체'}</button>`).join('');
  const bs=sortBig(Object.keys(grp));
  if(!bs.length){main.innerHTML=`<div class="seg">${seg}</div><div class="empty">항목이 없어요</div>`;return}
  let h=`<table class="heat"><thead><tr><th>논점 / 판례·조약</th>${yhead(ys)}<th>개수</th></tr></thead><tbody>`;
  bs.forEach(b=>{
    const items=Object.entries(grp[b]).sort((x,y)=>y[1].length-x[1].length||ko(x[0],y[0]));
    const all=uniq(items.flatMap(x=>x[1]));
    const cb=closedEtc.has(b);
    h+=`<tr class="mid lv1" id="big-${esc(b)}" data-act="tg-etc" data-t="${esc(b)}"><td class="nm" data-t="${esc(b)}"><span class="car">${cb?'▸':'▾'}</span>${esc(b)}</td>${blankRow(ys)}<td class="cnt1">${all.length}</td></tr>`;
    if(cb)return;
    items.forEach(([t,rs])=>{
      const m=byYear(rs),typ=(t.match(/^(판례|조약|기타):/)||[])[1],fy=FIRST['etc|'+t];
      const tags=caseTagPaths(t,rs).map(x=>`<span class="htg" data-t="${esc(t)}" data-p="${esc(x)}" title="우클릭: 삭제">#${esc(tagName(x))}</span>`).join(' ');
      h+=`<tr><td class="nm sub" data-f="etc" data-t="${esc(t)}" title="우클릭: 키워드 추가">${typ&&!etcType?`<span class="typ">${typ}</span>`:''}${esc(short('etc',t))}<span class="htag">${tags}</span></td>${ys.map(y=>numCell(m[y],fy>BASE&&+y===fy)).join('')}<td class="cnt1">${rs.length}</td></tr>`;
    });
  });
  main.innerHTML=`<div class="seg">${seg}</div>`+wrapNav(h+'</tbody></table>',bs,'etc');
}

const ORDER_MID={'총론':['국제법 주체·역사','법원(ICJ 38조)','국제관습법','법의 일반원칙·형평','일방행위·연성법','국제법과 국내법'],'조약법':['체결','유보','발효·적용','해석','제3국','개정·변경','무효','강행규범','종료·정지','등록·기탁'],'국가':['국가의 요건·자결권','국가의 기본권리','국내문제불간섭','국가승인','정부승인','교전단체승인','국가승계'],'관할권·면제':['관할권 원칙','국가면제'],'국가책임':['귀속','위법성조각사유','법적 효과','대응조치','외교적 보호','국제기구 책임'],'외교·영사':['외교사절 파견·직무','외교특권면제','영사관계','국제기구 특권면제'],'국제기구·UN':['국제기구 일반','UN 목적·원칙','UN 회원국','UN 총회','UN 안보리','UN 사무국·기타기관','전문기구','지역기구(EU)'],'영토':['영역취득','현상유지(uti possidetis)','극지'],'해양법':['기선·내수','영해·무해통항','접속수역','국제해협·군도수역','EEZ','대륙붕','섬·간출지','경계획정','공해','심해저','해양환경','내륙국·과학조사','분쟁해결'],'공역·우주':['항공법','우주법'],'개인':['국적','외국인 지위','난민','범죄인인도'],'국제인권법':['인권조약 일반','UN 인권체제','자유권규약','사회권규약','개별 인권조약','지역인권'],'국제형사법':['국제범죄·임시재판소','ICC'],'국제환경법':['원칙','기후변화','개별 환경조약'],'국제경제법':['WTO 설립협정','GATT 원칙','GATT 예외','무역구제','기타 협정','WTO 분쟁해결','투자분쟁(ICSID)'],'분쟁해결':['평화적 해결수단','중재','ICJ 관할','ICJ 절차','권고적 의견','기타 국제재판소'],'무력사용':['무력사용금지','자위권','집단안전보장','PKO','인도적 개입·R2P','국제인도법','군축·핵무기']};
const ordIdx=(arr,x)=>{const i=arr.indexOf(x);return i<0?999:i};
function sortBig(a){return a.sort((x,y)=>ordIdx(ORDER_BIG,x)-ordIdx(ORDER_BIG,y)||ko(x,y))}
function sortMid(b,a){const o=ORDER_MID[b]||[];return a.sort((x,y)=>ordIdx(o,x.split('›')[1])-ordIdx(o,y.split('›')[1])||ko(x,y))}
function detParentOf(tag,rows){
  if(st.detParent[tag])return st.detParent[tag];
  const c={};
  rows.forEach(r=>{const w=r.topic.length===1?2:1;r.topic.forEach(t=>{let sc=w;const mid=(t.split('›')[1]||'');for(let i=0;i<mid.length-1;i++){if(tag.includes(mid.slice(i,i+2))){sc+=1.5;break}}c[t]=(c[t]||0)+sc})});
  return Object.keys(c).sort((x,y)=>c[y]-c[x]||ko(x,y))[0]||'미분류›기타';
}
function renderHeat(){
  const rs=gRows(),ys=yearsAll(),tree={};
  rs.forEach(r=>r.topic.forEach(t=>{
    const b=big(t),node=(tree[b]=tree[b]||{})[t]=tree[b][t]||{yrs:{},det:{}};
    (node.yrs[r.q.y]=node.yrs[r.q.y]||new Set()).add(qkey(r.q));
  }));
  const detRows={};rs.forEach(r=>r.det.forEach(d=>(detRows[d]=detRows[d]||[]).push(r)));
  Object.entries(detRows).forEach(([d,drs])=>{
    const par=detParentOf(d,drs),b=big(par);
    const node=(tree[b]=tree[b]||{})[par]=tree[b][par]||{yrs:{},det:{}};
    node.det[d]=drs;
  });
  const sum=o=>Object.values(o).reduce((a,s)=>a+s.size,0);
  const isNewD=d=>FIRST['det|'+d]>BASE;
  let h=`<table class="heat"><thead><tr><th>논점</th>${yhead(ys)}<th>개수</th></tr></thead><tbody>`;
  let bigs=sortBig(Object.keys(tree));
  if(newOnly)bigs=bigs.filter(b=>Object.values(tree[b]).some(n=>Object.keys(n.det).some(isNewD)));
  bigs.forEach(b=>{
    const subs=tree[b],tot={};
    Object.values(subs).forEach(n=>Object.entries(n.yrs).forEach(([y,s])=>{(tot[y]=tot[y]||new Set());s.forEach(x=>tot[y].add(x))}));
    const cb=!newOnly&&closedBig.has(b);
    h+=`<tr class="mid lv1" id="big-${esc(b)}" data-act="tg-big" data-t="${esc(b)}"><td class="nm" data-t="${esc(b)}"><span class="car">${cb?'▸':'▾'}</span>${esc(b)}</td>${blankRow(ys)}<td class="cnt1">${sum(tot)}</td></tr>`;
    if(cb)return;
    let mids=sortMid(b,Object.keys(subs));
    if(newOnly)mids=mids.filter(t=>Object.keys(subs[t].det).some(isNewD));
    mids.forEach(t=>{
      const n=subs[t],om=newOnly||openMid.has(t),dets=Object.keys(n.det),nd=dets.length;
      const newYs=new Set(dets.filter(isNewD).map(d=>FIRST['det|'+d]));
      h+=`<tr class="lv2" data-act="tg-mid" data-t="${esc(t)}"><td class="nm" data-mid="${esc(t)}"><span class="car">${nd?(om?'▾':'▸'):''}</span>${esc(t.split('›').pop()||t)}</td>${ys.map(y=>numCell(n.yrs[y],newYs.has(+y))).join('')}<td class="cnt1">${sum(n.yrs)}</td></tr>`;
      if(!om)return;
      Object.entries(n.det).filter(([d])=>!newOnly||isNewD(d)).sort((x,y)=>y[1].length-x[1].length||FIRST['det|'+x[0]]-FIRST['det|'+y[0]]||ko(x[0],y[0])).forEach(([d,drs])=>{
        const m=byYear(drs),fy=FIRST['det|'+d];
        h+=`<tr class="lv3"><td class="nm" data-det="${esc(d)}" data-mid="${esc(t)}" title="우클릭: 수정">${esc(d)}</td>${ys.map(y=>numCell(m[y],fy>BASE&&+y===fy)).join('')}<td class="cnt1">${drs.length}</td></tr>`;
      });
    });
  });
  main.innerHTML=wrapNav(h+'</tbody></table>',bigs,'heat');
  window.__heatMids=Object.values(tree).flatMap(o=>Object.keys(o));
}
function wrapNav(tbl,bigs,mode){
  const ctl=mode==='heat'
    ?`<a data-nav="all-open">전체 열기</a><a data-nav="all-close">전체 닫기</a><a data-nav="mid-open">중분류 모두 열기</a><a data-nav="sub-close">소분류 닫기</a><a data-nav="new-only" class="${newOnly?'on':''}">! 새 논점만</a>`
    :`<a data-nav="all-open">전체 열기</a><a data-nav="all-close">전체 닫기</a>`;
  return `<div class="twrap"><div class="tbox">${tbl}</div><aside id="navr" data-mode="${mode}"><a class="edge" data-nav="top">▲ top</a>${bigs.map(b=>`<a data-nav="${esc(b)}">${esc(b)}</a>`).join('')}<a class="edge" data-nav="bottom">▼ bottom</a><div class="ctl"><span class="lbl">☰ 펼치기·접기</span><div class="more">${ctl}</div></div></aside></div>`;
}
document.addEventListener('click',e=>{
  const a=e.target.closest('#navr a');if(!a)return;
  const k=a.dataset.nav,mode=a.closest('#navr').dataset.mode,closed=mode==='etc'?closedEtc:closedBig;
  if(k==='top')return scrollTo({top:0,behavior:'smooth'});
  if(k==='bottom')return scrollTo({top:document.body.scrollHeight,behavior:'smooth'});
  if(k==='all-open'){closed.clear();if(mode==='heat')(window.__heatMids||[]).forEach(m=>openMid.add(m));return render()}
  if(k==='all-close'){document.querySelectorAll('#main tr.lv1 td[data-t]').forEach(td=>closed.add(td.dataset.t));if(mode==='heat')openMid.clear();return render()}
  if(k==='mid-open'){closed.clear();openMid.clear();return render()}
  if(k==='sub-close'){openMid.clear();return render()}
  if(k==='new-only'){newOnly=!newOnly;return render()}
  if(closed.has(k)){closed.delete(k);render()}
  const el=document.getElementById('big-'+k);if(el)scrollTo({top:el.getBoundingClientRect().top+scrollY-10,behavior:'smooth'});
});

let cm=null;
function closeCM(){if(cm){cm.remove();cm=null}}
function rowsWithDet(d){return ROWS.filter(r=>r.det.includes(d))}
function setDet(r,arr){st.ov[r.id]=st.ov[r.id]||{};st.ov[r.id].det=arr}
function openCM(x,y,items){
  closeCM();cm=document.createElement('div');cm.className='cmenu';

function parseQ(str){
  return str.split(/[,\s]+/).filter(Boolean).map(tok=>{const m=tok.match(/^(7|9)급?[-.\/](\d{2,4})[-.\/](\d{1,2})$/);if(!m)return null;let y=+m[2];if(y<100)y+=2000;return `${m[1]}-${y}-${+m[3]}`}).filter(Boolean);
}

  }

/* ===== 키워드 피커 ===== */
let pk=null;
function closePicker(){if(pk){pk.el.remove();pk=null}}
function topicTree(){
  const paths=new Set([...st.cat,...st.kw.topic]);
  ROWS.forEach(r=>r.topic.forEach(t=>paths.add(t)));
  const root={};
  [...paths].forEach(p=>{let n=root;p.split('›').slice(0,2).forEach(seg=>{n=n[seg]=n[seg]||{}})});
  return root;
}
function usedPrefix(p){return ROWS.some(r=>r.topic.some(t=>t===p||t.startsWith(p+'›')))}
function renderTopicPicker(){
  const d=pk.el,path=pk.path,depth=path.length,cur=pk.mode==='case'?caseTagPaths(pk.t,[]):pk.mode==='detmove'?[st.detParent[pk.t]||'']:ROWS.find(x=>x.id===pk.id).topic;
  let node=topicTree();for(const sg of path)node=node[sg]||{};
  const kids=Object.keys(node).sort(ko),leaf=depth>=1;
  const crumb=`<div class="crumb"><span data-act="tp-go" data-i="0" class="${depth?'':'cur'}">전체</span>${path.map((sg,i)=>`›<span data-act="tp-go" data-i="${i+1}" class="cur">${esc(sg)}</span>`).join('')}</div>`;
  const list=kids.map(k=>{
    const full=[...path,k].join('›'),on=cur.includes(full);
    return `<span class="chip c-topic" data-act="tp-in" data-k="${esc(k)}" title="${leaf?'선택':'하위로'}${st.cat.includes(full)&&!usedPrefix(full)?' · 우클릭 삭제':''}" style="${on?'outline:1.5px solid #6fb0dc':''}">${esc(k)}${leaf?'':'<i class="arr">›</i>'}</span>`;
  }).join('')||'<span style="color:#b5ada6;font-size:12.5px">아직 없음 — 아래에서 추가</span>';
  d.innerHTML=crumb+`<div class="lvl">${LV[Math.min(depth,1)]}</div><div class="opts">${list}</div>
    <div class="tp-foot"><input placeholder="+ 새 ${LV[Math.min(depth,1)]} 추가 후 Enter">${depth?`<button class="btn tp-sel" data-act="tp-sel">「${esc(path[0])}」만 선택</button>`:''}</div>`;
  const inp=d.querySelector('input');inp.focus({preventScroll:true});
  inp.addEventListener('keydown',e=>{
    if(e.key==='Escape')closePicker();
    if(e.key==='Enter'&&inp.value.trim()){
      const v=inp.value.trim().replace(/›/g,''),full=[...path,v].join('›');
      if(!st.cat.includes(full))st.cat.push(full);save();
      if(leaf)pkSelect(full);else{pk.path.push(v);renderTopicPicker()}
    }
  });
}
function place(d,btn){
  const b=btn.getBoundingClientRect();
  d.style.top=(b.bottom+scrollY+4)+'px';
  d.style.left=Math.max(8,Math.min(b.left+scrollX,scrollX+innerWidth-d.offsetWidth-12))+'px';
}
function openPicker(btn){
  closePicker();
  const id=btn.dataset.id,f=btn.dataset.f,r=ROWS.find(x=>x.id===id);
  const d=document.createElement('div');d.className='picker';document.body.appendChild(d);
  if(f==='topic'){pk={el:d,id,f,path:[]};renderTopicPicker();place(d,btn);return}
  const opts=pool(f).filter(t=>!r[f].includes(t));
  d.innerHTML=`<input placeholder="검색 또는 새 키워드 입력 후 Enter${f==='etc'?' (예: 판례: Ferrini / 조약: UN헌장 51조)':''}"><div class="opts">${opts.map(t=>`<span class="chip c-${f}" data-act="pick" data-t="${esc(t)}" title="${esc(t)}">${esc(short(f,t))}</span>`).join('')}</div>`;
  place(d,btn);pk={el:d,id,f};
  const inp=d.querySelector('input');inp.focus({preventScroll:true});
  inp.addEventListener('input',()=>{const v=inp.value.trim();d.querySelectorAll('.opts .chip').forEach(c=>c.style.display=c.dataset.t.includes(v)?'':'none')});
  inp.addEventListener('keydown',e=>{
    if(e.key==='Escape')closePicker();
    if(e.key==='Enter'&&inp.value.trim())addTag(id,f,inp.value.trim());
  });
}
function pkSelect(full){
  if(pk&&pk.mode==='detmove'){if(!full.includes('›'))return;st.detParent[pk.t]=full;openMid.add(full);save();closePicker();render();return}
  if(pk&&pk.mode==='case'){
    const t=pk.t,cur=[...caseTagPaths(t,[])];
    if(!cur.includes(full))cur.push(full);
    st.caseTag[t]=cur;save();closePicker();render();return;
  }
  addTag(pk.id,'topic',full);
}
function addTag(id,f,t){
  const r=ROWS.find(x=>x.id===id);
  if(!r[f].includes(t)){if(f!=='topic'&&!st.kw[f].includes(t))st.kw[f].push(t);setOv(id,f,[...r[f],t])}
  closePicker();rerender();
}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(pk&&!e.target.closest('.picker')&&!(a&&(a.dataset.act==='add'||a.dataset.act.startsWith('tp-'))))closePicker();
  if(!a)return;
  const act=a.dataset.act,id=a.dataset.id,f=a.dataset.f,t=a.dataset.t;
  if(act==='tg-big'){closedBig.has(t)?closedBig.delete(t):closedBig.add(t);render();return}
  if(act==='tg-etc'){closedEtc.has(t)?closedEtc.delete(t):closedEtc.add(t);render();return}
  if(act==='tg-mid'){openMid.has(t)?openMid.delete(t):openMid.add(t);render();return}
  if(act==='add')openPicker(a);
  else if(act==='pick'&&pk)addTag(pk.id,pk.f,t);
  else if(act==='tp-go'&&pk){pk.path=pk.path.slice(0,+a.dataset.i);renderTopicPicker()}
  else if(act==='tp-in'&&pk){const k=a.dataset.k;if(pk.path.length>=1)pkSelect([...pk.path,k].join('›'));else{pk.path.push(k);renderTopicPicker()}}
  else if(act==='tp-sel'&&pk)pkSelect(pk.path[0]);
  else if(act==='ctag-rm'){const p2=a.dataset.p;st.caseTag[t]=caseTagPaths(t,[]).filter(x=>x!==p2);save();render()}
  else if(act==='rm'){const r=ROWS.find(x=>x.id===id);setOv(id,f,r[f].filter(x=>x!==t));rerender()}
  else if(act==='kwf'){navStack.push({view,y:scrollY,etcType,kw:flt.kw});try{history.pushState({n:navStack.length},'')}catch(e){};flt.kw={f,t};view='table';render();scrollTo(0,0)}
  else if(act==='back'){if(history.state&&history.state.n){history.back()}else goBack()}
  else if(act==='clrkw'){flt.kw=null;renderTable()}
  else if(act==='tog'){const k=a.dataset.k;open.has(k)?open.delete(k):open.add(k);render()}
  else if(act==='etype'){etcType=t;render()}
});

    e.preventDefault();closePicker();
    const d=document.createElement('div');d.className='picker';document.body.appendChild(d);
    pk={el:d,mode:'case',t:row.dataset.t,path:[]};renderTopicPicker();
    d.style.top=(e.pageY+6)+'px';d.style.left=Math.max(8,Math.min(e.pageX,scrollX+innerWidth-d.offsetWidth-12))+'px';
    return;
  }
  const a=e.target.closest('[data-act="tp-in"]');if(!a||!pk)return;
  const full=[...pk.path,a.dataset.k].join('›');
  if(!st.cat.includes(full)||usedPrefix(full))return;
  e.preventDefault();
  st.cat=st.cat.filter(x=>x!==full&&!x.startsWith(full+'›'));save();renderTopicPicker();
});
let mt;
document.addEventListener('input',e=>{
  if(!e.target.classList.contains('memo'))return;
  const id=e.target.dataset.id,v=e.target.innerText.trim();
  clearTimeout(mt);mt=setTimeout(()=>{st.ov[id]=st.ov[id]||{};st.ov[id].memo=v;save();const r=ROWS.find(x=>x.id===id);if(r)r.memo=v},400);
});
document.getElementById('tabs').addEventListener('click',e=>{const b=e.target.closest('button');if(b){view=b.dataset.v;render()}});
document.getElementById('gsel').addEventListener('change',e=>{G=e.target.value;render()});
document.getElementById('exp').onclick=()=>{
  const blob=new Blob([JSON.stringify(st,null,1)],{type:'application/json'});
  const u=URL.createObjectURL(blob),a=document.createElement('a');
  a.href=u;a.download=`국제법_기출분석_백업_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);
};
document.getElementById('imp').onclick=()=>document.getElementById('impf').click();
document.getElementById('impf').onchange=e=>{
  const fl=e.target.files[0];if(!fl)return;
  fl.text().then(s=>{try{const o=JSON.parse(s);st.ov=o.ov||{};st.kw=Object.assign({topic:[],det:[],etc:[],trap:[],anal:[]},o.kw||{});st.cat=o.cat||[];st.caseTag=o.caseTag||{};st.detParent=o.detParent||{};save();build();render()}catch(err){alert('파일을 읽지 못했어요')}});
  e.target.value='';
};
const main=document.getElementById('main');
build();render();
window.__cloud=makeCloud('database_v1/intllaw_analysis',KEY,()=>st,o=>{closePicker();closeCM();st.ov=o.ov||{};st.kw=Object.assign({topic:[],det:[],etc:[],trap:[],anal:[]},o.kw||{});st.cat=o.cat||[];st.caseTag=o.caseTag||{};st.detParent=o.detParent||{};if(o.ctFix1)st.ctFix1=o.ctFix1;try{localStorage.setItem(KEY,JSON.stringify(st))}catch(e){};build();render()});
</script>
