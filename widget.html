<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes">
<link rel="apple-touch-icon" href="icon.png">
<title>Widget</title>
<style>
@font-face{font-family:'GM';font-weight:300;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff')}
@font-face{font-family:'GM';font-weight:500;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'GM';font-weight:700;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}
:root{--bg:#ffffff;--ink:#111111;--sub:#8a8f98;--line:rgba(0,0,0,.07);--sky:#5b8fc7}
@media (prefers-color-scheme:dark){:root{--bg:#141414;--ink:#f2f2f2;--sub:#9aa0a8;--line:rgba(255,255,255,.08)}}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'GM','Paperlogy',-apple-system,sans-serif;scrollbar-width:none;-ms-overflow-style:none}
::-webkit-scrollbar{display:none}
body{padding:max(14px,env(safe-area-inset-top)) 16px 14px;overflow:auto}
.hd{display:flex;align-items:baseline;gap:7px;margin-bottom:12px}
.hd b{font-size:22px;font-weight:700;letter-spacing:-.02em}
.hd small{font-size:11px;font-weight:500;color:var(--sub);letter-spacing:.06em}
.hd .sp{flex:1}.hd .tm{font-size:12px;color:var(--sub)}
ul{list-style:none;display:flex;flex-direction:column;gap:6px}
li{display:flex;align-items:center;gap:7px;font-size:14px;line-height:1.3;min-width:0}
li.sub{padding-left:47px}
.tg{flex:0 0 auto;min-width:40px;max-width:64px;text-align:center;border-radius:4px;padding:2px 5px;font-size:9px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tg.e{background:none!important}
.tx{min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:1px 4px;border-radius:3px;font-weight:300}
.tx.h{font-weight:500;color:#111}
.none{font-size:20px;color:var(--sub);font-weight:300}
.cd{display:flex;flex-direction:column;min-height:100%;cursor:pointer;user-select:none}
.cd .sj{font-size:10px;font-weight:500;color:var(--sub);letter-spacing:.08em;margin-bottom:8px}
.cd .tt{font-size:21px;font-weight:700;letter-spacing:-.02em;line-height:1.3}
.cd .its{margin-top:12px;display:flex;flex-direction:column;gap:7px;transition:opacity .2s}
.cd.hide .its{opacity:0}
.cd .it{font-size:13px;line-height:1.45;font-weight:300}
.cd .it b{display:block;font-weight:700;color:var(--sky);margin-bottom:2px}
.sep{height:1px;background:var(--line);margin:16px 0}
</style>
</head>
<body>
<div id="root"></div>
<script>
const DB='https://tracker-d3a39-default-rtdb.firebaseio.com/';
const Q=new URLSearchParams(location.search);const MODE=(Q.get('w')||'plan').toLowerCase();
const DOW=['SUN','MON','TUE','WED','THU','FRI','SAT'];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const strip=s=>{const d=document.createElement('div');d.innerHTML=String(s==null?'':s).replace(/<br\s*\/?>/gi,' ');return (d.textContent||'').replace(/\s+/g,' ').trim();};
const parse=v=>{if(v==null)return null;if(typeof v==='string'){try{return JSON.parse(v);}catch(e){return null;}}return v;};
const arr=x=>Array.isArray(x)?x.filter(v=>v!=null):(x&&typeof x==='object'?Object.values(x).filter(v=>v!=null):[]);
const hexOk=h=>/^#?[0-9a-f]{6}$/i.test(String(h||''))?(h[0]==='#'?h:'#'+h):null;
const lum=h=>{const n=parseInt(h.slice(1),16);return (0.299*(n>>16)+0.587*((n>>8)&255)+0.114*(n&255))/255;};
async function get(path,key){try{const r=await fetch(DB+path+'.json',{cache:'no-store'});const v=await r.json();try{localStorage.setItem('w_'+key,JSON.stringify(v));}catch(e){}return v;}catch(e){try{return JSON.parse(localStorage.getItem('w_'+key));}catch(_){return null;}}}
let PLAN='',CARD='';
async function plan(){
  const [pd,tg]=await Promise.all([get('study_records/my_study_data_final10/plannerData','pd'),get('study_records/my_study_data_final10/plannerTags','tg')]);
  const P=parse(pd)||{},T=arr(parse(tg));const d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);
  const key=(d.getMonth()+1)+'.'+d.getDate();const day=P[key]||{items:[]};const rows=[];
  arr(day.items).forEach(it=>{const t=T.find(x=>x.id===it.tag)||{};const col=hexOk(t.color)||'#c9c9c9';rows.push({tag:t.name||it.tag||'',col,text:strip(it.text),hl:hexOk(it.hl)});arr(it.subItems).forEach(s=>rows.push({sub:1,col,text:strip(s.text),hl:hexOk(s.hl)}));});
  PLAN=`<div class="hd"><b>${key}</b><small>${DOW[d.getDay()]}</small><span class="sp"></span>${day.studyTime?`<span class="tm">${esc(day.studyTime)}</span>`:''}</div>`+
   (rows.length?`<ul>${rows.map(r=>`<li class="${r.sub?'sub':''}">${r.sub?'':`<span class="tg" style="background:${r.col};${lum(r.col)>.62?'color:#111':''}">${esc(r.tag)}</span>`}<span class="tx${r.hl?' h':''}" style="${r.hl?`background:${r.hl}bf`:''}">${esc(r.text)}</span></li>`).join('')}</ul>`:'<div class="none">—</div>');}
let CARDS=[],SUBS=[];
async function loadCards(){const S=parse(await get('flashcards_data/v1/json','cards'))||{};const del=S.deleted||{};SUBS=arr(S.subjects);CARDS=arr(S.cards).filter(c=>!del[c.id]&&(strip(c.title)||arr(c.items).length));}
function card(){if(!CARDS.length){CARD='<div class="none">—</div>';return;}const c=CARDS[Math.floor(Math.random()*CARDS.length)];const sj=SUBS.find(s=>s.id===c.subjectId);const its=arr(c.items).filter(i=>strip(i.text)||strip(i.label));
  const title=strip(c.title)||strip(its[0]&&its[0].label);
  CARD=`<div class="cd hide" id="cd">${sj?`<div class="sj">${esc(String(sj.name).toUpperCase())}</div>`:''}<div class="tt">${esc(title)}</div><div class="its">${its.map(i=>`<div class="it">${strip(i.label)&&strip(i.label)!==title?`<b>${esc(strip(i.label))}</b>`:''}${esc(strip(i.text))}</div>`).join('')}</div></div>`;}
function draw(){const R=document.getElementById('root');R.innerHTML=MODE==='card'?CARD:MODE==='both'?PLAN+'<div class="sep"></div>'+CARD:PLAN;}
document.addEventListener('click',e=>{const cd=e.target.closest('#cd');if(!cd)return;if(cd.classList.contains('hide'))cd.classList.remove('hide');else{card();draw();}});
async function run(){if(MODE!=='card')await plan();if(MODE!=='plan'){if(!CARDS.length)await loadCards();if(!CARD)card();}draw();}
run();setInterval(()=>{if(MODE!=='card')plan().then(draw);},5*60*1000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){CARD='';run();}});
</script>
</body>
</html>
