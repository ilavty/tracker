<style>
@font-face{font-family:'Paperlogy';font-weight:300;src:url('fonts/Paperlogy-3Light.ttf') format('truetype')}
@font-face{font-family:'Paperlogy';font-weight:400;src:url('fonts/Paperlogy-4Regular.ttf') format('truetype')}
@font-face{font-family:'Paperlogy';font-weight:500;src:url('fonts/Paperlogy-5Medium.ttf') format('truetype')}
@font-face{font-family:'Paperlogy';font-weight:600;src:url('fonts/Paperlogy-6SemiBold.ttf') format('truetype')}
@font-face{font-family:'Paperlogy';font-weight:700;src:url('fonts/Paperlogy-7Bold.ttf') format('truetype')}
@font-face{font-family:'GM';font-weight:300;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansLight.woff') format('woff')}
@font-face{font-family:'GM';font-weight:500;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansMedium.woff') format('woff')}
@font-face{font-family:'GM';font-weight:700;src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2001@1.1/GmarketSansBold.woff') format('woff')}
:root{--bgg:linear-gradient(165deg,#dfeaf6 0%,#eef3f8 45%,#f6efe6 100%);--line:rgba(17,17,17,.1);--line2:rgba(17,17,17,.07);--ink:#111;--sky:#6ba3eb;--skyl:#e8f1f9;--brown:#8a6a4f;--sub:#7c8796;--glass:rgba(255,255,255,.42);--glassb:rgba(255,255,255,.55)}
*{box-sizing:border-box}
html,body{margin:0;background:transparent;color:var(--ink);font-family:'Paperlogy','GM',sans-serif;-webkit-font-smoothing:antialiased;scrollbar-width:none}
html::-webkit-scrollbar,body::-webkit-scrollbar,*::-webkit-scrollbar{display:none}
button{font-family:inherit;cursor:pointer}
#wrap{position:relative;width:100%;overflow:hidden;border-radius:26px}
#cv{position:absolute;left:0;top:0;width:1150px;background:var(--bgg);background-size:cover;background-position:center;overflow:hidden}
#cv.edit{outline:0}
#cv.edit::after{content:'';position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(0,0,0,.12) 1px,transparent 1px);background-size:25px 25px}
.it{position:absolute;touch-action:none}
.it.sel{z-index:9999!important}
.gl{position:absolute;z-index:19999;pointer-events:none;background:#e0559a}
.gl.v{width:1px;top:0;bottom:0}.gl.h{height:1px;left:0;right:0}
#cv.edit .it{cursor:grab}
#cv.edit .it{outline:1px dashed rgba(17,17,17,.3);outline-offset:3px}
#cv.edit .it.sel{outline-color:var(--ink)}
.it .rz{display:none;position:absolute;right:4px;bottom:4px;width:18px;height:18px;border-radius:50%;background:#fff;border:1.5px solid var(--ink);cursor:nwse-resize;z-index:3}
#cv.edit .it .rz{display:block}
/* 이미지 */
.it.img{border-radius:16px;overflow:hidden}
.it.img.sq{border-radius:0}
.it.img img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none;-webkit-user-drag:none;user-select:none}
/* 글 */
.it.txt{display:flex;align-items:flex-start}
.it.txt.tb{padding:14px 18px;border-radius:16px;overflow:hidden}.it.txt.tb.sq{border-radius:0}
.it.txt.tb-glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px rgba(30,40,60,.08)}
.it.txt.tb-white{background:rgba(255,255,255,.92);box-shadow:0 10px 30px rgba(30,40,60,.07)}
.it.txt.tb-dark{background:rgba(20,22,26,.38);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px)}
.it.txt .tx{width:100%;outline:none;white-space:pre-wrap;word-break:keep-all;line-height:1.25;font-weight:500}
#cv:not(.edit) .it.txt .tx{-webkit-user-select:text;user-select:text}
/* 위젯 (유리) */
.w{border-radius:24px;overflow:hidden;display:flex;flex-direction:column}
.w.glass{background:var(--glass);-webkit-backdrop-filter:blur(22px) saturate(1.4);backdrop-filter:blur(22px) saturate(1.4);box-shadow:0 1px 0 rgba(255,255,255,.6) inset,0 10px 30px rgba(30,40,60,.08)}
.w.white{background:rgba(255,255,255,.92);box-shadow:0 10px 30px rgba(30,40,60,.07)}
.w.clear{background:transparent}
.w.dark{background:rgba(20,22,26,.38);-webkit-backdrop-filter:blur(22px);backdrop-filter:blur(22px);color:#fff}
.w.dark .lbl,.w.dark .sm{color:rgba(255,255,255,.7)}
/* 시계 */
.clock{align-items:center;justify-content:center;text-align:center;color:var(--ink)}
.clock.clear{text-shadow:none}
.clock .dt{font-family:'GM';font-weight:500;letter-spacing:.01em;opacity:.78}
.clock .tm{font-family:'GM';font-weight:700;letter-spacing:-.04em;line-height:.92}
.clock.light .dt,.clock.light .tm{color:#fff}
/* 작은 위젯 */
.lbl{font-family:'GM';font-size:12px;font-weight:500;letter-spacing:.02em;color:var(--sub)}
.dd{padding:18px 20px;justify-content:space-between}
.dd b{font-family:'GM';font-weight:700;font-size:44px;letter-spacing:-.04em;line-height:1}
.dd .sm{font-size:12px;color:var(--sub);font-family:'GM';font-weight:300}
.td{padding:18px 20px;gap:9px;overflow-y:auto!important}
.wkc{display:flex;flex-wrap:wrap;gap:5px}.wkc span{border-radius:6px;padding:2px 8px;font-size:12.5px;font-weight:700;color:#fff}
.wkh{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.mg{display:flex;flex-direction:column;gap:12px;margin-top:4px}
.mgh{display:flex;align-items:center;gap:7px;font-size:13px;font-weight:700;margin-bottom:4px}
.mgh i{width:8px;height:8px;border-radius:50%}
.mrow{display:flex;justify-content:space-between;gap:10px;padding:2px 0 2px 15px;font-size:13px;font-weight:500;line-height:1.35}
.mrow small{font-family:'GM';font-weight:300;font-size:11px;color:var(--sub);white-space:nowrap}
.w.dark .mrow small{color:rgba(255,255,255,.65)}
.td ul.mis{gap:5px}.td ul.mis li{display:grid;grid-template-columns:8px 1fr auto;gap:8px;align-items:baseline;font-size:13px;font-weight:500}
.td ul.mis li i{width:8px;height:8px;border-radius:50%;align-self:center}.td ul.mis li small{font-family:'GM';font-weight:300;font-size:11px;color:var(--sub)}
.w.dark .wkc span{color:#fff}
.td ul,.cy ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.cy ul{gap:13px}
.td li{display:flex;align-items:center;gap:9px;font-size:15px;font-weight:600}
.td li i{width:22px;height:10px;border-radius:5px;flex-shrink:0}
.td .none,.cy .none{font-family:'GM';font-weight:300;color:var(--sub);font-size:22px}
.cy{padding:18px 20px;gap:10px}
.dr{padding:18px 20px;gap:4px}
.ms{padding:16px 18px 14px;gap:10px}
.mu{flex:1;min-height:0;display:flex;gap:16px;align-items:center;min-width:0}
.mu .cv{height:100%;max-height:150px;aspect-ratio:1;border-radius:12px;overflow:hidden;flex-shrink:0;background:rgba(17,17,17,.08);display:flex;align-items:center;justify-content:center;box-shadow:0 4px 14px rgba(0,0,0,.14)}
.mu .cv img{width:100%;height:100%;object-fit:cover;display:block;pointer-events:none}
.mu .cv span{font-size:24px;color:var(--sub)}
.mr{flex:1;min-width:0;display:flex;flex-direction:column;gap:9px;justify-content:center}
.mt{display:flex;flex-direction:column;gap:3px;min-width:0}
.mt b{font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;min-height:1.2em}
.mt span{font-size:13px;color:var(--sub);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;outline:none;min-height:1.2em}
.mt [contenteditable]{white-space:nowrap;overflow-x:auto;text-overflow:clip;scrollbar-width:none;cursor:text;border-radius:4px;background:rgba(107,163,235,.08)}.mt [contenteditable]:focus{background:rgba(107,163,235,.18)}
.mbar{height:4px;border-radius:2px;background:rgba(17,17,17,.12);overflow:hidden;flex-shrink:0}
.mbar i{display:block;height:100%;width:0;background:var(--ink);opacity:.75;border-radius:2px;animation:mplay 214s linear infinite}
@keyframes mplay{from{width:0}to{width:100%}}
.mctl{display:flex;justify-content:center;gap:30px;font-size:14px;color:var(--ink);opacity:.8;user-select:none}
.mctl .pp{font-size:16px}
/* 세로로 길면: 커버 크게 위에, 아래 제목·바 */
.ms.tall .mu{flex-direction:column;align-items:stretch;gap:12px}
.ms.tall .mu .cv{height:auto;width:100%;max-height:none;flex:1;min-height:0;aspect-ratio:auto}
.ms.tall .mr{flex:none}
.ms.tall .mt b{font-size:18px}
.ms.nocv .mr{gap:10px}
.ms.short .mctl{display:none}.ms.short{gap:6px;padding-top:12px;padding-bottom:12px}.ms.short .mr{gap:7px}
.ms.tiny .lbl{display:none}
/* 긴 제목은 흐르게 */
.mt b{display:block}
.mt b .mq{display:inline-block;white-space:nowrap}
.mt b.run{text-overflow:clip;-webkit-mask-image:linear-gradient(90deg,#000 88%,transparent);mask-image:linear-gradient(90deg,#000 88%,transparent)}
.mt b.run .mq{padding-right:40px;animation:mq var(--mqd,12s) linear infinite}
@keyframes mq{0%,12%{transform:translateX(0)}88%,100%{transform:translateX(calc(-1 * var(--mqw,0px)))}}
body.dark .mbar{background:rgba(255,255,255,.14)}body.dark .mu .cv{background:rgba(255,255,255,.08)}
.dr .dcity{display:flex;align-items:center;gap:8px;margin-top:6px}.dr .dcity b{font-size:26px;font-weight:700;letter-spacing:-.02em}.dr .fl{font-size:24px;line-height:1}
.dr .dsub{font-family:'GM';font-weight:300;font-size:12px;color:var(--sub)}
.dr .dbar{height:5px;border-radius:3px;background:rgba(17,17,17,.1);margin-top:auto;overflow:hidden}.dr .dbar i{display:block;height:100%;background:var(--sky);border-radius:3px}
.dr .dh{display:flex;justify-content:space-between;font-family:'GM';font-weight:300;font-size:11px;color:var(--sub)}
.w.dark .dr .dsub,.w.dark .dr .dh{color:rgba(255,255,255,.7)}
.cy li{display:flex;flex-direction:column;gap:4px;font-size:14px;line-height:1.3}
.cy li div{display:flex;gap:8px;align-items:baseline}
.cy li b{font-weight:700}
.cy li span{font-family:'GM';font-weight:300;font-size:12px;color:var(--sub)}
.cy li em{font-style:normal;font-family:'GM';font-weight:500;font-size:13px}
/* 달력 */
.cal{padding:18px 18px 14px}
.cal .ch{display:flex;align-items:baseline;gap:10px;padding:0 4px 10px}
.cal .ch b{font-family:'GM';font-weight:700;font-size:22px;letter-spacing:-.02em}
.cal .ch small{font-family:'GM';font-weight:300;font-size:14px;color:var(--sub)}
.cal .ch .sp{flex:1}
.cal .ch button{border:0;background:none;font-size:15px;color:var(--sub);padding:2px 6px;opacity:.7}
.cal .ch button:hover{opacity:1}
.cal .ch .now{font-family:'GM';font-size:11px;letter-spacing:.06em}
.cal .wk,.cal .gd{display:grid;grid-template-columns:repeat(7,minmax(0,1fr))}
.cal .wk span{font-family:'GM';font-weight:500;font-size:10.5px;letter-spacing:.08em;color:var(--sub);text-align:left;padding:0 6px 6px}
.cal .wk span:first-child{color:#d0675c}
.cal .gd{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr);border-top:1px solid var(--line)}
.cal .dc{border-bottom:1px solid var(--line2);padding:5px 4px 4px;min-height:0;overflow:hidden;display:flex;flex-direction:column;gap:1.5px}
.cal .dc .n{font-family:'GM';font-weight:500;font-size:11px;padding-left:2px;line-height:1.2}
.cal .tenh{display:inline-block;width:4px;height:4px;border-radius:50%;background:currentColor;margin-left:3px;vertical-align:middle;position:relative;top:-1px}
.cal .dc.sun .n{color:#d0675c}
.cal .dc.out{opacity:.28}
.cal .dc.today .n{display:inline-block;align-self:flex-start;background:var(--ink);color:var(--paper,#fff);border-radius:9px;padding:1px 6px}
.cal .bk{display:block;flex-shrink:0;border-radius:4px;padding:0 5px;font-size:9px;font-weight:700;color:#fff;white-space:normal;word-break:keep-all;overflow-wrap:anywhere;line-height:1.4}
.cal .cm{display:block;font-size:8.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-left:2px;line-height:1.35}
.cal .cm::before{content:'▸ ';opacity:.6}
.cal .cm.e::before{content:'◂ '}
/* 편집 버튼, 도구 */
 /* 어두운 버전 */
body.dark{--bgg:linear-gradient(165deg,#121822 0%,#1a2230 50%,#262220 100%);--ink:#f1f1ee;--sub:rgba(241,241,238,.55);--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.12);--line2:rgba(255,255,255,.07);--paper:#121822;--skyl:#e8f1f9;color:var(--ink)}
body.dark .w.glass{box-shadow:0 0 0 1px rgba(255,255,255,.07) inset,0 10px 30px rgba(0,0,0,.25)}
body.dark .w.white{background:rgba(32,38,50,.92);box-shadow:0 10px 30px rgba(0,0,0,.25)}
body.dark .it.txt.tb-white{background:rgba(32,38,50,.92)}
body.dark .it.txt.tb-glass{background:rgba(255,255,255,.07)}
body.dark .dr .dbar{background:rgba(255,255,255,.12)}
body.dark #cv.edit::after{background-image:radial-gradient(rgba(255,255,255,.14) 1px,transparent 1px)}
body.dark #cv.edit .it{outline-color:rgba(255,255,255,.3)}
body.dark #tools button{background:rgba(255,255,255,.1);color:var(--ink)}
body.dark #editBtn.on{background:#f1f1ee;color:#111}
/* 전체화면 */
html.full,html.full body{height:100%;overflow:hidden;background:var(--bgg)}
#wrap.full{position:fixed;inset:0;border-radius:0;height:100vh!important;background:var(--bgg);display:flex;align-items:center;justify-content:center}
#wrap.full #cv{position:relative;flex-shrink:0}
#tools{position:absolute;right:16px;top:14px;z-index:20000;display:flex;gap:0;align-items:center}
#tools button{margin-left:6px}#tools .opt{margin-left:0}#tools.open .opt,#tools.on .opt,html.full #tools #fullBtn{margin-left:6px}
#tools.on .opt{transition:none}
#tools button{border:0;background:rgba(255,255,255,.5);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);color:var(--ink);font-family:'GM';font-weight:500;font-size:12px;letter-spacing:.04em;padding:6px 11px;border-radius:14px;opacity:.55}
#tools button:hover{opacity:1}
#tools.on button{opacity:.95}
 #tools .opt{max-width:0;padding-left:0!important;padding-right:0!important;opacity:0!important;overflow:hidden;white-space:nowrap;transform:translateX(14px);pointer-events:none;transition:max-width .32s cubic-bezier(.2,.8,.2,1),padding .32s,opacity .22s,transform .32s cubic-bezier(.2,.8,.2,1)}
#tools.open .opt,#tools.on .opt{max-width:80px;padding-left:11px!important;padding-right:11px!important;opacity:.6!important;transform:none;pointer-events:auto}
#tools.open .opt:hover{opacity:1!important}
#tools.open #editBtn{transition-delay:0s}#tools.open #darkBtn{transition-delay:.05s}#tools.open #fullBtn{transition-delay:.1s}
#tools.on #editBtn{opacity:1!important}
html.full #tools:not(.open) #fullBtn{max-width:80px;padding-left:11px!important;padding-right:11px!important;opacity:.6!important;transform:none;pointer-events:auto}
#moreBtn{letter-spacing:.08em!important;padding:6px 10px!important}
#tools.on #moreBtn{display:none}
#tools .add{display:none}
#tools.on .add{display:inline-block}
#editBtn.on{background:var(--ink);color:#fff;opacity:1}
/* 메뉴 */
.menu{position:fixed;z-index:30000;min-width:150px;background:rgba(255,255,255,.96);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border-radius:12px;box-shadow:0 10px 34px rgba(0,0,0,.16);padding:5px;font-size:13.5px}
.menu button{display:flex;width:100%;border:0;background:none;text-align:left;padding:7px 11px;border-radius:7px;color:var(--ink);gap:8px;align-items:center}
.menu button:hover{background:var(--skyl)}
.menu hr{border:0;border-top:1px solid #eee;margin:4px 6px}
.menu .row{display:flex;gap:5px;padding:5px 9px}
.menu .row button{width:auto;padding:0;border-radius:50%;width:20px;height:20px;border:1px solid rgba(0,0,0,.15)}
.menu .row.fonts{flex-wrap:wrap;max-width:280px;gap:3px}.menu .row.fonts button{font-size:11.5px!important;padding:2px 6px!important}
.menu{max-height:calc(100vh - 16px);overflow-y:auto}
.menu .nv{font-family:'GM';font-size:11px;min-width:34px;text-align:center;color:var(--ink)}
.menu .cap{font-size:11px;color:var(--sub);padding:5px 11px 1px;font-family:'GM'}
/* 이미지 넣기 창 */
 #crop{position:fixed;inset:0;z-index:40000;display:none;align-items:center;justify-content:center;background:rgba(20,24,30,.55)}
#crop.on{display:flex}
#crop .cbox{background:#fff;border-radius:20px;padding:18px;box-shadow:0 20px 50px rgba(0,0,0,.25)}
#crop .cst{position:relative;user-select:none;-webkit-user-select:none;touch-action:none;line-height:0}
#crop .cst img{display:block;max-width:min(78vw,900px);max-height:68vh;pointer-events:none;-webkit-user-drag:none}
#crop .crect{position:absolute;outline:1.5px solid #fff;cursor:move}
#crop .cshade{position:absolute;inset:0;pointer-events:none}#crop .cshade b{position:absolute;background:rgba(0,0,0,.5)}
#crop .cbox{padding:24px 24px 18px}
#crop .crect i{position:absolute;width:18px;height:18px;background:#fff;border-radius:50%;margin:-9px 0 0 -9px;box-shadow:0 1px 4px rgba(0,0,0,.3)}
#crop .crect i[data-h=nw]{left:0;top:0;cursor:nwse-resize}#crop .crect i[data-h=ne]{left:100%;top:0;cursor:nesw-resize}
#crop .crect i[data-h=sw]{left:0;top:100%;cursor:nesw-resize}#crop .crect i[data-h=se]{left:100%;top:100%;cursor:nwse-resize}
#crop .crect i[data-h=n]{left:50%;top:0;width:26px;height:8px;border-radius:4px;margin:-4px 0 0 -13px;cursor:ns-resize}#crop .crect i[data-h=s]{left:50%;top:100%;width:26px;height:8px;border-radius:4px;margin:-4px 0 0 -13px;cursor:ns-resize}
#crop .crect i[data-h=w]{left:0;top:50%;width:8px;height:26px;border-radius:4px;margin:-13px 0 0 -4px;cursor:ew-resize}#crop .crect i[data-h=e]{left:100%;top:50%;width:8px;height:26px;border-radius:4px;margin:-13px 0 0 -4px;cursor:ew-resize}
#crop .bt{display:flex;gap:8px;margin-top:14px;align-items:center}#crop .bt .sp{flex:1}
#crop .bt button{border:0;border-radius:11px;padding:8px 14px;font-size:13px;background:#f1f1f1;color:var(--ink)}#crop .bt .ok{background:var(--ink);color:#fff}
#song{position:fixed;inset:0;z-index:40000;display:none;align-items:center;justify-content:center;background:rgba(20,24,30,.18)}#song.on{display:flex}
#song .box{width:min(360px,92vw);background:#fff;color:#111;border-radius:20px;padding:20px;box-shadow:0 20px 50px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px}
#song label{display:flex;flex-direction:column;gap:5px;font-family:'GM';font-size:11.5px;color:#7c8796;letter-spacing:.04em}
#song input{border:0;background:#e8f1f9;border-radius:10px;padding:10px 12px;font-family:'Paperlogy';font-size:15px;color:#111;outline:none}
#song .bt{display:flex;gap:8px;align-items:center}#song .bt .sp{flex:1}#song .bt button{border:0;border-radius:11px;padding:8px 14px;font-size:13px;background:#f1f1f1;color:#111}#song .bt .ok{background:#111;color:#fff}

#sheet.on{display:flex}

/* ───── 데이터 ───── */
const FB={apiKey:"AIzaSyCboDDyAjbNBN6aPQXdQD0L9jk64ykWQ8o",projectId:"time-8d30b",databaseURL:"https://tracker-d3a39-default-rtdb.firebaseio.com/"};
const STUDY='study_records/my_study_data_final10', ROOT='overview_v1', LK='overview_cache_v1';
const THEMES=["#5a97eb","#ff6b6b","#4ecdc4","#ffa62b","#9b5de5"];
let db=null;try{firebase.initializeApp(FB,'ovApp');db=firebase.app('ovApp').database();}catch(e){db=null;}
let O={items:{},imgs:{},wall:null}, ST={pData:{},pTags:[],tracker:{}}, ready=false, studyReady=false;
try{const c=JSON.parse(localStorage.getItem(LK)||'null');if(c){O={items:c.items||{},imgs:c.imgs||{},wall:c.wall||null,theme:c.theme||null};}}catch(e){}

function put(path,v){const [k,id]=path.split('/');if(id){if(v===null)delete O[k][id];else O[k][id]=v;}else O[k]=v;cache();if(db&&ready)db.ref(ROOT+'/'+path).set(v);}
const uid=()=>'i'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const pad=n=>String(n).padStart(2,'0');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

const pj=v=>{if(typeof v==='string'){try{return JSON.parse(v);}catch(e){return null;}}return v;};

function logicalToday(){const d=new Date();if(d.getHours()<5)d.setDate(d.getDate()-1);return d;}
const keyOf=d=>(d.getMonth()+1)+'.'+d.getDate();
/* 그날 형광펜 칠한 과목들 */
function dayTags(key){const day=ST.pData&&ST.pData[key];if(!day)return [];const seen=[];
  arr(day.items).forEach(it=>{if(!it)return;const done=it.hl||arr(it.subItems).some(s=>s&&s.hl);if(done&&it.tag&&!seen.includes(it.tag))seen.push(it.tag);});
  return mergePsat(seen);}
const tagInfo=id=>{const t=arr(ST.pTags).find(x=>x&&x.id===id)||{name:id,color:'#bbb'};return {id,name:t.name||id,color:t.color||'#bbb'};};
function mergePsat(ids){
  // 별(☆★) 태그는 빼고, 플래너 태그 순서대로
  const ord=arr(ST.pTags).map(x=>x&&x.id);const pos=id=>{const i=ord.indexOf(id);return i<0?999:i;};
  const L=ids.map(tagInfo).filter(t=>!/^[☆★✩✪✫✬✭✮✯⭐\s*]+$/.test(String(t.name).trim())).sort((x,y)=>pos(x.id)-pos(y.id));
  // 피셋 영역(자료·언어·상황·계산연습)은 PSAT 하나로: PSAT(상황∙자료)
  const PS=/^(PSAT|피셋)?\s*[(\[]?\s*(자료|언어|상황|계산연습|계산)?\s*[)\]]?$/i;
  const out=[];let ps=null;
  L.forEach(t=>{const m=String(t.name).trim().match(PS);
    if(m&&(m[1]||m[2])){const sub=m[2]?(m[2]==='계산연습'?'계산':m[2]):'';
      if(!ps){const pt=arr(ST.pTags).find(x=>x&&/^(PSAT|피셋)$/i.test(String(x.name).trim()))||arr(ST.pTags).find(x=>{if(!x)return false;const mm=String(x.name).trim().match(PS);return mm&&(mm[1]||mm[2]);});ps={id:'PSAT',name:'PSAT',color:pt?pt.color:t.color,subs:[]};out.push(ps);}
      if(sub&&!ps.subs.includes(sub))ps.subs.push(sub);}
    else out.push(t);});
  return out;}
/* 트래커 사이클 시작·끝 (TRACKER 탭과 같은 계산) */
function cycleEvents(){const ev={},list=[];const T=ST.tracker||{};const data=T.data||{};const yr=new Date().getFullYear();
  const pd=txt=>{const p=String(txt||'').trim().split('.');if(p.length!==2)return null;const m=+p[0],d=+p[1];return isNaN(m)||isNaN(d)?null:new Date(yr,m-1,d);};
  Object.keys(data).forEach(sub=>{arr(data[sub]&&data[sub].cycles).forEach(cy=>{if(!cy)return;const cats=arr(cy.cats);const all=[];
    cats.forEach(c=>arr(c&&c.sessions).forEach(s=>arr(s&&s.bars).forEach(b=>{const d=pd(b&&b.text);if(d)all.push(d);})));
    if(!all.length)return;const st=new Date(Math.min(...all));let en=null;
    const last=cats[cats.length-1];if(last){const N=arr(last.topics).length;const f=arr(last.sessions)[0];const eb=f&&arr(f.bars).find(b=>b.end===N-1);if(eb)en=pd(eb.text);}
    const color=THEMES[cy.palIdx||0]||THEMES[0];const name=sub+' '+(cy.num!=null?cy.num:'');
    (ev[keyOf(st)]=ev[keyOf(st)]||[]).push({k:'s',name,color});if(en)(ev[keyOf(en)]=ev[keyOf(en)]||[]).push({k:'e',name,color});
    list.push({sub,num:cy.num,color,st,en});});});
  return {ev,list};}

/* ───── 위젯 ───── */
const DOW=['일','월','화','수','목','금','토'],MONS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
let calOff=0;
const TD={txt:{ff:'pl',fw:500,ls:0,lh:1.25},clock:{ff:'gm',fw:700,ls:-0.04,lh:.92}};
const tv=(it,k)=>{const v=it[k]!=null?it[k]:TD[it.t][k];return k==='ff'&&!FF[v]?TD[it.t].ff:v;};
const FONTS=[['pl','Paperlogy',"'Paperlogy'"],['gm','Gmarket',"'GM'"],
 ['hm','Hahmlet',"'Hahmlet',serif"],['ns','Noto Serif',"'Noto Serif KR',serif"],['gb','고운바탕',"'Gowun Batang',serif"],['nm','나눔명조',"'Nanum Myeongjo',serif"],
 ['lb','Baskerville',"'Libre Baskerville','Hahmlet',serif"],['pf','Playfair',"'Playfair Display','Hahmlet',serif"],['cg','Cormorant',"'Cormorant Garamond','Gowun Batang',serif"],
 ['dm','DM Serif',"'DM Serif Display','Hahmlet',serif"],['is','Instrument',"'Instrument Serif','Gowun Batang',serif"],['bd','Bodoni',"'Bodoni Moda','Nanum Myeongjo',serif"],
 ['cp','Courier',"'Courier Prime','Paperlogy',monospace"],['se','Special Elite',"'Special Elite','Paperlogy',monospace"],
 ['ha','Homemade Apple',"'Homemade Apple','Nanum Pen Script',cursive"],['rb','Reenie Beanie',"'Reenie Beanie','Nanum Pen Script',cursive"],['np','나눔펜',"'Nanum Pen Script',cursive"],['gg','개구',"'Gaegu',cursive"]];
const FF=Object.fromEntries(FONTS.map(f=>[f[0],f[2]]));
function wClock(it){const d=new Date();const h=it.h;const tmS=Math.round(h*.62),dtS=Math.max(12,Math.round(h*.12));
  return `<div class="dt" style="font-size:${dtS}px;margin-bottom:${Math.round((tv(it,'lh')-1)*tmS*.6)}px;font-family:${FF[tv(it,'ff')]};${it.c?'color:'+it.c:''}">${d.getMonth()+1}월 ${d.getDate()}일 ${DOW[d.getDay()]}요일</div><div class="tm" style="font-size:${tmS}px;font-family:${FF[tv(it,'ff')]};font-weight:${tv(it,'fw')};letter-spacing:${tv(it,'ls')}em;line-height:1;${it.c?'color:'+it.c:''}">${d.getHours()}:${pad(d.getMinutes())}</div>`;}
function wDday(){let v=null;try{v=localStorage.getItem('myDday');}catch(e){}
  if(!v)return `<div class="lbl">D-DAY</div><b>—</b><div class="sm"></div>`;
  const t=new Date(v),n=new Date();t.setHours(0,0,0,0);n.setHours(0,0,0,0);const df=Math.ceil((t-n)/864e5);
  return `<div class="lbl">D-DAY</div><b>${df>0?'D-'+df:df===0?'D-Day':'D+'+(-df)}</b><div class="sm">${t.getFullYear()}.${t.getMonth()+1}.${t.getDate()}</div>`;}
/* 이번 주 (월~일): 칠한 과목 합쳐서 + 아래에 못한 것 */
function weekDays(){const t=logicalToday();t.setHours(0,0,0,0);const mon=new Date(t);mon.setDate(t.getDate()-((t.getDay()+6)%7));
  return [...Array(7)].map((_,i)=>{const d=new Date(mon);d.setDate(mon.getDate()+i);return d;}).filter(d=>d<=t);}
function grpOf(tagId){const t=tagInfo(tagId);const r=mergePsat([tagId]);return r.length?r[0]:null;}
function wToday(){const D=weekDays();const ids=[],miss=[];const DW=['일','월','화','수','목','금','토'];
  D.forEach(d=>{const day=ST.pData&&ST.pData[keyOf(d)];if(!day)return;
    arr(day.items).forEach(it=>{if(!it)return;const subs=arr(it.subItems).filter(Boolean);const done=it.hl||subs.some(s=>s.hl);
      if(done){if(it.tag&&!ids.includes(it.tag))ids.push(it.tag);if(!it.hl)subs.filter(s=>!s.hl&&s.text).forEach(s=>miss.push({d,tag:it.tag,text:(it.text?it.text+' · ':'')+s.text}));}
      else if(it.text)miss.push({d,tag:it.tag,text:it.text});});});
  const L=mergePsat(ids);
  // 못한 것: 과목별로 묶고, 같은 항목은 한 줄에 요일만 이어서
  const G=new Map();const ord=arr(ST.pTags).map(x=>x&&x.id);
  miss.forEach(m=>{const g=m.tag?grpOf(m.tag):null;const key=g?g.id:'_';if(!G.has(key))G.set(key,{g,pos:g?(g.id==='PSAT'?Math.min(...arr(ST.pTags).map((x,i)=>x&&mergePsat([x.id])[0]&&mergePsat([x.id])[0].id==='PSAT'?i:999)):ord.indexOf(g.id)):9999,rows:new Map()});
    const R=G.get(key).rows;const r=R.get(m.text)||{text:m.text,days:[]};const dw=DW[m.d.getDay()];if(!r.days.includes(dw))r.days.push(dw);R.set(m.text,r);});
  const groups=[...G.values()].filter(g=>g.g).sort((a,b)=>a.pos-b.pos);
  return `<div class="wkh"><span class="lbl">UNFINISHED</span></div>
   ${groups.length?`<div class="mg">${groups.map(g=>`<div class="mgr"><div class="mgh"><i style="background:${g.g?g.g.color:'#c9c9c9'}"></i>${esc(g.g?g.g.name:'기타')}</div>${[...g.rows.values()].map(r=>`<div class="mrow"><span>${esc(r.text)}</span><small>${r.days.join('·')}</small></div>`).join('')}</div>`).join('')}</div>`:'<div class="none">—</div>'}`;}
/* 외무영사 드림: 지금 가 있는 도시 (index-2.html의 도시 목록을 그대로 읽음) */
let POSTS=null,ENM={},DIP=null;
try{DIP=JSON.parse(localStorage.getItem('diplomat_state_v1')||'null');}catch(e){}
fetch('index-2.html').then(r=>r.text()).then(t=>{const g=(n,o,c)=>{const i=t.indexOf('var '+n+'=');if(i<0)return null;const j=t.indexOf('\n'+c,i);return t.slice(i+('var '+n+'=').length,j+1+c.length);};
  try{POSTS=new Function('return '+g('POSTS','[','];').replace(/;$/,''))();}catch(e){}
  try{ENM=new Function('return '+g('EN_MAP','{','};').replace(/;$/,''))();}catch(e){}
  if(!drag)renderLive();}).catch(()=>{});
const CEN={'UAE':'UAE','독일':'Germany','러시아':'Russia','미국':'USA','베트남':'Vietnam','브라질':'Brazil','스위스':'Switzerland','스페인':'Spain','싱가포르':'Singapore','아르헨티나':'Argentina','영국':'UK','오스트리아':'Austria','이탈리아':'Italy','인도':'India','인도네시아':'Indonesia','일본':'Japan','중국':'China','케냐':'Kenya','태국':'Thailand','튀르키예':'Türkiye','프랑스':'France','핀란드':'Finland','필리핀':'Philippines','호주':'Australia'};
const TEN={'대사관':'Embassy','총영사관':'Consulate General','대표부':'Mission','유엔대표부':'UN Mission'};
function wDream(){const p=DIP&&POSTS&&DIP.idx!=null?POSTS[DIP.idx]:null;
  if(!p)return `<div class="lbl">POSTING</div><div class="none">—</div>`;
  const el=+((DIP.elapsed||{})[DIP.idx]||0),T=360000,pc=Math.min(100,el/T*100);const h=Math.floor(el/3600);
  return `<div class="lbl">POSTING</div><div class="dcity"><b>${esc(ENM[p.city]||p.city)}</b></div>
   <div class="dsub">${esc(CEN[p.country]||p.country)} · ${esc(TEN[p.type]||p.type)}</div>
   <div class="dbar"><i style="width:${pc}%"></i></div><div class="dh"><span>${h}h</span><span>100h</span></div>`;}
function wCycle(){const {list}=cycleEvents();const now=logicalToday();now.setHours(0,0,0,0);
  const L=list.filter(c=>!c.en).sort((a,b)=>a.st-b.st);
  return `<div class="lbl">CYCLE</div>${L.length?`<ul>${L.map(c=>`<li><b style="color:${c.color}">${esc(c.sub)} ${esc(c.num)}</b><div><span>${c.st.getMonth()+1}.${c.st.getDate()} ~</span><em>${Math.floor((now-c.st)/864e5)+1}일째</em></div></li>`).join('')}</ul>`:'<div class="none">—</div>'}`;}
function studyH(key){const day=ST.pData&&ST.pData[key];if(!day)return 0;const v=String(day.studyTime==null?'':day.studyTime).trim();
  let m=v.match(/^(\d+):(\d{1,2})(?::(\d{1,2}))?$/);if(m)return +m[1]+(+m[2])/60+(+(m[3]||0))/3600;if(/^\d+(\.\d+)?$/.test(v))return parseFloat(v);
  return day._savedStudyTimeSecs?day._savedStudyTimeSecs/3600:0;}
function wCal(){const base=logicalToday();const m0=new Date(base.getFullYear(),base.getMonth()+calOff,1);const y=m0.getFullYear(),m=m0.getMonth();
  const first=new Date(y,m,1).getDay(),days=new Date(y,m+1,0).getDate();const rows=Math.ceil((first+days)/7);const {ev}=cycleEvents();const tk=keyOf(base);
  let cells='';for(let i=0;i<rows*7;i++){const d=new Date(y,m,1-first+i);const k=keyOf(d);const out=d.getMonth()!==m;
    const tags=out?[]:dayTags(k);const cs=out?[]:(ev[k]||[]);
    cells+=`<div class="dc${out?' out':''}${d.getDay()===0?' sun':''}${!out&&k===tk&&calOff===0?' today':''}"><span class="n">${d.getDate()}${!out&&studyH(k)>=10?'<i class="tenh"></i>':''}</span>${tags.map(t=>`<span class="bk" style="background:${t.color}">${esc(t.name)}</span>`).join('')}${cs.map(c=>`<span class="cm${c.k==='e'?' e':''}" style="color:${c.color}">${esc(c.name)} ${c.k==='s'?'시작':'끝'}</span>`).join('')}</div>`;}
  return `<div class="ch"><b>${MONS[m]}</b><small>${y}</small><span class="sp"></span>${calOff?'<button class="now" data-cal="0">today</button>':''}<button data-cal="-1">‹</button><button data-cal="1">›</button></div>
    <div class="wk">${['SUN','MON','TUE','WED','THU','FRI','SAT'].map(s=>`<span>${s}</span>`).join('')}</div><div class="gd" style="grid-template-rows:repeat(${rows},minmax(0,1fr))">${cells}</div>`;}
/* 재생 중 (직접 적기) */
function wMusic(it){const src=it.cover?(it.cover.img?O.imgs[it.cover.img]:it.cover.url):'';const ce=f=>edit?`contenteditable="true" spellcheck="false" data-mf="${f}"`:'';
  const cv=it.nocv?'':`<div class="cv">${src?`<img src="${esc(src)}" alt="">`:'<span>♪</span>'}</div>`;
  return `<div class="lbl">NOW PLAYING</div><div class="mu">${cv}<div class="mr">
   <div class="mt"><b class="mf" ${ce('title')}>${edit?esc(it.title||''):`<span class="mq">${esc(it.title||'')}</span>`}</b><span class="mf" ${ce('artist')}>${esc(it.artist||'')}</span></div>
   <div class="mbar"><i style="animation-delay:-${(Date.now()%214000)/1000}s"></i></div><div class="mctl"><span>⏮</span><span class="pp">⏸</span><span>⏭</span></div></div></div>`;}
const WG={clock:{f:wClock,cls:'clock',w:520,h:200,label:'시계'},cal:{f:wCal,cls:'cal',w:620,h:520,label:'달력'},dday:{f:wDday,cls:'dd',w:170,h:170,label:'D-day'},today:{f:wToday,cls:'td',w:300,h:300,label:'못한 것'},cycle:{f:wCycle,cls:'cy',w:300,h:170,label:'사이클'},music:{f:wMusic,cls:'ms',w:360,h:170,label:'재생 중'},dream:{f:wDream,cls:'dr',w:280,h:170,label:'외무영사 드림'}};

const CV=document.getElementById('cv'),WR=document.getElementById('wrap');
let edit=false,S=1;
function items(){return Object.entries(O.items).map(([id,v])=>({id,...v})).filter(x=>x&&x.t);}
function canvasH(){return Math.max(760,...items().map(i=>i.y+i.h+80));}
function layout(){const H=canvasH();CV.style.height=H+'px';
  // transform:scale은 크게 키우면 흐려져서 zoom으로 (글자·위젯을 그 크기로 다시 그림)
  CV.style.transform='';
  if(full){S=Math.min(innerWidth/1150,innerHeight/H);CV.style.zoom=S;return;}

PU.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();document.getElementById('shOk').click();}});let shMode='img',shData=null;
let coverFor=null;
function openSheet(m){shMode=m;shData=null;PZ.innerHTML='';PU.value='';document.getElementById('shT').textContent=m==='wall'?'배경':m==='cover'?'커버':'사진';SH.classList.add('on');setTimeout(()=>PU.focus(),30);}
function closeSheet(){SH.classList.remove('on');}
document.getElementById('shX').onclick=closeSheet;SH.addEventListener('pointerdown',e=>{if(e.target===SH)closeSheet();});
function shrink(file,max){return new Promise(res=>{const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height));const c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);res({src:c.toDataURL('image/jpeg',.82),ar:im.width/im.height});};im.onerror=()=>res(null);im.src=r.result;};r.readAsDataURL(file);});}
async function takeFile(f){if(!f||!/^image\//.test(f.type))return;const d=await shrink(f,shMode==='wall'?1800:shMode==='cover'?500:1000);if(!d)return;shData={img:d.src,ar:d.ar};PZ.innerHTML=`<img src="${d.src}">`;}
PZ.addEventListener('paste',e=>{const cd=e.clipboardData;if(!cd)return;const f=[...cd.files||[]].find(x=>/^image\//.test(x.type))||[...cd.items||[]].map(i=>i.kind==='file'?i.getAsFile():null).find(x=>x&&/^image\//.test(x.type));
  if(f){e.preventDefault();takeFile(f);return;}
  const html=cd.getData('text/html');const m=html&&html.match(/<img[^>]+src="([^"]+)"/i);const t=(m?m[1]:cd.getData('text')).trim();
  if(/^https?:\/\//.test(t)){e.preventDefault();shData={url:t};PZ.innerHTML=`<img src="${esc(t)}">`;}});
PZ.addEventListener('drop',e=>{e.preventDefault();const f=e.dataTransfer.files[0];if(f)takeFile(f);else{const t=e.dataTransfer.getData('text');if(/^https?:/.test(t)){shData={url:t.trim()};PZ.innerHTML=`<img src="${esc(t.trim())}">`;}}});
PZ.addEventListener('dragover',e=>e.preventDefault());
document.getElementById('pf').onchange=e=>{takeFile(e.target.files[0]);e.target.value='';};
document.getElementById('shOk').onclick=()=>{if(!shData){const t=PZ.innerText.trim();if(/^https?:\/\//.test(t))shData={url:t};else return;}
  const go=ar=>{let ref={};if(shData.img){const k=uid();put('imgs/'+k,shData.img);ref={img:k};}else ref={url:shData.url};
    if(shMode==='cover'){const it=O.items[coverFor];if(it)put('items/'+coverFor,{...it,cover:ref});}
    else if(shMode==='wall')put('wall',ref);else{const w=320,h=Math.round(w/(ar||1));const p=freeSpot(w,h);put('items/'+uid(),{t:'img',x:p.x,y:p.y,w,h,ar:ar||1,z:topZ()+1,...ref});}
    closeSheet();render();};
  if(shData.ar)go(shData.ar);else{const im=new Image();im.onload=()=>go(im.width/im.height);im.onerror=()=>go(1);im.src=shData.url;}};

/* ───── 곡 적기 ───── */
let songFor=null;const SG=document.getElementById('song');
function openSong(id){const it=O.items[id];if(!it)return;songFor=id;document.getElementById('sgT').value=it.title||'';document.getElementById('sgA').value=it.artist||'';document.getElementById('sgC').value=it.cover&&it.cover.url?it.cover.url:'';SG.classList.add('on');setTimeout(()=>document.getElementById('sgT').focus(),30);}
function closeSong(){SG.classList.remove('on');songFor=null;}
document.getElementById('sgX').onclick=closeSong;SG.addEventListener('pointerdown',e=>{if(e.target===SG)closeSong();});
document.getElementById('sgOk').onclick=()=>{const it=O.items[songFor];if(it){const o={...it,title:document.getElementById('sgT').value.trim(),artist:document.getElementById('sgA').value.trim()};const cu=document.getElementById('sgC').value.trim();
    if(/^https?:\/\//.test(cu)){o.cover={url:cu};o.nocv=false;}else if(!cu&&it.cover&&it.cover.url)delete o.cover;put('items/'+songFor,o);}closeSong();render();};
SG.addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing){e.preventDefault();if(e.target.id==='sgT')document.getElementById('sgA').focus();else if(e.target.id==='sgA')document.getElementById('sgC').focus();else document.getElementById('sgOk').click();}if(e.key==='Escape')closeSong();});

/* ───── 사진 자르기 ───── */
const CR=document.getElementById('crop'),CI=document.getElementById('cimg'),CRT=document.getElementById('crect'),CST=document.getElementById('cst');
let crop=null;
function openCrop(id){const it=O.items[id];if(!it)return;const src=it.img?O.imgs[it.img]:it.url;if(!src)return;
  crop={id,r:it.crop?{...it.crop}:{x:0,y:0,w:1,h:1},nw:0,nh:0};CI.onload=()=>{crop.nw=CI.naturalWidth;crop.nh=CI.naturalHeight;drawCrop();};CI.src=src;CR.classList.add('on');if(CI.complete&&CI.naturalWidth)CI.onload();}
function drawCrop(){const r=crop.r;const P=v=>v*100+'%';const [t,bm,l,rt]=document.querySelectorAll('#cshade b');
  Object.assign(t.style,{left:0,top:0,width:'100%',height:P(r.y)});Object.assign(bm.style,{left:0,top:P(r.y+r.h),width:'100%',height:P(1-r.y-r.h)});
  Object.assign(l.style,{left:0,top:P(r.y),width:P(r.x),height:P(r.h)});Object.assign(rt.style,{left:P(r.x+r.w),top:P(r.y),width:P(1-r.x-r.w),height:P(r.h)});CRT.style.left=r.x*100+'%';CRT.style.top=r.y*100+'%';CRT.style.width=r.w*100+'%';CRT.style.height=r.h*100+'%';}
let cd=null;
CST.addEventListener('pointerdown',e=>{if(!crop)return;const h=e.target.dataset&&e.target.dataset.h;if(!h&&!e.target.closest('#crect'))return;e.preventDefault();
  cd={h:h||'move',sx:e.clientX,sy:e.clientY,r0:{...crop.r},W:CST.clientWidth,H:CST.clientHeight};CST.setPointerCapture(e.pointerId);});
CST.addEventListener('pointermove',e=>{if(!cd)return;const dx=(e.clientX-cd.sx)/cd.W,dy=(e.clientY-cd.sy)/cd.H,r0=cd.r0,m=.04;let {x,y,w,h}=r0;
  if(cd.h==='move'){x=Math.min(1-w,Math.max(0,x+dx));y=Math.min(1-h,Math.max(0,y+dy));}
  else{if(/w/.test(cd.h)){const nx=Math.min(r0.x+r0.w-m,Math.max(0,r0.x+dx));w=r0.x+r0.w-nx;x=nx;}
    if(/e/.test(cd.h))w=Math.min(1-r0.x,Math.max(m,r0.w+dx));
    if(/n/.test(cd.h)){const ny=Math.min(r0.y+r0.h-m,Math.max(0,r0.y+dy));h=r0.y+r0.h-ny;y=ny;}
    if(/s/.test(cd.h))h=Math.min(1-r0.y,Math.max(m,r0.h+dy));}
  crop.r={x,y,w,h};drawCrop();});
const cEnd=()=>{cd=null;};CST.addEventListener('pointerup',cEnd);CST.addEventListener('pointercancel',cEnd);
function closeCrop(){CR.classList.remove('on');crop=null;}
document.getElementById('cX').onclick=closeCrop;
document.getElementById('cReset').onclick=()=>{crop.r={x:0,y:0,w:1,h:1};drawCrop();};
document.getElementById('cOk').onclick=()=>{const o={...O.items[crop.id]};const r=crop.r;const full=r.x<.001&&r.y<.001&&r.w>.999&&r.h>.999;
  if(full)delete o.crop;else o.crop={x:+r.x.toFixed(4),y:+r.y.toFixed(4),w:+r.w.toFixed(4),h:+r.h.toFixed(4)};
  if(crop.nw&&crop.nh){o.ar=(r.w*crop.nw)/(r.h*crop.nh);o.h=Math.round(o.w/o.ar);}
  put('items/'+crop.id,o);closeCrop();render();};
CR.addEventListener('pointerdown',e=>{if(e.target===CR)closeCrop();});

/* ───── 불러오기 ───── */
function applyStudy(d){if(!d)return;ST={pData:pj(d.plannerData)||{},pTags:arr(pj(d.plannerTags)),tracker:d.trackerData||{}};try{localStorage.setItem(LK+'_study',JSON.stringify(ST));}catch(e){}}
if(window.__OV_SEED){O=window.__OV_SEED.O||O;ST=window.__OV_SEED.ST||ST;}
if(db){
  db.ref('diplomat/diplomat_state_v1').on('value',s=>{const v=s.val();if(v&&v.idx!=null){DIP=v;if(!drag)renderLive();}});
  db.ref(STUDY).on('value',s=>{applyStudy(s.val());studyReady=true;if(!drag)renderLive();});
  db.ref(ROOT).on('value',s=>{const v=s.val()||{};const first=!ready;ready=true;O={items:v.items||{},imgs:v.imgs||{},wall:v.wall||null,theme:v.theme||null};cache();
    if(first)seedDefault();if(!drag&&!document.querySelector('.tx:focus'))render();});
}else{seedDefault();}
render();
</script>
