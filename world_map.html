<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WORLD MAP DB</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css");
button,input,select,textarea{font-family:inherit;}
:root{
  --bg:#FCFBFA;
  --ink:#2B2A33;
  --ink-soft:#8A8594;
  --line:#E7E3EE;
  --lavender:#E8F1F9;
  --lavender-deep:#2A558C;
  --red-text:#C96A56;
  --ox-correct:#4FA0D6;
  --country-fill:#E9E6F0;
  --country-stroke:#FCFBFA;
  --country-hover:#D8DEEA;
}
*{box-sizing:border-box;}
html,body{background:transparent;}
body{margin:0;color:var(--ink);font-family:"Paperlogy","Pretendard","Noto Sans KR",-apple-system,BlinkMacSystemFont,sans-serif;}
.wm-root{display:flex;flex-direction:column;height:100vh;height:100dvh;}
.wm-topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line);flex-wrap:wrap;gap:10px;}
.wm-title{font-weight:800;font-size:16px;letter-spacing:0.5px;color:var(--lavender-deep);}
.wm-filters{display:flex;gap:6px;flex-wrap:wrap;}
.wm-filter-chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-weight:600;font-size:12px;padding:6px 12px;border-radius:999px;cursor:pointer;display:flex;align-items:center;gap:5px;}
.wm-filter-chip .dot{width:7px;height:7px;border-radius:50%;}
.wm-filter-chip.active{background:var(--lavender);border-color:var(--lavender-deep);color:#2A558C;}
.wm-actions{display:flex;gap:8px;}
.btn{font-family:inherit;border:1.5px solid var(--line);background:#fff;color:var(--ink);font-weight:600;font-size:13px;padding:8px 14px;border-radius:9px;cursor:pointer;}
.btn:hover{border-color:var(--lavender-deep);}
.btn-primary{background:var(--lavender-deep);border-color:var(--lavender-deep);color:#fff;}
.btn-primary:hover{opacity:0.92;}
.btn-small{padding:5px 10px;font-size:12px;}
.btn-plain{border:none;background:none;}

.wm-main{display:flex;flex:1;min-height:0;}
.wm-map-wrap{flex:1;min-width:0;padding:14px;display:flex;flex-direction:column;overflow:hidden;}
@media (max-width:760px){
  .wm-main{flex-direction:column;}
  .wm-map-wrap{flex:none;}
  .wm-svg{max-height:42dvh;}
  .wm-sidebar{width:100%;min-width:0;max-width:none;flex:1 1 auto;box-sizing:border-box;border-left:none;border-top:1px solid var(--line);}
}
.wm-map-stage{position:relative;border:1px solid var(--line);border-radius:14px;background:#fff;overflow:hidden;}
.wm-svg{display:block;width:100%;height:auto;max-height:calc(100dvh - 280px);min-height:200px;}
.wm-bpanel{flex:1;min-height:0;margin-top:12px;overflow-y:auto;overflow-x:hidden;padding:0;scrollbar-width:none;-ms-overflow-style:none;}
.wm-bpanel::-webkit-scrollbar{display:none;width:0;height:0;}
.wm-bpanel:empty{display:none;}
.wm-bpanel .bp-head{display:flex;align-items:center;gap:8px;margin-bottom:10px;}
.wm-bpanel .bp-head h3{margin:0;font-size:14.5px;color:var(--lavender-deep);flex:1;}
.wm-bpanel .bp-close{border:none;background:none;color:var(--ink-soft);font-size:16px;cursor:pointer;}
.wm-bpanel .bp-list{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:start;}
.wm-bpanel .bp-hint{color:var(--ink-soft);font-size:12.5px;padding:18px 4px;text-align:center;}
@media (max-width:760px){ .wm-bpanel .bp-list{grid-template-columns:1fr;} }
.country{fill:var(--country-fill);stroke:var(--country-stroke);stroke-width:0.6;cursor:pointer;transition:fill .12s;}
.country:hover{fill:var(--country-hover);}
.country.rta-on{fill:#AFCBE6;}
.country.rta-on:hover{fill:#8FB7DD;}
.wm-marker{cursor:pointer;}
.wm-marker circle{fill:var(--lavender-deep);stroke:#fff;stroke-width:1.4;}
.wm-marker:hover circle{fill:#1d3f69;}
.wm-marker text{font-size:9px;font-weight:800;fill:#fff;text-anchor:middle;pointer-events:none;}
.wm-marker.sel circle{fill:#E8505B;stroke:#fff;stroke-width:2;}
.wm-marker.flash circle{animation:wmflash 1s ease-out 2;}
@keyframes wmflash{0%{r:6;opacity:1;}100%{r:16;opacity:0;}}
.wm-pick-hint{position:absolute;top:10px;left:50%;transform:translateX(-50%);background:var(--lavender-deep);color:#fff;font-size:12.5px;font-weight:700;padding:8px 16px;border-radius:999px;box-shadow:0 8px 20px rgba(40,20,70,0.18);display:none;z-index:20;}
.wm-pick-hint.on{display:block;}
.wm-map-stage.picking .wm-svg{cursor:crosshair;}
.wm-svg{touch-action:none;}
.wm-map-stage.panning .wm-svg{cursor:grabbing;}

.wm-zoom-controls{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:5px;z-index:15;}
.wm-zoom-controls button{width:30px;height:30px;border:1.5px solid var(--line);background:#fff;border-radius:9px;font-family:inherit;font-weight:800;font-size:15px;color:var(--ink);cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 8px rgba(40,20,70,0.08);line-height:1;}
.wm-zoom-controls button:hover{border-color:var(--lavender-deep);color:var(--lavender-deep);}
.wm-zoom-controls button#zoomResetBtn{font-size:13px;}

.wm-anchor-pop{position:absolute;z-index:40;display:none;width:320px;max-width:calc(100% - 16px);}
.wm-anchor-pop.open{display:block;}
.wm-anchor-pop-inner{background:#fff;border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(40,20,70,0.22);border:1px solid var(--line);max-height:320px;overflow-y:auto;}
.wm-anchor-pop-inner h3{margin:0 0 8px;font-size:13.5px;color:var(--lavender-deep);}
.wm-anchor-pop-arrow{position:absolute;bottom:-7px;width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:7px solid #fff;filter:drop-shadow(0 2px 2px rgba(40,20,70,0.1));}
.wm-anchor-pop.flip-down .wm-anchor-pop-arrow{top:-7px;bottom:auto;border-top:none;border-bottom:7px solid #fff;}
.wm-anchor-pop-close{position:absolute;top:8px;right:9px;border:none;background:none;color:var(--ink-soft);font-size:15px;cursor:pointer;line-height:1;padding:2px;}

.wm-sidebar{scrollbar-width:none;-ms-overflow-style:none;width:320px;flex:none;border-left:1px solid var(--line);padding:14px;overflow-y:auto;min-height:0;}
@media (max-width:760px){ .wm-sidebar{width:100%;flex:1 1 auto;box-sizing:border-box;border-left:none;border-top:1px solid var(--line);} }
.wm-sidebar-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;}
.wm-sidebar-head b{font-size:13px;color:var(--lavender-deep);}
.wm-search{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:12.5px;margin-bottom:10px;}
.wm-entry-list{display:flex;flex-direction:column;gap:6px;}
.wm-cat-section{border:1px solid var(--line);border-radius:10px;overflow:hidden;}
.wm-cat-header{width:100%;display:flex;align-items:center;gap:8px;padding:10px 11px;border:none;background:#fff;cursor:pointer;font-family:inherit;text-align:left;}
.wm-cat-header:hover{background:#F8FAFD;}
.wm-cat-count{font-size:11.5px;color:var(--ink-soft);font-weight:700;}
.wm-cat-arrow{margin-left:auto;font-size:10px;color:var(--ink-soft);transition:transform .2s;flex:none;}
.wm-cat-section.open .wm-cat-arrow{transform:rotate(180deg);}
.wm-cat-body{max-height:0;overflow:hidden;transition:max-height .28s ease;background:transparent;}
.wm-cat-section.open .wm-cat-body{max-height:4000px;}
.wm-cat-body-inner{display:flex;flex-direction:column;gap:6px;padding:6px 8px 9px;}
.wm-entry-card{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 11px;cursor:pointer;}
.wm-entry-card:hover{border-color:var(--lavender-deep);background:#F8FAFD;}
.wm-entry-top{display:flex;align-items:center;gap:6px;}
.wm-type-tag{font-size:9.5px;font-weight:600;padding:2px 7px;border-radius:999px;flex:none;}
.wm-type-tag.org{background:#EAF1F8;color:#2A558C;}
.wm-type-tag.meeting{background:#EAF6EF;color:#2F8558;}
.wm-type-tag.event{background:#FDEFE7;color:#B5633A;}
.wm-type-tag.treaty{background:#F3ECFB;color:#6B4FA0;}
.wm-type-tag.rta{background:#FBEAF0;color:#B23E6B;}
.wm-entry-name{font-size:12.5px;font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wm-entry-sub{font-size:11px;color:var(--ink-soft);}
.wm-entry-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px;margin-top:5px;}
.wm-entry-meta .wm-etag{margin:0;}
.wm-entry-card{line-height:1.5;}
.wm-entry-rta-toggle{margin-left:auto;flex:none;}
.wm-empty{color:var(--ink-soft);font-size:12px;padding:20px 4px;text-align:center;}

.modal-overlay{position:fixed;inset:0;background:rgba(50,40,70,0.28);display:none;align-items:center;justify-content:center;z-index:300;}
.modal-overlay.open{display:flex;position:fixed;inset:0;align-items:flex-start;justify-content:center;padding:40px 16px;overflow-y:auto;background:rgba(252,251,250,0.92);}
.popup-box{background:#fff;border-radius:16px;padding:22px 24px;width:min(560px,94vw);max-height:none;overflow:visible;box-shadow:0 20px 50px rgba(40,20,70,0.22);}
.popup-box h3{margin:0 0 14px;font-size:15px;color:var(--lavender-deep);}
.field{margin-bottom:12px;}
.field label{display:block;font-size:11.5px;font-weight:700;color:var(--ink-soft);margin-bottom:5px;}
.field input[type=text],.field input[type=date],.field input[type=number],.field textarea,.field select{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px;}
.field textarea{resize:vertical;}
.type-choice{display:flex;gap:6px;flex-wrap:wrap;}
.type-choice button{flex:1;min-width:70px;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:9px 6px;font-family:inherit;font-weight:700;font-size:12px;cursor:pointer;color:var(--ink-soft);}
.type-choice button.selected{border-color:var(--lavender-deep);background:var(--lavender);color:#2A558C;}
.modal-footer{display:flex;justify-content:space-between;align-items:center;margin-top:16px;}
.loc-pick-row{display:flex;align-items:center;gap:8px;}
.loc-pick-row .loc-val{flex:1;font-size:12px;color:var(--ink-soft);}

.rta-country-picker{border:1.5px solid var(--line);border-radius:9px;padding:8px;max-height:220px;overflow-y:auto;}
.rta-country-row{display:flex;align-items:center;gap:7px;padding:3px 2px;font-size:12.5px;}
.rta-country-row input{flex:none;}
.rta-selected-chips{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px;}
.rta-chip{background:var(--lavender);color:#2A558C;font-size:11px;font-weight:600;padding:3px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;}
.rta-chip button{border:none;background:none;color:#2A558C;cursor:pointer;font-size:12px;padding:0;line-height:1;}

.pop-entry-list{display:flex;flex-direction:column;gap:8px;}
.pop-entry-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;}
.pop-entry-item-top{display:flex;align-items:center;gap:7px;}
.pop-entry-item-name{font-weight:600;font-size:13px;flex:1;}
.pop-entry-item-date{font-size:11px;color:var(--ink-soft);}
.pop-entry-item-desc{font-size:12px;color:var(--ink);margin-top:5px;line-height:1.5;white-space:pre-wrap;}
.pop-entry-item-actions{display:none;}
.wm-ctx{position:fixed;z-index:600;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(40,20,70,.22);padding:4px;min-width:96px;}
.wm-ctx button{display:block;width:100%;text-align:left;border:none;background:none;padding:8px 12px;font-size:12.5px;font-weight:700;cursor:pointer;border-radius:7px;color:var(--ink);}
.wm-ctx button:hover{background:#F0F6FD;color:var(--lavender-deep);}
.wm-ctx button.danger{color:#B4413B;}
.pop-entry-item-actions button{border:none;background:none;color:var(--ink-soft);font-size:11px;font-weight:700;cursor:pointer;padding:2px 4px;}
.pop-entry-item-actions button:hover{color:var(--lavender-deep);}

.table-popup-box{width:min(1240px,97vw);}
.wm-table-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;gap:8px;flex-wrap:wrap;}
.wm-table-head h3{margin:0;}
.wm-table-head-btns{display:flex;gap:6px;}
.wm-table-toolbar{display:flex;gap:12px;align-items:center;margin-bottom:8px;}
.wm-table-toolbar .wm-search{margin-bottom:0;flex:1;}
.wm-check{font-size:12px;color:var(--ink-soft);display:flex;align-items:center;gap:5px;white-space:nowrap;}
.wm-table-chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;}
.wm-table-chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:11.5px;font-weight:600;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.wm-table-chip.on{background:var(--lavender);border-color:var(--lavender-deep);color:#2A558C;}
.wm-table-bulkbar{display:flex;gap:8px;align-items:center;font-size:12px;margin-bottom:8px;}
.wm-table-bulkbar:empty{display:none;}
.wm-table-bulkbar select{border:1.5px solid var(--line);border-radius:8px;padding:4px 6px;font-family:inherit;font-size:12px;}
.btn.danger{color:var(--red-text);border-color:var(--red-text);}
.wm-table-wrap{max-height:64vh;overflow:auto;border:1px solid #D9D5E3;border-radius:8px;}
.wm-table{width:100%;min-width:1000px;border-collapse:collapse;font-size:12.5px;table-layout:fixed;}
.wm-table th,.wm-table td{border:1px solid #E7E3EE;padding:0;text-align:left;vertical-align:middle;height:34px;}
.wm-table th{position:sticky;top:0;background:#F6F5F9;color:#6B6774;font-size:11px;font-weight:800;padding:0 8px;cursor:pointer;user-select:none;z-index:2;white-space:nowrap;}
.wm-table th.nosort{cursor:default;}
.wm-table th .th-caret{color:#B5B0C2;margin-left:4px;}
.wm-table th.th-filtered{color:var(--lavender-deep);background:#EAF2FB;}
.wm-colmenu{position:fixed;z-index:400;width:250px;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 10px 30px rgba(40,20,70,.25);padding:10px;font-size:12.5px;}
.wm-colmenu .cm-title{font-weight:800;color:var(--lavender-deep);margin-bottom:6px;}
.wm-colmenu .cm-search{width:100%;box-sizing:border-box;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-size:12.5px;font-family:inherit;margin-bottom:6px;}
.wm-colmenu .cm-row{display:flex;gap:4px;margin:3px 0;}
.wm-colmenu .cm-row button{flex:1;border:none;background:#F6F5F9;border-radius:7px;padding:7px 4px;font-size:12px;font-weight:700;cursor:pointer;color:var(--ink);}
.wm-colmenu .cm-row button:hover{background:#E8F0FA;color:var(--lavender-deep);}
.wm-colmenu .cm-sub{display:flex;justify-content:space-between;color:var(--ink-soft);font-size:11px;font-weight:700;margin:8px 0 3px;}
.wm-colmenu .cm-sub a{cursor:pointer;text-decoration:underline;}
.wm-colmenu .cm-vals{max-height:200px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:4px;}
.wm-colmenu .cm-vals label{display:flex;align-items:center;gap:6px;padding:4px 5px;border-radius:6px;cursor:pointer;}
.wm-colmenu .cm-vals label:hover{background:#F3F8FD;}
.wm-colmenu .cm-vals label span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.wm-colmenu .cm-vals label i{font-style:normal;color:var(--ink-soft);font-size:11px;}
.wm-table th.c-chk,.wm-table td.c-chk{width:34px;text-align:center;}
.wm-table textarea.cell{display:block;width:100%;box-sizing:border-box;border:none;background:transparent;font-family:inherit;font-size:12.5px;line-height:1.45;padding:8px;outline:none;color:var(--ink);resize:none;overflow:hidden;min-height:33px;}
.wm-table textarea.cell:focus{background:#F0F6FD;box-shadow:inset 0 0 0 2px var(--lavender-deep);}
.wm-table td{vertical-align:top;}
.wm-table td.c-act{vertical-align:top;padding-top:8px;}
.wm-table td select.cell-type{height:33px !important;min-height:0 !important;vertical-align:top;}
.wm-table input.cell,.wm-table select.cell-type{width:100%;height:100%;min-height:33px;border:none;background:transparent;font-family:inherit;font-size:12.5px;padding:6px 8px;outline:none;color:var(--ink);}
.wm-table input.cell:focus,.wm-table select.cell-type:focus{background:#F0F6FD;box-shadow:inset 0 0 0 2px var(--lavender-deep);}
.wm-table tr.sel td{background:#F3F8FD;}
.wm-table tbody tr:hover td{background:#FAFBFE;}
.wm-table .cell-ro{padding:0 8px;color:var(--ink-soft);}
.wm-table td.c-loc{text-align:center;font-size:11px;}
.wm-table td.c-stat{padding:0 8px;font-size:12.5px;vertical-align:middle;}
.wm-table td.c-chk{vertical-align:middle;}
.wm-table td.c-act{text-align:center;white-space:nowrap;}
.wm-table-group td{background:#F8F7FB;font-weight:800;padding:7px 10px;cursor:pointer;}
.loc-ok{color:var(--lavender-deep);}
.loc-no{color:var(--red-text);font-size:11px;font-weight:700;}
.wm-table-del,.wm-table-edit{border:none;background:none;font-weight:700;cursor:pointer;font-size:11.5px;padding:3px 6px;font-family:inherit;}
.wm-table-del{color:var(--red-text);}
.wm-table-edit{color:var(--ink-soft);}
.wm-table-del:hover,.wm-table-edit:hover{text-decoration:underline;}
.wm-manage{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px;background:#FCFBFE;}
.wm-manage-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px;}
.wm-manage-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:999px;padding:3px 8px;background:#fff;}
.wm-manage-chip i{font-style:normal;font-size:11px;color:var(--ink-soft);font-weight:700;}
.wm-manage-chip button{border:none;background:none;cursor:pointer;color:var(--red-text);font-size:13px;line-height:1;padding:0 2px;}
.wm-manage-add{display:flex;gap:6px;}
.wm-manage-add input{flex:1;border:1.5px solid var(--line);border-radius:9px;padding:6px 10px;font-family:inherit;font-size:12.5px;}
.wm-manage-msg{font-size:11.5px;color:var(--ink-soft);margin-top:6px;}
.bulk-popup-box{width:min(920px,96vw);}
.bulk-help{font-size:12px;color:var(--ink-soft);line-height:1.7;margin-bottom:10px;background:#F8FAFD;border:1px solid var(--line);border-radius:10px;padding:9px 12px;}
#bulkText{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13px;resize:vertical;}
#bulkType{border:1.5px solid var(--line);border-radius:9px;padding:7px 10px;font-family:inherit;font-size:13px;}
.bulk-result{font-size:13px;line-height:1.7;padding:10px 2px;}
.wm-etag{display:inline-block;font-size:10px;font-weight:600;padding:1px 7px;border-radius:999px;background:#EEF1F6;color:#4A5568;margin:3px 4px 0 0;}
.pop-entry-item-top .wm-type-tag,.pop-entry-item-top .wm-etag{font-size:12px;padding:2px 9px;margin:0;flex:none;white-space:nowrap;}
.wm-etag.hq{background:var(--lavender-deep);color:#fff;}
.wm-type-tag.custom{background:#EEE;color:#555;}
.pop-entry-item-top{cursor:pointer;}
.pop-entry-item-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.pop-entry-place{font-size:12.5px;font-weight:600;color:var(--lavender-deep);white-space:nowrap;flex:none;}
.pop-entry-item-desc{display:none;}
.pop-entry-item.open .pop-entry-item-desc{display:block;}
.pop-entry-caret{font-size:9px;color:var(--ink-soft);flex:none;transition:transform .15s;}
.pop-entry-item.open .pop-entry-caret{transform:rotate(180deg);}
.tag-quick{display:flex;gap:6px;margin-top:6px;}
.tag-quick button{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:3px 10px;font-size:11.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;font-family:inherit;}
.tag-quick button:hover{border-color:var(--lavender-deep);color:var(--lavender-deep);}
.wm-country-labels{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:12;}
.wm-country-label{position:absolute;transform:translate(-50%,-50%);background:#fff;color:var(--lavender-deep);font-weight:800;font-size:11.5px;padding:4px 11px;border-radius:999px;box-shadow:0 3px 10px rgba(40,20,70,0.2);white-space:nowrap;}
.wm-rta-card{position:absolute;left:12px;top:12px;z-index:30;width:min(300px,72%);background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 10px 30px rgba(40,20,70,0.2);display:none;max-height:70%;overflow-y:auto;}
.wm-rta-card.open{display:block;}
.rta-card-title{font-weight:700;font-size:13.5px;color:var(--lavender-deep);padding-right:18px;}

<script>
// ========== World Map DB ==========
const MAP_W = 1000, MAP_H = 520;
const VIEW_Y0 = 12, VIEW_H = 440; // 북극·남극 잘라냄 (위도 약 83°N ~ 57°S만 표시)
const SCALE = MAP_W / (2 * Math.PI);
const CENTER_LNG = 150; // map is recentered so Asia sits middle-left and the Americas fall on the right
function normLng(l){ return ((l + 540) % 360) - 180; } // wrap to [-180,180]
function projectLngLat(lng, lat){
  const shifted = normLng(lng - CENTER_LNG);
  const x = MAP_W/2 + (shifted*Math.PI/180)*SCALE;
  const y = MAP_H/2 - (lat*Math.PI/180)*SCALE;
  return [x, y];
}
function unprojectXY(x, y){
  const shiftedLng = (x-MAP_W/2)/SCALE * 180/Math.PI;
  const lng = normLng(shiftedLng + CENTER_LNG);
  const lat = -(y-MAP_H/2)/SCALE * 180/Math.PI;
  return [lng, lat];
}

// ---------- Zoom / pan ----------
const ZOOM_MAX = 8; // how far in you can go, relative to the full-map viewBox
let vb = { x:0, y:VIEW_Y0, w:MAP_W, h:VIEW_H };
let justPanned = false; // set after a drag-pan so the click that follows mouseup doesn't also fire a country/marker click
function applyViewBox(){
  document.getElementById('worldSvg').setAttribute('viewBox', `${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
  updateMarkerTransforms();
  if(anchorPopTarget) positionAnchorPop();
  renderCountryLabels();
}
function clampViewBox(){
  vb.w = Math.min(MAP_W, Math.max(MAP_W/ZOOM_MAX, vb.w));
  vb.h = vb.w * (VIEW_H/MAP_W);
  if(vb.x < 0) vb.x = 0;
  if(vb.y < VIEW_Y0) vb.y = VIEW_Y0;
  if(vb.x + vb.w > MAP_W) vb.x = MAP_W - vb.w;
  if(vb.y + vb.h > VIEW_Y0+VIEW_H) vb.y = VIEW_Y0+VIEW_H - vb.h;
}
function zoomAt(factor, cx, cy){
  const newW = vb.w * factor;
  const rx = (cx - vb.x) / vb.w, ry = (cy - vb.y) / vb.h;
  const clampedW = Math.min(MAP_W, Math.max(MAP_W/ZOOM_MAX, newW));
  const clampedH = clampedW * (VIEW_H/MAP_W);
  vb.x = cx - rx*clampedW;
  vb.y = cy - ry*clampedH;
  vb.w = clampedW; vb.h = clampedH;
  clampViewBox();
  applyViewBox();
}
function resetZoom(){ vb = { x:0, y:VIEW_Y0, w:MAP_W, h:VIEW_H }; applyViewBox(); }
// Converts an SVG-user-space point (e.g. from projectLngLat) into a pixel position
// relative to #mapStage, accounting for whatever pan/zoom is currently applied.
function svgPointToStagePixel(x, y){
  const svg = document.getElementById('worldSvg');
  const stage = document.getElementById('mapStage');
  const pt = svg.createSVGPoint();
  pt.x = x; pt.y = y;
  const screenPt = pt.matrixTransform(svg.getScreenCTM());
  const stageRect = stage.getBoundingClientRect();
  return [screenPt.x - stageRect.left, screenPt.y - stageRect.top];
}

const GAZ = { country:{}, city:{} }; // 정규화된 이름 → {label,lat,lng,cid}
function gazNorm(s){ return String(s==null?'':s).toLowerCase().replace(/[\s.\-·,()'’"_\/]/g,''); }
(function buildGaz(){
  GAZ_CITIES.trim().split('\n').forEach(line=>{
    const [names,lat,lng,cid] = line.split('|');
    const list = names.split(';');
    list.forEach(n=>{ GAZ.city[gazNorm(n)] = { label:list[0], lat:+lat, lng:+lng, cid:cid||null }; });
  });
  GAZ_COUNTRIES.trim().split('\n').forEach(line=>{
    const [id,names,en,cap,lat,lng] = line.split('|');
    const list = names.split(';');
    const base = { label:list[0], lat:+lat, lng:+lng, cid:id||null };
    list.concat([en]).forEach(n=>{ GAZ.country[gazNorm(n)] = base; });
    cap.split(';').forEach(c=>{ const k = gazNorm(c); if(!GAZ.city[k]) GAZ.city[k] = { label:c, lat:+lat, lng:+lng, cid:id||null }; });
  });
  COUNTRY_LIST.forEach(c=>{ const k = gazNorm(c.name); if(!GAZ.country[k]){ const hit = Object.values(GAZ.country).find(v=>v.cid===c.id); if(hit) GAZ.country[k] = hit; } });
})();
function gazLookupToken(t){
  const n = gazNorm(t);
  if(!n) return null;
  const tryKey = k => GAZ.city[k] ? { ...GAZ.city[k], kind:'city' } : (GAZ.country[k] ? { ...GAZ.country[k], kind:'country' } : null);
  let r = tryKey(n);
  if(r) return r;
  for(const suf of ['특별시','광역시','공화국','시','국']){
    if(n.endsWith(suf) && n.length > suf.length+1){ r = tryKey(n.slice(0, -suf.length)); if(r) return r; }
  }
  return null;
}
// 도시 또는 나라 하나를 찾음 (도시 우선, 나라면 수도 좌표)
function resolvePlace(text){
  if(!text || !text.trim()) return null;
  let r = gazLookupToken(text);
  if(r) return r;
  let best = null;
  text.split(/[,·、;&\/\n]+|\s+/).filter(Boolean).forEach(p=>{
    const x = gazLookupToken(p);
    if(x && (!best || (x.kind==='city' && best.kind!=='city'))) best = x;
  });
  if(best) return best;
  const n = gazNorm(text);
  let hit = null, hitLen = 0;
  [['city',GAZ.city],['country',GAZ.country]].forEach(([kind,store])=>{
    Object.keys(store).forEach(k=>{ if(k.length>=2 && n.includes(k) && k.length>hitLen){ hit = { ...store[k], kind }; hitLen = k.length; } });
  });
  return hit;
}
// RTA 회원국 목록 해석: "미국, 캐나다, 멕시코" 처럼 쉼표/·/;/& 구분 (공백만 있어도 시도)
function resolveMembers(text){
  const ids = [], unknown = [];
  const push = r => {
    if(r.cid){ if(!ids.includes(r.cid)) ids.push(r.cid); }
    else unknown.push(r.label + '(지도에 없음)');
  };
  (text||'').split(/[,·、;&\n+]+/).map(s=>s.trim()).filter(Boolean).forEach(piece=>{
    const r = gazLookupToken(piece);
    if(r){ push(r); return; }
    const sub = piece.split(/\s+/).filter(Boolean);
    if(sub.length > 1){ sub.forEach(s=>{ const x = gazLookupToken(s); if(x) push(x); else unknown.push(s); }); }
    else unknown.push(piece);
  });
  return { ids, unknown };
}

// 점 항목마다 "어느 나라 안인지"를 한 번 계산해서 countryId로 저장해둠 (나라 클릭 시 그 안의 도시들을 전부 보여주기 위해)
function distKm(lat1,lng1,lat2,lng2){
  const R=6371, rad=Math.PI/180, dLat=(lat2-lat1)*rad, dLng=(lng2-lng1)*rad;
  const a=Math.sin(dLat/2)**2+Math.cos(lat1*rad)*Math.cos(lat2*rad)*Math.sin(dLng/2)**2;
  return 2*R*Math.asin(Math.sqrt(a));
}
function inferCountryId(e){
  if(typeof e.lat==='number'){
    for(const c of COUNTRY_LIST){ if(c.id && isLatLngInCountry(e.lat, e.lng, c.id)) return c.id; }
  }
  const r = resolvePlace(e.placeName||'');
  if(r && r.cid) return r.cid;
  if(typeof e.lat==='number'){
    let best=null, bd=1e9;
    Object.values(GAZ.city).forEach(c=>{ if(!c.cid) return; const d=distKm(e.lat,e.lng,c.lat,c.lng); if(d<bd){ bd=d; best=c; } });
    if(best && bd<700) return best.cid;
  }
  return '';
}
(function fillCountryIds(){

  entries.forEach(e=>{
    if(e.type==='rta' || e.countryId!==undefined) return;
    e.countryId = inferCountryId(e);
    changed = true;
  });
  if(changed) save();
})();

// ---------- Map: countries ----------
// No stored countryId on point entries — instead test the entry's projected
// lat/lng against the country's own SVG path using isPointInFill, so this works
// for every entry (old and new) without needing a data migration.
function isLatLngInCountry(lat, lng, countryId){
  const path = document.getElementById('c'+countryId);
  if(!path) return false;
  const [x,y] = projectLngLat(lng, lat);
  const svg = document.getElementById('worldSvg');
  const pt = svg.createSVGPoint();
  pt.x = x; pt.y = y;
  try{ return path.isPointInFill(pt); }catch(err){ return false; }
}
function entriesForCountry(countryId){
  const pts = entries.filter(e => POINT_TYPES.includes(e.type) && (e.countryId===String(countryId) || (typeof e.lat==='number' && typeof e.lng==='number' && isLatLngInCountry(e.lat, e.lng, countryId))));
  const rtas = entries.filter(e => e.type==='rta' && (e.memberCountryIds||[]).includes(String(countryId)));
  return [...pts, ...rtas];
}
function applyRtaHighlight(){
  document.querySelectorAll('.country').forEach(el=>el.classList.remove('rta-on'));
  if(!highlightedRtaId) return;

// ---------- Zoom controls + wheel zoom + drag-to-pan ----------
(function(){
  const svg = document.getElementById('worldSvg');
  const stage = document.getElementById('mapStage');
  document.getElementById('zoomInBtn').addEventListener('click', ()=> zoomAt(0.7, vb.x+vb.w/2, vb.y+vb.h/2));
  document.getElementById('zoomOutBtn').addEventListener('click', ()=> zoomAt(1/0.7, vb.x+vb.w/2, vb.y+vb.h/2));
  document.getElementById('zoomResetBtn').addEventListener('click', resetZoom);

  stage.addEventListener('wheel', e=>{
    if(pickMode) return;
    if(e.target.closest('#rtaCard')) return;
    e.preventDefault();
    const pt = svg.createSVGPoint();
    pt.x = e.clientX; pt.y = e.clientY;
    const loc = pt.matrixTransform(svg.getScreenCTM().inverse());
    zoomAt(Math.exp(Math.max(-120,Math.min(120,e.deltaY))*0.0022), loc.x, loc.y);
  }, { passive:false });

  let panState = null;
  svg.addEventListener('mousedown', e=>{
    if(pickMode || e.button!==0) return;
    panState = { startX:e.clientX, startY:e.clientY, startVb:{...vb}, moved:false, scale:1/svg.getScreenCTM().a };
  });
  window.addEventListener('mousemove', e=>{
    if(!panState) return;
    const dx = e.clientX - panState.startX, dy = e.clientY - panState.startY;
    if(Math.abs(dx)>7 || Math.abs(dy)>7) panState.moved = true;
    if(!panState.moved) return;
    stage.classList.add('panning');
    vb.x = panState.startVb.x - dx*panState.scale;
    vb.y = panState.startVb.y - dy*panState.scale;
    clampViewBox();
    applyViewBox();
  });
  window.addEventListener('mouseup', ()=>{
    if(panState && panState.moved) justPanned = true;
    panState = null;
    stage.classList.remove('panning');
  });
  // Capture-phase: swallow the click that follows a drag-pan so it doesn't
  // also register as a country/marker click.
  svg.addEventListener('click', e=>{
    if(justPanned){ justPanned = false; e.stopPropagation(); e.preventDefault(); }
  }, true);
})();

// ---------- Markers ----------
function pointEntries(){ return entries.filter(e=>POINT_TYPES.includes(e.type) && typeof e.lat==='number' && typeof e.lng==='number'); }
function clusterKey(e){ return Math.round(e.lat*20)+','+Math.round(e.lng*20); } // ~0.05 deg buckets
let selClusterKey = null;
function setSelCluster(key){
  selClusterKey = key;
  document.querySelectorAll('#markersLayer .wm-marker').forEach(m=>m.classList.toggle('sel', !!key && m.dataset.bucket===key));
}
let flyRaf = null;
function flyTo(lat, lng, targetW){
  const [x,y] = projectLngLat(lng, lat);
  const w1 = Math.min(vb.w, targetW || 240);
  const s0 = { cx: vb.x+vb.w/2, cy: vb.y+vb.h/2, w: vb.w };
  const t0 = performance.now(), D = 700;
  cancelAnimationFrame(flyRaf);
  const step = now=>{
    let k = Math.min(1, (now-t0)/D); k = 1-Math.pow(1-k,3);
    const w = Math.exp(Math.log(s0.w) + (Math.log(w1)-Math.log(s0.w))*k);
    const cx = s0.cx + (x-s0.cx)*k, cy = s0.cy + (y-s0.cy)*k;
    vb.w = w; vb.h = w*(VIEW_H/MAP_W); vb.x = cx-vb.w/2; vb.y = cy-vb.h/2;
    clampViewBox(); applyViewBox();
    if(k<1) flyRaf = requestAnimationFrame(step);
  };
  flyRaf = requestAnimationFrame(step);
}
let currentCardId = null;
function closeEntryCard(){ currentCardId = null; document.getElementById('rtaCard').classList.remove('open'); setSelCluster(null); }
function showEntryCard(e){
  currentCardId = e.id;

  const tags = tagsChipsHtml(e);
  card.innerHTML = `<button type="button" class="wm-anchor-pop-close" id="rtaCardClose">✕</button>
    <div class="rta-card-title">${tagHtml(e.type)}${tags} ${esc(e.name)}</div>
    <div class="rta-card-sub">${esc(e.date||'')}${e.date&&e.placeName?' · ':''}${esc(e.placeName||'')}</div>
    ${e.description ? `<div class="rta-card-desc">${esc(e.description)}</div>` : ''}
    <div class="pop-entry-item-actions"><button type="button" id="rtaCardEdit">수정</button></div>`;
  card.classList.add('open');
  document.getElementById('rtaCardClose').addEventListener('click', closeEntryCard);
  document.getElementById('rtaCardEdit').addEventListener('click', ()=>{ returnView = ()=>{ const e2 = entries.find(x=>x.id===e.id); if(e2) showEntryCard(e2); }; openEntryEditModal(e); });
}
function renderMarkers(){
  const layer = document.getElementById('markersLayer');
  layer.innerHTML = '';
  const visible = pointEntries().filter(e=>activeTypeFilters.has(e.type));
  const clusters = {};
  visible.forEach(e=>{
    const k = clusterKey(e);
    if(!clusters[k]) clusters[k] = { lat:e.lat, lng:e.lng, items:[] };
    clusters[k].items.push(e);
  });
  Object.values(clusters).forEach(cl=>{
    const [x,y] = projectLngLat(cl.lng, cl.lat);
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','wm-marker' + (clusterKey(cl.items[0])===selClusterKey ? ' sel' : ''));
    g.setAttribute('data-bucket', clusterKey(cl.items[0]));
    g.setAttribute('data-clusterkey', cl.lat+','+cl.lng);
    g.setAttribute('data-x', x); g.setAttribute('data-y', y);
    const r = cl.items.length>1 ? 8 : 6;
    g.innerHTML = `<circle cx="${x}" cy="${y}" r="${r}"></circle>` + (cl.items.length>1 ? `<text x="${x}" y="${y+3}">${cl.items.length}</text>` : '');
    g.addEventListener('click', ev=>{ ev.stopPropagation(); document.getElementById('rtaCard').classList.remove('open'); setSelCluster(clusterKey(cl.items[0])); openMarkerInfo(cl.items, cl.lat, cl.lng); });
    layer.appendChild(g);
  });
  updateMarkerTransforms();
}
// Markers live inside the same <svg> as the country paths, so zooming the
// viewBox would normally scale them up right along with the map, which makes
// them balloon over whatever they're sitting on. Counter-scale each marker
// (anchored at its own point) by the inverse of the current zoom so pins stay
// a constant screen size — only the map itself zooms.
function updateMarkerTransforms(){
  const scale = vb.w / MAP_W; // >1 when zoomed out, <1 when zoomed in
  document.querySelectorAll('#markersLayer .wm-marker').forEach(g=>{
    const x = g.getAttribute('data-x'), y = g.getAttribute('data-y');
    g.setAttribute('transform', `translate(${x},${y}) scale(${scale}) translate(${-x},${-y})`);
  });
}

function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function hasLoc(e){ return e.type==='rta' ? (e.memberCountryIds||[]).length>0 : typeof e.lat==='number'; }
function typeOptionsHtml(sel){ return typeOrder().map(t=>`<option value="${t}" ${t===sel?'selected':''}>${esc(typeMeta(t).label)}</option>`).join(''); }
// 회의의 "첫 회의 / N차", 기구의 "본부" 같은 구분 태그 (차수는 자동, 나머지는 직접 입력한 태그)
function entryTags(e){

function tableList(){

    if(tableState.types.size && !tableState.types.has(e.type)) return false;

      const vs = colVals(e,k);

    return [e.name, e.placeName, e.description, e.date, entryTags(e).join(' ')].some(v=>(v||'').toLowerCase().includes(q));

    const ea = (va===''||va==null), eb = (vb===''||vb==null);

const BULK_DELIMS = ['\t','%','|',';','^','~','#','@','$','&','*','=',','];
let bulkRows = [];
function bulkSplitLine(line){
  const d = BULK_DELIMS.find(x=>line.includes(x));
  if(!d) return [line.trim()];
  return line.split(d).map(s=>s.trim()).reduce((acc,part,i,arr)=>{ // 5번째 이후 칸은 설명에 합침
    if(i<=3) acc.push(part); else acc[3] = acc[3] + d + part;
    return acc;
  }, []);
}
function bulkResolve(row){
  if(row.type==='rta'){ const r = resolveMembers(row.place); row.members = r.ids; row.unknown = r.unknown; row.res = null; }
  else { row.res = resolvePlace(row.place); row.members = []; row.unknown = []; }
}
function bulkStatusHtml(row){
  if(row.type==='rta') return `${row.members.length}개국${row.unknown.length ? ` <span class="loc-no">못 찾음: ${esc(row.unknown.join(', '))}</span>` : ''}`;
  if(row.res) return `<span class="loc-ok">📍 ${esc(row.res.label)}${row.res.kind==='country'?' (수도)':''}</span>`;
  return row.place ? '<span class="loc-no">위치 못 찾음</span>' : '<span class="loc-no">장소 없음</span>';
}
function bulkExtractTags(row){
  const t = row.name + ' ' + row.desc + ' ' + row.place;
  const tags = [];
  if(/본부/.test(t)) tags.push('본부');
  if(/첫\s*회의|제?\s*1\s*차(?!\d)/.test(row.name)) tags.push('첫 회의');
  return tags;
}

const CID_KO = {};
GAZ_COUNTRIES.trim().split('\n').forEach(l=>{ const p = l.split('|'); if(p[0]) CID_KO[p[0]] = p[1].split(';')[0]; });
const labelCenterCache = {};
function countryLabelCenter(cid){
  if(labelCenterCache[cid]) return labelCenterCache[cid];
  const el = document.getElementById('c'+cid);
  if(!el) return null;
  let best = null, bestA = -1;
  (el.getAttribute('d')||'').split(/(?=M)/).forEach(sub=>{
    const nums = (sub.match(/-?\d+\.?\d*/g)||[]).map(Number);
    if(nums.length < 6) return;
    let minX=1e9, maxX=-1e9, minY=1e9, maxY=-1e9;
    for(let i=0;i+1<nums.length;i+=2){ minX=Math.min(minX,nums[i]); maxX=Math.max(maxX,nums[i]); minY=Math.min(minY,nums[i+1]); maxY=Math.max(maxY,nums[i+1]); }
    const a = (maxX-minX)*(maxY-minY);
    if(a > bestA){ bestA = a; best = [(minX+maxX)/2, (minY+maxY)/2]; }
  });
  return labelCenterCache[cid] = best;
}

  const layer = document.getElementById('countryLabels');
  layer.innerHTML = '';
  labeledCountryIds.forEach(cid=>{
    const c = countryLabelCenter(cid);
    if(!c) return;
    const [px,py] = svgPointToStagePixel(c[0], c[1]);
    const div = document.createElement('div');
    div.className = 'wm-country-label';
    div.textContent = CID_KO[cid] || COUNTRY_NAME_BY_ID[cid] || cid;
    div.style.left = px + 'px'; div.style.top = py + 'px';
    layer.appendChild(div);
  });
}
function showCountryLabels(ids){ labeledCountryIds = ids.slice(); renderCountryLabels(); }
window.addEventListener('resize', renderCountryLabels);
function showRtaCard(e){
  const card = document.getElementById('rtaCard');
  const names = (e.memberCountryIds||[]).map(id=>CID_KO[id] || COUNTRY_NAME_BY_ID[id] || id);
  card.innerHTML = `<button type="button" class="wm-anchor-pop-close" id="rtaCardClose">✕</button>
    <div class="rta-card-title">${tagHtml('rta')} ${esc(e.name)}</div>
    <div class="rta-card-sub">${esc(e.date||'')}${e.date?' · ':''}${names.length}개국</div>
    ${e.description ? `<div class="rta-card-desc">${esc(e.description)}</div>` : ''}
    <div class="rta-card-members">${names.map(n=>`<span>${esc(n)}</span>`).join('')}</div>
    <div class="pop-entry-item-actions"><button type="button" id="rtaCardEdit">수정</button></div>`;

function selectRta(e){

  applyRtaHighlight();
  showCountryLabels(e.memberCountryIds||[]);
  showRtaCard(e);
  renderSidebarList();
}
function clearRtaSelection(){
  highlightedRtaId = null;
  applyRtaHighlight();
  showCountryLabels([]);
  document.getElementById('rtaCard').classList.remove('open');
  renderSidebarList();
}
function ensurePointVisible(lat, lng){
  const [x,y] = projectLngLat(lng, lat);
  if(x < vb.x+8 || x > vb.x+vb.w-8 || y < vb.y+8 || y > vb.y+vb.h-8){
    vb.x = x - vb.w/2; vb.y = y - vb.h/2; clampViewBox(); applyViewBox();
  }
}


function flashMarker(lat, lng){
  const key = lat+','+lng;
  document.querySelectorAll('.wm-marker').forEach(m=>{
    if(m.dataset.clusterkey===key){ m.classList.add('flash'); setTimeout(()=>m.classList.remove('flash'), 1600); }
  });
}

// ---------- Marker info popup (small, anchored to the point — not a full modal) ----------
let panelState = null;
function ensurePanel(){
  let p = document.getElementById('bPanel');
  if(!p){
    p = document.createElement('div'); p.id='bPanel'; p.className='wm-bpanel';
    const stage = document.getElementById('mapStage');
    stage.parentNode.insertBefore(p, stage.nextSibling);
  }
  return p;
}
function hidePanel(){
  panelState = null; anchorPopTarget = null;
  const p = ensurePanel();
  p.innerHTML = '';
}
function showPanel(titleHtml, ids, extraHtml){
  const p = ensurePanel();
  p.innerHTML = `<div class="bp-head"><h3>${titleHtml}</h3><button type="button" class="bp-close" id="bpClose" title="닫기">✕</button></div>` +
    (ids.length ? `<div class="bp-list" id="popEntryList"></div>` : `<div class="bp-hint">이 나라와 관련된 항목이 없어요</div>`) + (extraHtml||'');
  document.getElementById('bpClose').addEventListener('click', hidePanel);
  if(ids.length) renderPopEntryList(ids);
  p.scrollTop = 0;
}
function reopenPanel(ps){
  if(!ps) return;
  if(ps.kind==='country') openCountryInfo(ps.id, ps.name);
  else {
    const items = ps.ids.map(id=>entries.find(x=>x.id===id)).filter(Boolean);
    if(!items.length) return;
    if(ps.kind==='marker') openMarkerInfo(items, ps.lat, ps.lng);
    else openSinglePanel(items[0]);
  }
}
function openSinglePanel(e){
  panelState = { kind:'single', ids:[e.id] };
  showPanel(`${esc(e.name)} <span class="wm-cat-count">위치 미지정</span>`, [e.id]);
}
function openMarkerInfo(items, lat, lng){
  const placeName = items[0].placeName || '';
  panelState = { kind:'marker', ids:items.map(e=>e.id), lat, lng };
  showPanel(esc(placeName || (lat.toFixed(2)+', '+lng.toFixed(2))), items.map(e=>e.id),
    `<button type="button" class="btn btn-small" id="popCountryAll" style="display:none;margin-top:10px"></button>`);
  const cidRaw = items.map(e=>e.countryId).find(Boolean);
  const cEl = cidRaw && document.getElementById('c'+cidRaw);
  if(cEl){
    const cb = document.getElementById('popCountryAll');
    const n = entriesForCountry(cidRaw).length;
    cb.textContent = (CID_KO[String(cidRaw)] || cEl.dataset.name) + ' 전체 보기 (' + n + ')';
    cb.style.display = '';
    cb.addEventListener('click', ev=>{ ev.stopPropagation(); openCountryInfo(cidRaw, cEl.dataset.name); });
  }
}
function closeAnchorPop(){ hidePanel(); }
function positionAnchorPop(){
  if(!anchorPopTarget) return;
  const pop = document.getElementById('anchorPop');
  const stage = document.getElementById('mapStage');
  const [x,y] = projectLngLat(anchorPopTarget.lng, anchorPopTarget.lat);
  const [px,py] = svgPointToStagePixel(x,y);
  pop.classList.remove('flip-down');
  pop.style.left = '-9999px'; pop.style.top = '-9999px';
  const stageRect = stage.getBoundingClientRect();
  const popRect = pop.getBoundingClientRect();
  const w = popRect.width, h = popRect.height;
  let left = px - w/2;
  let top = py - h - 14; // sit just above the point, like a callout
  let flipped = false;
  if(top < 4){ top = py + 14; flipped = true; }
  if(flipped && top + h > stageRect.height - 4) top = Math.max(4, stageRect.height - 4 - h);
  if(left < 4) left = 4;
  if(left + w > stageRect.width - 4) left = stageRect.width - 4 - w;
  pop.style.left = left + 'px';
  pop.style.top = top + 'px';
  if(flipped) pop.classList.add('flip-down');
  const arrow = pop.querySelector('.wm-anchor-pop-arrow');
  const arrowX = Math.max(14, Math.min(w-14, px-left));
  arrow.style.left = arrowX + 'px';
  arrow.style.transform = 'translateX(-50%)';
}
document.getElementById('anchorPopClose').addEventListener('click', closeAnchorPop);

window.addEventListener('resize', ()=>{ if(anchorPopTarget) positionAnchorPop(); });
function openCountryInfo(countryId, countryName){
  currentCountryView = { id: countryId, name: countryName };
  panelState = { kind:'country', id:countryId, name:countryName };
  const list = entriesForCountry(countryId);
  const koName = CID_KO[String(countryId)];
  showPanel((koName ? koName+' <span class="wm-cat-count">'+esc(countryName)+'</span>' : esc(countryName)) + ` <span class="wm-cat-count">${list.length}</span>`, list.map(e=>e.id));
}
function renderPopEntryList(ids){
  const wrap = document.getElementById('popEntryList');
  wrap.innerHTML = ids.map(id=>{
    const e = entries.find(x=>x.id===id);
    if(!e) return '';
    const place = e.type!=='rta' && e.placeName ? e.placeName : '';
    return `<div class="pop-entry-item" data-popid="${e.id}">
      <div class="pop-entry-item-top">
        ${place ? `<span class="pop-entry-place">${esc(place)}</span>` : ''}
        ${tagHtml(e.type)}${tagsChipsHtml(e)}
        <span class="pop-entry-item-name">${esc(e.name)}</span>
        <span class="pop-entry-item-date">${esc(e.date||'')}</span>
        ${e.description ? '<span class="pop-entry-caret">▼</span>' : ''}
      </div>
      ${e.description ? `<div class="pop-entry-item-desc">${esc(e.description)}</div>` : ''}
      <div class="pop-entry-item-actions">
        <button type="button" data-editpop="${e.id}">수정</button>
        <button type="button" data-delpop="${e.id}">삭제</button>
      </div>
    </div>`;
  }).join('');
  wrap.querySelectorAll('.pop-entry-item-top').forEach(top=>top.addEventListener('click', ()=>{
    const item = top.closest('.pop-entry-item');
    if(!item.querySelector('.pop-entry-item-desc')) return;
    item.classList.toggle('open');
    if(anchorPopTarget) positionAnchorPop();
  }));
  wrap.querySelectorAll('[data-editpop]').forEach(b=>b.addEventListener('click', ()=>{
    const e = entries.find(x=>x.id===b.dataset.editpop);
    const ps = panelState; returnView = ()=>reopenPanel(ps);
    closeInfoModal();
    if(e) openEntryEditModal(e);
  }));
  wrap.querySelectorAll('[data-delpop]').forEach(b=>b.addEventListener('click', ()=>{
    entries = entries.filter(x=>x.id!==b.dataset.delpop);
    save();
    renderAll();
    const remaining = ids.filter(id=>id!==b.dataset.delpop);
    if(remaining.length) renderPopEntryList(remaining); else closeInfoModal();
  }));
}
function hideCtx(){ const m=document.getElementById('wmCtx'); if(m) m.remove(); }
document.addEventListener('click', hideCtx);
document.addEventListener('scroll', hideCtx, true);
document.addEventListener('contextmenu', ev=>{
  const item = ev.target.closest('.pop-entry-item');
  hideCtx();
  if(!item) return;
  const eb = item.querySelector('[data-editpop]'), db = item.querySelector('[data-delpop]');
  if(!eb) return;
  ev.preventDefault();
  const m = document.createElement('div'); m.className='wm-ctx'; m.id='wmCtx';
  m.innerHTML = '<button type="button" data-a="e">수정</button><button type="button" data-a="d" class="danger">삭제</button>';
  m.style.left = Math.min(ev.clientX, innerWidth-120)+'px'; m.style.top = Math.min(ev.clientY, innerHeight-100)+'px';
  m.addEventListener('click', e2=>{ e2.stopPropagation(); const a=e2.target.dataset.a; hideCtx(); if(a==='e') eb.click(); else if(a==='d') db.click(); });
  document.body.appendChild(m);
});
function closeInfoModal(){ document.getElementById('infoModalOverlay').classList.remove('open'); hidePanel(); }
document.getElementById('infoModalOverlay').addEventListener('click', e=>{
  if(e.target.id==='infoModalOverlay') closeInfoModal();
});

// ---------- Add / edit entry modal ----------
function openAddEntryModal(){ openEntryEditModal(null); }
function openEntryEditModal(existing){
  if(!existing) returnView = null;
  const box = document.getElementById('entryModalBox');
  const draft = existing ? JSON.parse(JSON.stringify(existing)) : { id: uid('e'), type: null, name:'', date:'', description:'', memberCountryIds:[] };
  renderEntryModalBody(box, draft, !!existing);
  document.getElementById('entryModalOverlay').classList.add('open');
}
let returnView = null;      // 수정 창 닫은 뒤 돌아갈 화면
let currentCountryView = null;
function closeEntryModal(){
  document.getElementById('entryModalOverlay').classList.remove('open'); exitPickMode();
  const rv = returnView; returnView = null;
  if(rv) setTimeout(rv, 0);
}
document.getElementById('entryModalOverlay').addEventListener('click', e=>{
  if(e.target.id==='entryModalOverlay') closeEntryModal();
});
document.getElementById('addEntryBtn').addEventListener('click', openAddEntryModal);

function renderEntryModalBody(box, draft, isEdit){
  const typeButtons = Object.keys(TYPE_META).map(t=>`<button type="button" data-picktype="${t}" class="${draft.type===t?'selected':''}">${TYPE_META[t].label}</button>`).join('');
  let fieldsHtml = '';
  if(draft.type && draft.type!=='rta'){
    const locLabel = draft.lat!=null ? `${draft.placeName||''} (${draft.lat.toFixed(2)}, ${draft.lng.toFixed(2)})` : '위치가 선택되지 않았어요';
    fieldsHtml += `
      <div class="field"><label>이름</label><input type="text" id="fName" value="${(draft.name||'').replace(/"/g,'&quot;')}" placeholder="${typeMeta(draft.type).label}명"></div>
      ${draft.type==='meeting' ? `<div class="field"><label>차수</label><input type="number" id="fRound" value="${draft.round||''}" placeholder="예: 15"></div>` : ''}
      <div class="field"><label>날짜</label><input type="text" id="fDate" value="${draft.date||''}" placeholder="예: 2019 또는 2019-05-02"></div>
      <div class="field"><label>장소명</label><input type="text" id="fPlace" value="${draft.placeName||''}" placeholder="예: 방콕, 태국"></div>
      <div class="field"><label>위치</label>
        <div class="loc-pick-row">
          <span class="loc-val" id="locVal">${locLabel}</span>
          <button type="button" class="btn btn-small" id="pickLocBtn">지도에서 선택</button>
        </div>
      </div>
      <div class="field"><label>설명</label><textarea id="fDesc" rows="3" placeholder="내용 메모">${draft.description||''}</textarea></div>
      <div class="field"><label>태그 (쉼표로 구분 · 예: 본부, 첫 회의)</label><input type="text" id="fTags" value="${esc((draft.tags||[]).join(', '))}" placeholder="본부, 창설, 첫 회의 …"><div class="tag-quick">${['본부','창설','첫 회의'].map(t=>`<button type="button" data-quicktag="${t}">+ ${t}</button>`).join('')}</div></div>
    `;
  } else if(draft.type==='rta'){
    const selected = draft.memberCountryIds||[];
    fieldsHtml += `
      <div class="field"><label>이름</label><input type="text" id="fName" value="${(draft.name||'').replace(/"/g,'&quot;')}" placeholder="예: RCEP, CPTPP"></div>
      <div class="field"><label>날짜</label><input type="text" id="fDate" value="${draft.date||''}" placeholder="예: 2022 발효"></div>
      <div class="field"><label>설명</label><textarea id="fDesc" rows="2" placeholder="내용 메모">${draft.description||''}</textarea></div>
      <div class="field"><label>태그 (쉼표로 구분 · 예: 본부, 첫 회의)</label><input type="text" id="fTags" value="${esc((draft.tags||[]).join(', '))}" placeholder="본부, 창설, 첫 회의 …"><div class="tag-quick">${['본부','창설','첫 회의'].map(t=>`<button type="button" data-quicktag="${t}">+ ${t}</button>`).join('')}</div></div>
      <div class="field"><label>회원국</label>
        <div class="rta-selected-chips" id="rtaChips"></div>
        <input type="text" class="wm-search" id="rtaCountrySearch" placeholder="나라 검색" style="margin-bottom:6px;">
        <div class="rta-country-picker" id="rtaCountryPicker"></div>
      </div>
    `;
  }
  box.innerHTML = `<h3>${isEdit ? '항목 수정' : '새 항목 추가'}</h3>
    <div class="field"><label>종류</label><div class="type-choice">${typeButtons}</div></div>
    <div id="dynFields">${fieldsHtml}</div>
    <div class="modal-footer">
      <div>${isEdit ? `<button type="button" class="btn btn-small" id="deleteEntryBtn" style="color:var(--red-text);border-color:var(--red-text);">삭제</button>` : ''}</div>
      <div style="display:flex;gap:8px;">
        <button type="button" class="btn" id="cancelEntryBtn">취소</button>
        <button type="button" class="btn btn-primary" id="saveEntryBtn">저장</button>
      </div>
    </div>`;

  box.querySelectorAll('[data-quicktag]').forEach(b=>b.addEventListener('click', ()=>{
    const inp = document.getElementById('fTags');
    const cur = inp.value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
    if(!cur.includes(b.dataset.quicktag)) cur.push(b.dataset.quicktag);
    inp.value = cur.join(', ');
  }));
  box.querySelectorAll('[data-picktype]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      draft.type = btn.dataset.picktype;
      collectFieldsIntoDraft(draft);
      renderEntryModalBody(box, draft, isEdit);
    });
  });
  document.getElementById('cancelEntryBtn').addEventListener('click', closeEntryModal);
  document.getElementById('saveEntryBtn').addEventListener('click', ()=>{
    collectFieldsIntoDraft(draft);
    if(!draft.type){ alert('종류를 선택해주세요'); return; }
    if(!draft.name){ alert('이름을 입력해주세요'); return; }
    if(draft.type!=='rta' && draft.lat==null){ alert('지도에서 위치를 선택해주세요'); return; }
    if(draft.type==='rta' && (!draft.memberCountryIds || !draft.memberCountryIds.length)){ alert('회원국을 1개 이상 선택해주세요'); return; }
    if(!draft.createdAt) draft.createdAt = Date.now();
    const idx = entries.findIndex(x=>x.id===draft.id);
    if(idx>=0) entries[idx] = draft; else entries.push(draft);
    save();
    closeEntryModal();
    renderAll();
  });
  const delBtn = document.getElementById('deleteEntryBtn');
  if(delBtn) delBtn.addEventListener('click', ()=>{
    entries = entries.filter(x=>x.id!==draft.id);
    save();
    closeEntryModal();
    renderAll();
  });

  const pickBtn = document.getElementById('pickLocBtn');
  if(pickBtn) pickBtn.addEventListener('click', ()=>{
    collectFieldsIntoDraft(draft);
    document.getElementById('entryModalOverlay').classList.remove('open');
    enterPickMode((lat,lng)=>{
      draft.lat = lat; draft.lng = lng; delete draft.countryId;
      document.getElementById('entryModalOverlay').classList.add('open');
      renderEntryModalBody(box, draft, isEdit);
    });
  });

  if(draft.type==='rta'){
    const searchInput = document.getElementById('rtaCountrySearch');
    const renderChipsAndPicker = ()=>{
      const sel = draft.memberCountryIds||[];
      document.getElementById('rtaChips').innerHTML = sel.map(cid=>`<span class="rta-chip">${COUNTRY_NAME_BY_ID[cid]||cid}<button type="button" data-unchip="${cid}">×</button></span>`).join('') || '<span style="color:var(--ink-soft);font-size:11px;">선택된 나라 없음</span>';
      document.querySelectorAll('[data-unchip]').forEach(b=>b.addEventListener('click', ()=>{
        draft.memberCountryIds = (draft.memberCountryIds||[]).filter(c=>c!==b.dataset.unchip);
        renderChipsAndPicker();
      }));
      const q = (searchInput.value||'').trim().toLowerCase();
      const list = COUNTRY_LIST.filter(c=>!q || c.name.toLowerCase().includes(q));
      document.getElementById('rtaCountryPicker').innerHTML = list.map(c=>`
        <label class="rta-country-row"><input type="checkbox" data-countryid="${c.id}" ${sel.includes(String(c.id))?'checked':''}> ${c.name}</label>
      `).join('');
      document.querySelectorAll('[data-countryid]').forEach(cb=>{
        cb.addEventListener('change', ()=>{
          const cid = cb.dataset.countryid;
          draft.memberCountryIds = draft.memberCountryIds||[];
          if(cb.checked){ if(!draft.memberCountryIds.includes(cid)) draft.memberCountryIds.push(cid); }
          else { draft.memberCountryIds = draft.memberCountryIds.filter(c=>c!==cid); }
          renderChipsAndPicker();
        });
      });
    };
    searchInput.addEventListener('input', renderChipsAndPicker);
    renderChipsAndPicker();
  }
}
function collectFieldsIntoDraft(draft){
  const g = id => document.getElementById(id);
  if(g('fName')) draft.name = g('fName').value.trim();
  if(g('fDate')) draft.date = g('fDate').value.trim();
  if(g('fDesc')) draft.description = g('fDesc').value.trim();
  if(g('fPlace')) draft.placeName = g('fPlace').value.trim();
  if(g('fRound')) draft.round = g('fRound').value.trim();
  if(g('fTags')) draft.tags = g('fTags').value.split(/[,，]/).map(x=>x.trim()).filter(Boolean);
}

// ---------- Pick-location mode ----------
function enterPickMode(cb){
  pickMode = cb;
  document.getElementById('mapStage').classList.add('picking');
  document.getElementById('pickHint').classList.add('on');
}
function exitPickMode(){
  pickMode = null;
  document.getElementById('mapStage').classList.remove('picking');
  document.getElementById('pickHint').classList.remove('on');
}
document.getElementById('worldSvg').addEventListener('click', e=>{
  if(!pickMode) return;
  const svg = document.getElementById('worldSvg');
  const pt = svg.createSVGPoint();
  pt.x = e.clientX; pt.y = e.clientY;
  const ctm = svg.getScreenCTM().inverse();
  const loc = pt.matrixTransform(ctm);
  const [lng, lat] = unprojectXY(loc.x, loc.y);
  const cb = pickMode;
  exitPickMode();
  cb(lat, lng);
});
document.addEventListener('keydown', e=>{
  if(e.key==='Escape' && pickMode){
    exitPickMode();
    document.getElementById('entryModalOverlay').classList.add('open');
  }
});

// ---------- Report height to parent (iframe embed) ----------
(function(){
  if(window.parent === window) return;
  let lastH = 0;
  function reportHeight(){
    const h = document.body.scrollHeight;
    if(h !== lastH){ lastH = h; window.parent.postMessage({type:'wmHeight', height:h}, '*'); }
  }
  new ResizeObserver(reportHeight).observe(document.body);
  reportHeight();
})();

function renderAll(){
  renderTypeFilters();
  renderMarkers();
  applyRtaHighlight();
  renderSidebarList();
}
hidePanel();
renderAll();

</script>
