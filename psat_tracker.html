<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PSAT REVIEW</title>
<style>
@import url("https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/subsets/Paperlogy-dynamic-subset.css");

:root{
  --lavender:#E8F1F9; --lavender-deep:#2A558C;
  --mint:#DFF3E8; --mint-deep:#4FAE83;
  --peach:#FCE9DC; --peach-deep:#E8935A;
  --blue-chip:#E1EEFC; --blue-deep:#3E7CB8;
  --pink-chip:#FCE4EC; --pink-deep:#C15574;
  --ox-correct:#4FA0D6;
  --green-text:#4FAE83; --red-text:#C2624A;
  --ink:#33303B; --ink-soft:#8A8594; --line:#EDEBF1; --bg:#FCFBFA;
}
*{box-sizing:border-box;}
body{margin:0;font-family:"Paperlogy","Pretendard",-apple-system,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;padding-bottom:70px;}
header{padding:26px 24px 18px;text-align:center;border-bottom:1px solid var(--line);}
header h1{font-weight:800;font-size:22px;margin:0;letter-spacing:0.02em;}

#memoBtn{position:fixed;top:16px;right:20px;z-index:150;border:1.5px solid var(--lavender-deep);background:var(--lavender);color:#2A558C;font-family:inherit;font-weight:800;font-size:12.5px;padding:8px 16px;border-radius:999px;cursor:pointer;letter-spacing:0.03em;}
#memoBtn:hover{background:#E2D5F8;}

.tabs{display:flex;justify-content:center;gap:6px;margin:20px auto 0;padding:0 16px;}
.tab-btn{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-family:inherit;font-weight:700;font-size:13.5px;padding:8px 18px;border-radius:9px;cursor:pointer;}
.tab-btn.active{background:var(--lavender);border-color:var(--lavender-deep);color:#2A558C;}
main{max-width:1300px;margin:24px auto;padding:0 20px;}
.panel{display:none;}
.panel.active{display:block;}
.toolbar{display:flex;justify-content:flex-end;align-items:center;margin-bottom:12px;flex-wrap:wrap;gap:10px;}
.toolbar h2{font-size:15px;margin:0;font-weight:800;margin-right:auto;}
.btn{font-family:inherit;border:1.5px solid transparent;cursor:pointer;font-weight:700;border-radius:9px;padding:8px 16px;font-size:13.5px;}
.btn-small{padding:6px 12px;font-size:12px;}
.btn-plain{background:#fff;border-color:var(--line);color:var(--ink-soft);}
.btn-plain:hover{background:#FAFAFA;}
.btn-primary{background:var(--lavender-deep);color:#fff;}
.btn-danger-text{background:none;border:none;color:#D18A8A;font-weight:700;font-size:12px;cursor:pointer;padding:4px 6px;}

.mini-filter{display:flex;flex-direction:column;gap:5px;align-items:flex-start;}
.mini-filter select{width:110px;}
.mini-filter select{font-family:inherit;border:1.5px solid var(--line);background:#fff;border-radius:8px;padding:6px 8px;font-size:12.5px;color:var(--ink);}

.add-row-card{border:1.5px dashed #CFE0ED;border-radius:12px;margin-bottom:10px;overflow:hidden;background:#FAFCFE;}
.add-row-trigger{width:100%;background:none;border:none;text-align:left;padding:12px 16px;font-family:inherit;font-weight:700;font-size:13.5px;color:var(--lavender-deep);cursor:pointer;}
.add-row-trigger:hover{background:#F7F4FC;}
.create-panel{display:none;padding:0 16px 16px;}
.create-panel.open{display:block;}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
.field{flex:1;min-width:130px;display:flex;flex-direction:column;gap:5px;}
.field label{font-size:11.5px;font-weight:700;color:var(--ink-soft);}
select,input[type=text],input[type=number],input[type=date]{font-family:inherit;border:1.5px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:13.5px;color:var(--ink);outline:none;}
select:focus,input:focus{border-color:var(--lavender-deep);}
.seg{display:flex;gap:5px;background:#EAF1F8;padding:3px;border-radius:9px;}
.seg button{flex:1;border:none;background:transparent;padding:7px 8px;border-radius:7px;font-family:inherit;font-weight:700;font-size:12.5px;color:var(--ink-soft);cursor:pointer;}
.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(120,100,160,0.18);}
.date-chip-area{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
.chip{background:var(--blue-chip);color:var(--blue-deep);font-size:11.5px;font-weight:700;padding:4px 9px;border-radius:999px;display:flex;align-items:center;gap:5px;}
.chip button{border:none;background:none;cursor:pointer;color:var(--blue-deep);font-weight:800;padding:0;}
.add-date-row{display:flex;gap:6px;margin-top:6px;}
.add-date-row input{flex:1;}
.create-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:4px;}

.test-card{display:flex;align-items:flex-start;border:1px solid var(--line);border-radius:12px;margin-bottom:10px;overflow:hidden;}
.test-side{width:auto;flex:0 0 auto;background:#FCFCFD;border-right:1px solid var(--line);padding:10px 12px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;white-space:nowrap;cursor:context-menu;}
.ts-row{display:flex;flex-wrap:nowrap;align-items:center;gap:6px;}
.test-main{flex:1;min-width:0;padding:14px;overflow-x:auto;}
.test-card.compact .test-side{padding:8px 14px;}
.test-card.compact .test-main{padding:8px 14px;}
.akey-cell{width:21px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);background:transparent;cursor:pointer;border-radius:5px;}
.akey-cell:hover{outline:2px solid var(--lavender-deep);outline-offset:-2px;}
.chip-static{font-size:11px;font-weight:800;padding:3px 9px;border-radius:7px;display:inline-block;width:fit-content;white-space:nowrap;}
.c-level5{background:var(--blue-chip);color:var(--blue-deep);}
.c-level7{background:var(--pink-chip);color:var(--pink-deep);}
.c-subj-언어논리{background:var(--lavender);color:#2A558C;}
.c-subj-상황판단{background:var(--mint);color:var(--green-text);}
.c-subj-자료해석{background:var(--peach);color:var(--peach-deep);}
.c-round{background:#EAF1F8;color:#4A6D8C;}
.c-level-mk{background:#FDEBD3;color:#B8793E;}
.c-year{background:#F0F0F5;color:#4A4658;font-size:12px;}
.akey-year-text{font-weight:800;font-size:13px;color:var(--ink);}
.akey-subject-text{font-size:12.5px;color:var(--ink-soft);}
.test-dates{font-size:10.5px;color:var(--ink-soft);}
.score-end{margin-left:auto;padding-left:14px;font-weight:800;font-size:15px;display:flex;align-items:center;}
.score-good{color:var(--green-text);}
.score-mid{color:#D19A44;}
.score-bad{color:var(--red-text);}

@media (max-width:640px){
  .test-card{flex-direction:column;}
  .test-side{width:100%;flex-direction:row;flex-wrap:wrap;align-items:center;border-right:none;border-bottom:1px solid var(--line);}
}
.grid-row-block{margin-bottom:3px;}
.num-header,.cell-grid{display:flex;flex-wrap:nowrap;gap:1px;}
.head-cell{width:21px;height:16px;flex:none;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--ink-soft);font-weight:700;border-radius:3px;}
.head-cell.col-hover{background:var(--lavender);color:#2A558C;}
.cell{width:21px;height:28px;flex:none;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px;border-radius:5px;cursor:pointer;user-select:none;color:var(--ox-correct);background:transparent;position:relative;}
.cell:hover{outline:2px solid var(--lavender-deep);outline-offset:-2px;}
.cell.selected{box-shadow:0 0 0 2px var(--lavender-deep);}
.cell.readonly{cursor:default;}
.cell.readonly:hover{outline:none;}

.kw-chip-list{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px;}
.kw-opt{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;}
.kw-opt.selected{background:var(--lavender);border-color:var(--lavender-deep);color:#2A558C;}
.kw-add-row{display:flex;gap:6px;}
.kw-add-row input{flex:1;}

/* compact "+"-popover keyword picker (universal pattern) */
.kw-compact{position:relative;display:inline-flex;}
.kw-compact-list{display:inline-flex;flex-wrap:wrap;gap:6px;align-items:center;}
.kw-tag-sel{background:var(--lavender);border:1.5px solid var(--lavender-deep);color:#2A558C;font-family:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;}
.kw-tag-sel:hover{background:#E2D5F8;}
.kw-plus-btn{width:24px;height:24px;border-radius:50%;border:1.5px dashed #D9D3E8;background:#FAF9FD;color:#A99BC9;font-family:inherit;font-size:14px;font-weight:800;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;flex:none;}
.kw-plus-btn:hover{background:var(--lavender);border-color:var(--lavender-deep);color:#2A558C;border-style:solid;}
.kw-picker-pop{position:absolute;top:calc(100% + 6px);left:0;z-index:260;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 28px rgba(60,40,90,0.18);padding:8px;min-width:170px;max-width:300px;max-height:260px;overflow-y:auto;display:none;}
.kw-picker-pop.open{display:block;}
.kw-picker-item{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:12.5px;font-weight:600;color:var(--ink);padding:6px 8px;border-radius:7px;cursor:pointer;}
.kw-picker-item:hover{background:#F5F3FA;}
.kw-picker-empty{font-size:11.5px;color:var(--ink-soft);padding:4px 8px;}
.kw-picker-addrow{display:flex;gap:5px;margin-top:4px;padding-top:6px;border-top:1px solid var(--line);}
.kw-picker-input{flex:1;border:1.5px solid var(--line);border-radius:7px;padding:5px 7px;font-family:inherit;font-size:12px;outline:none;}
.kw-picker-input:focus{border-color:var(--lavender-deep);}
.kw-picker-addbtn{flex:none;border:none;background:var(--lavender-deep);color:#fff;font-family:inherit;font-size:12px;font-weight:700;border-radius:7px;padding:5px 9px;cursor:pointer;}
.kw-picker-flow{display:flex;flex-wrap:wrap;gap:6px;max-width:320px;}
.kw-picker-chip{border:1.5px solid var(--line);background:#fff;color:var(--ink-soft);font-family:inherit;font-size:12px;font-weight:700;padding:5px 10px;border-radius:999px;cursor:pointer;white-space:nowrap;}
.kw-picker-chip.selected{background:var(--lavender);border-color:var(--lavender-deep);color:#2A558C;}

.swp-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:6px;}
.swp-head b{color:#2A558C;font-size:12.5px;}
.swp-more-btn{border:none;background:none;color:var(--ink-soft);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:6px;}
.swp-more-btn:hover{background:#F5F3FA;}
.swp-more-menu{position:absolute;right:0;top:26px;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 20px rgba(60,40,90,0.16);padding:4px;display:none;z-index:10;}
.swp-more-menu.open{display:block;}
.swp-more-menu button{display:flex;align-items:center;gap:6px;white-space:nowrap;background:none;border:none;font-family:inherit;font-size:11.5px;font-weight:700;color:var(--ink);padding:6px 9px;border-radius:6px;cursor:pointer;}
.swp-more-menu button:hover{background:#F5F3FA;}
.swp-list{display:flex;flex-wrap:wrap;gap:5px;}
.swp-chip{padding:3px 8px;border-radius:999px;font-weight:700;font-size:11px;}
.swp-chip.wrong{background:#FBE6E2;color:var(--red-text);}
.swp-chip.flagged{background:var(--lavender);color:#2A558C;}
.swp-chip.other{background:#F0F0F5;color:var(--ink-soft);}
.swp-empty{color:var(--ink-soft);font-size:11.5px;}
.swp-sec-label{font-size:10px;color:var(--ink-soft);margin:8px 0 4px;}
.swp-rows{display:flex;flex-direction:column;gap:2px;}
.swp-row{border-bottom:1px solid var(--line);padding:6px 0;}
.swp-row:last-child{border-bottom:none;}
.swp-num{display:inline-flex;align-items:center;justify-content:flex-start;min-width:16px;font-weight:800;font-size:12.5px;color:var(--ink);cursor:pointer;flex-shrink:0;}
.swp-row-main{display:flex;align-items:flex-start;gap:8px;flex-wrap:nowrap;}
.swp-choice{font-size:12px;font-weight:600;flex-shrink:0;padding-top:1px;}
.swp-choice.wrong{color:var(--red-text);}
.swp-choice.correct{color:var(--ox-correct);}
.swp-reason-wrap{flex:1 1 auto;min-width:0;}
.swp-reason{font-size:12px;color:var(--ink);line-height:1.6;word-break:keep-all;overflow-wrap:break-word;}
.swp-pin{border:none;background:none;cursor:pointer;color:var(--ink-soft);padding:2px;display:flex;align-items:center;width:15px;height:15px;flex-shrink:0;}
.swp-pin svg{width:13px;height:13px;}
.swp-pin.on{color:var(--red-text);}
.swp-detail-open{border:none;background:none;color:var(--ink-soft);font-size:13px;font-weight:700;cursor:pointer;padding:2px 2px;flex-shrink:0;}
.akey-note-rounds{display:flex;flex-direction:column;gap:6px;}
.akey-note-round{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#F7F6FB;}
.akey-note-round-head{width:100%;display:flex;align-items:center;justify-content:space-between;background:transparent;border:none;padding:9px 12px;font-size:12.5px;font-weight:700;color:var(--ink);cursor:pointer;}
.akey-note-round-caret{font-size:11px;color:var(--ink-soft);transition:transform .15s;}
.akey-note-round-head.open .akey-note-round-caret{transform:rotate(180deg);}
.akey-note-round-body{background:#fff;padding:2px 12px 8px;border-top:1px solid var(--line);}

.ctx-menu{position:fixed;z-index:200;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 8px 24px rgba(60,40,90,0.16);padding:6px;min-width:190px;display:none;}
#quickPop{z-index:260;}
.ctx-menu button{display:block;width:100%;text-align:left;background:none;border:none;font-family:inherit;font-size:13px;font-weight:600;color:var(--ink);padding:8px 10px;border-radius:7px;cursor:pointer;}
.ctx-menu button:hover{background:#F5F3FA;}
.ctx-sep{height:1px;background:var(--line);margin:4px 2px;}

.info-pop{position:fixed;z-index:250;background:#fff;color:var(--ink);font-size:12px;padding:10px 13px;border-radius:10px;max-width:250px;line-height:1.7;display:none;box-shadow:0 10px 28px rgba(60,40,90,0.2);border:1px solid var(--line);}
.info-pop-head{display:flex;align-items:center;justify-content:space-between;gap:12px;}
.info-pop-search{color:var(--ink-soft);cursor:pointer;display:flex;align-items:center;}
.info-pop-search:hover{color:var(--lavender-deep);}
.info-pop b{color:#2A558C;}
.info-pop-choice{color:#C2857A;font-weight:700;}
.info-pop-reason{margin-top:1px;line-height:1.4;}
.info-pop-reason-kw{margin-top:3px;}
.info-pop-type{margin-top:11px;}

.modal-overlay{position:fixed;inset:0;background:rgba(50,40,70,0.28);display:none;align-items:center;justify-content:center;z-index:300;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:14px;padding:20px 22px;width:360px;box-shadow:0 20px 50px rgba(40,20,70,0.2);}
.modal-box h3{margin:0 0 12px;font-size:15px;}
.modal-box .field{margin-bottom:10px;}
.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:6px;}

.popup-box{background:#fff;border-radius:16px;padding:22px 24px;width:min(980px,96vw);max-height:82vh;overflow-y:auto;box-shadow:0 20px 50px rgba(40,20,70,0.22);}
.popup-box h3{margin:0 0 14px;font-size:16px;}
.popup-subj-block{margin-bottom:16px;}
.popup-subj-title{font-size:12.5px;font-weight:800;color:var(--ink-soft);margin-bottom:6px;}
.popup-round-label{font-size:10.5px;font-weight:400;color:#B0ABBC;margin:8px 0 3px;}

.notion-page-box{background:#fff;border:1.5px solid var(--line);border-radius:14px;padding:0;width:min(720px,94vw);box-shadow:0 12px 32px rgba(40,20,70,0.1);}
#detailOverlay.open{position:absolute;top:0;left:0;right:0;bottom:auto;height:auto;min-height:100vh;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:visible;background:rgba(252,251,250,0.88);}
#examPopupOverlay.open{position:absolute;top:0;left:0;right:0;bottom:auto;height:auto;min-height:100vh;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:visible;}
#modalOverlay.open{position:absolute;top:0;left:0;right:0;bottom:auto;height:auto;min-height:100vh;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:visible;background:rgba(252,251,250,0.88);}
#sideWrongModalOverlay.open{position:absolute;top:0;left:0;right:0;bottom:auto;height:auto;min-height:100vh;align-items:flex-start;justify-content:center;padding:40px 16px;overflow:visible;background:rgba(252,251,250,0.88);}
.np-header{padding:22px 26px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:flex-start;}
.np-title{font-size:20px;font-weight:800;}
.np-sub{font-size:12px;color:var(--ink-soft);margin-top:5px;}
.np-close{border:none;background:none;font-size:22px;line-height:1;color:var(--ink-soft);cursor:pointer;padding:2px 4px;}
.np-header-actions{display:flex;align-items:center;gap:8px;}
.np-pin-btn{width:32px;height:32px;border-radius:50%;border:1.5px solid var(--line);background:#fff;color:#C9C4D4;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:none;}
.np-pin-btn:hover{border-color:var(--red-text);color:#D99B8E;}
.np-pin-btn.pinned{background:#FBE6E2;border-color:var(--red-text);color:var(--red-text);}
.np-pin-btn svg{width:15px;height:15px;}
.pin-icon{display:inline-flex;vertical-align:-2px;width:13px;height:13px;margin-right:2px;}
.pin-icon svg{width:100%;height:100%;}
.np-body{padding:6px 26px 26px;}
.np-row{display:flex;gap:16px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start;}
.np-row:last-child{border-bottom:none;}
.np-label{width:100px;flex:none;font-size:12.5px;font-weight:700;color:var(--ink-soft);padding-top:6px;}
.np-value{flex:1;font-size:13.5px;padding-top:4px;}
.np-value input[type=text]{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13.5px;}
.np-answer-mini{width:52px !important;flex:none;display:inline-block;margin-right:10px;}
.np-attempt-history{display:inline-flex;gap:4px;vertical-align:middle;font-weight:500;font-size:13px;}
.np-att-hist.att-correct{color:var(--ox-correct);}
.np-att-hist.att-wrong{color:var(--red-text);}
.np-attempt-row{display:flex;flex-wrap:wrap;align-items:flex-start;gap:6px;margin-bottom:8px;}
.np-attempt-kw{flex:1 1 100%;margin-left:104px;}
.np-attempt-row .np-round-label,.np-attempt-row .att-choice-input,.np-attempt-row .np-time-input{margin-top:1px;}
.np-round-label{flex:none;width:36px;font-size:10.5px;color:var(--ink-soft);}
.np-time-input{width:62px !important;flex:none;border:1.5px solid var(--line);border-radius:7px;padding:5px 4px;text-align:center;font-family:inherit;font-size:12.5px;}
.att-choice-correct{display:inline-flex;align-items:center;justify-content:center;width:28px;height:28px;flex:none;color:var(--ox-correct);font-weight:700;font-size:13px;}
.np-attempt-reason-empty{flex:1;color:var(--ink-soft);font-size:12px;padding:6px 0;}
.att-choice-input{width:28px !important;height:28px;flex:none;border-radius:50%;border:1.6px solid var(--red-text);color:var(--red-text);text-align:center;font-weight:500;font-size:13px;padding:0 !important;background:#fff;}
.att-choice-input:focus{border-color:var(--lavender-deep);color:var(--ink);}
.np-attempt-reason{flex:1 !important;min-width:0;width:auto !important;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:12.5px;resize:none;overflow:hidden;line-height:1.5;min-height:30px;}
.np-choice-row{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);}
.np-choice-row:last-child{border-bottom:none;}
.np-choice-head{flex:none;width:24px;padding-top:6px;font-size:15px;}
.np-choice-body{flex:1;}
.np-choice-text{width:100%;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;font-family:inherit;font-size:12.5px;margin-top:6px;}
.np-value textarea{width:100%;border:1.5px solid var(--line);border-radius:9px;padding:8px 10px;font-family:inherit;font-size:13.5px;resize:vertical;line-height:1.7;}

.review-mark{width:12px;height:12px;border-radius:50%;border:1.4px solid #C9C4D4;display:inline-block;margin-right:3px;background:#fff;}
.review-mark.filled{background:#5FB8E0;border-color:#5FB8E0;}
.review-marks-area{cursor:pointer;padding:4px 6px;border-radius:8px;display:inline-flex;align-items:center;}

function uid(p){ return (p||'r') + Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function idKey(r){ return [r.category, r.level, r.subject, r.year||'', r.setName||''].join('|'); }
function testLabel(r){ return r.category==='기출' ? `${r.year}` : (r.setName || '유형모음'); }
function levelChipClass(level){
  if(level==='5급') return 'c-level5';
  if(level==='7급') return 'c-level7';
  return 'c-level-mk';
}
function parseTimeToSeconds(str){
  if(!str) return null;
  const m = String(str).trim().match(/^(\d+):(\d{1,2})$/);
  if(!m) return null;
  return parseInt(m[1],10)*60 + parseInt(m[2],10);
}
function yearSortValue(y){
  if(y===null || y===undefined) return Infinity;
  const s = String(y);
  const m = s.match(/^(\d+)(?:\((\d+)\))?/);
  if(!m) return parseFloat(s) || 0;
  const base = parseInt(m[1],10);
  const suffix = m[2] ? parseInt(m[2],10) : 0;
  return base + suffix*0.01;
}
function wrongHistoryCount(rec, num){
  const key = idKey(rec);
  let count = 0;
  records.forEach(r=>{ if(idKey(r)===key && num<=r.total && r.wrongs[num]) count++; });
  return count;
}
function accClass(pct){ return pct>=80?'score-good':(pct>=50?'score-mid':'score-bad'); }

let memoDrag = null;
document.getElementById('memoDragHandle').addEventListener('mousedown', e=>{
  if(e.target.id==='memoCloseBtn') return;
  const box = document.getElementById('memoOverlay');
  const rect = box.getBoundingClientRect();
  memoDrag = { offsetX: e.clientX-rect.left, offsetY: e.clientY-rect.top };
  document.addEventListener('mousemove', onMemoDragMove);
  document.addEventListener('mouseup', onMemoDragEnd);
});
function onMemoDragMove(e){
  if(!memoDrag) return;
  const box = document.getElementById('memoOverlay');
  box.style.left = Math.max(0, e.clientX-memoDrag.offsetX)+'px';
  box.style.top = Math.max(0, e.clientY-memoDrag.offsetY)+'px';
  box.style.right = 'auto';
}
function onMemoDragEnd(){
  memoDrag = null;
  document.removeEventListener('mousemove', onMemoDragMove);
  document.removeEventListener('mouseup', onMemoDragEnd);
}

function renderViewTabs(){
  const area = document.getElementById('viewTabs');
  let html = `<button type="button" class="view-tab ${activeViewId===null?'active':''}" data-view="all">전체</button>`;
  html += savedViews.map(v=>`<button type="button" class="view-tab ${activeViewId===v.id?'active':''}" data-view="${v.id}">${v.name}<span class="vt-del" data-delview="${v.id}">×</span></button>`).join('');
  html += `<button type="button" class="view-tab-add" id="addViewBtn">＋ 현재 필터 저장</button>`;
  area.innerHTML = html;

  area.querySelectorAll('.view-tab').forEach(btn=>{
    btn.addEventListener('click', e=>{
      if(e.target.classList.contains('vt-del')) return;
      const vid = btn.dataset.view;
      if(vid==='all'){ activeViewId=null; resetFilterState(); }
      else {
        const v = savedViews.find(x=>x.id===vid);
        if(v){ activeViewId=v.id; applyFilterState(v.filters); }
      }
      renderFilterChips(); renderViewTabs(); renderAll();
    });
  });
  area.querySelectorAll('.vt-del').forEach(x=>{
    x.addEventListener('click', e=>{
      e.stopPropagation();
      if(confirm('이 보기를 삭제할까요?')){
        savedViews = savedViews.filter(v=>v.id!==x.dataset.delview);
        localStorage.setItem(SAVED_VIEWS_KEY, JSON.stringify(savedViews));
        if(activeViewId===x.dataset.delview){ activeViewId=null; resetFilterState(); }
        renderFilterChips(); renderViewTabs(); renderAll();
      }
    });
  });
  document.getElementById('addViewBtn').addEventListener('click', ()=>{
    const name = prompt('이 필터 조합을 저장할 이름을 입력하세요');
    if(!name) return;
    const view = { id: uid('sv'), name, filters: currentFilterState(), createdAt: Date.now() };
    savedViews.push(view);
    localStorage.setItem(SAVED_VIEWS_KEY, JSON.stringify(savedViews));
    activeViewId = view.id;
    renderViewTabs();
  });
}

function scoreClass(correct,total){
  const ratio = correct/total;
  if(ratio>=0.8) return 'score-good';
  if(ratio>=0.6) return 'score-mid';
  return 'score-bad';
}

// ---------- Grid building (7급: 1 row of 25 / 5급: rows of 20) ----------
function buildCellHtml(r, n, opts){
  opts = opts || {};
  const isWrong = !!r.wrongs[n];
  const typeKw = r.problemTypeKeywords[n];
  const isSelected = !opts.readonly && activeSelection.testId===r.id && activeSelection.nums.has(n);
  let style = '';
  if(isWrong){
    const cnt = wrongHistoryCount(r, n);
    const alpha = Math.min(cnt*0.2, 1);
    style = `style="background:rgba(226,120,100,${alpha});color:${alpha>=0.5?'#fff':'var(--red-text)'};"`;
  }
  const cls = `cell ${isSelected?'selected':''} ${opts.readonly?'readonly':''}`;
  return `<div class="${cls}" ${style} data-rec="${r.id}" data-num="${n}">${isWrong?'X':'O'}</div>`;
}
function buildGridBlock(rec, opts, trailingHtml){
  const total = rec.total;
  let header='', cells='';
  for(let n=1;n<=total;n++){
    header += `<div class="head-cell" data-num="${n}">${n}</div>`;
    cells += buildCellHtml(rec, n, opts);
  }
  if(trailingHtml) cells += trailingHtml;
  return `<div class="grid-row-block"><div class="num-header">${header}</div><div class="cell-grid">${cells}</div></div>`;
}

function testSortComparator(a,b){
  const lvlRank = r=>r.level==='7급'?0:(r.level==='5급'?1:2);
  if(lvlRank(a)!==lvlRank(b)) return lvlRank(a)-lvlRank(b);
  const aYear = yearSortValue(a.year), bYear = yearSortValue(b.year);
  if(aYear!==bYear) return aYear-bYear;
  return a.createdAt-b.createdAt;
}

function renderTests(){
  const dyn = document.getElementById('testsDynamic');
  const lvlF = document.getElementById('testFilterLevel').value;
  const subjF = document.getElementById('testFilterSubject').value;
  const filtered = records.filter(r=>{
    if(lvlF!=='all' && r.level!==lvlF) return false;
    if(subjF!=='all' && r.subject!==subjF) return false;
    return true;
  });
  const sorted = [...filtered].sort(testSortComparator);
  document.getElementById('testsEmpty').style.display = sorted.length ? 'none':'block';

  dyn.innerHTML = sorted.map(r=>{
    const wrongCount = Object.keys(r.wrongs).length;
    const correct = r.total - wrongCount;
    const dateStr = r.dates && r.dates.length ? r.dates.sort().join(', ') : '';
    return `
      <div class="test-card">
        <div class="test-side" data-rec="${r.id}">
          <div class="ts-row">
            <span class="chip-static ${levelChipClass(r.level)}">${r.level}</span>
            <span class="chip-static c-subj-${r.subject}">${r.subject}</span>
          </div>
          <div class="ts-row">
            <span class="chip-static c-year">${testLabel(r)}</span>
            <span class="chip-static c-round">${r.round||1}회독</span>
          </div>
          ${dateStr ? `<span class="test-dates">${dateStr}</span>` : ''}
        </div>
        <div class="test-main">${buildGridBlock(r, {}, `<div class="score-end ${scoreClass(correct,r.total)}">${correct}/${r.total}</div>`)}</div>
      </div>
    `;
  }).join('');
}

function buildNoteRowsHtml(rec){
  const idk = idKey(rec);
  const wrongNums = Object.keys(rec.wrongs).map(n=>parseInt(n,10)).sort((a,b)=>a-b);
  const flaggedSet = new Set(reviewBox.filter(e=>e.idKeyStr===idk).map(e=>e.num));
  const flaggedOnlyNums = [...flaggedSet].filter(n=>!wrongNums.includes(n)).sort((a,b)=>a-b);
  const noteNums = [...wrongNums, ...flaggedOnlyNums];
  if(!noteNums.length){
    return { html: '<div class="swp-empty">오답·보충학습 표시가 없어요</div>', noteNums };
  }
  const html = `<div class="swp-rows">` + noteNums.map(n=>{
    const w = rec.wrongs[n];
    const isWrong = !!w;
    const isFlagged = flaggedSet.has(n);
    const typeKw = (rec.problemTypeKeywords && rec.problemTypeKeywords[n]) || [];
    const reasonKw = (w && w.reasonKeywords) || [];
    const correctChoiceVal = (rec.correctChoices && rec.correctChoices[n]) || '';
    const choiceVal = isWrong ? (w.selectedChoice||'') : correctChoiceVal;
    const kwChips = [
      ...reasonKw.map(k=>`<span class="kw-tag">${k}</span>`),
      ...typeKw.map(k=>`<span class="kw-tag type">${k}</span>`)
    ].join('');
    return `<div class="swp-row" data-rownum="${n}">
      <div class="swp-row-main">
        <span class="swp-num" data-opennum="${n}">${n}</span>
        ${choiceVal ? `<span class="swp-choice ${isWrong?'wrong':'correct'}">(${choiceVal})</span>` : ''}
        <span class="swp-reason-wrap">${isWrong && w.reasonText ? `<span class="swp-reason">${w.reasonText}</span>` : ''}${kwChips}</span>
        <button type="button" class="swp-pin ${isFlagged?'on':''}" data-pinnum="${n}" title="보충학습">${PIN_ICON}</button>
        <button type="button" class="swp-detail-open" data-opennum2="${n}" title="상세페이지">→</button>
      </div>
    </div>`;
  }).join('') + `</div>`;
  return { html, noteNums };
}
function wireNoteRowEvents(container, rec, onPinChange){
  const idk = idKey(rec);
  container.querySelectorAll('[data-opennum]').forEach(c=>{
    c.addEventListener('click', ()=>{
      const n = parseInt(c.dataset.opennum,10);
      closeSideWrongPop();
      openProblemDetailPage(idk, n, rec.level, rec.subject, testLabel(rec));
    });
  });
  container.querySelectorAll('[data-opennum2]').forEach(c=>{
    c.addEventListener('click', ()=>{
      const n = parseInt(c.dataset.opennum2,10);
      closeSideWrongPop();
      openProblemDetailPage(idk, n, rec.level, rec.subject, testLabel(rec));
    });
  });
  container.querySelectorAll('[data-pinnum]').forEach(c=>{
    c.addEventListener('click', ev=>{
      ev.stopPropagation();
      const n = parseInt(c.dataset.pinnum,10);
      const existing = reviewBox.find(e=>e.idKeyStr===idk && e.num===n);
      if(existing){ reviewBox = reviewBox.filter(e=>e.id!==existing.id); }
      else { reviewBox.push({ id:uid('v'), idKeyStr:idk, level:rec.level, subject:rec.subject, label:testLabel(rec), num:n, addedAt:Date.now() }); }
      saveReview();
      if(onPinChange) onPinChange(); else openSideWrongPop(rec);
    });
  });
}
function openSideWrongPop(rec){
  sideWrongModalRec = rec;

      <div class="date-chip-area" id="roundDateChips"></div>

    <p class="hint" style="font-size:11px;color:var(--ink-soft);">만들고 나면 전부 O(정답)로 시작해요. 그 다음 문제 칸을 클릭·우클릭해서 오답을 표시하면 돼요.</p>
  `, ()=>{

    records.push(rec); save();
    renderTests();
    if(document.getElementById('panel-all').classList.contains('active')) renderAll();

function keywordSelectorHtml(elId){
  return `<div class="kw-compact">
    <div class="kw-compact-list" id="${elId}_chips"></div>
    <div class="kw-picker-pop" id="${elId}_pop"></div>
  </div>`;
}
function wireKeywordSelector(elId, storeKey, selSet){
  const chipsEl = document.getElementById(elId+'_chips');
  const popEl = document.getElementById(elId+'_pop');
  function closePop(){ popEl.classList.remove('open'); }
  function openPop(){
    document.querySelectorAll('.kw-picker-pop.open').forEach(p=>{ if(p!==popEl) p.classList.remove('open'); });
    drawPop();
    popEl.classList.add('open');
  }
  function draw(){
    const selHtml = [...selSet].map(k=>
      `<span class="kw-tag-sel" data-kw="${k}">${k} ×</span>`
    ).join('');
    chipsEl.innerHTML = selHtml + `<button type="button" class="kw-plus-btn" id="${elId}_plusbtn">+</button>`;
    chipsEl.querySelectorAll('.kw-tag-sel').forEach(tag=>{
      tag.addEventListener('click', ()=>{ selSet.delete(tag.dataset.kw); draw(); });
    });
    document.getElementById(elId+'_plusbtn').addEventListener('click', e=>{
      e.stopPropagation();
      if(popEl.classList.contains('open')) closePop(); else openPop();
    });
  }
  function drawPop(){
    const remaining = keywordStore[storeKey].filter(k=>!selSet.has(k));
    popEl.innerHTML = (remaining.length ? `<div class="kw-picker-flow">${remaining.map(k=>`<button type="button" class="kw-picker-chip" data-kw="${k}">${k}</button>`).join('')}</div>` : '<div class="kw-picker-empty">선택할 키워드가 없어요</div>')
      + `<div class="kw-picker-addrow">
          <input type="text" class="kw-picker-input" id="${elId}_newkw" placeholder="새 키워드">
          <button type="button" class="kw-picker-addbtn" id="${elId}_addkw">추가</button>
        </div>`;
    popEl.querySelectorAll('.kw-picker-chip').forEach(btn=>{
      btn.addEventListener('click', ()=>{ selSet.add(btn.dataset.kw); closePop(); draw(); });
    });
    popEl.querySelector('.kw-picker-addbtn').addEventListener('click', ()=>{
      const input = document.getElementById(elId+'_newkw');
      const v = input.value.trim();
      if(!v) return;
      if(!keywordStore[storeKey].includes(v)){ keywordStore[storeKey].push(v); saveKeywordStore(); }
      selSet.add(v);
      closePop(); draw();
    });
    popEl.querySelector('.kw-picker-input').addEventListener('keydown', e=>{
      if(e.key==='Enter'){ e.preventDefault(); popEl.querySelector('.kw-picker-addbtn').click(); }
    });
  }
  draw();
}

// ---------- Exam score table ----------
function buildExamScoreRows(){
  const groups = {};
  records.forEach(r=>{
    if(r.category!=='기출' || !r.year) return;
    const k = r.level+'|'+r.year;
    if(!groups[k]) groups[k] = { level:r.level, year:r.year, subjects:{} };
    if(!groups[k].subjects[r.subject]) groups[k].subjects[r.subject]=[];
    groups[k].subjects[r.subject].push(r);
  });
  return Object.values(groups).map(g=>{
    const points = LEVEL_POINTS[g.level];
    const subjScores = {};
    SUBJECTS.forEach(subj=>{
      const recs = g.subjects[subj];
      if(recs && recs.length){
        const avgCount = recs.reduce((s,r)=>s+(r.total-Object.keys(r.wrongs).length),0)/recs.length;
        subjScores[subj] = Math.round(avgCount*points*10)/10;
      } else subjScores[subj] = null;
    });
    const present = Object.values(subjScores).filter(v=>v!==null);
    const avgScore = present.length ? Math.round((present.reduce((a,b)=>a+b,0)/present.length)*10)/10 : null;
    return { level:g.level, year:g.year, subjScores, avgScore };
  }).sort((a,b)=>{
    const lvlRank = r=>r.level==='7급'?0:(r.level==='5급'?1:2);
    if(lvlRank(a)!==lvlRank(b)) return lvlRank(a)-lvlRank(b);
    return yearSortValue(a.year)-yearSortValue(b.year);
  });
}

function renderExamScoreTable(){
  const rows = buildExamScoreRows();
  document.getElementById('examScoreTbody').innerHTML = rows.map(r=>{
    const key = r.level+'|'+r.year;
    const cutoff = cutoffs[key];
    const subjCells = SUBJECTS.map(s=>r.subjScores[s]===null?'<td>-</td>':`<td>${r.subjScores[s]}</td>`).join('');
    let avgCellCls = '';
    if(r.avgScore!==null && cutoff!==undefined && cutoff!==null && cutoff!=='') avgCellCls = r.avgScore>=cutoff ? 'score-good':'score-bad';
    return `<tr class="clickable" data-level="${r.level}" data-year="${r.year}">
      <td><span class="chip-static ${levelChipClass(r.level)}">${r.level}</span></td>
      <td style="font-weight:800;">${r.year}</td>
      ${subjCells}
      <td><span class="${avgCellCls}" style="font-weight:800;">${r.avgScore===null?'-':r.avgScore}</span></td>
      <td><input type="text" inputmode="decimal" class="cutoff-input" data-key="${key}" value="${cutoff!==undefined?cutoff:''}" placeholder="-"></td>
    </tr>`;
  }).join('') || `<tr><td colspan="7" style="text-align:center;color:var(--ink-soft);">기출 기록이 없어요</td></tr>`;

  document.getElementById('examScoreTbody').querySelectorAll('.cutoff-input').forEach(inp=>{
    inp.addEventListener('click', e=>e.stopPropagation());
    inp.addEventListener('change', e=>{
      const key = inp.dataset.key;

      saveCutoffs(); renderExamScoreTable();

  });
  document.getElementById('examScoreTbody').querySelectorAll('tr.clickable').forEach(tr=>{
    tr.addEventListener('click', ()=>{
      openExamPopup(tr.dataset.level, tr.dataset.year);

  });

// ---------- Per-problem breakdown ----------
function buildAggregate(){
  const groups = {};
  records.forEach(r=>{
    const k = idKey(r);
    if(!groups[k]) groups[k] = { meta:r, list:[] };
    groups[k].list.push(r);
  });
  const rows = [];
  Object.values(groups).forEach(g=>{
    const idk = idKey(g.meta);
    const maxTotal = Math.max(...g.list.map(r=>r.total));
    for(let n=1; n<=maxTotal; n++){
      let attempts=0, wrongCount=0, maxTimeSec=null;
      const reasonKw=new Set(), typeKw=new Set(), choices=new Set();
      let lastCreated=0;
      g.list.forEach(r=>{
        if(n<=r.total){
          attempts++; lastCreated=Math.max(lastCreated,r.createdAt);
          if(r.wrongs[n]){
            wrongCount++;
            (r.wrongs[n].reasonKeywords||[]).forEach(k=>reasonKw.add(k));
            if(r.wrongs[n].selectedChoice) choices.add(r.wrongs[n].selectedChoice);
          }
          if(r.problemTypeKeywords[n]) r.problemTypeKeywords[n].forEach(k=>typeKw.add(k));
          if(r.problemTimeSpent && r.problemTimeSpent[n]){
            const secs = parseTimeToSeconds(r.problemTimeSpent[n]);
            if(secs!=null) maxTimeSec = maxTimeSec==null ? secs : Math.max(maxTimeSec, secs);
          }
        }
      });
      if(attempts===0) continue;
      rows.push({ idKeyStr:idk, level:g.meta.level, subject:g.meta.subject, label:testLabel(g.meta), num:n,
        attempts, wrongCount, accuracy:(attempts-wrongCount)/attempts,
        typeKw:[...typeKw], reasonKw:[...reasonKw], choices:[...choices], lastCreated, maxTimeSec });
    }
  });
  return rows;
}

// Notion-style "click to open a flow-wrapped dropdown below" keyword filter widget.
// getSel must return the CURRENT Set each call (never capture it), since some callers
// reassign their selected-set variable wholesale (e.g. applying a saved view).
function renderKwFilterBlock(chipsId, popId, storeKey, getSel, onChange){
  const chipsEl = document.getElementById(chipsId);
  const popEl = document.getElementById(popId);
  if(!chipsEl || !popEl) return;
  function drawChips(){
    const sel = getSel();
    const selHtml = [...sel].map(k=>`<span class="kw-tag-sel" data-kw="${k}">${k} ×</span>`).join('');
    chipsEl.innerHTML = selHtml + `<button type="button" class="kw-plus-btn">+</button>`;
    chipsEl.querySelectorAll('.kw-tag-sel').forEach(tag=>{
      tag.addEventListener('click', e=>{
        e.stopPropagation();
        getSel().delete(tag.dataset.kw);
        drawChips();
        if(popEl.classList.contains('open')) drawPop();
        onChange();
      });
    });
    chipsEl.querySelector('.kw-plus-btn').addEventListener('click', e=>{
      e.stopPropagation();
      if(popEl.classList.contains('open')){ popEl.classList.remove('open'); return; }
      document.querySelectorAll('.kw-picker-pop.open').forEach(p=>p.classList.remove('open'));
      drawPop();
      popEl.classList.add('open');
    });
  }
  function drawPop(){
    const sel = getSel();
    const all = keywordStore[storeKey];
    popEl.innerHTML = all.length
      ? `<div class="kw-picker-flow">${all.map(k=>`<button type="button" class="kw-picker-chip${sel.has(k)?' selected':''}" data-kw="${k}">${k}</button>`).join('')}</div>`
      : `<div class="kw-picker-empty">등록된 키워드가 없어요</div>`;
    popEl.querySelectorAll('.kw-picker-chip').forEach(btn=>{
      btn.addEventListener('click', e=>{
        e.stopPropagation();
        const k = btn.dataset.kw;
        const s = getSel();
        if(s.has(k)) s.delete(k); else s.add(k);
        btn.classList.toggle('selected');
        drawChips();
        onChange();
      });
    });
  }
  drawChips();
}

function renderAll(){
  renderExamScoreTable();

  const lvl = document.getElementById('filterLevel').value;
  const yr = document.getElementById('filterYear').value;
  const subj = document.getElementById('filterSubject').value;
  const corr = document.getElementById('filterCorrectness').value;
  const minTimeStr = document.getElementById('filterMinTime').value.trim();
  const minTimeSec = parseTimeToSeconds(minTimeStr);
  const sortMode = document.getElementById('filterSort').value;

  const rows = buildAggregate();
  let filtered = rows.filter(r=>{
    if(lvl!=='all' && r.level!==lvl) return false;
    if(yr!=='all' && String(r.label)!==yr) return false;
    if(subj!=='all' && r.subject!==subj) return false;
    if(corr==='wrong' && r.wrongCount===0) return false;
    if(corr==='correct' && r.wrongCount>0) return false;
    if(minTimeSec!=null && (r.maxTimeSec==null || r.maxTimeSec < minTimeSec)) return false;
    if(filterTypeKwSelected.size && !r.typeKw.some(k=>filterTypeKwSelected.has(k))) return false;
    if(filterReasonKwSelected.size && !r.reasonKw.some(k=>filterReasonKwSelected.has(k))) return false;
    return true;
  });
  filtered.sort((a,b)=>{
    if(sortMode==='acc_asc') return a.accuracy-b.accuracy;
    if(sortMode==='acc_desc') return b.accuracy-a.accuracy;
    if(sortMode==='attempts_desc') return b.attempts-a.attempts;
    if(sortMode==='recent') return b.lastCreated-a.lastCreated;
    return 0;
  });
  lastFilteredRows = filtered;

  document.getElementById('allEmpty').style.display = filtered.length ? 'none':'block';
  document.getElementById('allEmpty').textContent = '조건에 맞는 문제가 없어요.';
  document.getElementById('allTbody').innerHTML = filtered.map(r=>{
    const pct = Math.round(r.accuracy*100);
    const correctCnt = r.attempts-r.wrongCount;
    const typeTags = r.typeKw.map(k=>`<span class="kw-tag type">${k}</span>`).join('') || '-';
    const reasonTags = r.reasonKw.map(k=>`<span class="kw-tag">${k}</span>`).join('') || '-';
    const choiceTags = r.choices.length ? r.choices.join(', ') : '-';
    const opendetail = `${encodeURIComponent(r.idKeyStr)}::${r.num}::${encodeURIComponent(r.level)}::${encodeURIComponent(r.subject)}::${encodeURIComponent(String(r.label))}`;
    return `<tr>
      <td><span class="chip-static ${levelChipClass(r.level)}">${r.level}</span></td>
      <td><span class="chip-static c-subj-${r.subject}">${r.subject}</span></td>
      <td>${r.label}</td>
      <td style="font-weight:800;cursor:pointer;color:#2A558C;" data-opendetail="${opendetail}">#${r.num}</td>
      <td><span class="${accClass(pct)}" style="font-weight:800;">${correctCnt}/${r.attempts} (${pct}%)</span></td>
      <td>${choiceTags}</td>
      <td>${typeTags}</td>
      <td>${reasonTags}</td>
    </tr>`;
  }).join('');

  document.getElementById('allTbody').querySelectorAll('[data-opendetail]').forEach(td=>{
    td.addEventListener('click', ()=>{
      const parts = td.dataset.opendetail.split('::');
      const idk = decodeURIComponent(parts[0]);
      const num = parseInt(parts[1],10);
      const level = decodeURIComponent(parts[2]);
      const subject = decodeURIComponent(parts[3]);
      const label = decodeURIComponent(parts[4]);
      openProblemDetailPage(idk, num, level, subject, label);
    });
  });
}

const CIRCLED_DIGITS = {'1':'①','2':'②','3':'③','4':'④','5':'⑤','6':'⑥','7':'⑦','8':'⑧','9':'⑨'};
function toCircled(v){ return CIRCLED_DIGITS[String(v).trim()] || v; }
function getAnswer(idk, num){
  if(!answerKeyStore[idk]) answerKeyStore[idk] = {};
  if(answerKeyStore[idk][num]===undefined){
    answerKeyStore[idk][num] = '1';
    saveAnswerKeyStore();
  }
  return answerKeyStore[idk][num];
}
function aggWrongCount(idk, num){
  let count = 0;
  records.forEach(r=>{ if(idKey(r)===idk && num<=r.total && r.wrongs[num]) count++; });
  return count;
}
function buildAnswerKeyRows(){
  const seen = {};
  Object.keys(SEED_ANSWERS).forEach(level=>{
    Object.keys(SEED_ANSWERS[level]).forEach(yearKey=>{
      SUBJECTS.forEach(subj=>{
        if(!SEED_ANSWERS[level][yearKey][subj]) return;
        const idk = examIdKeyStr(level, subj, yearKey);
        seen[idk] = { level, subject:subj, year:yearKey, total: LEVEL_TOTAL[level], idk };
      });
    });
  });
  records.forEach(r=>{
    if(r.category!=='기출' || !r.year) return;
    const idk = examIdKeyStr(r.level, r.subject, r.year);
    if(!seen[idk]) seen[idk] = { level:r.level, subject:r.subject, year:r.year, total: LEVEL_TOTAL[r.level], idk };
  });
  return Object.values(seen).sort((a,b)=>{
    const lvlRank = x=>x.level==='민경채'?0:(x.level==='7급'?1:2);
    if(lvlRank(a)!==lvlRank(b)) return lvlRank(a)-lvlRank(b);
    const av=yearSortValue(a.year), bv=yearSortValue(b.year);
    if(av!==bv) return av-bv;
    return SUBJECTS.indexOf(a.subject)-SUBJECTS.indexOf(b.subject);
  });
}
function renderAkeyYearOptions(){
  const sel = document.getElementById('akeyFilterYear');
  const cur = sel.value;
  const years = [...new Set(buildAnswerKeyRows().map(r=>String(r.year)))].sort((a,b)=>yearSortValue(a)-yearSortValue(b));
  sel.innerHTML = '<option value="all">연도 전체</option>' + years.map(y=>`<option value="${y}">${y}</option>`).join('');
  if(years.includes(cur)) sel.value = cur;
}

function renderAnswerKeyTab(){
  renderAkeyYearOptions();
  const lvl = document.getElementById('akeyFilterLevel').value;
  const subj = document.getElementById('akeyFilterSubject').value;
  const yr = document.getElementById('akeyFilterYear').value;
  const rows = buildAnswerKeyRows().filter(r=>{
    if(lvl!=='all' && r.level!==lvl) return false;
    if(subj!=='all' && r.subject!==subj) return false;
    if(yr!=='all' && String(r.year)!==yr) return false;
    return true;
  });
  document.getElementById('answerKeyEmpty').style.display = rows.length ? 'none':'block';
  document.getElementById('answerKeyList').innerHTML = rows.map(row=>{
    let header='', cells='';
    for(let n=1;n<=row.total;n++){
      const val = getAnswer(row.idk, n);
      const cnt = aggWrongCount(row.idk, n);
      const alpha = Math.min(cnt*0.2,1);
      const style = cnt>0 ? `style="background:rgba(226,120,100,${alpha});"` : '';
      header += `<div class="head-cell" data-num="${n}">${n}</div>`;
      cells += `<div class="akey-cell" ${style} data-idk="${row.idk}" data-num="${n}" data-level="${row.level}" data-subject="${row.subject}" data-year="${row.year}">${toCircled(val)}</div>`;
    }
    return `<div class="test-card compact">
      <div class="test-side" data-idk="${row.idk}" data-level="${row.level}" data-subject="${row.subject}" data-year="${row.year}">
        <span class="chip-static ${levelChipClass(row.level)}">${row.level}</span>
        <span class="akey-year-text">${row.year}</span>
        <span class="akey-subject-text">${row.subject}</span>
      </div>
      <div class="test-main"><div class="grid-row-block"><div class="num-header">${header}</div><div class="cell-grid">${cells}</div></div></div>
    </div>`;
  }).join('');
}
['akeyFilterLevel','akeyFilterSubject','akeyFilterYear'].forEach(id=>{
  document.getElementById(id).addEventListener('change', renderAnswerKeyTab);
});

document.getElementById('answerKeyList').addEventListener('click', e=>{
  const side = e.target.closest('.test-side');
  if(side && side.dataset.idk){
    openAnswerKeyNotePop(side.dataset.idk, side.dataset.level, side.dataset.subject, side.dataset.year);
    return;
  }
  const cell = e.target.closest('.akey-cell');
  if(!cell || !cell.dataset.idk) return;
  openProblemDetailPage(cell.dataset.idk, parseInt(cell.dataset.num,10), cell.dataset.level, cell.dataset.subject, cell.dataset.year);
});

function openProblemDetailPage(idk, num, level, subject, label){
  const cur = getAnswer(idk, num);
  const note = getNote(idk, num);
  const reasonKw = new Set(), typeKw = new Set();
  const attemptRecs = [];
  let attempts=0, wrongCount=0;
  records.forEach(r=>{
    if(idKey(r)===idk && num<=r.total){
      attempts++;
      attemptRecs.push(r);
      if(r.wrongs[num]){
        wrongCount++;
        (r.wrongs[num].reasonKeywords||[]).forEach(k=>reasonKw.add(k));
      }
      if(r.problemTypeKeywords[num]) r.problemTypeKeywords[num].forEach(k=>typeKw.add(k));
    }
  });
  attemptRecs.sort((a,b)=>a.createdAt-b.createdAt);
  const tagsHtml = (set, cls)=> set.size ? [...set].map(k=>`<span class="kw-tag ${cls}">${k}</span>`).join('') : '<span style="color:var(--ink-soft);font-size:12.5px;">없음</span>';

  const historyHtml = attemptRecs.map(r=>{
    const isWrong = !!r.wrongs[num];
    const val = isWrong ? (r.wrongs[num].selectedChoice || '?') : cur;
    return `<span class="np-att-hist ${isWrong?'att-wrong':'att-correct'}">${toCircled(val)}</span>`;
  }).join('') || '';

  const typeKwSelSet = new Set(typeKw);

  const attemptKwSelSets = {};
  const choiceRowsHtml = attemptRecs.length ? attemptRecs.map(r=>{
    const isWrong = !!r.wrongs[num];
    const w = isWrong ? r.wrongs[num] : null;
    const timeVal = (r.problemTimeSpent && r.problemTimeSpent[num]) || '';
    const existingKw = isWrong ? (w.reasonKeywords||[]) : ((r.noteKeywords && r.noteKeywords[num]) || []);
    attemptKwSelSets[r.id] = new Set(existingKw);
    return `<div class="np-attempt-row" data-rowrecid="${r.id}">
      <span class="np-round-label">${r.round||1}회독</span>
      <input type="text" class="att-choice-input" data-choicerecid="${r.id}" value="${w ? (w.selectedChoice||'') : ''}" placeholder="?">
      <input type="text" class="np-time-input" data-timerecid="${r.id}" value="${timeVal}" placeholder="00:00">
      <textarea class="np-attempt-reason" data-recid="${r.id}" rows="1" placeholder="메모">${w ? (w.reasonText||'') : ((r.notes && r.notes[num]) || '')}</textarea>
      <div class="np-attempt-kw">${keywordSelectorHtml('attKw'+r.id)}</div>
    </div>`;
  }).join('') : '<span style="color:var(--ink-soft);font-size:12.5px;">없음</span>';

  const CHOICE_NUMS = [1,2,3,4,5];
  const choiceData = note.choiceAnalysis || {};
  const hasChoiceData = CHOICE_NUMS.some(n => choiceData[n] && (choiceData[n].text || (choiceData[n].kw && choiceData[n].kw.length)));
  const choiceSelSets = {};
  CHOICE_NUMS.forEach(n=>{ choiceSelSets[n] = new Set((choiceData[n] && choiceData[n].kw) || []); });
  const choiceRowsForAnalysis = CHOICE_NUMS.map(n=>{
    const cd = choiceData[n] || {text:''};
    return `<div class="np-choice-row">
      <div class="np-choice-head"><span class="choice-num">${toCircled(n)}</span></div>
      <div class="np-choice-body">
        ${keywordSelectorHtml('choiceKwSel'+n)}
        <input type="text" class="np-choice-text" id="choiceText${n}" value="${cd.text||''}" placeholder="이 선지 분석">
      </div>
    </div>`;
  }).join('');

  const box = document.getElementById('detailBox');
  const alreadyFlagged = reviewBox.some(e=>e.idKeyStr===idk && e.num===num);

  box.innerHTML = `
    <div class="np-header">
      <div style="display:flex;align-items:baseline;gap:8px;">
        <div class="np-title">${num}번</div>
        <div class="np-sub" style="margin-top:0;">${level} · ${subject} · ${label}</div>
      </div>
      <div class="np-header-actions">
        <button type="button" class="np-pin-btn${alreadyFlagged?' pinned':''}" id="npAddReviewBtn" title="보충학습에 담기">${PIN_ICON}</button>
        <button type="button" class="np-close" id="detailCloseBtn">×</button>
      </div>
    </div>
    <div class="np-body">
      <div class="np-row"><div class="np-label">정답</div><div class="np-value"><input type="text" id="npAnswerVal" class="np-answer-mini" value="${cur}"><span class="np-attempt-history">${historyHtml}</span></div></div>
      <div class="np-row"><div class="np-label">회차별 기록</div><div class="np-value">${choiceRowsHtml}</div></div>
      <div class="np-row"><div class="np-label">유형 키워드</div><div class="np-value">${keywordSelectorHtml('typeKwSelDetail')}</div></div>
      <div class="np-row"><div class="np-label">분석 노트</div><div class="np-value"><textarea id="npAnalysis" rows="3">${note.analysis||''}</textarea></div></div>
      <div class="np-row"><div class="np-label">참고 이론</div><div class="np-value"><textarea id="npTheory" rows="3">${note.theory||''}</textarea></div></div>
      <div class="np-row">
        <div class="np-label">선지분석</div>
        <div class="np-value">
          <button type="button" class="btn btn-plain btn-small" id="choiceToggleBtn" style="display:${hasChoiceData?'none':'inline-block'};">+ 선지분석 추가하기</button>
          <div id="choiceBlock" style="display:${hasChoiceData?'block':'none'};margin-top:10px;">${choiceRowsForAnalysis}</div>
        </div>
      </div>
      <div class="np-row" style="border-bottom:none;justify-content:flex-end;">
        <button type="button" class="btn btn-primary" id="npSaveBtn">저장</button>
      </div>
    </div>
  `;
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailCloseBtn').addEventListener('click', ()=>{
    document.getElementById('detailOverlay').classList.remove('open');
  });
  document.getElementById('npAddReviewBtn').addEventListener('click', ()=>{
    const btn = document.getElementById('npAddReviewBtn');
    const existing = reviewBox.find(e=>e.idKeyStr===idk && e.num===num);
    if(existing){
      reviewBox = reviewBox.filter(e=>e.id!==existing.id);
      saveReview();
      btn.classList.remove('pinned');
    } else {
      reviewBox.push({ id:uid('v'), idKeyStr:idk, level, subject, label, num, addedAt:Date.now() });
      saveReview();
      btn.classList.add('pinned');
    }
  });
  document.getElementById('choiceToggleBtn').addEventListener('click', ()=>{
    document.getElementById('choiceBlock').style.display = 'block';
    document.getElementById('choiceToggleBtn').style.display = 'none';
  });
  CHOICE_NUMS.forEach(n=>{ wireKeywordSelector('choiceKwSel'+n, 'choice', choiceSelSets[n]); });
  wireKeywordSelector('typeKwSelDetail', 'type', typeKwSelSet);
  attemptRecs.forEach(r=>{ wireKeywordSelector('attKw'+r.id, 'reason', attemptKwSelSets[r.id]); });
  ['npAnalysis','npTheory'].forEach(id=>{
    const ta = document.getElementById(id);
    const grow = ()=>{ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; };
    ta.addEventListener('input', grow);
    grow();
  });
  function doSave(closeAfter){
    const v = document.getElementById('npAnswerVal').value.trim();
    if(v){
      if(!answerKeyStore[idk]) answerKeyStore[idk]={};
      answerKeyStore[idk][num] = v;
      saveAnswerKeyStore();
    }
    document.querySelectorAll('.np-attempt-row[data-rowrecid]').forEach(row=>{
      const rec = records.find(r=>r.id===row.dataset.rowrecid);
      if(!rec) return;
      const choiceVal = row.querySelector('.att-choice-input').value.trim();
      const reasonVal = row.querySelector('.np-attempt-reason').value.trim();
      const kwSet = attemptKwSelSets[rec.id];
      const kwArr = kwSet ? [...kwSet] : [];
      if(choiceVal){
        rec.wrongs[num] = { selectedChoice: choiceVal, reasonText: reasonVal, reasonKeywords: kwArr };
        if(rec.notes) delete rec.notes[num];
        if(rec.noteKeywords) delete rec.noteKeywords[num];
      } else {
        delete rec.wrongs[num];
        if(!rec.notes) rec.notes = {};
        if(reasonVal) rec.notes[num] = reasonVal; else delete rec.notes[num];
        if(!rec.noteKeywords) rec.noteKeywords = {};
        if(kwArr.length) rec.noteKeywords[num] = kwArr; else delete rec.noteKeywords[num];
      }
    });
    document.querySelectorAll('.np-time-input').forEach(inp=>{
      const rec = records.find(r=>r.id===inp.dataset.timerecid);
      if(rec){
        if(!rec.problemTimeSpent) rec.problemTimeSpent = {};
        const tv = inp.value.trim();
        if(tv) rec.problemTimeSpent[num] = tv; else delete rec.problemTimeSpent[num];
      }
    });
    attemptRecs.forEach(r=>{ r.problemTypeKeywords[num] = [...typeKwSelSet]; });
    save();
    const analysis = document.getElementById('npAnalysis').value.trim();
    const theory = document.getElementById('npTheory').value.trim();
    const choiceAnalysis = {};
    CHOICE_NUMS.forEach(n=>{
      const text = document.getElementById('choiceText'+n).value.trim();
      const kw = [...choiceSelSets[n]];
      if(text || kw.length) choiceAnalysis[n] = { text, kw };
    });
    saveNote(idk, num, {analysis, theory, choiceAnalysis});
    if(closeAfter) document.getElementById('detailOverlay').classList.remove('open');
    if(document.getElementById('panel-answerkey').classList.contains('active')) renderAnswerKeyTab();
    if(document.getElementById('panel-all').classList.contains('active')) renderAll();
    if(document.getElementById('panel-tests').classList.contains('active')) renderTests();
    if(document.getElementById('panel-review').classList.contains('active')) renderReview();
  }
  // Enter saves on the single-line fields (답안·시간). 오답이유 is a textarea now,
  // so Enter there just inserts a line break like normal, not a save trigger.
  document.querySelectorAll('.att-choice-input, .np-time-input').forEach(inp=>{
    // use keyup (not keydown) so a single Enter that also confirms Korean IME
    // composition still triggers save — on keydown, e.key reports 'Process'
    // (not 'Enter') while composing, so a keydown check silently misses it.
    inp.addEventListener('keyup', e=>{
      if(e.key==='Enter' && !e.isComposing){ doSave(false); }
    });
    inp.addEventListener('keydown', e=>{
      if(e.key==='Enter') e.preventDefault();
    });
  });
  document.querySelectorAll('.np-attempt-reason').forEach(ta=>{
    const grow = ()=>{ ta.style.height='auto'; ta.style.height=(ta.scrollHeight+2)+'px'; };
    ta.addEventListener('input', grow);
    grow();
  });
  document.getElementById('npSaveBtn').addEventListener('click', ()=>doSave(true));
}
document.getElementById('detailOverlay').addEventListener('click', e=>{
  if(e.target.id==='detailOverlay') e.currentTarget.classList.remove('open');
});


// ---------- Review box ----------
let reviewFilterTypeKwSelected = new Set();
let reviewFilterReasonKwSelected = new Set();
['reviewFilterLevel','reviewFilterSubject'].forEach(id=>{
  document.getElementById(id).addEventListener('change', renderReview);
});
function renderReview(){
  renderKwFilterBlock('reviewFilterTypeKwArea','reviewFilterTypeKwPop','type', ()=>reviewFilterTypeKwSelected, renderReview);
  renderKwFilterBlock('reviewFilterReasonKwArea','reviewFilterReasonKwPop','reason', ()=>reviewFilterReasonKwSelected, renderReview);
  const lvlF = document.getElementById('reviewFilterLevel').value;
  const subjF = document.getElementById('reviewFilterSubject').value;
  const enriched = reviewBox.map(entry=>{
    let reasonText='', reasonKeywords=[], typeKw=[];
    records.filter(r=>idKey(r)===entry.idKeyStr && entry.num<=r.total).forEach(r=>{
      if(r.wrongs[entry.num]){
        if(r.wrongs[entry.num].reasonText) reasonText = r.wrongs[entry.num].reasonText;
        reasonKeywords = [...new Set([...reasonKeywords, ...(r.wrongs[entry.num].reasonKeywords||[])])];
      }
      if(r.problemTypeKeywords[entry.num]) typeKw = [...new Set([...typeKw, ...r.problemTypeKeywords[entry.num]])];
    });
    return { entry, reasonText, reasonKeywords, typeKw };
  }).filter(x=>{
    if(lvlF!=='all' && x.entry.level!==lvlF) return false;
    if(subjF!=='all' && x.entry.subject!==subjF) return false;
    if(reviewFilterTypeKwSelected.size && !x.typeKw.some(k=>reviewFilterTypeKwSelected.has(k))) return false;
    if(reviewFilterReasonKwSelected.size && !x.reasonKeywords.some(k=>reviewFilterReasonKwSelected.has(k))) return false;
    return true;
  });
  document.getElementById('reviewEmpty').style.display = enriched.length ? 'none':'block';
  const sorted = enriched.sort((a,b)=>b.entry.addedAt-a.entry.addedAt);
  document.getElementById('reviewTbody').innerHTML = sorted.map(({entry, reasonText, reasonKeywords, typeKw})=>{
    const marks = entry.marks || [false,false,false];
    const marksHtml = marks.map(m=>`<span class="review-mark ${m?'filled':''}"></span>`).join('');
    return `<tr>
      <td class="col-tight"><span class="chip-static ${levelChipClass(entry.level)}">${entry.level}</span></td>
      <td class="col-tight"><span class="chip-static c-subj-${entry.subject}">${entry.subject}</span></td>
      <td class="col-tight">${entry.label}</td>
      <td class="col-tight" style="font-weight:800;cursor:pointer;color:#2A558C;" data-opendetail="${encodeURIComponent(entry.idKeyStr)}::${entry.num}::${encodeURIComponent(entry.level)}::${encodeURIComponent(entry.subject)}::${encodeURIComponent(String(entry.label))}">#${entry.num}</td>
      <td>${reasonText || '-'}${reasonKeywords.length?'<br>'+reasonKeywords.map(k=>`<span class="kw-tag">${k}</span>`).join(''):''}</td>
      <td>${typeKw.length?typeKw.map(k=>`<span class="kw-tag type">${k}</span>`).join(''):'-'}</td>
      <td><span class="review-marks-area" data-rid="${entry.id}">${marksHtml}</span></td>
      <td><button class="btn-danger-text" data-rmreview="${entry.id}">빼기</button></td>
    </tr>`;
  }).join('');
  document.getElementById('reviewTbody').querySelectorAll('.review-marks-area').forEach(area=>{
    area.addEventListener('click', ()=>{
      const entry = reviewBox.find(e=>e.id===area.dataset.rid);
      if(!entry) return;
      if(!entry.marks) entry.marks = [false,false,false];
      const idx = entry.marks.findIndex(m=>!m);
      if(idx!==-1) entry.marks[idx] = true;
      saveReview(); renderReview();
    });
    area.addEventListener('contextmenu', e=>{
      e.preventDefault();
      const entry = reviewBox.find(x=>x.id===area.dataset.rid);
      if(!entry) return;
      if(!entry.marks) entry.marks = [false,false,false];
      for(let i=entry.marks.length-1;i>=0;i--){
        if(entry.marks[i]){ entry.marks[i]=false; break; }
      }
      saveReview(); renderReview();
    });
  });
  document.getElementById('reviewTbody').querySelectorAll('[data-opendetail]').forEach(td=>{
    td.addEventListener('click', ()=>{
      const parts = td.dataset.opendetail.split('::');
      const idk = decodeURIComponent(parts[0]);
      const num = parseInt(parts[1],10);
      const level = decodeURIComponent(parts[2]);
      const subject = decodeURIComponent(parts[3]);
      const label = decodeURIComponent(parts[4]);
      openProblemDetailPage(idk, num, level, subject, label);
    });
  });
  document.getElementById('reviewTbody').querySelectorAll('[data-rmreview]').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      reviewBox = reviewBox.filter(e=>e.id!==btn.dataset.rmreview);
      saveReview(); renderReview();
    });

  });
}

// init
renderDateChips();
const savedTab = localStorage.getItem(ACTIVE_TAB_KEY);
if(savedTab && document.querySelector(`.tab-btn[data-tab="${savedTab}"]`)){
  activateTab(savedTab);
} else {
  renderTests();
}

// ---------- Report our own content height to the parent page (when embedded
// as an iframe), so the iframe can grow to fit us instead of boxing us in
// with its own internal scrollbar — long modals, grids, etc. should just
// extend the outer page like any other section of it.
(function(){
  if(window.parent === window) return; // not embedded, nothing to do
  let lastH = 0;
  function reportHeight(){
    const h = Math.max(document.documentElement.scrollHeight, document.body.scrollHeight);
    if(h !== lastH){
      lastH = h;
      window.parent.postMessage({ type:'psatHeight', height:h }, '*');
    }
  }
  reportHeight();
  setInterval(reportHeight, 300);
  window.addEventListener('resize', reportHeight);
  if(window.ResizeObserver){
    new ResizeObserver(reportHeight).observe(document.body);
  }
})();
</script>
