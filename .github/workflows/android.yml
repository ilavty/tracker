name: 캠스터디 안드로이드 앱 만들기

on:
  workflow_dispatch:
  push:
    paths:
      - 'camstudy-m.html'
      - 'android-app/**'
      - '.github/workflows/android.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: APK 만들기
        run: bash android-app/build.sh
      - name: 릴리스에 올리기
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete android-latest -y --cleanup-tag || true
          gh release create android-latest "/tmp/capapp/android/app/build/outputs/apk/debug/app-debug.apk#camstudy.apk" \
            --title "캠스터디 안드로이드 앱" --notes "최신 앱 파일입니다. camstudy.apk 를 받아 설치하세요." --latest=false
