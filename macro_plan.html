<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ROADMAP</title>
<style>
@font-face { font-family: 'GmkC'; font-weight: 300; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-3Light.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 400; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-4Regular.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 500; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-5Medium.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 600; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-6SemiBold.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 700; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-7Bold.woff2') format('woff2'); }
@font-face { font-family: 'GmkC'; font-weight: 800; font-display: swap; src: url('https://cdn.jsdelivr.net/gh/projectnoonnu/2408-3@1.0/Paperlogy-8ExtraBold.woff2') format('woff2'); }
:root{
  --bg:#fcfbfa; --line:#222; --bd:#e2e5ea; --soft:#f4f5f7; --txt:#23272e; --sub:#6b7480; --grey:#7c90a6;
  --P:#6fa58f; --S:#8fb0e0;
}
*{box-sizing:border-box;margin:0;padding:0}
::-webkit-scrollbar{display:none!important} *{scrollbar-width:none!important}
html,body{background:var(--bg)}
html.emb,html.emb body{background:transparent}
html.emb .cwdr{background:rgba(252,251,250,.82);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
body{font-family:'GmkC',sans-serif;font-weight:400;color:var(--txt);font-size:14px;line-height:1.45;padding:18px 16px 60px;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit}
button{cursor:pointer;border:none;background:none}

/* top */
.top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;max-width:1500px;margin:0 auto 12px;padding-right:96px;min-height:34px}
.brand{font-weight:800;font-size:1.35rem;letter-spacing:.06em;color:var(--line);margin-right:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:20px;overflow:hidden;background:#fff}
.seg button{padding:5px 14px;font-weight:600;font-size:.85rem;color:var(--sub)}
.seg button.on{background:var(--line);color:#fff}
.pill{font-size:.82rem;font-weight:600;padding:5px 12px;border-radius:20px;border:1px solid var(--bd);background:#fff;color:var(--txt);white-space:nowrap}
.pill:hover{border-color:var(--line)}
.pill.on{border-color:var(--line);background:var(--line);color:#fff}
.sp{flex:1}
.stats{display:flex;gap:6px;flex-wrap:wrap;max-width:1500px;margin:0 auto 14px}
.st{font-size:.8rem;padding:4px 11px;border-radius:14px;background:var(--soft);color:var(--txt);font-weight:500}
.st b{font-weight:800}
.st.dd{background:#fff;border:1px solid var(--line);cursor:pointer}

/* month view */
.mv{max-width:1500px;margin:0 auto;overflow-x:auto;border:1px solid var(--bd);border-radius:12px;background:#fff}
.mvin{position:relative}
.mrow{display:flex;border-bottom:1px solid var(--bd)}
.mrow:last-child{border-bottom:none}
.mlab{position:sticky;left:0;z-index:6;flex:none;background:var(--bg);border-right:1px solid var(--bd);padding:8px 10px;font-size:.82rem;font-weight:600;display:flex;align-items:flex-start;gap:6px}
.mlab.grp{font-weight:800}
.mlab i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-top:4px;flex:none}
.mtrack{position:relative;flex:none}
.mh .mtrack{height:24px}
.mcell{position:absolute;top:0;height:24px;border-left:1px solid var(--bd);padding:3px 6px;font-size:.78rem;font-weight:700;white-space:nowrap;overflow:hidden}
.mk .mtrack{height:22px}
.mkb{position:absolute;top:2px;font-size:.7rem;font-weight:700;padding:1px 7px;border-radius:9px;background:#fff;border:1px solid var(--line);white-space:nowrap;cursor:pointer;z-index:4}
.mkb.today{background:var(--line);color:#fff;cursor:default}
.ph{position:absolute;top:3px;height:28px;border-radius:6px;font-size:.74rem;font-weight:600;padding:5px 8px;white-space:nowrap;overflow:hidden;cursor:pointer;border:1px solid rgba(0,0,0,.08)}
.vl{position:absolute;top:0;bottom:0;width:0;z-index:2;pointer-events:none;border-left:1px dashed #c9ccd1}
.vl.today{border-left:2px solid rgba(0,0,0,.55);z-index:4}
.vl.exam{border-left:2px solid var(--line);z-index:4}
.blk{position:absolute;height:26px;border-radius:6px;z-index:3;cursor:pointer;display:flex;align-items:center;gap:5px;padding:0 7px;font-size:.76rem;font-weight:600;overflow:hidden;white-space:nowrap}
.blk .nm{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.ghost{position:absolute;height:5px;border-radius:3px;z-index:2;pointer-events:none}
.must{font-size:.62rem;font-weight:800;border-radius:4px;padding:0 4px;line-height:13px;flex:none}
.dl{font-size:.64rem;font-weight:700;background:rgba(255,255,255,.85);color:#222;border-radius:8px;padding:0 5px;line-height:15px;flex:none;border:1px solid rgba(0,0,0,.15)}
.dl.od{background:#f3e7de;color:#7a4a2a}

/* calendar */
\.mgl{display:flex;flex-direction:column;gap:3px;padding:6px 0 2px}
.gi{display:flex;align-items:center;gap:8px;font-size:.85rem;font-weight:500;margin:7px 0}
.gc{flex:none;width:15px;height:15px;border-radius:50%;border:1.5px solid #8fa6c9;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;font-size:.6rem;color:#fff}
.gc.on{background:#8fa6c9}
.gt{outline:none;min-width:40px;flex:1;line-height:1.6;word-break:break-word}
.gi.dn .gt{text-decoration:line-through;opacity:.5}
.gadd{align-self:flex-start;width:18px;height:18px;border-radius:50%;border:1px dashed #b9c4d8;color:#8fa6c9;font-size:.8rem;line-height:1;display:flex;align-items:center;justify-content:center;cursor:pointer;background:none;padding:0}
.vmh{display:flex;align-items:center;gap:8px;padding:2px 0;flex-wrap:wrap}
.vmt{font-size:1.55rem;font-weight:800;line-height:1}
.vy{font-size:.78rem;color:var(--sub);font-weight:600}
.vpill{font-size:.7rem;font-weight:600;padding:2px 9px;border-radius:10px;border:1px solid rgba(0,0,0,.08)}
.cv{max-width:1320px;margin:0 auto;padding-left:100px}
#rail{position:fixed;left:6px;top:132px;z-index:20;width:92px;touch-action:none;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;cursor:grab}
#rail .rl{position:absolute;left:10px;top:0;bottom:0;width:1.5px;background:#c3c7ce;border-radius:1px}
#rail .tk{position:absolute;left:10px;height:1px;background:#c3c7ce}
#rail .tk.mo{background:#111}
#rail .lb{position:absolute;transform:translateY(-50%);font-weight:700;letter-spacing:.08em;color:#8fa6c9;white-space:nowrap;line-height:1}
#rail .lb.on{color:#2f4a7a}
.mlx{font-size:17px;font-weight:600;line-height:1;color:#8fa6c9;white-space:nowrap;margin-right:6px}
.mlx.on{color:#2f4a7a}
.cgrid{display:grid;grid-template-columns:minmax(0,1fr) 250px;column-gap:0}
.wl{grid-column:1;margin-right:0}
.pv{z-index:3;margin-top:3px;margin-bottom:3px;border-radius:9px;cursor:pointer;display:flex;align-items:center;justify-content:center;overflow:hidden;border:1px solid rgba(47,74,122,.18)}
.pv span{writing-mode:vertical-rl;font-size:.66rem;font-weight:700;color:#3d4a63;white-space:nowrap;letter-spacing:.02em}
.wslot{grid-column:3;position:relative;z-index:1;border-left:1px solid var(--bd);margin-left:0}
.wsi{position:absolute;inset:0;overflow-y:auto;padding:4px 0 4px 10px;scrollbar-width:none}
.wsi::-webkit-scrollbar{display:none}
.wslot .gadd{opacity:0;position:absolute;right:4px;top:4px}
.wslot:hover .gadd{opacity:1}
.msec{grid-column:3;position:relative;z-index:2;pointer-events:none;contain:size;border-top:1px solid #c9d2e3}
.msi{padding:6px 0 0 10px;pointer-events:none}
.msi .mgl,.msi .gi,.msi .gadd{pointer-events:auto}
.msi .mgl{max-width:100%}
.cwdr{position:sticky;top:0;z-index:9;background:var(--bg)}
#rail .th{position:absolute;left:10px;width:13px;height:13px;margin:-6.5px 0 0 -6px;border-radius:50%;background:#111;border:2.5px solid #fff;box-shadow:0 0 0 1.5px #111}
#rail.hide{display:none}
.cwr{display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:14px;align-items:stretch}
.wm{outline:none;white-space:pre-wrap;word-break:break-word;font-size:.85rem;line-height:1.6;padding:5px 6px 5px 12px;border-left:1.5px solid var(--bd);min-height:84px;border-radius:0 6px 6px 0}
.wm:focus,.wm:hover{background:rgba(0,0,0,.025)}
.cyr{display:flex;align-items:center;gap:12px;margin:26px 0 4px;font-size:1.05rem;font-weight:800;letter-spacing:.08em;color:var(--sub)}
.cyr:before,.cyr:after{content:"";flex:1;height:1px;background:var(--bd)}
.cwd{display:grid;grid-template-columns:repeat(7,1fr);font-size:.7rem;font-weight:700;color:var(--sub);text-align:center;padding:8px 0 4px}
.cwk{position:relative;overflow:visible}
.cbg{position:absolute;inset:0;z-index:0;display:grid;grid-template-columns:repeat(7,1fr)}
.cd.gb{margin-bottom:12px}
.cd.gr{margin-right:12px}
.cd{background:#fff;border-radius:11px;margin:4px;position:relative;box-shadow:0 1px 2px rgba(60,70,90,.07)}

.dnum .m1{color:#2f4a7a;font-weight:700}
.cd.out{background:transparent}
.cd.today{box-shadow:0 0 9px 1px rgba(100,170,235,.5);z-index:1}
.cd .plus{position:absolute;right:4px;top:2px;font-size:.95rem;line-height:1;color:var(--sub);opacity:0;cursor:pointer;padding:0 3px;z-index:1}
.cd:hover .plus{opacity:.9}
.cfg{position:relative;z-index:1;display:grid;grid-template-columns:repeat(7,1fr);align-content:start;min-height:84px;pointer-events:none}
.dnum{padding:6px 11px 2px;font-size:.72rem;font-weight:600;color:var(--sub);display:flex;align-items:center;gap:4px;min-height:21px;pointer-events:none}
.dnum .td{background:#6bb5f2;color:#fff;border-radius:50%;min-width:19px;height:19px;display:inline-flex;align-items:center;justify-content:center;font-weight:700}
.xm{font-style:normal;font-size:.6rem;font-weight:800;background:var(--line);color:#fff;border-radius:7px;padding:0 6px;line-height:15px}
.cbar{pointer-events:auto;display:flex;align-items:center;gap:4px;padding:0 6px;font-size:.68rem;font-weight:600;overflow:hidden;white-space:nowrap;margin:1px 4px;position:relative;cursor:pointer;height:20px}
.rz{position:absolute;right:0;top:0;bottom:0;width:9px;cursor:ew-resize}
.rz:after{content:"";position:absolute;right:3px;top:5px;bottom:5px;width:2px;border-radius:1px;background:rgba(0,0,0,.28)}
.cbar.dn .nm{text-decoration:line-through;opacity:.6}
.ckc{flex:none;width:12px;height:12px;border-radius:50%;border:1.5px solid rgba(0,0,0,.35);display:inline-flex;align-items:center;justify-content:center;font-size:.55rem;line-height:1;cursor:pointer;background:rgba(255,255,255,.6)}
.ckc.on{background:rgba(0,0,0,.45);border-color:rgba(0,0,0,.45);color:#fff}
.cph{pointer-events:auto;margin:1px 2px 2px;border-radius:5px;font-size:.62rem;font-weight:700;color:#4a4f57;padding:0 6px;overflow:hidden;white-space:nowrap;cursor:pointer;line-height:14px;height:14px}
.tl{position:absolute;bottom:0;left:0;right:0;height:0;border-top:2px solid #e5484d;z-index:5;pointer-events:none}
.cbar .nm{overflow:hidden;text-overflow:ellipsis;min-width:0}
.cd.sel{background-color:#dcebfd!important}
.cp .lk{flex:none;width:8px;height:8px;border-radius:50%;box-shadow:0 0 0 1.5px #fff}
.cbar.lnk:after{content:"";position:absolute;right:3px;top:3px;width:6px;height:6px;border-radius:50%;background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,.3)}
.cbar.dg{z-index:30;pointer-events:none;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.cbar.hit{outline:2px solid #4fa8f0}
.cfg .cp.in{position:relative;pointer-events:auto;align-self:start;margin:0 6px;z-index:7}
.cfg .cp{pointer-events:auto}
.cp.drag{opacity:.85;z-index:30;pointer-events:none;box-shadow:0 8px 22px rgba(0,0,0,.25)}
.cp{cursor:grab;--bc:#e9e9eb;position:absolute;z-index:6;width:max-content;max-width:230px;display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:14px;font-size:.76rem;line-height:1.4;background:var(--bc);color:#222;box-shadow:0 2px 8px rgba(0,0,0,.14)}
.cp:after{content:"";position:absolute;bottom:-7px;left:14px;border:7px solid transparent;border-top-color:var(--bc);border-bottom:0}
.cp.r:after{left:auto;right:14px}
.cp.pay{--bc:#a9d3f5;color:#1d3345}
.cp.sched{--bc:#f2c16b;color:#3a2a05}
.cp.memo{--bc:#ececee;color:#222}
.cp:hover{z-index:7}
.rnote{outline:none;min-width:12px;word-break:break-word}
.bmore{opacity:0;font-size:.72rem;color:inherit;padding:0 2px;line-height:1}
.cp:hover .bmore{opacity:.7}
/* modal */
#modal{position:fixed;inset:0;background:rgba(20,20,20,.38);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#modal.on{display:flex}
.mbox{background:#fff;border-radius:14px;width:min(440px,100%);max-height:92vh;overflow-y:auto;padding:18px 20px 16px;box-shadow:0 12px 40px rgba(0,0,0,.2)}
.mbox h3{font-size:1rem;font-weight:800;margin-bottom:10px}
.mbox label{display:block;font-size:.72rem;font-weight:700;color:var(--sub);margin:10px 0 4px}
.mbox input[type=text],.mbox input[type=date],.mbox select{width:100%;padding:7px 9px;border:1px solid var(--bd);border-radius:8px;background:#fff}
.mbox input:focus,.mbox select:focus{outline:none;border-color:var(--line)}
.mbox .two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;gap:5px;flex-wrap:wrap}
.chips button{padding:5px 12px;border:1px solid var(--bd);border-radius:16px;font-size:.8rem;font-weight:600;background:#fff}
.chips button.on{border-color:var(--line);background:var(--line);color:#fff}
.mbox input[type=range]{width:100%;accent-color:#222}
.ck{display:flex!important;align-items:center;gap:6px;font-weight:500!important;color:var(--txt)!important;font-size:.8rem!important;margin-top:12px!important}
.info{margin-top:12px;padding:8px 10px;background:var(--soft);border-radius:8px;font-size:.76rem;color:var(--sub);line-height:1.6}
.info b{color:var(--txt)}
.btns{display:flex;gap:6px;margin-top:16px;flex-wrap:wrap}
.btns .sv{background:var(--line);color:#fff;border-radius:18px;padding:7px 20px;font-weight:700}
.btns .cx{border:1px solid var(--bd);border-radius:18px;padding:7px 16px;font-weight:600}
.btns .dx{color:#a0504a;font-weight:600;padding:7px 10px}
.btns .rb{color:var(--sub);font-weight:600;padding:7px 10px;font-size:.8rem}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--line);color:#fff;padding:8px 16px;border-radius:18px;font-size:.82rem;z-index:60;opacity:0;pointer-events:none;transition:.2s}
.toast.on{opacity:1}
</style>
</head>
<body>
<div class="top" id="top"></div>
<div class="stats" id="stats"></div>
<div id="rail" class="hide"></div>
<div id="root"></div>
<div id="modal"></div>
<div class="toast" id="toast"></div>

<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
<script>
try { if (window.parent !== window) document.documentElement.classList.add('emb'); } catch (e) { }
/* ================= helpers ================= */
const LS = 'macro_plan_v1', LSUI = 'macro_plan_ui_v1';
const DAY = 864e5;
const p2 = n => String(n).padStart(2, '0');
const pd = s => { const [y, m, d] = s.split('-').map(Number); return Date.UTC(y, m - 1, d) / DAY; };
const fd = n => { const t = new Date(n * DAY); return `${t.getUTCFullYear()}-${p2(t.getUTCMonth() + 1)}-${p2(t.getUTCDate())}`; };
const md = n => { const t = new Date(n * DAY); return `${t.getUTCMonth() + 1}.${t.getUTCDate()}`; };
const TODAY = Math.floor((Date.now() + 9 * 36e5) / DAY);
const uid = () => Math.random().toString(36).slice(2, 9);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const rgba = (h, a) => { const [r, g, b] = [1, 3, 5].map(i => parseInt(h.slice(i, i + 2), 16)); return `rgba(${r},${g},${b},${a})`; };
const $ = s => document.querySelector(s);

/* 대분류(P=피셋, S=2차) 안에서 색조만 살짝 다르게 */
const ROWS = [
  { id: 'P', g: 'P', name: '피셋 전체', grp: true, c: '#6fa58f' },
  { id: 'LL', g: 'P', name: '언어논리', c: '#8fc3a4' },
  { id: 'SP', g: 'P', name: '상황판단', c: '#9ccfd1' },
  { id: 'DA', g: 'P', name: '자료해석', c: '#e6d487' },
  { id: 'S', g: 'S', name: '2차 전체', grp: true, c: '#8fb0e0' },
  { id: 'CO', g: 'S', name: '헌법', c: '#7fa2e0' },
  { id: 'IL', g: 'S', name: '국제법', c: '#b3cdf2' },
  { id: 'IP', g: 'S', name: '국제정치학', c: '#8fc7de' },
];
const ROW = Object.fromEntries(ROWS.map(r => [r.id, r]));
const IMP = { 2: '필수', 1: '보통', 0: '여유' };
const INTEN = [20, 40, 60, 80, 100];
const ZOOMS = [0, 5, 8];   // 0 = 화면 폭에 맞춤
const LW = 112, LH = 36;

/* ================= state ================= */
let S, UI = { v: 'c', z: 0, ghost: true };
let db = null, fbRef = null;

function mkBlock(subj, name, s, e, inten, imp, done, baseShift, seed) {
  const base = baseShift ? [s, fd(pd(e) + baseShift)] : [s, e];
  return { id: uid(), subj, name, s, e, base, inten, imp, done: done || 0, doneAt: done >= 100 ? TODAY : null, log: [], seed: !!seed };
}
function seedState() {
  const phases = [
    { id: uid(), name: '기본 회독', s: '2026-11-24', e: '2027-02-28', pit: 40 },
    { id: uid(), name: '문제풀이', s: '2027-03-01', e: '2027-04-30', pit: 60 },
    { id: uid(), name: '피셋 집중', s: '2027-05-01', e: '2027-06-15', pit: 80 },
    { id: uid(), name: '피셋 직전', s: '2027-06-16', e: '2027-07-10', pit: 100 },
    { id: uid(), name: '2차 집중', s: '2027-07-11', e: '2027-08-31', pit: 0 },
    { id: uid(), name: '2차 직전', s: '2027-09-01', e: '2027-09-11', pit: 0 },
  ];
  const blocks = [
    mkBlock('LL', '기본서 1회독', '2026-11-24', '2027-01-31', 40, 1, 60, 0, 1),
    mkBlock('SP', '기본서·유형 정리', '2026-12-01', '2027-02-28', 40, 2, 30, -14, 1),
    mkBlock('DA', '기본 공식·유형', '2027-01-04', '2027-02-28', 40, 1, 0, 0, 1),
    mkBlock('CO', '기본서 1회독', '2026-11-24', '2027-01-17', 60, 2, 60, 7, 1),
    mkBlock('IL', '기본서 1회독', '2027-01-18', '2027-03-14', 60, 2, 0, 0, 1),
    mkBlock('IP', '기본서 1회독', '2027-03-15', '2027-04-30', 40, 1, 0, 0, 1),
    mkBlock('P', '기출 1회전', '2027-03-01', '2027-04-30', 60, 2, 0, 0, 1),
    mkBlock('P', '실전 모의', '2027-05-01', '2027-06-15', 80, 2, 0, 0, 1),
    mkBlock('P', '최종 마무리', '2027-06-16', '2027-07-10', 100, 2, 0, 0, 1),

    const a = Math.max(0, Math.floor((pd(ph.s) - first) / 7)), z = Math.min(weeks.length - 1, Math.floor((pd(ph.e) - first) / 7));
    if (z < 0 || a > weeks.length - 1 || a > z) return;
    let lane = 0; while (pl.some(q => q.lane === lane && !(z < q.a || a > q.z))) lane++;
    pl.push({ ph, a, z, lane });
  });
  const nl = pl.reduce((m, q) => Math.max(m, q.lane + 1), 0), LW = 22;
  let h = '<div class="cv"><div class="cwr cwdr" style="grid-template-columns:minmax(0,1fr) ' + (nl ? nl * LW + 12 : 0) + 'px 250px;gap:0"><div class="cwd">' + WDE.map(w => `<div>${w}</div>`).join('') + '</div></div><div class="cgrid" style="grid-template-columns:minmax(0,1fr) ' + (nl ? nl * LW + 12 : 0) + 'px 250px">';
  pl.forEach(q => {
    const g = q.ph.pit >= 100 ? rgba(ROW.P.c, .55) : q.ph.pit <= 0 ? rgba(ROW.S.c, .55) : `linear-gradient(to right, ${rgba(ROW.P.c, .55)} 0 ${q.ph.pit}%, ${rgba(ROW.S.c, .55)} ${q.ph.pit}% 100%)`;
    h += `<div class="pv" data-p="${q.ph.id}" title="${esc(q.ph.name)} ${q.ph.pit}/${100 - q.ph.pit} · ${md(pd(q.ph.s))}–${md(pd(q.ph.e))}" style="grid-column:2;grid-row:${q.a + 1}/span ${q.z - q.a + 1};margin-left:${12 + q.lane * LW}px;width:${LW - 5}px;background:${g}"><span>${esc(q.ph.name)} ${q.ph.pit}/${100 - q.ph.pit}</span></div>`;

function weekRow(ws, ms, me, ep, es) {
  const r0x = range()[0];

  S.blocks.forEach(b => {
    const s = pd(b.s), e = pd(b.e), a = Math.max(s, ws, ms), z = Math.min(e, ws + 6, me);
    if (a <= z) segs.push({ b, c0: a - ws, c1: z - ws, st: s >= a, en: e <= z });
  });
  const ordIdx = id => S.blocks.findIndex(x => x.id === id);
  segs.sort((x, y) => ordIdx(x.b.id) - ordIdx(y.b.id));
  const lanes = [];
  segs.forEach(sg => {
    let i = lanes.findIndex(occ => { for (let c = sg.c0; c <= sg.c1; c++) if (occ[c]) return false; return true; });
    if (i < 0) { i = lanes.length; lanes.push([]); }
    for (let c = sg.c0; c <= sg.c1; c++) lanes[i][c] = 1; sg.l = i;
  });
  const L = lanes.length;
  let bg = '', fg = '', pops = '', tline = '';
  for (let i = 0; i < 7; i++) {
    const d = ws + i;
    if (d < ms || d > me) { bg += '<div class="cd out"></div>'; continue; }
    const dt = new Date(d * DAY), dd = dt.getUTCDate(), mp = '', edge = (new Date((d + 7) * DAY).getUTCMonth() !== dt.getUTCMonth() ? ' gb' : '') + (i < 6 && new Date((d + 1) * DAY).getUTCMonth() !== dt.getUTCMonth() ? ' gr' : '');
    const ph = phaseAt(d);
    const strip = '';
    bg += `<div class="cd${edge}${d === TODAY ? ' today' : ''}" data-d="${d}" ${d === TODAY ? 'id="tdcell"' : ''} style="${strip}"><span class="plus" data-act="qnoted" data-d="${d}">+</span></div>`;
    fg += `<div class="dnum" style="grid-row:1;grid-column:${i + 1}"><span class="${d === TODAY ? 'td' : ''}">${dd === 1 ? `<b class="m1">${EN[dt.getUTCMonth()]}</b> 1` : dd}</span>${d === ep ? '<em class="xm">1차 시험</em>' : d === es ? '<em class="xm">2차 시험</em>' : ''}</div>`;
    S.notes.filter(n => !(n.blk && S.blocks.some(x => x.id === n.blk)) && pd(n.date) === d).forEach((n, k) => { pops += noteFloat(n, i, k); });
  }
  segs.forEach(sg => {

  });
  return `<div class="cwk"><div class="cbg">${bg}</div><div class="cfg" style="grid-template-rows:auto 0 repeat(${L + 1},22px) auto">${fg}</div>${tline}${pops}</div>`;
}

/* ---- 왼쪽 월 이동 바 (눈금자 + 돋보기) ---- */
const RAIL_OFF = 90;
const RAIL = { items: [], ys: [], ws: [], frozen: false, H: 0 };
function monthEls() { return [...document.querySelectorAll('.msec[id^="cm-"]')]; }
function railTop() { return Math.max(0, 132 - window.scrollY); }
function railH() { return Math.max(200, window.innerHeight - railTop() - 8); }
function docTop(el) { return el.getBoundingClientRect().top + window.scrollY; }
function buildItems() {
  RAIL.items = [];
  document.querySelectorAll('.msec[id^="cm-"], .cwk').forEach(m => {
    if (m.classList.contains('msec')) RAIL.items.push({ k: 'm', top: docTop(m), mo: m.dataset.mo, y: m.dataset.y, id: m.id });
    else RAIL.items.push({ k: 'w', top: docTop(m) });
  });
  RAIL.items.sort((p, q) => p.top - q.top || (p.k === 'm' ? -1 : 1));
}
function railOff() {
  const max = Math.max(1, document.documentElement.scrollHeight - window.innerHeight), p = Math.max(0, Math.min(1, window.scrollY / max));
  return RAIL_OFF + (window.innerHeight - RAIL_OFF) * p;
}
function focusF() {
  const it = RAIL.items, y = window.scrollY + railOff();
  if (!it.length) return 0;
  if (y <= it[0].top) return 0;
  for (let i = 0; i < it.length - 1; i++) if (y < it[i + 1].top) return i + (y - it[i].top) / Math.max(1, it[i + 1].top - it[i].top);
  return it.length - 1;
}
function layoutRail(f) {
  const n = RAIL.items.length, H = RAIL.H, ws = [], ys = [];
  let tot = 0;
  for (let i = 0; i < n; i++) { const d = (i - f) / 4.5, w = 1 + 13 * Math.exp(-d * d); ws.push(w); tot += w; }
  let c = 0;
  for (let i = 0; i < n; i++) { ys.push((c + ws[i] / 2) / tot * H); c += ws[i]; }
  RAIL.ws = ws; RAIL.ys = ys;
}
function yAtF(f) {
  const ys = RAIL.ys, i = Math.max(0, Math.min(ys.length - 2, Math.floor(f))), t = Math.max(0, Math.min(1, f - i));
  return ys[i] + t * (ys[i + 1] - ys[i]);
}
function renderRail() {
  const r = $('#rail'); if (!r) return;
  if (UI.v !== 'c' || !monthEls().length) { r.classList.add('hide'); return; }
  r.classList.remove('hide');
  RAIL.H = railH(); r.style.top = railTop() + 'px'; r.style.height = RAIL.H + 'px';

}
function drawRail() {

  const f = focusF(); layoutRail(f);
  const it = RAIL.items; let html = '<div class="rl"></div>', lastY = -99, curMo = null;
  it.forEach((x, i) => { if (x.k === 'm' && x.top - window.scrollY <= railOff()) curMo = i; });
  if (curMo == null) { const f0 = it.findIndex(x => x.k === 'm'); if (f0 >= 0) curMo = f0; }
  const cy = curMo != null ? RAIL.ys[curMo] : -99;
  it.forEach((x, i) => {
    const y = RAIL.ys[i], w = RAIL.ws[i], g = Math.min(1, (w - 1) / 9);
    const len = x.k === 'm' ? 12 + 8 * g : 5 + 5 * g, ty = Math.round(y);
    html += `<div class="tk ${x.k === 'm' ? 'mo' : ''}" style="top:${ty}px;width:${len.toFixed(0)}px"></div>`;
    if (x.k === 'm') {
      const cur = i === curMo, fs = cur ? 18 : 10;
      const show = cur || (Math.abs(y - cy) >= 24 && y - lastY >= 14);
      if (show) { lastY = y; html += `<div class="lb ${cur ? 'on' : ''}" style="top:${ty}px;left:${(10 + len + 6).toFixed(0)}px;font-size:${fs}px">${x.mo === '1' ? "’" + String(x.y).slice(2) + ' ' : ''}${EN[+x.mo - 1]}</div>`; }
    }

(function () {
  const r = $('#rail');
  const seek = ev => {
    const box = r.getBoundingClientRect(), y = Math.max(0, Math.min(box.height, ev.clientY - box.top));
