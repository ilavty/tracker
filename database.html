<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Database</title>
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/Paperlogy/Paperlogy.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/gh/fonts-archive/GmarketSans/GmarketSans.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fcfbfa;--ink:#1b1b1b;--sky:#5aaee0;--brown:#8a6a4f;--gray:#c9c3bd;--line:#ebe5df}
*{box-sizing:border-box;margin:0;padding:0;scrollbar-width:none}
*::-webkit-scrollbar{display:none}
html,body{height:100%;background:var(--bg);color:var(--ink);font-family:'Paperlogy','GmarketSans','Gmarket Sans',sans-serif;overflow:hidden}
.top{height:64px;display:flex;align-items:center;gap:28px;padding:0 28px;border-bottom:1px solid var(--line);background:var(--bg)}
.back{font-family:'Montserrat',sans-serif;font-size:.85rem;font-weight:800;letter-spacing:.2px;color:var(--ink);text-decoration:none;padding:4px 2px;transition:.2s;white-space:nowrap}
.back:hover{color:var(--brown)}
.tabs{display:flex;align-items:baseline;gap:22px;margin:0 auto;overflow-x:auto}
.tab{border:0;background:none;cursor:pointer;font:inherit;font-size:1.02rem;font-weight:700;letter-spacing:-.3px;color:var(--gray);padding:6px 0;transition:color .2s;white-space:nowrap}
.tab:hover{color:#a9a29b}
.tab.on{color:var(--brown)}
.spacer{width:78px;flex:none}
.stage{position:relative;height:calc(100vh - 64px);height:calc(100dvh - 64px)}
.stage iframe{position:absolute;inset:0;width:100%;height:100%;border:0;display:none;background:var(--bg)}
.stage iframe.on{display:block}
@media (max-width:650px){
  .top{gap:12px;padding:0 14px;height:54px}
  .back{font-size:.65rem;letter-spacing:0}
  .tabs{gap:14px}
  .tab{font-size:.82rem}
  .spacer{display:none}
  .stage{height:calc(100vh - 54px);height:calc(100dvh - 54px)}
}
</style>
</head>
<body>
<div class="top">
  <a class="back" href="index.html">← DESK</a>
  <nav class="tabs">
    <button class="tab" data-k="ip">국제정치학</button>
    <button class="tab" data-k="il">국제법</button>
    <button class="tab" data-k="case">판례</button>
    <button class="tab" data-k="psat">PSAT 프린트</button>
  </nav>
  <div class="spacer"></div>
</div>
<div class="stage">
  <iframe data-k="ip" data-src="intlpol_analysis.html" title="국제정치학"></iframe>
  <iframe data-k="il" data-src="intllaw_analysis.html" title="국제법"></iframe>
  <iframe data-k="case" data-src="intllaw_cases.html" title="판례"></iframe>
  <iframe data-k="psat" data-src="psat_print.html" title="PSAT 프린트"></iframe>
</div>
<script>
const KEY='db_last_tab';
function show(k){
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('on',b.dataset.k===k));
  document.querySelectorAll('.stage iframe').forEach(f=>{
    const on=f.dataset.k===k;
    if(on&&!f.getAttribute('src'))f.setAttribute('src',f.dataset.src); // 처음 열 때만 로드, 이후엔 상태 유지
    f.classList.toggle('on',on);
  });
  try{localStorage.setItem(KEY,k)}catch(e){}
}
document.querySelector('.tabs').addEventListener('click',e=>{const b=e.target.closest('.tab');if(b)show(b.dataset.k)});
let last='ip';try{last=localStorage.getItem(KEY)||'ip'}catch(e){}
show(['ip','il','case','psat'].includes(last)?last:'ip');
</script>
</body>
</html>
